<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8fafc" rx="8" />

  <!-- Client Side -->
  <rect x="50" y="50" width="700" height="500" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 4" />
  <text x="60" y="75" font-family="Arial" font-size="14" font-weight="bold" fill="#64748b">CLIENT APPLICATION (SPA / PWA)</text>

  <!-- App Shell -->
  <rect x="80" y="100" width="640" height="420" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
  <text x="340" y="125" font-family="Arial" font-size="16" font-weight="bold" fill="#1e293b">App Shell</text>

  <!-- Navigation -->
  <rect x="100" y="140" width="600" height="40" rx="5" fill="#f1f5f9" stroke="#94a3b8" />
  <text x="120" y="165" font-family="Arial" font-size="14" fill="#475569">Navigation Bar (Search, Profile, Notifications)</text>

  <!-- News Feed Component -->
  <rect x="250" y="190" width="300" height="310" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
  <text x="320" y="215" font-family="Arial" font-size="14" font-weight="bold" fill="#1d4ed8">News Feed Component</text>

  <!-- State Management -->
  <rect x="560" y="190" width="140" height="100" rx="5" fill="#f0fdf4" stroke="#10b981" stroke-width="2" />
  <text x="575" y="215" font-family="Arial" font-size="12" font-weight="bold" fill="#047857">State Store</text>
  <text x="575" y="235" font-family="Arial" font-size="11" fill="#065f46">• Normalized Cache</text>
  <text x="575" y="255" font-family="Arial" font-size="11" fill="#065f46">• Optimistic State</text>
  <text x="575" y="275" font-family="Arial" font-size="11" fill="#065f46">• Pagination State</text>

  <!-- Network / Communication -->
  <rect x="100" y="190" width="140" height="100" rx="5" fill="#fff7ed" stroke="#f59e0b" stroke-width="2" />
  <text x="110" y="215" font-family="Arial" font-size="12" font-weight="bold" fill="#b45309">Network Layer</text>
  <text x="115" y="235" font-family="Arial" font-size="11" fill="#92400e">• API Client (Retry)</text>
  <text x="115" y="255" font-family="Arial" font-size="11" fill="#92400e">• WebSockets / SSE</text>
  <text x="115" y="275" font-family="Arial" font-size="11" fill="#92400e">• Offline Queue</text>

  <!-- Service Worker -->
  <rect x="100" y="420" width="140" height="60" rx="5" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2" />
  <text x="115" y="445" font-family="Arial" font-size="12" font-weight="bold" fill="#6d28d9">Service Worker</text>
  <text x="115" y="465" font-family="Arial" font-size="11" fill="#5b21b6">Asset &amp; Data Cache</text>

  <!-- External Backend -->
  <rect x="50" y="565" width="700" height="30" rx="5" fill="#e2e8f0" stroke="#475569" />
  <text x="320" y="585" font-family="Arial" font-size="14" font-weight="bold" fill="#1e293b">Backend Services / CDN</text>

  <!-- Connections -->
  <path d="M 170 290 L 170 420" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 170 565 L 170 290" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 240 240 L 250 240" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 550 240 L 560 240" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" />
    </marker>
  </defs>
</svg>
