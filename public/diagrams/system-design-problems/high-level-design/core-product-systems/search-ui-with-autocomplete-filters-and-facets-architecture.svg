<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Search UI with autocomplete, filters, and facets architecture">
  <defs>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif; fill: #0f172a; }
      .muted { fill: #334155; }
      .h { font-weight: 700; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 14; }
      .chip { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.2; rx: 10; }
      .line { stroke: #64748b; stroke-width: 1.6; fill: none; }
      .arrow { fill: #64748b; }
      @media (prefers-color-scheme: dark) {
        .t { fill: #e5e7eb; }
        .muted { fill: #cbd5e1; }
        .box { fill: #0b1220; stroke: #334155; }
        .chip { fill: #111827; stroke: #334155; }
        .line { stroke: #94a3b8; }
        .arrow { fill: #94a3b8; }
      }
    </style>
  </defs>

  <text class="t h" x="40" y="54" font-size="22">Search UI: Autocomplete, Search, and Facets</text>
  <text class="t muted" x="40" y="78" font-size="13">Key: debouncing + cancellation + cursor pagination</text>

  <rect class="box" x="40" y="110" width="300" height="360" rx="14"/>
  <text class="t h" x="60" y="140" font-size="16">Client</text>
  <rect class="chip" x="60" y="160" width="260" height="66" rx="10"/>
  <text class="t" x="74" y="186" font-size="13">Query state</text>
  <text class="t muted" x="74" y="206" font-size="12">URL as source of truth</text>

  <rect class="chip" x="60" y="238" width="260" height="78" rx="10"/>
  <text class="t" x="74" y="264" font-size="13">Request policy</text>
  <text class="t muted" x="74" y="284" font-size="12">Debounce, cancel, dedupe</text>
  <text class="t muted" x="74" y="302" font-size="12">Bounded retries + jitter</text>

  <rect class="chip" x="60" y="328" width="260" height="62" rx="10"/>
  <text class="t" x="74" y="354" font-size="13">Local cache</text>
  <text class="t muted" x="74" y="374" font-size="12">Recent queries, short TTL</text>

  <rect class="box" x="390" y="140" width="240" height="160" rx="14"/>
  <text class="t h" x="410" y="170" font-size="15">API Gateway</text>
  <text class="t muted" x="410" y="194" font-size="12">Auth, rate limits</text>
  <text class="t muted" x="410" y="214" font-size="12">Routing + request IDs</text>

  <rect class="box" x="680" y="110" width="240" height="120" rx="14"/>
  <text class="t h" x="700" y="140" font-size="15">Autocomplete</text>
  <text class="t muted" x="700" y="164" font-size="12">Lightweight suggestions</text>
  <text class="t muted" x="700" y="184" font-size="12">Highly cacheable (public)</text>

  <rect class="box" x="680" y="252" width="240" height="140" rx="14"/>
  <text class="t h" x="700" y="282" font-size="15">Search Results</text>
  <text class="t muted" x="700" y="306" font-size="12">Cursor pagination</text>
  <text class="t muted" x="700" y="326" font-size="12">Stable item IDs for dedupe</text>
  <text class="t muted" x="700" y="346" font-size="12">Optional embedded facets</text>

  <rect class="box" x="680" y="412" width="240" height="58" rx="14"/>
  <text class="t h" x="700" y="444" font-size="15">Facet Aggregations</text>

  <path class="line" d="M340 250 L380 250" />
  <polygon class="arrow" points="380,250 372,246 372,254"/>

  <path class="line" d="M630 200 L670 200" />
  <polygon class="arrow" points="670,200 662,196 662,204"/>

  <path class="line" d="M630 310 L670 310" />
  <polygon class="arrow" points="670,310 662,306 662,314"/>

  <path class="line" d="M630 430 L670 430" />
  <polygon class="arrow" points="670,430 662,426 662,434"/>
</svg>

