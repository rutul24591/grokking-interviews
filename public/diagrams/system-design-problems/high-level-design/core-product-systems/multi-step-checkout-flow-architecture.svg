<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Multi-step checkout flow architecture">
  <defs>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif; fill: #0f172a; }
      .muted { fill: #334155; }
      .h { font-weight: 700; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 14; }
      .chip { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.2; rx: 10; }
      .line { stroke: #64748b; stroke-width: 1.6; fill: none; }
      .arrow { fill: #64748b; }
      @media (prefers-color-scheme: dark) {
        .t { fill: #e5e7eb; }
        .muted { fill: #cbd5e1; }
        .box { fill: #0b1220; stroke: #334155; }
        .chip { fill: #111827; stroke: #334155; }
        .line { stroke: #94a3b8; }
        .arrow { fill: #94a3b8; }
      }
    </style>
  </defs>

  <text class="t h" x="40" y="54" font-size="22">Multi-step Checkout: Session + Quote as the Anchor</text>
  <text class="t muted" x="40" y="78" font-size="13">Goal: idempotent transitions, consistent totals, recoverable failures</text>

  <rect class="box" x="40" y="110" width="300" height="360" rx="14"/>
  <text class="t h" x="60" y="140" font-size="16">Client</text>
  <rect class="chip" x="60" y="160" width="260" height="72" rx="10"/>
  <text class="t" x="74" y="186" font-size="13">Checkout state machine</text>
  <text class="t muted" x="74" y="206" font-size="12">Steps: cart, address, shipping, payment</text>
  <text class="t muted" x="74" y="224" font-size="12">Local drafts, validation, a11y focus</text>

  <rect class="chip" x="60" y="244" width="260" height="62" rx="10"/>
  <text class="t" x="74" y="270" font-size="13">Transition policy layer</text>
  <text class="t muted" x="74" y="290" font-size="12">Idempotency keys, backoff+jitter</text>

  <rect class="chip" x="60" y="318" width="260" height="62" rx="10"/>
  <text class="t" x="74" y="344" font-size="13">Session cache</text>
  <text class="t muted" x="74" y="364" font-size="12">Resume after refresh / failure</text>

  <rect class="box" x="390" y="140" width="240" height="160" rx="14"/>
  <text class="t h" x="410" y="170" font-size="15">API Gateway</text>
  <text class="t muted" x="410" y="194" font-size="12">Auth, CSRF protections</text>
  <text class="t muted" x="410" y="214" font-size="12">Rate limits, request IDs</text>
  <text class="t muted" x="410" y="234" font-size="12">Routing by region</text>

  <rect class="box" x="680" y="110" width="240" height="200" rx="14"/>
  <text class="t h" x="700" y="140" font-size="15">Checkout Session Service</text>
  <text class="t muted" x="700" y="164" font-size="12">Validates transitions</text>
  <text class="t muted" x="700" y="184" font-size="12">Returns new session version</text>
  <text class="t muted" x="700" y="204" font-size="12">Produces authoritative quote</text>
  <text class="t muted" x="700" y="224" font-size="12">Conflict responses (price/inventory)</text>

  <rect class="box" x="680" y="332" width="240" height="138" rx="14"/>
  <text class="t h" x="700" y="362" font-size="15">Downstream Services</text>
  <text class="t muted" x="700" y="386" font-size="12">Pricing/Promotions, Inventory</text>
  <text class="t muted" x="700" y="406" font-size="12">Fraud/Risk, Payment orchestrator</text>
  <text class="t muted" x="700" y="426" font-size="12">Order placement</text>

  <path class="line" d="M340 250 L380 250" />
  <polygon class="arrow" points="380,250 372,246 372,254"/>

  <path class="line" d="M630 220 L670 220" />
  <polygon class="arrow" points="670,220 662,216 662,224"/>

  <path class="line" d="M800 310 L800 330" />
  <polygon class="arrow" points="800,330 796,322 804,322"/>

  <text class="t muted" x="354" y="240" font-size="12">Step transitions (idempotent)</text>
</svg>

