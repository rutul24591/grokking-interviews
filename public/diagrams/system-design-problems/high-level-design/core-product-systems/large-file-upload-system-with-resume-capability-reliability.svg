<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Reliability and integrity ladder for resumable uploads">
  <title>Upload Reliability and Integrity Ladder</title>
  <desc>Shows layered protections: idempotency, checksums, bounded retries, server reconciliation, and safe permission scoping.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 14; }
    .ok { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .warn { fill: #2a1608; stroke: #fb923c; }
      .ok { fill: #06232a; stroke: #22d3ee; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="560" />

  <rect class="ok" x="70" y="70" width="520" height="160" />
  <text class="label bold" x="100" y="115">Correctness foundations</text>
  <text class="label small" x="100" y="145">server session is source of truth</text>
  <text class="label small" x="100" y="170">idempotent create + finalize</text>
  <text class="label small" x="100" y="195">resume via reconciliation</text>

  <rect class="warn" x="640" y="70" width="490" height="160" />
  <text class="label bold" x="670" y="115">Integrity protections</text>
  <text class="label small" x="670" y="145">per-part checksums</text>
  <text class="label small" x="670" y="170">server-side verification on finalize</text>
  <text class="label small" x="670" y="195">do not trust local state blindly</text>

  <path class="arrow" d="M590 150 L640 150" />

  <rect class="box" x="70" y="300" width="520" height="180" />
  <text class="label bold" x="100" y="345">Retry safety</text>
  <text class="label small" x="100" y="375">bounded backoff + jitter</text>
  <text class="label small" x="100" y="400">reduce concurrency under throttling</text>
  <text class="label small" x="100" y="425">cancel reliably stops work</text>
  <text class="label small" x="100" y="450">surface offline / retrying states</text>

  <rect class="box" x="640" y="300" width="490" height="180" />
  <text class="label bold" x="670" y="345">Security controls</text>
  <text class="label small" x="670" y="375">scoped signed URLs per part</text>
  <text class="label small" x="670" y="400">time-limited permissions</text>
  <text class="label small" x="670" y="425">quota enforcement server-side</text>
  <text class="label small" x="670" y="450">privacy-aware logging</text>

  <path class="arrow" d="M590 390 L640 390" />
</svg>
