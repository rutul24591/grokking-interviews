<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Experimentation and safety model for personalized homepage module composition">
  <title>Homepage Experimentation Safety</title>
  <desc>Shows experiment assignment in the module plan, safe rendering of unknown modules, and consistent analytics tagging.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .ok { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .ok { fill: #06232a; stroke: #22d3ee; }
      .warn { fill: #2a1608; stroke: #fb923c; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="560" />

  <rect class="ok" x="70" y="70" width="520" height="170" />
  <text class="label bold" x="100" y="115">Plan contains assignment</text>
  <text class="label small" x="100" y="145">variant ids per module</text>
  <text class="label small" x="100" y="170">consistent across devices</text>
  <text class="label small" x="100" y="195">debuggable with one URL/session</text>

  <rect class="warn" x="640" y="70" width="490" height="170" />
  <text class="label bold" x="670" y="115">Render safety</text>
  <text class="label small" x="670" y="145">unknown module → placeholder</text>
  <text class="label small" x="670" y="170">size budgets enforced</text>
  <text class="label small" x="670" y="195">no page-wide crash</text>

  <path class="arrow" d="M590 155 L640 155" />

  <rect class="box" x="70" y="300" width="520" height="180" />
  <text class="label bold" x="100" y="345">Analytics tagging</text>
  <text class="label small" x="100" y="375">module render latency per variant</text>
  <text class="label small" x="100" y="400">engagement per module/variant</text>
  <text class="label small" x="100" y="425">errors attributed correctly</text>
  <text class="label small" x="100" y="450">supports fast rollback</text>

  <rect class="box" x="640" y="300" width="490" height="180" />
  <text class="label bold" x="670" y="345">Operational controls</text>
  <text class="label small" x="670" y="375">kill-switch per module</text>
  <text class="label small" x="670" y="400">fallback plan</text>
  <text class="label small" x="670" y="425">bounded retries</text>
  <text class="label small" x="670" y="450">prevents thundering herds</text>

  <path class="arrow" d="M590 390 L640 390" />
</svg>
