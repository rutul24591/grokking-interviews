<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Workflow for multi-device continuity record creation, token share, redemption, and resume">
  <title>Session Continuity Workflow</title>
  <desc>Shows continuity record creation, token sharing, authentication on target device, idempotent redemption, and fetching referenced state.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
    .accent { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .muted { fill: #0b1220; stroke: #64748b; }
      .accent { fill: #06232a; stroke: #22d3ee; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="560" />

  <rect class="box" x="60" y="70" width="330" height="150" />
  <text class="label bold" x="90" y="115">Source device</text>
  <text class="label small" x="90" y="145">create continuity record</text>
  <text class="label small" x="90" y="170">store pointers + summary</text>
  <text class="label small" x="90" y="195">receive short-lived token</text>

  <rect class="accent" x="440" y="70" width="350" height="150" />
  <text class="label bold" x="470" y="115">Share token</text>
  <text class="label small" x="470" y="145">deep link / QR / share sheet</text>
  <text class="label small" x="470" y="170">TTL bounded</text>
  <text class="label small" x="470" y="195">scoped to workflow</text>

  <rect class="box" x="840" y="70" width="300" height="150" />
  <text class="label bold" x="870" y="115">Target device</text>
  <text class="label small" x="870" y="145">authenticate user</text>
  <text class="label small" x="870" y="170">redeem token idempotently</text>
  <text class="label small" x="870" y="195">fetch referenced state</text>

  <path class="arrow" d="M390 145 L440 145" />
  <path class="arrow" d="M790 145 L840 145" />

  <rect class="muted" x="120" y="300" width="420" height="190" />
  <text class="label bold" x="150" y="345">Resume</text>
  <text class="label small" x="150" y="375">apply state safely</text>
  <text class="label small" x="150" y="400">avoid partial application</text>
  <text class="label small" x="150" y="425">resolve conflicts explicitly</text>
  <text class="label small" x="150" y="450">measure time-to-resume</text>

  <rect class="muted" x="600" y="300" width="480" height="190" />
  <text class="label bold" x="630" y="345">Failure handling</text>
  <text class="label small" x="630" y="375">expired token → re-share</text>
  <text class="label small" x="630" y="400">wrong account → safe rejection</text>
  <text class="label small" x="630" y="425">offline → retry later</text>
  <text class="label small" x="630" y="450">missing refs → fallback</text>

  <path class="arrow" d="M990 220 C990 270 820 270 820 300" />
  <path class="arrow" d="M540 395 L600 395" />
</svg>
