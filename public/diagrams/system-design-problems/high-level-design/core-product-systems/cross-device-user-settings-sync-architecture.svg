<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Cross-device user settings sync architecture">
  <defs>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif; fill: #0f172a; }
      .muted { fill: #334155; }
      .h { font-weight: 700; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 14; }
      .chip { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.2; rx: 10; }
      .line { stroke: #64748b; stroke-width: 1.6; fill: none; }
      .arrow { fill: #64748b; }
      @media (prefers-color-scheme: dark) {
        .t { fill: #e5e7eb; }
        .muted { fill: #cbd5e1; }
        .box { fill: #0b1220; stroke: #334155; }
        .chip { fill: #111827; stroke: #334155; }
        .line { stroke: #94a3b8; }
        .arrow { fill: #94a3b8; }
      }
    </style>
  </defs>
  <text class="t h" x="40" y="54" font-size="22">Cross-device Settings Sync: Versioned Document + Push Hints</text>
  <text class="t muted" x="40" y="78" font-size="13">Server validates and merges; devices reconcile by version</text>

  <rect class="box" x="40" y="120" width="300" height="340" rx="14"/>
  <text class="t h" x="60" y="150" font-size="16">Device A / Web</text>
  <rect class="chip" x="60" y="170" width="260" height="70" rx="10"/>
  <text class="t" x="74" y="196" font-size="13">Settings store</text>
  <text class="t muted" x="74" y="216" font-size="12">Local drafts + op IDs</text>

  <rect class="box" x="40" y="300" width="300" height="160" rx="14"/>
  <text class="t h" x="60" y="330" font-size="16">Device B / Mobile</text>
  <text class="t muted" x="60" y="356" font-size="12">Pull on login, push hint when active</text>

  <rect class="box" x="390" y="170" width="240" height="160" rx="14"/>
  <text class="t h" x="410" y="200" font-size="15">Settings Service</text>
  <text class="t muted" x="410" y="224" font-size="12">Schema validate + merge policy</text>
  <text class="t muted" x="410" y="244" font-size="12">Monotonic version</text>
  <text class="t muted" x="410" y="264" font-size="12">Audit sensitive fields</text>

  <rect class="box" x="680" y="170" width="240" height="160" rx="14"/>
  <text class="t h" x="700" y="200" font-size="15">Push Channel (Hints)</text>
  <text class="t muted" x="700" y="224" font-size="12">Notify active devices</text>
  <text class="t muted" x="700" y="244" font-size="12">Payload is version only</text>

  <path class="line" d="M340 205 L380 205" />
  <polygon class="arrow" points="380,205 372,201 372,209"/>
  <path class="line" d="M630 250 L670 250" />
  <polygon class="arrow" points="670,250 662,246 662,254"/>
</svg>

