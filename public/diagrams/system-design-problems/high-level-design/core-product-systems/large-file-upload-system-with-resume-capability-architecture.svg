<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Large file upload with resume architecture">
  <defs>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif; fill: #0f172a; }
      .muted { fill: #334155; }
      .h { font-weight: 700; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 14; }
      .chip { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.2; rx: 10; }
      .line { stroke: #64748b; stroke-width: 1.6; fill: none; }
      .arrow { fill: #64748b; }
      @media (prefers-color-scheme: dark) {
        .t { fill: #e5e7eb; }
        .muted { fill: #cbd5e1; }
        .box { fill: #0b1220; stroke: #334155; }
        .chip { fill: #111827; stroke: #334155; }
        .line { stroke: #94a3b8; }
        .arrow { fill: #94a3b8; }
      }
    </style>
  </defs>

  <text class="t h" x="40" y="54" font-size="22">Resumable Upload: Session + Parts + Finalize</text>
  <text class="t muted" x="40" y="78" font-size="13">Direct-to-storage data path; app server coordinates and validates</text>

  <rect class="box" x="40" y="110" width="300" height="360" rx="14"/>
  <text class="t h" x="60" y="140" font-size="16">Client Upload Manager</text>
  <rect class="chip" x="60" y="160" width="260" height="70" rx="10"/>
  <text class="t" x="74" y="186" font-size="13">Queue + budgets</text>
  <text class="t muted" x="74" y="206" font-size="12">Concurrency, bandwidth, retries</text>

  <rect class="chip" x="60" y="244" width="260" height="78" rx="10"/>
  <text class="t" x="74" y="270" font-size="13">Resumable protocol</text>
  <text class="t muted" x="74" y="290" font-size="12">Chunking + part checksums</text>
  <text class="t muted" x="74" y="308" font-size="12">Resume via part reconciliation</text>

  <rect class="chip" x="60" y="334" width="260" height="60" rx="10"/>
  <text class="t" x="74" y="360" font-size="13">Persisted state</text>
  <text class="t muted" x="74" y="380" font-size="12">Session ID + completed parts</text>

  <rect class="box" x="390" y="140" width="240" height="160" rx="14"/>
  <text class="t h" x="410" y="170" font-size="15">Upload Session Service</text>
  <text class="t muted" x="410" y="194" font-size="12">Creates session, issues signed URLs</text>
  <text class="t muted" x="410" y="214" font-size="12">Lists parts for resume</text>
  <text class="t muted" x="410" y="234" font-size="12">Finalize is idempotent</text>

  <rect class="box" x="680" y="110" width="240" height="160" rx="14"/>
  <text class="t h" x="700" y="140" font-size="15">Object Storage</text>
  <text class="t muted" x="700" y="164" font-size="12">Part uploads (signed URLs)</text>
  <text class="t muted" x="700" y="184" font-size="12">Assembled object after finalize</text>

  <rect class="box" x="680" y="300" width="240" height="170" rx="14"/>
  <text class="t h" x="700" y="330" font-size="15">Processing Pipeline</text>
  <text class="t muted" x="700" y="354" font-size="12">Scanning, transcoding, indexing</text>
  <text class="t muted" x="700" y="374" font-size="12">Status exposed to UI</text>

  <path class="line" d="M340 220 L380 220" />
  <polygon class="arrow" points="380,220 372,216 372,224"/>

  <path class="line" d="M630 200 L670 200" />
  <polygon class="arrow" points="670,200 662,196 662,204"/>

  <path class="line" d="M510 300 L510 360" />
  <path class="line" d="M510 360 L670 360" />
  <polygon class="arrow" points="670,360 662,356 662,364"/>

  <text class="t muted" x="360" y="208" font-size="12">Session create / resume</text>
  <text class="t muted" x="536" y="350" font-size="12">Finalize triggers processing</text>
</svg>

