<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Low latency trading UI architecture">
  <defs>
    <style>
      .t { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif; fill: #0f172a; }
      .muted { fill: #334155; }
      .h { font-weight: 700; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; rx: 14; }
      .chip { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 1.2; rx: 10; }
      .line { stroke: #64748b; stroke-width: 1.6; fill: none; }
      .arrow { fill: #64748b; }
      @media (prefers-color-scheme: dark) {
        .t { fill: #e5e7eb; }
        .muted { fill: #cbd5e1; }
        .box { fill: #0b1220; stroke: #334155; }
        .chip { fill: #111827; stroke: #334155; }
        .line { stroke: #94a3b8; }
        .arrow { fill: #94a3b8; }
      }
    </style>
  </defs>

  <text class="t h" x="40" y="54" font-size="22">Trading UI: Market Data vs Order Execution Paths</text>
  <text class="t muted" x="40" y="78" font-size="13">Snapshot+delta for correctness; idempotent orders for safety</text>

  <rect class="box" x="40" y="110" width="300" height="360" rx="14"/>
  <text class="t h" x="60" y="140" font-size="16">Client</text>
  <rect class="chip" x="60" y="160" width="260" height="70" rx="10"/>
  <text class="t" x="74" y="186" font-size="13">Market data renderer</text>
  <text class="t muted" x="74" y="206" font-size="12">Batching + degraded mode under load</text>

  <rect class="chip" x="60" y="244" width="260" height="76" rx="10"/>
  <text class="t" x="74" y="270" font-size="13">Order entry state machine</text>
  <text class="t muted" x="74" y="290" font-size="12">Local validation, idempotent submit</text>
  <text class="t muted" x="74" y="308" font-size="12">Never infer success without ack</text>

  <rect class="chip" x="60" y="332" width="260" height="62" rx="10"/>
  <text class="t" x="74" y="358" font-size="13">Reconciliation</text>
  <text class="t muted" x="74" y="378" font-size="12">Authoritative snapshot on reconnect</text>

  <rect class="box" x="390" y="140" width="240" height="160" rx="14"/>
  <text class="t h" x="410" y="170" font-size="15">API Gateway</text>
  <text class="t muted" x="410" y="194" font-size="12">Auth, step-up, rate limits</text>
  <text class="t muted" x="410" y="214" font-size="12">Request IDs</text>

  <rect class="box" x="680" y="110" width="240" height="150" rx="14"/>
  <text class="t h" x="700" y="140" font-size="15">Market Data Stream</text>
  <text class="t muted" x="700" y="164" font-size="12">Snapshot + deltas (sequence)</text>
  <text class="t muted" x="700" y="184" font-size="12">Edge relay fanout</text>

  <rect class="box" x="680" y="290" width="240" height="180" rx="14"/>
  <text class="t h" x="700" y="320" font-size="15">Order + Risk Services</text>
  <text class="t muted" x="700" y="344" font-size="12">Authoritative risk checks</text>
  <text class="t muted" x="700" y="364" font-size="12">Idempotent submit and ack</text>
  <text class="t muted" x="700" y="384" font-size="12">Execution updates + snapshots</text>

  <path class="line" d="M340 230 L380 230" />
  <polygon class="arrow" points="380,230 372,226 372,234"/>
  <path class="line" d="M630 200 L670 200" />
  <polygon class="arrow" points="670,200 662,196 662,204"/>
  <path class="line" d="M630 360 L670 360" />
  <polygon class="arrow" points="670,360 662,356 662,364"/>
</svg>

