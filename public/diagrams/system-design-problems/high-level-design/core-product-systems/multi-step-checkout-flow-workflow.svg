<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Workflow for multi-step checkout transitions and order placement">
  <title>Multi-step Checkout Workflow</title>
  <desc>Shows local drafts, step transitions into a Checkout Session, quote versioning, payment intent creation, and final place-order gated by session and quote versions.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
    .accent { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .muted { fill: #0b1220; stroke: #64748b; }
      .accent { fill: #06232a; stroke: #22d3ee; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="560" />

  <rect class="box" x="60" y="70" width="320" height="150" />
  <text class="label bold" x="90" y="115">Step draft (client)</text>
  <text class="label small" x="90" y="145">user edits locally</text>
  <text class="label small" x="90" y="170">validate lightly</text>
  <text class="label small" x="90" y="195">persist draft for refresh</text>

  <rect class="accent" x="440" y="70" width="340" height="150" />
  <text class="label bold" x="470" y="115">Continue (transition)</text>
  <text class="label small" x="470" y="145">op id + session version</text>
  <text class="label small" x="470" y="170">server validates</text>
  <text class="label small" x="470" y="195">returns new session + quote</text>

  <rect class="box" x="840" y="70" width="300" height="150" />
  <text class="label bold" x="870" y="115">Next step UI</text>
  <text class="label small" x="870" y="145">render session state</text>
  <text class="label small" x="870" y="170">display quote version</text>
  <text class="label small" x="870" y="195">advance stepper</text>

  <path class="arrow" d="M380 145 L440 145" />
  <path class="arrow" d="M780 145 L840 145" />

  <rect class="muted" x="120" y="300" width="420" height="190" />
  <text class="label bold" x="150" y="345">Payment step</text>
  <text class="label small" x="150" y="375">create payment intent</text>
  <text class="label small" x="150" y="400">provider UI collects method</text>
  <text class="label small" x="150" y="425">auth may be required (3DS)</text>
  <text class="label small" x="150" y="450">intent status updates</text>

  <rect class="muted" x="600" y="300" width="480" height="190" />
  <text class="label bold" x="630" y="345">Place order (commit)</text>
  <text class="label small" x="630" y="375">requires session version</text>
  <text class="label small" x="630" y="400">requires quote version</text>
  <text class="label small" x="630" y="425">idempotent op id prevents duplicates</text>
  <text class="label small" x="630" y="450">returns order id + confirmation state</text>

  <path class="arrow" d="M990 220 C990 270 820 270 820 300" />
  <path class="arrow" d="M420 395 L600 395" />
  <text class="label small" x="470" y="385">after payment is ready</text>
</svg>
