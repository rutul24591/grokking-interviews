<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Prefetch budget and degraded mode model for reels">
  <title>Prefetch Budget and Degraded Mode</title>
  <desc>Shows capping prepared items, bytes, and decoders; and reducing window and quality under poor network or memory pressure.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .ok { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .ok { fill: #06232a; stroke: #22d3ee; }
      .warn { fill: #2a1608; stroke: #fb923c; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="560" />

  <rect class="ok" x="70" y="70" width="520" height="170" />
  <text class="label bold" x="100" y="115">Normal budgets</text>
  <text class="label small" x="100" y="145">prepared items: 1–3</text>
  <text class="label small" x="100" y="170">bytes capped per session</text>
  <text class="label small" x="100" y="195">decoder concurrency capped</text>

  <rect class="warn" x="640" y="70" width="490" height="170" />
  <text class="label bold" x="670" y="115">Degrade triggers</text>
  <text class="label small" x="670" y="145">poor network / high RTT</text>
  <text class="label small" x="670" y="170">memory pressure</text>
  <text class="label small" x="670" y="195">high skip rate</text>

  <path class="arrow" d="M590 155 L640 155" />

  <rect class="box" x="70" y="300" width="520" height="180" />
  <text class="label bold" x="100" y="345">Degraded behavior</text>
  <text class="label small" x="100" y="375">shrink prefetch window</text>
  <text class="label small" x="100" y="400">lower quality ladder</text>
  <text class="label small" x="100" y="425">disable heavy overlays</text>
  <text class="label small" x="100" y="450">keep swipe responsive</text>

  <rect class="box" x="640" y="300" width="490" height="180" />
  <text class="label bold" x="670" y="345">Safety net</text>
  <text class="label small" x="670" y="375">bounded retries + jitter</text>
  <text class="label small" x="670" y="400">skip on repeated failures</text>
  <text class="label small" x="670" y="425">clear UI state for blocked items</text>
  <text class="label small" x="670" y="450">QoE metrics drive tuning</text>

  <path class="arrow" d="M590 390 L640 390" />
</svg>
