<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Workflow for market data recovery and order submission in a trading UI">
  <title>Trading UI Workflow</title>
  <desc>Shows snapshot+delta market data handling with sequence gaps and idempotent order submission with acknowledgement.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
    .accent { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .muted { fill: #0b1220; stroke: #64748b; }
      .accent { fill: #06232a; stroke: #22d3ee; }
      .warn { fill: #2a1608; stroke: #fb923c; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="560" />

  <rect class="box" x="60" y="70" width="350" height="150" />
  <text class="label bold" x="90" y="115">Instrument selected</text>
  <text class="label small" x="90" y="145">fetch snapshot (seq S)</text>
  <text class="label small" x="90" y="170">subscribe deltas</text>
  <text class="label small" x="90" y="195">apply only contiguous seq</text>

  <rect class="warn" x="460" y="70" width="340" height="150" />
  <text class="label bold" x="490" y="115">Sequence gap</text>
  <text class="label small" x="490" y="145">missing deltas detected</text>
  <text class="label small" x="490" y="170">discard local book</text>
  <text class="label small" x="490" y="195">re-snapshot</text>

  <rect class="accent" x="840" y="70" width="300" height="150" />
  <text class="label bold" x="870" y="115">Order submit</text>
  <text class="label small" x="870" y="145">idempotency id</text>
  <text class="label small" x="870" y="170">server ack / reject</text>
  <text class="label small" x="870" y="195">lifecycle via execution stream</text>

  <path class="arrow" d="M410 145 L460 145" />
  <path class="arrow" d="M800 145 L840 145" />

  <rect class="muted" x="120" y="300" width="420" height="190" />
  <text class="label bold" x="150" y="345">UI batching</text>
  <text class="label small" x="150" y="375">coalesce latest updates</text>
  <text class="label small" x="150" y="400">keep input responsive</text>
  <text class="label small" x="150" y="425">degraded mode on overload</text>
  <text class="label small" x="150" y="450">freshness watermark visible</text>

  <rect class="muted" x="600" y="300" width="480" height="190" />
  <text class="label bold" x="630" y="345">Authoritative order state</text>
  <text class="label small" x="630" y="375">submitted → acknowledged</text>
  <text class="label small" x="630" y="400">fills and cancels streamed</text>
  <text class="label small" x="630" y="425">no false success</text>
  <text class="label small" x="630" y="450">reconcile after reconnect</text>

  <path class="arrow" d="M990 220 C990 270 820 270 820 300" />
  <path class="arrow" d="M540 395 L600 395" />
</svg>
