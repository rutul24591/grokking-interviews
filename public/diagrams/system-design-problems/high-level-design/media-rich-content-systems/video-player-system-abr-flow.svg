<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="480" fill="#f3f1f8"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">ABR Decision Loop &amp; DRM License Flow</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
  </defs>

  <!-- ABR loop left panel -->
  <rect x="20" y="54" width="360" height="410" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="200" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">ABR Decision Loop (per segment)</text>

  <!-- Loop steps -->
  <rect x="100" y="90" width="200" height="34" rx="6" fill="#6d5bd0"/>
  <text x="200" y="112" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">1. Measure bandwidth</text>
  <line x1="200" y1="124" x2="200" y2="140" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="210" y="136" font-size="9" fill="#6d5bd0">EWMA of last 3 seg fetches</text>

  <rect x="100" y="140" width="200" height="34" rx="6" fill="#2f9d74"/>
  <text x="200" y="162" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">2. Check buffer level</text>
  <line x1="200" y1="174" x2="200" y2="190" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="210" y="186" font-size="9" fill="#2f9d74">forward buffer seconds</text>

  <rect x="100" y="190" width="200" height="34" rx="6" fill="#1a1822"/>
  <text x="200" y="208" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">3. Select rendition</text>
  <line x1="200" y1="224" x2="200" y2="240" stroke="#1a1822" stroke-width="2" marker-end="url(#arr)"/>
  <text x="210" y="236" font-size="9" fill="#1a1822">BOLA: max utility given buffer</text>

  <rect x="100" y="240" width="200" height="34" rx="6" fill="#d97843"/>
  <text x="200" y="258" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">4. Fetch segment</text>
  <line x1="200" y1="274" x2="200" y2="290" stroke="#d97843" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="210" y="286" font-size="9" fill="#d97843">CDN edge → decrypt → MSE</text>

  <rect x="100" y="290" width="200" height="34" rx="6" fill="#6d5bd0" opacity="0.7"/>
  <text x="200" y="308" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">5. Append to SourceBuffer</text>
  <line x1="200" y1="324" x2="200" y2="340" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Stall branch -->
  <rect x="35" y="340" width="150" height="34" rx="6" fill="#c0392b" opacity="0.8"/>
  <text x="110" y="358" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Stall detected</text>
  <text x="110" y="370" text-anchor="middle" font-size="9" fill="#fff">drop 1 rendition</text>

  <rect x="215" y="340" width="150" height="34" rx="6" fill="#2f9d74"/>
  <text x="290" y="358" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Segment OK</text>
  <text x="290" y="370" text-anchor="middle" font-size="9" fill="#fff">loop → next seg</text>

  <!-- Loop arrow back -->
  <path d="M 290 374 Q 360 400 360 200 Q 360 90 300 90" fill="none" stroke="#2f9d74" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-g)"/>

  <!-- Buffer health bar -->
  <rect x="35" y="388" width="310" height="60" rx="7" fill="#f3f1f8" stroke="#d7d1e6"/>
  <text x="190" y="406" text-anchor="middle" font-size="9" fill="#6d5bd0" font-weight="bold">Buffer Health Visual</text>
  <rect x="45" y="412" width="290" height="14" rx="4" fill="#d7d1e6"/>
  <rect x="45" y="412" width="200" height="14" rx="4" fill="#2f9d74"/>
  <text x="45" y="440" font-size="9" fill="#1a1822">0s</text>
  <text x="155" y="440" font-size="9" fill="#2f9d74" font-weight="bold">20s buffered</text>
  <text x="310" y="440" font-size="9" fill="#1a1822">30s</text>

  <!-- DRM flow right panel -->
  <rect x="400" y="54" width="480" height="410" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="640" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">DRM License Acquisition &amp; Playback</text>

  <!-- DRM sequence -->
  <text x="450" y="104" text-anchor="middle" font-size="10" fill="#6d5bd0" font-weight="bold">Browser</text>
  <rect x="418" y="108" width="64" height="24" rx="5" fill="#6d5bd0"/>
  <text x="450" y="124" text-anchor="middle" font-size="10" fill="#fff">EME API</text>
  <line x1="450" y1="132" x2="450" y2="420" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="5,4"/>

  <text x="590" y="104" text-anchor="middle" font-size="10" fill="#1a1822" font-weight="bold">CDN</text>
  <rect x="562" y="108" width="56" height="24" rx="5" fill="#1a1822"/>
  <text x="590" y="124" text-anchor="middle" font-size="10" fill="#fff">Edge</text>
  <line x1="590" y1="132" x2="590" y2="420" stroke="#1a1822" stroke-width="1.5" stroke-dasharray="5,4"/>

  <text x="720" y="104" text-anchor="middle" font-size="10" fill="#d97843" font-weight="bold">License Server</text>
  <rect x="678" y="108" width="84" height="24" rx="5" fill="#d97843"/>
  <text x="720" y="124" text-anchor="middle" font-size="10" fill="#fff">Widevine / FP</text>
  <line x1="720" y1="132" x2="720" y2="420" stroke="#d97843" stroke-width="1.5" stroke-dasharray="5,4"/>

  <text x="840" y="104" text-anchor="middle" font-size="10" fill="#2f9d74" font-weight="bold">Auth Service</text>
  <rect x="808" y="108" width="64" height="24" rx="5" fill="#2f9d74"/>
  <text x="840" y="124" text-anchor="middle" font-size="10" fill="#fff">JWT / Token</text>
  <line x1="840" y1="132" x2="840" y2="420" stroke="#2f9d74" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Step 1: fetch manifest -->
  <line x1="450" y1="148" x2="578" y2="148" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="514" y="142" text-anchor="middle" font-size="9" fill="#6d5bd0">GET manifest.m3u8</text>

  <line x1="578" y1="164" x2="462" y2="164" stroke="#2f9d74" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-g)"/>
  <text x="514" y="158" text-anchor="middle" font-size="9" fill="#2f9d74">manifest + key URI</text>

  <!-- Step 2: need key, request license -->
  <rect x="418" y="174" width="64" height="20" rx="4" fill="#6d5bd0" opacity="0.2"/>
  <text x="450" y="188" text-anchor="middle" font-size="9" fill="#6d5bd0">CDM generates</text>
  <text x="450" y="199" text-anchor="middle" font-size="9" fill="#6d5bd0">license request</text>

  <!-- Step 3: get user token first -->
  <line x1="450" y1="208" x2="828" y2="208" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="640" y="202" text-anchor="middle" font-size="9" fill="#6d5bd0">POST /token (userId, videoId)</text>

  <line x1="828" y1="224" x2="462" y2="224" stroke="#2f9d74" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-g)"/>
  <text x="640" y="218" text-anchor="middle" font-size="9" fill="#2f9d74">signed JWT (expires 6h)</text>

  <!-- Step 4: POST license request -->
  <line x1="450" y1="244" x2="708" y2="244" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="579" y="238" text-anchor="middle" font-size="9" fill="#6d5bd0">POST /license (CDM request + JWT)</text>

  <rect x="692" y="252" width="56" height="20" rx="4" fill="#d97843" opacity="0.2"/>
  <text x="720" y="266" text-anchor="middle" font-size="9" fill="#d97843">verify JWT + issue</text>
  <text x="720" y="277" text-anchor="middle" font-size="9" fill="#d97843">decryption key</text>

  <line x1="708" y1="286" x2="462" y2="286" stroke="#d97843" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-o)"/>
  <text x="579" y="280" text-anchor="middle" font-size="9" fill="#d97843">DRM license (content key)</text>

  <!-- Step 5: decrypt + play -->
  <rect x="418" y="294" width="64" height="30" rx="4" fill="#2f9d74" opacity="0.2"/>
  <text x="450" y="308" text-anchor="middle" font-size="9" fill="#2f9d74">CDM decrypts</text>
  <text x="450" y="320" text-anchor="middle" font-size="9" fill="#2f9d74">segments → play</text>

  <!-- License cached note -->
  <rect x="418" y="332" width="380" height="36" rx="6" fill="#2f9d74" opacity="0.08" stroke="#2f9d74" stroke-width="1"/>
  <text x="608" y="348" text-anchor="middle" font-size="9" fill="#2f9d74" font-weight="bold">License cached in CDM for session duration (up to 6h)</text>
  <text x="608" y="362" text-anchor="middle" font-size="9" fill="#1a1822">No license re-fetch per segment — only one license request per play session</text>

  <!-- Widevine levels -->
  <rect x="418" y="376" width="380" height="48" rx="7" fill="#d97843" opacity="0.1" stroke="#d97843" stroke-width="1"/>
  <text x="608" y="394" text-anchor="middle" font-size="9" fill="#d97843" font-weight="bold">Widevine Security Levels</text>
  <text x="424" y="410" font-size="9" fill="#1a1822">L1: hardware TEE (phone/TV) → 4K allowed</text>
  <text x="424" y="422" font-size="9" fill="#1a1822">L3: software CDM (browser) → 1080p max for premium content</text>
</svg>
