<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e18"/>
      <stop offset="100%" stop-color="#0e1520"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a9ef8"/>
      <stop offset="100%" stop-color="#2266c8"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9b7cf4"/>
      <stop offset="100%" stop-color="#6d5bd0"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3dbf8a"/>
      <stop offset="100%" stop-color="#2f9d74"/>
    </linearGradient>
    <filter id="glow-b">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a9ef8"/>
    </marker>
    <marker id="arr-p" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b7cf4"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3dbf8a"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e8924f"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="url(#bg-grad)"/>
  <g opacity="0.04">
    <line x1="0" y1="60" x2="960" y2="60" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="0" y1="120" x2="960" y2="120" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="0" y1="180" x2="960" y2="180" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="0" y1="240" x2="960" y2="240" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="0" y1="300" x2="960" y2="300" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="0" y1="360" x2="960" y2="360" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="0" y1="420" x2="960" y2="420" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="480" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="480" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="480" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="480" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="480" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="480" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="840" y1="0" x2="840" y2="480" stroke="#4a9ef8" stroke-width="1"/>
  </g>

  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#d0e8ff">WebGL Design Tool — Rendering Details &amp; Pan/Zoom/Infinite Canvas</text>
  <text x="480" y="50" text-anchor="middle" font-size="11" fill="#7090c0">Camera transform · Viewport culling · GPU batching · Tessellation · Undo/CRDT</text>

  <!-- LEFT: Camera and pan/zoom -->
  <rect x="16" y="62" width="450" height="290" rx="10" fill="#0e1828" stroke="#4a9ef8" stroke-width="1.5"/>
  <rect x="16" y="62" width="450" height="28" rx="10" fill="#2266c8" opacity="0.25"/>
  <text x="241" y="80" text-anchor="middle" font-size="12" fill="#90c8ff" font-weight="bold">Infinite Canvas — Camera Transform</text>

  <text x="26" y="104" font-size="10" fill="#6090b0" font-weight="bold">Camera State</text>
  <rect x="26" y="110" width="430" height="44" rx="5" fill="#4a9ef8" opacity="0.07" stroke="#4a9ef8" stroke-width="1"/>
  <text x="26" y="124" font-size="9" fill="#90c8ff">  camera = &#123; x: offsetX, y: offsetY, zoom: scale &#125;  // persisted per user per document</text>
  <text x="26" y="138" font-size="9" fill="#90c8ff">  worldToScreen(x, y) = &#123; sx: x * zoom + camera.x, sy: y * zoom + camera.y &#125;</text>
  <text x="26" y="150" font-size="9" fill="#90c8ff">  screenToWorld(sx, sy) = &#123; x: (sx − camera.x) / zoom, y: (sy − camera.y) / zoom &#125;</text>

  <text x="26" y="172" font-size="10" fill="#3dbf8a" font-weight="bold">Pan (pointer drag)</text>
  <rect x="26" y="178" width="430" height="32" rx="5" fill="#3dbf8a" opacity="0.07" stroke="#3dbf8a" stroke-width="1"/>
  <text x="26" y="192" font-size="9" fill="#7dd4b0">  onPointerMove (space+drag): camera.x += dx; camera.y += dy;</text>
  <text x="26" y="206" font-size="9" fill="#7dd4b0">  No scene re-render needed: update camera uniform in GPU shader → transforms apply per-vertex</text>

  <text x="26" y="226" font-size="10" fill="#9b7cf4" font-weight="bold">Zoom (pinch / scroll)</text>
  <rect x="26" y="232" width="430" height="44" rx="5" fill="#9b7cf4" opacity="0.07" stroke="#9b7cf4" stroke-width="1"/>
  <text x="26" y="246" font-size="9" fill="#c0b0ff">  Pivot zoom: zoom around cursor position (zoom at point, not origin)</text>
  <text x="26" y="260" font-size="9" fill="#c0b0ff">  camera.x = cursor.x - (cursor.x - camera.x) * (newZoom / oldZoom)</text>
  <text x="26" y="272" font-size="9" fill="#c0b0ff">  camera.y = cursor.y - (cursor.y - camera.y) * (newZoom / oldZoom)</text>

  <text x="26" y="292" font-size="10" fill="#e8924f" font-weight="bold">Viewport Culling</text>
  <rect x="26" y="298" width="430" height="44" rx="5" fill="#e8924f" opacity="0.07" stroke="#e8924f" stroke-width="1"/>
  <text x="26" y="312" font-size="9" fill="#f0b87e">  viewportBounds (world space) = &#123; x: -camera.x/zoom, y: -camera.y/zoom,</text>
  <text x="26" y="326" font-size="9" fill="#f0b87e">    w: canvasWidth/zoom, h: canvasHeight/zoom &#125;</text>
  <text x="26" y="340" font-size="9" fill="#f0b87e">  Skip nodes whose AABB does not intersect viewportBounds (R-tree query)</text>

  <!-- RIGHT: WebGL batching + tessellation -->
  <rect x="482" y="62" width="462" height="290" rx="10" fill="#0e1828" stroke="#9b7cf4" stroke-width="1.5"/>
  <rect x="482" y="62" width="462" height="28" rx="10" fill="#6d5bd0" opacity="0.25"/>
  <text x="713" y="80" text-anchor="middle" font-size="12" fill="#c0b0ff" font-weight="bold">WebGL Batching &amp; Vector Tessellation</text>

  <text x="492" y="104" font-size="10" fill="#6090b0" font-weight="bold">Geometry Batching</text>
  <rect x="492" y="110" width="442" height="66" rx="5" fill="#4a9ef8" opacity="0.07" stroke="#4a9ef8" stroke-width="1"/>
  <text x="492" y="124" font-size="9" fill="#90c8ff">Problem: 1 draw call per shape = 1000 shapes → 1000 draw calls → GPU starved</text>
  <text x="492" y="138" font-size="9" fill="#90c8ff">Solution: batch same-shader shapes into single VBO (Vertex Buffer Object)</text>
  <text x="492" y="152" font-size="9" fill="#90c8ff">Per vertex: [x, y, r, g, b, a, shapeId] → GPU shader reads fill from uniform array</text>
  <text x="492" y="166" font-size="9" fill="#3dbf8a">1 draw call per batch (grouped by shader) → 10-100x fewer GPU state changes</text>

  <text x="492" y="190" font-size="10" fill="#9b7cf4" font-weight="bold">Bezier Path Tessellation</text>
  <rect x="492" y="196" width="442" height="66" rx="5" fill="#9b7cf4" opacity="0.07" stroke="#9b7cf4" stroke-width="1"/>
  <text x="492" y="210" font-size="9" fill="#c0b0ff">WebGL renders triangles, not curves → Bezier must be tessellated to polyline</text>
  <text x="492" y="224" font-size="9" fill="#c0b0ff">Adaptive subdivision: recursively split Bezier until each segment &lt; 0.5px</text>
  <text x="492" y="238" font-size="9" fill="#c0b0ff">Fill: earcut algorithm (triangulate polygon) → triangle fan</text>
  <text x="492" y="252" font-size="9" fill="#c0b0ff">Stroke: expand polyline by strokeWidth/2 on each side → triangle strip</text>
  <text x="492" y="260" font-size="9" fill="#e8924f">GPU anti-alias: render at 2× then downsample (MSAA) or FXAA shader</text>

  <text x="492" y="284" font-size="10" fill="#3dbf8a" font-weight="bold">Zoom-Dependent Detail</text>
  <rect x="492" y="290" width="442" height="54" rx="5" fill="#3dbf8a" opacity="0.06" stroke="#3dbf8a" stroke-width="1"/>
  <text x="492" y="304" font-size="9" fill="#7dd4b0">Zoom &lt; 0.1 (zoomed far out): render simplified bounding box → avoid sub-pixel detail</text>
  <text x="492" y="318" font-size="9" fill="#7dd4b0">Zoom 0.1–1.0: normal tessellation at medium quality</text>
  <text x="492" y="332" font-size="9" fill="#7dd4b0">Zoom &gt; 1.0 (zoomed in): high-quality tessellation (0.1px threshold)</text>
  <text x="492" y="346" font-size="9" fill="#e8924f">Re-tessellate on zoom change (threshold-based: only if zoom changes by 2×)</text>

  <!-- BOTTOM: Undo CRDT and UX specifics -->
  <rect x="16" y="366" width="928" height="102" rx="10" fill="#0e1828" stroke="#3dbf8a" stroke-width="1.5"/>
  <text x="480" y="386" text-anchor="middle" font-size="12" fill="#7dd4b0" font-weight="bold">Undo/Redo with CRDT · Presence Cursors · Multiplayer Awareness</text>

  <rect x="26" y="396" width="290" height="62" rx="6" fill="#4a9ef8" opacity="0.08" stroke="#4a9ef8" stroke-width="1"/>
  <text x="171" y="412" text-anchor="middle" font-size="10" fill="#90c8ff" font-weight="bold">CRDT Undo Model</text>
  <text x="32" y="428" font-size="9" fill="#6090b0">Y.js UndoManager: tracks local mutations only</text>
  <text x="32" y="441" font-size="9" fill="#6090b0">Ctrl+Z: revert own ops (not collaborators')</text>
  <text x="32" y="454" font-size="9" fill="#3dbf8a">CRDT undo is merge-safe: won't corrupt collab state</text>

  <rect x="330" y="396" width="290" height="62" rx="6" fill="#9b7cf4" opacity="0.08" stroke="#9b7cf4" stroke-width="1"/>
  <text x="475" y="412" text-anchor="middle" font-size="10" fill="#c0b0ff" font-weight="bold">Presence &amp; Remote Cursors</text>
  <text x="336" y="428" font-size="9" fill="#6090b0">Y.js awareness: each client broadcasts cursor position + selection</text>
  <text x="336" y="441" font-size="9" fill="#6090b0">Cursor rendered in world-space → transforms with camera</text>
  <text x="336" y="454" font-size="9" fill="#3dbf8a">User avatar + name label follows cursor · color per user (deterministic hash)</text>

  <rect x="634" y="396" width="300" height="62" rx="6" fill="#e8924f" opacity="0.07" stroke="#e8924f" stroke-width="1"/>
  <text x="784" y="412" text-anchor="middle" font-size="10" fill="#f0b87e" font-weight="bold">Keyboard Shortcuts + UX</text>
  <text x="640" y="428" font-size="9" fill="#6090b0">V=select F=frame R=rect T=text P=pen I=image Ctrl+Z=undo Ctrl+G=group</text>
  <text x="640" y="441" font-size="9" fill="#6090b0">Space+drag=pan  Ctrl+scroll=zoom  Ctrl+0=fit  Ctrl+1=100%  Ctrl+D=duplicate</text>
  <text x="640" y="454" font-size="9" fill="#3dbf8a">Multiplayer follow: click collaborator avatar → camera follows their viewport</text>
</svg>
