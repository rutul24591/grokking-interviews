<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="480" fill="#f3f1f8"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">Operational Transform — Concurrent Edit Resolution</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
  </defs>

  <!-- OT sequence left -->
  <rect x="20" y="54" width="400" height="410" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="220" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">OT: Concurrent Insert Example</text>

  <!-- State labels -->
  <text x="60" y="104" text-anchor="middle" font-size="10" fill="#6d5bd0" font-weight="bold">Alice</text>
  <rect x="30" y="108" width="60" height="22" rx="5" fill="#6d5bd0"/>
  <text x="60" y="123" text-anchor="middle" font-size="10" fill="#fff">client A</text>
  <line x1="60" y1="130" x2="60" y2="430" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="5,4"/>

  <text x="220" y="104" text-anchor="middle" font-size="10" fill="#1a1822" font-weight="bold">Server</text>
  <rect x="190" y="108" width="60" height="22" rx="5" fill="#1a1822"/>
  <text x="220" y="123" text-anchor="middle" font-size="10" fill="#fff">OT engine</text>
  <line x1="220" y1="130" x2="220" y2="430" stroke="#1a1822" stroke-width="1.5" stroke-dasharray="5,4"/>

  <text x="380" y="104" text-anchor="middle" font-size="10" fill="#2f9d74" font-weight="bold">Bob</text>
  <rect x="350" y="108" width="60" height="22" rx="5" fill="#2f9d74"/>
  <text x="380" y="123" text-anchor="middle" font-size="10" fill="#fff">client B</text>
  <line x1="380" y1="130" x2="380" y2="430" stroke="#2f9d74" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Initial state -->
  <rect x="75" y="138" width="290" height="22" rx="4" fill="#d7d1e6" opacity="0.5"/>
  <text x="220" y="153" text-anchor="middle" font-size="9" fill="#1a1822">Base doc: "Hello world" rev=5</text>

  <!-- Alice inserts -->
  <rect x="30" y="170" width="60" height="22" rx="4" fill="#6d5bd0" opacity="0.2"/>
  <text x="60" y="184" text-anchor="middle" font-size="9" fill="#6d5bd0">ins "!" at 11</text>
  <line x1="60" y1="192" x2="208" y2="204" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="134" y="202" text-anchor="middle" font-size="9" fill="#6d5bd0">op_A &#123;ins, 11, "!", rev:5&#125;</text>

  <!-- Bob inserts concurrently -->
  <rect x="350" y="170" width="60" height="22" rx="4" fill="#2f9d74" opacity="0.2"/>
  <text x="380" y="184" text-anchor="middle" font-size="9" fill="#2f9d74">ins "." at 11</text>
  <line x1="380" y1="192" x2="232" y2="216" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="306" y="212" text-anchor="middle" font-size="9" fill="#2f9d74">op_B &#123;ins, 11, ".", rev:5&#125;</text>

  <!-- Server applies A first -->
  <rect x="190" y="228" width="60" height="22" rx="4" fill="#1a1822" opacity="0.2"/>
  <text x="220" y="240" text-anchor="middle" font-size="9" fill="#1a1822">apply op_A → rev:6</text>
  <text x="220" y="253" text-anchor="middle" font-size="9" fill="#1a1822">"Hello world!" </text>

  <!-- Server transforms B -->
  <rect x="190" y="262" width="60" height="22" rx="4" fill="#d97843" opacity="0.2"/>
  <text x="220" y="274" text-anchor="middle" font-size="9" fill="#d97843">transform op_B over op_A</text>
  <text x="220" y="286" text-anchor="middle" font-size="9" fill="#d97843">ins 12 → "." (shifted +1)</text>

  <!-- Server applies B' -->
  <rect x="190" y="296" width="60" height="22" rx="4" fill="#1a1822" opacity="0.2"/>
  <text x="220" y="308" text-anchor="middle" font-size="9" fill="#1a1822">apply op_B' → rev:7</text>
  <text x="220" y="320" text-anchor="middle" font-size="9" fill="#1a1822">"Hello world!." </text>

  <!-- Broadcast to both clients -->
  <line x1="208" y1="332" x2="72" y2="344" stroke="#1a1822" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="134" y="328" text-anchor="middle" font-size="9" fill="#1a1822">op_B' &#123;ins, 12, ".", rev:7&#125;</text>

  <line x1="232" y1="332" x2="368" y2="344" stroke="#1a1822" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
  <text x="306" y="328" text-anchor="middle" font-size="9" fill="#1a1822">op_A &#123;ins, 11, "!", rev:6&#125;</text>

  <!-- Final state -->
  <rect x="75" y="356" width="290" height="22" rx="4" fill="#2f9d74" opacity="0.15" stroke="#2f9d74" stroke-width="1"/>
  <text x="220" y="371" text-anchor="middle" font-size="9" fill="#2f9d74" font-weight="bold">Converged: "Hello world!." rev=7 ✓</text>

  <!-- Remote cursors note -->
  <rect x="30" y="388" width="380" height="40" rx="7" fill="#6d5bd0" opacity="0.08" stroke="#6d5bd0" stroke-width="1"/>
  <text x="220" y="404" text-anchor="middle" font-size="9" fill="#6d5bd0" font-weight="bold">Remote Cursor Rendering</text>
  <text x="35" y="420" font-size="9" fill="#1a1822">Cursor pos broadcast via presence channel (WebSocket) every 100ms</text>

  <!-- Right: Plugin system + extensions -->
  <rect x="440" y="54" width="440" height="410" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="660" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Plugin System &amp; Key Features</text>

  <text x="450" y="100" font-size="11" fill="#6d5bd0" font-weight="bold">Plugin Architecture</text>
  <rect x="450" y="108" width="418" height="54" rx="7" fill="#6d5bd0" opacity="0.08" stroke="#6d5bd0" stroke-width="1"/>
  <text x="454" y="126" font-size="10" fill="#1a1822">Each plugin defines: keymap, input rules, node views, commands</text>
  <text x="454" y="142" font-size="10" fill="#1a1822">Plugins are composable: toolbar = [BoldPlugin, ItalicPlugin, ...]</text>
  <text x="454" y="158" font-size="10" fill="#1a1822">State isolated per plugin via plugin key (no global state)</text>

  <text x="450" y="180" font-size="11" fill="#d97843" font-weight="bold">Slash Command Menu</text>
  <rect x="450" y="188" width="418" height="54" rx="7" fill="#d97843" opacity="0.08" stroke="#d97843" stroke-width="1"/>
  <text x="454" y="206" font-size="10" fill="#1a1822">Trigger: "/" at start of empty block → floating menu appears</text>
  <text x="454" y="222" font-size="10" fill="#1a1822">Commands: /h1 /table /image /code /callout /divider</text>
  <text x="454" y="238" font-size="10" fill="#1a1822">Fuzzy search: "/tab" matches "/table", "/tabs"</text>

  <text x="450" y="260" font-size="11" fill="#2f9d74" font-weight="bold">Image Upload Flow</text>
  <rect x="450" y="268" width="418" height="54" rx="7" fill="#2f9d74" opacity="0.08" stroke="#2f9d74" stroke-width="1"/>
  <text x="454" y="286" font-size="10" fill="#1a1822">Paste / drag-drop → presigned S3 URL (server-issued)</text>
  <text x="454" y="302" font-size="10" fill="#1a1822">Upload progress shown inline as placeholder node</text>
  <text x="454" y="318" font-size="10" fill="#1a1822">On complete: replace placeholder with img node + CDN URL</text>

  <text x="450" y="340" font-size="11" fill="#1a1822" font-weight="bold">Export Formats</text>
  <rect x="450" y="348" width="418" height="40" rx="7" fill="#1a1822" opacity="0.08" stroke="#1a1822" stroke-width="1"/>
  <text x="454" y="366" font-size="10" fill="#1a1822">HTML (serializer → clean semantic markup)</text>
  <text x="454" y="380" font-size="10" fill="#1a1822">Markdown (remark), DOCX (docx.js), PDF (Puppeteer print)</text>

  <text x="450" y="404" font-size="11" fill="#6d5bd0" font-weight="bold">Input Latency Targets</text>
  <text x="450" y="422" font-size="10" fill="#1a1822">Keystroke → DOM update:</text>
  <text x="868" y="422" text-anchor="end" font-size="10" fill="#2f9d74" font-weight="bold">&lt;16ms</text>
  <text x="450" y="438" font-size="10" fill="#1a1822">Op broadcast to server:</text>
  <text x="868" y="438" text-anchor="end" font-size="10" fill="#2f9d74" font-weight="bold">&lt;100ms</text>
  <text x="450" y="454" font-size="10" fill="#1a1822">Remote op applied:</text>
  <text x="868" y="454" text-anchor="end" font-size="10" fill="#d97843" font-weight="bold">&lt;300ms P95</text>
</svg>
