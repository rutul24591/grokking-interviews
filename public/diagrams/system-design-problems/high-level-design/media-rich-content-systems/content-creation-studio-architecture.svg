<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12101e"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9b7cf4"/>
      <stop offset="100%" stop-color="#6d5bd0"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3dbf8a"/>
      <stop offset="100%" stop-color="#2f9d74"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8924f"/>
      <stop offset="100%" stop-color="#d97843"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a9ef8"/>
      <stop offset="100%" stop-color="#2278d4"/>
    </linearGradient>
    <filter id="glow-p">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-g">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b7cf4"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3dbf8a"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e8924f"/>
    </marker>
    <marker id="arr-b" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a9ef8"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="url(#bg-grad)"/>
  <g opacity="0.05">
    <line x1="0" y1="60" x2="960" y2="60" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="120" x2="960" y2="120" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="180" x2="960" y2="180" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="240" x2="960" y2="240" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="300" x2="960" y2="300" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="360" x2="960" y2="360" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="420" x2="960" y2="420" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="480" x2="960" y2="480" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="540" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="540" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="540" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="540" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="540" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="540" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="840" y1="0" x2="840" y2="540" stroke="#9b7cf4" stroke-width="1"/>
  </g>

  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#e8e4ff">Content Creation Studio — Architecture</text>
  <text x="480" y="50" text-anchor="middle" font-size="11" fill="#8b7fcf">Canvas engine · Layer system · Tool pipeline · Image/video editing · Export</text>

  <!-- TOP: Canvas Rendering Engine -->
  <rect x="16" y="62" width="928" height="26" rx="6" fill="#6d5bd0" opacity="0.2"/>
  <text x="480" y="79" text-anchor="middle" font-size="11" fill="#c0b0ff" font-weight="bold" letter-spacing="1">CANVAS RENDERING ENGINE</text>

  <!-- Render loop boxes -->
  <rect x="24" y="96" width="108" height="50" rx="7" fill="url(#purple-grad)" filter="url(#glow-p)"/>
  <text x="78" y="115" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Scene Graph</text>
  <text x="78" y="130" text-anchor="middle" font-size="9" fill="#ddd0ff">layers · objects · z-order</text>

  <line x1="132" y1="121" x2="154" y2="121" stroke="#9b7cf4" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="154" y="96" width="108" height="50" rx="7" fill="#1e1a30" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="208" y="115" text-anchor="middle" font-size="10" fill="#c0b0ff" font-weight="bold">Transform Stack</text>
  <text x="208" y="130" text-anchor="middle" font-size="9" fill="#9985cc">translate · scale · rotate</text>

  <line x1="262" y1="121" x2="284" y2="121" stroke="#9b7cf4" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="284" y="96" width="120" height="50" rx="7" fill="#1e1a30" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="344" y="115" text-anchor="middle" font-size="10" fill="#c0b0ff" font-weight="bold">Dirty-Flag Compositor</text>
  <text x="344" y="130" text-anchor="middle" font-size="9" fill="#9985cc">only re-draw changed regions</text>

  <line x1="404" y1="121" x2="426" y2="121" stroke="#9b7cf4" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="426" y="96" width="110" height="50" rx="7" fill="#1e1a30" stroke="#3dbf8a" stroke-width="1.5"/>
  <text x="481" y="115" text-anchor="middle" font-size="10" fill="#3dbf8a" font-weight="bold">rAF Render Loop</text>
  <text x="481" y="130" text-anchor="middle" font-size="9" fill="#7dd4b0">requestAnimationFrame 60fps</text>

  <line x1="536" y1="121" x2="558" y2="121" stroke="#3dbf8a" stroke-width="2" marker-end="url(#arr-g)"/>

  <rect x="558" y="96" width="110" height="50" rx="7" fill="#1e1a30" stroke="#3dbf8a" stroke-width="1.5"/>
  <text x="613" y="115" text-anchor="middle" font-size="10" fill="#3dbf8a" font-weight="bold">Canvas 2D / WebGL</text>
  <text x="613" y="130" text-anchor="middle" font-size="9" fill="#7dd4b0">GPU-accelerated compositing</text>

  <line x1="668" y1="121" x2="690" y2="121" stroke="#3dbf8a" stroke-width="2" marker-end="url(#arr-g)"/>

  <rect x="690" y="96" width="110" height="50" rx="7" fill="#1e1a30" stroke="#e8924f" stroke-width="1.5"/>
  <text x="745" y="115" text-anchor="middle" font-size="10" fill="#e8924f" font-weight="bold">Hit Testing</text>
  <text x="745" y="130" text-anchor="middle" font-size="9" fill="#f0b87e">pointer-over object detection</text>

  <line x1="800" y1="121" x2="822" y2="121" stroke="#e8924f" stroke-width="2" marker-end="url(#arr-o)"/>

  <rect x="822" y="96" width="118" height="50" rx="7" fill="url(#amber-grad)" filter="url(#glow-g)"/>
  <text x="881" y="115" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Event Dispatch</text>
  <text x="881" y="130" text-anchor="middle" font-size="9" fill="#ffe0c0">tool handlers · keyboard</text>

  <!-- Divider -->
  <line x1="16" y1="162" x2="944" y2="162" stroke="#6d5bd0" stroke-width="1" stroke-dasharray="6,4" opacity="0.35"/>
  <text x="480" y="178" text-anchor="middle" font-size="11" fill="#e8924f" font-weight="bold" letter-spacing="1">LAYER SYSTEM · TOOLS · IMAGE PROCESSING</text>

  <!-- LEFT: Layer System -->
  <rect x="16" y="188" width="290" height="226" rx="10" fill="#1c1535" stroke="#9b7cf4" stroke-width="1.5"/>
  <rect x="16" y="188" width="290" height="28" rx="10" fill="#6d5bd0" opacity="0.28"/>
  <text x="161" y="207" text-anchor="middle" font-size="12" fill="#c0b0ff" font-weight="bold">Layer System</text>

  <!-- Layer stack visual -->
  <rect x="26" y="224" width="270" height="16" rx="3" fill="#3dbf8a" opacity="0.3" stroke="#3dbf8a" stroke-width="1"/>
  <text x="36" y="236" font-size="9" fill="#7dd4b0">Layer 4 — Text / Overlay</text>
  <text x="286" y="236" text-anchor="end" font-size="8" fill="#3dbf8a">👁 🔒</text>

  <rect x="26" y="244" width="270" height="16" rx="3" fill="#9b7cf4" opacity="0.25" stroke="#9b7cf4" stroke-width="1"/>
  <text x="36" y="256" font-size="9" fill="#c0b0ff">Layer 3 — Adjustment (Curves)</text>
  <text x="286" y="256" text-anchor="end" font-size="8" fill="#9b7cf4">👁 🔒</text>

  <rect x="26" y="264" width="270" height="16" rx="3" fill="#e8924f" opacity="0.25" stroke="#e8924f" stroke-width="1"/>
  <text x="36" y="276" font-size="9" fill="#f0b87e">Layer 2 — Image (blend: multiply)</text>
  <text x="286" y="276" text-anchor="end" font-size="8" fill="#e8924f">👁 🔒</text>

  <rect x="26" y="284" width="270" height="16" rx="3" fill="#4a9ef8" opacity="0.2" stroke="#4a9ef8" stroke-width="1"/>
  <text x="36" y="296" font-size="9" fill="#90c8ff">Layer 1 — Background</text>
  <text x="286" y="296" text-anchor="end" font-size="8" fill="#4a9ef8">👁</text>

  <text x="26" y="322" font-size="10" fill="#9985cc" font-weight="bold">Layer Properties</text>
  <rect x="26" y="328" width="270" height="40" rx="5" fill="#6d5bd0" opacity="0.1" stroke="#6d5bd0" stroke-width="1"/>
  <text x="161" y="342" text-anchor="middle" font-size="9" fill="#9985cc">opacity: 0–100% · blend mode: normal|multiply|</text>
  <text x="161" y="354" text-anchor="middle" font-size="9" fill="#9985cc">screen|overlay|color-dodge|luminosity · locked</text>
  <text x="161" y="366" text-anchor="middle" font-size="9" fill="#9985cc">visible · clipping mask · group</text>

  <text x="26" y="388" font-size="10" fill="#3dbf8a" font-weight="bold">Layer Operations</text>
  <rect x="26" y="394" width="270" height="14" rx="4" fill="#3dbf8a" opacity="0.08" stroke="#3dbf8a" stroke-width="1"/>
  <text x="161" y="405" text-anchor="middle" font-size="9" fill="#7dd4b0">merge down · flatten · group · duplicate · reorder drag</text>

  <!-- CENTER: Tool Pipeline -->
  <rect x="322" y="188" width="316" height="226" rx="10" fill="#1c1535" stroke="#e8924f" stroke-width="1.5"/>
  <rect x="322" y="188" width="316" height="28" rx="10" fill="#e8924f" opacity="0.2"/>
  <text x="480" y="207" text-anchor="middle" font-size="12" fill="#f5c080" font-weight="bold">Tool Pipeline</text>

  <!-- Tool grid -->
  <rect x="332" y="222" width="70" height="36" rx="6" fill="#6d5bd0" opacity="0.3" stroke="#9b7cf4" stroke-width="1"/>
  <text x="367" y="238" text-anchor="middle" font-size="9" fill="#c0b0ff" font-weight="bold">Select</text>
  <text x="367" y="250" text-anchor="middle" font-size="8" fill="#9985cc">move · resize</text>

  <rect x="408" y="222" width="70" height="36" rx="6" fill="#3dbf8a" opacity="0.2" stroke="#3dbf8a" stroke-width="1"/>
  <text x="443" y="238" text-anchor="middle" font-size="9" fill="#7dd4b0" font-weight="bold">Brush</text>
  <text x="443" y="250" text-anchor="middle" font-size="8" fill="#7dd4b0">pressure · opacity</text>

  <rect x="484" y="222" width="70" height="36" rx="6" fill="#e8924f" opacity="0.2" stroke="#e8924f" stroke-width="1"/>
  <text x="519" y="238" text-anchor="middle" font-size="9" fill="#f0b87e" font-weight="bold">Pen / Bezier</text>
  <text x="519" y="250" text-anchor="middle" font-size="8" fill="#f0b87e">anchor · handles</text>

  <rect x="560" y="222" width="70" height="36" rx="6" fill="#4a9ef8" opacity="0.2" stroke="#4a9ef8" stroke-width="1"/>
  <text x="595" y="238" text-anchor="middle" font-size="9" fill="#90c8ff" font-weight="bold">Text</text>
  <text x="595" y="250" text-anchor="middle" font-size="8" fill="#90c8ff">typeface · wrap</text>

  <rect x="332" y="264" width="70" height="36" rx="6" fill="#9b7cf4" opacity="0.2" stroke="#9b7cf4" stroke-width="1"/>
  <text x="367" y="280" text-anchor="middle" font-size="9" fill="#c0b0ff" font-weight="bold">Crop</text>
  <text x="367" y="292" text-anchor="middle" font-size="8" fill="#9985cc">ratio lock · free</text>

  <rect x="408" y="264" width="70" height="36" rx="6" fill="#3dbf8a" opacity="0.15" stroke="#3dbf8a" stroke-width="1"/>
  <text x="443" y="280" text-anchor="middle" font-size="9" fill="#7dd4b0" font-weight="bold">Eraser</text>
  <text x="443" y="292" text-anchor="middle" font-size="8" fill="#7dd4b0">pixel · layer</text>

  <rect x="484" y="264" width="70" height="36" rx="6" fill="#e8924f" opacity="0.15" stroke="#e8924f" stroke-width="1"/>
  <text x="519" y="280" text-anchor="middle" font-size="9" fill="#f0b87e" font-weight="bold">Clone Stamp</text>
  <text x="519" y="292" text-anchor="middle" font-size="8" fill="#f0b87e">src sample region</text>

  <rect x="560" y="264" width="70" height="36" rx="6" fill="#4a9ef8" opacity="0.15" stroke="#4a9ef8" stroke-width="1"/>
  <text x="595" y="280" text-anchor="middle" font-size="9" fill="#90c8ff" font-weight="bold">Lasso / Wand</text>
  <text x="595" y="292" text-anchor="middle" font-size="8" fill="#90c8ff">selection modes</text>

  <text x="332" y="318" font-size="10" fill="#e8924f" font-weight="bold">Tool State Machine</text>
  <rect x="332" y="324" width="298" height="52" rx="5" fill="#e8924f" opacity="0.08" stroke="#e8924f" stroke-width="1"/>
  <text x="332" y="338" font-size="9" fill="#9985cc">  idle ──pointerdown──▶ drawing ──pointermove──▶ drawing</text>
  <text x="332" y="352" font-size="9" fill="#9985cc">  drawing ──pointerup──▶ commit (push to history stack)</text>
  <text x="332" y="364" font-size="9" fill="#9985cc">  commit: rasterize stroke to active layer canvas</text>
  <text x="332" y="376" font-size="9" fill="#e8924f">  Ctrl+Z: pop history · undo up to 50 steps</text>

  <!-- RIGHT: Image Adjustments + Export -->
  <rect x="654" y="188" width="290" height="226" rx="10" fill="#1c1535" stroke="#3dbf8a" stroke-width="1.5"/>
  <rect x="654" y="188" width="290" height="28" rx="10" fill="#3dbf8a" opacity="0.18"/>
  <text x="799" y="207" text-anchor="middle" font-size="12" fill="#7dd4b0" font-weight="bold">Image Adjustments &amp; Export</text>

  <text x="664" y="228" font-size="10" fill="#9985cc" font-weight="bold">Non-Destructive Adjustments</text>
  <rect x="664" y="234" width="270" height="66" rx="5" fill="#3dbf8a" opacity="0.08" stroke="#3dbf8a" stroke-width="1"/>
  <text x="664" y="248" font-size="9" fill="#7dd4b0">Brightness / Contrast   Saturation / Hue / Vibrance</text>
  <text x="664" y="262" font-size="9" fill="#7dd4b0">Curves (R G B channel splines)   Levels (black/mid/white point)</text>
  <text x="664" y="276" font-size="9" fill="#7dd4b0">Color Balance (shadows/mids/hilights)   Vignette   Grain</text>
  <text x="664" y="290" font-size="9" fill="#e8924f">Stored as adjustment layers → re-applied each render (non-destructive)</text>

  <text x="664" y="312" font-size="10" fill="#9b7cf4" font-weight="bold">Filters Pipeline</text>
  <rect x="664" y="318" width="270" height="44" rx="5" fill="#6d5bd0" opacity="0.1" stroke="#6d5bd0" stroke-width="1"/>
  <text x="664" y="332" font-size="9" fill="#c0b0ff">Blur · Sharpen · Noise · Emboss · Edge Detect</text>
  <text x="664" y="346" font-size="9" fill="#c0b0ff">CSS filter fallback (fast) vs kernel convolution (quality)</text>
  <text x="664" y="358" font-size="9" fill="#c0b0ff">WebGL fragment shader for GPU-accelerated kernels</text>

  <text x="664" y="380" font-size="10" fill="#e8924f" font-weight="bold">Export Pipeline</text>
  <rect x="664" y="386" width="270" height="20" rx="4" fill="#e8924f" opacity="0.1" stroke="#e8924f" stroke-width="1"/>
  <text x="799" y="400" text-anchor="middle" font-size="9" fill="#f0b87e">PNG · JPEG quality slider · WebP · SVG (vector layers) · PDF</text>

  <!-- BOTTOM: Video editing + Undo history -->
  <line x1="16" y1="428" x2="944" y2="428" stroke="#6d5bd0" stroke-width="1" stroke-dasharray="6,4" opacity="0.35"/>
  <text x="480" y="444" text-anchor="middle" font-size="11" fill="#a994ff" font-weight="bold" letter-spacing="1">VIDEO EDITING · UNDO HISTORY · AUTO-SAVE</text>

  <rect x="16" y="454" width="440" height="76" rx="10" fill="#1c1535" stroke="#4a9ef8" stroke-width="1.5"/>
  <text x="236" y="473" text-anchor="middle" font-size="11" fill="#90c8ff" font-weight="bold">Video Timeline Editor</text>
  <!-- Timeline visual -->
  <rect x="26" y="480" width="8" height="44" rx="2" fill="#9b7cf4"/>
  <text x="30" y="493" font-size="7" fill="#fff" transform="rotate(-90 30 493)">V1</text>
  <rect x="40" y="480" width="380" height="14" rx="3" fill="#6d5bd0" opacity="0.3" stroke="#6d5bd0" stroke-width="1"/>
  <rect x="40" y="480" width="120" height="14" rx="3" fill="#6d5bd0" opacity="0.6"/>
  <text x="100" y="491" text-anchor="middle" font-size="8" fill="#fff">Clip A (0–4s)</text>
  <rect x="162" y="480" width="80" height="14" rx="3" fill="#3dbf8a" opacity="0.6"/>
  <text x="202" y="491" text-anchor="middle" font-size="8" fill="#fff">B (4–7s)</text>
  <rect x="244" y="480" width="100" height="14" rx="3" fill="#e8924f" opacity="0.6"/>
  <text x="294" y="491" text-anchor="middle" font-size="8" fill="#fff">Clip C (7–10s)</text>
  <!-- A/V Track -->
  <rect x="40" y="498" width="380" height="10" rx="2" fill="#9b7cf4" opacity="0.2" stroke="#9b7cf4" stroke-width="1"/>
  <text x="230" y="507" text-anchor="middle" font-size="7" fill="#c0b0ff">Audio waveform</text>
  <!-- Playhead -->
  <line x1="130" y1="476" x2="130" y2="512" stroke="#3dbf8a" stroke-width="2"/>
  <polygon points="126,476 134,476 130,481" fill="#3dbf8a"/>
  <text x="26" y="524" font-size="9" fill="#9985cc">Trim: drag clip edges · Split: click playhead → S · Transition: cross-dissolve / fade · WebCodecs for frame decode</text>

  <rect x="472" y="454" width="472" height="76" rx="10" fill="#1c1535" stroke="#3dbf8a" stroke-width="1.5"/>
  <text x="708" y="473" text-anchor="middle" font-size="11" fill="#7dd4b0" font-weight="bold">Undo / Redo Stack · Auto-Save</text>
  <text x="482" y="492" font-size="9" fill="#9985cc">History stack: up to 50 commands (Command pattern — each command has execute + undo)</text>
  <text x="482" y="506" font-size="9" fill="#9985cc">Commands: PaintCommand (bitmap diff), MoveCommand (delta), FilterCommand (params), LayerCommand (add/remove)</text>
  <text x="482" y="520" font-size="9" fill="#e8924f">Auto-save: debounce 3s → IndexedDB draft (full canvas state as PNG per layer + JSON metadata)</text>
</svg>
