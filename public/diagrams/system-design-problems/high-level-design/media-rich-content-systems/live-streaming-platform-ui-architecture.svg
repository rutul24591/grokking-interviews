<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#100d1e"/>
      <stop offset="100%" stop-color="#0c1825"/>
    </linearGradient>
    <linearGradient id="red-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f05060"/>
      <stop offset="100%" stop-color="#c03040"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9b7cf4"/>
      <stop offset="100%" stop-color="#6d5bd0"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3dbf8a"/>
      <stop offset="100%" stop-color="#2f9d74"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8924f"/>
      <stop offset="100%" stop-color="#d97843"/>
    </linearGradient>
    <filter id="glow-r">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-p">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-g">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b7cf4"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3dbf8a"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f05060"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e8924f"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="url(#bg-grad)"/>
  <g opacity="0.05">
    <line x1="0" y1="60" x2="960" y2="60" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="120" x2="960" y2="120" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="180" x2="960" y2="180" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="240" x2="960" y2="240" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="300" x2="960" y2="300" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="360" x2="960" y2="360" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="420" x2="960" y2="420" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="480" x2="960" y2="480" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="540" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="540" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="540" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="540" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="540" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="540" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="840" y1="0" x2="840" y2="540" stroke="#9b7cf4" stroke-width="1"/>
  </g>

  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffe4e8">Live Streaming Platform UI — Architecture</text>
  <text x="480" y="50" text-anchor="middle" font-size="11" fill="#c08090">RTMP/WebRTC ingest · LL-HLS · Chat overlay · Viewer count · ABR adaptive streaming</text>

  <!-- TOP BANNER: Ingest Pipeline -->
  <rect x="16" y="62" width="928" height="26" rx="6" fill="#c03040" opacity="0.2"/>
  <text x="480" y="79" text-anchor="middle" font-size="11" fill="#f08090" font-weight="bold" letter-spacing="1">INGEST PIPELINE (broadcaster → edge → viewers)</text>

  <!-- Ingest steps -->
  <rect x="24" y="96" width="110" height="50" rx="7" fill="url(#red-grad)" filter="url(#glow-r)"/>
  <text x="79" y="115" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Broadcaster</text>
  <text x="79" y="130" text-anchor="middle" font-size="9" fill="#ffe0e0">OBS / Browser / Mobile</text>

  <line x1="134" y1="121" x2="156" y2="121" stroke="#f05060" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="145" y="116" text-anchor="middle" font-size="8" fill="#f08090">RTMP</text>

  <rect x="156" y="96" width="110" height="50" rx="7" fill="#1e1030" stroke="#9b7cf4" stroke-width="1.5"/>
  <text x="211" y="115" text-anchor="middle" font-size="10" fill="#c0b0ff" font-weight="bold">Ingest Server</text>
  <text x="211" y="130" text-anchor="middle" font-size="9" fill="#9985cc">RTMP → HLS transcode</text>

  <line x1="266" y1="121" x2="288" y2="121" stroke="#9b7cf4" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="288" y="96" width="110" height="50" rx="7" fill="#1e1030" stroke="#3dbf8a" stroke-width="1.5"/>
  <text x="343" y="115" text-anchor="middle" font-size="10" fill="#3dbf8a" font-weight="bold">LL-HLS Packager</text>
  <text x="343" y="130" text-anchor="middle" font-size="9" fill="#7dd4b0">2s segments + partial segs</text>

  <line x1="398" y1="121" x2="420" y2="121" stroke="#3dbf8a" stroke-width="2" marker-end="url(#arr-g)"/>

  <rect x="420" y="96" width="110" height="50" rx="7" fill="#1e1030" stroke="#e8924f" stroke-width="1.5"/>
  <text x="475" y="115" text-anchor="middle" font-size="10" fill="#e8924f" font-weight="bold">CDN Edge PoPs</text>
  <text x="475" y="130" text-anchor="middle" font-size="9" fill="#f0b87e">push-to-edge manifest</text>

  <line x1="530" y1="121" x2="552" y2="121" stroke="#e8924f" stroke-width="2" marker-end="url(#arr-o)"/>

  <rect x="552" y="96" width="110" height="50" rx="7" fill="#1e1030" stroke="#9b7cf4" stroke-width="1.5"/>
  <text x="607" y="115" text-anchor="middle" font-size="10" fill="#c0b0ff" font-weight="bold">Player (HLS.js)</text>
  <text x="607" y="130" text-anchor="middle" font-size="9" fill="#9985cc">ABR · MSE · SourceBuffer</text>

  <!-- Also: WebRTC path -->
  <line x1="79" y1="146" x2="79" y2="165" stroke="#f05060" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="79" y1="165" x2="690" y2="165" stroke="#f05060" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="690" y1="165" x2="690" y2="146" stroke="#f05060" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="660" y="96" width="120" height="50" rx="7" fill="#1e1030" stroke="#f05060" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="720" y="115" text-anchor="middle" font-size="10" fill="#f08090" font-weight="bold">WebRTC Path</text>
  <text x="720" y="130" text-anchor="middle" font-size="9" fill="#f08090">&lt;500ms latency</text>
  <text x="390" y="162" text-anchor="middle" font-size="8" fill="#f05060">Ultra-low latency path (WebRTC) for interactive streams</text>

  <line x1="780" y1="121" x2="822" y2="121" stroke="#9b7cf4" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="822" y="96" width="118" height="50" rx="7" fill="url(#purple-grad)" filter="url(#glow-p)"/>
  <text x="881" y="112" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Viewer Browser</text>
  <text x="881" y="126" text-anchor="middle" font-size="9" fill="#ddd0ff">video + chat + reactions</text>

  <!-- Divider -->
  <line x1="16" y1="162" x2="944" y2="162" stroke="#9b7cf4" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>
  <text x="480" y="178" text-anchor="middle" font-size="11" fill="#e8924f" font-weight="bold" letter-spacing="1">VIEWER UI · CHAT · REAL-TIME SYSTEMS</text>

  <!-- LEFT: Player + ABR -->
  <rect x="16" y="188" width="290" height="226" rx="10" fill="#1a1530" stroke="#9b7cf4" stroke-width="1.5"/>
  <rect x="16" y="188" width="290" height="28" rx="10" fill="#6d5bd0" opacity="0.28"/>
  <text x="161" y="207" text-anchor="middle" font-size="12" fill="#c0b0ff" font-weight="bold">Video Player + ABR</text>

  <text x="26" y="228" font-size="10" fill="#9985cc" font-weight="bold">LL-HLS Specifics</text>
  <rect x="26" y="234" width="270" height="44" rx="5" fill="#6d5bd0" opacity="0.1" stroke="#6d5bd0" stroke-width="1"/>
  <text x="161" y="248" text-anchor="middle" font-size="9" fill="#c0b0ff">Full segments: 2s duration (same as standard HLS)</text>
  <text x="161" y="262" text-anchor="middle" font-size="9" fill="#c0b0ff">Partial segments: 200ms "parts" in manifest</text>
  <text x="161" y="274" text-anchor="middle" font-size="9" fill="#c0b0ff">Blocking playlist reload: server holds response until new part</text>

  <text x="26" y="296" font-size="10" fill="#3dbf8a" font-weight="bold">Latency Ladder</text>
  <rect x="26" y="302" width="270" height="56" rx="5" fill="#3dbf8a" opacity="0.07" stroke="#3dbf8a" stroke-width="1"/>
  <text x="36" y="316" font-size="9" fill="#7dd4b0">Standard HLS:     6–30s latency (3 × 2s segments)</text>
  <text x="36" y="330" font-size="9" fill="#7dd4b0">Low-Latency HLS:  1–2s latency (200ms parts)</text>
  <text x="36" y="344" font-size="9" fill="#f08090">WebRTC SFU:       &lt;500ms latency (realtime)</text>
  <text x="36" y="356" font-size="9" fill="#9985cc">Trade-off: LL-HLS = scale; WebRTC = interactivity</text>

  <text x="26" y="378" font-size="10" fill="#e8924f" font-weight="bold">ABR Rendition Ladder</text>
  <rect x="26" y="384" width="270" height="22" rx="4" fill="#e8924f" opacity="0.1" stroke="#e8924f" stroke-width="1"/>
  <text x="161" y="399" text-anchor="middle" font-size="9" fill="#f0b87e">160p 200kbps · 360p 800kbps · 720p 2.5Mbps · 1080p 5Mbps</text>

  <!-- CENTER: Chat system -->
  <rect x="322" y="188" width="316" height="226" rx="10" fill="#1a1530" stroke="#f05060" stroke-width="1.5"/>
  <rect x="322" y="188" width="316" height="28" rx="10" fill="#c03040" opacity="0.22"/>
  <text x="480" y="207" text-anchor="middle" font-size="12" fill="#f08090" font-weight="bold">Chat Overlay System</text>

  <text x="332" y="228" font-size="10" fill="#f08090" font-weight="bold">Architecture</text>
  <rect x="332" y="234" width="296" height="54" rx="5" fill="#f05060" opacity="0.07" stroke="#f05060" stroke-width="1"/>
  <text x="332" y="248" font-size="9" fill="#9985cc">• Client: WebSocket persistent connection per viewer</text>
  <text x="332" y="262" font-size="9" fill="#9985cc">• Server: fan-out broadcast to all connections in stream room</text>
  <text x="332" y="276" font-size="9" fill="#9985cc">• Backend: Redis pub/sub for multi-pod chat delivery</text>

  <text x="332" y="302" font-size="10" fill="#e8924f" font-weight="bold">Rate Limiting + Moderation</text>
  <rect x="332" y="308" width="296" height="44" rx="5" fill="#e8924f" opacity="0.07" stroke="#e8924f" stroke-width="1"/>
  <text x="332" y="322" font-size="9" fill="#9985cc">• Per-user: 1 message/500ms (sliding window, Redis token bucket)</text>
  <text x="332" y="336" font-size="9" fill="#9985cc">• Slow mode: streamer sets min interval (1s–30s) for all viewers</text>
  <text x="332" y="350" font-size="9" fill="#e8924f">• Toxic filter: ML classifier on message content (async, &lt;100ms)</text>

  <text x="332" y="372" font-size="10" fill="#3dbf8a" font-weight="bold">Chat Rendering</text>
  <rect x="332" y="378" width="296" height="28" rx="4" fill="#3dbf8a" opacity="0.07" stroke="#3dbf8a" stroke-width="1"/>
  <text x="480" y="392" text-anchor="middle" font-size="9" fill="#7dd4b0">Virtual list (only DOM nodes for visible messages)</text>
  <text x="480" y="404" text-anchor="middle" font-size="9" fill="#7dd4b0">Auto-scroll pauses when user scrolls up · resumes at bottom</text>

  <!-- RIGHT: Real-time systems -->
  <rect x="654" y="188" width="290" height="226" rx="10" fill="#1a1530" stroke="#3dbf8a" stroke-width="1.5"/>
  <rect x="654" y="188" width="290" height="28" rx="10" fill="#3dbf8a" opacity="0.18"/>
  <text x="799" y="207" text-anchor="middle" font-size="12" fill="#7dd4b0" font-weight="bold">Real-Time Systems</text>

  <text x="664" y="228" font-size="10" fill="#9985cc" font-weight="bold">Viewer Count</text>
  <rect x="664" y="234" width="270" height="44" rx="5" fill="#6d5bd0" opacity="0.1" stroke="#6d5bd0" stroke-width="1"/>
  <text x="664" y="248" font-size="9" fill="#c0b0ff">• Increment: client heartbeat every 30s (WS ping)</text>
  <text x="664" y="262" font-size="9" fill="#c0b0ff">• Decrement: WebSocket disconnect removes viewer</text>
  <text x="664" y="276" font-size="9" fill="#c0b0ff">• Count stored in Redis HLL (HyperLogLog, ~1% error)</text>

  <text x="664" y="298" font-size="10" fill="#3dbf8a" font-weight="bold">Reactions (Floating Emojis)</text>
  <rect x="664" y="304" width="270" height="44" rx="5" fill="#3dbf8a" opacity="0.08" stroke="#3dbf8a" stroke-width="1"/>
  <text x="664" y="318" font-size="9" fill="#7dd4b0">• Emoji reactions broadcast via WebSocket</text>
  <text x="664" y="332" font-size="9" fill="#7dd4b0">• Client batches: 50ms window → render burst animation</text>
  <text x="664" y="346" font-size="9" fill="#7dd4b0">• CSS keyframe: float upward, fade out in 1.5s</text>

  <text x="664" y="368" font-size="10" fill="#e8924f" font-weight="bold">Polls / Predictions</text>
  <rect x="664" y="374" width="270" height="32" rx="4" fill="#e8924f" opacity="0.08" stroke="#e8924f" stroke-width="1"/>
  <text x="664" y="388" font-size="9" fill="#f0b87e">• Live polls: votes aggregated in Redis, results pushed every 500ms</text>
  <text x="664" y="400" font-size="9" fill="#f0b87e">• Streamer UI: create poll → WS broadcast to all viewers</text>

  <!-- BOTTOM: Broadcaster dashboard + buffering -->
  <line x1="16" y1="428" x2="944" y2="428" stroke="#9b7cf4" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>
  <text x="480" y="444" text-anchor="middle" font-size="11" fill="#c0b0ff" font-weight="bold" letter-spacing="1">BROADCASTER DASHBOARD · BUFFERING · CDN STRATEGY</text>

  <rect x="16" y="454" width="440" height="76" rx="10" fill="#1a1530" stroke="#f05060" stroke-width="1.5"/>
  <text x="236" y="472" text-anchor="middle" font-size="11" fill="#f08090" font-weight="bold">Broadcaster Dashboard (Stream Manager UI)</text>
  <text x="26" y="490" font-size="9" fill="#9985cc">Stream key: unique RTMP ingest key per channel (rotate on security event)</text>
  <text x="26" y="503" font-size="9" fill="#9985cc">Live metrics (realtime, WS): viewer count, bitrate, dropped frames %, buffer health, chat rate/min</text>
  <text x="26" y="516" font-size="9" fill="#e8924f">Stream health indicators: green (all good) · amber (&lt;80% keyframes) · red (stream broken or bitrate &lt;500kbps)</text>

  <rect x="472" y="454" width="472" height="76" rx="10" fill="#1a1530" stroke="#3dbf8a" stroke-width="1.5"/>
  <text x="708" y="472" text-anchor="middle" font-size="11" fill="#7dd4b0" font-weight="bold">Buffer Strategy · CDN · DVR Playback</text>
  <text x="482" y="490" font-size="9" fill="#9985cc">Live edge: 1–3 segments behind live (LL-HLS parts allow &lt;2s)  · CDN segment TTL: 30s (live) · manifest TTL: 0.5s (no-cache)</text>
  <text x="482" y="503" font-size="9" fill="#9985cc">DVR (rewind): last 4h of stream stored in S3 · manifest extends backward · viewer can rewind freely</text>
  <text x="482" y="516" font-size="9" fill="#3dbf8a">Multi-CDN failover: primary CDN health check every 5s → fallback URL if error rate &gt;1% in 30s window</text>
</svg>
