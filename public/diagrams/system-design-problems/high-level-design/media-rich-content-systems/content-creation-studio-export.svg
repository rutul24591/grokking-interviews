<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12101e"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9b7cf4"/>
      <stop offset="100%" stop-color="#6d5bd0"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3dbf8a"/>
      <stop offset="100%" stop-color="#2f9d74"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8924f"/>
      <stop offset="100%" stop-color="#d97843"/>
    </linearGradient>
    <filter id="glow-p">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b7cf4"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3dbf8a"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e8924f"/>
    </marker>
  </defs>

  <rect width="960" height="500" fill="url(#bg-grad)"/>
  <g opacity="0.04">
    <line x1="0" y1="60" x2="960" y2="60" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="120" x2="960" y2="120" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="180" x2="960" y2="180" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="240" x2="960" y2="240" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="300" x2="960" y2="300" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="360" x2="960" y2="360" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="420" x2="960" y2="420" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="500" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="500" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="500" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="500" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="500" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="840" y1="0" x2="840" y2="500" stroke="#9b7cf4" stroke-width="1"/>
  </g>

  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#e8e4ff">Content Creation Studio — Export Pipeline &amp; State Model</text>
  <text x="480" y="50" text-anchor="middle" font-size="11" fill="#8b7fcf">Image export · Video render · Project file · Command pattern undo · Asset library</text>

  <!-- LEFT: Export pipeline sequence -->
  <rect x="16" y="62" width="430" height="290" rx="10" fill="#1c1535" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="16" y="62" width="430" height="28" rx="10" fill="#6d5bd0" opacity="0.25"/>
  <text x="231" y="80" text-anchor="middle" font-size="12" fill="#c0b0ff" font-weight="bold">Export Pipeline — Image &amp; Video</text>

  <!-- Image export flow -->
  <text x="26" y="104" font-size="11" fill="#3dbf8a" font-weight="bold">Image Export (client-side, in-browser)</text>
  <rect x="26" y="110" width="410" height="96" rx="6" fill="#3dbf8a" opacity="0.07" stroke="#3dbf8a" stroke-width="1"/>

  <rect x="36" y="120" width="84" height="30" rx="5" fill="#6d5bd0" opacity="0.5"/>
  <text x="78" y="133" text-anchor="middle" font-size="9" fill="#fff">Flatten layers</text>
  <text x="78" y="145" text-anchor="middle" font-size="8" fill="#ddd0ff">composite canvas</text>
  <line x1="120" y1="135" x2="136" y2="135" stroke="#3dbf8a" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="136" y="120" width="84" height="30" rx="5" fill="#3dbf8a" opacity="0.4"/>
  <text x="178" y="133" text-anchor="middle" font-size="9" fill="#fff">canvas.toBlob</text>
  <text x="178" y="145" text-anchor="middle" font-size="8" fill="#e8f5f0">type, quality</text>
  <line x1="220" y1="135" x2="236" y2="135" stroke="#3dbf8a" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="236" y="120" width="84" height="30" rx="5" fill="#e8924f" opacity="0.4"/>
  <text x="278" y="133" text-anchor="middle" font-size="9" fill="#fff">Encode WebP</text>
  <text x="278" y="145" text-anchor="middle" font-size="8" fill="#ffe0c0">ImageEncoder API</text>
  <line x1="320" y1="135" x2="336" y2="135" stroke="#3dbf8a" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="336" y="120" width="90" height="30" rx="5" fill="#3dbf8a" opacity="0.5"/>
  <text x="381" y="133" text-anchor="middle" font-size="9" fill="#fff">Download Blob</text>
  <text x="381" y="145" text-anchor="middle" font-size="8" fill="#e8f5f0">createObjectURL</text>

  <text x="36" y="168" font-size="9" fill="#9985cc">Format presets: PNG (lossless), JPEG (quality 60-95), WebP (quality + alpha), SVG (vector layers only)</text>
  <text x="36" y="182" font-size="9" fill="#9985cc">Resolution: 1× (screen), 2×, 3×, print DPI (300 DPI PNG for print)</text>
  <text x="36" y="196" font-size="9" fill="#9985cc">Color profile: sRGB (web) · Adobe RGB (print) · embedded ICC profile in PNG EXIF</text>

  <!-- Video export flow -->
  <text x="26" y="222" font-size="11" fill="#e8924f" font-weight="bold">Video Export (server-side render)</text>
  <rect x="26" y="228" width="410" height="116" rx="6" fill="#e8924f" opacity="0.06" stroke="#e8924f" stroke-width="1"/>

  <rect x="36" y="238" width="84" height="30" rx="5" fill="#6d5bd0" opacity="0.5"/>
  <text x="78" y="251" text-anchor="middle" font-size="9" fill="#fff">POST /render</text>
  <text x="78" y="263" text-anchor="middle" font-size="8" fill="#ddd0ff">project JSON</text>
  <line x1="120" y1="253" x2="136" y2="253" stroke="#e8924f" stroke-width="1.5" marker-end="url(#arr-o)"/>

  <rect x="136" y="238" width="84" height="30" rx="5" fill="#1e1a30" stroke="#e8924f" stroke-width="1"/>
  <text x="178" y="251" text-anchor="middle" font-size="9" fill="#f0b87e">FFmpeg Worker</text>
  <text x="178" y="263" text-anchor="middle" font-size="8" fill="#f0b87e">per-frame render</text>
  <line x1="220" y1="253" x2="236" y2="253" stroke="#e8924f" stroke-width="1.5" marker-end="url(#arr-o)"/>

  <rect x="236" y="238" width="84" height="30" rx="5" fill="#1e1a30" stroke="#3dbf8a" stroke-width="1"/>
  <text x="278" y="251" text-anchor="middle" font-size="9" fill="#7dd4b0">H.264 / VP9</text>
  <text x="278" y="263" text-anchor="middle" font-size="8" fill="#7dd4b0">mux audio+video</text>
  <line x1="320" y1="253" x2="336" y2="253" stroke="#3dbf8a" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="336" y="238" width="90" height="30" rx="5" fill="#3dbf8a" opacity="0.5"/>
  <text x="381" y="251" text-anchor="middle" font-size="9" fill="#fff">S3 → CDN URL</text>
  <text x="381" y="263" text-anchor="middle" font-size="8" fill="#e8f5f0">SSE progress</text>

  <text x="36" y="290" font-size="9" fill="#9985cc">SSE: progress events render:frame &#123;frame, total&#125; → % bar in UI</text>
  <text x="36" y="304" font-size="9" fill="#9985cc">WebCodecs (browser-side): VideoEncoder API for short clips &lt;60s (avoids server)</text>
  <text x="36" y="318" font-size="9" fill="#9985cc">Render job queued in Redis; worker reports heartbeat every 5s; UI polls if SSE drops</text>
  <text x="36" y="332" font-size="9" fill="#e8924f">Output: MP4 H.264 (web), GIF (short loop), WebM VP9 (web), ProRes (pro export)</text>

  <!-- RIGHT TOP: Command pattern undo -->
  <rect x="462" y="62" width="482" height="170" rx="10" fill="#1c1535" stroke="#e8924f" stroke-width="1.5"/>
  <rect x="462" y="62" width="482" height="28" rx="10" fill="#e8924f" opacity="0.2"/>
  <text x="703" y="80" text-anchor="middle" font-size="12" fill="#f5c080" font-weight="bold">Command Pattern — Undo / Redo History</text>

  <!-- Command stack visual -->
  <rect x="472" y="98" width="200" height="124" rx="6" fill="#1c1a30" stroke="#6d5bd0" stroke-width="1"/>
  <text x="572" y="114" text-anchor="middle" font-size="10" fill="#c0b0ff" font-weight="bold">History Stack (max 50)</text>
  <rect x="480" y="120" width="184" height="18" rx="3" fill="#3dbf8a" opacity="0.4"/>
  <text x="572" y="133" text-anchor="middle" font-size="9" fill="#fff">BrushCommand &#123;layerId, diff&#125; ← current</text>
  <rect x="480" y="142" width="184" height="18" rx="3" fill="#6d5bd0" opacity="0.3"/>
  <text x="572" y="155" text-anchor="middle" font-size="9" fill="#c0b0ff">MoveCommand &#123;id, dx, dy&#125;</text>
  <rect x="480" y="164" width="184" height="18" rx="3" fill="#6d5bd0" opacity="0.2"/>
  <text x="572" y="177" text-anchor="middle" font-size="9" fill="#9985cc">FilterCommand &#123;type, params&#125;</text>
  <rect x="480" y="186" width="184" height="18" rx="3" fill="#6d5bd0" opacity="0.1"/>
  <text x="572" y="199" text-anchor="middle" font-size="9" fill="#6d5bd0">LayerAddCommand &#123;layer&#125;</text>
  <text x="480" y="216" font-size="8" fill="#6d5bd0">... 46 more commands</text>

  <!-- Command interface -->
  <rect x="686" y="98" width="248" height="124" rx="6" fill="#6d5bd0" opacity="0.1" stroke="#6d5bd0" stroke-width="1"/>
  <text x="810" y="114" text-anchor="middle" font-size="10" fill="#c0b0ff" font-weight="bold">Command Interface</text>
  <text x="692" y="130" font-size="9" fill="#9985cc">interface Command &#123;</text>
  <text x="700" y="144" font-size="9" fill="#c0b0ff">execute(): void  // apply change</text>
  <text x="700" y="158" font-size="9" fill="#c0b0ff">undo(): void     // revert change</text>
  <text x="700" y="172" font-size="9" fill="#c0b0ff">description: string</text>
  <text x="692" y="186" font-size="9" fill="#9985cc">&#125;</text>
  <text x="692" y="200" font-size="9" fill="#e8924f">BrushCommand.undo() =&gt;</text>
  <text x="692" y="214" font-size="9" fill="#f0b87e">  restore prior pixel region (ImageData)</text>

  <!-- RIGHT BOTTOM: Asset library + keyboard shortcuts -->
  <rect x="462" y="248" width="482" height="104" rx="10" fill="#1c1535" stroke="#3dbf8a" stroke-width="1.5"/>
  <rect x="462" y="248" width="482" height="28" rx="10" fill="#3dbf8a" opacity="0.18"/>
  <text x="703" y="266" text-anchor="middle" font-size="12" fill="#7dd4b0" font-weight="bold">Asset Library &amp; Keyboard Shortcuts</text>

  <text x="472" y="286" font-size="10" fill="#9985cc" font-weight="bold">Asset Library (images, fonts, shapes, templates):</text>
  <text x="472" y="300" font-size="9" fill="#9985cc">drag asset from panel → drop on canvas → new layer at drop position · paste from clipboard: Ctrl+V → image layer</text>
  <text x="472" y="314" font-size="9" fill="#9985cc">Stock photos: Unsplash API search (100 free/hr) · own uploads: indexed in user library with thumbnail previews</text>
  <text x="472" y="330" font-size="9" fill="#e8924f">Google Fonts: loaded on demand via CSS font-face · local fonts: via Font Access API (Chrome 103+)</text>
  <text x="472" y="344" font-size="9" fill="#c0b0ff">Shortcuts: V=select B=brush P=pen T=text C=crop E=erase Ctrl+Z=undo Ctrl+Shift+Z=redo Ctrl+G=group</text>

  <!-- BOTTOM: Performance + Perf targets -->
  <rect x="16" y="366" width="928" height="122" rx="10" fill="#1c1535" stroke="#9b7cf4" stroke-width="1.5"/>
  <text x="480" y="386" text-anchor="middle" font-size="12" fill="#c0b0ff" font-weight="bold">Project File Format · Performance Targets · Collaboration</text>

  <rect x="26" y="396" width="290" height="82" rx="6" fill="#6d5bd0" opacity="0.1" stroke="#6d5bd0" stroke-width="1"/>
  <text x="171" y="412" text-anchor="middle" font-size="10" fill="#c0b0ff" font-weight="bold">Project File (.studio JSON)</text>
  <text x="32" y="428" font-size="9" fill="#9985cc">canvas: &#123;width, height, dpi&#125;</text>
  <text x="32" y="441" font-size="9" fill="#9985cc">layers: [ &#123;id, type, opacity, blend, visible, data&#125; ]</text>
  <text x="32" y="454" font-size="9" fill="#9985cc">data: base64 PNG per raster layer OR SVG string per vector</text>
  <text x="32" y="467" font-size="9" fill="#9985cc">adjustments: [ &#123;type, params&#125; ] (non-destructive)</text>
  <text x="32" y="480" font-size="9" fill="#e8924f">Saved to IndexedDB draft + synced to server on export</text>

  <rect x="330" y="396" width="290" height="82" rx="6" fill="#3dbf8a" opacity="0.08" stroke="#3dbf8a" stroke-width="1"/>
  <text x="475" y="412" text-anchor="middle" font-size="10" fill="#7dd4b0" font-weight="bold">Performance Targets</text>
  <text x="336" y="428" font-size="9" fill="#3dbf8a">Canvas render frame:   &lt; 16 ms (60fps)</text>
  <text x="336" y="442" font-size="9" fill="#3dbf8a">Brush stroke latency:  &lt; 8 ms (pointer → pixel)</text>
  <text x="336" y="456" font-size="9" fill="#e8924f">Filter preview:        &lt; 200 ms (CSS filter fast path)</text>
  <text x="336" y="470" font-size="9" fill="#9985cc">PNG export 4K image:   &lt; 1.5 s (toBlob async)</text>
  <text x="336" y="484" font-size="9" fill="#9985cc">Undo operation:        &lt; 50 ms (ImageData restore)</text>

  <rect x="634" y="396" width="300" height="82" rx="6" fill="#e8924f" opacity="0.08" stroke="#e8924f" stroke-width="1"/>
  <text x="784" y="412" text-anchor="middle" font-size="10" fill="#f5c080" font-weight="bold">Collaboration (Real-time)</text>
  <text x="640" y="428" font-size="9" fill="#9985cc">Lock: only one user edits at a time (pessimistic lock, 30s TTL)</text>
  <text x="640" y="442" font-size="9" fill="#9985cc">Live cursor: WS presence channel, cursor positions broadcast 100ms</text>
  <text x="640" y="456" font-size="9" fill="#9985cc">Comment pins: async thread comments on canvas regions (async, no locking)</text>
  <text x="640" y="470" font-size="9" fill="#e8924f">Version history: server snapshots on each save (up to 50 versions, 30-day retention)</text>
  <text x="640" y="484" font-size="9" fill="#9985cc">Conflict: last-write-wins on save (pessimistic lock prevents concurrent edits)</text>
</svg>
