<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e1218"/>
      <stop offset="100%" stop-color="#121820"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9b7cf4"/>
      <stop offset="100%" stop-color="#6d5bd0"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3dbf8a"/>
      <stop offset="100%" stop-color="#2f9d74"/>
    </linearGradient>
    <linearGradient id="teal-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38c8d8"/>
      <stop offset="100%" stop-color="#2298a8"/>
    </linearGradient>
    <filter id="glow-t">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-g">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b7cf4"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3dbf8a"/>
    </marker>
    <marker id="arr-t" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38c8d8"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e8924f"/>
    </marker>
  </defs>

  <rect width="960" height="480" fill="url(#bg-grad)"/>
  <g opacity="0.04">
    <line x1="0" y1="60" x2="960" y2="60" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="120" x2="960" y2="120" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="180" x2="960" y2="180" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="240" x2="960" y2="240" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="300" x2="960" y2="300" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="360" x2="960" y2="360" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="420" x2="960" y2="420" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="480" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="480" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="480" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="480" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="480" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="480" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="840" y1="0" x2="840" y2="480" stroke="#9b7cf4" stroke-width="1"/>
  </g>

  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#e8e4ff">Short-Video Editor — Preview Loop, Beat-Sync &amp; State Model</text>
  <text x="480" y="50" text-anchor="middle" font-size="11" fill="#8b7fcf">requestVideoFrameCallback · Web Audio BPM · Scrub · Undo · Format export</text>

  <!-- LEFT: Preview loop and scrub -->
  <rect x="16" y="62" width="450" height="290" rx="10" fill="#181430" stroke="#38c8d8" stroke-width="1.5"/>
  <rect x="16" y="62" width="450" height="28" rx="10" fill="#38c8d8" opacity="0.2"/>
  <text x="241" y="80" text-anchor="middle" font-size="12" fill="#7dd8e0" font-weight="bold">Preview Engine — requestVideoFrameCallback Loop</text>

  <!-- preview loop flow -->
  <text x="26" y="106" font-size="10" fill="#9985cc" font-weight="bold">Frame-Accurate Preview (during playback)</text>
  <rect x="26" y="112" width="430" height="76" rx="6" fill="#38c8d8" opacity="0.07" stroke="#38c8d8" stroke-width="1"/>

  <rect x="36" y="120" width="90" height="26" rx="5" fill="#38c8d8" opacity="0.4"/>
  <text x="81" y="136" text-anchor="middle" font-size="9" fill="#fff">RVFC callback</text>
  <line x1="126" y1="133" x2="146" y2="133" stroke="#38c8d8" stroke-width="1.5" marker-end="url(#arr-t)"/>

  <rect x="146" y="120" width="90" height="26" rx="5" fill="#9b7cf4" opacity="0.5"/>
  <text x="191" y="136" text-anchor="middle" font-size="9" fill="#fff">find active clip</text>
  <line x1="236" y1="133" x2="256" y2="133" stroke="#9b7cf4" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="256" y="120" width="90" height="26" rx="5" fill="#3dbf8a" opacity="0.5"/>
  <text x="301" y="136" text-anchor="middle" font-size="9" fill="#fff">draw frame</text>
  <line x1="346" y1="133" x2="366" y2="133" stroke="#3dbf8a" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="366" y="120" width="82" height="26" rx="5" fill="#e8924f" opacity="0.5"/>
  <text x="407" y="136" text-anchor="middle" font-size="9" fill="#fff">apply effects</text>

  <!-- loop back arrow -->
  <path d="M 448 133 Q 460 133 460 156 Q 460 172 448 172 Q 370 172 300 172 Q 200 172 100 172 Q 80 172 80 160 Q 80 146 80 146" stroke="#38c8d8" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr-t)"/>
  <text x="440" y="164" font-size="7" fill="#38c8d8">loop</text>

  <text x="36" y="192" font-size="9" fill="#9985cc">requestVideoFrameCallback: fires before each new frame is presented (after rAF, before paint)</text>
  <text x="36" y="204" font-size="9" fill="#9985cc">Provides: metadata.mediaTime (current playback time in seconds, frame-accurate)</text>

  <text x="26" y="224" font-size="10" fill="#e8924f" font-weight="bold">Scrub Preview (timeline drag)</text>
  <rect x="26" y="230" width="430" height="54" rx="6" fill="#e8924f" opacity="0.07" stroke="#e8924f" stroke-width="1"/>
  <text x="26" y="244" font-size="9" fill="#9985cc">  User drags timeline → pointerMove event → computeSeekTime(x)</text>
  <text x="26" y="258" font-size="9" fill="#9985cc">  → video.currentTime = seekTime  (HTMLVideoElement fast seek)</text>
  <text x="26" y="272" font-size="9" fill="#9985cc">  → seeked event fires → draw current frame to preview canvas</text>
  <text x="26" y="282" font-size="9" fill="#e8924f">  Throttle: 1 seek per rAF frame (16ms) to avoid seek queue buildup</text>

  <text x="26" y="306" font-size="10" fill="#3dbf8a" font-weight="bold">Thumbnail Strip Generation</text>
  <rect x="26" y="312" width="430" height="28" rx="6" fill="#3dbf8a" opacity="0.07" stroke="#3dbf8a" stroke-width="1"/>
  <text x="241" y="324" text-anchor="middle" font-size="9" fill="#7dd4b0">Web Worker: VideoDecoder seeks 1 frame per 500ms → OffscreenCanvas → thumbnail Blob</text>
  <text x="241" y="336" text-anchor="middle" font-size="9" fill="#7dd4b0">Results stored in Map(frameTime → thumbnailURL) · displayed in timeline strip</text>

  <!-- RIGHT: Beat-sync + state model -->
  <rect x="482" y="62" width="462" height="290" rx="10" fill="#181430" stroke="#9b7cf4" stroke-width="1.5"/>
  <rect x="482" y="62" width="462" height="28" rx="10" fill="#6d5bd0" opacity="0.25"/>
  <text x="713" y="80" text-anchor="middle" font-size="12" fill="#c0b0ff" font-weight="bold">Beat-Sync Cuts &amp; Audio + Project State</text>

  <text x="492" y="104" font-size="10" fill="#38c8d8" font-weight="bold">BPM Detection + Beat-Sync Cuts</text>
  <rect x="492" y="110" width="442" height="76" rx="5" fill="#38c8d8" opacity="0.07" stroke="#38c8d8" stroke-width="1"/>
  <text x="492" y="124" font-size="9" fill="#9985cc">1. Decode audio: AudioContext.decodeAudioData(audioBlob) → AudioBuffer</text>
  <text x="492" y="138" font-size="9" fill="#9985cc">2. BPM detect: onset detection (energy spikes in HF band) → estimate beats per minute</text>
  <text x="492" y="152" font-size="9" fill="#9985cc">3. Beat timestamps: [0.53, 1.06, 1.59, 2.12 ...] seconds (at detected BPM)</text>
  <text x="492" y="166" font-size="9" fill="#3dbf8a">4. Auto-cut mode: insert clip cut at each beat timestamp → cuts sync to music</text>
  <text x="492" y="180" font-size="9" fill="#9985cc">5. Snap: drag clip edge snaps to nearest beat within 50ms (magnetic snap)</text>

  <text x="492" y="204" font-size="10" fill="#9985cc" font-weight="bold">Project State Model</text>
  <rect x="492" y="210" width="442" height="76" rx="5" fill="#6d5bd0" opacity="0.1" stroke="#6d5bd0" stroke-width="1"/>
  <text x="492" y="224" font-size="9" fill="#9985cc">&#123; clips: [ &#123;id, srcUrl, inPoint, outPoint, x, y, w, h, effects: []&#125; ], </text>
  <text x="492" y="238" font-size="9" fill="#9985cc">  audio: [ &#123;id, srcUrl, volume, fadeIn, fadeOut, startAt&#125; ],</text>
  <text x="492" y="252" font-size="9" fill="#9985cc">  overlays: [ &#123;type: text|sticker, content, startSec, endSec, pos&#125; ],</text>
  <text x="492" y="266" font-size="9" fill="#9985cc">  duration: number (total edit duration in seconds)</text>
  <text x="492" y="280" font-size="9" fill="#c0b0ff">  history: Command[] (undo stack, serializable for IndexedDB)</text>

  <text x="492" y="302" font-size="10" fill="#e8924f" font-weight="bold">Undo / Redo — Lightweight for Video</text>
  <rect x="492" y="308" width="442" height="36" rx="5" fill="#e8924f" opacity="0.07" stroke="#e8924f" stroke-width="1"/>
  <text x="492" y="322" font-size="9" fill="#9985cc">Video edits are metadata-only (no pixel data): undo = revert JSON diff</text>
  <text x="492" y="336" font-size="9" fill="#9985cc">Trim: store &#123;prevInPoint, prevOutPoint&#125;; undo = restore prev values · no ImageData snapshots needed</text>

  <!-- BOTTOM: Upload formats + social export -->
  <rect x="16" y="366" width="928" height="102" rx="10" fill="#181430" stroke="#3dbf8a" stroke-width="1.5"/>
  <text x="480" y="386" text-anchor="middle" font-size="12" fill="#7dd4b0" font-weight="bold">Social Platform Export &amp; Upload Pipeline</text>

  <!-- 3 platform boxes -->
  <rect x="26" y="396" width="196" height="62" rx="6" fill="#6d5bd0" opacity="0.1" stroke="#9b7cf4" stroke-width="1"/>
  <text x="124" y="412" text-anchor="middle" font-size="10" fill="#c0b0ff" font-weight="bold">TikTok / Reels</text>
  <text x="32" y="428" font-size="9" fill="#9985cc">Format: 9:16 · H.264 · 1080×1920</text>
  <text x="32" y="441" font-size="9" fill="#9985cc">Max: 60s · 287MB · AAC audio</text>
  <text x="32" y="454" font-size="9" fill="#3dbf8a">Upload: TikTok API OAuth → multipart</text>

  <rect x="232" y="396" width="196" height="62" rx="6" fill="#e8924f" opacity="0.08" stroke="#e8924f" stroke-width="1"/>
  <text x="330" y="412" text-anchor="middle" font-size="10" fill="#f0b87e" font-weight="bold">Instagram</text>
  <text x="238" y="428" font-size="9" fill="#9985cc">Formats: 1:1 · 4:5 · 9:16 (Reels)</text>
  <text x="238" y="441" font-size="9" fill="#9985cc">Max: 60s (feed) · 90s (Reels)</text>
  <text x="238" y="454" font-size="9" fill="#e8924f">Upload: Basic Display API → video</text>

  <rect x="438" y="396" width="196" height="62" rx="6" fill="#3dbf8a" opacity="0.08" stroke="#3dbf8a" stroke-width="1"/>
  <text x="536" y="412" text-anchor="middle" font-size="10" fill="#7dd4b0" font-weight="bold">YouTube Shorts</text>
  <text x="444" y="428" font-size="9" fill="#9985cc">Format: 9:16 · H.264 · up to 60s</text>
  <text x="444" y="441" font-size="9" fill="#9985cc">Max: 256GB or 12h (YouTube max)</text>
  <text x="444" y="454" font-size="9" fill="#3dbf8a">Upload: YouTube Data API v3</text>

  <!-- Performance summary -->
  <rect x="644" y="396" width="292" height="62" rx="6" fill="#38c8d8" opacity="0.07" stroke="#38c8d8" stroke-width="1"/>
  <text x="790" y="412" text-anchor="middle" font-size="10" fill="#7dd8e0" font-weight="bold">In-Browser Export Benchmarks</text>
  <text x="650" y="428" font-size="9" fill="#9985cc">30s clip, 1080p, 30fps, H.264 (hardware): ~8s encode</text>
  <text x="650" y="442" font-size="9" fill="#9985cc">60s clip, 1080p, 30fps, H.264 (hardware): ~18s encode</text>
  <text x="650" y="456" font-size="9" fill="#e8924f">60s clip without HW accel (VP9 software): ~90s encode</text>
</svg>
