<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f3f1f8"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">Rich Text Editor — Document Model &amp; Collaborative Architecture</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
  </defs>

  <!-- Document model top -->
  <rect x="20" y="54" width="860" height="22" rx="6" fill="#6d5bd0" opacity="0.12"/>
  <text x="450" y="69" text-anchor="middle" font-size="11" fill="#6d5bd0" font-weight="bold">DOCUMENT MODEL (immutable tree — ProseMirror / Slate)</text>

  <!-- Node types -->
  <rect x="30" y="88" width="110" height="44" rx="7" fill="#6d5bd0"/>
  <text x="85" y="106" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Document</text>
  <text x="85" y="122" text-anchor="middle" font-size="10" fill="#edeaf5">root node</text>
  <line x1="140" y1="110" x2="172" y2="110" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="172" y="88" width="110" height="44" rx="7" fill="#6d5bd0" opacity="0.8"/>
  <text x="227" y="106" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Block Nodes</text>
  <text x="227" y="122" text-anchor="middle" font-size="10" fill="#edeaf5">p, h1–h6, ul, table</text>
  <line x1="282" y1="110" x2="314" y2="110" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="314" y="88" width="110" height="44" rx="7" fill="#2f9d74"/>
  <text x="369" y="106" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Inline Nodes</text>
  <text x="369" y="122" text-anchor="middle" font-size="10" fill="#e8f5f0">text, link, mention, emoji</text>
  <line x1="424" y1="110" x2="456" y2="110" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="456" y="88" width="110" height="44" rx="7" fill="#1a1822"/>
  <text x="511" y="106" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Marks</text>
  <text x="511" y="122" text-anchor="middle" font-size="10" fill="#d7d1e6">bold, italic, code, link</text>
  <line x1="566" y1="110" x2="598" y2="110" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="598" y="88" width="120" height="44" rx="7" fill="#d97843"/>
  <text x="658" y="106" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Transactions</text>
  <text x="658" y="122" text-anchor="middle" font-size="10" fill="#fff">immutable + rebasing</text>
  <line x1="718" y1="110" x2="750" y2="110" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="750" y="88" width="130" height="44" rx="7" fill="#6d5bd0"/>
  <text x="815" y="106" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">OT / CRDT</text>
  <text x="815" y="122" text-anchor="middle" font-size="10" fill="#edeaf5">conflict-free merge</text>

  <!-- divider -->
  <line x1="20" y1="148" x2="880" y2="148" stroke="#d7d1e6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="450" y="164" text-anchor="middle" font-size="11" fill="#d97843" font-weight="bold">EDITOR COMPONENTS</text>

  <!-- Left: Toolbar + editor -->
  <rect x="20" y="174" width="280" height="330" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="160" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Editor UI</text>

  <rect x="35" y="208" width="250" height="38" rx="7" fill="#6d5bd0"/>
  <text x="160" y="223" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Toolbar / Slash Commands</text>
  <text x="160" y="237" text-anchor="middle" font-size="10" fill="#edeaf5">B I U / headings / /table /image</text>

  <rect x="35" y="254" width="250" height="38" rx="7" fill="#2f9d74"/>
  <text x="160" y="269" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ContentEditable Surface</text>
  <text x="160" y="283" text-anchor="middle" font-size="10" fill="#e8f5f0">DOM sync via decorations</text>

  <rect x="35" y="300" width="250" height="38" rx="7" fill="#1a1822"/>
  <text x="160" y="315" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Selection &amp; Cursor</text>
  <text x="160" y="329" text-anchor="middle" font-size="10" fill="#d7d1e6">AnchorNode + FocusNode</text>

  <rect x="35" y="346" width="250" height="38" rx="7" fill="#d97843"/>
  <text x="160" y="361" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Media Embeds</text>
  <text x="160" y="375" text-anchor="middle" font-size="10" fill="#fff">image upload, video, file attach</text>

  <rect x="35" y="392" width="250" height="38" rx="7" fill="#6d5bd0" opacity="0.6"/>
  <text x="160" y="407" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">@ Mentions</text>
  <text x="160" y="421" text-anchor="middle" font-size="10" fill="#edeaf5">typeahead → user/doc lookup</text>

  <rect x="35" y="438" width="250" height="52" rx="7" fill="#f3f1f8" stroke="#d7d1e6"/>
  <text x="160" y="456" text-anchor="middle" font-size="9" fill="#6d5bd0" font-weight="bold">Input Handling</text>
  <text x="40" y="472" font-size="9" fill="#1a1822">Intercept beforeinput events</text>
  <text x="40" y="486" font-size="9" fill="#1a1822">Apply transactions → update DOM</text>

  <!-- Center: State + Collab -->
  <rect x="320" y="174" width="260" height="330" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="450" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">State &amp; Collaboration</text>

  <rect x="335" y="208" width="230" height="44" rx="7" fill="#6d5bd0"/>
  <text x="450" y="226" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Editor State</text>
  <text x="450" y="240" text-anchor="middle" font-size="10" fill="#edeaf5">doc + selection + history stack</text>

  <rect x="335" y="260" width="230" height="44" rx="7" fill="#2f9d74"/>
  <text x="450" y="278" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Undo/Redo Stack</text>
  <text x="450" y="292" text-anchor="middle" font-size="10" fill="#e8f5f0">transaction history · Ctrl+Z/Y</text>

  <rect x="335" y="312" width="230" height="44" rx="7" fill="#1a1822"/>
  <text x="450" y="330" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">OT/CRDT Engine</text>
  <text x="450" y="344" text-anchor="middle" font-size="10" fill="#d7d1e6">transform concurrent ops</text>

  <rect x="335" y="364" width="230" height="44" rx="7" fill="#d97843"/>
  <text x="450" y="382" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Presence Awareness</text>
  <text x="450" y="396" text-anchor="middle" font-size="10" fill="#fff">remote cursors + user colors</text>

  <rect x="335" y="416" width="230" height="76" rx="7" fill="#f3f1f8" stroke="#d7d1e6"/>
  <text x="450" y="434" text-anchor="middle" font-size="9" fill="#6d5bd0" font-weight="bold">WebSocket Collab Protocol</text>
  <text x="340" y="452" font-size="9" fill="#1a1822">Client → server: &#123;type: op, delta, baseRev&#125;</text>
  <text x="340" y="468" font-size="9" fill="#1a1822">Server → all: &#123;type: op, delta, rev&#125;</text>
  <text x="340" y="484" font-size="9" fill="#1a1822">Client rebases pending ops on recv</text>

  <!-- Right: Storage + Auto-save -->
  <rect x="600" y="174" width="280" height="330" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="740" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Storage &amp; Performance</text>

  <text x="610" y="218" font-size="11" fill="#6d5bd0" font-weight="bold">Auto-save Strategy</text>
  <text x="610" y="236" font-size="10" fill="#1a1822">Debounce 2s after last keystroke</text>
  <text x="610" y="252" font-size="10" fill="#1a1822">Always save on blur / tab close</text>
  <text x="610" y="268" font-size="10" fill="#1a1822">Optimistic local draft in IndexedDB</text>
  <text x="610" y="284" font-size="10" fill="#1a1822">Background sync to server</text>

  <line x1="610" y1="296" x2="868" y2="296" stroke="#d7d1e6"/>
  <text x="610" y="314" font-size="11" fill="#d97843" font-weight="bold">Document Storage</text>
  <text x="610" y="332" font-size="10" fill="#1a1822">Format: JSON (ProseMirror doc)</text>
  <text x="610" y="348" font-size="10" fill="#1a1822">Version history: append-only ops log</text>
  <text x="610" y="364" font-size="10" fill="#1a1822">Snapshot every 100 ops (fast load)</text>
  <text x="610" y="380" font-size="10" fill="#1a1822">Export: HTML, Markdown, DOCX</text>

  <line x1="610" y1="392" x2="868" y2="392" stroke="#d7d1e6"/>
  <text x="610" y="410" font-size="11" fill="#2f9d74" font-weight="bold">Performance</text>
  <text x="610" y="428" font-size="10" fill="#1a1822">Virtual rendering for large docs</text>
  <text x="610" y="444" font-size="10" fill="#1a1822">Decorations: non-doc DOM changes</text>
  <text x="610" y="460" font-size="10" fill="#1a1822">IME: compositionstart guard</text>
  <text x="610" y="476" font-size="10" fill="#1a1822">Spell-check: custom underlines</text>
  <text x="610" y="492" font-size="10" fill="#1a1822">Input latency target: &lt;16ms</text>
</svg>
