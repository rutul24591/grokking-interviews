<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e18"/>
      <stop offset="100%" stop-color="#0e1520"/>
    </linearGradient>
    <linearGradient id="blue-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a9ef8"/>
      <stop offset="100%" stop-color="#2266c8"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9b7cf4"/>
      <stop offset="100%" stop-color="#6d5bd0"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3dbf8a"/>
      <stop offset="100%" stop-color="#2f9d74"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8924f"/>
      <stop offset="100%" stop-color="#d97843"/>
    </linearGradient>
    <filter id="glow-b">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-p">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-g">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a9ef8"/>
    </marker>
    <marker id="arr-p" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b7cf4"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3dbf8a"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e8924f"/>
    </marker>
  </defs>

  <rect width="960" height="540" fill="url(#bg-grad)"/>
  <g opacity="0.05">
    <line x1="0" y1="60" x2="960" y2="60" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="0" y1="120" x2="960" y2="120" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="0" y1="180" x2="960" y2="180" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="0" y1="240" x2="960" y2="240" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="0" y1="300" x2="960" y2="300" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="0" y1="360" x2="960" y2="360" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="0" y1="420" x2="960" y2="420" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="0" y1="480" x2="960" y2="480" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="540" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="540" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="540" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="540" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="540" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="540" stroke="#4a9ef8" stroke-width="1"/>
    <line x1="840" y1="0" x2="840" y2="540" stroke="#4a9ef8" stroke-width="1"/>
  </g>

  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#d0e8ff">Canvas / WebGL Design Tool — Architecture</text>
  <text x="480" y="50" text-anchor="middle" font-size="11" fill="#7090c0">Scene graph · GPU render loop · Bezier tools · Hit testing · CRDT collaboration</text>

  <!-- TOP: Render loop -->
  <rect x="16" y="62" width="928" height="26" rx="6" fill="#2266c8" opacity="0.22"/>
  <text x="480" y="79" text-anchor="middle" font-size="11" fill="#90c8ff" font-weight="bold" letter-spacing="1">GPU RENDER LOOP (WebGL / Canvas 2D)</text>

  <!-- Render pipeline nodes -->
  <rect x="24" y="96" width="108" height="50" rx="7" fill="url(#blue-grad)" filter="url(#glow-b)"/>
  <text x="78" y="114" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Scene Graph</text>
  <text x="78" y="130" text-anchor="middle" font-size="9" fill="#c0e0ff">frame · layer · group · node</text>

  <line x1="132" y1="121" x2="154" y2="121" stroke="#4a9ef8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="154" y="96" width="108" height="50" rx="7" fill="#101828" stroke="#4a9ef8" stroke-width="1.5"/>
  <text x="208" y="114" text-anchor="middle" font-size="10" fill="#90c8ff" font-weight="bold">Culling</text>
  <text x="208" y="130" text-anchor="middle" font-size="9" fill="#6090b0">skip off-viewport nodes</text>

  <line x1="262" y1="121" x2="284" y2="121" stroke="#4a9ef8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="284" y="96" width="120" height="50" rx="7" fill="#101828" stroke="#9b7cf4" stroke-width="1.5"/>
  <text x="344" y="114" text-anchor="middle" font-size="10" fill="#c0b0ff" font-weight="bold">Transform GPU</text>
  <text x="344" y="130" text-anchor="middle" font-size="9" fill="#9985cc">matrix multiply (GPU)</text>

  <line x1="404" y1="121" x2="426" y2="121" stroke="#9b7cf4" stroke-width="2" marker-end="url(#arr-p)"/>

  <rect x="426" y="96" width="120" height="50" rx="7" fill="#101828" stroke="#3dbf8a" stroke-width="1.5"/>
  <text x="486" y="114" text-anchor="middle" font-size="10" fill="#3dbf8a" font-weight="bold">Batch Draw Calls</text>
  <text x="486" y="130" text-anchor="middle" font-size="9" fill="#7dd4b0">geometry buffers GPU</text>

  <line x1="546" y1="121" x2="568" y2="121" stroke="#3dbf8a" stroke-width="2" marker-end="url(#arr-g)"/>

  <rect x="568" y="96" width="120" height="50" rx="7" fill="#101828" stroke="#3dbf8a" stroke-width="1.5"/>
  <text x="628" y="114" text-anchor="middle" font-size="10" fill="#3dbf8a" font-weight="bold">Fragment Shader</text>
  <text x="628" y="130" text-anchor="middle" font-size="9" fill="#7dd4b0">fill · stroke · effects</text>

  <line x1="688" y1="121" x2="710" y2="121" stroke="#3dbf8a" stroke-width="2" marker-end="url(#arr-g)"/>

  <rect x="710" y="96" width="120" height="50" rx="7" fill="#101828" stroke="#e8924f" stroke-width="1.5"/>
  <text x="770" y="114" text-anchor="middle" font-size="10" fill="#e8924f" font-weight="bold">Selection Overlay</text>
  <text x="770" y="130" text-anchor="middle" font-size="9" fill="#f0b87e">handles · guides · snap</text>

  <line x1="830" y1="121" x2="852" y2="121" stroke="#4a9ef8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="852" y="96" width="92" height="50" rx="7" fill="url(#green-grad)" filter="url(#glow-g)"/>
  <text x="898" y="114" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Display</text>
  <text x="898" y="130" text-anchor="middle" font-size="9" fill="#c5f0de">swap buffers</text>

  <!-- Divider -->
  <line x1="16" y1="162" x2="944" y2="162" stroke="#4a9ef8" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>
  <text x="480" y="178" text-anchor="middle" font-size="11" fill="#e8924f" font-weight="bold" letter-spacing="1">SCENE GRAPH · TOOLS · HIT TESTING · COLLABORATION</text>

  <!-- LEFT: Scene graph -->
  <rect x="16" y="188" width="290" height="226" rx="10" fill="#0e1828" stroke="#4a9ef8" stroke-width="1.5"/>
  <rect x="16" y="188" width="290" height="28" rx="10" fill="#2266c8" opacity="0.28"/>
  <text x="161" y="207" text-anchor="middle" font-size="12" fill="#90c8ff" font-weight="bold">Scene Graph Model</text>

  <!-- Tree visual -->
  <text x="26" y="230" font-size="10" fill="#6090b0" font-weight="bold">Document Tree</text>
  <rect x="26" y="236" width="270" height="96" rx="5" fill="#4a9ef8" opacity="0.06" stroke="#4a9ef8" stroke-width="1"/>

  <!-- Tree nodes -->
  <rect x="136" y="244" width="60" height="20" rx="4" fill="#4a9ef8" opacity="0.5"/>
  <text x="166" y="258" text-anchor="middle" font-size="9" fill="#fff">Document</text>

  <line x1="130" y1="264" x2="96" y2="278" stroke="#4a9ef8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="166" y1="264" x2="166" y2="278" stroke="#4a9ef8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="202" y1="264" x2="236" y2="278" stroke="#4a9ef8" stroke-width="1" stroke-dasharray="3,2"/>

  <rect x="50" y="278" width="60" height="18" rx="3" fill="#9b7cf4" opacity="0.5"/>
  <text x="80" y="291" text-anchor="middle" font-size="8" fill="#fff">Frame</text>

  <rect x="130" y="278" width="60" height="18" rx="3" fill="#9b7cf4" opacity="0.5"/>
  <text x="160" y="291" text-anchor="middle" font-size="8" fill="#fff">Frame</text>

  <rect x="210" y="278" width="60" height="18" rx="3" fill="#9b7cf4" opacity="0.5"/>
  <text x="240" y="291" text-anchor="middle" font-size="8" fill="#fff">Frame</text>

  <line x1="80" y1="296" x2="60" y2="310" stroke="#4a9ef8" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="80" y1="296" x2="96" y2="310" stroke="#4a9ef8" stroke-width="1" stroke-dasharray="3,2"/>
  <rect x="36" y="310" width="44" height="16" rx="3" fill="#3dbf8a" opacity="0.5"/>
  <text x="58" y="322" text-anchor="middle" font-size="8" fill="#fff">Rect</text>
  <rect x="82" y="310" width="44" height="16" rx="3" fill="#3dbf8a" opacity="0.5"/>
  <text x="104" y="322" text-anchor="middle" font-size="8" fill="#fff">Text</text>

  <text x="26" y="350" font-size="10" fill="#6090b0" font-weight="bold">Node Properties</text>
  <rect x="26" y="356" width="270" height="50" rx="5" fill="#4a9ef8" opacity="0.06" stroke="#4a9ef8" stroke-width="1"/>
  <text x="26" y="370" font-size="9" fill="#90c8ff">  id · type · x · y · w · h · rotation</text>
  <text x="26" y="384" font-size="9" fill="#90c8ff">  fill · stroke · opacity · blendMode</text>
  <text x="26" y="396" font-size="9" fill="#e8924f">  children[] · constraints · componentId</text>

  <!-- CENTER: Tools + hit testing -->
  <rect x="322" y="188" width="316" height="226" rx="10" fill="#0e1828" stroke="#9b7cf4" stroke-width="1.5"/>
  <rect x="322" y="188" width="316" height="28" rx="10" fill="#6d5bd0" opacity="0.25"/>
  <text x="480" y="207" text-anchor="middle" font-size="12" fill="#c0b0ff" font-weight="bold">Vector Tools &amp; Hit Testing</text>

  <text x="332" y="228" font-size="10" fill="#6090b0" font-weight="bold">Bezier Pen Tool</text>
  <rect x="332" y="234" width="296" height="54" rx="5" fill="#9b7cf4" opacity="0.08" stroke="#9b7cf4" stroke-width="1"/>
  <text x="332" y="248" font-size="9" fill="#c0b0ff">click → add anchor point (corner)</text>
  <text x="332" y="262" font-size="9" fill="#c0b0ff">click + drag → add smooth anchor (control handles)</text>
  <text x="332" y="276" font-size="9" fill="#c0b0ff">Bezier curve: P(t) = (1−t)³P0 + 3(1−t)²tP1 + 3(1−t)t²P2 + t³P3</text>
  <text x="332" y="286" font-size="9" fill="#e8924f">path encoded as SVG d string for storage; rendered via WebGL tessellation</text>

  <text x="332" y="306" font-size="10" fill="#3dbf8a" font-weight="bold">Hit Testing</text>
  <rect x="332" y="312" width="296" height="44" rx="5" fill="#3dbf8a" opacity="0.07" stroke="#3dbf8a" stroke-width="1"/>
  <text x="332" y="326" font-size="9" fill="#7dd4b0">Spatial index: R-tree (rtree.js) for O(log n) bounding-box lookup</text>
  <text x="332" y="340" font-size="9" fill="#7dd4b0">Precision test: point-in-polygon for complex paths (winding rule)</text>
  <text x="332" y="354" font-size="9" fill="#7dd4b0">Click: walk R-tree top-down → return topmost overlapping node</text>

  <text x="332" y="376" font-size="10" fill="#e8924f" font-weight="bold">Snapping + Alignment</text>
  <rect x="332" y="382" width="296" height="24" rx="4" fill="#e8924f" opacity="0.08" stroke="#e8924f" stroke-width="1"/>
  <text x="480" y="394" text-anchor="middle" font-size="9" fill="#f0b87e">Smart guides snap to: edges, centers, baselines of other objects within 4px</text>
  <text x="480" y="404" text-anchor="middle" font-size="9" fill="#f0b87e">Grid snap: configurable px grid · pixel snap: round coords to integers</text>

  <!-- RIGHT: Collaboration (CRDT) -->
  <rect x="654" y="188" width="290" height="226" rx="10" fill="#0e1828" stroke="#3dbf8a" stroke-width="1.5"/>
  <rect x="654" y="188" width="290" height="28" rx="10" fill="#3dbf8a" opacity="0.18"/>
  <text x="799" y="207" text-anchor="middle" font-size="12" fill="#7dd4b0" font-weight="bold">Real-Time Collaboration (CRDT)</text>

  <text x="664" y="228" font-size="10" fill="#6090b0" font-weight="bold">Why CRDT (not OT) for Design</text>
  <rect x="664" y="234" width="270" height="40" rx="5" fill="#3dbf8a" opacity="0.07" stroke="#3dbf8a" stroke-width="1"/>
  <text x="664" y="248" font-size="9" fill="#7dd4b0">Design objects are independent (no positional coupling)</text>
  <text x="664" y="262" font-size="9" fill="#7dd4b0">CRDT merges: last-write-wins per property (Y.js Map)</text>
  <text x="664" y="274" font-size="9" fill="#7dd4b0">No server transform step needed → scales to thousands of editors</text>

  <text x="664" y="296" font-size="10" fill="#9b7cf4" font-weight="bold">Y.js Shared Types</text>
  <rect x="664" y="302" width="270" height="56" rx="5" fill="#9b7cf4" opacity="0.08" stroke="#9b7cf4" stroke-width="1"/>
  <text x="664" y="316" font-size="9" fill="#c0b0ff">YMap per node: &#123;x, y, w, h, fill, ...&#125; CRDT map</text>
  <text x="664" y="330" font-size="9" fill="#c0b0ff">YArray: ordered list of node IDs in each frame</text>
  <text x="664" y="344" font-size="9" fill="#c0b0ff">YText: for text content within text nodes</text>
  <text x="664" y="356" font-size="9" fill="#9b7cf4">Awareness: Y.js awareness for cursor/selection presence</text>

  <text x="664" y="378" font-size="10" fill="#e8924f" font-weight="bold">Conflict Resolution</text>
  <rect x="664" y="384" width="270" height="22" rx="4" fill="#e8924f" opacity="0.08" stroke="#e8924f" stroke-width="1"/>
  <text x="664" y="398" font-size="9" fill="#f0b87e">Concurrent move: last-write-wins by Lamport timestamp</text>
  <text x="664" y="408" font-size="9" fill="#f0b87e">Concurrent delete + edit: delete wins (prevent ghost objects)</text>

  <!-- BOTTOM: Export + WebGL specifics + perf -->
  <line x1="16" y1="428" x2="944" y2="428" stroke="#4a9ef8" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>
  <text x="480" y="444" text-anchor="middle" font-size="11" fill="#90c8ff" font-weight="bold" letter-spacing="1">EXPORT · COMPONENTS · PERFORMANCE TARGETS</text>

  <rect x="16" y="454" width="290" height="76" rx="10" fill="#0e1828" stroke="#4a9ef8" stroke-width="1.5"/>
  <text x="161" y="472" text-anchor="middle" font-size="11" fill="#90c8ff" font-weight="bold">Export Formats</text>
  <text x="26" y="490" font-size="9" fill="#6090b0">SVG: serialize scene graph nodes to SVG elements (lossless vector)</text>
  <text x="26" y="504" font-size="9" fill="#6090b0">PNG: flatten to Canvas → toBlob (target resolution × DPR)</text>
  <text x="26" y="518" font-size="9" fill="#e8924f">PDF: canvas.toDataURL → jsPDF · CSS variables → design tokens JSON</text>

  <rect x="322" y="454" width="316" height="76" rx="10" fill="#0e1828" stroke="#9b7cf4" stroke-width="1.5"/>
  <text x="480" y="472" text-anchor="middle" font-size="11" fill="#c0b0ff" font-weight="bold">Component System</text>
  <text x="332" y="490" font-size="9" fill="#6090b0">Component: master node template with overridable properties</text>
  <text x="332" y="504" font-size="9" fill="#6090b0">Instance: reference to component + property overrides (sparse delta)</text>
  <text x="332" y="518" font-size="9" fill="#3dbf8a">Edit master → all instances update (except overridden props)</text>

  <rect x="654" y="454" width="290" height="76" rx="10" fill="#0e1828" stroke="#3dbf8a" stroke-width="1.5"/>
  <text x="799" y="472" text-anchor="middle" font-size="11" fill="#7dd4b0" font-weight="bold">Performance Targets</text>
  <text x="664" y="490" font-size="9" fill="#3dbf8a">Render frame:        &lt; 8 ms (120fps capable)</text>
  <text x="664" y="504" font-size="9" fill="#3dbf8a">Pan/zoom:            &lt; 4 ms (GPU transform, no redraw)</text>
  <text x="664" y="518" font-size="9" fill="#e8924f">1000 nodes collab:   &lt; 16 ms (R-tree + CRDT merge)</text>
</svg>
