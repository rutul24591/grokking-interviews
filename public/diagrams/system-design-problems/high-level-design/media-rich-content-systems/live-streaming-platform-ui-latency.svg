<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#100d1e"/>
      <stop offset="100%" stop-color="#0c1825"/>
    </linearGradient>
    <linearGradient id="red-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f05060"/>
      <stop offset="100%" stop-color="#c03040"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9b7cf4"/>
      <stop offset="100%" stop-color="#6d5bd0"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3dbf8a"/>
      <stop offset="100%" stop-color="#2f9d74"/>
    </linearGradient>
    <filter id="glow-r">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-g">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9b7cf4"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3dbf8a"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f05060"/>
    </marker>
  </defs>

  <rect width="960" height="500" fill="url(#bg-grad)"/>
  <g opacity="0.04">
    <line x1="0" y1="60" x2="960" y2="60" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="120" x2="960" y2="120" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="180" x2="960" y2="180" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="240" x2="960" y2="240" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="300" x2="960" y2="300" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="360" x2="960" y2="360" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="0" y1="420" x2="960" y2="420" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="500" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="500" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="500" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="500" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="500" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="500" stroke="#9b7cf4" stroke-width="1"/>
    <line x1="840" y1="0" x2="840" y2="500" stroke="#9b7cf4" stroke-width="1"/>
  </g>

  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffe4e8">Live Streaming — Latency Budget, Chat Scale &amp; Viewer State</text>
  <text x="480" y="50" text-anchor="middle" font-size="11" fill="#c08090">LL-HLS partial segments · Chat fan-out at scale · Viewer buffering · Stream health</text>

  <!-- LEFT: LL-HLS timeline visual -->
  <rect x="16" y="62" width="450" height="220" rx="10" fill="#1a1530" stroke="#9b7cf4" stroke-width="1.5"/>
  <rect x="16" y="62" width="450" height="28" rx="10" fill="#6d5bd0" opacity="0.25"/>
  <text x="241" y="80" text-anchor="middle" font-size="12" fill="#c0b0ff" font-weight="bold">LL-HLS Latency Timeline (Broadcaster → Viewer)</text>

  <!-- Time axis -->
  <text x="26" y="110" font-size="9" fill="#9985cc">t=0</text>
  <text x="26" y="126" font-size="9" fill="#9985cc">t=0.2</text>
  <text x="26" y="142" font-size="9" fill="#9985cc">t=0.4</text>
  <text x="26" y="158" font-size="9" fill="#9985cc">t=1.0</text>
  <text x="26" y="174" font-size="9" fill="#9985cc">t=1.2</text>
  <text x="26" y="190" font-size="9" fill="#9985cc">t=2.0</text>
  <text x="26" y="206" font-size="9" fill="#9985cc">t=2.2</text>

  <!-- Broadcaster timeline -->
  <text x="70" y="100" font-size="10" fill="#f08090" font-weight="bold">Broadcaster</text>
  <rect x="70" y="104" width="8" height="10" rx="2" fill="#f05060" opacity="0.8"/>
  <text x="82" y="113" font-size="8" fill="#f08090">Frame encoded → part 1/10 (200ms) written to HLS packager</text>
  <rect x="70" y="120" width="8" height="10" rx="2" fill="#f05060" opacity="0.8"/>
  <text x="82" y="129" font-size="8" fill="#f08090">part 2/10</text>
  <rect x="70" y="136" width="8" height="10" rx="2" fill="#f05060" opacity="0.8"/>
  <text x="82" y="145" font-size="8" fill="#f08090">part 3/10 … (building up to full 2s segment)</text>
  <rect x="70" y="151" width="8" height="10" rx="2" fill="#e8924f" opacity="0.8"/>
  <text x="82" y="160" font-size="8" fill="#e8924f">Full segment 1 (2s) sealed → available on CDN</text>

  <!-- Viewer timeline -->
  <text x="70" y="182" font-size="10" fill="#3dbf8a" font-weight="bold">Viewer (Blocking Reload)</text>
  <rect x="70" y="186" width="8" height="10" rx="2" fill="#3dbf8a" opacity="0.6"/>
  <text x="82" y="195" font-size="8" fill="#7dd4b0">GET manifest (blocked at CDN until next part is ready)</text>
  <rect x="70" y="200" width="8" height="10" rx="2" fill="#3dbf8a" opacity="0.8"/>
  <text x="82" y="209" font-size="8" fill="#7dd4b0">Response: part 3/10 URI → fetch part → buffer → play</text>
  <rect x="70" y="215" width="8" height="10" rx="2" fill="#9b7cf4" opacity="0.8"/>
  <text x="82" y="224" font-size="8" fill="#c0b0ff">End-to-end latency: ~1.4s (200ms encode + 200ms CDN push + 200ms manifest + buffer)</text>

  <!-- Latency comparison bar chart -->
  <text x="26" y="246" font-size="10" fill="#9985cc" font-weight="bold">Latency Comparison</text>
  <rect x="26" y="252" width="30" height="12" rx="3" fill="#3dbf8a" opacity="0.8"/>
  <text x="60" y="263" font-size="9" fill="#7dd4b0">WebRTC:     &lt;500ms</text>
  <rect x="26" y="268" width="90" height="12" rx="3" fill="#9b7cf4" opacity="0.6"/>
  <text x="120" y="279" font-size="9" fill="#c0b0ff">LL-HLS:       ~1–2s</text>
  <rect x="26" y="284" width="250" height="12" rx="3" fill="#e8924f" opacity="0.5"/>
  <text x="280" y="295" font-size="9" fill="#f0b87e">Standard HLS:                                    6–30s</text>

  <!-- RIGHT: Chat at scale -->
  <rect x="482" y="62" width="462" height="220" rx="10" fill="#1a1530" stroke="#f05060" stroke-width="1.5"/>
  <rect x="482" y="62" width="462" height="28" rx="10" fill="#c03040" opacity="0.22"/>
  <text x="713" y="80" text-anchor="middle" font-size="12" fill="#f08090" font-weight="bold">Chat Scale — Fan-out at 100k Concurrent Viewers</text>

  <!-- Fan-out diagram -->
  <rect x="492" y="100" width="80" height="28" rx="6" fill="url(#red-grad)"/>
  <text x="532" y="118" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Message</text>

  <line x1="572" y1="114" x2="594" y2="114" stroke="#f05060" stroke-width="2" marker-end="url(#arr-r)"/>

  <rect x="594" y="100" width="80" height="28" rx="6" fill="#1e1030" stroke="#9b7cf4" stroke-width="1.5"/>
  <text x="634" y="118" text-anchor="middle" font-size="10" fill="#c0b0ff" font-weight="bold">Chat API</text>

  <line x1="674" y1="114" x2="696" y2="114" stroke="#9b7cf4" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="696" y="100" width="80" height="28" rx="6" fill="#1e1030" stroke="#3dbf8a" stroke-width="1.5"/>
  <text x="736" y="118" text-anchor="middle" font-size="10" fill="#3dbf8a" font-weight="bold">Redis Pub/Sub</text>

  <!-- Fan out arrows down to chat servers -->
  <line x1="736" y1="128" x2="620" y2="150" stroke="#3dbf8a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <line x1="736" y1="128" x2="736" y2="150" stroke="#3dbf8a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <line x1="736" y1="128" x2="852" y2="150" stroke="#3dbf8a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>

  <rect x="575" y="150" width="90" height="24" rx="5" fill="#3dbf8a" opacity="0.3"/>
  <text x="620" y="166" text-anchor="middle" font-size="9" fill="#fff">Chat Pod 1</text>
  <rect x="691" y="150" width="90" height="24" rx="5" fill="#3dbf8a" opacity="0.3"/>
  <text x="736" y="166" text-anchor="middle" font-size="9" fill="#fff">Chat Pod 2</text>
  <rect x="807" y="150" width="90" height="24" rx="5" fill="#3dbf8a" opacity="0.3"/>
  <text x="852" y="166" text-anchor="middle" font-size="9" fill="#fff">Chat Pod N</text>

  <text x="713" y="196" text-anchor="middle" font-size="9" fill="#9985cc">Each pod handles 5k WebSocket connections → 100k viewers = 20 pods</text>
  <text x="713" y="210" text-anchor="middle" font-size="9" fill="#9985cc">Broadcast: Redis pub → all pods → each pod pushes to its 5k connections</text>
  <text x="713" y="224" text-anchor="middle" font-size="9" fill="#9985cc">Message: max 500 chars · filter toxic → drop before fan-out</text>
  <text x="713" y="238" text-anchor="middle" font-size="9" fill="#e8924f">Heavy stream: &gt;100 msg/s → sample mode (send 1 in N, skip rest)</text>
  <text x="713" y="252" text-anchor="middle" font-size="9" fill="#c0b0ff">Rate: 1 msg/500ms per user · slow-mode override: streamer can set 1–30s</text>
  <text x="713" y="266" text-anchor="middle" font-size="9" fill="#3dbf8a">Persistence: last 1h of chat stored in Cassandra (append-only, TTL 24h)</text>

  <!-- BOTTOM: Buffer states + stream health -->
  <rect x="16" y="296" width="450" height="192" rx="10" fill="#1a1530" stroke="#3dbf8a" stroke-width="1.5"/>
  <text x="241" y="316" text-anchor="middle" font-size="12" fill="#7dd4b0" font-weight="bold">Viewer Buffer States + Adaptive Quality</text>

  <!-- Buffer state machine -->
  <rect x="26" y="326" width="80" height="26" rx="5" fill="#6d5bd0" opacity="0.5"/>
  <text x="66" y="343" text-anchor="middle" font-size="9" fill="#fff">IDLE (offline)</text>

  <line x1="106" y1="339" x2="126" y2="339" stroke="#3dbf8a" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="116" y="334" text-anchor="middle" font-size="7" fill="#7dd4b0">join</text>

  <rect x="126" y="326" width="80" height="26" rx="5" fill="#9b7cf4" opacity="0.5"/>
  <text x="166" y="343" text-anchor="middle" font-size="9" fill="#fff">BUFFERING</text>

  <line x1="206" y1="339" x2="226" y2="339" stroke="#3dbf8a" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="216" y="334" text-anchor="middle" font-size="7" fill="#7dd4b0">&gt;3 parts</text>

  <rect x="226" y="326" width="80" height="26" rx="5" fill="#3dbf8a" opacity="0.5"/>
  <text x="266" y="343" text-anchor="middle" font-size="9" fill="#fff">PLAYING</text>

  <line x1="306" y1="339" x2="326" y2="339" stroke="#f05060" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="316" y="334" text-anchor="middle" font-size="7" fill="#f08090">stall</text>

  <rect x="326" y="326" width="90" height="26" rx="5" fill="#f05060" opacity="0.3"/>
  <text x="371" y="343" text-anchor="middle" font-size="9" fill="#f08090">REBUFFERING</text>

  <!-- Back arrow rebuffering → playing -->
  <path d="M 416 339 Q 450 360 450 372 Q 450 386 416 386 Q 320 386 266 370" stroke="#3dbf8a" stroke-width="1.5" fill="none" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="440" y="375" font-size="7" fill="#7dd4b0">recovered</text>

  <text x="26" y="368" font-size="10" fill="#e8924f" font-weight="bold">Rebuffer Recovery</text>
  <text x="26" y="382" font-size="9" fill="#9985cc">On stall detected (&gt;0.5s buffer gap): drop to 360p immediately</text>
  <text x="26" y="396" font-size="9" fill="#9985cc">Fetch next part at lowest quality → fill buffer → slowly step up</text>
  <text x="26" y="410" font-size="9" fill="#9985cc">Show loading spinner overlay on video surface during rebuffer</text>
  <text x="26" y="424" font-size="9" fill="#3dbf8a">Auto-quality (default): EWMA bandwidth × 0.8 safety margin → select rendition</text>
  <text x="26" y="438" font-size="9" fill="#3dbf8a">Manual quality lock: user pin to 1080p → no auto-downgrade on stall</text>
  <text x="26" y="452" font-size="9" fill="#c0b0ff">Metric: rebuffer ratio = rebuffer seconds / watch time (target &lt;0.5%)</text>
  <text x="26" y="468" font-size="9" fill="#c0b0ff">Metric: TTFF (time to first frame) target &lt;2s for live edge join</text>

  <!-- RIGHT BOTTOM: Stream health + broadcaster signals -->
  <rect x="482" y="296" width="462" height="192" rx="10" fill="#1a1530" stroke="#9b7cf4" stroke-width="1.5"/>
  <text x="713" y="316" text-anchor="middle" font-size="12" fill="#c0b0ff" font-weight="bold">Stream Health Signals + DVR Architecture</text>

  <text x="492" y="338" font-size="10" fill="#f08090" font-weight="bold">Health Indicators (Broadcaster Dashboard)</text>
  <rect x="492" y="344" width="200" height="16" rx="4" fill="#3dbf8a" opacity="0.3"/>
  <text x="492" y="356" font-size="9" fill="#fff">● HEALTHY  Bitrate 5.2Mbps · 0 dropped frames</text>
  <rect x="492" y="364" width="200" height="16" rx="4" fill="#e8924f" opacity="0.3"/>
  <text x="492" y="376" font-size="9" fill="#fff">◐ DEGRADED  Bitrate 1.2Mbps · 12% dropped frames</text>
  <rect x="492" y="384" width="200" height="16" rx="4" fill="#f05060" opacity="0.3"/>
  <text x="492" y="396" font-size="9" fill="#fff">● BROKEN   Stream offline / reconnecting</text>

  <text x="700" y="338" font-size="10" fill="#3dbf8a" font-weight="bold">DVR (Time-Shifted Playback)</text>
  <rect x="700" y="344" width="234" height="58" rx="4" fill="#3dbf8a" opacity="0.08" stroke="#3dbf8a" stroke-width="1"/>
  <text x="700" y="358" font-size="9" fill="#9985cc">Segments archived to S3 as they seal (2s cadence)</text>
  <text x="700" y="372" font-size="9" fill="#9985cc">Manifest extended backward: EXT-X-PROGRAM-DATE-TIME</text>
  <text x="700" y="386" font-size="9" fill="#9985cc">Viewer seeks to -30min: manifest HEAD=now-30min</text>
  <text x="700" y="400" font-size="9" fill="#9985cc">S3 lifecycle: 4h TTL for live DVR · 90-day for VOD</text>

  <text x="492" y="420" font-size="10" fill="#9b7cf4" font-weight="bold">Viewer Join Flow (Live Edge)</text>
  <text x="492" y="434" font-size="9" fill="#9985cc">1. GET /stream/:id/manifest → redirect to CDN manifest URL</text>
  <text x="492" y="448" font-size="9" fill="#9985cc">2. Parse manifest → select highest sustainable rendition</text>
  <text x="492" y="462" font-size="9" fill="#9985cc">3. Buffer 3 parts (600ms) → start playback (TTFF target: &lt;2s)</text>
  <text x="492" y="476" font-size="9" fill="#3dbf8a">4. Subscribe to WebSocket room → receive chat + reactions + viewer count</text>
</svg>
