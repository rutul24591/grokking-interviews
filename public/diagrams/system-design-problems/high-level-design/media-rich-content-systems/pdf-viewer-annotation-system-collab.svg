<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1230"/>
      <stop offset="100%" stop-color="#0f1a2e"/>
    </linearGradient>
    <linearGradient id="purple-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b6fe8"/>
      <stop offset="100%" stop-color="#6d5bd0"/>
    </linearGradient>
    <linearGradient id="green-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3dbf8a"/>
      <stop offset="100%" stop-color="#2f9d74"/>
    </linearGradient>
    <linearGradient id="amber-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8924f"/>
      <stop offset="100%" stop-color="#d97843"/>
    </linearGradient>
    <filter id="glow-p">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-g">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b6fe8"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3dbf8a"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e8924f"/>
    </marker>
    <marker id="arr-d" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0" opacity="0.5"/>
    </marker>
  </defs>

  <rect width="960" height="520" fill="url(#bg-grad)"/>
  <g opacity="0.04">
    <line x1="0" y1="60" x2="960" y2="60" stroke="#8b6fe8" stroke-width="1"/>
    <line x1="0" y1="120" x2="960" y2="120" stroke="#8b6fe8" stroke-width="1"/>
    <line x1="0" y1="180" x2="960" y2="180" stroke="#8b6fe8" stroke-width="1"/>
    <line x1="0" y1="240" x2="960" y2="240" stroke="#8b6fe8" stroke-width="1"/>
    <line x1="0" y1="300" x2="960" y2="300" stroke="#8b6fe8" stroke-width="1"/>
    <line x1="0" y1="360" x2="960" y2="360" stroke="#8b6fe8" stroke-width="1"/>
    <line x1="0" y1="420" x2="960" y2="420" stroke="#8b6fe8" stroke-width="1"/>
    <line x1="0" y1="480" x2="960" y2="480" stroke="#8b6fe8" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="520" stroke="#8b6fe8" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="520" stroke="#8b6fe8" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="520" stroke="#8b6fe8" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="520" stroke="#8b6fe8" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="520" stroke="#8b6fe8" stroke-width="1"/>
  </g>

  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#e8e4ff">PDF Annotation — Collaboration &amp; Interaction Flows</text>
  <text x="480" y="50" text-anchor="middle" font-size="11" fill="#8b7fcf">Optimistic mutation · WebSocket broadcast · Comment threading · Coordinate transform</text>

  <!-- LEFT: Annotation creation sequence -->
  <rect x="16" y="62" width="430" height="330" rx="10" fill="#1c1535" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="16" y="62" width="430" height="28" rx="10" fill="#6d5bd0" opacity="0.25"/>
  <text x="231" y="80" text-anchor="middle" font-size="12" fill="#c0b0ff" font-weight="bold">Annotation Creation — Optimistic Flow</text>

  <!-- Lifelines -->
  <text x="70" y="106" text-anchor="middle" font-size="10" fill="#8b6fe8" font-weight="bold">User</text>
  <rect x="40" y="108" width="60" height="22" rx="5" fill="url(#purple-grad)"/>
  <text x="70" y="123" text-anchor="middle" font-size="9" fill="#fff">Browser</text>
  <line x1="70" y1="130" x2="70" y2="378" stroke="#8b6fe8" stroke-width="1.5" stroke-dasharray="5,4"/>

  <text x="195" y="106" text-anchor="middle" font-size="10" fill="#3dbf8a" font-weight="bold">Local State</text>
  <rect x="155" y="108" width="80" height="22" rx="5" fill="url(#green-grad)"/>
  <text x="195" y="123" text-anchor="middle" font-size="9" fill="#fff">Zustand / Redux</text>
  <line x1="195" y1="130" x2="195" y2="378" stroke="#3dbf8a" stroke-width="1.5" stroke-dasharray="5,4"/>

  <text x="330" y="106" text-anchor="middle" font-size="10" fill="#e8924f" font-weight="bold">API Server</text>
  <rect x="295" y="108" width="70" height="22" rx="5" fill="url(#amber-grad)"/>
  <text x="330" y="123" text-anchor="middle" font-size="9" fill="#fff">REST + WS</text>
  <line x1="330" y1="130" x2="330" y2="378" stroke="#e8924f" stroke-width="1.5" stroke-dasharray="5,4"/>

  <text x="418" y="106" text-anchor="middle" font-size="10" fill="#9985cc" font-weight="bold">Collab WS</text>
  <rect x="386" y="108" width="64" height="22" rx="5" fill="#2a2050" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="418" y="123" text-anchor="middle" font-size="9" fill="#c0b0ff">broadcast</text>
  <line x1="418" y1="130" x2="418" y2="378" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Step 1 -->
  <rect x="26" y="148" width="100" height="20" rx="4" fill="#6d5bd0" opacity="0.2"/>
  <text x="76" y="161" text-anchor="middle" font-size="9" fill="#c0b0ff">select text range</text>
  <line x1="70" y1="178" x2="183" y2="178" stroke="#8b6fe8" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="127" y="174" text-anchor="middle" font-size="8" fill="#a994ff">add(tempAnnotation)</text>

  <!-- Step 2: instant render -->
  <rect x="155" y="186" width="80" height="20" rx="4" fill="#3dbf8a" opacity="0.2"/>
  <text x="195" y="199" text-anchor="middle" font-size="9" fill="#7dd4b0">render instantly</text>
  <line x1="195" y1="206" x2="70" y2="218" stroke="#3dbf8a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="127" y="213" text-anchor="middle" font-size="8" fill="#7dd4b0">SVG overlay visible</text>

  <!-- Step 3: async POST -->
  <line x1="195" y1="230" x2="318" y2="230" stroke="#e8924f" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="257" y="225" text-anchor="middle" font-size="8" fill="#f0b87e">POST /annotations &#123;...&#125;</text>
  <rect x="295" y="238" width="70" height="20" rx="4" fill="#e8924f" opacity="0.2"/>
  <text x="330" y="251" text-anchor="middle" font-size="9" fill="#f0b87e">persist + gen ID</text>

  <!-- Step 4: 200 OK with serverId -->
  <line x1="330" y1="262" x2="208" y2="262" stroke="#3dbf8a" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-g)"/>
  <text x="270" y="258" text-anchor="middle" font-size="8" fill="#7dd4b0">200 &#123;id: "ann_789"&#125;</text>
  <rect x="155" y="270" width="80" height="20" rx="4" fill="#3dbf8a" opacity="0.15"/>
  <text x="195" y="283" text-anchor="middle" font-size="9" fill="#7dd4b0">replace tempId</text>

  <!-- Step 5: WS broadcast to other viewers -->
  <line x1="330" y1="296" x2="404" y2="296" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="367" y="291" text-anchor="middle" font-size="8" fill="#a994ff">broadcast event</text>
  <rect x="386" y="302" width="64" height="30" rx="4" fill="#6d5bd0" opacity="0.15" stroke="#6d5bd0" stroke-width="1"/>
  <text x="418" y="315" text-anchor="middle" font-size="8" fill="#c0b0ff">annotation:created</text>
  <text x="418" y="328" text-anchor="middle" font-size="8" fill="#c0b0ff">to all room viewers</text>

  <!-- Step 6: error rollback -->
  <rect x="26" y="342" width="410" height="28" rx="5" fill="#e8924f" opacity="0.1" stroke="#e8924f" stroke-width="1"/>
  <text x="70" y="354" font-size="8" fill="#e8924f" font-weight="bold">On POST error:</text>
  <text x="140" y="354" font-size="8" fill="#f0b87e">remove(tempAnnotation) from local state → toast "Failed, retry?"</text>
  <text x="231" y="366" text-anchor="middle" font-size="8" fill="#f0b87e">Exponential backoff retry with idempotency key (clientId + timestamp)</text>

  <!-- RIGHT TOP: Coordinate transform -->
  <rect x="462" y="62" width="482" height="190" rx="10" fill="#1c1535" stroke="#3dbf8a" stroke-width="1.5"/>
  <rect x="462" y="62" width="482" height="28" rx="10" fill="#3dbf8a" opacity="0.18"/>
  <text x="703" y="80" text-anchor="middle" font-size="12" fill="#7dd4b0" font-weight="bold">Coordinate Transform System</text>

  <!-- Visual diagram of PDF → Screen mapping -->
  <!-- PDF space box -->
  <rect x="478" y="96" width="130" height="90" rx="6" fill="#2a2050" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="543" y="112" text-anchor="middle" font-size="10" fill="#a994ff" font-weight="bold">PDF User Space</text>
  <text x="543" y="126" text-anchor="middle" font-size="9" fill="#9985cc">origin: bottom-left</text>
  <text x="543" y="140" text-anchor="middle" font-size="9" fill="#9985cc">72 DPI units/inch</text>
  <text x="543" y="154" text-anchor="middle" font-size="9" fill="#9985cc">y grows upward</text>
  <text x="543" y="168" text-anchor="middle" font-size="9" fill="#6d5bd0">&#40;x=72, y=720&#41;</text>
  <rect x="526" y="172" width="34" height="10" rx="2" fill="#6d5bd0" opacity="0.5"/>

  <!-- Arrow + transform box -->
  <line x1="608" y1="141" x2="644" y2="141" stroke="#3dbf8a" stroke-width="2" marker-end="url(#arr-g)"/>
  <rect x="644" y="112" width="150" height="58" rx="6" fill="#3dbf8a" opacity="0.12" stroke="#3dbf8a" stroke-width="1.5"/>
  <text x="719" y="128" text-anchor="middle" font-size="9" fill="#7dd4b0" font-weight="bold">Transform Formula</text>
  <text x="650" y="142" font-size="8.5" fill="#a8e8cf">sx = x × scale</text>
  <text x="650" y="154" font-size="8.5" fill="#a8e8cf">sy = (pageH − y) × scale</text>
  <text x="650" y="166" font-size="8.5" fill="#a8e8cf">  + scrollOffset + pageTop</text>

  <!-- Arrow to screen space -->
  <line x1="794" y1="141" x2="822" y2="141" stroke="#3dbf8a" stroke-width="2" marker-end="url(#arr-g)"/>
  <rect x="822" y="96" width="112" height="90" rx="6" fill="#2a2050" stroke="#3dbf8a" stroke-width="1.5"/>
  <text x="878" y="112" text-anchor="middle" font-size="10" fill="#7dd4b0" font-weight="bold">Screen Space</text>
  <text x="878" y="126" text-anchor="middle" font-size="9" fill="#9985cc">origin: top-left CSS</text>
  <text x="878" y="140" text-anchor="middle" font-size="9" fill="#9985cc">px at current scale</text>
  <text x="878" y="154" text-anchor="middle" font-size="9" fill="#9985cc">y grows downward</text>
  <text x="878" y="168" text-anchor="middle" font-size="9" fill="#3dbf8a">&#40;px=96, py=48&#41;</text>
  <rect x="858" y="172" width="34" height="10" rx="2" fill="#3dbf8a" opacity="0.5"/>

  <!-- Scale note -->
  <rect x="478" y="196" width="456" height="48" rx="6" fill="#6d5bd0" opacity="0.1" stroke="#6d5bd0" stroke-width="1"/>
  <text x="706" y="212" text-anchor="middle" font-size="9" fill="#c0b0ff" font-weight="bold">DPR-Aware Rendering</text>
  <text x="478" y="226" font-size="9" fill="#9985cc">  canvas.width = Math.floor(viewport.width × window.devicePixelRatio)   canvas.height = Math.floor(viewport.height × dpr)</text>
  <text x="478" y="238" font-size="9" fill="#9985cc">  ctx.scale(dpr, dpr)   →   crisp text on Retina; SVG overlay uses CSS width/height at 1× scale</text>

  <!-- RIGHT BOTTOM: Comment Thread + UI Controls -->
  <rect x="462" y="268" width="482" height="124" rx="10" fill="#1c1535" stroke="#e8924f" stroke-width="1.5"/>
  <rect x="462" y="268" width="482" height="28" rx="10" fill="#e8924f" opacity="0.18"/>
  <text x="703" y="286" text-anchor="middle" font-size="12" fill="#f5c080" font-weight="bold">Comment Thread Model</text>

  <!-- Thread visual mockup -->
  <rect x="472" y="302" width="230" height="82" rx="6" fill="#2a2050" stroke="#6d5bd0" stroke-width="1"/>
  <rect x="480" y="308" width="28" height="28" rx="14" fill="#6d5bd0"/>
  <text x="494" y="327" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">A</text>
  <text x="515" y="318" font-size="9" fill="#c0b0ff" font-weight="bold">Alice · page 3</text>
  <text x="515" y="330" font-size="9" fill="#9985cc">"This section needs citation"</text>
  <text x="515" y="342" font-size="8" fill="#6d5bd0">2m ago · highlight</text>
  <rect x="494" y="350" width="2" height="22" fill="#6d5bd0" opacity="0.4"/>
  <rect x="498" y="358" width="24" height="24" rx="12" fill="#3dbf8a"/>
  <text x="510" y="374" text-anchor="middle" font-size="9" fill="#fff">B</text>
  <text x="530" y="368" font-size="9" fill="#7dd4b0">Bob: "Agreed, added ref"</text>
  <text x="530" y="380" font-size="8" fill="#3dbf8a">just now · reply</text>

  <!-- Thread schema -->
  <rect x="710" y="298" width="224" height="86" rx="6" fill="#6d5bd0" opacity="0.1" stroke="#6d5bd0" stroke-width="1"/>
  <text x="822" y="314" text-anchor="middle" font-size="9" fill="#c0b0ff" font-weight="bold">Thread Data Model</text>
  <text x="716" y="328" font-size="8.5" fill="#9985cc">root annotation &#123;id, type, page, rect&#125;</text>
  <text x="716" y="341" font-size="8.5" fill="#9985cc">comments: [ &#123;id, author, body, at&#125;, ...]</text>
  <text x="716" y="354" font-size="8.5" fill="#9985cc">resolved: bool   resolvedBy: userId</text>
  <text x="716" y="367" font-size="8.5" fill="#e8924f">mutations: add_reply | resolve | reopen | delete</text>
  <text x="716" y="380" font-size="8.5" fill="#3dbf8a">WS event: annotation:updated &#123;op, payload&#125;</text>

  <!-- BOTTOM: Toolbar + Perf targets -->
  <rect x="16" y="408" width="928" height="100" rx="10" fill="#1c1535" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="480" y="428" text-anchor="middle" font-size="12" fill="#c0b0ff" font-weight="bold">Toolbar Modes · Keyboard Shortcuts · Performance Targets</text>

  <!-- Toolbar -->
  <rect x="26" y="438" width="50" height="28" rx="5" fill="#6d5bd0"/>
  <text x="51" y="456" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">Select</text>
  <rect x="82" y="438" width="58" height="28" rx="5" fill="#2a2050" stroke="#3dbf8a" stroke-width="1.5"/>
  <text x="111" y="456" text-anchor="middle" font-size="9" fill="#3dbf8a" font-weight="bold">Highlight</text>
  <rect x="146" y="438" width="58" height="28" rx="5" fill="#2a2050" stroke="#e8924f" stroke-width="1.5"/>
  <text x="175" y="456" text-anchor="middle" font-size="9" fill="#e8924f" font-weight="bold">Comment</text>
  <rect x="210" y="438" width="50" height="28" rx="5" fill="#2a2050" stroke="#9985cc" stroke-width="1.5"/>
  <text x="235" y="456" text-anchor="middle" font-size="9" fill="#9985cc" font-weight="bold">Ink</text>
  <rect x="266" y="438" width="50" height="28" rx="5" fill="#2a2050" stroke="#9985cc" stroke-width="1.5"/>
  <text x="291" y="456" text-anchor="middle" font-size="9" fill="#9985cc" font-weight="bold">Shape</text>
  <rect x="322" y="438" width="50" height="28" rx="5" fill="#2a2050" stroke="#9985cc" stroke-width="1.5"/>
  <text x="347" y="456" text-anchor="middle" font-size="9" fill="#9985cc" font-weight="bold">Stamp</text>

  <text x="26" y="482" font-size="9" fill="#9985cc">H = highlight · C = comment · I = ink · Esc = select mode · Ctrl+Z = undo last annotation · Del = delete selected</text>
  <text x="26" y="498" font-size="9" fill="#9985cc">Zoom: Ctrl+= / Ctrl+- / Ctrl+0 (fit page) · Page: ↑/↓ arrows · Find: Ctrl+F · Sidebar: Ctrl+B</text>

  <!-- Perf targets -->
  <rect x="680" y="432" width="258" height="70" rx="6" fill="#6d5bd0" opacity="0.1" stroke="#6d5bd0" stroke-width="1"/>
  <text x="809" y="448" text-anchor="middle" font-size="10" fill="#c0b0ff" font-weight="bold">Performance Targets</text>
  <text x="688" y="462" font-size="9" fill="#3dbf8a">First page visible:  &lt; 1.0 s</text>
  <text x="688" y="475" font-size="9" fill="#3dbf8a">Annotation render:   &lt; 50 ms (optimistic)</text>
  <text x="688" y="488" font-size="9" fill="#e8924f">Search index build:  &lt; 2 s (web worker)</text>
  <text x="688" y="501" font-size="9" fill="#9985cc">Scroll re-render:    &lt; 16 ms (rIC scheduling)</text>
</svg>
