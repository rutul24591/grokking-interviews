<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f3f1f8"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">Q&amp;A System (StackOverflow-like) — Question, Voting &amp; Search Flow</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- 5 actors -->
  <rect x="20" y="65" width="110" height="40" rx="8" fill="#6d5bd0"/>
  <text x="75" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">User Browser</text>
  <text x="75" y="98" text-anchor="middle" font-size="10" fill="#edeaf5">Markdown editor</text>

  <rect x="200" y="65" width="115" height="40" rx="8" fill="#2563eb"/>
  <text x="257" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Content API</text>
  <text x="257" y="98" text-anchor="middle" font-size="10" fill="#dbeafe">Q&amp;A + reputation</text>

  <rect x="390" y="65" width="115" height="40" rx="8" fill="#2f9d74"/>
  <text x="447" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Elasticsearch</text>
  <text x="447" y="98" text-anchor="middle" font-size="10" fill="#d1fae5">BM25 + tag filter</text>

  <rect x="580" y="65" width="115" height="40" rx="8" fill="#d97843"/>
  <text x="637" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Vector Search</text>
  <text x="637" y="98" text-anchor="middle" font-size="10" fill="#fef3c7">FAISS / pgvector</text>

  <rect x="770" y="65" width="110" height="40" rx="8" fill="#be123c"/>
  <text x="825" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Moderation</text>
  <text x="825" y="98" text-anchor="middle" font-size="10" fill="#fecdd3">fraud + flag queue</text>

  <!-- Lifelines -->
  <line x1="75"  y1="105" x2="75"  y2="490" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="257" y1="105" x2="257" y2="490" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="447" y1="105" x2="447" y2="490" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="637" y1="105" x2="637" y2="490" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="825" y1="105" x2="825" y2="490" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- SECTION 1: Question Posting + Duplicate Detection -->
  <rect x="8" y="118" width="884" height="14" rx="3" fill="#6d5bd0" opacity="0.15"/>
  <text x="450" y="129" text-anchor="middle" font-size="9" font-weight="bold" fill="#4c1d95">1 · QUESTION POSTING — live duplicate detection (BM25 + vector) as user types; similarity &gt;0.95 auto-flag on submit</text>

  <line x1="75" y1="150" x2="432" y2="150" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="253" y="144" text-anchor="middle" font-size="9" fill="#374151">GET /api/questions/similar?q={title} (on-type debounce)</text>

  <line x1="432" y1="164" x2="622" y2="164" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="527" y="158" text-anchor="middle" font-size="9" fill="#374151">BM25 match + FAISS top-5 semantic neighbors</text>

  <line x1="622" y1="178" x2="432" y2="178" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="527" y="172" text-anchor="middle" font-size="9" fill="#374151">RRF fusion → top 5 similar questions shown in sidebar</text>

  <line x1="432" y1="192" x2="90" y2="192" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="261" y="186" text-anchor="middle" font-size="9" fill="#374151">similarity &gt;0.95 → auto-flag; POST question to DB + index</text>

  <!-- SECTION 2: Voting + Reputation -->
  <rect x="8" y="210" width="884" height="14" rx="3" fill="#2f9d74" opacity="0.18"/>
  <text x="450" y="221" text-anchor="middle" font-size="9" font-weight="bold" fill="#065f46">2 · VOTING + REPUTATION — atomic transaction: insert vote + UPDATE reputation delta; daily fraud batch (serial voting, account cluster)</text>

  <line x1="75" y1="240" x2="242" y2="240" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="158" y="234" text-anchor="middle" font-size="9" fill="#374151">POST /api/votes {postId, direction: up}</text>

  <line x1="242" y1="254" x2="810" y2="254" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="526" y="248" text-anchor="middle" font-size="9" fill="#374151">fraud check: &gt;5 votes from same user → invalidate + reverse reputation</text>

  <!-- Reputation delta box -->
  <rect x="20" y="264" width="330" height="32" rx="6" fill="#fff" stroke="#2f9d74" stroke-width="1"/>
  <text x="185" y="279" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a1822">Upvote Q: +5 | Upvote A: +10 | Accept A: +15 asker +2</text>
  <text x="185" y="293" text-anchor="middle" font-size="9" fill="#374151">Downvote: -2 author, -1 voter (cost discourages abuse)</text>

  <!-- SECTION 3: Answer Ranking + ISR -->
  <rect x="8" y="306" width="884" height="14" rx="3" fill="#d97843" opacity="0.18"/>
  <text x="450" y="317" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">3 · ANSWER RANKING + ISR — accepted first → vote score → recency; ISR 1hr + on-demand revalidate on new answer or vote ×25</text>

  <line x1="75" y1="336" x2="432" y2="336" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="253" y="330" text-anchor="middle" font-size="9" fill="#374151">GET /questions/{slug} → CDN ISR page (&gt;95% hit)</text>

  <line x1="432" y1="350" x2="90" y2="350" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="261" y="344" text-anchor="middle" font-size="9" fill="#374151">sort: accepted → score desc → createdAt desc (in-app)</text>

  <line x1="75" y1="366" x2="242" y2="366" stroke="#6d5bd0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="158" y="360" text-anchor="middle" font-size="9" fill="#374151">SWR: user vote state, notification count (client-side)</text>

  <!-- SECTION 4: Search + Moderation -->
  <rect x="8" y="384" width="884" height="14" rx="3" fill="#be123c" opacity="0.12"/>
  <text x="450" y="395" text-anchor="middle" font-size="9" font-weight="bold" fill="#9f1239">4 · SEARCH + MODERATION — function_score BM25 + RRF vector fusion; 3 flags auto-hide; moderation queue for review</text>

  <line x1="75" y1="414" x2="432" y2="414" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="253" y="408" text-anchor="middle" font-size="9" fill="#374151">GET /api/search?q=... → BM25 function_score + tag boost</text>

  <line x1="432" y1="428" x2="622" y2="428" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="527" y="422" text-anchor="middle" font-size="9" fill="#374151">FAISS kNN → RRF merge → ranked results</text>

  <line x1="75" y1="444" x2="810" y2="444" stroke="#6d5bd0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="442" y="438" text-anchor="middle" font-size="9" fill="#374151">3 flags (&gt;500 rep flaggers) → auto-hide → moderation queue</text>

  <!-- Footer -->
  <rect x="8" y="460" width="884" height="36" rx="6" fill="#1a1822"/>
  <text x="90" y="476" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">Duplicate Threshold</text>
  <text x="90" y="490" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">cosine &gt;0.95</text>
  <text x="260" y="476" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Fraud Batch</text>
  <text x="260" y="490" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">daily, 5 votes / 24hr</text>
  <text x="450" y="476" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">ISR Revalidation</text>
  <text x="450" y="490" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">1hr + on-demand</text>
  <text x="645" y="476" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Search Fusion</text>
  <text x="645" y="490" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">RRF (1/(60+r))</text>
  <text x="820" y="476" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Auto-hide Flags</text>
  <text x="820" y="490" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">3 flags (&gt;500 rep)</text>
</svg>
