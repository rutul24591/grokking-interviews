<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f3f1f8"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">Medium-like Article Platform — Author &amp; Reader Flow</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- 5 actors -->
  <rect x="20" y="65" width="115" height="40" rx="8" fill="#6d5bd0"/>
  <text x="77" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Author Editor</text>
  <text x="77" y="98" text-anchor="middle" font-size="10" fill="#edeaf5">ProseMirror/TipTap</text>

  <rect x="205" y="65" width="115" height="40" rx="8" fill="#2563eb"/>
  <text x="262" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Publish Pipeline</text>
  <text x="262" y="98" text-anchor="middle" font-size="10" fill="#dbeafe">ISR + index + feed</text>

  <rect x="392" y="65" width="115" height="40" rx="8" fill="#2f9d74"/>
  <text x="449" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">CDN / ISR Cache</text>
  <text x="449" y="98" text-anchor="middle" font-size="10" fill="#d1fae5">&gt;95% hit rate</text>

  <rect x="580" y="65" width="115" height="40" rx="8" fill="#d97843"/>
  <text x="637" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Reader Client</text>
  <text x="637" y="98" text-anchor="middle" font-size="10" fill="#fef3c7">SWR dynamic data</text>

  <rect x="768" y="65" width="112" height="40" rx="8" fill="#be123c"/>
  <text x="824" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Feed / Redis</text>
  <text x="824" y="98" text-anchor="middle" font-size="10" fill="#fecdd3">30min pre-compute</text>

  <!-- Lifelines -->
  <line x1="77"  y1="105" x2="77"  y2="490" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="262" y1="105" x2="262" y2="490" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="449" y1="105" x2="449" y2="490" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="637" y1="105" x2="637" y2="490" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="824" y1="105" x2="824" y2="490" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- SECTION 1: Draft + Autosave -->
  <rect x="8" y="118" width="884" height="14" rx="3" fill="#6d5bd0" opacity="0.15"/>
  <text x="450" y="129" text-anchor="middle" font-size="9" font-weight="bold" fill="#4c1d95">1 · AUTHORING — 5s debounced autosave PATCH /api/drafts; localStorage crash backup; three-way merge on multi-device conflict</text>

  <line x1="77" y1="150" x2="247" y2="150" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="162" y="144" text-anchor="middle" font-size="9" fill="#374151">PATCH /api/drafts/{id} (ProseMirror JSON)</text>

  <line x1="247" y1="164" x2="92" y2="164" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="169" y="158" text-anchor="middle" font-size="9" fill="#374151">200 OK + version; write to localStorage backup</text>

  <!-- SECTION 2: Publish Pipeline -->
  <rect x="8" y="180" width="884" height="14" rx="3" fill="#2563eb" opacity="0.15"/>
  <text x="450" y="191" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e3a8a">2 · PUBLISH — validate → SEO meta → canonical URL → Shiki HTML → revalidatePath ISR → Elasticsearch index → fan-out queue</text>

  <line x1="77" y1="210" x2="247" y2="210" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="162" y="204" text-anchor="middle" font-size="9" fill="#374151">POST /api/publish (triggers background job)</text>

  <line x1="247" y1="224" x2="434" y2="224" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="340" y="218" text-anchor="middle" font-size="9" fill="#374151">revalidatePath('/articles/{slug}') → CDN bust</text>

  <!-- Publish detail box -->
  <rect x="175" y="234" width="350" height="32" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1"/>
  <text x="350" y="249" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a1822">Fan-out: 1K followers/chunk; celebrity (&gt;100K) → pull-on-read</text>
  <text x="350" y="264" text-anchor="middle" font-size="9" fill="#374151">Elasticsearch index + moderation score async check</text>

  <!-- SECTION 3: Reader Flow -->
  <rect x="8" y="276" width="884" height="14" rx="3" fill="#2f9d74" opacity="0.18"/>
  <text x="450" y="287" text-anchor="middle" font-size="9" font-weight="bold" fill="#065f46">3 · READING — CDN serves ISR shell; SWR loads clap count + comments; paywall check server-side from JWT; 25/50/75/100% scroll events</text>

  <line x1="622" y1="306" x2="464" y2="306" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="543" y="300" text-anchor="middle" font-size="9" fill="#374151">GET /articles/{slug} → CDN cached ISR page</text>

  <line x1="622" y1="320" x2="247" y2="320" stroke="#d97843" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="434" y="314" text-anchor="middle" font-size="9" fill="#374151">SWR: clap count, comment count (client-side, after paint)</text>

  <!-- Paywall box -->
  <rect x="440" y="330" width="340" height="32" rx="6" fill="#fff" stroke="#2f9d74" stroke-width="1"/>
  <text x="610" y="345" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a1822">Paywall: server-side JWT membership claim → truncate at 200 words</text>
  <text x="610" y="360" text-anchor="middle" font-size="9" fill="#374151">full HTML never sent to non-members (server-side render)</text>

  <!-- SECTION 4: Clap + Feed -->
  <rect x="8" y="372" width="884" height="14" rx="3" fill="#d97843" opacity="0.18"/>
  <text x="450" y="383" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">4 · ENGAGEMENT — clap 2s batch → atomic SQL increment; scroll depth via sendBeacon; feed pre-computed 30min in Redis</text>

  <line x1="622" y1="402" x2="247" y2="402" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="434" y="396" text-anchor="middle" font-size="9" fill="#374151">POST /api/claps {count: N} (2s batch, optimistic UI)</text>

  <line x1="247" y1="416" x2="622" y2="416" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="434" y="410" text-anchor="middle" font-size="9" fill="#374151">UPDATE SET claps = claps + N (atomic increment)</text>

  <line x1="809" y1="432" x2="652" y2="432" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="730" y="426" text-anchor="middle" font-size="9" fill="#374151">GET /api/feed → Redis ordered article IDs + SWR enrichment</text>

  <!-- Footer metrics -->
  <rect x="8" y="468" width="884" height="36" rx="6" fill="#1a1822"/>
  <text x="90" y="484" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">Autosave</text>
  <text x="90" y="498" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">5s debounce</text>
  <text x="255" y="484" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">CDN Hit Rate</text>
  <text x="255" y="498" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">&gt;95% ISR</text>
  <text x="450" y="484" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Clap Batch</text>
  <text x="450" y="498" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">2s window</text>
  <text x="650" y="484" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Feed Freshness</text>
  <text x="650" y="498" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">30 min Redis</text>
  <text x="820" y="484" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Fan-out Chunk</text>
  <text x="820" y="498" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">1K followers</text>
</svg>
