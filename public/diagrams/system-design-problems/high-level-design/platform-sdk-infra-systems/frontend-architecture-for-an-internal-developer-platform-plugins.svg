<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Plugin governance boundaries for an internal developer platform">
  <title>Plugin Governance and Boundaries</title>
  <desc>Shows plugin contributions within a shell, stable APIs, capability review, performance budgets, and failure isolation.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
    .accent { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 14; }
    .good { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .dash { stroke-dasharray: 7 6; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .muted { fill: #0b1220; stroke: #64748b; }
      .accent { fill: #06232a; stroke: #22d3ee; }
      .warn { fill: #2a140a; stroke: #fb923c; }
      .good { fill: #052018; stroke: #34d399; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" width="1200" height="560" />

  <rect class="box" x="60" y="90" width="420" height="170" />
  <text class="label bold" x="90" y="135">Shell app</text>
  <text class="label small" x="90" y="165">identity + RBAC</text>
  <text class="label small" x="90" y="190">navigation + telemetry</text>
  <text class="label small" x="90" y="215">shared UI primitives</text>

  <rect class="accent" x="520" y="70" width="320" height="210" />
  <text class="label bold" x="550" y="115">Plugin contracts</text>
  <text class="label small" x="550" y="145">stable APIs</text>
  <text class="label small" x="550" y="170">capabilities model</text>
  <text class="label small" x="550" y="195">design system rules</text>
  <text class="label small" x="550" y="220">versioning</text>

  <rect class="good" x="880" y="90" width="260" height="170" />
  <text class="label bold" x="910" y="135">Plugins</text>
  <text class="label small" x="910" y="165">pages + panels</text>
  <text class="label small" x="910" y="190">workflows</text>
  <text class="label small" x="910" y="215">integrations UI</text>

  <path class="arrow" d="M480 175 L520 175" />
  <path class="arrow" d="M840 175 L880 175" />

  <rect class="warn" x="60" y="320" width="1080" height="170" />
  <text class="label bold" x="90" y="365">Guardrails</text>
  <text class="label small" x="90" y="395">capability review for privileged actions</text>
  <text class="label small" x="90" y="420">performance budgets and monitoring per plugin</text>
  <text class="label small" x="90" y="445">failure isolation so plugins cannot crash shell</text>
</svg>

