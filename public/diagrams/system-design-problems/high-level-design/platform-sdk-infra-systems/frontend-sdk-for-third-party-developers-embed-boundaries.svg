<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Comparison of in-page SDK vs iframe embed boundary">
  <title>Embedding Boundaries</title>
  <desc>Compares running in the host page context versus embedding via iframe with message passing and stronger isolation.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
    .accent { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .dash { stroke-dasharray: 7 6; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .muted { fill: #0b1220; stroke: #64748b; }
      .accent { fill: #06232a; stroke: #22d3ee; }
      .warn { fill: #2a140a; stroke: #fb923c; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="560" />

  <rect class="box" x="70" y="90" width="500" height="370" />
  <text class="label bold" x="100" y="135">In-page library</text>
  <text class="label small" x="100" y="165">runs inside host JS context</text>
  <text class="label small" x="100" y="190">fast UI integration</text>
  <text class="label small" x="100" y="215">risk: XSS and script conflicts</text>
  <text class="label small" x="100" y="240">risk: DOM clobbering</text>
  <text class="label small" x="100" y="265">must harden inputs</text>
  <rect class="warn" x="100" y="300" width="440" height="130" />
  <text class="label bold" x="130" y="345">Primary risk</text>
  <text class="label small" x="130" y="375">host page can influence execution</text>
  <text class="label small" x="130" y="400">hard to isolate sensitive UI</text>

  <rect class="box" x="630" y="90" width="500" height="370" />
  <text class="label bold" x="660" y="135">Iframe embed</text>
  <text class="label small" x="660" y="165">strong isolation boundary</text>
  <text class="label small" x="660" y="190">independent deployment</text>
  <text class="label small" x="660" y="215">message passing required</text>
  <text class="label small" x="660" y="240">CSP and cookie constraints</text>
  <text class="label small" x="660" y="265">cross-frame accessibility work</text>
  <rect class="accent" x="660" y="300" width="440" height="130" />
  <text class="label bold" x="690" y="345">Primary benefit</text>
  <text class="label small" x="690" y="375">isolates sensitive UI from host</text>
  <text class="label small" x="690" y="400">reduces blast radius</text>

  <path class="arrow dash" d="M570 275 L630 275" />
</svg>

