<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Extensibility model for a no-code builder with plugin boundary and capabilities">
  <title>Builder Extensibility Model</title>
  <desc>Shows plugins contributing components and actions through a stable API, with capability permissions, sandboxing, and failure isolation.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
    .accent { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 14; }
    .good { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .dash { stroke-dasharray: 7 6; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .muted { fill: #0b1220; stroke: #64748b; }
      .accent { fill: #06232a; stroke: #22d3ee; }
      .warn { fill: #2a140a; stroke: #fb923c; }
      .good { fill: #052018; stroke: #34d399; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" width="1200" height="560" />

  <rect class="box" x="60" y="90" width="380" height="170" />
  <text class="label bold" x="90" y="135">Core editor</text>
  <text class="label small" x="90" y="165">schema + operations</text>
  <text class="label small" x="90" y="190">render pipeline</text>
  <text class="label small" x="90" y="215">security defaults</text>

  <rect class="accent" x="480" y="70" width="320" height="210" />
  <text class="label bold" x="510" y="115">Plugin API</text>
  <text class="label small" x="510" y="145">stable contracts</text>
  <text class="label small" x="510" y="170">component registry</text>
  <text class="label small" x="510" y="195">action hooks</text>
  <text class="label small" x="510" y="220">versioning</text>

  <rect class="good" x="840" y="90" width="300" height="170" />
  <text class="label bold" x="870" y="135">Plugins</text>
  <text class="label small" x="870" y="165">new components</text>
  <text class="label small" x="870" y="190">integrations</text>
  <text class="label small" x="870" y="215">custom workflows</text>

  <path class="arrow" d="M440 175 L480 175" />
  <path class="arrow" d="M800 175 L840 175" />

  <rect class="warn" x="60" y="320" width="1080" height="170" />
  <text class="label bold" x="90" y="365">Guardrails</text>
  <text class="label small" x="90" y="395">capabilities and permissions (data access, network)</text>
  <text class="label small" x="90" y="420">sandbox where possible and isolate failures</text>
  <text class="label small" x="90" y="445">performance budgets and monitoring per plugin</text>
</svg>

