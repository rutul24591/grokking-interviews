<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Architecture of a feature flag management system UI with versioned writes, approvals, audit logs, flag evaluation service, and SDK distribution">
  <title>Feature Flag Management UI Architecture</title>
  <desc>Shows control plane UI performing versioned writes through an approval and audit pipeline; SDKs read via low-latency distribution; observability feeds rollout guardrails.</desc>
  <style>
    .bg{fill:#ffffff}
    .box{fill:#ffffff;stroke:#1f2937;stroke-width:2;rx:14}
    .muted{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:14}
    .accent{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}
    .good{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:14}
    .warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:14}
    .arrow{stroke:#1f2937;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:7 6}
    .label{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;fill:#0f172a;font-size:18px}
    .small{font-size:14px;fill:#334155}
    .bold{font-weight:700}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0b1220}
      .box{fill:#0f172a;stroke:#e5e7eb}
      .muted{fill:#0b1220;stroke:#64748b}
      .accent{fill:#0b1b3a;stroke:#60a5fa}
      .good{fill:#052018;stroke:#34d399}
      .warn{fill:#2a1606;stroke:#fb923c}
      .arrow{stroke:#e5e7eb}
      .label{fill:#e5e7eb}
      .small{fill:#cbd5e1}
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="640"/>

  <rect class="box" x="60" y="80" width="420" height="210"/>
  <text class="label bold" x="90" y="125">Control plane UI</text>
  <text class="label small" x="90" y="155">flag types + validation</text>
  <text class="label small" x="90" y="180">targeting + rollout plans</text>
  <text class="label small" x="90" y="205">RBAC-aware actions</text>
  <text class="label small" x="90" y="230">audit and approvals view</text>
  <text class="label small" x="90" y="255">kill switch surface</text>

  <rect class="accent" x="520" y="80" width="320" height="210"/>
  <text class="label bold" x="550" y="125">Versioned write API</text>
  <text class="label small" x="550" y="155">optimistic concurrency</text>
  <text class="label small" x="550" y="180">environment separation</text>
  <text class="label small" x="550" y="205">policy checks</text>
  <text class="label small" x="550" y="230">idempotency keys</text>
  <text class="label small" x="550" y="255">change events emitted</text>

  <rect class="warn" x="880" y="80" width="260" height="210"/>
  <text class="label bold" x="910" y="125">Approvals + audit</text>
  <text class="label small" x="910" y="155">review gates</text>
  <text class="label small" x="910" y="180">immutable audit log</text>
  <text class="label small" x="910" y="205">diff history</text>
  <text class="label small" x="910" y="230">export for compliance</text>

  <rect class="good" x="60" y="330" width="520" height="150"/>
  <text class="label bold" x="90" y="370">Low-latency distribution</text>
  <text class="label small" x="90" y="400">edge cache / streaming updates</text>
  <text class="label small" x="90" y="425">SDK polling + backoff</text>
  <text class="label small" x="90" y="450">tenant-scoped auth</text>

  <rect class="muted" x="620" y="330" width="520" height="150"/>
  <text class="label bold" x="650" y="370">Observability feedback</text>
  <text class="label small" x="650" y="400">error rate, p95 latency</text>
  <text class="label small" x="650" y="425">release correlation</text>
  <text class="label small" x="650" y="450">guardrails and auto-stop</text>

  <rect class="box" x="60" y="520" width="1080" height="90"/>
  <text class="label bold" x="90" y="560">Why this matters</text>
  <text class="label small" x="90" y="585">Control plane writes must be safe and auditable; distribution reads must be fast and resilient.</text>

  <path class="arrow" d="M480 185 L520 185"/>
  <path class="arrow dash" d="M840 185 L880 185"/>
  <path class="arrow" d="M680 290 L680 330"/>
  <path class="arrow dash" d="M320 290 L320 330"/>
</svg>

