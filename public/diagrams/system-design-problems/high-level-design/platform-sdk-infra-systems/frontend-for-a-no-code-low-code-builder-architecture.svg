<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Architecture of a no-code low-code builder frontend with schema store, renderer, operations log, plugins, and persistence">
  <title>No-Code Builder Frontend Architecture</title>
  <desc>Shows normalized schema store, editor canvas and preview renderer, operation log for undo/redo, plugin runtime, and persistence/versioning services.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
    .accent { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .good { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 14; }
    .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .dash { stroke-dasharray: 7 6; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .muted { fill: #0b1220; stroke: #64748b; }
      .accent { fill: #06232a; stroke: #22d3ee; }
      .good { fill: #052018; stroke: #34d399; }
      .warn { fill: #2a140a; stroke: #fb923c; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" width="1200" height="640" />

  <rect class="box" x="60" y="90" width="420" height="210" />
  <text class="label bold" x="90" y="135">Editor shell</text>
  <text class="label small" x="90" y="165">canvas + overlays</text>
  <text class="label small" x="90" y="190">component tree</text>
  <text class="label small" x="90" y="215">property panels</text>
  <text class="label small" x="90" y="240">preview/runtime mode</text>

  <rect class="accent" x="520" y="70" width="320" height="250" />
  <text class="label bold" x="550" y="115">Project core</text>
  <text class="label small" x="550" y="145">normalized schema store</text>
  <text class="label small" x="550" y="170">validation + migrations</text>
  <text class="label small" x="550" y="195">operation log (undo/redo)</text>
  <text class="label small" x="550" y="220">incremental renderer</text>

  <rect class="good" x="880" y="90" width="260" height="210" />
  <text class="label bold" x="910" y="135">Persistence</text>
  <text class="label small" x="910" y="165">version history</text>
  <text class="label small" x="910" y="190">checkpoints</text>
  <text class="label small" x="910" y="215">publish artifacts</text>

  <path class="arrow" d="M480 195 L520 195" />
  <path class="arrow" d="M840 195 L880 195" />

  <rect class="muted" x="60" y="350" width="520" height="210" />
  <text class="label bold" x="90" y="395">Plugins</text>
  <text class="label small" x="90" y="425">component catalog</text>
  <text class="label small" x="90" y="450">actions and workflows</text>
  <text class="label small" x="90" y="475">integrations</text>
  <text class="label small" x="90" y="500">capabilities + permissions</text>

  <rect class="warn" x="620" y="350" width="520" height="210" />
  <text class="label bold" x="650" y="395">Safety and operability</text>
  <text class="label small" x="650" y="425">sandbox and isolate failures</text>
  <text class="label small" x="650" y="450">performance budgets</text>
  <text class="label small" x="650" y="475">telemetry and audit</text>
  <text class="label small" x="650" y="500">secure publish pipeline</text>

  <path class="arrow dash" d="M650 320 L650 350" />
</svg>

