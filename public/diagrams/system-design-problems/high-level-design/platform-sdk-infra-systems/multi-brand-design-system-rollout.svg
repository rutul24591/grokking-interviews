<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Rollout and deprecation workflow for a shared design system across many applications">
  <title>Rollout and Deprecation Workflow</title>
  <desc>Shows pinned major versions, compatible minors, deprecation windows, adoption tracking, and rollback lever.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
    .accent { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .good { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 14; }
    .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .muted { fill: #0b1220; stroke: #64748b; }
      .accent { fill: #06232a; stroke: #22d3ee; }
      .good { fill: #052018; stroke: #34d399; }
      .warn { fill: #2a140a; stroke: #fb923c; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" width="1200" height="560" />

  <rect class="box" x="60" y="90" width="340" height="160" />
  <text class="label bold" x="90" y="135">Major versions</text>
  <text class="label small" x="90" y="165">apps pin v1 or v2</text>
  <text class="label small" x="90" y="190">breaking changes only in majors</text>
  <text class="label small" x="90" y="215">long deprecation window</text>

  <rect class="good" x="440" y="90" width="340" height="160" />
  <text class="label bold" x="470" y="135">Minor releases</text>
  <text class="label small" x="470" y="165">backwards compatible</text>
  <text class="label small" x="470" y="190">security and a11y fixes</text>
  <text class="label small" x="470" y="215">telemetry by version</text>

  <rect class="accent" x="820" y="90" width="320" height="160" />
  <text class="label bold" x="850" y="135">Adoption tracking</text>
  <text class="label small" x="850" y="165">who is on which version</text>
  <text class="label small" x="850" y="190">exceptions and variants</text>
  <text class="label small" x="850" y="215">migration status</text>

  <path class="arrow" d="M400 170 L440 170" />
  <path class="arrow" d="M780 170 L820 170" />

  <rect class="warn" x="60" y="320" width="1080" height="160" />
  <text class="label bold" x="90" y="365">Rollback lever</text>
  <text class="label small" x="90" y="395">if regressions spike, pause rollout or roll back the served minor version</text>
  <text class="label small" x="90" y="420">requires compatibility discipline and monitoring</text>
</svg>

