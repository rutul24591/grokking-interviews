<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Staged rollout plan for feature flags with gates, health checks, approvals, and emergency kill switch">
  <title>Staged Rollout Plan with Guardrails</title>
  <desc>Shows a rollout plan progressing from internal users to small percentage, then larger, gated by health metrics and approvals, with a kill switch path.</desc>
  <style>
    .bg{fill:#ffffff}
    .box{fill:#ffffff;stroke:#1f2937;stroke-width:2;rx:14}
    .accent{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}
    .good{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:14}
    .warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:14}
    .bad{fill:#fef2f2;stroke:#dc2626;stroke-width:2;rx:14}
    .arrow{stroke:#1f2937;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:7 6}
    .label{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;fill:#0f172a;font-size:18px}
    .small{font-size:14px;fill:#334155}
    .bold{font-weight:700}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0b1220}
      .box{fill:#0f172a;stroke:#e5e7eb}
      .accent{fill:#0b1b3a;stroke:#60a5fa}
      .good{fill:#052018;stroke:#34d399}
      .warn{fill:#2a1606;stroke:#fb923c}
      .bad{fill:#2a0f12;stroke:#f87171}
      .arrow{stroke:#e5e7eb}
      .label{fill:#e5e7eb}
      .small{fill:#cbd5e1}
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="640"/>

  <text class="label bold" x="60" y="70">Rollout should be a plan, not a toggle</text>

  <rect class="accent" x="60" y="110" width="250" height="110"/>
  <text class="label bold" x="90" y="150">Step 1</text>
  <text class="label small" x="90" y="175">internal users</text>
  <text class="label small" x="90" y="198">approve: team lead</text>

  <rect class="accent" x="330" y="110" width="250" height="110"/>
  <text class="label bold" x="360" y="150">Step 2</text>
  <text class="label small" x="360" y="175">1% canary</text>
  <text class="label small" x="360" y="198">gate: error budget</text>

  <rect class="accent" x="600" y="110" width="250" height="110"/>
  <text class="label bold" x="630" y="150">Step 3</text>
  <text class="label small" x="630" y="175">10% rollout</text>
  <text class="label small" x="630" y="198">gate: p95 latency</text>

  <rect class="good" x="870" y="110" width="270" height="110"/>
  <text class="label bold" x="900" y="150">Step 4</text>
  <text class="label small" x="900" y="175">100% release</text>
  <text class="label small" x="900" y="198">post-checks</text>

  <rect class="warn" x="60" y="260" width="780" height="160"/>
  <text class="label bold" x="90" y="300">Guardrails the UI must enforce</text>
  <text class="label small" x="90" y="330">Required owner, environment scoping, and staged steps for production</text>
  <text class="label small" x="90" y="355">Health signals shown per step with explicit thresholds and timers</text>
  <text class="label small" x="90" y="380">Auto-stop option plus manual override with audit trail</text>

  <rect class="bad" x="870" y="260" width="270" height="160"/>
  <text class="label bold" x="900" y="300">Kill switch</text>
  <text class="label small" x="900" y="330">global OFF override</text>
  <text class="label small" x="900" y="355">strong confirm</text>
  <text class="label small" x="900" y="380">instant audit record</text>

  <rect class="box" x="60" y="460" width="1080" height="140"/>
  <text class="label bold" x="90" y="500">Trade-off</text>
  <text class="label small" x="90" y="530">More gates reduce risk but slow delivery; the UI should make safe paths fast and unsafe paths hard.</text>

  <path class="arrow" d="M310 165 L330 165"/>
  <path class="arrow" d="M580 165 L600 165"/>
  <path class="arrow" d="M850 165 L870 165"/>
  <path class="arrow dash" d="M1005 220 L1005 260"/>
</svg>

