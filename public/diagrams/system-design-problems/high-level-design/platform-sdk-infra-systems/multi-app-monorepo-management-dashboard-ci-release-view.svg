<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="CI and release readiness dashboard model showing entity pages, failing owners, flakiness, retries, and gated release decisions">
  <title>CI and Release Readiness View</title>
  <desc>Shows how CI outcomes are summarized into actions: owner routing, flakiness signals, safe retries, and auditable release gates.</desc>
  <style>
    .bg{fill:#ffffff}
    .box{fill:#ffffff;stroke:#1f2937;stroke-width:2;rx:14}
    .muted{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:14}
    .accent{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}
    .good{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:14}
    .warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:14}
    .bad{fill:#fef2f2;stroke:#dc2626;stroke-width:2;rx:14}
    .arrow{stroke:#1f2937;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:7 6}
    .label{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;fill:#0f172a;font-size:18px}
    .small{font-size:14px;fill:#334155}
    .bold{font-weight:700}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0b1220}
      .box{fill:#0f172a;stroke:#e5e7eb}
      .muted{fill:#0b1220;stroke:#64748b}
      .accent{fill:#0b1b3a;stroke:#60a5fa}
      .good{fill:#052018;stroke:#34d399}
      .warn{fill:#2a1606;stroke:#fb923c}
      .bad{fill:#2a0f12;stroke:#f87171}
      .arrow{stroke:#e5e7eb}
      .label{fill:#e5e7eb}
      .small{fill:#cbd5e1}
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="640"/>

  <text class="label bold" x="60" y="70">Turn CI data into decisions</text>

  <rect class="accent" x="60" y="110" width="360" height="140"/>
  <text class="label bold" x="90" y="150">Entity page</text>
  <text class="label small" x="90" y="178">package or app</text>
  <text class="label small" x="90" y="202">owners and criticality</text>
  <text class="label small" x="90" y="226">latest change context</text>

  <rect class="bad" x="450" y="110" width="330" height="140"/>
  <text class="label bold" x="480" y="150">Failures</text>
  <text class="label small" x="480" y="178">tests and builds failing</text>
  <text class="label small" x="480" y="202">route to owner teams</text>
  <text class="label small" x="480" y="226">error fingerprinting</text>

  <rect class="warn" x="810" y="110" width="330" height="140"/>
  <text class="label bold" x="840" y="150">Flakiness</text>
  <text class="label small" x="840" y="178">retry history</text>
  <text class="label small" x="840" y="202">quarantine signals</text>
  <text class="label small" x="840" y="226">confidence score</text>

  <rect class="good" x="60" y="290" width="520" height="150"/>
  <text class="label bold" x="90" y="330">Safe actions</text>
  <text class="label small" x="90" y="360">bounded retries with audit</text>
  <text class="label small" x="90" y="385">rerun only impacted checks</text>
  <text class="label small" x="90" y="410">link to failing owners</text>

  <rect class="muted" x="620" y="290" width="520" height="150"/>
  <text class="label bold" x="650" y="330">Release gate</text>
  <text class="label small" x="650" y="360">policy checks and approvals</text>
  <text class="label small" x="650" y="385">freshness and confidence required</text>
  <text class="label small" x="650" y="410">override with audit trail</text>

  <rect class="box" x="60" y="470" width="1080" height="140"/>
  <text class="label bold" x="90" y="510">Trade-off</text>
  <text class="label small" x="90" y="540">More gates reduce incidents but slow releases; make safe defaults easy and risky overrides explicit and auditable.</text>

  <path class="arrow" d="M420 180 L450 180"/>
  <path class="arrow" d="M780 180 L810 180"/>
  <path class="arrow dash" d="M615 250 L615 290"/>
  <path class="arrow dash" d="M900 250 L900 290"/>
</svg>

