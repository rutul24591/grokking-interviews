<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Explainable feature flag targeting and evaluation trace showing segments, rules, overrides, and a why view">
  <title>Explainable Targeting and Evaluation Trace</title>
  <desc>Shows a structured rule builder and an evaluation explanation path that reveals which rule matched for a user and why.</desc>
  <style>
    .bg{fill:#ffffff}
    .box{fill:#ffffff;stroke:#1f2937;stroke-width:2;rx:14}
    .muted{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:14}
    .accent{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}
    .good{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:14}
    .arrow{stroke:#1f2937;stroke-width:2.5;fill:none}
    .label{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;fill:#0f172a;font-size:18px}
    .small{font-size:14px;fill:#334155}
    .bold{font-weight:700}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0b1220}
      .box{fill:#0f172a;stroke:#e5e7eb}
      .muted{fill:#0b1220;stroke:#64748b}
      .accent{fill:#0b1b3a;stroke:#60a5fa}
      .good{fill:#052018;stroke:#34d399}
      .arrow{stroke:#e5e7eb}
      .label{fill:#e5e7eb}
      .small{fill:#cbd5e1}
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="640"/>

  <rect class="box" x="60" y="80" width="520" height="240"/>
  <text class="label bold" x="90" y="125">Rule model (constrained, explainable)</text>
  <text class="label small" x="90" y="155">Environment: production</text>
  <text class="label small" x="90" y="180">Override: userId in allowlist → ON</text>
  <text class="label small" x="90" y="205">Segment: beta-users → 10%</text>
  <text class="label small" x="90" y="230">Rule: country = US AND appVersion ≥ X → 25%</text>
  <text class="label small" x="90" y="255">Default: OFF</text>

  <rect class="accent" x="620" y="80" width="520" height="240"/>
  <text class="label bold" x="650" y="125">“Explain evaluation” view</text>
  <text class="label small" x="650" y="155">Input: userId, env, attributes, timestamp</text>
  <text class="label small" x="650" y="180">Step 1: check overrides (matched? yes/no)</text>
  <text class="label small" x="650" y="205">Step 2: check segments (matched? yes/no)</text>
  <text class="label small" x="650" y="230">Step 3: check rules in priority order</text>
  <text class="label small" x="650" y="255">Output: value + matched rule id + reason</text>

  <rect class="good" x="60" y="360" width="1080" height="200"/>
  <text class="label bold" x="90" y="405">Why this prevents incidents</text>
  <text class="label small" x="90" y="435">Deterministic “why” reduces time-to-diagnose when users report wrong variants</text>
  <text class="label small" x="90" y="460">Constrained builders reduce syntax errors and ambiguous precedence</text>
  <text class="label small" x="90" y="485">Explicit priority order plus version history makes changes reviewable</text>
  <text class="label small" x="90" y="510">UI can warn when rules are risky (high-cardinality attributes, broad matches)</text>

  <path class="arrow" d="M580 200 L620 200"/>
</svg>

