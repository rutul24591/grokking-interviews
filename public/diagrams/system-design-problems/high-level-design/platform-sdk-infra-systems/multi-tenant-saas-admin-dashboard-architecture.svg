<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Architecture of a multi-tenant SaaS admin dashboard with tenant scoping, RBAC, audit logs, and async jobs">
  <title>Multi-Tenant Admin Dashboard Architecture</title>
  <desc>Shows admin UI with tenant context and permissions, API gateway with authZ and tenant routing, tenant-scoped storage, audit log pipeline, and async job system.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
    .accent { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .good { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 14; }
    .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .muted { fill: #0b1220; stroke: #64748b; }
      .accent { fill: #06232a; stroke: #22d3ee; }
      .good { fill: #052018; stroke: #34d399; }
      .warn { fill: #2a140a; stroke: #fb923c; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="640" />

  <rect class="box" x="60" y="90" width="420" height="200" />
  <text class="label bold" x="90" y="135">Admin UI</text>
  <text class="label small" x="90" y="165">tenant context</text>
  <text class="label small" x="90" y="190">permission-aware navigation</text>
  <text class="label small" x="90" y="215">data tables + filters</text>
  <text class="label small" x="90" y="240">bulk jobs UI</text>

  <rect class="accent" x="520" y="90" width="300" height="200" />
  <text class="label bold" x="550" y="135">API gateway</text>
  <text class="label small" x="550" y="165">authN + authZ</text>
  <text class="label small" x="550" y="190">tenant scoping</text>
  <text class="label small" x="550" y="215">rate limits</text>
  <text class="label small" x="550" y="240">audit hooks</text>

  <rect class="good" x="860" y="70" width="280" height="110" />
  <text class="label bold" x="890" y="115">Tenant data</text>
  <text class="label small" x="890" y="145">scoped storage</text>

  <rect class="muted" x="860" y="200" width="280" height="110" />
  <text class="label bold" x="890" y="245">Audit log</text>
  <text class="label small" x="890" y="275">immutable history</text>

  <rect class="muted" x="860" y="330" width="280" height="110" />
  <text class="label bold" x="890" y="375">Job system</text>
  <text class="label small" x="890" y="405">bulk ops + exports</text>

  <path class="arrow" d="M480 190 L520 190" />
  <path class="arrow" d="M820 150 L860 125" />
  <path class="arrow" d="M820 190 L860 255" />
  <path class="arrow" d="M820 230 L860 385" />

  <rect class="warn" x="60" y="340" width="760" height="200" />
  <text class="label bold" x="90" y="385">Safety controls</text>
  <text class="label small" x="90" y="415">confirmations for destructive actions</text>
  <text class="label small" x="90" y="440">idempotency for mutations</text>
  <text class="label small" x="90" y="465">least privilege roles</text>
  <text class="label small" x="90" y="490">audit entries for all privileged changes</text>
</svg>

