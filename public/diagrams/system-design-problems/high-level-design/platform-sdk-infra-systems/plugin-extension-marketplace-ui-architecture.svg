<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Architecture for a plugin marketplace UI showing catalog search, metadata, install jobs, policy and scanning gates, and runtime sandbox enforcement">
  <title>Plugin Marketplace Architecture</title>
  <desc>Shows read-heavy discovery through search and cache, and write-heavy installs through job orchestration with trust and policy gates. Runtime enforces permissions.</desc>
  <style>
    .bg{fill:#ffffff}
    .box{fill:#ffffff;stroke:#1f2937;stroke-width:2;rx:14}
    .muted{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:14}
    .accent{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}
    .good{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:14}
    .warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:14}
    .arrow{stroke:#1f2937;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:7 6}
    .label{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;fill:#0f172a;font-size:18px}
    .small{font-size:14px;fill:#334155}
    .bold{font-weight:700}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0b1220}
      .box{fill:#0f172a;stroke:#e5e7eb}
      .muted{fill:#0b1220;stroke:#64748b}
      .accent{fill:#0b1b3a;stroke:#60a5fa}
      .good{fill:#052018;stroke:#34d399}
      .warn{fill:#2a1606;stroke:#fb923c}
      .arrow{stroke:#e5e7eb}
      .label{fill:#e5e7eb}
      .small{fill:#cbd5e1}
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="640"/>

  <rect class="box" x="60" y="80" width="420" height="220"/>
  <text class="label bold" x="90" y="125">Marketplace UI</text>
  <text class="label small" x="90" y="155">search + browse + facets</text>
  <text class="label small" x="90" y="180">trust signals + permissions</text>
  <text class="label small" x="90" y="205">tenant state (installed, enabled)</text>
  <text class="label small" x="90" y="230">enterprise approvals</text>
  <text class="label small" x="90" y="255">audit visibility</text>

  <rect class="accent" x="520" y="80" width="320" height="140"/>
  <text class="label bold" x="550" y="125">Catalog + search</text>
  <text class="label small" x="550" y="155">indexed metadata</text>
  <text class="label small" x="550" y="180">ranking + abuse controls</text>
  <text class="label small" x="550" y="205">cache for hot queries</text>

  <rect class="warn" x="520" y="240" width="320" height="180"/>
  <text class="label bold" x="550" y="285">Install job service</text>
  <text class="label small" x="550" y="315">idempotency keys</text>
  <text class="label small" x="550" y="340">progress + retries</text>
  <text class="label small" x="550" y="365">approval state</text>
  <text class="label small" x="550" y="390">event notifications</text>

  <rect class="good" x="880" y="80" width="260" height="150"/>
  <text class="label bold" x="910" y="125">Trust gates</text>
  <text class="label small" x="910" y="155">publisher verification</text>
  <text class="label small" x="910" y="180">signatures</text>
  <text class="label small" x="910" y="205">automated scanning</text>

  <rect class="muted" x="880" y="260" width="260" height="160"/>
  <text class="label bold" x="910" y="305">Policy + audit</text>
  <text class="label small" x="910" y="335">org allowlists</text>
  <text class="label small" x="910" y="360">permission risk tiers</text>
  <text class="label small" x="910" y="385">immutable audit log</text>

  <rect class="box" x="60" y="340" width="420" height="200"/>
  <text class="label bold" x="90" y="385">Host runtime</text>
  <text class="label small" x="90" y="415">sandboxing</text>
  <text class="label small" x="90" y="440">permission enforcement</text>
  <text class="label small" x="90" y="465">kill switch / disable</text>
  <text class="label small" x="90" y="490">telemetry back to UI</text>

  <path class="arrow" d="M480 160 L520 150"/>
  <path class="arrow" d="M480 220 L520 320"/>
  <path class="arrow dash" d="M840 320 L880 330"/>
  <path class="arrow dash" d="M840 150 L880 150"/>
  <path class="arrow" d="M680 420 L480 440"/>
</svg>

