<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Bulk job workflow for admin dashboard showing submission, job processing, progress, and partial failures">
  <title>Bulk Jobs Workflow</title>
  <desc>Shows bulk action submission as a job, chunked processing, progress reporting, and partial failure remediation.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
    .accent { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 14; }
    .good { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .muted { fill: #0b1220; stroke: #64748b; }
      .accent { fill: #06232a; stroke: #22d3ee; }
      .warn { fill: #2a140a; stroke: #fb923c; }
      .good { fill: #052018; stroke: #34d399; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="560" />

  <rect class="box" x="60" y="80" width="360" height="150" />
  <text class="label bold" x="90" y="125">Submit bulk action</text>
  <text class="label small" x="90" y="155">idempotency key</text>
  <text class="label small" x="90" y="180">dry-run preview (optional)</text>
  <text class="label small" x="90" y="205">job created</text>

  <rect class="accent" x="460" y="80" width="340" height="150" />
  <text class="label bold" x="490" y="125">Job processing</text>
  <text class="label small" x="490" y="155">chunked execution</text>
  <text class="label small" x="490" y="180">retries per item</text>
  <text class="label small" x="490" y="205">audit entries</text>

  <rect class="good" x="840" y="80" width="300" height="150" />
  <text class="label bold" x="870" y="125">Progress UI</text>
  <text class="label small" x="870" y="155">percent complete</text>
  <text class="label small" x="870" y="180">success/failure counts</text>
  <text class="label small" x="870" y="205">download report</text>

  <path class="arrow" d="M420 155 L460 155" />
  <path class="arrow" d="M800 155 L840 155" />

  <rect class="warn" x="60" y="300" width="1080" height="180" />
  <text class="label bold" x="90" y="345">Partial failure handling</text>
  <text class="label small" x="90" y="375">report which items failed and why</text>
  <text class="label small" x="90" y="400">provide retry for failed subset</text>
  <text class="label small" x="90" y="425">avoid reapplying successful items</text>
</svg>

