<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Rollback and safe release architecture for a hosting platform dashboard showing immutable artifacts, traffic splitting, health signals, and abort conditions">
  <title>Rollback and Safe Release Control Plane</title>
  <desc>Shows immutable deployment artifacts, an environment pointer, traffic router for canary rollout, health signals feeding gates, and instant rollback as a pointer flip.</desc>
  <style>
    .bg{fill:#ffffff}
    .box{fill:#ffffff;stroke:#1f2937;stroke-width:2;rx:14}
    .accent{fill:#eff6ff;stroke:#2563eb;stroke-width:2;rx:14}
    .good{fill:#ecfdf5;stroke:#059669;stroke-width:2;rx:14}
    .warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:14}
    .muted{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:14}
    .arrow{stroke:#1f2937;stroke-width:2.5;fill:none}
    .dash{stroke-dasharray:7 6}
    .label{font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;fill:#0f172a;font-size:18px}
    .small{font-size:14px;fill:#334155}
    .bold{font-weight:700}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0b1220}
      .box{fill:#0f172a;stroke:#e5e7eb}
      .accent{fill:#0b1b3a;stroke:#60a5fa}
      .good{fill:#052018;stroke:#34d399}
      .warn{fill:#2a1606;stroke:#fb923c}
      .muted{fill:#0b1220;stroke:#64748b}
      .arrow{stroke:#e5e7eb}
      .label{fill:#e5e7eb}
      .small{fill:#cbd5e1}
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="640"/>

  <rect class="box" x="60" y="90" width="360" height="170"/>
  <text class="label bold" x="90" y="130">Immutable artifacts</text>
  <text class="label small" x="90" y="160">A (known good)</text>
  <text class="label small" x="90" y="185">B (candidate)</text>
  <text class="label small" x="90" y="210">config snapshot per artifact</text>
  <text class="label small" x="90" y="235">retention for rollback</text>

  <rect class="accent" x="460" y="90" width="320" height="170"/>
  <text class="label bold" x="490" y="130">Environment pointer</text>
  <text class="label small" x="490" y="160">production points to artifact</text>
  <text class="label small" x="490" y="185">promotion is a pointer update</text>
  <text class="label small" x="490" y="210">rollback is pointer flip</text>
  <text class="label small" x="490" y="235">audit every change</text>

  <rect class="warn" x="820" y="90" width="320" height="170"/>
  <text class="label bold" x="850" y="130">Traffic router</text>
  <text class="label small" x="850" y="160">0% → 1% → 10% → 100%</text>
  <text class="label small" x="850" y="185">sticky routing per user</text>
  <text class="label small" x="850" y="210">rapid abort supported</text>
  <text class="label small" x="850" y="235">status visible in UI</text>

  <rect class="good" x="60" y="300" width="520" height="150"/>
  <text class="label bold" x="90" y="340">Health signals (gates)</text>
  <text class="label small" x="90" y="370">error rate, p95 latency, saturation</text>
  <text class="label small" x="90" y="395">synthetic checks + live canary metrics</text>
  <text class="label small" x="90" y="420">clear threshold contract per env</text>

  <rect class="muted" x="620" y="300" width="520" height="150"/>
  <text class="label bold" x="650" y="340">Operator workflow (UI)</text>
  <text class="label small" x="650" y="370">change traffic step with confirmation</text>
  <text class="label small" x="650" y="395">auto-abort option when thresholds trip</text>
  <text class="label small" x="650" y="420">one-click rollback to last good artifact</text>

  <rect class="box" x="60" y="490" width="1080" height="110"/>
  <text class="label bold" x="90" y="530">Key trade-off</text>
  <text class="label small" x="90" y="560">Pointer flips are fast and safe but require strong immutability and retention; rebuild rollbacks are slower and risk drift.</text>

  <path class="arrow" d="M420 175 L460 175"/>
  <path class="arrow" d="M780 175 L820 175"/>
  <path class="arrow dash" d="M320 260 L320 300"/>
  <path class="arrow dash" d="M900 260 L900 300"/>
</svg>

