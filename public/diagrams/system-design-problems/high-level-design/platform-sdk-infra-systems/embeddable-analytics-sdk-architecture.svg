<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Architecture of an embeddable analytics SDK with capture, consent, batching, ingestion, and downstream pipelines">
  <title>Embeddable Analytics SDK Architecture</title>
  <desc>Shows SDK capture pipeline with consent and sampling, bounded queue and batch sender, ingestion gateway with validation and dedupe, and downstream storage/processing.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
    .accent { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .good { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .dash { stroke-dasharray: 7 6; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .muted { fill: #0b1220; stroke: #64748b; }
      .accent { fill: #06232a; stroke: #22d3ee; }
      .good { fill: #052018; stroke: #34d399; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="640" />

  <rect class="box" x="60" y="90" width="420" height="210" />
  <text class="label bold" x="90" y="135">Customer app + SDK</text>
  <text class="label small" x="90" y="165">event capture</text>
  <text class="label small" x="90" y="190">consent gate + redaction</text>
  <text class="label small" x="90" y="215">sampling + rate limits</text>
  <text class="label small" x="90" y="240">bounded queue</text>
  <text class="label small" x="90" y="265">batch + compress + retry</text>

  <rect class="accent" x="520" y="110" width="300" height="170" />
  <text class="label bold" x="550" y="155">Ingestion gateway</text>
  <text class="label small" x="550" y="185">schema validation</text>
  <text class="label small" x="550" y="210">tenant scoping</text>
  <text class="label small" x="550" y="235">dedupe keys</text>

  <rect class="good" x="860" y="70" width="280" height="110" />
  <text class="label bold" x="890" y="115">Durable store</text>
  <text class="label small" x="890" y="145">raw events</text>

  <rect class="muted" x="860" y="200" width="280" height="110" />
  <text class="label bold" x="890" y="245">Processing</text>
  <text class="label small" x="890" y="275">ETL / aggregation</text>

  <rect class="muted" x="860" y="330" width="280" height="110" />
  <text class="label bold" x="890" y="375">Query</text>
  <text class="label small" x="890" y="405">dashboards / exports</text>

  <path class="arrow" d="M480 205 L520 205" />
  <path class="arrow" d="M820 165 L860 125" />
  <path class="arrow" d="M820 205 L860 255" />
  <path class="arrow" d="M1000 310 L1000 330" />

  <rect class="box" x="60" y="350" width="760" height="200" />
  <text class="label bold" x="90" y="395">Operational controls</text>
  <text class="label small" x="90" y="425">bounded queue caps memory and storage</text>
  <text class="label small" x="90" y="450">drop policy (oldest or priority-based)</text>
  <text class="label small" x="90" y="475">SDK telemetry for drops, retries, latency</text>
  <text class="label small" x="90" y="500">server-driven sampling and throttles</text>

  <path class="arrow dash" d="M670 280 L670 350" />
</svg>

