<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6c63ff"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
    <linearGradient id="bandA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9f9f9"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="bandB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9f0"/>
      <stop offset="100%" stop-color="#fffdf8"/>
    </linearGradient>
    <linearGradient id="bandC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0faf4"/>
      <stop offset="100%" stop-color="#f8fdfb"/>
    </linearGradient>
    <linearGradient id="bandD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0eeff"/>
      <stop offset="100%" stop-color="#f8f7ff"/>
    </linearGradient>
  </defs>

  <rect width="960" height="680" fill="#f5f5f7" rx="12"/>
  <rect width="960" height="52" fill="url(#hdr)" rx="12"/>
  <rect y="40" width="960" height="12" fill="url(#hdr)"/>
  <text x="480" y="33" text-anchor="middle" fill="white" font-size="17" font-weight="700">Admin Audit Logs &amp; Activity Tracking</text>

  <!-- Actors -->
  <rect x="20" y="66" width="100" height="34" rx="6" fill="#374151"/>
  <text x="70" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">App Services</text>

  <rect x="175" y="66" width="90" height="34" rx="6" fill="#8b5cf6"/>
  <text x="220" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Kafka</text>

  <rect x="325" y="66" width="110" height="34" rx="6" fill="#f59e0b"/>
  <text x="380" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Audit Consumer</text>

  <rect x="495" y="66" width="100" height="34" rx="6" fill="#ef4444"/>
  <text x="545" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Elasticsearch</text>

  <rect x="650" y="66" width="100" height="34" rx="6" fill="#10b981"/>
  <text x="700" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">PostgreSQL</text>

  <rect x="810" y="66" width="110" height="34" rx="6" fill="#3b82f6"/>
  <text x="865" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">S3 / Athena</text>

  <!-- Lifelines -->
  <line x1="70" y1="100" x2="70" y2="650" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="220" y1="100" x2="220" y2="650" stroke="#ddd6fe" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="380" y1="100" x2="380" y2="650" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="545" y1="100" x2="545" y2="650" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="700" y1="100" x2="700" y2="650" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="865" y1="100" x2="865" y2="650" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- BAND A: Event Capture + Hash Chain -->
  <rect x="14" y="108" width="932" height="136" fill="url(#bandA)" rx="4"/>
  <text x="22" y="125" fill="#374151" font-size="10" font-weight="700">A · EVENT CAPTURE &amp; TAMPER-EVIDENT HASH CHAIN</text>

  <text x="40" y="142" fill="#374151" font-size="10" font-weight="600">App service: after action commits → fire-and-forget PUBLISH to Kafka audit-events (no latency on main request)</text>
  <text x="40" y="158" fill="#374151" font-size="10">Schema: {eventId, tenantId, ts, actor:{id,name,email,impersonatedBy}, action:{type,category}, resource:{type,id,name}, diff:{before,after}, ipAddress, prevHash, hash}</text>

  <line x1="70" y1="174" x2="212" y2="174" stroke="#374151" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="141" y="168" text-anchor="middle" fill="#374151" font-size="10">PUBLISH audit-events topic (async)</text>

  <line x1="220" y1="188" x2="372" y2="188" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="296" y="182" text-anchor="middle" fill="#374151" font-size="10">consume event</text>

  <line x1="380" y1="202" x2="692" y2="202" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="536" y="196" text-anchor="middle" fill="#374151" font-size="10">SELECT hash WHERE tenantId=X ORDER BY id DESC LIMIT 1 FOR UPDATE</text>

  <line x1="700" y1="216" x2="388" y2="216" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="544" y="210" text-anchor="middle" fill="#374151" font-size="10">prevHash → compute SHA256(prevHash + event content)</text>

  <line x1="380" y1="230" x2="692" y2="230" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="536" y="224" text-anchor="middle" fill="#374151" font-size="10">INSERT audit_events (atomic with hash) → sync Elasticsearch</text>

  <line x1="700" y1="238" x2="857" y2="238" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="778" y="232" text-anchor="middle" fill="#374151" font-size="10">async S3 Parquet write (archival)</text>

  <!-- BAND B: Activity Feed UI -->
  <rect x="14" y="252" width="932" height="124" fill="url(#bandB)" rx="4"/>
  <text x="22" y="269" fill="#f59e0b" font-size="10" font-weight="700">B · ADMIN ACTIVITY FEED UI &amp; SEARCH</text>

  <text x="40" y="286" fill="#374151" font-size="10" font-weight="600">Feed: event type icon (red=auth, orange=admin, blue=mutation) · actor avatar · human description · timestamp · resource link</text>
  <text x="40" y="302" fill="#374151" font-size="10">Impersonation: "Admin Alice (acting as Bob) deleted Contact X" · filter by actor / action type / date range / resource type</text>

  <line x1="70" y1="318" x2="537" y2="318" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="303" y="312" text-anchor="middle" fill="#374151" font-size="10">GET /api/audit-events?filters&amp;cursor → Elasticsearch multi-field query</text>

  <line x1="545" y1="332" x2="78" y2="332" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="311" y="326" text-anchor="middle" fill="#374151" font-size="10">cursor-paginated events → infinite scroll feed</text>

  <line x1="70" y1="352" x2="537" y2="352" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="303" y="346" text-anchor="middle" fill="#374151" font-size="10">SSE /api/audit-events/stream → real-time new events pushed to top (highlighted)</text>

  <text x="40" y="368" fill="#f59e0b" font-size="9">Per-resource history: GET /api/audit-events?resourceType=deal&amp;resourceId=X → chronological change timeline with before/after diffs</text>

  <!-- BAND C: Compliance Export + Tamper Verify -->
  <rect x="14" y="384" width="932" height="124" fill="url(#bandC)" rx="4"/>
  <text x="22" y="401" fill="#10b981" font-size="10" font-weight="700">C · COMPLIANCE EXPORT &amp; TAMPER VERIFICATION</text>

  <line x1="70" y1="411" x2="537" y2="411" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="303" y="405" text-anchor="middle" fill="#374151" font-size="10">POST /api/audit-export {tenantId, dateRange, format:jsonl|soc2|gdpr-sar}</text>

  <line x1="545" y1="425" x2="857" y2="425" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="701" y="419" text-anchor="middle" fill="#374151" font-size="10">recent: Elasticsearch · historical: Athena S3 Parquet query</text>

  <line x1="865" y1="439" x2="553" y2="439" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="709" y="433" text-anchor="middle" fill="#374151" font-size="10">stream → JSONL file → HMAC-SHA256 sign (KMS key)</text>

  <line x1="545" y1="453" x2="857" y2="453" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="701" y="447" text-anchor="middle" fill="#374151" font-size="10">S3 upload → presigned download URL → email + in-app notification</text>

  <!-- Tamper verify -->
  <line x1="70" y1="473" x2="692" y2="473" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="381" y="467" text-anchor="middle" fill="#374151" font-size="10">GET /api/audit-events/verify {tenantId, start, end} → load events, recompute each SHA256</text>

  <line x1="700" y1="487" x2="78" y2="487" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="389" y="481" text-anchor="middle" fill="#374151" font-size="10">{verified:true, chainLength:24801} or {broken:true, atEventId:'evt_xyz'}</text>

  <text x="40" y="499" fill="#10b981" font-size="9">SOC2 package: event counts by category · GDPR SAR: filter by actorId=userId · auditor can verify HMAC with public certificate</text>

  <!-- BAND D: Retention + Archival -->
  <rect x="14" y="516" width="932" height="100" fill="url(#bandD)" rx="4"/>
  <text x="22" y="533" fill="#6c63ff" font-size="10" font-weight="700">D · RETENTION POLICY &amp; S3 ARCHIVAL</text>

  <line x1="380" y1="543" x2="692" y2="543" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="536" y="537" text-anchor="middle" fill="#374151" font-size="10">nightly job: SELECT events WHERE ts &lt; now()-retentionDays</text>

  <line x1="700" y1="557" x2="857" y2="557" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="778" y="551" text-anchor="middle" fill="#374151" font-size="10">write Parquet: s3://audit/{tenantId}/{year}/{month}/</text>

  <line x1="865" y1="571" x2="388" y2="571" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="627" y="565" text-anchor="middle" fill="#374151" font-size="10">S3 confirmed → DELETE from PostgreSQL + remove ES index</text>

  <line x1="380" y1="585" x2="78" y2="585" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="229" y="579" text-anchor="middle" fill="#374151" font-size="10">log deletion audit event (self-referential)</text>

  <text x="40" y="601" fill="#6c63ff" font-size="9">ILM: S3 Standard (90-day hot) → S3-IA (1yr) → Glacier (7yr enterprise) · Glacier retrieval 12h acceptable for compliance</text>
  <text x="40" y="613" fill="#94a3b8" font-size="9">Monthly-partitioned PostgreSQL · ES index rollover at 50GB · read-only after 90-day hot window</text>

  <!-- Metrics -->
  <rect x="14" y="630" width="932" height="36" fill="#111827" rx="6"/>
  <text x="90" y="653" text-anchor="middle" fill="#9ca3af" font-size="10" font-weight="600">Write Latency</text>
  <text x="90" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">0ms (fire-forget)</text>
  <text x="250" y="653" text-anchor="middle" fill="#9ca3af" font-size="10" font-weight="600">Hash Chain</text>
  <text x="250" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">SHA256 per event</text>
  <text x="420" y="653" text-anchor="middle" fill="#9ca3af" font-size="10" font-weight="600">Feed Query (90d)</text>
  <text x="420" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">&lt;2s Elasticsearch</text>
  <text x="610" y="653" text-anchor="middle" fill="#9ca3af" font-size="10" font-weight="600">Historical Query</text>
  <text x="610" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">&lt;30s Athena</text>
  <text x="810" y="653" text-anchor="middle" fill="#9ca3af" font-size="10" font-weight="600">Max Retention</text>
  <text x="810" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">7yr (Glacier)</text>
</svg>
