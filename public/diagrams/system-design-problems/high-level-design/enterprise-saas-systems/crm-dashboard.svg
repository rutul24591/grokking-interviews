<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6c63ff"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6c63ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bandA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0eeff"/>
      <stop offset="100%" stop-color="#f8f7ff"/>
    </linearGradient>
    <linearGradient id="bandB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9f0"/>
      <stop offset="100%" stop-color="#fffdf8"/>
    </linearGradient>
    <linearGradient id="bandC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0faf4"/>
      <stop offset="100%" stop-color="#f8fdfb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="680" fill="#f4f2fb" rx="12"/>

  <!-- Header -->
  <rect width="960" height="52" fill="url(#hdr)" rx="12"/>
  <rect y="40" width="960" height="12" fill="url(#hdr)"/>
  <text x="480" y="33" text-anchor="middle" fill="white" font-size="17" font-weight="700">CRM Dashboard — Salesforce-like</text>

  <!-- Actor boxes -->
  <!-- Browser -->
  <rect x="30" y="66" width="100" height="34" rx="6" fill="#6c63ff"/>
  <text x="80" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Browser</text>
  <!-- Next.js SSR -->
  <rect x="175" y="66" width="110" height="34" rx="6" fill="#8b5cf6"/>
  <text x="230" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Next.js SSR</text>
  <!-- Record Service -->
  <rect x="335" y="66" width="110" height="34" rx="6" fill="#f59e0b"/>
  <text x="390" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Record Svc</text>
  <!-- Pipeline Service -->
  <rect x="490" y="66" width="110" height="34" rx="6" fill="#10b981"/>
  <text x="545" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Pipeline Svc</text>
  <!-- Search -->
  <rect x="645" y="66" width="110" height="34" rx="6" fill="#ef4444"/>
  <text x="700" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Elasticsearch</text>
  <!-- Redis -->
  <rect x="800" y="66" width="110" height="34" rx="6" fill="#3b82f6"/>
  <text x="855" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Redis / DB</text>

  <!-- Lifelines -->
  <line x1="80" y1="100" x2="80" y2="650" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="230" y1="100" x2="230" y2="650" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="390" y1="100" x2="390" y2="650" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="545" y1="100" x2="545" y2="650" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="700" y1="100" x2="700" y2="650" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="855" y1="100" x2="855" y2="650" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- === BAND A: Record Page Load === -->
  <rect x="14" y="108" width="932" height="130" fill="url(#bandA)" rx="4"/>
  <text x="22" y="125" fill="#6c63ff" font-size="10" font-weight="700">A · RECORD PAGE</text>

  <line x1="80" y1="135" x2="222" y2="135" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="151" y="129" text-anchor="middle" fill="#374151" font-size="10">GET /contacts/{id} (SSR)</text>

  <line x1="230" y1="149" x2="382" y2="149" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="306" y="143" text-anchor="middle" fill="#374151" font-size="10">GET /contacts/{id}/full</text>

  <line x1="390" y1="163" x2="847" y2="163" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="619" y="157" text-anchor="middle" fill="#374151" font-size="10">JOIN contact + companies + deals + activities</text>

  <line x1="855" y1="177" x2="398" y2="177" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="627" y="171" text-anchor="middle" fill="#374151" font-size="10">enriched response &lt;800ms</text>

  <line x1="390" y1="191" x2="238" y2="191" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="314" y="185" text-anchor="middle" fill="#374151" font-size="10">SSR: full HTML with all fields</text>

  <line x1="230" y1="205" x2="88" y2="205" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="159" y="199" text-anchor="middle" fill="#374151" font-size="10">HTML page → 800ms render</text>

  <text x="40" y="228" fill="#6c63ff" font-size="9">Inline Edit: click field → PATCH /api/contacts/{id} {field,val} → optimistic update → 409 = merge dialog</text>

  <!-- === BAND B: Pipeline Kanban === -->
  <rect x="14" y="246" width="932" height="120" fill="url(#bandB)" rx="4"/>
  <text x="22" y="263" fill="#f59e0b" font-size="10" font-weight="700">B · PIPELINE KANBAN</text>

  <line x1="80" y1="273" x2="537" y2="273" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="308" y="267" text-anchor="middle" fill="#374151" font-size="10">GET /api/pipeline (all deals minimal fields)</text>

  <line x1="545" y1="287" x2="847" y2="287" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="696" y="281" text-anchor="middle" fill="#374151" font-size="10">SELECT id title stage owner value closeDate</text>

  <line x1="855" y1="301" x2="553" y2="301" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="704" y="295" text-anchor="middle" fill="#374151" font-size="10">200 deals &lt;50KB JSON</text>

  <line x1="545" y1="315" x2="88" y2="315" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="316" y="309" text-anchor="middle" fill="#374151" font-size="10">group by stage → kanban columns (client-side filter instant)</text>

  <text x="40" y="336" fill="#f59e0b" font-size="9">Drag-drop: POST /api/deals/{id}/stage → Kafka deal.stage_changed → automations → SSE: all viewers updated &lt;2s</text>
  <text x="40" y="352" fill="#94a3b8" font-size="9">Virtual scroll within column if &gt;20 cards · Optimistic move → snap back on error</text>

  <!-- === BAND C: Activity Timeline + Search === -->
  <rect x="14" y="374" width="932" height="120" fill="url(#bandC)" rx="4"/>
  <text x="22" y="391" fill="#10b981" font-size="10" font-weight="700">C · ACTIVITY TIMELINE &amp; GLOBAL SEARCH</text>

  <line x1="80" y1="401" x2="382" y2="401" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="231" y="395" text-anchor="middle" fill="#374151" font-size="10">GET /activities?cursor=null limit=20</text>

  <line x1="390" y1="415" x2="847" y2="415" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="619" y="409" text-anchor="middle" fill="#374151" font-size="10">SELECT * ORDER BY ts DESC LIMIT 20</text>

  <line x1="855" y1="429" x2="398" y2="429" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="627" y="423" text-anchor="middle" fill="#374151" font-size="10">20 entries (email call meeting note)</text>

  <!-- Search flow -->
  <line x1="80" y1="449" x2="692" y2="449" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="386" y="443" text-anchor="middle" fill="#374151" font-size="10">POST /api/search {q:'jhon smi', entityTypes:[contact,deal]} debounce 150ms</text>

  <line x1="700" y1="463" x2="88" y2="463" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="394" y="457" text-anchor="middle" fill="#374151" font-size="10">fuzzy results: Contacts(3) Companies(1) Deals(5) → &lt;300ms</text>

  <text x="40" y="480" fill="#10b981" font-size="9">Timeline: virtual scroll · append-only log · paginate with cursor · POST /api/activities for manual log entry</text>

  <!-- === BAND D: Bulk Ops + Presence === -->
  <rect x="14" y="502" width="932" height="120" fill="url(#bandA)" rx="4"/>
  <text x="22" y="519" fill="#8b5cf6" font-size="10" font-weight="700">D · BULK OPERATIONS &amp; COLLABORATION PRESENCE</text>

  <line x1="80" y1="529" x2="382" y2="529" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="231" y="523" text-anchor="middle" fill="#374151" font-size="10">POST /api/bulk {action:reassign_owner, recordIds:[...], payload}</text>

  <line x1="390" y1="543" x2="847" y2="543" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="619" y="537" text-anchor="middle" fill="#374151" font-size="10">async job queue → batches of 100 → progress events</text>

  <line x1="855" y1="557" x2="88" y2="557" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="471" y="551" text-anchor="middle" fill="#374151" font-size="10">SSE /api/bulk/jobs/{id}/stream → {processed:150 total:1000} → progress bar</text>

  <!-- Presence -->
  <line x1="80" y1="577" x2="847" y2="577" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="463" y="571" text-anchor="middle" fill="#374151" font-size="10">SSE /api/presence/records/{id} → SADD viewers:{id} userId TTL 60s → avatar chips</text>

  <line x1="855" y1="591" x2="88" y2="591" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="471" y="586" text-anchor="middle" fill="#374151" font-size="10">"Alice is editing" lock indicator → heartbeat 30s</text>

  <text x="40" y="610" fill="#8b5cf6" font-size="9">Role-based field visibility: field_definitions.roles check client + server · Custom fields schema cached in Zustand on session init</text>

  <!-- Metrics row -->
  <rect x="14" y="630" width="932" height="36" fill="#1e1b4b" rx="6"/>
  <text x="110" y="653" text-anchor="middle" fill="#a5b4fc" font-size="10" font-weight="600">Record Load</text>
  <text x="110" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">&lt;800ms</text>
  <text x="260" y="653" text-anchor="middle" fill="#a5b4fc" font-size="10" font-weight="600">Pipeline Load</text>
  <text x="260" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">&lt;1.5s (200 deals)</text>
  <text x="440" y="653" text-anchor="middle" fill="#a5b4fc" font-size="10" font-weight="600">Search Latency</text>
  <text x="440" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">&lt;300ms (debounced)</text>
  <text x="640" y="653" text-anchor="middle" fill="#a5b4fc" font-size="10" font-weight="600">Stage Change</text>
  <text x="640" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">&lt;200ms optimistic</text>
  <text x="830" y="653" text-anchor="middle" fill="#a5b4fc" font-size="10" font-weight="600">Presence TTL</text>
  <text x="830" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">60s heartbeat</text>
</svg>
