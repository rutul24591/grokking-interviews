<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6c63ff"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bandA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8faff"/>
    </linearGradient>
    <linearGradient id="bandB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0faf4"/>
      <stop offset="100%" stop-color="#f8fdfb"/>
    </linearGradient>
    <linearGradient id="bandC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9f0"/>
      <stop offset="100%" stop-color="#fffdf8"/>
    </linearGradient>
    <linearGradient id="bandD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0eeff"/>
      <stop offset="100%" stop-color="#f8f7ff"/>
    </linearGradient>
  </defs>

  <rect width="960" height="680" fill="#f0f6ff" rx="12"/>
  <rect width="960" height="52" fill="url(#hdr)" rx="12"/>
  <rect y="40" width="960" height="12" fill="url(#hdr)"/>
  <text x="480" y="33" text-anchor="middle" fill="white" font-size="17" font-weight="700">Reporting &amp; Analytics Dashboard</text>

  <!-- Actors -->
  <rect x="20" y="66" width="90" height="34" rx="6" fill="#1d4ed8"/>
  <text x="65" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Browser</text>

  <rect x="160" y="66" width="110" height="34" rx="6" fill="#6c63ff"/>
  <text x="215" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Query Service</text>

  <rect x="325" y="66" width="100" height="34" rx="6" fill="#ef4444"/>
  <text x="375" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Redis Cache</text>

  <rect x="480" y="66" width="110" height="34" rx="6" fill="#10b981"/>
  <text x="535" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">ClickHouse</text>

  <rect x="645" y="66" width="100" height="34" rx="6" fill="#f59e0b"/>
  <text x="695" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">S3 / Athena</text>

  <rect x="800" y="66" width="120" height="34" rx="6" fill="#8b5cf6"/>
  <text x="860" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Scheduler/Puppeteer</text>

  <!-- Lifelines -->
  <line x1="65" y1="100" x2="65" y2="650" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="215" y1="100" x2="215" y2="650" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="375" y1="100" x2="375" y2="650" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="535" y1="100" x2="535" y2="650" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="695" y1="100" x2="695" y2="650" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="860" y1="100" x2="860" y2="650" stroke="#ddd6fe" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- BAND A: Query Builder + Caching -->
  <rect x="14" y="108" width="932" height="136" fill="url(#bandA)" rx="4"/>
  <text x="22" y="125" fill="#1d4ed8" font-size="10" font-weight="700">A · VISUAL QUERY BUILDER &amp; RESULT CACHE</text>

  <text x="40" y="142" fill="#374151" font-size="10" font-weight="600">Schema browser: drag dimensions (group-by) + metrics (SUM AVG COUNT) + filters + date range → query spec JSON</text>
  <text x="40" y="158" fill="#374151" font-size="10">SQL preview panel (read-only) · tenantId injected server-side (never from client) · column allowlist validation</text>

  <line x1="65" y1="174" x2="207" y2="174" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="136" y="168" text-anchor="middle" fill="#374151" font-size="10">POST /api/reports/query {spec, tenantId}</text>

  <line x1="215" y1="188" x2="367" y2="188" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="291" y="182" text-anchor="middle" fill="#374151" font-size="10">check Redis SHA256(spec+tenantId) TTL 15min</text>

  <line x1="375" y1="202" x2="223" y2="202" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="299" y="196" text-anchor="middle" fill="#374151" font-size="10">CACHE HIT: return JSON &lt;5ms</text>

  <line x1="375" y1="216" x2="527" y2="216" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="451" y="210" text-anchor="middle" fill="#374151" font-size="10">CACHE MISS: generate SQL + execute ClickHouse</text>

  <line x1="535" y1="230" x2="383" y2="230" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="459" y="224" text-anchor="middle" fill="#374151" font-size="10">results → SET cache TTL 15min → return to client</text>

  <text x="40" y="236" fill="#1d4ed8" font-size="9">Timeout: 30s → cancel query + partial results indicator · cache warming: background job pre-runs popular reports before TTL expires</text>

  <!-- BAND B: Multi-tenant + Query Optimization -->
  <rect x="14" y="252" width="932" height="116" fill="url(#bandB)" rx="4"/>
  <text x="22" y="269" fill="#10b981" font-size="10" font-weight="700">B · MULTI-TENANT ISOLATION &amp; QUERY OPTIMIZATION</text>

  <text x="40" y="286" fill="#374151" font-size="10" font-weight="600">SQL generation: mandatory WHERE tenant_id = '{currentTenantId}' injected before execution (never overridable)</text>
  <text x="40" y="302" fill="#374151" font-size="10">Parameterized queries · column allowlist (no arbitrary SQL injection) · SELECT only (no DML/DDL)</text>

  <line x1="215" y1="318" x2="527" y2="318" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="371" y="312" text-anchor="middle" fill="#374151" font-size="10">check materialized view registry: does spec match pre-agg view?</text>

  <line x1="535" y1="332" x2="223" y2="332" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="379" y="326" text-anchor="middle" fill="#374151" font-size="10">YES: rewrite to use daily_summary → &lt;100ms</text>

  <line x1="535" y1="346" x2="223" y2="346" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr-orange)"/>
  <text x="379" y="340" text-anchor="middle" fill="#374151" font-size="10">NO: raw ClickHouse scan → columnar parallel exec → 2-30s</text>

  <text x="40" y="358" fill="#10b981" font-size="9">CDC pipeline: Debezium → Kafka → ClickHouse writer · hourly refresh cycle · cache invalidation after each warehouse refresh</text>

  <!-- BAND C: Dashboard Layout + Scheduled Delivery -->
  <rect x="14" y="376" width="932" height="128" fill="url(#bandC)" rx="4"/>
  <text x="22" y="393" fill="#f59e0b" font-size="10" font-weight="700">C · DASHBOARD LAYOUT &amp; SCHEDULED DELIVERY</text>

  <text x="40" y="410" fill="#374151" font-size="10" font-weight="600">react-grid-layout: drag widgets, resize via corner handles · each widget: independent query fetch in parallel</text>
  <text x="40" y="426" fill="#374151" font-size="10">Skeleton loader → chart (Recharts: line/bar/funnel/pie/table) · 5-min auto-refresh (cache-first, fresh only on TTL expire)</text>

  <line x1="65" y1="442" x2="207" y2="442" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="136" y="436" text-anchor="middle" fill="#374151" font-size="10">WS realtime KPI: new value 30s push from OLTP</text>

  <line x1="215" y1="456" x2="73" y2="456" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="144" y="450" text-anchor="middle" fill="#374151" font-size="10">KPI widget update instantly</text>

  <!-- Scheduled delivery -->
  <line x1="860" y1="472" x2="543" y2="472" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="702" y="466" text-anchor="middle" fill="#374151" font-size="10">Scheduler: cron scan due deliveries → fresh query execution</text>

  <line x1="535" y1="486" x2="847" y2="486" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="691" y="480" text-anchor="middle" fill="#374151" font-size="10">Puppeteer: render dashboard → wait data-loaded → page.pdf()</text>

  <line x1="860" y1="500" x2="223" y2="500" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="541" y="494" text-anchor="middle" fill="#374151" font-size="10">PDF → SendGrid email · PNG → Slack webhook with summary</text>

  <text x="40" y="516" fill="#f59e0b" font-size="9">Schedules: daily/weekly/monthly/custom cron · Slack: chart PNG via Files API · scheduled queries bypass cache (recipients expect fresh data)</text>

  <!-- BAND D: Export + Analytics -->
  <rect x="14" y="512" width="932" height="104" fill="url(#bandD)" rx="4"/>
  <text x="22" y="529" fill="#6c63ff" font-size="10" font-weight="700">D · ASYNC EXPORT &amp; HISTORICAL ARCHIVAL</text>

  <line x1="65" y1="539" x2="207" y2="539" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="136" y="533" text-anchor="middle" fill="#374151" font-size="10">POST /api/exports {reportId, format:csv|pdf}</text>

  <line x1="215" y1="553" x2="687" y2="553" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="451" y="547" text-anchor="middle" fill="#374151" font-size="10">async job: CSV stream → csv-stringify → S3 · PDF → Puppeteer → S3</text>

  <line x1="695" y1="567" x2="73" y2="567" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="384" y="561" text-anchor="middle" fill="#374151" font-size="10">presigned S3 download URL → in-app notification + email</text>

  <text x="40" y="585" fill="#374151" font-size="10">Historical: recent range → ClickHouse · archived (&gt;90 days) → Athena S3 Parquet query (30s latency acceptable)</text>
  <text x="40" y="601" fill="#94a3b8" font-size="9">Row-level security: tenant_id WHERE injection (belt-and-suspenders with RLS policy at DB layer)</text>

  <!-- Metrics -->
  <rect x="14" y="630" width="932" height="36" fill="#0d1a3a" rx="6"/>
  <text x="90" y="653" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Cache Hit</text>
  <text x="90" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">&lt;5ms</text>
  <text x="240" y="653" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Common Reports</text>
  <text x="240" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">&lt;2s (mat view)</text>
  <text x="410" y="653" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Ad-hoc Timeout</text>
  <text x="410" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">30s cancel</text>
  <text x="590" y="653" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Cache TTL</text>
  <text x="590" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">15min per query</text>
  <text x="760" y="653" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Data Freshness</text>
  <text x="760" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">Hourly CDC refresh</text>
</svg>
