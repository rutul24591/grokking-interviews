<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6c63ff"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bandA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0faf4"/>
      <stop offset="100%" stop-color="#f8fdfb"/>
    </linearGradient>
    <linearGradient id="bandB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9f0"/>
      <stop offset="100%" stop-color="#fffdf8"/>
    </linearGradient>
    <linearGradient id="bandC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0eeff"/>
      <stop offset="100%" stop-color="#f8f7ff"/>
    </linearGradient>
    <linearGradient id="bandD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0f0"/>
      <stop offset="100%" stop-color="#fff8f8"/>
    </linearGradient>
  </defs>

  <rect width="960" height="680" fill="#f3f1f8" rx="12"/>
  <rect width="960" height="52" fill="url(#hdr)" rx="12"/>
  <rect y="40" width="960" height="12" fill="url(#hdr)"/>
  <text x="480" y="33" text-anchor="middle" fill="white" font-size="17" font-weight="700">Project Management Tool — Jira/Asana-like</text>

  <!-- Actor boxes -->
  <rect x="25" y="66" width="100" height="34" rx="6" fill="#0f766e"/>
  <text x="75" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Browser</text>

  <rect x="170" y="66" width="110" height="34" rx="6" fill="#6c63ff"/>
  <text x="225" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Zustand Store</text>

  <rect x="330" y="66" width="110" height="34" rx="6" fill="#f59e0b"/>
  <text x="385" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Issue Service</text>

  <rect x="490" y="66" width="100" height="34" rx="6" fill="#8b5cf6"/>
  <text x="540" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Kafka</text>

  <rect x="640" y="66" width="100" height="34" rx="6" fill="#ef4444"/>
  <text x="690" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">WS Push Svc</text>

  <rect x="790" y="66" width="120" height="34" rx="6" fill="#3b82f6"/>
  <text x="850" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">PostgreSQL/Redis</text>

  <!-- Lifelines -->
  <line x1="75" y1="100" x2="75" y2="650" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="225" y1="100" x2="225" y2="650" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="385" y1="100" x2="385" y2="650" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="540" y1="100" x2="540" y2="650" stroke="#ddd6fe" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="690" y1="100" x2="690" y2="650" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="850" y1="100" x2="850" y2="650" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- BAND A: Multi-view Shared State -->
  <rect x="14" y="108" width="932" height="118" fill="url(#bandA)" rx="4"/>
  <text x="22" y="125" fill="#0f766e" font-size="10" font-weight="700">A · MULTI-VIEW SHARED ZUSTAND STORE</text>

  <line x1="75" y1="135" x2="377" y2="135" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="226" y="129" text-anchor="middle" fill="#374151" font-size="10">GET /api/projects/{id}/issues (all fields)</text>

  <line x1="385" y1="149" x2="842" y2="149" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="614" y="143" text-anchor="middle" fill="#374151" font-size="10">SELECT * FROM issues WHERE projectId=X</text>

  <line x1="850" y1="163" x2="393" y2="163" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="622" y="157" text-anchor="middle" fill="#374151" font-size="10">issues Map&lt;id,Issue&gt; → Zustand store</text>

  <line x1="385" y1="177" x2="233" y2="177" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="309" y="171" text-anchor="middle" fill="#374151" font-size="10">store.issues.set(id, issue)</text>

  <line x1="225" y1="191" x2="83" y2="191" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="154" y="185" text-anchor="middle" fill="#374151" font-size="10">Board + List + Timeline all re-render</text>

  <text x="40" y="214" fill="#0f766e" font-size="9">Board: group by status · List: sort by priority · Timeline: Gantt bars by dueDate — all read same Map, no view-specific fetch</text>

  <!-- BAND B: Real-time Update Flow -->
  <rect x="14" y="234" width="932" height="120" fill="url(#bandB)" rx="4"/>
  <text x="22" y="251" fill="#f59e0b" font-size="10" font-weight="700">B · REAL-TIME UPDATES (STATUS CHANGE)</text>

  <line x1="75" y1="261" x2="377" y2="261" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="226" y="255" text-anchor="middle" fill="#374151" font-size="10">POST /api/issues/{id} {status:'done'}</text>

  <line x1="385" y1="275" x2="842" y2="275" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="614" y="269" text-anchor="middle" fill="#374151" font-size="10">validate → write DB → publish Kafka issue.updated</text>

  <line x1="850" y1="289" x2="548" y2="289" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="699" y="283" text-anchor="middle" fill="#374151" font-size="10">Kafka consume issue.updated</text>

  <line x1="540" y1="303" x2="698" y2="303" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="619" y="297" text-anchor="middle" fill="#374151" font-size="10">WS fanout → project:{id} members</text>

  <line x1="690" y1="317" x2="83" y2="317" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="387" y="311" text-anchor="middle" fill="#374151" font-size="10">WS event → Zustand update → Board+List+Timeline re-render (&lt;2s)</text>

  <text x="40" y="341" fill="#f59e0b" font-size="9">CQRS: writes via Command Handler · reads from read-replica view models · WS filter by project membership</text>

  <!-- BAND C: Gantt + Sprint -->
  <rect x="14" y="362" width="932" height="128" fill="url(#bandC)" rx="4"/>
  <text x="22" y="379" fill="#6c63ff" font-size="10" font-weight="700">C · GANTT TIMELINE &amp; SPRINT PLANNING</text>

  <text x="40" y="397" fill="#374151" font-size="10" font-weight="600">Gantt: virtual row windowing → only visible rows in DOM · task bars: positioned div · SVG dependency arrows overlay</text>
  <text x="40" y="413" fill="#374151" font-size="10">Drag bar edge → compute new dueDate from pixel delta → PATCH /api/issues/{id} {dueDate} optimistic</text>

  <line x1="75" y1="431" x2="377" y2="431" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="226" y="425" text-anchor="middle" fill="#374151" font-size="10">Sprint: drag backlog → PATCH {sprintId}</text>

  <line x1="385" y1="445" x2="842" y2="445" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="614" y="439" text-anchor="middle" fill="#374151" font-size="10">UPDATE issue SET sprintId=X</text>

  <line x1="850" y1="459" x2="233" y2="459" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="541" y="453" text-anchor="middle" fill="#374151" font-size="10">recalculate capacity bar: sum estimates vs availability</text>

  <line x1="225" y1="473" x2="83" y2="473" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="154" y="467" text-anchor="middle" fill="#374151" font-size="10">color: green &lt;80% · yellow 80-100% · red &gt;100%</text>

  <text x="40" y="480" fill="#6c63ff" font-size="9">Velocity chart: last 5 sprints story points · capacity bar warning not hard block (team decision)</text>

  <!-- BAND D: Dependencies + Offline -->
  <rect x="14" y="498" width="932" height="118" fill="url(#bandD)" rx="4"/>
  <text x="22" y="515" fill="#ef4444" font-size="10" font-weight="700">D · DEPENDENCY CYCLE DETECTION &amp; OFFLINE SUPPORT</text>

  <line x1="75" y1="525" x2="377" y2="525" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="226" y="519" text-anchor="middle" fill="#374151" font-size="10">POST /api/dependencies {fromId:A toId:B type:blocks}</text>

  <line x1="385" y1="539" x2="842" y2="539" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="614" y="533" text-anchor="middle" fill="#374151" font-size="10">BFS from B: check if A reachable → cycle detected</text>

  <line x1="850" y1="553" x2="393" y2="553" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="622" y="547" text-anchor="middle" fill="#374151" font-size="10">422: "A→B→C→A circular dependency"</text>

  <line x1="850" y1="567" x2="393" y2="567" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="622" y="561" text-anchor="middle" fill="#374151" font-size="10">OK: INSERT deps + Redis HSET deps:{issueId}</text>

  <text x="40" y="586" fill="#ef4444" font-size="9">Offline: service worker caches app shell · IndexedDB outbox queue {mutationId endpoint method body} · on reconnect: replay chronological + idempotency key</text>
  <text x="40" y="600" fill="#94a3b8" font-size="9">Conflict: last-write-wins + notification "Bob updated status while offline" · Timeline: SVG arrows only for visible tasks</text>

  <!-- Metrics -->
  <rect x="14" y="630" width="932" height="36" fill="#0f2027" rx="6"/>
  <text x="100" y="653" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">WS Update</text>
  <text x="100" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">&lt;2s all views</text>
  <text x="260" y="653" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">Gantt 500 tasks</text>
  <text x="260" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">&lt;1s render</text>
  <text x="430" y="653" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">Issue Hierarchy</text>
  <text x="430" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">Epic&gt;Story&gt;Task&gt;Sub</text>
  <text x="630" y="653" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">Cycle Detection</text>
  <text x="630" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">BFS Redis adjacency</text>
  <text x="840" y="653" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">Offline Queue</text>
  <text x="840" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">IndexedDB outbox</text>
</svg>
