<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6c63ff"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bandA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0eeff"/>
      <stop offset="100%" stop-color="#f8f7ff"/>
    </linearGradient>
    <linearGradient id="bandB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9f0"/>
      <stop offset="100%" stop-color="#fffdf8"/>
    </linearGradient>
    <linearGradient id="bandC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0faf4"/>
      <stop offset="100%" stop-color="#f8fdfb"/>
    </linearGradient>
    <linearGradient id="bandD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0f0"/>
      <stop offset="100%" stop-color="#fff8f8"/>
    </linearGradient>
  </defs>

  <rect width="960" height="680" fill="#f4f2fb" rx="12"/>
  <rect width="960" height="52" fill="url(#hdr)" rx="12"/>
  <rect y="40" width="960" height="12" fill="url(#hdr)"/>
  <text x="480" y="33" text-anchor="middle" fill="white" font-size="17" font-weight="700">Multi-Role RBAC Dashboard System</text>

  <!-- Actors -->
  <rect x="25" y="66" width="90" height="34" rx="6" fill="#7c3aed"/>
  <text x="70" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Browser</text>

  <rect x="165" y="66" width="100" height="34" rx="6" fill="#6c63ff"/>
  <text x="215" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Zustand/JWT</text>

  <rect x="320" y="66" width="110" height="34" rx="6" fill="#f59e0b"/>
  <text x="375" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Auth Service</text>

  <rect x="485" y="66" width="100" height="34" rx="6" fill="#ef4444"/>
  <text x="535" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">API Gateway</text>

  <rect x="640" y="66" width="100" height="34" rx="6" fill="#10b981"/>
  <text x="690" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Redis Cache</text>

  <rect x="795" y="66" width="120" height="34" rx="6" fill="#3b82f6"/>
  <text x="855" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">PostgreSQL</text>

  <!-- Lifelines -->
  <line x1="70" y1="100" x2="70" y2="650" stroke="#ddd6fe" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="215" y1="100" x2="215" y2="650" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="375" y1="100" x2="375" y2="650" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="535" y1="100" x2="535" y2="650" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="690" y1="100" x2="690" y2="650" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="855" y1="100" x2="855" y2="650" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- BAND A: Permission Data Model + Cache -->
  <rect x="14" y="108" width="932" height="126" fill="url(#bandA)" rx="4"/>
  <text x="22" y="125" fill="#7c3aed" font-size="10" font-weight="700">A · PERMISSION DATA MODEL &amp; EFFECTIVE PERMISSIONS CACHE</text>

  <line x1="70" y1="135" x2="367" y2="135" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="218" y="129" text-anchor="middle" fill="#374151" font-size="10">Login → GET /api/me/permissions</text>

  <line x1="375" y1="149" x2="682" y2="149" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="529" y="143" text-anchor="middle" fill="#374151" font-size="10">check Redis perms:{userId} TTL 5min</text>

  <line x1="690" y1="163" x2="383" y2="163" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="537" y="157" text-anchor="middle" fill="#374151" font-size="10">cache miss → compute from DB</text>

  <line x1="375" y1="177" x2="847" y2="177" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="611" y="171" text-anchor="middle" fill="#374151" font-size="10">JOIN user_roles + role_permissions + resource_grants</text>

  <line x1="855" y1="191" x2="383" y2="191" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="619" y="185" text-anchor="middle" fill="#374151" font-size="10">effective perms set → SET perms:{userId} TTL 5min</text>

  <line x1="375" y1="205" x2="223" y2="205" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="299" y="199" text-anchor="middle" fill="#374151" font-size="10">JSON perm set → Zustand permissionsStore</text>

  <text x="40" y="226" fill="#7c3aed" font-size="9">Tables: roles(id,name,orgId,parentRoleId) · role_permissions(roleId,action,resourceType) · user_roles(userId,roleId,resourceType,resourceId)</text>

  <!-- BAND B: Frontend Enforcement -->
  <rect x="14" y="242" width="932" height="116" fill="url(#bandB)" rx="4"/>
  <text x="22" y="259" fill="#f59e0b" font-size="10" font-weight="700">B · FRONTEND PERMISSION ENFORCEMENT (SAME-PASS RENDERING)</text>

  <text x="40" y="276" fill="#374151" font-size="10" font-weight="600">usePermission('update','deal') → reads Zustand store → boolean (synchronous, no async)</text>
  <text x="40" y="292" fill="#374151" font-size="10">PermissionGuard wraps routes: if !hasPermission → redirect /403 immediately (no loading state)</text>
  <text x="40" y="308" fill="#374151" font-size="10">Field-level: filter form fields by required_permission before render — hidden fields NOT in DOM</text>

  <line x1="70" y1="324" x2="527" y2="324" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="298" y="318" text-anchor="middle" fill="#374151" font-size="10">API request with JWT token</text>

  <line x1="535" y1="338" x2="682" y2="338" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="608" y="332" text-anchor="middle" fill="#374151" font-size="10">check perms:{userId} Redis &lt;5ms</text>

  <line x1="690" y1="352" x2="543" y2="352" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="617" y="346" text-anchor="middle" fill="#374151" font-size="10">O(1) set membership check</text>

  <!-- BAND C: Permission Propagation -->
  <rect x="14" y="366" width="932" height="128" fill="url(#bandC)" rx="4"/>
  <text x="22" y="383" fill="#10b981" font-size="10" font-weight="700">C · PERMISSION PROPAGATION &lt;30s (ADMIN CHANGE → ALL ACTIVE SESSIONS)</text>

  <line x1="70" y1="393" x2="367" y2="393" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="218" y="387" text-anchor="middle" fill="#374151" font-size="10">Admin: PATCH /api/users/{id}/roles {revoke:['manager']}</text>

  <line x1="375" y1="407" x2="847" y2="407" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="611" y="401" text-anchor="middle" fill="#374151" font-size="10">DB update + DEL perms:{userId} + PUBLISH perm-changed:{userId}</text>

  <line x1="855" y1="421" x2="698" y2="421" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="777" y="415" text-anchor="middle" fill="#374151" font-size="10">Redis Pub/Sub</text>

  <line x1="690" y1="435" x2="543" y2="435" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="617" y="429" text-anchor="middle" fill="#374151" font-size="10">SSE push all open tabs</text>

  <line x1="535" y1="449" x2="78" y2="449" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="307" y="443" text-anchor="middle" fill="#374151" font-size="10">browser: GET /api/me/permissions → Zustand update → routes re-evaluate</text>

  <line x1="70" y1="463" x2="527" y2="463" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="298" y="457" text-anchor="middle" fill="#374151" font-size="10">critical revoke: SSE {forceLogout:true} → clear localStorage → /login</text>

  <text x="40" y="484" fill="#10b981" font-size="9">Propagation chain: Admin action → DB → Redis DEL + PUBLISH → SSE per-tab → GET perms → Zustand → UI &lt;30s guaranteed</text>

  <!-- BAND D: Admin Matrix + Audit -->
  <rect x="14" y="502" width="932" height="114" fill="url(#bandD)" rx="4"/>
  <text x="22" y="519" fill="#ef4444" font-size="10" font-weight="700">D · ADMIN PERMISSION MATRIX &amp; RESOURCE-LEVEL GRANTS</text>

  <text x="40" y="536" fill="#374151" font-size="10" font-weight="600">Matrix: rows=actions (create:deal, read:report...) · columns=roles · checkbox toggle → immediate save</text>
  <text x="40" y="552" fill="#374151" font-size="10">Inherited perms: filled-but-locked checkbox "from Manager role" · Cannot uncheck without modifying parent</text>

  <line x1="70" y1="568" x2="367" y2="568" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="218" y="562" text-anchor="middle" fill="#374151" font-size="10">PATCH /api/roles/{id}/permissions {add:['create:deal']}</text>

  <line x1="375" y1="582" x2="847" y2="582" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="611" y="576" text-anchor="middle" fill="#374151" font-size="10">cascade: DEL perms:{userId} for all users with role (SCAN + DEL pipeline)</text>

  <text x="40" y="600" fill="#ef4444" font-size="9">Resource grants: user_roles(userId,roleId,resourceType='project',resourceId='alpha') → "Manager of Project Alpha" badge</text>
  <text x="40" y="613" fill="#94a3b8" font-size="9">Audit log: permission_audit(id,ts,actorId,action,targetUserId,roleId,prevValue,newValue) — append-only, immutable</text>

  <!-- Metrics -->
  <rect x="14" y="630" width="932" height="36" fill="#1a0533" rx="6"/>
  <text x="90" y="653" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="600">API Auth Check</text>
  <text x="90" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">&lt;5ms (Redis)</text>
  <text x="240" y="653" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="600">UI Render</text>
  <text x="240" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">Same pass (sync)</text>
  <text x="420" y="653" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="600">Propagation SLA</text>
  <text x="420" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">&lt;30s all sessions</text>
  <text x="620" y="653" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="600">Cache TTL</text>
  <text x="620" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">5min perms:{userId}</text>
  <text x="840" y="653" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="600">Hierarchy</text>
  <text x="840" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">Admin&gt;Mgr&gt;Contrib&gt;View</text>
</svg>
