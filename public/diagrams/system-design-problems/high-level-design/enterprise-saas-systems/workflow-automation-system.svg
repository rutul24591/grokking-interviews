<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6c63ff"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="bandA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9f0"/>
      <stop offset="100%" stop-color="#fffdf8"/>
    </linearGradient>
    <linearGradient id="bandB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0faf4"/>
      <stop offset="100%" stop-color="#f8fdfb"/>
    </linearGradient>
    <linearGradient id="bandC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0eeff"/>
      <stop offset="100%" stop-color="#f8f7ff"/>
    </linearGradient>
    <linearGradient id="bandD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0f0"/>
      <stop offset="100%" stop-color="#fff8f8"/>
    </linearGradient>
  </defs>

  <rect width="960" height="680" fill="#fffbf0" rx="12"/>
  <rect width="960" height="52" fill="url(#hdr)" rx="12"/>
  <rect y="40" width="960" height="12" fill="url(#hdr)"/>
  <text x="480" y="33" text-anchor="middle" fill="white" font-size="17" font-weight="700">Workflow Automation System — Zapier-like</text>

  <!-- Actors -->
  <rect x="25" y="66" width="90" height="34" rx="6" fill="#d97706"/>
  <text x="70" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Builder UI</text>

  <rect x="165" y="66" width="110" height="34" rx="6" fill="#f59e0b"/>
  <text x="220" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Workflow Svc</text>

  <rect x="330" y="66" width="100" height="34" rx="6" fill="#8b5cf6"/>
  <text x="380" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Kafka</text>

  <rect x="485" y="66" width="110" height="34" rx="6" fill="#ef4444"/>
  <text x="540" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Execution Eng</text>

  <rect x="650" y="66" width="100" height="34" rx="6" fill="#10b981"/>
  <text x="700" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Connector</text>

  <rect x="805" y="66" width="120" height="34" rx="6" fill="#3b82f6"/>
  <text x="865" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">PostgreSQL/Redis</text>

  <!-- Lifelines -->
  <line x1="70" y1="100" x2="70" y2="650" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="220" y1="100" x2="220" y2="650" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="380" y1="100" x2="380" y2="650" stroke="#ddd6fe" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="540" y1="100" x2="540" y2="650" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="700" y1="100" x2="700" y2="650" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="865" y1="100" x2="865" y2="650" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- BAND A: Builder + Trigger -->
  <rect x="14" y="108" width="932" height="120" fill="url(#bandA)" rx="4"/>
  <text x="22" y="125" fill="#d97706" font-size="10" font-weight="700">A · WORKFLOW BUILDER &amp; TRIGGER LAYER</text>

  <text x="40" y="142" fill="#374151" font-size="10" font-weight="600">React Flow canvas: drag trigger node + action nodes + condition/loop nodes → connect edges</text>
  <text x="40" y="158" fill="#374151" font-size="10">Node config panel: connector, OAuth connection, action type, field mapping {`{{step1.output.email | lowercase}}`}</text>

  <line x1="70" y1="174" x2="212" y2="174" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="141" y="168" text-anchor="middle" fill="#374151" font-size="10">PATCH /api/workflows/{id} {nodes,edges}</text>

  <line x1="220" y1="188" x2="857" y2="188" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="538" y="182" text-anchor="middle" fill="#374151" font-size="10">validate DAG (no cycles) → store JSON → publish → increment version</text>

  <line x1="865" y1="202" x2="228" y2="202" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="547" y="196" text-anchor="middle" fill="#374151" font-size="10">Triggers: webhook HMAC-validate → Kafka | polling cron → connector.pollForNewData</text>

  <text x="40" y="218" fill="#d97706" font-size="9">Workflow JSON: {nodes:[{id,type,connectorId,actionId,config,position}], edges:[{source,target,label}]}</text>

  <!-- BAND B: Execution Engine -->
  <rect x="14" y="236" width="932" height="140" fill="url(#bandB)" rx="4"/>
  <text x="22" y="253" fill="#10b981" font-size="10" font-weight="700">B · EXECUTION ENGINE — DURABLE STEP STATE</text>

  <line x1="380" y1="263" x2="532" y2="263" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="456" y="257" text-anchor="middle" fill="#374151" font-size="10">Kafka ExecutionRequest consumed</text>

  <line x1="540" y1="277" x2="857" y2="277" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="698" y="271" text-anchor="middle" fill="#374151" font-size="10">load workflow JSON → create Execution + StepExecution rows</text>

  <line x1="865" y1="291" x2="548" y2="291" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="707" y="285" text-anchor="middle" fill="#374151" font-size="10">stepStatus=PENDING for each node</text>

  <line x1="540" y1="305" x2="692" y2="305" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="616" y="299" text-anchor="middle" fill="#374151" font-size="10">topological order: skip COMPLETED steps</text>

  <line x1="700" y1="319" x2="857" y2="319" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="778" y="313" text-anchor="middle" fill="#374151" font-size="10">connector.execute(input, idempotencyKey)</text>

  <line x1="865" y1="333" x2="548" y2="333" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="707" y="327" text-anchor="middle" fill="#374151" font-size="10">SUCCESS: stepStatus=COMPLETED, output saved</text>

  <line x1="865" y1="347" x2="548" y2="347" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="707" y="341" text-anchor="middle" fill="#374151" font-size="10">FAIL: retry 1s→2s→4s → FAILED → dead letter</text>

  <text x="40" y="366" fill="#10b981" font-size="9">Crash recovery: heartbeat 30s → stale detect 60s → re-queue → resume from last COMPLETED · idempotencyKey=execId:stepId:attempt</text>

  <!-- BAND C: Connector OAuth + Field Mapping -->
  <rect x="14" y="384" width="932" height="112" fill="url(#bandC)" rx="4"/>
  <text x="22" y="401" fill="#6c63ff" font-size="10" font-weight="700">C · CONNECTOR OAUTH &amp; DATA TRANSFORMATION</text>

  <text x="40" y="418" fill="#374151" font-size="10" font-weight="600">OAuth: user clicks Connect Slack → redirect OAuth URL → exchange code → store {accessToken,refreshToken,expiresAt} AES-256</text>
  <text x="40" y="434" fill="#374151" font-size="10">Auto-refresh: check expiry 5min before use → POST /oauth/token with refreshToken → update connections table</text>

  <line x1="540" y1="450" x2="692" y2="450" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="616" y="444" text-anchor="middle" fill="#374151" font-size="10">check INCR rate:{connectorId}:{connId}:{min}</text>

  <line x1="700" y1="464" x2="548" y2="464" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="624" y="458" text-anchor="middle" fill="#374151" font-size="10">rate limit hit → delay (not fail) until window reset</text>

  <text x="40" y="482" fill="#6c63ff" font-size="9">Field mapping: {`{{step1.output.email | lowercase}}`} · filters: date:'YYYY-MM-DD' multiply:100 if:cond:val:fallback · compiled at save, executed at runtime</text>

  <!-- BAND D: Execution Logs + Per-tenant -->
  <rect x="14" y="504" width="932" height="112" fill="url(#bandD)" rx="4"/>
  <text x="22" y="521" fill="#ef4444" font-size="10" font-weight="700">D · EXECUTION LOGS &amp; PER-TENANT THROTTLING</text>

  <line x1="70" y1="531" x2="212" y2="531" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="141" y="525" text-anchor="middle" fill="#374151" font-size="10">GET /api/executions?workflowId&amp;cursor</text>

  <line x1="220" y1="545" x2="532" y2="545" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="376" y="539" text-anchor="middle" fill="#374151" font-size="10">SSE /api/executions/{id}/stream (in-progress)</text>

  <line x1="540" y1="559" x2="78" y2="559" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="309" y="553" text-anchor="middle" fill="#374151" font-size="10">real-time step events: {stepId,status,output,duration} → timeline accordion</text>

  <line x1="70" y1="579" x2="532" y2="579" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="301" y="573" text-anchor="middle" fill="#374151" font-size="10">POST /api/executions/{id}/retry {fromStepId} → clone + resume from step X</text>

  <text x="40" y="598" fill="#ef4444" font-size="9">Throttling: INCR concurrent:{tenantId} TTL 30s · reject if &gt;100 · 2x burst for 60s · track step_executions.duration_ms for billing</text>
  <text x="40" y="611" fill="#94a3b8" font-size="9">Webhook trigger: HMAC-SHA256 validate secret · Polling: cursor-based diff against last_seen state</text>

  <!-- Metrics -->
  <rect x="14" y="630" width="932" height="36" fill="#1c0a00" rx="6"/>
  <text x="90" y="653" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="600">Webhook Trigger</text>
  <text x="90" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">&lt;2s execution</text>
  <text x="250" y="653" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="600">Step Retry</text>
  <text x="250" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">1s → 2s → 4s</text>
  <text x="420" y="653" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="600">Concurrency</text>
  <text x="420" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">10K across tenants</text>
  <text x="610" y="653" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="600">Per-tenant Quota</text>
  <text x="610" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">100 concurrent</text>
  <text x="830" y="653" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="600">Crash Recovery</text>
  <text x="830" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">Heartbeat 30s/60s</text>
</svg>
