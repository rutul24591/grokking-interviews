<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6c63ff"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bandA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8faff"/>
    </linearGradient>
    <linearGradient id="bandB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0faf4"/>
      <stop offset="100%" stop-color="#f8fdfb"/>
    </linearGradient>
    <linearGradient id="bandC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9f0"/>
      <stop offset="100%" stop-color="#fffdf8"/>
    </linearGradient>
    <linearGradient id="bandD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0f0"/>
      <stop offset="100%" stop-color="#fff8f8"/>
    </linearGradient>
  </defs>

  <rect width="960" height="680" fill="#f0f4ff" rx="12"/>
  <rect width="960" height="52" fill="url(#hdr)" rx="12"/>
  <rect y="40" width="960" height="12" fill="url(#hdr)"/>
  <text x="480" y="33" text-anchor="middle" fill="white" font-size="17" font-weight="700">Search Ranking Experimentation UI</text>

  <!-- Actors -->
  <rect x="20" y="66" width="90" height="34" rx="6" fill="#1e40af"/>
  <text x="65" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Engineers</text>

  <rect x="165" y="66" width="110" height="34" rx="6" fill="#3b82f6"/>
  <text x="220" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Experiment Svc</text>

  <rect x="335" y="66" width="100" height="34" rx="6" fill="#059669"/>
  <text x="385" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Control Ranker</text>

  <rect x="495" y="66" width="100" height="34" rx="6" fill="#7c3aed"/>
  <text x="545" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Treatment Ranker</text>

  <rect x="655" y="66" width="110" height="34" rx="6" fill="#f59e0b"/>
  <text x="710" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Metrics Pipeline</text>

  <rect x="825" y="66" width="110" height="34" rx="6" fill="#ef4444"/>
  <text x="880" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Evaluator UI</text>

  <!-- Lifelines -->
  <line x1="65" y1="100" x2="65" y2="650" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="220" y1="100" x2="220" y2="650" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="385" y1="100" x2="385" y2="650" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="545" y1="100" x2="545" y2="650" stroke="#ddd6fe" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="710" y1="100" x2="710" y2="650" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="880" y1="100" x2="880" y2="650" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- BAND A: Experiment Config + Traffic Assignment -->
  <rect x="14" y="108" width="932" height="126" fill="url(#bandA)" rx="4"/>
  <text x="22" y="125" fill="#1e40af" font-size="10" font-weight="700">A · EXPERIMENT CONFIGURATION &amp; DETERMINISTIC BUCKETING</text>

  <line x1="65" y1="135" x2="212" y2="135" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="138" y="129" text-anchor="middle" fill="#374151" font-size="10">POST /api/experiments {name, control, treatment, traffic:10%, segment, metric:nDCG@10}</text>

  <line x1="220" y1="149" x2="73" y2="149" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="147" y="143" text-anchor="middle" fill="#374151" font-size="10">experiment state: Draft → Running · validate no overlap with running experiments</text>

  <text x="40" y="167" fill="#374151" font-size="10" font-weight="600">Traffic assignment: SHA256(userId + experimentId) mod 100 &lt; allocation% → treatment · else → control</text>
  <text x="40" y="183" fill="#374151" font-size="10">Deterministic: same user always same bucket across all sessions · anonymous: persistent cookie ID</text>

  <line x1="65" y1="199" x2="377" y2="199" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="221" y="193" text-anchor="middle" fill="#374151" font-size="10">user query → assign bucket → fetch from assigned ranker · attach {experimentId, bucket} to click events</text>

  <line x1="385" y1="213" x2="702" y2="213" stroke="#059669" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="543" y="207" text-anchor="middle" fill="#374151" font-size="10">click events → Kafka → Metrics Pipeline</text>

  <!-- BAND B: Side-by-Side SERP Comparison -->
  <rect x="14" y="242" width="932" height="120" fill="url(#bandB)" rx="4"/>
  <text x="22" y="259" fill="#059669" font-size="10" font-weight="700">B · SIDE-BY-SIDE SERP COMPARISON</text>

  <line x1="65" y1="269" x2="377" y2="269" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="221" y="263" text-anchor="middle" fill="#374151" font-size="10">tool: enter query → parallel fetch control + treatment (bypass traffic allocation)</text>

  <line x1="385" y1="283" x2="65" y2="283" stroke="#059669" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="545" y1="283" x2="65" y2="283" stroke="#7c3aed" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="385" y1="283" x2="65" y2="297" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <line x1="545" y1="283" x2="65" y2="297" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="315" y="313" text-anchor="middle" fill="#374151" font-size="10">both responses arrive → diff algorithm</text>

  <text x="40" y="330" fill="#374151" font-size="10" font-weight="600">Diff highlight: new in treatment → green border · dropped from treatment → red strikethrough · position changed → yellow ↑3 arrow</text>
  <text x="40" y="346" fill="#374151" font-size="10">Diff toggle: show only changed positions · Score inspector: GET /rank-debug?query={q}&amp;docId={id}&amp;model=treatment → feature weights breakdown</text>

  <text x="40" y="354" fill="#059669" font-size="9">Score inspector: query-document relevance + freshness + authority + personalization boost + experiment feature values</text>

  <!-- BAND C: Relevance Judgement + Metrics -->
  <rect x="14" y="370" width="932" height="128" fill="url(#bandC)" rx="4"/>
  <text x="22" y="387" fill="#f59e0b" font-size="10" font-weight="700">C · RELEVANCE JUDGEMENT INTERFACE &amp; METRICS DASHBOARD</text>

  <line x1="880" y1="397" x2="73" y2="397" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="476" y="391" text-anchor="middle" fill="#374151" font-size="10">query + full document content displayed (not just snippet) + query intent: Navigational/Informational/Transactional</text>

  <line x1="65" y1="411" x2="872" y2="411" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="468" y="405" text-anchor="middle" fill="#374151" font-size="10">4-point rating: Perfect/Excellent/Good/Bad keyboard shortcuts 1-4 · Enter = submit + next · 200+ ratings/hour throughput</text>

  <line x1="880" y1="425" x2="73" y2="425" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="476" y="419" text-anchor="middle" fill="#374151" font-size="10">inter-annotator Cohen's Kappa → disagreement pairs → 3rd evaluator tie-break · quality feedback: "82% agreement"</text>

  <text x="40" y="443" fill="#374151" font-size="10" font-weight="600">Metrics: nDCG@10 control vs treatment time-series · CTR by position 1/3/10 · dwell time box plot · Return-to-SERP rate</text>
  <line x1="702" y1="459" x2="228" y2="459" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="465" y="453" text-anchor="middle" fill="#374151" font-size="10">statistical significance: t-test → p-value badge green &lt;0.05 · CI: "+0.8% nDCG [+0.3%, +1.3%]" · novelty effect chart</text>

  <text x="40" y="476" fill="#f59e0b" font-size="9">Metrics update: 5min after click events (streaming pipeline) · significance recomputed hourly · per-query-segment: Head vs Tail</text>
  <text x="40" y="489" fill="#94a3b8" font-size="9">SHAP feature importance bar chart for treatment model · MDE: minimum detectable effect at current sample size</text>

  <!-- BAND D: Rollout Controls + Interleaving -->
  <rect x="14" y="506" width="932" height="110" fill="url(#bandD)" rx="4"/>
  <text x="22" y="523" fill="#ef4444" font-size="10" font-weight="700">D · ROLLOUT CONTROLS &amp; TEAMDRAFT INTERLEAVING</text>

  <line x1="65" y1="533" x2="212" y2="533" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="138" y="527" text-anchor="middle" fill="#374151" font-size="10">drag traffic slider → PATCH /api/experiments/{id}/allocation {percent}</text>

  <line x1="65" y1="547" x2="212" y2="547" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="138" y="541" text-anchor="middle" fill="#374151" font-size="10">KILL SWITCH: POST /api/experiments/{id}/stop → all traffic → control &lt;30s</text>

  <line x1="220" y1="561" x2="377" y2="561" stroke="#059669" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="299" y="555" text-anchor="middle" fill="#374151" font-size="10">ramp schedule: 1%→5%→25%→100% · auto-proceed if p&lt;0.05 &amp;&amp; nDCG improvement &gt;0.5%</text>

  <text x="40" y="580" fill="#374151" font-size="10" font-weight="600">TeamDraft Interleaving: both model results in same SERP alternating · click attribution by which model placed the doc · lower position bias</text>
  <text x="40" y="596" fill="#374151" font-size="10">Interleaving result: {control_clicks:142, treatment_clicks:198} → treatment preferred by 39% · 2x statistically efficient vs A/B</text>
  <text x="40" y="609" fill="#94a3b8" font-size="9">Alert: CTR drops &gt;5% → auto-pause experiment + notify Slack #search-oncall · silence window during planned maintenance</text>

  <!-- Metrics -->
  <rect x="14" y="630" width="932" height="36" fill="#0c1a3d" rx="6"/>
  <text x="80" y="653" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">SERP Comparison</text>
  <text x="80" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">&lt;2s parallel fetch</text>
  <text x="240" y="653" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Evaluator Throughput</text>
  <text x="240" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">200+ ratings/hr</text>
  <text x="410" y="653" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Metrics Lag</text>
  <text x="410" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">&lt;5min after click</text>
  <text x="600" y="653" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Kill Switch</text>
  <text x="600" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">&lt;30s to control</text>
  <text x="810" y="653" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Interleaving vs A/B</text>
  <text x="810" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">2x statistically efficient</text>
</svg>
