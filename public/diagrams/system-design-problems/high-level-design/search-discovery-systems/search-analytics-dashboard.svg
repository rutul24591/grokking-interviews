<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6c63ff"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="bandA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0faff"/>
      <stop offset="100%" stop-color="#f8fdff"/>
    </linearGradient>
    <linearGradient id="bandB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9f0"/>
      <stop offset="100%" stop-color="#fffdf8"/>
    </linearGradient>
    <linearGradient id="bandC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0faf4"/>
      <stop offset="100%" stop-color="#f8fdfb"/>
    </linearGradient>
    <linearGradient id="bandD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0f0"/>
      <stop offset="100%" stop-color="#fff8f8"/>
    </linearGradient>
  </defs>

  <rect width="960" height="680" fill="#f0fbff" rx="12"/>
  <rect width="960" height="52" fill="url(#hdr)" rx="12"/>
  <rect y="40" width="960" height="12" fill="url(#hdr)"/>
  <text x="480" y="33" text-anchor="middle" fill="white" font-size="17" font-weight="700">Search Analytics Dashboard</text>

  <!-- Actors -->
  <rect x="20" y="66" width="90" height="34" rx="6" fill="#0f766e"/>
  <text x="65" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">SERP</text>

  <rect x="165" y="66" width="80" height="34" rx="6" fill="#8b5cf6"/>
  <text x="205" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Kafka</text>

  <rect x="305" y="66" width="90" height="34" rx="6" fill="#f59e0b"/>
  <text x="350" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Flink</text>

  <rect x="455" y="66" width="100" height="34" rx="6" fill="#0891b2"/>
  <text x="505" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">ClickHouse</text>

  <rect x="615" y="66" width="110" height="34" rx="6" fill="#ef4444"/>
  <text x="670" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Dashboard UI</text>

  <rect x="790" y="66" width="130" height="34" rx="6" fill="#374151"/>
  <text x="855" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">PagerDuty/Slack</text>

  <!-- Lifelines -->
  <line x1="65" y1="100" x2="65" y2="650" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="205" y1="100" x2="205" y2="650" stroke="#ddd6fe" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="350" y1="100" x2="350" y2="650" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="505" y1="100" x2="505" y2="650" stroke="#67e8f9" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="670" y1="100" x2="670" y2="650" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="855" y1="100" x2="855" y2="650" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- BAND A: Event Pipeline -->
  <rect x="14" y="108" width="932" height="124" fill="url(#bandA)" rx="4"/>
  <text x="22" y="125" fill="#0f766e" font-size="10" font-weight="700">A · REAL-TIME EVENT PIPELINE</text>

  <line x1="65" y1="135" x2="197" y2="135" stroke="#0f766e" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="131" y="129" text-anchor="middle" fill="#374151" font-size="10">query_event {queryId query sessionId deviceType queryCategory zeroResult resultCount}</text>

  <line x1="65" y1="149" x2="197" y2="149" stroke="#0891b2" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="131" y="161" text-anchor="middle" fill="#374151" font-size="9">click_event {queryId position docId dwellTimeMs} via Beacon API</text>

  <line x1="205" y1="171" x2="342" y2="171" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="273" y="165" text-anchor="middle" fill="#374151" font-size="10">consume search.events topic</text>

  <line x1="350" y1="185" x2="497" y2="185" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="424" y="179" text-anchor="middle" fill="#374151" font-size="10">1-min tumbling window: {queryCount, clickCount, zeroResultCount} → ClickHouse search_metrics_realtime</text>

  <line x1="505" y1="199" x2="73" y2="199" stroke="#0891b2" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="289" y="193" text-anchor="middle" fill="#374151" font-size="10">dashboard: SELECT bucket(1h,ts) count(*) FROM search_metrics WHERE ts&gt;now-period</text>

  <text x="40" y="216" fill="#0f766e" font-size="9">ClickHouse: partitioned by day · sorted by (timestamp, queryCategory) · ReplacingMergeTree for idempotent inserts</text>
  <text x="40" y="229" fill="#94a3b8" font-size="9">Batch path: nightly aggregation job → pre-aggregated CTR_by_position, session_funnel, query_clusters tables</text>

  <!-- BAND B: Query Volume + Zero Results -->
  <rect x="14" y="240" width="932" height="120" fill="url(#bandB)" rx="4"/>
  <text x="22" y="257" fill="#f59e0b" font-size="10" font-weight="700">B · QUERY VOLUME DASHBOARD &amp; ZERO-RESULT ANALYSIS</text>

  <line x1="670" y1="267" x2="513" y2="267" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="592" y="261" text-anchor="middle" fill="#374151" font-size="10">GET /api/analytics/volume?period=24h&amp;segment=device_type</text>

  <line x1="505" y1="281" x2="678" y2="281" stroke="#0891b2" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="592" y="275" text-anchor="middle" fill="#374151" font-size="10">time-series: Recharts line chart + deployment markers overlay + ±20% anomaly red band</text>

  <text x="40" y="299" fill="#374151" font-size="10" font-weight="600">Zero-result analysis: zero_result_rate = zeroResultCount/queryCount · target &lt;5%</text>
  <line x1="670" y1="315" x2="513" y2="315" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="592" y="309" text-anchor="middle" fill="#374151" font-size="10">SELECT query, count(*) WHERE zeroResult=true GROUP BY query ORDER BY count DESC LIMIT 100</text>

  <line x1="505" y1="329" x2="678" y2="329" stroke="#0891b2" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="592" y="323" text-anchor="middle" fill="#374151" font-size="10">top zero queries: categorize (brand name / product code / typo) → gap detection → CSV export for merchandising</text>

  <text x="40" y="350" fill="#f59e0b" font-size="9">Gap detection: high-volume zero-result queries vs catalog → "Electronics&gt;Phones: 23 queries, 50K missed sessions/month"</text>

  <!-- BAND C: CTR by Position + Session Funnel -->
  <rect x="14" y="368" width="932" height="128" fill="url(#bandC)" rx="4"/>
  <text x="22" y="385" fill="#10b981" font-size="10" font-weight="700">C · CTR BY POSITION &amp; SESSION FUNNEL</text>

  <line x1="670" y1="395" x2="513" y2="395" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="592" y="389" text-anchor="middle" fill="#374151" font-size="10">JOIN query_events + click_events ON queryId · GROUP BY position</text>

  <line x1="505" y1="409" x2="678" y2="409" stroke="#0891b2" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="592" y="403" text-anchor="middle" fill="#374151" font-size="10">CTR[pos] = clicks_at_pos / impressions_at_pos · bar chart 1-10 · power law curve · period-over-period overlay</text>

  <text x="40" y="427" fill="#374151" font-size="10" font-weight="600">Position bias curve: typical pos1=30-40% CTR · pos10=2-3% · flat curve = SERP features redirecting attention</text>

  <!-- Session Funnel -->
  <line x1="350" y1="447" x2="497" y2="447" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="424" y="441" text-anchor="middle" fill="#374151" font-size="10">session stitching: GROUP BY sessionId within 30min inactivity timeout</text>

  <line x1="505" y1="461" x2="678" y2="461" stroke="#0891b2" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="592" y="455" text-anchor="middle" fill="#374151" font-size="10">funnel: SEARCHED(100%) → CLICKED(~42%) → REACHED_PAGE(~35%) → CONVERTED(~8%)</text>

  <line x1="670" y1="475" x2="73" y2="475" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="371" y="469" text-anchor="middle" fill="#374151" font-size="10">bar chart per stage with drop-off % · segment by query category → identify worst-converting query types</text>

  <text x="40" y="486" fill="#10b981" font-size="9">Query clustering: nightly k-means k=50 on top-10K query embeddings · emerging clusters: new queries not in prior clusters</text>

  <!-- BAND D: Anomaly Detection + Alerting -->
  <rect x="14" y="504" width="932" height="112" fill="url(#bandD)" rx="4"/>
  <text x="22" y="521" fill="#ef4444" font-size="10" font-weight="700">D · ANOMALY DETECTION &amp; ALERTING</text>

  <line x1="350" y1="531" x2="497" y2="531" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="424" y="525" text-anchor="middle" fill="#374151" font-size="10">every minute: current zero_result_rate vs EMA baseline (same minute last 7 days)</text>

  <line x1="505" y1="545" x2="358" y2="545" stroke="#0891b2" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="432" y="539" text-anchor="middle" fill="#374151" font-size="10">threshold: &gt;2σ = Warning · &gt;3σ = Critical</text>

  <line x1="350" y1="559" x2="847" y2="559" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="599" y="553" text-anchor="middle" fill="#374151" font-size="10">POST /api/alerts {metric, value, baseline, severity} → PagerDuty API + Slack webhook #search-oncall</text>

  <line x1="855" y1="573" x2="678" y2="573" stroke="#374151" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="766" y="567" text-anchor="middle" fill="#374151" font-size="10">alert history timeline: acknowledged / dismissed / root cause annotation</text>

  <text x="40" y="592" fill="#ef4444" font-size="9">Deduplication: fire only first+last alert in same anomaly window (not 10/min) · silence window during planned maintenance</text>
  <text x="40" y="606" fill="#94a3b8" font-size="9">Alert freshness: anomaly detectable within 5min of start · CTR-by-position drop &gt;15% at pos1 → ranking regression alert</text>

  <!-- Metrics -->
  <rect x="14" y="630" width="932" height="36" fill="#0a1e1e" rx="6"/>
  <text x="80" y="653" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">Real-time Freshness</text>
  <text x="80" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">&lt;5min lag</text>
  <text x="240" y="653" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">Dashboard Load</text>
  <text x="240" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">&lt;2s pre-aggregated</text>
  <text x="420" y="653" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">Alert Latency</text>
  <text x="420" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">&lt;5min anomaly detect</text>
  <text x="620" y="653" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">Zero-result Target</text>
  <text x="620" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">&lt;5%</text>
  <text x="820" y="653" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">Anomaly Threshold</text>
  <text x="820" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">±2σ Warn / ±3σ Critical</text>
</svg>
