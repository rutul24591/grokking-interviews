<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/>
    </marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b21b6"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="bandA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f0ff"/>
      <stop offset="100%" stop-color="#faf8ff"/>
    </linearGradient>
    <linearGradient id="bandB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0faf4"/>
      <stop offset="100%" stop-color="#f8fdfb"/>
    </linearGradient>
    <linearGradient id="bandC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef9f0"/>
      <stop offset="100%" stop-color="#fffdf8"/>
    </linearGradient>
    <linearGradient id="bandD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0f0"/>
      <stop offset="100%" stop-color="#fff8f8"/>
    </linearGradient>
  </defs>

  <rect width="960" height="680" fill="#f5f0ff" rx="12"/>
  <rect width="960" height="52" fill="url(#hdr)" rx="12"/>
  <rect y="40" width="960" height="12" fill="url(#hdr)"/>
  <text x="480" y="33" text-anchor="middle" fill="white" font-size="17" font-weight="700">Semantic Search UI — AI-Powered</text>

  <!-- Actors -->
  <rect x="20" y="66" width="90" height="34" rx="6" fill="#5b21b6"/>
  <text x="65" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Browser</text>

  <rect x="165" y="66" width="110" height="34" rx="6" fill="#7c3aed"/>
  <text x="220" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Search API</text>

  <rect x="335" y="66" width="110" height="34" rx="6" fill="#0891b2"/>
  <text x="390" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">ONNX Encoder</text>

  <rect x="505" y="66" width="100" height="34" rx="6" fill="#10b981"/>
  <text x="555" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Vector DB</text>

  <rect x="665" y="66" width="100" height="34" rx="6" fill="#ef4444"/>
  <text x="715" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">BM25 Search</text>

  <rect x="825" y="66" width="110" height="34" rx="6" fill="#f59e0b"/>
  <text x="880" y="88" text-anchor="middle" fill="white" font-size="12" font-weight="600">Session Context</text>

  <!-- Lifelines -->
  <line x1="65" y1="100" x2="65" y2="650" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="220" y1="100" x2="220" y2="650" stroke="#ddd6fe" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="390" y1="100" x2="390" y2="650" stroke="#67e8f9" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="555" y1="100" x2="555" y2="650" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="715" y1="100" x2="715" y2="650" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="880" y1="100" x2="880" y2="650" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- BAND A: Hybrid Query Pipeline -->
  <rect x="14" y="108" width="932" height="136" fill="url(#bandA)" rx="4"/>
  <text x="22" y="125" fill="#5b21b6" font-size="10" font-weight="700">A · HYBRID QUERY PIPELINE (Semantic + BM25 → RRF Merge)</text>

  <line x1="65" y1="135" x2="212" y2="135" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="138" y="129" text-anchor="middle" fill="#374151" font-size="10">POST /api/search {query, mode:hybrid, context_embeddings}</text>

  <line x1="220" y1="149" x2="382" y2="149" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="301" y="143" text-anchor="middle" fill="#374151" font-size="10">ONNX Runtime encode query → 768-dim vector 50ms</text>

  <!-- Parallel: ANN + BM25 -->
  <line x1="390" y1="163" x2="547" y2="163" stroke="#0891b2" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="468" y="157" text-anchor="middle" fill="#374151" font-size="10">ANN search: top-K + cosine scores</text>

  <line x1="220" y1="163" x2="707" y2="163" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <text x="463" y="175" text-anchor="middle" fill="#ef4444" font-size="9">parallel BM25 keyword search</text>

  <line x1="715" y1="191" x2="228" y2="191" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="472" y="185" text-anchor="middle" fill="#374151" font-size="10">RRF merge: score = 1/(k+rank_sem) + 1/(k+rank_kw) · k=60 smoothing</text>

  <line x1="555" y1="205" x2="228" y2="205" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="392" y="199" text-anchor="middle" fill="#374151" font-size="10">ANN candidates hydrated → diversity re-rank (max 2 per source)</text>

  <line x1="220" y1="219" x2="73" y2="219" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="147" y="213" text-anchor="middle" fill="#374151" font-size="10">SSE stream: first results at 300ms, full set at 500ms</text>

  <text x="40" y="234" fill="#5b21b6" font-size="9">Hybrid weight slider: 0-100% semantic vs keyword · at 100% semantic: ANN only · at 100% keyword: BM25 only</text>

  <!-- BAND B: Result Explanations -->
  <rect x="14" y="252" width="932" height="120" fill="url(#bandB)" rx="4"/>
  <text x="22" y="269" fill="#10b981" font-size="10" font-weight="700">B · RESULT EXPLANATIONS &amp; CONFIDENCE DISPLAY</text>

  <text x="40" y="286" fill="#374151" font-size="10" font-weight="600">Each result card: title + URL + semantic snippet (concept phrases highlighted, not just query words)</text>
  <text x="40" y="302" fill="#374151" font-size="10">Confidence badge: cosine &gt;0.85 → "High" (green) · 0.70-0.85 → "Medium" (yellow) · &lt;0.70 → "Low" (orange)</text>
  <text x="40" y="318" fill="#374151" font-size="10">Similarity bar: CSS width = cosine_score*100% · visual at-a-glance ranking quality</text>

  <line x1="65" y1="334" x2="382" y2="334" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="223" y="328" text-anchor="middle" fill="#374151" font-size="10">click "Why this result?" → inverted similarity: top-5 phrases from doc closest to query embedding</text>

  <line x1="390" y1="348" x2="73" y2="348" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="232" y="342" text-anchor="middle" fill="#374151" font-size="10">matched concepts: "JavaScript memory management, heap profiling, GC"</text>

  <text x="40" y="362" fill="#10b981" font-size="9">SSE streaming: results sorted array → new card inserts in confidence order → CSS transform animation (no layout jump)</text>

  <!-- BAND C: Query Expansion + Conversational -->
  <rect x="14" y="380" width="932" height="124" fill="url(#bandC)" rx="4"/>
  <text x="22" y="397" fill="#f59e0b" font-size="10" font-weight="700">C · QUERY EXPANSION &amp; CONVERSATIONAL SEARCH</text>

  <line x1="65" y1="407" x2="212" y2="407" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="138" y="401" text-anchor="middle" fill="#374151" font-size="10">GET /api/suggest/semantic?q={query}&amp;mode=expand</text>

  <line x1="220" y1="421" x2="73" y2="421" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="147" y="415" text-anchor="middle" fill="#374151" font-size="10">ANN neighbors in embedding space → related query chips</text>

  <!-- Conversational -->
  <line x1="65" y1="441" x2="872" y2="441" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="468" y="435" text-anchor="middle" fill="#374151" font-size="10">follow-up: "What tools can I use?" → POST {query, context_embeddings:[prev_embs_arr]}</text>

  <line x1="880" y1="455" x2="228" y2="455" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="554" y="449" text-anchor="middle" fill="#374151" font-size="10">sessionStorage [{query, embedding}] · blended: 0.7*current + 0.3*prev → context-biased ANN</text>

  <line x1="220" y1="469" x2="73" y2="469" stroke="#10b981" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="147" y="463" text-anchor="middle" fill="#374151" font-size="10">breadcrumb: "Based on: JS memory mgmt → profiling tools" · X resets context</text>

  <text x="40" y="488" fill="#f59e0b" font-size="9">Context depth max 3 (beyond = diluted embedding) · Context depth indicator shows user how far back context extends</text>
  <text x="40" y="500" fill="#94a3b8" font-size="9">Query chips: "JS GC tutorial | heap profiling Chrome | WeakRef JS" → click = replace OR append to query</text>

  <!-- BAND D: Fallback + Mode Toggle -->
  <rect x="14" y="512" width="932" height="104" fill="url(#bandD)" rx="4"/>
  <text x="22" y="529" fill="#ef4444" font-size="10" font-weight="700">D · FALLBACK LOGIC &amp; SEARCH MODE CONTROLS</text>

  <line x1="220" y1="539" x2="73" y2="539" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="147" y="533" text-anchor="middle" fill="#374151" font-size="10">top result cosine &lt;0.65 → trigger keyword fallback</text>

  <line x1="65" y1="553" x2="707" y2="553" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="386" y="547" text-anchor="middle" fill="#374151" font-size="10">BM25 results + banner: "Showing keyword results — no strong semantic matches found"</text>

  <text x="40" y="572" fill="#374151" font-size="10" font-weight="600">Mode toggle: 3-way switch [Keyword | Hybrid | Semantic] → URL ?mode= → localStorage persist</text>
  <text x="40" y="588" fill="#374151" font-size="10">Advanced: hybrid weight slider (0=pure keyword ↔ 100=pure semantic) · model selector dropdown</text>
  <text x="40" y="604" fill="#374151" font-size="10">Zero results: "No strong semantic matches" + query expansion chips + broader category suggestion</text>
  <text x="40" y="617" fill="#94a3b8" font-size="9">pgvector for &lt;1M vectors (no extra infra) · Pinecone/Weaviate for &gt;10M · same model for query + indexing (incompatible spaces otherwise)</text>

  <!-- Metrics -->
  <rect x="14" y="630" width="932" height="36" fill="#2d0060" rx="6"/>
  <text x="80" y="653" text-anchor="middle" fill="#e9d5ff" font-size="10" font-weight="600">Query Embedding</text>
  <text x="80" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">50ms ONNX</text>
  <text x="230" y="653" text-anchor="middle" fill="#e9d5ff" font-size="10" font-weight="600">ANN Search</text>
  <text x="230" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">200ms</text>
  <text x="380" y="653" text-anchor="middle" fill="#e9d5ff" font-size="10" font-weight="600">First Results</text>
  <text x="380" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">300ms SSE stream</text>
  <text x="570" y="653" text-anchor="middle" fill="#e9d5ff" font-size="10" font-weight="600">Confidence Threshold</text>
  <text x="570" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">&gt;0.85 High / 0.65 fallback</text>
  <text x="790" y="653" text-anchor="middle" fill="#e9d5ff" font-size="10" font-weight="600">Context Depth</text>
  <text x="790" y="664" text-anchor="middle" fill="white" font-size="11" font-weight="700">Max 3 prev queries</text>
</svg>
