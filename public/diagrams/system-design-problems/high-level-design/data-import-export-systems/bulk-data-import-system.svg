<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">Bulk Data Import — Upload, Validate &amp; Ingest Pipeline</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="65" width="110" height="40" rx="8" fill="#6d5bd0"/>
  <text x="75" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">User / Client</text>
  <text x="75" y="98" text-anchor="middle" font-size="10" fill="#edeaf5">CSV / Excel upload</text>

  <rect x="198" y="65" width="115" height="40" rx="8" fill="#2563eb"/>
  <text x="255" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Import API</text>
  <text x="255" y="98" text-anchor="middle" font-size="10" fill="#dbeafe">multipart + job create</text>

  <rect x="388" y="65" width="115" height="40" rx="8" fill="#2f9d74"/>
  <text x="445" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Worker Pool</text>
  <text x="445" y="98" text-anchor="middle" font-size="10" fill="#d1fae5">validate + transform</text>

  <rect x="578" y="65" width="115" height="40" rx="8" fill="#d97843"/>
  <text x="635" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Target DB</text>
  <text x="635" y="98" text-anchor="middle" font-size="10" fill="#fef3c7">bulk upsert / insert</text>

  <rect x="768" y="65" width="112" height="40" rx="8" fill="#be123c"/>
  <text x="824" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Job Status</text>
  <text x="824" y="98" text-anchor="middle" font-size="10" fill="#fecdd3">progress + errors</text>

  <!-- Lifelines -->
  <line x1="75"  y1="105" x2="75"  y2="490" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="255" y1="105" x2="255" y2="490" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="445" y1="105" x2="445" y2="490" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="635" y1="105" x2="635" y2="490" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="824" y1="105" x2="824" y2="490" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- SECTION 1: Upload + job creation -->
  <rect x="8" y="118" width="884" height="14" rx="3" fill="#6d5bd0" opacity="0.15"/>
  <text x="450" y="129" text-anchor="middle" font-size="9" font-weight="bold" fill="#4c1d95">1 · UPLOAD — multipart file to S3 via presigned URL; server creates import job (jobId, status=queued); returns immediately; 200MB file limit enforced</text>

  <line x1="75" y1="150" x2="240" y2="150" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="144" text-anchor="middle" font-size="9" fill="#374151">POST /imports {fileName, rowCount estimate, mappings}</text>

  <line x1="240" y1="164" x2="240" y2="164" stroke="#2563eb" stroke-width="1"/>
  <rect x="178" y="166" width="155" height="20" rx="5" fill="#2563eb"/>
  <text x="255" y="180" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">create job; return presigned S3 PUT URL</text>

  <line x1="240" y1="190" x2="90" y2="190" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="165" y="184" text-anchor="middle" font-size="9" fill="#374151">202 {jobId, uploadUrl (S3 presigned)}</text>

  <line x1="75" y1="204" x2="240" y2="204" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="198" text-anchor="middle" font-size="9" fill="#374151">PUT {uploadUrl} — file bytes direct to S3</text>

  <line x1="75" y1="218" x2="240" y2="218" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="212" text-anchor="middle" font-size="9" fill="#374151">POST /imports/{jobId}/start → enqueue to worker queue</text>

  <!-- SECTION 2: Validate + parse -->
  <rect x="8" y="232" width="884" height="14" rx="3" fill="#2f9d74" opacity="0.18"/>
  <text x="450" y="243" text-anchor="middle" font-size="9" font-weight="bold" fill="#065f46">2 · VALIDATE — worker streams file from S3 in 10MB chunks; validates schema + types per row; collects errors with row numbers; aborts on &gt;5% error rate</text>

  <line x1="240" y1="262" x2="430" y2="262" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="335" y="256" text-anchor="middle" font-size="9" fill="#374151">worker dequeues job; streams file from S3 in 10MB chunks</text>

  <line x1="430" y1="276" x2="809" y2="276" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="619" y="270" text-anchor="middle" font-size="9" fill="#374151">UPDATE job: status=validating, validatedRows++</text>

  <line x1="809" y1="290" x2="430" y2="290" stroke="#be123c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="619" y="284" text-anchor="middle" font-size="9" fill="#374151">error rows → error_log table (rowNum, col, message)</text>

  <!-- SECTION 3: Bulk upsert -->
  <rect x="8" y="304" width="884" height="14" rx="3" fill="#d97843" opacity="0.18"/>
  <text x="450" y="315" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">3 · INGEST — valid rows batched in 1000-row chunks; COPY or INSERT ON CONFLICT; idempotent via importJobId+rowNum unique key; transaction per batch</text>

  <line x1="430" y1="334" x2="620" y2="334" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="525" y="328" text-anchor="middle" font-size="9" fill="#374151">COPY 1000 rows / INSERT … ON CONFLICT DO UPDATE</text>

  <line x1="620" y1="348" x2="430" y2="348" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="525" y="342" text-anchor="middle" font-size="9" fill="#374151">batch commit → UPDATE job insertedRows += 1000</text>

  <line x1="430" y1="362" x2="809" y2="362" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="619" y="356" text-anchor="middle" font-size="9" fill="#374151">progress % = insertedRows / totalRows → SSE push</text>

  <!-- SECTION 4: Completion + error report -->
  <rect x="8" y="376" width="884" height="14" rx="3" fill="#be123c" opacity="0.12"/>
  <text x="450" y="387" text-anchor="middle" font-size="9" font-weight="bold" fill="#9f1239">4 · COMPLETION — job status → completed / partial; error report CSV downloadable from S3; webhook / email notification; retry failed rows option</text>

  <line x1="430" y1="406" x2="809" y2="406" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="619" y="400" text-anchor="middle" font-size="9" fill="#374151">UPDATE job: status=completed, errorCount, duration</text>

  <line x1="809" y1="420" x2="90" y2="420" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="450" y="414" text-anchor="middle" font-size="9" fill="#374151">email/webhook: {jobId, inserted, skipped, errors, errorReportUrl}</text>

  <line x1="75" y1="440" x2="240" y2="440" stroke="#6d5bd0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="157" y="434" text-anchor="middle" font-size="9" fill="#374151">GET /imports/{jobId}/errors → presigned S3 error CSV</text>

  <!-- Footer -->
  <rect x="8" y="458" width="884" height="36" rx="6" fill="#1a1822"/>
  <text x="90" y="474" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">File Limit</text>
  <text x="90" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">200MB / 1M rows</text>
  <text x="255" y="474" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Streaming</text>
  <text x="255" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">10MB S3 chunks</text>
  <text x="450" y="474" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Batch Size</text>
  <text x="450" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">1,000 rows / tx</text>
  <text x="645" y="474" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Error Threshold</text>
  <text x="645" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">abort at &gt;5% errors</text>
  <text x="820" y="474" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Idempotency</text>
  <text x="820" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">jobId+rowNum unique</text>
</svg>
