<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">Data Export / Report Generation — Query, Render &amp; Deliver Pipeline</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="65" width="110" height="40" rx="8" fill="#6d5bd0"/>
  <text x="75" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">User / Scheduler</text>
  <text x="75" y="98" text-anchor="middle" font-size="10" fill="#edeaf5">request + download</text>

  <rect x="198" y="65" width="115" height="40" rx="8" fill="#2563eb"/>
  <text x="255" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Export API</text>
  <text x="255" y="98" text-anchor="middle" font-size="10" fill="#dbeafe">job create + status</text>

  <rect x="388" y="65" width="115" height="40" rx="8" fill="#2f9d74"/>
  <text x="445" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Export Worker</text>
  <text x="445" y="98" text-anchor="middle" font-size="10" fill="#d1fae5">query + render</text>

  <rect x="578" y="65" width="115" height="40" rx="8" fill="#d97843"/>
  <text x="635" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Read Replica / OLAP</text>
  <text x="635" y="98" text-anchor="middle" font-size="10" fill="#fef3c7">cursor-paginated query</text>

  <rect x="768" y="65" width="112" height="40" rx="8" fill="#be123c"/>
  <text x="824" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">S3 + CDN</text>
  <text x="824" y="98" text-anchor="middle" font-size="10" fill="#fecdd3">file storage + URL</text>

  <!-- Lifelines -->
  <line x1="75"  y1="105" x2="75"  y2="490" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="255" y1="105" x2="255" y2="490" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="445" y1="105" x2="445" y2="490" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="635" y1="105" x2="635" y2="490" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="824" y1="105" x2="824" y2="490" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- SECTION 1: Export request + job creation -->
  <rect x="8" y="118" width="884" height="14" rx="3" fill="#6d5bd0" opacity="0.15"/>
  <text x="450" y="129" text-anchor="middle" font-size="9" font-weight="bold" fill="#4c1d95">1 · EXPORT REQUEST — user defines filters + format (CSV/Excel/PDF/Parquet); API creates async job; returns jobId immediately; large exports always async</text>

  <line x1="75" y1="150" x2="240" y2="150" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="144" text-anchor="middle" font-size="9" fill="#374151">POST /exports {reportType, filters, format, columns[]}</text>

  <line x1="240" y1="164" x2="240" y2="164" stroke="#2563eb" stroke-width="1"/>
  <rect x="178" y="166" width="155" height="20" rx="5" fill="#2563eb"/>
  <text x="255" y="180" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">estimate row count; check quota; create job</text>

  <line x1="240" y1="190" x2="90" y2="190" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="165" y="184" text-anchor="middle" font-size="9" fill="#374151">202 {jobId} — poll or SSE for status</text>

  <!-- SECTION 2: Cursor-paginated query -->
  <rect x="8" y="204" width="884" height="14" rx="3" fill="#2f9d74" opacity="0.18"/>
  <text x="450" y="215" text-anchor="middle" font-size="9" font-weight="bold" fill="#065f46">2 · DATA FETCH — worker queries read replica with cursor pagination (10K rows/page); streams rows into format renderer; never loads full result in memory</text>

  <line x1="240" y1="234" x2="430" y2="234" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="335" y="228" text-anchor="middle" font-size="9" fill="#374151">worker dequeues; opens cursor on read replica</text>

  <line x1="430" y1="248" x2="620" y2="248" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="525" y="242" text-anchor="middle" font-size="9" fill="#374151">SELECT … WHERE id &gt; {cursor} LIMIT 10000 ORDER BY id</text>

  <line x1="620" y1="262" x2="430" y2="262" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="525" y="256" text-anchor="middle" font-size="9" fill="#374151">10K row page → render to buffer (CSV/XLSX/Parquet)</text>

  <line x1="430" y1="276" x2="809" y2="276" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="619" y="270" text-anchor="middle" font-size="9" fill="#374151">S3 multipart upload — flush buffer every 5MB part</text>

  <!-- SECTION 3: Large export / chunked S3 multipart -->
  <rect x="8" y="290" width="884" height="14" rx="3" fill="#d97843" opacity="0.18"/>
  <text x="450" y="301" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">3 · STREAMING WRITE — repeat cursor → render → S3 part until exhausted; call CompleteMultipartUpload; job progress via SSE (% rows fetched)</text>

  <line x1="430" y1="320" x2="620" y2="320" stroke="#2f9d74" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="525" y="314" text-anchor="middle" font-size="9" fill="#374151">repeat: next cursor page until 0 rows returned</text>

  <line x1="430" y1="334" x2="809" y2="334" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="619" y="328" text-anchor="middle" font-size="9" fill="#374151">S3 CompleteMultipartUpload → final object key</text>

  <line x1="809" y1="348" x2="240" y2="348" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="524" y="342" text-anchor="middle" font-size="9" fill="#374151">UPDATE job: status=ready, s3Key, fileSize</text>

  <!-- SECTION 4: Download + scheduled exports -->
  <rect x="8" y="362" width="884" height="14" rx="3" fill="#be123c" opacity="0.12"/>
  <text x="450" y="373" text-anchor="middle" font-size="9" font-weight="bold" fill="#9f1239">4 · DELIVERY — presigned S3 URL (15min TTL); email link on completion; scheduled exports (cron) re-use job pipeline; retention 7 days then S3 lifecycle delete</text>

  <line x1="75" y1="392" x2="240" y2="392" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="386" text-anchor="middle" font-size="9" fill="#374151">GET /exports/{jobId}/download</text>

  <line x1="240" y1="406" x2="809" y2="406" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="524" y="400" text-anchor="middle" font-size="9" fill="#374151">verify ownership; generate presigned URL (15min TTL)</text>

  <line x1="809" y1="420" x2="90" y2="420" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="450" y="414" text-anchor="middle" font-size="9" fill="#374151">302 redirect → S3 presigned URL; also email download link</text>

  <line x1="75" y1="440" x2="240" y2="440" stroke="#6d5bd0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="157" y="434" text-anchor="middle" font-size="9" fill="#374151">scheduled: cron triggers POST /exports (same pipeline)</text>

  <!-- Footer -->
  <rect x="8" y="458" width="884" height="36" rx="6" fill="#1a1822"/>
  <text x="90" y="474" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">Fetch Page</text>
  <text x="90" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">10K rows / cursor</text>
  <text x="255" y="474" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">S3 Part Size</text>
  <text x="255" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">5MB multipart</text>
  <text x="450" y="474" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Download TTL</text>
  <text x="450" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">15min presigned</text>
  <text x="645" y="474" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Retention</text>
  <text x="645" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">7 days S3 lifecycle</text>
  <text x="820" y="474" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Source</text>
  <text x="820" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">read replica / OLAP</text>
</svg>
