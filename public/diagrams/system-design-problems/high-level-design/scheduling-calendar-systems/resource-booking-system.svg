<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">Resource Booking System — Rooms, Desks &amp; Slots</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="65" width="110" height="40" rx="8" fill="#6d5bd0"/>
  <text x="75" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">User / Admin</text>
  <text x="75" y="98" text-anchor="middle" font-size="10" fill="#edeaf5">search + book</text>

  <rect x="198" y="65" width="115" height="40" rx="8" fill="#2563eb"/>
  <text x="255" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Booking API</text>
  <text x="255" y="98" text-anchor="middle" font-size="10" fill="#dbeafe">availability + lock</text>

  <rect x="388" y="65" width="115" height="40" rx="8" fill="#2f9d74"/>
  <text x="445" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Resource DB</text>
  <text x="445" y="98" text-anchor="middle" font-size="10" fill="#d1fae5">slots + capacity</text>

  <rect x="578" y="65" width="115" height="40" rx="8" fill="#d97843"/>
  <text x="635" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Conflict Guard</text>
  <text x="635" y="98" text-anchor="middle" font-size="10" fill="#fef3c7">atomic lock + MVCC</text>

  <rect x="768" y="65" width="112" height="40" rx="8" fill="#be123c"/>
  <text x="824" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Waitlist + SSE</text>
  <text x="824" y="98" text-anchor="middle" font-size="10" fill="#fecdd3">queue + live updates</text>

  <!-- Lifelines -->
  <line x1="75"  y1="105" x2="75"  y2="490" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="255" y1="105" x2="255" y2="490" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="445" y1="105" x2="445" y2="490" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="635" y1="105" x2="635" y2="490" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="824" y1="105" x2="824" y2="490" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- SECTION 1: Search + availability query -->
  <rect x="8" y="118" width="884" height="14" rx="3" fill="#6d5bd0" opacity="0.15"/>
  <text x="450" y="129" text-anchor="middle" font-size="9" font-weight="bold" fill="#4c1d95">1 · SEARCH + AVAILABILITY — interval overlap query: NOT EXISTS booking where start &lt; req_end AND end &gt; req_start; filter capacity + amenities</text>

  <line x1="75" y1="150" x2="240" y2="150" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="144" text-anchor="middle" font-size="9" fill="#374151">GET /resources?start=10am&amp;end=11am&amp;capacity=8</text>

  <line x1="240" y1="164" x2="430" y2="164" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="335" y="158" text-anchor="middle" font-size="9" fill="#374151">overlap query on bookings table; filter capacity + tags</text>

  <line x1="430" y1="178" x2="90" y2="178" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="260" y="172" text-anchor="middle" font-size="9" fill="#374151">available rooms list with amenities + floor map position</text>

  <!-- SECTION 2: Atomic booking with conflict guard -->
  <rect x="8" y="196" width="884" height="14" rx="3" fill="#2f9d74" opacity="0.18"/>
  <text x="450" y="207" text-anchor="middle" font-size="9" font-weight="bold" fill="#065f46">2 · ATOMIC BOOKING — SELECT FOR UPDATE on resource row; insert booking in same tx; unique constraint (resourceId, start, end) prevents race</text>

  <line x1="75" y1="226" x2="240" y2="226" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="220" text-anchor="middle" font-size="9" fill="#374151">POST /bookings &#123;resourceId, start, end, userId&#125;</text>

  <line x1="240" y1="240" x2="620" y2="240" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="430" y="234" text-anchor="middle" font-size="9" fill="#374151">BEGIN; SELECT FOR UPDATE; check no overlap; INSERT booking; COMMIT</text>

  <line x1="620" y1="254" x2="90" y2="254" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="355" y="248" text-anchor="middle" font-size="9" fill="#374151">201 &#123;bookingId, confirmCode&#125; or 409 if overlap detected</text>

  <!-- Conflict box -->
  <rect x="20" y="262" width="400" height="24" rx="6" fill="#fff" stroke="#d97843" stroke-width="1"/>
  <text x="220" y="278" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a1822">409 → client retries with next available slot (no silent overbooking)</text>

  <!-- SECTION 3: Check-in + no-show release -->
  <rect x="8" y="294" width="884" height="14" rx="3" fill="#d97843" opacity="0.18"/>
  <text x="450" y="305" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">3 · CHECK-IN + NO-SHOW — QR / NFC check-in at room; no check-in by start+15min → auto-release booking; freed slot triggers waitlist</text>

  <line x1="75" y1="324" x2="240" y2="324" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="318" text-anchor="middle" font-size="9" fill="#374151">POST /bookings/&#123;id&#125;/checkin (QR scan at door)</text>

  <line x1="240" y1="338" x2="430" y2="338" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="335" y="332" text-anchor="middle" font-size="9" fill="#374151">mark checked_in; cron: no-show at start+15min → release slot</text>

  <line x1="430" y1="352" x2="809" y2="352" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="619" y="346" text-anchor="middle" font-size="9" fill="#374151">freed slot → notify waitlist head via SSE + email</text>

  <!-- SECTION 4: Waitlist + admin overrides -->
  <rect x="8" y="370" width="884" height="14" rx="3" fill="#be123c" opacity="0.12"/>
  <text x="450" y="381" text-anchor="middle" font-size="9" font-weight="bold" fill="#9f1239">4 · WAITLIST + ADMIN — Redis sorted set (score = join timestamp); 10min claim window on notification; admin block / override any slot</text>

  <line x1="75" y1="400" x2="809" y2="400" stroke="#6d5bd0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="442" y="394" text-anchor="middle" font-size="9" fill="#374151">POST /waitlist &#123;resourceId, start, end&#125; → ZADD score=now</text>

  <line x1="809" y1="414" x2="90" y2="414" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="449" y="408" text-anchor="middle" font-size="9" fill="#374151">slot freed → ZPOPMIN → notify first in queue (10min claim window)</text>

  <line x1="240" y1="428" x2="809" y2="428" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="524" y="422" text-anchor="middle" font-size="9" fill="#374151">admin: force-release or block recurring maintenance window</text>

  <!-- Footer -->
  <rect x="8" y="446" width="884" height="36" rx="6" fill="#1a1822"/>
  <text x="90" y="462" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">Conflict Guard</text>
  <text x="90" y="476" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">SELECT FOR UPDATE</text>
  <text x="255" y="462" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">No-show Window</text>
  <text x="255" y="476" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">start + 15 min</text>
  <text x="450" y="462" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Waitlist Store</text>
  <text x="450" y="476" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">Redis sorted set</text>
  <text x="645" y="462" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Claim Window</text>
  <text x="645" y="476" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">10 min on notify</text>
  <text x="820" y="462" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Check-in</text>
  <text x="820" y="476" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">QR / NFC at door</text>
</svg>
