<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="540" fill="#f3f1f8"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Multi-Channel Communication Hub (Intercom / Zendesk)</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="58" width="80" height="36" rx="7" fill="#6d5bd0"/>
  <text x="60" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Channels</text>
  <text x="60" y="88" text-anchor="middle" font-size="9" fill="#edeaf5">email/WA/SMS</text>

  <rect x="165" y="58" width="90" height="36" rx="7" fill="#2563eb"/>
  <text x="210" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Adapter Layer</text>
  <text x="210" y="88" text-anchor="middle" font-size="9" fill="#dbeafe">normalize schema</text>

  <rect x="325" y="58" width="95" height="36" rx="7" fill="#2f9d74"/>
  <text x="372" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Router / WS</text>
  <text x="372" y="88" text-anchor="middle" font-size="9" fill="#d1fae5">assignment + state</text>

  <rect x="495" y="58" width="90" height="36" rx="7" fill="#d97843"/>
  <text x="540" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Agent A UI</text>
  <text x="540" y="88" text-anchor="middle" font-size="9" fill="#fef3c7">assigned agent</text>

  <rect x="655" y="58" width="90" height="36" rx="7" fill="#7c3aed"/>
  <text x="700" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Agent B UI</text>
  <text x="700" y="88" text-anchor="middle" font-size="9" fill="#ede9fe">viewing agent</text>

  <rect x="808" y="58" width="72" height="36" rx="7" fill="#be123c"/>
  <text x="844" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">SLA Cron</text>
  <text x="844" y="88" text-anchor="middle" font-size="9" fill="#fecdd3">breach detect</text>

  <!-- Lifelines -->
  <line x1="60" y1="94" x2="60" y2="510" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="210" y1="94" x2="210" y2="510" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="372" y1="94" x2="372" y2="510" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="540" y1="94" x2="540" y2="510" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="700" y1="94" x2="700" y2="510" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="844" y1="94" x2="844" y2="510" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- BAND A: Adapter normalization -->
  <rect x="14" y="104" width="872" height="16" rx="3" fill="#2563eb" opacity="0.2"/>
  <text x="450" y="116" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">PATH A — CHANNEL ADAPTER (normalize to canonical schema → route to agent)</text>

  <line x1="60" y1="132" x2="200" y2="132" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="130" y="126" text-anchor="middle" font-size="9" fill="#374151">webhook: WhatsApp msg</text>

  <rect x="170" y="140" width="80" height="18" rx="4" fill="#2563eb"/>
  <text x="210" y="153" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">normalize</text>

  <line x1="210" y1="168" x2="362" y2="168" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="286" y="162" text-anchor="middle" font-size="9" fill="#374151">&#123;channelType:whatsapp, body, customerId&#125;</text>

  <line x1="372" y1="182" x2="530" y2="182" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="451" y="176" text-anchor="middle" font-size="9" fill="#374151">round-robin assign → WS push CONVERSATION_UPDATED</text>

  <!-- BAND B: Conversation state machine -->
  <rect x="14" y="196" width="872" height="16" rx="3" fill="#2f9d74" opacity="0.2"/>
  <text x="450" y="208" text-anchor="middle" font-size="9" fill="#065f46" font-weight="bold">PATH B — STATE MACHINE (Open→Pending on reply; Resolved; customer reply→Open)</text>

  <line x1="540" y1="226" x2="362" y2="226" stroke="#d97843" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="451" y="220" text-anchor="middle" font-size="9" fill="#374151">agent sends reply</text>

  <rect x="332" y="234" width="80" height="18" rx="4" fill="#2f9d74"/>
  <text x="372" y="247" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">→ Pending</text>

  <line x1="372" y1="262" x2="200" y2="262" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="286" y="256" text-anchor="middle" font-size="9" fill="#374151">adapter.send() de-normalize → WhatsApp delivery</text>

  <line x1="60" y1="278" x2="362" y2="278" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="211" y="272" text-anchor="middle" font-size="9" fill="#374151">customer replies → Pending→Open; SLA resumes</text>

  <!-- BAND C: Collision detection -->
  <rect x="14" y="292" width="872" height="16" rx="3" fill="#7c3aed" opacity="0.15"/>
  <text x="450" y="304" text-anchor="middle" font-size="9" fill="#5b21b6" font-weight="bold">PATH C — COLLISION DETECTION (VIEWING_START → Redis viewer set → typing relay)</text>

  <line x1="700" y1="322" x2="362" y2="322" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr)"/>
  <text x="531" y="316" text-anchor="middle" font-size="9" fill="#374151">Agent B opens same conversation: VIEWING_START</text>

  <rect x="332" y="330" width="80" height="18" rx="4" fill="#7c3aed"/>
  <text x="372" y="343" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">Redis SADD</text>

  <line x1="372" y1="358" x2="530" y2="358" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="451" y="352" text-anchor="middle" font-size="9" fill="#374151">VIEWERS_UPDATED → "Agent B is also viewing"</text>

  <line x1="540" y1="372" x2="362" y2="372" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="451" y="383" text-anchor="middle" font-size="9" fill="#374151">Agent A typing → WS TYPING debounced 1s → Agent B banner</text>

  <!-- BAND D: SLA + breach -->
  <rect x="14" y="394" width="872" height="16" rx="3" fill="#be123c" opacity="0.15"/>
  <text x="450" y="406" text-anchor="middle" font-size="9" fill="#9f1239" font-weight="bold">PATH D — SLA TRACKING (countdown, breach cron, paused in Pending state)</text>

  <line x1="834" y1="424" x2="362" y2="424" stroke="#be123c" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="598" y="418" text-anchor="middle" font-size="9" fill="#374151">cron every 1min: query slaDeadline &lt; NOW() AND status!=resolved</text>

  <line x1="372" y1="438" x2="530" y2="438" stroke="#e05252" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="451" y="432" text-anchor="middle" font-size="9" fill="#374151">SLA_BREACHED WS → red badge + escalation notif</text>

  <line x1="540" y1="452" x2="70" y2="452" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="305" y="446" text-anchor="middle" font-size="9" fill="#374151">client: setInterval countdown; amber &lt;30min; paused status=Pending</text>

  <!-- Metrics footer -->
  <rect x="14" y="468" width="872" height="46" rx="6" fill="#1a1822"/>
  <text x="80" y="486" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Channels</text>
  <text x="80" y="502" text-anchor="middle" font-size="12" fill="white" font-weight="700">email/WA/SMS/chat</text>

  <text x="240" y="486" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">State Machine</text>
  <text x="240" y="502" text-anchor="middle" font-size="12" fill="white" font-weight="700">Open/Pending/Snoozed</text>

  <text x="420" y="486" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Viewer TTL</text>
  <text x="420" y="502" text-anchor="middle" font-size="12" fill="white" font-weight="700">Redis 30s</text>

  <text x="610" y="486" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">SLA Cron</text>
  <text x="610" y="502" text-anchor="middle" font-size="12" fill="white" font-weight="700">1min interval</text>

  <text x="800" y="486" text-anchor="middle" font-size="9" fill="#ddd6fe" font-weight="600">Canned Search</text>
  <text x="800" y="502" text-anchor="middle" font-size="12" fill="white" font-weight="700">Fuse.js local</text>
</svg>
