<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="540" fill="#f3f1f8"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">WhatsApp Web / Slack Frontend</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
    <marker id="arr-b" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="58" width="80" height="36" rx="7" fill="#6d5bd0"/>
  <text x="60" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Sender</text>
  <text x="60" y="88" text-anchor="middle" font-size="9" fill="#edeaf5">React UI</text>

  <rect x="165" y="58" width="95" height="36" rx="7" fill="#2563eb"/>
  <text x="212" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">WS Client</text>
  <text x="212" y="88" text-anchor="middle" font-size="9" fill="#dbeafe">30s heartbeat</text>

  <rect x="330" y="58" width="90" height="36" rx="7" fill="#2f9d74"/>
  <text x="375" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">WS Server</text>
  <text x="375" y="88" text-anchor="middle" font-size="9" fill="#d1fae5">fan-out + seqNum</text>

  <rect x="490" y="58" width="95" height="36" rx="7" fill="#d97843"/>
  <text x="537" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Zustand Store</text>
  <text x="537" y="88" text-anchor="middle" font-size="9" fill="#fef3c7">+ IndexedDB</text>

  <rect x="655" y="58" width="90" height="36" rx="7" fill="#7c3aed"/>
  <text x="700" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Recipient</text>
  <text x="700" y="88" text-anchor="middle" font-size="9" fill="#ede9fe">WS Client</text>

  <rect x="808" y="58" width="72" height="36" rx="7" fill="#be123c"/>
  <text x="844" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">IndexedDB</text>
  <text x="844" y="88" text-anchor="middle" font-size="9" fill="#fecdd3">10K msgs/ch</text>

  <!-- Lifelines -->
  <line x1="60" y1="94" x2="60" y2="510" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="212" y1="94" x2="212" y2="510" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="375" y1="94" x2="375" y2="510" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="537" y1="94" x2="537" y2="510" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="700" y1="94" x2="700" y2="510" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="844" y1="94" x2="844" y2="510" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- BAND A: Optimistic Send -->
  <rect x="14" y="104" width="872" height="16" rx="3" fill="#6d5bd0" opacity="0.2"/>
  <text x="450" y="116" text-anchor="middle" font-size="9" fill="#4c1d95" font-weight="bold">PATH A — OPTIMISTIC SEND (cuid clientId → status: sending → sent → delivered → read)</text>

  <line x1="60" y1="132" x2="527" y2="132" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="293" y="126" text-anchor="middle" font-size="9" fill="#374151">press Enter → cuid clientId, insert status=sending</text>

  <line x1="60" y1="144" x2="202" y2="144" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-b)"/>
  <text x="131" y="156" text-anchor="middle" font-size="9" fill="#374151">WS send msg</text>

  <rect x="345" y="162" width="60" height="18" rx="4" fill="#2f9d74"/>
  <text x="375" y="175" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">ACK + seqNum</text>

  <line x1="345" y1="188" x2="202" y2="188" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="273" y="182" text-anchor="middle" font-size="9" fill="#374151">&#123;clientId, serverId, seqNum&#125;</text>

  <line x1="202" y1="196" x2="527" y2="196" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="364" y="190" text-anchor="middle" font-size="9" fill="#374151">swap clientId→serverId, status=sent ✓</text>

  <!-- BAND B: Fan-out to Recipient -->
  <rect x="14" y="210" width="872" height="16" rx="3" fill="#7c3aed" opacity="0.15"/>
  <text x="450" y="222" text-anchor="middle" font-size="9" fill="#5b21b6" font-weight="bold">PATH B — FAN-OUT + DELIVERY STATUS (double check → read receipt)</text>

  <line x1="375" y1="240" x2="690" y2="240" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr)"/>
  <text x="532" y="234" text-anchor="middle" font-size="9" fill="#374151">WS push MESSAGE_RECEIVED to recipient</text>

  <line x1="690" y1="254" x2="527" y2="254" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="608" y="248" text-anchor="middle" font-size="9" fill="#374151">DELIVERED event → sender status=delivered ✓✓</text>

  <line x1="700" y1="268" x2="527" y2="268" stroke="#be123c" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="613" y="279" text-anchor="middle" font-size="9" fill="#374151">user opens chat → READ event → status=read ✓✓(filled)</text>

  <!-- BAND C: Message Ordering -->
  <rect x="14" y="288" width="872" height="16" rx="3" fill="#2f9d74" opacity="0.2"/>
  <text x="450" y="300" text-anchor="middle" font-size="9" fill="#065f46" font-weight="bold">PATH C — MESSAGE ORDERING (seqNum sort + gap-fill backfill)</text>

  <line x1="202" y1="318" x2="527" y2="318" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="364" y="312" text-anchor="middle" font-size="9" fill="#374151">incoming msg seqNum=105 (expected 103) → gap detected</text>

  <line x1="60" y1="334" x2="365" y2="334" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="212" y="328" text-anchor="middle" font-size="9" fill="#374151">GET /messages?channel=X&amp;after=102</text>

  <line x1="365" y1="348" x2="70" y2="348" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="217" y="342" text-anchor="middle" font-size="9" fill="#374151">msgs 103,104 returned → binary insert by seqNum</text>

  <!-- BAND D: Reconnect + Offline Queue -->
  <rect x="14" y="362" width="872" height="16" rx="3" fill="#d97843" opacity="0.2"/>
  <text x="450" y="374" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">PATH D — RECONNECT + OFFLINE QUEUE (heartbeat miss → backoff → gap-fill)</text>

  <rect x="172" y="388" width="80" height="18" rx="4" fill="#e05252"/>
  <text x="212" y="401" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">WS dropped</text>

  <line x1="212" y1="414" x2="70" y2="414" stroke="#e05252" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="141" y="408" text-anchor="middle" font-size="9" fill="#374151">banner: Reconnecting... backoff 1s→2s→4s</text>

  <line x1="60" y1="432" x2="834" y2="432" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="447" y="426" text-anchor="middle" font-size="9" fill="#374151">msgs typed offline → IndexedDB syncQueue → flush in order on reconnect</text>

  <line x1="202" y1="448" x2="365" y2="448" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="283" y="442" text-anchor="middle" font-size="9" fill="#374151">reconnected → gap-fill since lastSeqNum</text>

  <!-- Metrics footer -->
  <rect x="14" y="464" width="872" height="46" rx="6" fill="#1a1822"/>
  <text x="80" y="482" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Send Latency</text>
  <text x="80" y="498" text-anchor="middle" font-size="12" fill="white" font-weight="700">0ms optimistic</text>

  <text x="240" y="482" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">WS Heartbeat</text>
  <text x="240" y="498" text-anchor="middle" font-size="12" fill="white" font-weight="700">30s ping</text>

  <text x="420" y="482" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">DOM Nodes</text>
  <text x="420" y="498" text-anchor="middle" font-size="12" fill="white" font-weight="700">~30 virtual</text>

  <text x="610" y="482" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">IDB Retention</text>
  <text x="610" y="498" text-anchor="middle" font-size="12" fill="white" font-weight="700">10K msgs/ch</text>

  <text x="800" y="482" text-anchor="middle" font-size="9" fill="#ddd6fe" font-weight="600">Reconnect Backoff</text>
  <text x="800" y="498" text-anchor="middle" font-size="12" fill="white" font-weight="700">1→30s exp.</text>
</svg>
