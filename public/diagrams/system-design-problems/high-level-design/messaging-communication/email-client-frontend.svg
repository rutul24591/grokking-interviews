<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="540" fill="#f3f1f8"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Email Client (Gmail-like) Frontend</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="58" width="75" height="36" rx="7" fill="#6d5bd0"/>
  <text x="57" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Browser</text>
  <text x="57" y="88" text-anchor="middle" font-size="9" fill="#edeaf5">React UI</text>

  <rect x="155" y="58" width="85" height="36" rx="7" fill="#2563eb"/>
  <text x="197" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">JMAP API</text>
  <text x="197" y="88" text-anchor="middle" font-size="9" fill="#dbeafe">delta sync</text>

  <rect x="305" y="58" width="90" height="36" rx="7" fill="#2f9d74"/>
  <text x="350" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">SSE Stream</text>
  <text x="350" y="88" text-anchor="middle" font-size="9" fill="#d1fae5">new email push</text>

  <rect x="465" y="58" width="90" height="36" rx="7" fill="#d97843"/>
  <text x="510" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">IndexedDB</text>
  <text x="510" y="88" text-anchor="middle" font-size="9" fill="#fef3c7">drafts + cache</text>

  <rect x="625" y="58" width="90" height="36" rx="7" fill="#7c3aed"/>
  <text x="670" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Attachment</text>
  <text x="670" y="88" text-anchor="middle" font-size="9" fill="#ede9fe">multipart upload</text>

  <rect x="788" y="58" width="92" height="36" rx="7" fill="#be123c"/>
  <text x="834" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Outbox Queue</text>
  <text x="834" y="88" text-anchor="middle" font-size="9" fill="#fecdd3">undo-send 5s</text>

  <!-- Lifelines -->
  <line x1="57" y1="94" x2="57" y2="510" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="197" y1="94" x2="197" y2="510" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="350" y1="94" x2="350" y2="510" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="510" y1="94" x2="510" y2="510" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="670" y1="94" x2="670" y2="510" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="834" y1="94" x2="834" y2="510" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- BAND A: JMAP Delta Sync -->
  <rect x="14" y="104" width="872" height="16" rx="3" fill="#2563eb" opacity="0.2"/>
  <text x="450" y="116" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">PATH A — JMAP DELTA SYNC (state token → only changed IDs, not full inbox)</text>

  <line x1="57" y1="132" x2="187" y2="132" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="122" y="126" text-anchor="middle" font-size="9" fill="#374151">Email/changes sinceState=tok123</text>

  <rect x="157" y="140" width="80" height="18" rx="4" fill="#2563eb"/>
  <text x="197" y="153" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">delta only</text>

  <line x1="187" y1="168" x2="67" y2="168" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="127" y="162" text-anchor="middle" font-size="9" fill="#374151">&#123;created:[id1,id2], destroyed:[id3], newState:tok124&#125;</text>

  <line x1="57" y1="180" x2="500" y2="180" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="278" y="174" text-anchor="middle" font-size="9" fill="#374151">cache thread headers + state token in IndexedDB</text>

  <!-- BAND B: SSE + Body fetch -->
  <rect x="14" y="194" width="872" height="16" rx="3" fill="#2f9d74" opacity="0.2"/>
  <text x="450" y="206" text-anchor="middle" font-size="9" fill="#065f46" font-weight="bold">PATH B — SSE PUSH + ON-DEMAND BODY FETCH (lazy load)</text>

  <line x1="340" y1="224" x2="67" y2="224" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="203" y="218" text-anchor="middle" font-size="9" fill="#374151">SSE: new email &#123;threadId, subject, sender, snippet&#125;</text>

  <line x1="57" y1="238" x2="340" y2="238" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="198" y="232" text-anchor="middle" font-size="9" fill="#374151">insert header into virtual scroll list</text>

  <line x1="57" y1="254" x2="187" y2="254" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="122" y="248" text-anchor="middle" font-size="9" fill="#374151">user clicks thread → GET /messages/{"{id}"}/body</text>

  <line x1="187" y1="268" x2="67" y2="268" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="122" y="262" text-anchor="middle" font-size="9" fill="#374151">HTML body → sandboxed iframe render</text>

  <!-- BAND C: Compose + Autosave -->
  <rect x="14" y="282" width="872" height="16" rx="3" fill="#d97843" opacity="0.2"/>
  <text x="450" y="294" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">PATH C — COMPOSE + AUTOSAVE (IndexedDB 10s, server 30s, crash recovery)</text>

  <line x1="57" y1="312" x2="500" y2="312" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="278" y="306" text-anchor="middle" font-size="9" fill="#374151">keystroke → Tiptap editor → autosave to IndexedDB every 10s</text>

  <line x1="57" y1="326" x2="660" y2="326" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="358" y="320" text-anchor="middle" font-size="9" fill="#374151">file selected → multipart upload immediately → attachmentId returned</text>

  <line x1="660" y1="340" x2="67" y2="340" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="363" y="334" text-anchor="middle" font-size="9" fill="#374151">progress bar → embed attachmentId in draft HTML</text>

  <line x1="500" y1="354" x2="187" y2="354" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="343" y="348" text-anchor="middle" font-size="9" fill="#374151">server sync every 30s (not every keystroke)</text>

  <!-- BAND D: Undo Send -->
  <rect x="14" y="368" width="872" height="16" rx="3" fill="#be123c" opacity="0.15"/>
  <text x="450" y="380" text-anchor="middle" font-size="9" fill="#9f1239" font-weight="bold">PATH D — UNDO SEND (5s server queue, DELETE to cancel before SMTP delivery)</text>

  <line x1="57" y1="400" x2="824" y2="400" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="440" y="394" text-anchor="middle" font-size="9" fill="#374151">Send clicked → POST /api/outbox status=pending</text>

  <rect x="794" y="408" width="80" height="18" rx="4" fill="#be123c"/>
  <text x="834" y="421" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">5s queue</text>

  <line x1="57" y1="436" x2="824" y2="436" stroke="#e05252" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="440" y="430" text-anchor="middle" font-size="9" fill="#374151">user clicks Undo within 5s → DELETE /api/outbox/{"{id}"} → discarded</text>

  <line x1="824" y1="450" x2="67" y2="450" stroke="#2f9d74" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="445" y="444" text-anchor="middle" font-size="9" fill="#374151">no Undo → 5s timeout → SMTP delivery</text>

  <!-- Metrics footer -->
  <rect x="14" y="466" width="872" height="46" rx="6" fill="#1a1822"/>
  <text x="80" y="484" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Delta Sync</text>
  <text x="80" y="500" text-anchor="middle" font-size="12" fill="white" font-weight="700">IDs only</text>

  <text x="240" y="484" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Autosave</text>
  <text x="240" y="500" text-anchor="middle" font-size="12" fill="white" font-weight="700">10s IDB</text>

  <text x="420" y="484" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Undo Window</text>
  <text x="420" y="500" text-anchor="middle" font-size="12" fill="white" font-weight="700">5s server queue</text>

  <text x="610" y="484" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Search Latency</text>
  <text x="610" y="500" text-anchor="middle" font-size="12" fill="white" font-weight="700">&lt;500ms ES</text>

  <text x="800" y="484" text-anchor="middle" font-size="9" fill="#ddd6fe" font-weight="600">Body Fetch</text>
  <text x="800" y="500" text-anchor="middle" font-size="12" fill="white" font-weight="700">on-demand lazy</text>
</svg>
