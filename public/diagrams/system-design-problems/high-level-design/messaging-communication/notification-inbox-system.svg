<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="540" fill="#f3f1f8"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Notification Inbox System</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="58" width="80" height="36" rx="7" fill="#6d5bd0"/>
  <text x="60" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Tab A</text>
  <text x="60" y="88" text-anchor="middle" font-size="9" fill="#edeaf5">active tab</text>

  <rect x="165" y="58" width="90" height="36" rx="7" fill="#2563eb"/>
  <text x="210" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Notif. Store</text>
  <text x="210" y="88" text-anchor="middle" font-size="9" fill="#dbeafe">Zustand + IDB</text>

  <rect x="325" y="58" width="90" height="36" rx="7" fill="#2f9d74"/>
  <text x="370" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">WS / SSE</text>
  <text x="370" y="88" text-anchor="middle" font-size="9" fill="#d1fae5">push delivery</text>

  <rect x="490" y="58" width="95" height="36" rx="7" fill="#d97843"/>
  <text x="537" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Fan-out API</text>
  <text x="537" y="88" text-anchor="middle" font-size="9" fill="#fef3c7">group + prefs</text>

  <rect x="655" y="58" width="90" height="36" rx="7" fill="#7c3aed"/>
  <text x="700" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Tab B</text>
  <text x="700" y="88" text-anchor="middle" font-size="9" fill="#ede9fe">BroadcastCh.</text>

  <rect x="808" y="58" width="72" height="36" rx="7" fill="#be123c"/>
  <text x="844" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Prefs API</text>
  <text x="844" y="88" text-anchor="middle" font-size="9" fill="#fecdd3">type×channel</text>

  <!-- Lifelines -->
  <line x1="60" y1="94" x2="60" y2="510" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="210" y1="94" x2="210" y2="510" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="370" y1="94" x2="370" y2="510" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="537" y1="94" x2="537" y2="510" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="700" y1="94" x2="700" y2="510" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="844" y1="94" x2="844" y2="510" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- BAND A: Notification delivery + grouping -->
  <rect x="14" y="104" width="872" height="16" rx="3" fill="#2f9d74" opacity="0.2"/>
  <text x="450" y="116" text-anchor="middle" font-size="9" fill="#065f46" font-weight="bold">PATH A — DELIVERY + GROUPING (same groupKey 5min → one grouped notification)</text>

  <line x1="525" y1="132" x2="360" y2="132" stroke="#d97843" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="442" y="126" text-anchor="middle" font-size="9" fill="#374151">fan-out: check prefs → group by (type,objectId,5min)</text>

  <line x1="360" y1="146" x2="200" y2="146" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="280" y="140" text-anchor="middle" font-size="9" fill="#374151">WS push GroupedNotification &#123;actorList, count&#125;</text>

  <line x1="200" y1="160" x2="70" y2="160" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="135" y="154" text-anchor="middle" font-size="9" fill="#374151">render: "Alice, Bob +3 commented on PR#42"</text>

  <line x1="60" y1="172" x2="200" y2="172" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="130" y="182" text-anchor="middle" font-size="9" fill="#374151">badge +1 → update page title "(4) Dashboard"</text>

  <!-- BAND B: Mark as read + optimistic -->
  <rect x="14" y="194" width="872" height="16" rx="3" fill="#2563eb" opacity="0.2"/>
  <text x="450" y="206" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">PATH B — MARK AS READ (optimistic badge -1, server PATCH, bulk mark-all)</text>

  <line x1="60" y1="224" x2="200" y2="224" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="130" y="218" text-anchor="middle" font-size="9" fill="#374151">click notification</text>

  <rect x="170" y="232" width="80" height="18" rx="4" fill="#2563eb"/>
  <text x="210" y="245" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">readAt set opt.</text>

  <line x1="200" y1="260" x2="70" y2="260" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="130" y="254" text-anchor="middle" font-size="9" fill="#374151">badge -1 immediately → navigate to objectUrl</text>

  <line x1="210" y1="270" x2="527" y2="270" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="368" y="264" text-anchor="middle" font-size="9" fill="#374151">PATCH /api/notifications/{"{id}"}/read (async confirm)</text>

  <!-- BAND C: Cross-tab BroadcastChannel -->
  <rect x="14" y="284" width="872" height="16" rx="3" fill="#7c3aed" opacity="0.15"/>
  <text x="450" y="296" text-anchor="middle" font-size="9" fill="#5b21b6" font-weight="bold">PATH C — CROSS-TAB BADGE SYNC (BroadcastChannel, no server round trip)</text>

  <line x1="200" y1="314" x2="690" y2="314" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr)"/>
  <text x="445" y="308" text-anchor="middle" font-size="9" fill="#374151">BroadcastChannel.postMessage(&#123;type:BADGE_UPDATED, count:3&#125;)</text>

  <rect x="660" y="322" width="80" height="18" rx="4" fill="#7c3aed"/>
  <text x="700" y="335" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">Tab B syncs</text>

  <line x1="690" y1="350" x2="70" y2="350" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="380" y="344" text-anchor="middle" font-size="9" fill="#374151">tab focus: GET /api/notifications/count (authoritative drift correction)</text>

  <!-- BAND D: Preferences -->
  <rect x="14" y="364" width="872" height="16" rx="3" fill="#d97843" opacity="0.2"/>
  <text x="450" y="376" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">PATH D — PREFERENCES + SNOOZE/MUTE (type×channel matrix, fan-out Redis cache)</text>

  <line x1="60" y1="394" x2="834" y2="394" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="447" y="388" text-anchor="middle" font-size="9" fill="#374151">toggle "mention.email=never" → PATCH /api/notification-preferences (optimistic)</text>

  <line x1="834" y1="408" x2="525" y2="408" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="679" y="402" text-anchor="middle" font-size="9" fill="#374151">fan-out reads Redis prefs cache (10s TTL)</text>

  <line x1="60" y1="428" x2="527" y2="428" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="293" y="422" text-anchor="middle" font-size="9" fill="#374151">snooze PR#42 1 day → PATCH /subscriptions/{"{objectId}"}/snooze; mute → DELETE</text>

  <!-- Metrics footer -->
  <rect x="14" y="444" width="872" height="46" rx="6" fill="#1a1822"/>
  <text x="80" y="462" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Group Window</text>
  <text x="80" y="478" text-anchor="middle" font-size="12" fill="white" font-weight="700">5min bucket</text>

  <text x="240" y="462" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Badge Update</text>
  <text x="240" y="478" text-anchor="middle" font-size="12" fill="white" font-weight="700">0ms optimistic</text>

  <text x="420" y="462" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Cross-tab</text>
  <text x="420" y="478" text-anchor="middle" font-size="12" fill="white" font-weight="700">&lt;1s BC API</text>

  <text x="610" y="462" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Prefs Cache</text>
  <text x="610" y="478" text-anchor="middle" font-size="12" fill="white" font-weight="700">10s Redis TTL</text>

  <text x="800" y="462" text-anchor="middle" font-size="9" fill="#ddd6fe" font-weight="600">Panel Open</text>
  <text x="800" y="478" text-anchor="middle" font-size="12" fill="white" font-weight="700">&lt;200ms cache</text>

  <rect x="14" y="494" width="872" height="16" rx="6" fill="#1a1822"/>
  <text x="450" y="506" text-anchor="middle" font-size="8.5" fill="#94a3b8">Offline: notifications stored in DB → delivered on WS reconnect · Virtual scroll: 500+ items · Drift correction: GET /count on tab focus</text>
</svg>
