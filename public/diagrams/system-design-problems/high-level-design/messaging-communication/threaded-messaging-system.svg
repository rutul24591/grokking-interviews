<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="540" fill="#f3f1f8"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Threaded Messaging System</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="58" width="80" height="36" rx="7" fill="#6d5bd0"/>
  <text x="60" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">User A</text>
  <text x="60" y="88" text-anchor="middle" font-size="9" fill="#edeaf5">Thread author</text>

  <rect x="165" y="58" width="90" height="36" rx="7" fill="#2563eb"/>
  <text x="210" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Thread Store</text>
  <text x="210" y="88" text-anchor="middle" font-size="9" fill="#dbeafe">Zustand + IDB</text>

  <rect x="325" y="58" width="90" height="36" rx="7" fill="#2f9d74"/>
  <text x="370" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Thread API</text>
  <text x="370" y="88" text-anchor="middle" font-size="9" fill="#d1fae5">replies + cursor</text>

  <rect x="490" y="58" width="90" height="36" rx="7" fill="#d97843"/>
  <text x="535" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">WS Server</text>
  <text x="535" y="88" text-anchor="middle" font-size="9" fill="#fef3c7">reply fan-out</text>

  <rect x="655" y="58" width="90" height="36" rx="7" fill="#7c3aed"/>
  <text x="700" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">User B</text>
  <text x="700" y="88" text-anchor="middle" font-size="9" fill="#ede9fe">Subscriber</text>

  <rect x="808" y="58" width="72" height="36" rx="7" fill="#be123c"/>
  <text x="844" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Notif. Svc</text>
  <text x="844" y="88" text-anchor="middle" font-size="9" fill="#fecdd3">push delivery</text>

  <!-- Lifelines -->
  <line x1="60" y1="94" x2="60" y2="510" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="210" y1="94" x2="210" y2="510" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="370" y1="94" x2="370" y2="510" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="535" y1="94" x2="535" y2="510" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="700" y1="94" x2="700" y2="510" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="844" y1="94" x2="844" y2="510" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- BAND A: Open Thread Panel -->
  <rect x="14" y="104" width="872" height="16" rx="3" fill="#2563eb" opacity="0.2"/>
  <text x="450" y="116" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">PATH A — OPEN THREAD PANEL (click badge → fetch replies → virtual scroll)</text>

  <line x1="60" y1="132" x2="200" y2="132" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="130" y="126" text-anchor="middle" font-size="9" fill="#374151">click "3 replies" badge</text>

  <line x1="210" y1="140" x2="360" y2="140" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="285" y="134" text-anchor="middle" font-size="9" fill="#374151">GET /threads/{"{rootId}"}/replies?limit=20</text>

  <line x1="360" y1="155" x2="70" y2="155" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="215" y="149" text-anchor="middle" font-size="9" fill="#374151">20 replies + nextCursor → Thread Store</text>

  <line x1="200" y1="169" x2="360" y2="169" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="280" y="180" text-anchor="middle" font-size="9" fill="#374151">scroll to bottom → fetch next page (keyset cursor)</text>

  <!-- BAND B: Real-time reply -->
  <rect x="14" y="192" width="872" height="16" rx="3" fill="#2f9d74" opacity="0.2"/>
  <text x="450" y="204" text-anchor="middle" font-size="9" fill="#065f46" font-weight="bold">PATH B — NEW REPLY ARRIVES (WS fan-out → panel append or badge +1)</text>

  <line x1="60" y1="222" x2="525" y2="222" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="292" y="216" text-anchor="middle" font-size="9" fill="#374151">User A posts reply → WS REPLY_CREATED event</text>

  <line x1="525" y1="236" x2="690" y2="236" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="607" y="230" text-anchor="middle" font-size="9" fill="#374151">fan-out to channel subscribers</text>

  <line x1="690" y1="250" x2="200" y2="250" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="445" y="244" text-anchor="middle" font-size="9" fill="#374151">panel open → append reply; panel closed → badge +1, bold unread</text>

  <!-- BAND C: Unread Cursor -->
  <rect x="14" y="264" width="872" height="16" rx="3" fill="#d97843" opacity="0.2"/>
  <text x="450" y="276" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">PATH C — UNREAD CURSOR SYNC (panel close → PATCH cursor → cross-device WS event)</text>

  <line x1="60" y1="294" x2="360" y2="294" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="210" y="288" text-anchor="middle" font-size="9" fill="#374151">panel closed → PATCH /threads/{"{rootId}"}/cursor {"{lastReadReplyId}"}</text>

  <rect x="330" y="302" width="80" height="18" rx="4" fill="#2f9d74"/>
  <text x="370" y="315" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">cursor saved</text>

  <line x1="525" y1="330" x2="690" y2="330" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="607" y="324" text-anchor="middle" font-size="9" fill="#374151">WS cursor_updated → User B device B syncs</text>

  <line x1="690" y1="344" x2="200" y2="344" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="445" y="338" text-anchor="middle" font-size="9" fill="#374151">User B: thread unread cleared on second device</text>

  <!-- BAND D: Subscription + Notification -->
  <rect x="14" y="358" width="872" height="16" rx="3" fill="#7c3aed" opacity="0.15"/>
  <text x="450" y="370" text-anchor="middle" font-size="9" fill="#5b21b6" font-weight="bold">PATH D — SUBSCRIPTION + PUSH NOTIFICATION (auto-subscribe on reply)</text>

  <line x1="700" y1="388" x2="525" y2="388" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="612" y="382" text-anchor="middle" font-size="9" fill="#374151">User B replies → auto-subscribed to thread</text>

  <line x1="525" y1="402" x2="834" y2="402" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="679" y="396" text-anchor="middle" font-size="9" fill="#374151">new reply by User A → notify all subscribers</text>

  <line x1="834" y1="416" x2="690" y2="416" stroke="#be123c" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="762" y="410" text-anchor="middle" font-size="9" fill="#374151">push notification → Threads sidebar badge</text>

  <!-- BAND E: Deep Link -->
  <rect x="14" y="430" width="872" height="16" rx="3" fill="#be123c" opacity="0.15"/>
  <text x="450" y="442" text-anchor="middle" font-size="9" fill="#9f1239" font-weight="bold">PATH E — DEEP LINK (?thread=rootId&amp;reply=replyId → scroll + highlight)</text>

  <line x1="60" y1="460" x2="360" y2="460" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="210" y="454" text-anchor="middle" font-size="9" fill="#374151">page load with URL params → fetch replies paginated until replyId found</text>

  <line x1="360" y1="474" x2="70" y2="474" stroke="#be123c" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="215" y="468" text-anchor="middle" font-size="9" fill="#374151">scrollToItem(replyIndex) → CSS amber highlight animation 2s</text>

  <!-- Metrics footer -->
  <rect x="14" y="490" width="872" height="34" rx="6" fill="#1a1822"/>
  <text x="80" y="508" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Panel Open</text>
  <text x="80" y="520" text-anchor="middle" font-size="11" fill="white" font-weight="700">&lt;300ms</text>
  <text x="240" y="508" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Cursor Sync</text>
  <text x="240" y="520" text-anchor="middle" font-size="11" fill="white" font-weight="700">cross-device 10s</text>
  <text x="420" y="508" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">DOM Virtual</text>
  <text x="420" y="520" text-anchor="middle" font-size="11" fill="white" font-weight="700">100+ replies</text>
  <text x="610" y="508" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Auto-subscribe</text>
  <text x="610" y="520" text-anchor="middle" font-size="11" fill="white" font-weight="700">on reply</text>
  <text x="800" y="508" text-anchor="middle" font-size="9" fill="#ddd6fe" font-weight="600">Deep-link</text>
  <text x="800" y="520" text-anchor="middle" font-size="11" fill="white" font-weight="700">scroll+highlight</text>
</svg>
