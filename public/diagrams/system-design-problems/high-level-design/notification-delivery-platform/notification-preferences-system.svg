<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f3f1f8"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">User Notification Preferences System — Settings, Sync &amp; Enforcement</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- 5 actors -->
  <rect x="20" y="65" width="110" height="40" rx="8" fill="#6d5bd0"/>
  <text x="75" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">User Settings</text>
  <text x="75" y="98" text-anchor="middle" font-size="10" fill="#edeaf5">preferences UI</text>

  <rect x="198" y="65" width="115" height="40" rx="8" fill="#2563eb"/>
  <text x="255" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Pref API</text>
  <text x="255" y="98" text-anchor="middle" font-size="10" fill="#dbeafe">validate + persist</text>

  <rect x="388" y="65" width="115" height="40" rx="8" fill="#2f9d74"/>
  <text x="445" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Pref Cache</text>
  <text x="445" y="98" text-anchor="middle" font-size="10" fill="#d1fae5">Redis hot path</text>

  <rect x="578" y="65" width="115" height="40" rx="8" fill="#d97843"/>
  <text x="635" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Notif Enforcer</text>
  <text x="635" y="98" text-anchor="middle" font-size="10" fill="#fef3c7">gate before send</text>

  <rect x="768" y="65" width="112" height="40" rx="8" fill="#be123c"/>
  <text x="824" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Unsubscribe</text>
  <text x="824" y="98" text-anchor="middle" font-size="10" fill="#fecdd3">one-click + legal</text>

  <!-- Lifelines -->
  <line x1="75"  y1="105" x2="75"  y2="490" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="255" y1="105" x2="255" y2="490" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="445" y1="105" x2="445" y2="490" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="635" y1="105" x2="635" y2="490" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="824" y1="105" x2="824" y2="490" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- SECTION 1: Preference model + save -->
  <rect x="8" y="118" width="884" height="14" rx="3" fill="#6d5bd0" opacity="0.15"/>
  <text x="450" y="129" text-anchor="middle" font-size="9" font-weight="bold" fill="#4c1d95">1 · PREFERENCE MODEL — per-category per-channel matrix: {category: "marketing", channels: {push: false, email: true, sms: false}, quiet_hours: {start: 22, end: 8, tz: "America/NY"}}</text>

  <line x1="75" y1="150" x2="240" y2="150" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="144" text-anchor="middle" font-size="9" fill="#374151">PATCH /api/prefs {category, channel, enabled, quiet_hours}</text>

  <line x1="240" y1="164" x2="430" y2="164" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="335" y="158" text-anchor="middle" font-size="9" fill="#374151">validate (legal channels immutable) → DB upsert + cache invalidate</text>

  <line x1="430" y1="178" x2="90" y2="178" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="260" y="172" text-anchor="middle" font-size="9" fill="#374151">200 OK with updated pref object + ETag for optimistic UI</text>

  <!-- SECTION 2: Cache + hot-path enforcement -->
  <rect x="8" y="196" width="884" height="14" rx="3" fill="#2f9d74" opacity="0.18"/>
  <text x="450" y="207" text-anchor="middle" font-size="9" font-weight="bold" fill="#065f46">2 · CACHE ENFORCEMENT — Redis hash per user: HSET prefs:{userId} push_marketing 0 email_marketing 1; TTL 24hr; notification service reads before send (1ms vs 5ms DB)</text>

  <line x1="430" y1="226" x2="620" y2="226" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="525" y="220" text-anchor="middle" font-size="9" fill="#374151">incoming notif → HGET prefs:{userId} {channel}_{category}</text>

  <line x1="620" y1="240" x2="430" y2="240" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="525" y="234" text-anchor="middle" font-size="9" fill="#374151">0 → suppress (do not send); 1 → proceed to channel worker</text>

  <!-- Quiet hours box -->
  <rect x="420" y="250" width="380" height="24" rx="6" fill="#fff" stroke="#d97843" stroke-width="1"/>
  <text x="610" y="266" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a1822">Quiet hours: check user TZ, if in window → defer (add to delayed queue, send at window_open)</text>

  <!-- SECTION 3: Frequency capping -->
  <rect x="8" y="282" width="884" height="14" rx="3" fill="#d97843" opacity="0.18"/>
  <text x="450" y="293" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">3 · FREQUENCY CAPPING — per-user per-channel daily/weekly limits; Redis INCR with daily TTL; exceeds cap → suppress (store missed count for digest)</text>

  <line x1="620" y1="312" x2="430" y2="312" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="525" y="306" text-anchor="middle" font-size="9" fill="#374151">check: INCR notif_count:{userId}:{channel}:{date} &lt;= cap</text>

  <line x1="430" y1="326" x2="240" y2="326" stroke="#2f9d74" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="335" y="320" text-anchor="middle" font-size="9" fill="#374151">over cap → add to digest batch (end-of-day summary email)</text>

  <!-- Caps box -->
  <rect x="20" y="336" width="370" height="24" rx="6" fill="#fff" stroke="#d97843" stroke-width="1"/>
  <text x="205" y="352" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a1822">Defaults: push 5/day, email 3/day, SMS 2/day; override per category priority</text>

  <!-- SECTION 4: Unsubscribe + compliance -->
  <rect x="8" y="368" width="884" height="14" rx="3" fill="#be123c" opacity="0.12"/>
  <text x="450" y="379" text-anchor="middle" font-size="9" font-weight="bold" fill="#9f1239">4 · UNSUBSCRIBE + COMPLIANCE — RFC 8058 List-Unsubscribe header; one-click unsubscribe (no login required); CAN-SPAM/GDPR suppression list; audit log</text>

  <line x1="75" y1="398" x2="809" y2="398" stroke="#e05252" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="442" y="392" text-anchor="middle" font-size="9" fill="#374151">GET /unsubscribe?token={signed_jwt} → one-click unsubscribe</text>

  <line x1="809" y1="412" x2="430" y2="412" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="619" y="406" text-anchor="middle" font-size="9" fill="#374151">add to global suppression list; audit log entry</text>

  <line x1="430" y1="426" x2="240" y2="426" stroke="#2f9d74" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="335" y="420" text-anchor="middle" font-size="9" fill="#374151">Kafka: pref_changed event → invalidate all provider caches</text>

  <!-- Footer -->
  <rect x="8" y="444" width="884" height="36" rx="6" fill="#1a1822"/>
  <text x="90" y="460" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">Cache TTL</text>
  <text x="90" y="474" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">24 hr Redis hash</text>
  <text x="255" y="460" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Push Cap</text>
  <text x="255" y="474" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">5 / day default</text>
  <text x="450" y="460" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Quiet Hours</text>
  <text x="450" y="474" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">defer → delayed queue</text>
  <text x="645" y="460" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Unsubscribe</text>
  <text x="645" y="474" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">RFC 8058 one-click</text>
  <text x="820" y="460" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Legal Channels</text>
  <text x="820" y="474" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">transactional immutable</text>
</svg>
