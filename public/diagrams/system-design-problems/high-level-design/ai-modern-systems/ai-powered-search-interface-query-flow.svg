<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="500" fill="#f3f1f8"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">AI Search — Query Modes &amp; Answer UI Anatomy</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
  </defs>

  <!-- Query modes left panel -->
  <rect x="20" y="54" width="260" height="430" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="150" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Query Modes</text>

  <rect x="35" y="86" width="230" height="64" rx="7" fill="#6d5bd0"/>
  <text x="150" y="105" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Keyword Search</text>
  <text x="150" y="121" text-anchor="middle" font-size="10" fill="#edeaf5">BM25 ranked by TF-IDF score</text>
  <text x="150" y="137" text-anchor="middle" font-size="10" fill="#edeaf5">No AI answer — just ranked results</text>

  <rect x="35" y="162" width="230" height="64" rx="7" fill="#2f9d74"/>
  <text x="150" y="181" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Semantic Search</text>
  <text x="150" y="197" text-anchor="middle" font-size="10" fill="#e8f5f0">ANN on embedded query vector</text>
  <text x="150" y="213" text-anchor="middle" font-size="10" fill="#e8f5f0">Finds conceptual matches</text>

  <rect x="35" y="238" width="230" height="64" rx="7" fill="#1a1822"/>
  <text x="150" y="257" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Hybrid Search</text>
  <text x="150" y="273" text-anchor="middle" font-size="10" fill="#d7d1e6">BM25 + ANN fused via RRF</text>
  <text x="150" y="289" text-anchor="middle" font-size="10" fill="#d7d1e6">Best of precision + recall</text>

  <rect x="35" y="314" width="230" height="64" rx="7" fill="#d97843"/>
  <text x="150" y="333" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Question Answering</text>
  <text x="150" y="349" text-anchor="middle" font-size="10" fill="#fff">NL question → AI answer box</text>
  <text x="150" y="365" text-anchor="middle" font-size="10" fill="#fff">with inline citations [1][2]</text>

  <rect x="35" y="390" width="230" height="80" rx="7" fill="#6d5bd0" opacity="0.5"/>
  <text x="150" y="409" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Conversational Refinement</text>
  <text x="150" y="425" text-anchor="middle" font-size="10" fill="#edeaf5">"Show more recent results"</text>
  <text x="150" y="441" text-anchor="middle" font-size="10" fill="#edeaf5">"Only from Engineering team"</text>
  <text x="150" y="457" text-anchor="middle" font-size="10" fill="#edeaf5">Previous results in context</text>

  <!-- Center: Answer UI anatomy -->
  <rect x="300" y="54" width="310" height="430" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="455" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">AI Answer Box Anatomy</text>

  <!-- Mock answer box -->
  <rect x="315" y="86" width="280" height="136" rx="7" fill="#f3f1f8" stroke="#d7d1e6"/>
  <text x="455" y="106" text-anchor="middle" font-size="10" fill="#6d5bd0" font-weight="bold">Query: "How does X handle backpressure?"</text>
  <text x="323" y="124" font-size="10" fill="#1a1822">Backpressure in X is managed via a</text>
  <text x="323" y="140" font-size="10" fill="#1a1822">bounded queue with configurable</text>
  <rect x="460" y="132" width="16" height="14" rx="3" fill="#6d5bd0"/>
  <text x="468" y="143" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">1</text>
  <text x="323" y="156" font-size="10" fill="#1a1822">capacity. When the queue is full, the</text>
  <text x="323" y="172" font-size="10" fill="#1a1822">producer is suspended until space frees.</text>
  <rect x="488" y="164" width="16" height="14" rx="3" fill="#6d5bd0"/>
  <text x="496" y="175" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">2</text>
  <text x="323" y="192" font-size="10" fill="#2f9d74" font-weight="bold">● Confidence: High  ·  2 sources</text>
  <text x="455" y="208" text-anchor="middle" font-size="9" fill="#d7d1e6">▌ cursor while streaming</text>

  <!-- Citation cards -->
  <rect x="315" y="230" width="280" height="52" rx="7" fill="#6d5bd0" opacity="0.08" stroke="#6d5bd0" stroke-width="1"/>
  <text x="323" y="248" font-size="10" fill="#6d5bd0" font-weight="bold">[1] X Documentation — Backpressure</text>
  <text x="323" y="264" font-size="10" fill="#1a1822">Score: 0.92 · docs.example.com/backpressure</text>
  <text x="323" y="276" font-size="10" fill="#1a1822">"…bounded queue with capacity N…"</text>

  <rect x="315" y="290" width="280" height="52" rx="7" fill="#6d5bd0" opacity="0.08" stroke="#6d5bd0" stroke-width="1"/>
  <text x="323" y="308" font-size="10" fill="#6d5bd0" font-weight="bold">[2] RFC-2204 Flow Control §4.2</text>
  <text x="323" y="324" font-size="10" fill="#1a1822">Score: 0.87 · rfc.example.org</text>
  <text x="323" y="336" font-size="10" fill="#1a1822">"…producer suspension on full buffer…"</text>

  <!-- Result cards -->
  <rect x="315" y="352" width="280" height="52" rx="7" fill="#2f9d74" opacity="0.08" stroke="#2f9d74" stroke-width="1"/>
  <text x="323" y="370" font-size="10" fill="#2f9d74" font-weight="bold">Top Result Card</text>
  <text x="323" y="386" font-size="10" fill="#1a1822">Title + highlighted snippet + breadcrumb</text>
  <text x="323" y="398" font-size="10" fill="#1a1822">Relevance badge · Last updated date</text>

  <!-- Feedback bar -->
  <rect x="315" y="414" width="280" height="56" rx="7" fill="#d97843" opacity="0.1" stroke="#d97843" stroke-width="1"/>
  <text x="455" y="432" text-anchor="middle" font-size="10" fill="#d97843" font-weight="bold">Feedback Bar</text>
  <text x="455" y="450" text-anchor="middle" font-size="10" fill="#1a1822">👍 Helpful  ·  👎 Not relevant  ·  ✏ Refine</text>
  <text x="455" y="464" text-anchor="middle" font-size="10" fill="#1a1822">→ fine-tunes retrieval ranking signal</text>

  <!-- Right: personalization + indexing details -->
  <rect x="630" y="54" width="250" height="430" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="755" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Personalization &amp; Ranking</text>

  <text x="640" y="100" font-size="11" fill="#6d5bd0" font-weight="bold">Session Signals</text>
  <text x="640" y="118" font-size="10" fill="#1a1822">• Click-through rate per result</text>
  <text x="640" y="134" font-size="10" fill="#1a1822">• Dwell time on opened docs</text>
  <text x="640" y="150" font-size="10" fill="#1a1822">• Thumbs-up / thumbs-down</text>
  <text x="640" y="166" font-size="10" fill="#1a1822">• Refined query after result</text>

  <line x1="640" y1="178" x2="870" y2="178" stroke="#d7d1e6"/>
  <text x="640" y="196" font-size="11" fill="#6d5bd0" font-weight="bold">Re-ranking Boosters</text>
  <text x="640" y="214" font-size="10" fill="#1a1822">• Freshness: newer docs boosted</text>
  <text x="640" y="230" font-size="10" fill="#1a1822">• Authority: high-CTR docs up</text>
  <text x="640" y="246" font-size="10" fill="#1a1822">• Team scope: author's org boosted</text>
  <text x="640" y="262" font-size="10" fill="#1a1822">• Personal history: prev-opened up</text>

  <line x1="640" y1="274" x2="870" y2="274" stroke="#d7d1e6"/>
  <text x="640" y="292" font-size="11" fill="#d97843" font-weight="bold">Query Understanding</text>
  <text x="640" y="310" font-size="10" fill="#1a1822">• Spell correction → normalized Q</text>
  <text x="640" y="326" font-size="10" fill="#1a1822">• Entity extraction (people, docs)</text>
  <text x="640" y="342" font-size="10" fill="#1a1822">• Scope detection: file:, author:, date:</text>
  <text x="640" y="358" font-size="10" fill="#1a1822">• Question detection → AI mode</text>

  <line x1="640" y1="370" x2="870" y2="370" stroke="#d7d1e6"/>
  <text x="640" y="388" font-size="11" fill="#2f9d74" font-weight="bold">Zero-Result Handling</text>
  <text x="640" y="406" font-size="10" fill="#1a1822">• Broaden filters automatically</text>
  <text x="640" y="422" font-size="10" fill="#1a1822">• Suggest related queries</text>
  <text x="640" y="438" font-size="10" fill="#1a1822">• "No results" log → content gap</text>
  <text x="640" y="454" font-size="10" fill="#1a1822">• AI answer from general KB</text>
</svg>
