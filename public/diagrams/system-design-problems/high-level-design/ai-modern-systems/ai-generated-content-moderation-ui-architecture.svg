<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f3f1f8"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">AI-Generated Content Moderation UI — Architecture</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Detection pipeline top band -->
  <rect x="20" y="54" width="860" height="22" rx="6" fill="#6d5bd0" opacity="0.12"/>
  <text x="450" y="69" text-anchor="middle" font-size="11" fill="#6d5bd0" font-weight="bold">DETECTION PIPELINE (real-time, pre-publish)</text>

  <rect x="30" y="88" width="100" height="44" rx="7" fill="#6d5bd0"/>
  <text x="80" y="106" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Content Input</text>
  <text x="80" y="122" text-anchor="middle" font-size="10" fill="#edeaf5">text, image, video</text>
  <line x1="130" y1="110" x2="160" y2="110" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="160" y="88" width="120" height="44" rx="7" fill="#1a1822"/>
  <text x="220" y="106" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Fast Classifier</text>
  <text x="220" y="122" text-anchor="middle" font-size="10" fill="#d7d1e6">&lt;50ms, binary pass/flag</text>
  <line x1="280" y1="110" x2="310" y2="110" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="310" y="88" width="130" height="44" rx="7" fill="#2f9d74"/>
  <text x="375" y="106" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">LLM Scorer</text>
  <text x="375" y="122" text-anchor="middle" font-size="10" fill="#e8f5f0">category + confidence</text>
  <line x1="440" y1="110" x2="470" y2="110" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="470" y="88" width="120" height="44" rx="7" fill="#d97843"/>
  <text x="530" y="106" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Policy Engine</text>
  <text x="530" y="122" text-anchor="middle" font-size="10" fill="#fff">rule-based thresholds</text>
  <line x1="590" y1="110" x2="620" y2="110" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="620" y="88" width="120" height="44" rx="7" fill="#c0392b" opacity="0.85"/>
  <text x="680" y="106" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Routing</text>
  <text x="680" y="122" text-anchor="middle" font-size="10" fill="#fff">auto-block / queue / pass</text>
  <line x1="740" y1="110" x2="770" y2="110" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="770" y="88" width="110" height="44" rx="7" fill="#6d5bd0"/>
  <text x="825" y="106" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Review Queue</text>
  <text x="825" y="122" text-anchor="middle" font-size="10" fill="#edeaf5">human moderation</text>

  <!-- divider -->
  <line x1="20" y1="148" x2="880" y2="148" stroke="#d7d1e6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="450" y="164" text-anchor="middle" font-size="11" fill="#d97843" font-weight="bold">MODERATION UI PANELS</text>

  <!-- Left: Review Queue -->
  <rect x="20" y="174" width="240" height="330" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="140" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Review Queue</text>

  <rect x="35" y="208" width="210" height="38" rx="7" fill="#c0392b" opacity="0.12" stroke="#c0392b" stroke-width="1"/>
  <text x="140" y="224" text-anchor="middle" font-size="11" fill="#c0392b" font-weight="bold">🔴 High Confidence (2)</text>
  <text x="140" y="238" text-anchor="middle" font-size="10" fill="#1a1822">score &gt; 0.9 · auto-blocked</text>

  <rect x="35" y="254" width="210" height="38" rx="7" fill="#d97843" opacity="0.12" stroke="#d97843" stroke-width="1"/>
  <text x="140" y="270" text-anchor="middle" font-size="11" fill="#d97843" font-weight="bold">🟠 Review (14)</text>
  <text x="140" y="284" text-anchor="middle" font-size="10" fill="#1a1822">score 0.5–0.9 · human needed</text>

  <rect x="35" y="300" width="210" height="38" rx="7" fill="#2f9d74" opacity="0.12" stroke="#2f9d74" stroke-width="1"/>
  <text x="140" y="316" text-anchor="middle" font-size="11" fill="#2f9d74" font-weight="bold">🟢 Passed (1,204)</text>
  <text x="140" y="330" text-anchor="middle" font-size="10" fill="#1a1822">score &lt; 0.5 · auto-approved</text>

  <text x="35" y="358" font-size="10" fill="#6d5bd0" font-weight="bold">Queue Filters</text>
  <text x="35" y="374" font-size="10" fill="#1a1822">• Category: hate / spam / adult / pii</text>
  <text x="35" y="390" font-size="10" fill="#1a1822">• Score threshold range</text>
  <text x="35" y="406" font-size="10" fill="#1a1822">• Content type: text / image</text>
  <text x="35" y="422" font-size="10" fill="#1a1822">• Assigned to me</text>

  <rect x="35" y="434" width="210" height="56" rx="7" fill="#f3f1f8" stroke="#d7d1e6"/>
  <text x="140" y="452" text-anchor="middle" font-size="9" fill="#6d5bd0" font-weight="bold">SLA Tracking</text>
  <text x="40" y="468" font-size="9" fill="#1a1822">Oldest unreviewed: 4 min 22s</text>
  <text x="40" y="482" font-size="9" fill="#1a1822">SLA target: 10 min · On track ✓</text>

  <!-- Center: Case Review -->
  <rect x="280" y="174" width="330" height="330" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="445" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Case Review Panel</text>

  <!-- Content preview -->
  <rect x="295" y="208" width="300" height="74" rx="7" fill="#1a1822"/>
  <text x="445" y="228" text-anchor="middle" font-size="10" fill="#d97843" font-weight="bold">⚠ Flagged Content</text>
  <text x="303" y="246" font-size="10" fill="#fff">"This product is absolutely terrible.</text>
  <text x="303" y="262" font-size="10" fill="#fff">The company should be shut down and</text>
  <text x="303" y="276" font-size="10" fill="#fff">the founders should be [highlighted]..."</text>

  <!-- Score breakdown -->
  <rect x="295" y="290" width="300" height="80" rx="7" fill="#f3f1f8" stroke="#d7d1e6"/>
  <text x="445" y="308" text-anchor="middle" font-size="10" fill="#1a1822" font-weight="bold">AI Score Breakdown</text>
  <text x="303" y="326" font-size="10" fill="#c0392b" font-weight="bold">Harassment: 0.87 ↑ HIGH</text>
  <text x="303" y="342" font-size="10" fill="#1a1822">Hate speech: 0.23</text>
  <text x="303" y="358" font-size="10" fill="#1a1822">Spam: 0.04</text>
  <text x="545" y="326" text-anchor="end" font-size="9" fill="#d7d1e6">LLM reason:</text>
  <text x="545" y="340" text-anchor="end" font-size="9" fill="#d7d1e6">"threatening language</text>
  <text x="545" y="354" text-anchor="end" font-size="9" fill="#d7d1e6">targeting founders"</text>

  <!-- Action buttons -->
  <rect x="295" y="378" width="90" height="30" rx="5" fill="#c0392b"/>
  <text x="340" y="397" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">✕ Remove</text>
  <rect x="393" y="378" width="90" height="30" rx="5" fill="#d97843"/>
  <text x="438" y="397" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">✎ Edit</text>
  <rect x="491" y="378" width="90" height="30" rx="5" fill="#2f9d74"/>
  <text x="536" y="397" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">✓ Approve</text>

  <!-- Escalate + appeal -->
  <rect x="295" y="416" width="135" height="26" rx="5" fill="#6d5bd0" opacity="0.15" stroke="#6d5bd0" stroke-width="1"/>
  <text x="362" y="433" text-anchor="middle" font-size="9" fill="#6d5bd0">↑ Escalate to Senior</text>
  <rect x="438" y="416" width="157" height="26" rx="5" fill="#1a1822" opacity="0.1" stroke="#1a1822" stroke-width="1"/>
  <text x="516" y="433" text-anchor="middle" font-size="9" fill="#1a1822">📋 Add to Training Set</text>

  <!-- Feedback to model -->
  <rect x="295" y="450" width="300" height="40" rx="7" fill="#6d5bd0" opacity="0.08" stroke="#6d5bd0" stroke-width="1"/>
  <text x="445" y="468" text-anchor="middle" font-size="9" fill="#6d5bd0" font-weight="bold">Human decision → training signal</text>
  <text x="445" y="482" text-anchor="middle" font-size="9" fill="#1a1822">Approved / removed decisions retrain classifier</text>

  <!-- Right: Policy Config + Metrics -->
  <rect x="630" y="174" width="250" height="330" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="755" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Policy Config &amp; Metrics</text>

  <text x="640" y="218" font-size="11" fill="#6d5bd0" font-weight="bold">Threshold Configuration</text>
  <text x="640" y="236" font-size="10" fill="#1a1822">Auto-block if score &gt; 0.90</text>
  <text x="640" y="252" font-size="10" fill="#1a1822">Queue review if score 0.50–0.90</text>
  <text x="640" y="268" font-size="10" fill="#1a1822">Auto-pass if score &lt; 0.50</text>

  <line x1="640" y1="280" x2="868" y2="280" stroke="#d7d1e6"/>
  <text x="640" y="298" font-size="11" fill="#d97843" font-weight="bold">Detection Categories</text>
  <text x="640" y="316" font-size="10" fill="#1a1822">• Hate speech / harassment</text>
  <text x="640" y="332" font-size="10" fill="#1a1822">• Spam / promotional</text>
  <text x="640" y="348" font-size="10" fill="#1a1822">• Adult / explicit content</text>
  <text x="640" y="364" font-size="10" fill="#1a1822">• PII / doxxing</text>
  <text x="640" y="380" font-size="10" fill="#1a1822">• Misinformation flags</text>

  <line x1="640" y1="392" x2="868" y2="392" stroke="#d7d1e6"/>
  <text x="640" y="410" font-size="11" fill="#2f9d74" font-weight="bold">Moderation Metrics</text>
  <text x="640" y="428" font-size="10" fill="#1a1822">Precision (of flags)</text>
  <text x="868" y="428" text-anchor="end" font-size="10" fill="#2f9d74" font-weight="bold">91%</text>
  <text x="640" y="444" font-size="10" fill="#1a1822">Recall (of violations)</text>
  <text x="868" y="444" text-anchor="end" font-size="10" fill="#d97843" font-weight="bold">84%</text>
  <text x="640" y="460" font-size="10" fill="#1a1822">False positive rate</text>
  <text x="868" y="460" text-anchor="end" font-size="10" fill="#2f9d74" font-weight="bold">9%</text>
  <text x="640" y="476" font-size="10" fill="#1a1822">Avg review time</text>
  <text x="868" y="476" text-anchor="end" font-size="10" fill="#2f9d74" font-weight="bold">2m 14s</text>
  <text x="640" y="492" font-size="10" fill="#1a1822">Throughput (cases/hr)</text>
  <text x="868" y="492" text-anchor="end" font-size="10" fill="#6d5bd0" font-weight="bold">1,240</text>
</svg>
