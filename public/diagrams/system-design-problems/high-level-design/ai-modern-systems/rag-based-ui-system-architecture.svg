<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f3f1f8"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">RAG-Based UI System — Architecture &amp; Query Flow</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
  </defs>

  <!-- Ingestion Pipeline (top) -->
  <rect x="20" y="56" width="860" height="24" rx="6" fill="#6d5bd0" opacity="0.12"/>
  <text x="450" y="72" text-anchor="middle" font-size="11" fill="#6d5bd0" font-weight="bold">INGESTION PIPELINE (offline / background)</text>

  <rect x="30" y="90" width="110" height="46" rx="7" fill="#6d5bd0"/>
  <text x="85" y="109" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Documents</text>
  <text x="85" y="126" text-anchor="middle" font-size="10" fill="#edeaf5">PDF, MD, HTML</text>

  <line x1="140" y1="113" x2="175" y2="113" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="175" y="90" width="110" height="46" rx="7" fill="#6d5bd0" opacity="0.8"/>
  <text x="230" y="109" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Chunker</text>
  <text x="230" y="126" text-anchor="middle" font-size="10" fill="#edeaf5">512 tok, 20% overlap</text>

  <line x1="285" y1="113" x2="320" y2="113" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="320" y="90" width="120" height="46" rx="7" fill="#1a1822"/>
  <text x="380" y="109" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Embedder</text>
  <text x="380" y="126" text-anchor="middle" font-size="10" fill="#d7d1e6">text-embedding-3-large</text>

  <line x1="440" y1="113" x2="475" y2="113" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="475" y="90" width="120" height="46" rx="7" fill="#2f9d74"/>
  <text x="535" y="109" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Vector DB</text>
  <text x="535" y="126" text-anchor="middle" font-size="10" fill="#e8f5f0">Pinecone / pgvector</text>

  <line x1="595" y1="113" x2="630" y2="113" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="630" y="90" width="120" height="46" rx="7" fill="#d97843"/>
  <text x="690" y="109" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Metadata Index</text>
  <text x="690" y="126" text-anchor="middle" font-size="10" fill="#fff">source, date, tenant</text>

  <!-- Divider -->
  <line x1="20" y1="152" x2="880" y2="152" stroke="#d7d1e6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="450" y="168" text-anchor="middle" font-size="11" fill="#d97843" font-weight="bold">QUERY PIPELINE (real-time)</text>

  <!-- User query -->
  <rect x="30" y="178" width="110" height="46" rx="7" fill="#6d5bd0"/>
  <text x="85" y="197" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">User Query</text>
  <text x="85" y="214" text-anchor="middle" font-size="10" fill="#edeaf5">"How does X work?"</text>

  <line x1="140" y1="201" x2="175" y2="201" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="175" y="178" width="110" height="46" rx="7" fill="#6d5bd0" opacity="0.8"/>
  <text x="230" y="197" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Query Rewriter</text>
  <text x="230" y="214" text-anchor="middle" font-size="10" fill="#edeaf5">HyDE / sub-query</text>

  <line x1="285" y1="201" x2="320" y2="201" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="320" y="178" width="110" height="46" rx="7" fill="#1a1822"/>
  <text x="375" y="197" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Embed Query</text>
  <text x="375" y="214" text-anchor="middle" font-size="10" fill="#d7d1e6">same model as ingestion</text>

  <line x1="430" y1="201" x2="465" y2="201" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="465" y="178" width="130" height="46" rx="7" fill="#2f9d74"/>
  <text x="530" y="197" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">ANN Search</text>
  <text x="530" y="214" text-anchor="middle" font-size="10" fill="#e8f5f0">top-k=20, cosine sim</text>

  <line x1="595" y1="201" x2="630" y2="201" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="630" y="178" width="110" height="46" rx="7" fill="#d97843"/>
  <text x="685" y="197" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Re-ranker</text>
  <text x="685" y="214" text-anchor="middle" font-size="10" fill="#fff">cross-encoder, top-5</text>

  <line x1="740" y1="201" x2="775" y2="201" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="775" y="178" width="100" height="46" rx="7" fill="#6d5bd0"/>
  <text x="825" y="197" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">LLM + Context</text>
  <text x="825" y="214" text-anchor="middle" font-size="10" fill="#edeaf5">grounded answer</text>

  <!-- UI Panel -->
  <rect x="20" y="242" width="420" height="260" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="230" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">RAG UI Components</text>

  <rect x="35" y="276" width="185" height="40" rx="7" fill="#6d5bd0"/>
  <text x="127" y="293" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Query Composer</text>
  <text x="127" y="308" text-anchor="middle" font-size="10" fill="#edeaf5">filters: date, source, tenant</text>

  <rect x="230" y="276" width="195" height="40" rx="7" fill="#6d5bd0" opacity="0.75"/>
  <text x="327" y="293" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Source Citations Panel</text>
  <text x="327" y="308" text-anchor="middle" font-size="10" fill="#edeaf5">ranked chunks, scores, links</text>

  <rect x="35" y="326" width="185" height="40" rx="7" fill="#2f9d74"/>
  <text x="127" y="343" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Streaming Answer</text>
  <text x="127" y="358" text-anchor="middle" font-size="10" fill="#e8f5f0">inline [1][2] citation markers</text>

  <rect x="230" y="326" width="195" height="40" rx="7" fill="#1a1822"/>
  <text x="327" y="343" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Confidence Indicator</text>
  <text x="327" y="358" text-anchor="middle" font-size="10" fill="#d7d1e6">high / medium / low / no data</text>

  <rect x="35" y="376" width="185" height="40" rx="7" fill="#d97843"/>
  <text x="127" y="393" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Hallucination Guard</text>
  <text x="127" y="408" text-anchor="middle" font-size="10" fill="#fff">answer grounded? warn if not</text>

  <rect x="230" y="376" width="195" height="40" rx="7" fill="#2f9d74" opacity="0.7"/>
  <text x="327" y="393" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Feedback Buttons</text>
  <text x="327" y="408" text-anchor="middle" font-size="10" fill="#e8f5f0">👍 / 👎 → fine-tune signal</text>

  <rect x="35" y="426" width="390" height="60" rx="7" fill="#f3f1f8" stroke="#d7d1e6"/>
  <text x="230" y="445" text-anchor="middle" font-size="11" fill="#6d5bd0" font-weight="bold">Chunk Preview on hover</text>
  <text x="230" y="463" text-anchor="middle" font-size="10" fill="#1a1822">Citation [2] hover → shows source excerpt, relevance score, doc link</text>
  <text x="230" y="479" text-anchor="middle" font-size="10" fill="#1a1822">click → opens source document at the exact passage</text>

  <!-- Metrics panel -->
  <rect x="460" y="242" width="420" height="180" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="670" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Performance Targets</text>

  <text x="470" y="290" font-size="11" fill="#1a1822" font-weight="bold">Retrieval latency (ANN)</text>
  <text x="870" y="290" text-anchor="end" font-size="11" fill="#2f9d74" font-weight="bold">&lt; 80ms</text>

  <text x="470" y="312" font-size="11" fill="#1a1822" font-weight="bold">Re-ranker latency</text>
  <text x="870" y="312" text-anchor="end" font-size="11" fill="#2f9d74" font-weight="bold">&lt; 150ms</text>

  <text x="470" y="334" font-size="11" fill="#1a1822" font-weight="bold">Time to first token</text>
  <text x="870" y="334" text-anchor="end" font-size="11" fill="#d97843" font-weight="bold">&lt; 1200ms</text>

  <text x="470" y="356" font-size="11" fill="#1a1822" font-weight="bold">Chunk size</text>
  <text x="870" y="356" text-anchor="end" font-size="11" fill="#6d5bd0" font-weight="bold">512 tok / 20% overlap</text>

  <text x="470" y="378" font-size="11" fill="#1a1822" font-weight="bold">Top-k retrieved</text>
  <text x="870" y="378" text-anchor="end" font-size="11" fill="#6d5bd0" font-weight="bold">20 → re-rank → 5</text>

  <text x="470" y="400" font-size="11" fill="#1a1822" font-weight="bold">Embedding model</text>
  <text x="870" y="400" text-anchor="end" font-size="11" fill="#2f9d74" font-weight="bold">text-embedding-3-large</text>

  <!-- Hallucination note -->
  <rect x="460" y="432" width="420" height="70" rx="10" fill="#d97843" opacity="0.1" stroke="#d97843" stroke-width="1"/>
  <text x="670" y="453" text-anchor="middle" font-size="11" fill="#d97843" font-weight="bold">Hallucination Guard Logic</text>
  <text x="470" y="472" font-size="10" fill="#1a1822">For each sentence in answer → check if citation chunk supports it</text>
  <text x="470" y="489" font-size="10" fill="#1a1822">If no supporting chunk found → flag sentence with ⚠ warning overlay</text>
</svg>
