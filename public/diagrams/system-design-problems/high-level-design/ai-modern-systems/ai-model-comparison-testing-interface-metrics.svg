<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="480" fill="#f3f1f8"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">Evaluation Dimensions, Scoring &amp; Cost-Quality Trade-off</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
  </defs>

  <!-- Left: Eval dimensions -->
  <rect x="20" y="54" width="280" height="410" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="160" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Scoring Dimensions</text>

  <rect x="35" y="88" width="250" height="46" rx="7" fill="#6d5bd0"/>
  <text x="160" y="107" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Correctness (LLM judge)</text>
  <text x="160" y="123" text-anchor="middle" font-size="10" fill="#edeaf5">Factual accuracy · score 1–5</text>

  <rect x="35" y="142" width="250" height="46" rx="7" fill="#2f9d74"/>
  <text x="160" y="161" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Relevance (LLM judge)</text>
  <text x="160" y="177" text-anchor="middle" font-size="10" fill="#e8f5f0">Answers the question asked</text>

  <rect x="35" y="196" width="250" height="46" rx="7" fill="#1a1822"/>
  <text x="160" y="215" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Conciseness (deterministic)</text>
  <text x="160" y="231" text-anchor="middle" font-size="10" fill="#d7d1e6">Token count vs. target range</text>

  <rect x="35" y="250" width="250" height="46" rx="7" fill="#d97843"/>
  <text x="160" y="269" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Safety / Refusal (LLM judge)</text>
  <text x="160" y="285" text-anchor="middle" font-size="10" fill="#fff">Handles OOD / harmful queries</text>

  <rect x="35" y="304" width="250" height="46" rx="7" fill="#6d5bd0" opacity="0.6"/>
  <text x="160" y="323" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Format Compliance (regex)</text>
  <text x="160" y="339" text-anchor="middle" font-size="10" fill="#edeaf5">Markdown, JSON schema, citations</text>

  <rect x="35" y="358" width="250" height="46" rx="7" fill="#2f9d74" opacity="0.7"/>
  <text x="160" y="377" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Human Preference (blind vote)</text>
  <text x="160" y="393" text-anchor="middle" font-size="10" fill="#e8f5f0">Elo ranking from pairwise votes</text>

  <rect x="35" y="412" width="250" height="38" rx="7" fill="#f3f1f8" stroke="#d7d1e6"/>
  <text x="160" y="427" text-anchor="middle" font-size="9" fill="#1a1822">Composite = weighted avg of all dims</text>
  <text x="160" y="443" text-anchor="middle" font-size="9" fill="#1a1822">Weights configurable per use case</text>

  <!-- Center: Radar chart mockup + scatter -->
  <rect x="320" y="54" width="280" height="410" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="460" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Radar &amp; Scatter Views</text>

  <!-- Radar chart mockup -->
  <text x="460" y="100" text-anchor="middle" font-size="10" fill="#1a1822" font-weight="bold">Radar: Score by Dimension</text>

  <!-- Radar center -->
  <polygon points="460,190 420,160 395,120 460,110 525,120 500,160" fill="#6d5bd0" opacity="0.2" stroke="#6d5bd0" stroke-width="1.5"/>
  <polygon points="460,190 424,162 402,122 460,114 518,122 497,162" fill="none" stroke="#d7d1e6" stroke-width="1"/>
  <polygon points="460,190 430,166 410,128 460,120 510,128 491,166" fill="none" stroke="#d7d1e6" stroke-width="1"/>
  <!-- Model B (green) overlay -->
  <polygon points="460,192 416,163 398,126 460,112 521,118 499,158" fill="#2f9d74" opacity="0.15" stroke="#2f9d74" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Axis labels -->
  <text x="460" y="106" text-anchor="middle" font-size="9" fill="#6d5bd0">Correctness</text>
  <text x="528" y="118" font-size="9" fill="#6d5bd0">Relevance</text>
  <text x="504" y="196" font-size="9" fill="#6d5bd0">Concise</text>
  <text x="385" y="196" font-size="9" fill="#6d5bd0">Safety</text>
  <text x="370" y="118" font-size="9" fill="#6d5bd0">Format</text>

  <!-- Legend -->
  <rect x="395" y="210" width="14" height="10" rx="2" fill="#6d5bd0" opacity="0.5"/>
  <text x="413" y="220" font-size="9" fill="#1a1822">claude-sonnet</text>
  <rect x="490" y="210" width="14" height="10" rx="2" fill="#2f9d74" opacity="0.5"/>
  <text x="508" y="220" font-size="9" fill="#1a1822">gpt-4o</text>

  <line x1="335" y1="234" x2="585" y2="234" stroke="#d7d1e6"/>
  <text x="460" y="252" text-anchor="middle" font-size="10" fill="#1a1822" font-weight="bold">Scatter: Quality vs. Cost</text>

  <!-- Scatter axes -->
  <line x1="345" y1="440" x2="575" y2="440" stroke="#1a1822" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="345" y1="440" x2="345" y2="260" stroke="#1a1822" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="460" y="458" text-anchor="middle" font-size="9" fill="#1a1822">Cost per call (USD)</text>
  <text x="330" y="350" text-anchor="middle" font-size="9" fill="#1a1822" transform="rotate(-90,330,350)">Quality score</text>

  <!-- Data points -->
  <circle cx="380" cy="340" r="8" fill="#d97843" opacity="0.8"/>
  <text x="392" y="338" font-size="8" fill="#1a1822">llama-3</text>
  <circle cx="425" cy="310" r="8" fill="#1a1822" opacity="0.8"/>
  <text x="437" y="308" font-size="8" fill="#1a1822">gpt-4o</text>
  <circle cx="465" cy="285" r="8" fill="#2f9d74" opacity="0.9"/>
  <text x="477" y="283" font-size="8" fill="#1a1822">gemini</text>
  <circle cx="520" cy="275" r="10" fill="#6d5bd0"/>
  <text x="533" y="273" font-size="8" fill="#6d5bd0" font-weight="bold">claude</text>

  <!-- Pareto frontier line -->
  <polyline points="380,340 425,310 465,285 520,275" fill="none" stroke="#d97843" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="430" y="424" text-anchor="middle" font-size="9" fill="#d97843">Pareto frontier (optimal quality/cost)</text>

  <!-- Right: Test suite anatomy -->
  <rect x="620" y="54" width="260" height="410" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="750" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Test Suite Design</text>

  <text x="630" y="100" font-size="11" fill="#6d5bd0" font-weight="bold">Test Case Types</text>
  <rect x="630" y="108" width="238" height="36" rx="5" fill="#6d5bd0" opacity="0.1" stroke="#6d5bd0" stroke-width="1"/>
  <text x="634" y="124" font-size="10" fill="#6d5bd0" font-weight="bold">Golden examples</text>
  <text x="634" y="137" font-size="9" fill="#1a1822">Known input → expected output pairs</text>

  <rect x="630" y="150" width="238" height="36" rx="5" fill="#2f9d74" opacity="0.1" stroke="#2f9d74" stroke-width="1"/>
  <text x="634" y="166" font-size="10" fill="#2f9d74" font-weight="bold">Adversarial cases</text>
  <text x="634" y="179" font-size="9" fill="#1a1822">Jailbreaks, OOD, ambiguous Q</text>

  <rect x="630" y="192" width="238" height="36" rx="5" fill="#1a1822" opacity="0.1" stroke="#1a1822" stroke-width="1"/>
  <text x="634" y="208" font-size="10" fill="#1a1822" font-weight="bold">Edge cases</text>
  <text x="634" y="221" font-size="9" fill="#1a1822">Empty input, max-token overflow</text>

  <rect x="630" y="234" width="238" height="36" rx="5" fill="#d97843" opacity="0.1" stroke="#d97843" stroke-width="1"/>
  <text x="634" y="250" font-size="10" fill="#d97843" font-weight="bold">Regression suite</text>
  <text x="634" y="263" font-size="9" fill="#1a1822">Past failures that must now pass</text>

  <line x1="630" y1="280" x2="868" y2="280" stroke="#d7d1e6"/>
  <text x="630" y="298" font-size="11" fill="#d97843" font-weight="bold">Blind Evaluation Protocol</text>
  <text x="630" y="316" font-size="10" fill="#1a1822">• Model names hidden during voting</text>
  <text x="630" y="332" font-size="10" fill="#1a1822">• Responses shuffled per case</text>
  <text x="630" y="348" font-size="10" fill="#1a1822">• Elo rating updated per pairwise</text>
  <text x="630" y="364" font-size="10" fill="#1a1822">• Min 30 votes before ranking</text>

  <line x1="630" y1="376" x2="868" y2="376" stroke="#d7d1e6"/>
  <text x="630" y="394" font-size="11" fill="#2f9d74" font-weight="bold">Caching Strategy</text>
  <text x="630" y="412" font-size="10" fill="#1a1822">Key: hash(model, version, prompt)</text>
  <text x="630" y="428" font-size="10" fill="#1a1822">TTL: 7 days (model behavior stable)</text>
  <text x="630" y="444" font-size="10" fill="#1a1822">Cache miss: fresh API call + store</text>
  <text x="630" y="460" font-size="10" fill="#1a1822">Re-score without re-calling model</text>
</svg>
