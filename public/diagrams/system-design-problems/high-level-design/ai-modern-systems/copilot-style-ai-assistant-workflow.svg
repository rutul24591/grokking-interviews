<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f3f1f8"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">Copilot Request Lifecycle — Intent → Permission → Execution</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Sequence lifelines -->
  <text x="80" y="68" text-anchor="middle" font-size="10" fill="#6d5bd0" font-weight="bold">User</text>
  <rect x="42" y="72" width="76" height="28" rx="5" fill="#6d5bd0"/>
  <text x="80" y="91" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Copilot Panel</text>
  <line x1="80" y1="100" x2="80" y2="500" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="6,4"/>

  <text x="240" y="68" text-anchor="middle" font-size="10" fill="#1a1822" font-weight="bold">Context</text>
  <rect x="192" y="72" width="96" height="28" rx="5" fill="#1a1822"/>
  <text x="240" y="91" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Assembler</text>
  <line x1="240" y1="100" x2="240" y2="500" stroke="#1a1822" stroke-width="1.5" stroke-dasharray="6,4"/>

  <text x="400" y="68" text-anchor="middle" font-size="10" fill="#1a1822" font-weight="bold">Intent</text>
  <rect x="352" y="72" width="96" height="28" rx="5" fill="#1a1822"/>
  <text x="400" y="91" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Classifier</text>
  <line x1="400" y1="100" x2="400" y2="500" stroke="#1a1822" stroke-width="1.5" stroke-dasharray="6,4"/>

  <text x="560" y="68" text-anchor="middle" font-size="10" fill="#2f9d74" font-weight="bold">Permission</text>
  <rect x="510" y="72" width="100" height="28" rx="5" fill="#2f9d74"/>
  <text x="560" y="91" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Guard</text>
  <line x1="560" y1="100" x2="560" y2="500" stroke="#2f9d74" stroke-width="1.5" stroke-dasharray="6,4"/>

  <text x="720" y="68" text-anchor="middle" font-size="10" fill="#d97843" font-weight="bold">LLM + Tools</text>
  <rect x="668" y="72" width="104" height="28" rx="5" fill="#d97843"/>
  <text x="720" y="91" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Router</text>
  <line x1="720" y1="100" x2="720" y2="500" stroke="#d97843" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Step 1: User sends query -->
  <line x1="80" y1="126" x2="228" y2="126" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="154" y="120" text-anchor="middle" font-size="9" fill="#6d5bd0">query + page state</text>

  <!-- Step 2: Assemble context -->
  <rect x="204" y="134" width="72" height="24" rx="4" fill="#1a1822" opacity="0.15"/>
  <text x="240" y="150" text-anchor="middle" font-size="9" fill="#1a1822">build prompt ctx</text>
  <line x1="240" y1="158" x2="388" y2="158" stroke="#1a1822" stroke-width="2" marker-end="url(#arr)"/>
  <text x="314" y="152" text-anchor="middle" font-size="9" fill="#1a1822">serialized context</text>

  <!-- Step 3: Classify intent -->
  <rect x="364" y="166" width="72" height="24" rx="4" fill="#1a1822" opacity="0.15"/>
  <text x="400" y="182" text-anchor="middle" font-size="9" fill="#1a1822">read|write|nav</text>
  <line x1="400" y1="190" x2="548" y2="190" stroke="#1a1822" stroke-width="2" marker-end="url(#arr)"/>
  <text x="474" y="184" text-anchor="middle" font-size="9" fill="#1a1822">intent + scope</text>

  <!-- Step 4: Permission check -->
  <rect x="524" y="198" width="72" height="24" rx="4" fill="#2f9d74" opacity="0.15"/>
  <text x="560" y="214" text-anchor="middle" font-size="9" fill="#2f9d74">check RBAC</text>

  <!-- Step 4a: Allowed -->
  <line x1="560" y1="222" x2="708" y2="222" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="634" y="216" text-anchor="middle" font-size="9" fill="#2f9d74">allowed ✓</text>

  <!-- Step 4b: Blocked (return) -->
  <line x1="560" y1="242" x2="92" y2="242" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-r)"/>
  <text x="320" y="236" text-anchor="middle" font-size="9" fill="#c0392b">blocked → "You don't have permission"</text>

  <!-- Step 5: LLM decides -->
  <rect x="684" y="250" width="72" height="40" rx="4" fill="#d97843" opacity="0.15"/>
  <text x="720" y="266" text-anchor="middle" font-size="9" fill="#d97843">LLM decides:</text>
  <text x="720" y="280" text-anchor="middle" font-size="9" fill="#d97843">stream vs tool</text>

  <!-- Step 5a: Read → stream answer -->
  <line x1="720" y1="290" x2="92" y2="316" stroke="#2f9d74" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-g)"/>
  <text x="400" y="308" text-anchor="middle" font-size="9" fill="#2f9d74">stream tokens (read intent)</text>

  <!-- Step 5b: Write → tool call -->
  <rect x="684" y="322" width="72" height="24" rx="4" fill="#d97843" opacity="0.15"/>
  <text x="720" y="338" text-anchor="middle" font-size="9" fill="#d97843">tool_call event</text>
  <line x1="720" y1="346" x2="92" y2="346" stroke="#d97843" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="400" y="340" text-anchor="middle" font-size="9" fill="#d97843">approval gate (write/delete)</text>

  <!-- User confirms -->
  <line x1="80" y1="362" x2="708" y2="362" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="390" y="356" text-anchor="middle" font-size="9" fill="#6d5bd0">user confirms → execute</text>

  <!-- Execute action -->
  <rect x="684" y="370" width="72" height="24" rx="4" fill="#d97843" opacity="0.15"/>
  <text x="720" y="386" text-anchor="middle" font-size="9" fill="#d97843">action executor</text>
  <line x1="720" y1="394" x2="92" y2="394" stroke="#2f9d74" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-g)"/>
  <text x="400" y="388" text-anchor="middle" font-size="9" fill="#2f9d74">result + audit log written</text>

  <!-- Audit log note -->
  <rect x="684" y="406" width="72" height="24" rx="4" fill="#1a1822" opacity="0.2"/>
  <text x="720" y="422" text-anchor="middle" font-size="9" fill="#1a1822">audit log ✓</text>

  <!-- Right panel: Intent types -->
  <rect x="790" y="110" width="100" height="380" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="840" y="132" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Intent Types</text>

  <rect x="800" y="140" width="80" height="30" rx="5" fill="#6d5bd0"/>
  <text x="840" y="158" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">READ</text>
  <text x="840" y="170" text-anchor="middle" font-size="8" fill="#edeaf5">→ stream answer</text>

  <rect x="800" y="178" width="80" height="30" rx="5" fill="#2f9d74"/>
  <text x="840" y="196" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">WRITE</text>
  <text x="840" y="208" text-anchor="middle" font-size="8" fill="#e8f5f0">→ approval gate</text>

  <rect x="800" y="216" width="80" height="30" rx="5" fill="#d97843"/>
  <text x="840" y="234" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">NAVIGATE</text>
  <text x="840" y="246" text-anchor="middle" font-size="8" fill="#fff">→ route change</text>

  <rect x="800" y="254" width="80" height="30" rx="5" fill="#1a1822"/>
  <text x="840" y="272" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">EXPLAIN</text>
  <text x="840" y="284" text-anchor="middle" font-size="8" fill="#d7d1e6">→ no side effects</text>

  <line x1="800" y1="296" x2="880" y2="296" stroke="#d7d1e6"/>
  <text x="840" y="312" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Latency</text>
  <text x="800" y="328" font-size="9" fill="#1a1822">Read TTFT</text>
  <text x="878" y="328" text-anchor="end" font-size="9" fill="#2f9d74" font-weight="bold">&lt;800ms</text>
  <text x="800" y="344" font-size="9" fill="#1a1822">Write confirm</text>
  <text x="878" y="344" text-anchor="end" font-size="9" fill="#d97843" font-weight="bold">user-gated</text>
  <text x="800" y="360" font-size="9" fill="#1a1822">Context build</text>
  <text x="878" y="360" text-anchor="end" font-size="9" fill="#2f9d74" font-weight="bold">&lt;50ms</text>
  <text x="800" y="376" font-size="9" fill="#1a1822">Classify intent</text>
  <text x="878" y="376" text-anchor="end" font-size="9" fill="#2f9d74" font-weight="bold">&lt;100ms</text>

  <line x1="800" y1="388" x2="880" y2="388" stroke="#d7d1e6"/>
  <rect x="800" y="396" width="80" height="84" rx="5" fill="#d97843" opacity="0.1" stroke="#d97843" stroke-width="1"/>
  <text x="840" y="412" text-anchor="middle" font-size="9" fill="#d97843" font-weight="bold">Audit Fields</text>
  <text x="804" y="428" font-size="8" fill="#1a1822">actor (userId)</text>
  <text x="804" y="442" font-size="8" fill="#1a1822">AI action taken</text>
  <text x="804" y="456" font-size="8" fill="#1a1822">before state</text>
  <text x="804" y="470" font-size="8" fill="#1a1822">after state</text>
</svg>
