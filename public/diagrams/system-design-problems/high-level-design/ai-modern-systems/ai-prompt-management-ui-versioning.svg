<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="480" fill="#f3f1f8"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">Prompt Versioning, Diff View &amp; A/B Flow</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
  </defs>

  <!-- Version timeline top -->
  <rect x="20" y="54" width="560" height="160" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="300" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Version Timeline &amp; Diff View</text>

  <!-- v1 -->
  <circle cx="70" cy="120" r="18" fill="#d7d1e6"/>
  <text x="70" y="125" text-anchor="middle" font-size="11" fill="#1a1822" font-weight="bold">v1</text>
  <text x="70" y="152" text-anchor="middle" font-size="9" fill="#1a1822">2026-03-01</text>
  <text x="70" y="165" text-anchor="middle" font-size="9" fill="#d97843">deprecated</text>

  <line x1="88" y1="120" x2="152" y2="120" stroke="#d7d1e6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- v2 -->
  <circle cx="170" cy="120" r="18" fill="#d7d1e6"/>
  <text x="170" y="125" text-anchor="middle" font-size="11" fill="#1a1822" font-weight="bold">v2</text>
  <text x="170" y="152" text-anchor="middle" font-size="9" fill="#1a1822">2026-04-10</text>
  <text x="170" y="165" text-anchor="middle" font-size="9" fill="#d97843">deprecated</text>

  <line x1="188" y1="120" x2="252" y2="120" stroke="#d7d1e6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- v3 (current prod) -->
  <circle cx="270" cy="120" r="22" fill="#2f9d74"/>
  <text x="270" y="125" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">v3</text>
  <text x="270" y="152" text-anchor="middle" font-size="9" fill="#1a1822">2026-05-01</text>
  <text x="270" y="165" text-anchor="middle" font-size="9" fill="#2f9d74" font-weight="bold">production</text>

  <line x1="292" y1="120" x2="356" y2="120" stroke="#6d5bd0" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- v4 (challenger) -->
  <circle cx="374" cy="120" r="22" fill="#6d5bd0"/>
  <text x="374" y="125" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">v4</text>
  <text x="374" y="152" text-anchor="middle" font-size="9" fill="#1a1822">2026-05-10</text>
  <text x="374" y="165" text-anchor="middle" font-size="9" fill="#6d5bd0" font-weight="bold">staging/AB</text>

  <line x1="396" y1="120" x2="460" y2="120" stroke="#d7d1e6" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr)"/>

  <!-- v5 (draft) -->
  <circle cx="478" cy="120" r="18" fill="#d7d1e6" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="478" y="125" text-anchor="middle" font-size="11" fill="#6d5bd0" font-weight="bold">v5</text>
  <text x="478" y="152" text-anchor="middle" font-size="9" fill="#1a1822">in progress</text>
  <text x="478" y="165" text-anchor="middle" font-size="9" fill="#6d5bd0">draft</text>

  <!-- Diff area bottom of timeline panel -->
  <rect x="35" y="174" width="530" height="32" rx="5" fill="#1a1822"/>
  <text x="40" y="188" font-size="9" fill="#c0392b">- You are a helpful assistant. Answer in a &#123;&#123;tone&#125;&#125; tone.</text>
  <text x="40" y="201" font-size="9" fill="#2f9d74">+ You are a helpful assistant for &#123;&#123;company&#125;&#125;. Answer in a &#123;&#123;tone&#125;&#125; tone. Cite sources.</text>

  <!-- A/B Test Panel -->
  <rect x="20" y="228" width="560" height="240" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="300" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">A/B Test Dashboard</text>

  <!-- Champion (v3) metrics -->
  <rect x="35" y="260" width="255" height="194" rx="7" fill="#2f9d74" opacity="0.07" stroke="#2f9d74" stroke-width="1.5"/>
  <text x="162" y="280" text-anchor="middle" font-size="11" fill="#2f9d74" font-weight="bold">Champion — v3 (90% traffic)</text>

  <text x="45" y="300" font-size="10" fill="#1a1822" font-weight="bold">Avg score (LLM judge)</text>
  <text x="283" y="300" text-anchor="end" font-size="10" fill="#2f9d74" font-weight="bold">4.12 / 5</text>
  <text x="45" y="318" font-size="10" fill="#1a1822">Latency P95</text>
  <text x="283" y="318" text-anchor="end" font-size="10" fill="#2f9d74">1,240ms</text>
  <text x="45" y="336" font-size="10" fill="#1a1822">Token cost / call</text>
  <text x="283" y="336" text-anchor="end" font-size="10" fill="#2f9d74">$0.0022</text>
  <text x="45" y="354" font-size="10" fill="#1a1822">User thumbs-up rate</text>
  <text x="283" y="354" text-anchor="end" font-size="10" fill="#2f9d74">82%</text>
  <text x="45" y="372" font-size="10" fill="#1a1822">Error rate</text>
  <text x="283" y="372" text-anchor="end" font-size="10" fill="#2f9d74">0.3%</text>
  <text x="45" y="390" font-size="10" fill="#1a1822">Calls (7d)</text>
  <text x="283" y="390" text-anchor="end" font-size="10" fill="#2f9d74">142,000</text>
  <text x="162" y="444" text-anchor="middle" font-size="9" fill="#2f9d74">current winner</text>

  <!-- Challenger (v4) metrics -->
  <rect x="302" y="260" width="255" height="194" rx="7" fill="#6d5bd0" opacity="0.07" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="430" y="280" text-anchor="middle" font-size="11" fill="#6d5bd0" font-weight="bold">Challenger — v4 (10% traffic)</text>

  <text x="312" y="300" font-size="10" fill="#1a1822" font-weight="bold">Avg score (LLM judge)</text>
  <text x="550" y="300" text-anchor="end" font-size="10" fill="#6d5bd0" font-weight="bold">4.31 / 5 ↑</text>
  <text x="312" y="318" font-size="10" fill="#1a1822">Latency P95</text>
  <text x="550" y="318" text-anchor="end" font-size="10" fill="#6d5bd0">1,180ms ↓</text>
  <text x="312" y="336" font-size="10" fill="#1a1822">Token cost / call</text>
  <text x="550" y="336" text-anchor="end" font-size="10" fill="#d97843">$0.0031 ↑</text>
  <text x="312" y="354" font-size="10" fill="#1a1822">User thumbs-up rate</text>
  <text x="550" y="354" text-anchor="end" font-size="10" fill="#6d5bd0">86% ↑</text>
  <text x="312" y="372" font-size="10" fill="#1a1822">Error rate</text>
  <text x="550" y="372" text-anchor="end" font-size="10" fill="#6d5bd0">0.2% ↓</text>
  <text x="312" y="390" font-size="10" fill="#1a1822">Calls (7d)</text>
  <text x="550" y="390" text-anchor="end" font-size="10" fill="#6d5bd0">15,800</text>

  <rect x="312" y="412" width="120" height="28" rx="5" fill="#6d5bd0"/>
  <text x="372" y="430" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">▲ Promote to Prod</text>
  <rect x="440" y="412" width="110" height="28" rx="5" fill="#c0392b" opacity="0.15" stroke="#c0392b" stroke-width="1"/>
  <text x="495" y="430" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="bold">✕ Rollback</text>

  <!-- Right side: Evaluation scores + cost -->
  <rect x="600" y="54" width="280" height="414" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="740" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Evaluation Dimensions</text>

  <rect x="610" y="86" width="258" height="44" rx="7" fill="#6d5bd0"/>
  <text x="739" y="104" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Correctness</text>
  <text x="739" y="120" text-anchor="middle" font-size="10" fill="#edeaf5">Factual accuracy vs. ground truth</text>

  <rect x="610" y="138" width="258" height="44" rx="7" fill="#2f9d74"/>
  <text x="739" y="156" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Relevance</text>
  <text x="739" y="172" text-anchor="middle" font-size="10" fill="#e8f5f0">Answers the actual question asked</text>

  <rect x="610" y="190" width="258" height="44" rx="7" fill="#1a1822"/>
  <text x="739" y="208" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Tone Adherence</text>
  <text x="739" y="224" text-anchor="middle" font-size="10" fill="#d7d1e6">Matches specified &#123;&#123;tone&#125;&#125; variable</text>

  <rect x="610" y="242" width="258" height="44" rx="7" fill="#d97843"/>
  <text x="739" y="260" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Safety / Refusal</text>
  <text x="739" y="276" text-anchor="middle" font-size="10" fill="#fff">Handles OOD queries gracefully</text>

  <rect x="610" y="294" width="258" height="44" rx="7" fill="#6d5bd0" opacity="0.6"/>
  <text x="739" y="312" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Conciseness</text>
  <text x="739" y="328" text-anchor="middle" font-size="10" fill="#edeaf5">Token count vs. acceptable range</text>

  <line x1="610" y1="348" x2="868" y2="348" stroke="#d7d1e6"/>
  <text x="610" y="368" font-size="11" fill="#d97843" font-weight="bold">Cost Estimator</text>
  <text x="610" y="386" font-size="10" fill="#1a1822">Input tokens × $/1M input</text>
  <text x="610" y="402" font-size="10" fill="#1a1822">Output tokens × $/1M output</text>
  <text x="610" y="418" font-size="10" fill="#1a1822">Estimated monthly cost at N calls/day</text>
  <text x="610" y="434" font-size="10" fill="#1a1822">Cache hit rate reduces effective cost</text>
  <text x="610" y="450" font-size="10" fill="#1a1822">Break-even analysis: new vs. current</text>
</svg>
