<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="480" fill="#f3f1f8"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">Multi-Agent Run Lifecycle &amp; State Machine</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- State machine left panel -->
  <rect x="20" y="54" width="340" height="410" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="190" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Agent State Machine</text>

  <!-- State nodes -->
  <rect x="140" y="90" width="100" height="32" rx="7" fill="#d7d1e6"/>
  <text x="190" y="111" text-anchor="middle" font-size="11" fill="#1a1822" font-weight="bold">idle</text>

  <line x1="190" y1="122" x2="190" y2="146" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="198" y="138" font-size="9" fill="#6d5bd0">trigger</text>

  <rect x="140" y="146" width="100" height="32" rx="7" fill="#6d5bd0"/>
  <text x="190" y="167" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">planning</text>

  <line x1="190" y1="178" x2="190" y2="202" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="198" y="194" font-size="9" fill="#6d5bd0">delegated</text>

  <rect x="140" y="202" width="100" height="32" rx="7" fill="#6d5bd0" opacity="0.75"/>
  <text x="190" y="223" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">running</text>

  <!-- Branches from running -->
  <line x1="190" y1="234" x2="190" y2="258" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <line x1="140" y1="218" x2="60" y2="258" stroke="#d97843" stroke-width="2" marker-end="url(#arr-o)"/>
  <line x1="240" y1="218" x2="310" y2="258" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-r)"/>

  <text x="80" y="250" text-anchor="middle" font-size="9" fill="#d97843">HITL gate</text>
  <text x="310" y="250" text-anchor="middle" font-size="9" fill="#c0392b">error</text>

  <rect x="140" y="258" width="100" height="32" rx="7" fill="#2f9d74"/>
  <text x="190" y="279" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">done</text>

  <rect x="30" y="258" width="90" height="32" rx="7" fill="#d97843"/>
  <text x="75" y="279" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">waiting</text>

  <rect x="270" y="258" width="70" height="32" rx="7" fill="#c0392b" opacity="0.8"/>
  <text x="305" y="279" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">error</text>

  <!-- waiting → resume -->
  <line x1="75" y1="290" x2="140" y2="218" stroke="#d97843" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-o)"/>
  <text x="90" y="316" text-anchor="middle" font-size="9" fill="#d97843">user approves</text>

  <!-- error → retry -->
  <line x1="305" y1="290" x2="240" y2="218" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-r)"/>
  <text x="295" y="316" text-anchor="middle" font-size="9" fill="#c0392b">retry (exp backoff)</text>

  <!-- SSE events -->
  <rect x="30" y="344" width="320" height="110" rx="7" fill="#f3f1f8" stroke="#d7d1e6"/>
  <text x="190" y="364" text-anchor="middle" font-size="10" fill="#6d5bd0" font-weight="bold">SSE Event Types (server → browser)</text>
  <text x="36" y="382" font-size="9" fill="#6d5bd0">agent_status</text>
  <text x="170" y="382" font-size="9" fill="#1a1822">&#123; agentId, state, timestamp &#125;</text>
  <text x="36" y="398" font-size="9" fill="#2f9d74">thought_token</text>
  <text x="170" y="398" font-size="9" fill="#1a1822">&#123; agentId, token &#125;</text>
  <text x="36" y="414" font-size="9" fill="#d97843">tool_call</text>
  <text x="170" y="414" font-size="9" fill="#1a1822">&#123; agentId, tool, input, output &#125;</text>
  <text x="36" y="430" font-size="9" fill="#c0392b">hitl_gate</text>
  <text x="170" y="430" font-size="9" fill="#1a1822">&#123; agentId, prompt, options &#125;</text>
  <text x="36" y="446" font-size="9" fill="#6d5bd0">run_complete</text>
  <text x="170" y="446" font-size="9" fill="#1a1822">&#123; artifacts, metrics &#125;</text>

  <!-- Right panel: Timeline waterfall -->
  <rect x="380" y="54" width="500" height="410" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="630" y="76" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Parallel Agent Timeline (Waterfall View)</text>

  <!-- Timeline grid -->
  <text x="395" y="100" font-size="9" fill="#d7d1e6">0s</text>
  <text x="502" y="100" font-size="9" fill="#d7d1e6">10s</text>
  <text x="609" y="100" font-size="9" fill="#d7d1e6">20s</text>
  <text x="716" y="100" font-size="9" fill="#d7d1e6">30s</text>
  <text x="823" y="100" font-size="9" fill="#d7d1e6">40s</text>

  <line x1="395" y1="104" x2="395" y2="430" stroke="#d7d1e6" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="502" y1="104" x2="502" y2="430" stroke="#d7d1e6" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="609" y1="104" x2="609" y2="430" stroke="#d7d1e6" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="716" y1="104" x2="716" y2="430" stroke="#d7d1e6" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="823" y1="104" x2="823" y2="430" stroke="#d7d1e6" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Orchestrator bar -->
  <text x="390" y="128" font-size="10" fill="#1a1822" font-weight="bold">Orchestrator</text>
  <rect x="395" y="132" width="430" height="20" rx="4" fill="#6d5bd0"/>
  <text x="610" y="146" text-anchor="middle" font-size="9" fill="#fff">planning + aggregating</text>

  <!-- Researcher bar (parallel with Analyst) -->
  <text x="390" y="172" font-size="10" fill="#1a1822" font-weight="bold">Researcher</text>
  <rect x="395" y="176" width="200" height="20" rx="4" fill="#2f9d74"/>
  <text x="495" y="190" text-anchor="middle" font-size="9" fill="#fff">web search + retrieval</text>

  <!-- Analyst bar -->
  <text x="390" y="212" font-size="10" fill="#1a1822" font-weight="bold">Analyst</text>
  <rect x="395" y="216" width="230" height="20" rx="4" fill="#2f9d74" opacity="0.8"/>
  <text x="510" y="230" text-anchor="middle" font-size="9" fill="#fff">data + code execution</text>

  <!-- HITL pause marker -->
  <line x1="608" y1="152" x2="608" y2="295" stroke="#d97843" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="616" y="168" font-size="9" fill="#d97843" font-weight="bold">HITL pause</text>
  <text x="616" y="180" font-size="9" fill="#d97843">user reviews</text>

  <!-- Writer bar (starts after HITL) -->
  <text x="390" y="252" font-size="10" fill="#1a1822" font-weight="bold">Writer</text>
  <rect x="608" y="256" width="170" height="20" rx="4" fill="#1a1822"/>
  <text x="693" y="270" text-anchor="middle" font-size="9" fill="#fff">draft synthesis</text>

  <!-- Critic bar -->
  <text x="390" y="292" font-size="10" fill="#1a1822" font-weight="bold">Critic</text>
  <rect x="716" y="296" width="109" height="20" rx="4" fill="#d97843"/>
  <text x="770" y="310" text-anchor="middle" font-size="9" fill="#fff">review + score</text>

  <!-- Final output -->
  <line x1="825" y1="156" x2="825" y2="328" stroke="#6d5bd0" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="833" y="180" font-size="9" fill="#6d5bd0" font-weight="bold">final</text>
  <text x="833" y="192" font-size="9" fill="#6d5bd0">output</text>

  <!-- Metrics bar -->
  <rect x="395" y="338" width="460" height="80" rx="7" fill="#f3f1f8" stroke="#d7d1e6"/>
  <text x="625" y="358" text-anchor="middle" font-size="10" fill="#6d5bd0" font-weight="bold">Run Summary Metrics</text>
  <text x="400" y="376" font-size="10" fill="#1a1822">Wall time (with HITL pause excluded):</text>
  <text x="852" y="376" text-anchor="end" font-size="10" fill="#2f9d74" font-weight="bold">38s</text>
  <text x="400" y="392" font-size="10" fill="#1a1822">Total token cost (all agents):</text>
  <text x="852" y="392" text-anchor="end" font-size="10" fill="#2f9d74" font-weight="bold">$0.047</text>
  <text x="400" y="408" font-size="10" fill="#1a1822">HITL gate pause duration:</text>
  <text x="852" y="408" text-anchor="end" font-size="10" fill="#d97843" font-weight="bold">12s (user review)</text>
</svg>
