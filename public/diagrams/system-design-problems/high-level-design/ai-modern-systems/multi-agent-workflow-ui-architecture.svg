<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f3f1f8"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">Multi-Agent Workflow UI — Architecture</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
  </defs>

  <!-- Agent graph top band -->
  <rect x="20" y="54" width="860" height="22" rx="6" fill="#6d5bd0" opacity="0.12"/>
  <text x="450" y="69" text-anchor="middle" font-size="11" fill="#6d5bd0" font-weight="bold">AGENT ORCHESTRATION GRAPH</text>

  <!-- Orchestrator -->
  <rect x="370" y="88" width="140" height="48" rx="8" fill="#6d5bd0"/>
  <text x="440" y="108" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Orchestrator</text>
  <text x="440" y="124" text-anchor="middle" font-size="10" fill="#edeaf5">plans, delegates, aggregates</text>

  <!-- Arrows from orchestrator to sub-agents -->
  <line x1="370" y1="112" x2="246" y2="172" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="410" y1="136" x2="350" y2="172" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="475" y1="136" x2="530" y2="172" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="510" y1="112" x2="636" y2="172" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Sub-agents -->
  <rect x="174" y="172" width="130" height="42" rx="7" fill="#2f9d74"/>
  <text x="239" y="190" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Researcher</text>
  <text x="239" y="204" text-anchor="middle" font-size="10" fill="#e8f5f0">web search + RAG</text>

  <rect x="314" y="172" width="130" height="42" rx="7" fill="#2f9d74" opacity="0.8"/>
  <text x="379" y="190" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Analyst</text>
  <text x="379" y="204" text-anchor="middle" font-size="10" fill="#e8f5f0">data + code exec</text>

  <rect x="454" y="172" width="130" height="42" rx="7" fill="#1a1822"/>
  <text x="519" y="190" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Writer</text>
  <text x="519" y="204" text-anchor="middle" font-size="10" fill="#d7d1e6">draft synthesis</text>

  <rect x="594" y="172" width="130" height="42" rx="7" fill="#d97843"/>
  <text x="659" y="190" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Critic</text>
  <text x="659" y="204" text-anchor="middle" font-size="10" fill="#fff">review + score</text>

  <!-- Results back to orchestrator (dashed) -->
  <line x1="239" y1="172" x2="390" y2="136" stroke="#2f9d74" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-g)"/>
  <line x1="379" y1="172" x2="420" y2="136" stroke="#2f9d74" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-g)"/>
  <line x1="519" y1="172" x2="465" y2="136" stroke="#2f9d74" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-g)"/>
  <line x1="659" y1="172" x2="500" y2="136" stroke="#d97843" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-o)"/>

  <!-- divider -->
  <line x1="20" y1="232" x2="880" y2="232" stroke="#d7d1e6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="450" y="248" text-anchor="middle" font-size="11" fill="#d97843" font-weight="bold">UI LAYER</text>

  <!-- Left: Workflow Builder -->
  <rect x="20" y="258" width="270" height="248" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="155" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Workflow Builder</text>

  <rect x="35" y="292" width="240" height="36" rx="7" fill="#6d5bd0"/>
  <text x="155" y="307" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Drag-and-Drop Agent Graph</text>
  <text x="155" y="320" text-anchor="middle" font-size="10" fill="#edeaf5">nodes + edges + conditions</text>

  <rect x="35" y="336" width="240" height="36" rx="7" fill="#1a1822"/>
  <text x="155" y="351" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Agent Config Panel</text>
  <text x="155" y="364" text-anchor="middle" font-size="10" fill="#d7d1e6">model, tools, system prompt, temp</text>

  <rect x="35" y="380" width="240" height="36" rx="7" fill="#2f9d74"/>
  <text x="155" y="395" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Execution Triggers</text>
  <text x="155" y="408" text-anchor="middle" font-size="10" fill="#e8f5f0">manual / schedule / webhook</text>

  <rect x="35" y="424" width="240" height="70" rx="7" fill="#f3f1f8" stroke="#d7d1e6"/>
  <text x="155" y="442" text-anchor="middle" font-size="10" fill="#6d5bd0" font-weight="bold">Graph Validation</text>
  <text x="40" y="460" font-size="9" fill="#1a1822">• Detect cycles (DAG only)</text>
  <text x="40" y="474" font-size="9" fill="#1a1822">• Verify tool permissions per agent</text>
  <text x="40" y="488" font-size="9" fill="#1a1822">• Estimate token budget before run</text>

  <!-- Center: Run Monitor -->
  <rect x="310" y="258" width="270" height="248" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="445" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Run Monitor</text>

  <rect x="325" y="292" width="240" height="36" rx="7" fill="#6d5bd0"/>
  <text x="445" y="307" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Live Agent Status</text>
  <text x="445" y="320" text-anchor="middle" font-size="10" fill="#edeaf5">idle / running / waiting / done / error</text>

  <rect x="325" y="336" width="240" height="36" rx="7" fill="#2f9d74"/>
  <text x="445" y="351" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Streaming Thought Log</text>
  <text x="445" y="364" text-anchor="middle" font-size="10" fill="#e8f5f0">each agent's reasoning token stream</text>

  <rect x="325" y="380" width="240" height="36" rx="7" fill="#d97843"/>
  <text x="445" y="395" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Human-in-the-Loop Gate</text>
  <text x="445" y="408" text-anchor="middle" font-size="10" fill="#fff">pause + approve before sensitive steps</text>

  <rect x="325" y="424" width="240" height="36" rx="7" fill="#1a1822"/>
  <text x="445" y="439" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Interrupt / Resume / Retry</text>
  <text x="445" y="452" text-anchor="middle" font-size="10" fill="#d7d1e6">cancel agent, retry failed step</text>

  <rect x="325" y="468" width="240" height="28" rx="7" fill="#6d5bd0" opacity="0.5"/>
  <text x="445" y="484" text-anchor="middle" font-size="10" fill="#fff">Tool call trace: input → output per step</text>

  <!-- Right: Results + Observability -->
  <rect x="600" y="258" width="280" height="248" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="740" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Results &amp; Observability</text>

  <text x="610" y="304" font-size="11" fill="#6d5bd0" font-weight="bold">Run Metrics</text>
  <text x="610" y="322" font-size="10" fill="#1a1822">Total wall time (parallel agents)</text>
  <text x="876" y="322" text-anchor="end" font-size="10" fill="#2f9d74" font-weight="bold">tracked</text>
  <text x="610" y="338" font-size="10" fill="#1a1822">Token cost (per agent + total)</text>
  <text x="876" y="338" text-anchor="end" font-size="10" fill="#2f9d74" font-weight="bold">tracked</text>
  <text x="610" y="354" font-size="10" fill="#1a1822">Agent success / error / retry count</text>
  <text x="876" y="354" text-anchor="end" font-size="10" fill="#2f9d74" font-weight="bold">tracked</text>
  <text x="610" y="370" font-size="10" fill="#1a1822">Human gate pauses (count + duration)</text>
  <text x="876" y="370" text-anchor="end" font-size="10" fill="#d97843" font-weight="bold">tracked</text>

  <line x1="610" y1="382" x2="868" y2="382" stroke="#d7d1e6"/>

  <text x="610" y="400" font-size="11" fill="#d97843" font-weight="bold">Output Artifacts</text>
  <text x="610" y="418" font-size="10" fill="#1a1822">Researcher → retrieved sources list</text>
  <text x="610" y="434" font-size="10" fill="#1a1822">Analyst → data tables + charts</text>
  <text x="610" y="450" font-size="10" fill="#1a1822">Writer → formatted draft (Markdown)</text>
  <text x="610" y="466" font-size="10" fill="#1a1822">Critic → score + annotated feedback</text>
  <text x="610" y="482" font-size="10" fill="#1a1822">Orchestrator → final merged output</text>
</svg>
