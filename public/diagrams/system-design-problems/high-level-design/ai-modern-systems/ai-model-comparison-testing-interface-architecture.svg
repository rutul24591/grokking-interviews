<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f3f1f8"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">AI Model Comparison &amp; Testing Interface — Architecture</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
  </defs>

  <!-- Top: Eval pipeline band -->
  <rect x="20" y="54" width="860" height="22" rx="6" fill="#6d5bd0" opacity="0.12"/>
  <text x="450" y="69" text-anchor="middle" font-size="11" fill="#6d5bd0" font-weight="bold">EVALUATION PIPELINE</text>

  <rect x="30" y="88" width="100" height="44" rx="7" fill="#6d5bd0"/>
  <text x="80" y="106" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Test Suite</text>
  <text x="80" y="122" text-anchor="middle" font-size="10" fill="#edeaf5">prompts + expected</text>
  <line x1="130" y1="110" x2="162" y2="110" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="162" y="88" width="110" height="44" rx="7" fill="#6d5bd0" opacity="0.8"/>
  <text x="217" y="106" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Model Runner</text>
  <text x="217" y="122" text-anchor="middle" font-size="10" fill="#edeaf5">parallel API calls</text>
  <line x1="272" y1="110" x2="304" y2="110" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="304" y="88" width="120" height="44" rx="7" fill="#1a1822"/>
  <text x="364" y="106" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Response Store</text>
  <text x="364" y="122" text-anchor="middle" font-size="10" fill="#d7d1e6">cached per (model, prompt)</text>
  <line x1="424" y1="110" x2="456" y2="110" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="456" y="88" width="130" height="44" rx="7" fill="#2f9d74"/>
  <text x="521" y="106" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Scorer</text>
  <text x="521" y="122" text-anchor="middle" font-size="10" fill="#e8f5f0">LLM judge + deterministic</text>
  <line x1="586" y1="110" x2="618" y2="110" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="618" y="88" width="120" height="44" rx="7" fill="#d97843"/>
  <text x="678" y="106" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Results DB</text>
  <text x="678" y="122" text-anchor="middle" font-size="10" fill="#fff">scores, latency, cost</text>
  <line x1="738" y1="110" x2="770" y2="110" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="770" y="88" width="110" height="44" rx="7" fill="#6d5bd0"/>
  <text x="825" y="106" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Dashboard</text>
  <text x="825" y="122" text-anchor="middle" font-size="10" fill="#edeaf5">charts + rankings</text>

  <!-- divider -->
  <line x1="20" y1="148" x2="880" y2="148" stroke="#d7d1e6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="450" y="164" text-anchor="middle" font-size="11" fill="#d97843" font-weight="bold">UI PANELS</text>

  <!-- Left: Model Config -->
  <rect x="20" y="174" width="220" height="330" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="130" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Model Configuration</text>

  <rect x="35" y="208" width="190" height="40" rx="7" fill="#6d5bd0"/>
  <text x="130" y="224" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Model Selector</text>
  <text x="130" y="238" text-anchor="middle" font-size="10" fill="#edeaf5">Claude / GPT / Gemini / OSS</text>

  <rect x="35" y="256" width="190" height="40" rx="7" fill="#1a1822"/>
  <text x="130" y="272" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Parameter Sweep</text>
  <text x="130" y="286" text-anchor="middle" font-size="10" fill="#d7d1e6">temp, top-p, max tokens</text>

  <rect x="35" y="304" width="190" height="40" rx="7" fill="#2f9d74"/>
  <text x="130" y="320" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Prompt Variants</text>
  <text x="130" y="334" text-anchor="middle" font-size="10" fill="#e8f5f0">A/B prompt + zero/few shot</text>

  <rect x="35" y="352" width="190" height="40" rx="7" fill="#d97843"/>
  <text x="130" y="368" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Budget Cap</text>
  <text x="130" y="382" text-anchor="middle" font-size="10" fill="#fff">max $ per eval run</text>

  <rect x="35" y="400" width="190" height="92" rx="7" fill="#f3f1f8" stroke="#d7d1e6"/>
  <text x="130" y="418" text-anchor="middle" font-size="10" fill="#6d5bd0" font-weight="bold">Parallelism</text>
  <text x="40" y="436" font-size="9" fill="#1a1822">• All models run same prompt</text>
  <text x="40" y="450" font-size="9" fill="#1a1822">  concurrently (fan-out)</text>
  <text x="40" y="464" font-size="9" fill="#1a1822">• Results cached: rerun uses</text>
  <text x="40" y="478" font-size="9" fill="#1a1822">  stored responses (no re-bill)</text>

  <!-- Center: Comparison View -->
  <rect x="260" y="174" width="360" height="330" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="440" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Side-by-Side Comparison View</text>

  <!-- Mock comparison rows -->
  <rect x="275" y="208" width="330" height="24" rx="4" fill="#6d5bd0" opacity="0.12"/>
  <text x="345" y="224" text-anchor="middle" font-size="10" fill="#6d5bd0" font-weight="bold">claude-sonnet-4-6</text>
  <text x="510" y="224" text-anchor="middle" font-size="10" fill="#6d5bd0" font-weight="bold">gpt-4o</text>

  <line x1="440" y1="208" x2="440" y2="500" stroke="#d7d1e6" stroke-width="1" stroke-dasharray="4,3"/>

  <text x="280" y="248" font-size="10" fill="#1a1822">"The transformer architecture…</text>
  <text x="280" y="262" font-size="10" fill="#1a1822">uses multi-head attention to</text>
  <text x="280" y="276" font-size="10" fill="#1a1822">enable parallel processing…"</text>

  <text x="448" y="248" font-size="10" fill="#1a1822">"Transformers rely on self-</text>
  <text x="448" y="262" font-size="10" fill="#1a1822">attention mechanisms that</text>
  <text x="448" y="276" font-size="10" fill="#1a1822">capture dependencies…"</text>

  <!-- Score rows -->
  <rect x="275" y="290" width="330" height="20" rx="3" fill="#f3f1f8" stroke="#d7d1e6"/>
  <text x="280" y="304" font-size="9" fill="#2f9d74" font-weight="bold">Score: 4.4</text>
  <text x="448" y="304" font-size="9" fill="#d97843" font-weight="bold">Score: 4.1</text>
  <text x="580" y="304" font-size="9" fill="#1a1822">Correctness</text>

  <rect x="275" y="316" width="330" height="20" rx="3" fill="#f3f1f8" stroke="#d7d1e6"/>
  <text x="280" y="330" font-size="9" fill="#2f9d74" font-weight="bold">1,240ms</text>
  <text x="448" y="330" font-size="9" fill="#2f9d74" font-weight="bold">980ms</text>
  <text x="580" y="330" font-size="9" fill="#1a1822">Latency P95</text>

  <rect x="275" y="342" width="330" height="20" rx="3" fill="#f3f1f8" stroke="#d7d1e6"/>
  <text x="280" y="356" font-size="9" fill="#d97843" font-weight="bold">$0.0022</text>
  <text x="448" y="356" font-size="9" fill="#2f9d74" font-weight="bold">$0.0015</text>
  <text x="580" y="356" font-size="9" fill="#1a1822">Cost/call</text>

  <!-- Vote buttons -->
  <rect x="275" y="370" width="155" height="26" rx="5" fill="#6d5bd0"/>
  <text x="352" y="387" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">👆 Prefer this</text>
  <rect x="447" y="370" width="155" height="26" rx="5" fill="#6d5bd0" opacity="0.4"/>
  <text x="524" y="387" text-anchor="middle" font-size="10" fill="#fff">👆 Prefer this</text>

  <text x="440" y="414" text-anchor="middle" font-size="9" fill="#d7d1e6">Blind evaluation — model names hidden until vote</text>

  <!-- Diff highlight legend -->
  <rect x="275" y="424" width="330" height="64" rx="7" fill="#1a1822"/>
  <text x="440" y="442" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Semantic Diff Highlighting</text>
  <rect x="285" y="450" width="10" height="10" rx="2" fill="#2f9d74"/>
  <text x="300" y="460" font-size="9" fill="#d7d1e6">Claim present in both</text>
  <rect x="285" y="466" width="10" height="10" rx="2" fill="#d97843"/>
  <text x="300" y="476" font-size="9" fill="#d7d1e6">Claim unique to this model</text>
  <rect x="450" y="466" width="10" height="10" rx="2" fill="#c0392b" opacity="0.7"/>
  <text x="465" y="476" font-size="9" fill="#d7d1e6">Contradicts other model</text>

  <!-- Right: Rankings + Metrics -->
  <rect x="640" y="174" width="240" height="330" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="760" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Rankings &amp; Leaderboard</text>

  <!-- Rank rows -->
  <rect x="655" y="208" width="210" height="32" rx="6" fill="#6d5bd0"/>
  <text x="670" y="222" font-size="10" fill="#fff" font-weight="bold">#1</text>
  <text x="690" y="222" font-size="10" fill="#fff">claude-sonnet-4-6</text>
  <text x="858" y="222" text-anchor="end" font-size="10" fill="#edeaf5" font-weight="bold">4.42</text>
  <text x="858" y="234" text-anchor="end" font-size="9" fill="#edeaf5">$0.0022 · 1240ms</text>

  <rect x="655" y="248" width="210" height="32" rx="6" fill="#2f9d74"/>
  <text x="670" y="262" font-size="10" fill="#fff" font-weight="bold">#2</text>
  <text x="690" y="262" font-size="10" fill="#fff">gemini-1.5-pro</text>
  <text x="858" y="262" text-anchor="end" font-size="10" fill="#e8f5f0" font-weight="bold">4.28</text>
  <text x="858" y="274" text-anchor="end" font-size="9" fill="#e8f5f0">$0.0018 · 1090ms</text>

  <rect x="655" y="288" width="210" height="32" rx="6" fill="#1a1822"/>
  <text x="670" y="302" font-size="10" fill="#fff" font-weight="bold">#3</text>
  <text x="690" y="302" font-size="10" fill="#fff">gpt-4o</text>
  <text x="858" y="302" text-anchor="end" font-size="10" fill="#d7d1e6" font-weight="bold">4.10</text>
  <text x="858" y="314" text-anchor="end" font-size="9" fill="#d7d1e6">$0.0015 · 980ms</text>

  <rect x="655" y="328" width="210" height="32" rx="6" fill="#d97843" opacity="0.7"/>
  <text x="670" y="342" font-size="10" fill="#fff" font-weight="bold">#4</text>
  <text x="690" y="342" font-size="10" fill="#fff">llama-3-70b</text>
  <text x="858" y="342" text-anchor="end" font-size="10" fill="#fff" font-weight="bold">3.87</text>
  <text x="858" y="354" text-anchor="end" font-size="9" fill="#fff">$0.0004 · 2100ms</text>

  <line x1="655" y1="370" x2="858" y2="370" stroke="#d7d1e6"/>
  <text x="655" y="388" font-size="11" fill="#d97843" font-weight="bold">Regression Guard</text>
  <text x="655" y="406" font-size="10" fill="#1a1822">Compare new model version</text>
  <text x="655" y="422" font-size="10" fill="#1a1822">vs. current production model</text>
  <text x="655" y="438" font-size="10" fill="#1a1822">Flag if score drops &gt;5%</text>
  <text x="655" y="454" font-size="10" fill="#1a1822">or latency rises &gt;20%</text>
  <rect x="655" y="462" width="210" height="28" rx="5" fill="#c0392b" opacity="0.12" stroke="#c0392b" stroke-width="1"/>
  <text x="760" y="480" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="bold">🔴 REGRESSION DETECTED — block deploy</text>
</svg>
