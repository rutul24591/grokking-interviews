<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="500" fill="#f3f1f8"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">Copilot-Style AI Assistant — Context-Aware Architecture</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
  </defs>

  <!-- Product UI context (left) -->
  <rect x="20" y="56" width="220" height="420" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="130" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Product UI Context</text>

  <rect x="35" y="90" width="190" height="44" rx="7" fill="#6d5bd0"/>
  <text x="130" y="108" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Current Page State</text>
  <text x="130" y="124" text-anchor="middle" font-size="10" fill="#edeaf5">route, entity type, entity ID</text>

  <rect x="35" y="146" width="190" height="44" rx="7" fill="#6d5bd0" opacity="0.8"/>
  <text x="130" y="164" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Selected / Visible Data</text>
  <text x="130" y="180" text-anchor="middle" font-size="10" fill="#edeaf5">selected rows, open record, form</text>

  <rect x="35" y="202" width="190" height="44" rx="7" fill="#2f9d74"/>
  <text x="130" y="220" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">User Permissions</text>
  <text x="130" y="236" text-anchor="middle" font-size="10" fill="#e8f5f0">role, scoped actions allowed</text>

  <rect x="35" y="258" width="190" height="44" rx="7" fill="#1a1822"/>
  <text x="130" y="276" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Recent Activity</text>
  <text x="130" y="292" text-anchor="middle" font-size="10" fill="#d7d1e6">last 10 actions, nav history</text>

  <rect x="35" y="314" width="190" height="44" rx="7" fill="#d97843"/>
  <text x="130" y="332" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Product Schema</text>
  <text x="130" y="348" text-anchor="middle" font-size="10" fill="#fff">entity types, field names</text>

  <rect x="35" y="370" width="190" height="44" rx="7" fill="#2f9d74" opacity="0.7"/>
  <text x="130" y="388" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">User Profile</text>
  <text x="130" y="404" text-anchor="middle" font-size="10" fill="#e8f5f0">name, preferences, timezone</text>

  <!-- Context arrow -->
  <line x1="240" y1="278" x2="295" y2="278" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="267" y="270" text-anchor="middle" font-size="9" fill="#6d5bd0" font-weight="bold">context</text>

  <!-- Copilot Panel (center) -->
  <rect x="295" y="56" width="260" height="420" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="425" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Copilot Panel UI</text>

  <rect x="310" y="90" width="230" height="44" rx="7" fill="#6d5bd0"/>
  <text x="425" y="108" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Slash Command Palette</text>
  <text x="425" y="124" text-anchor="middle" font-size="10" fill="#edeaf5">/summarize /draft /analyze</text>

  <rect x="310" y="146" width="230" height="44" rx="7" fill="#6d5bd0" opacity="0.75"/>
  <text x="425" y="164" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Natural Language Input</text>
  <text x="425" y="180" text-anchor="middle" font-size="10" fill="#edeaf5">free-form query, @ mentions</text>

  <rect x="310" y="202" width="230" height="44" rx="7" fill="#2f9d74"/>
  <text x="425" y="220" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Streaming Answer</text>
  <text x="425" y="236" text-anchor="middle" font-size="10" fill="#e8f5f0">with apply / dismiss actions</text>

  <rect x="310" y="258" width="230" height="44" rx="7" fill="#1a1822"/>
  <text x="425" y="276" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Suggested Actions</text>
  <text x="425" y="292" text-anchor="middle" font-size="10" fill="#d7d1e6">inline buttons: Apply / Copy / Edit</text>

  <rect x="310" y="314" width="230" height="44" rx="7" fill="#d97843"/>
  <text x="425" y="332" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Approval Gate</text>
  <text x="425" y="348" text-anchor="middle" font-size="10" fill="#fff">confirm destructive actions</text>

  <rect x="310" y="370" width="230" height="44" rx="7" fill="#6d5bd0" opacity="0.5"/>
  <text x="425" y="388" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Proactive Hints</text>
  <text x="425" y="404" text-anchor="middle" font-size="10" fill="#edeaf5">surface when context changes</text>

  <!-- Arrow to backend -->
  <line x1="555" y1="278" x2="605" y2="278" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="605" y1="260" x2="555" y2="260" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)" stroke-dasharray="6,3"/>
  <text x="580" y="250" text-anchor="middle" font-size="9" fill="#2f9d74">stream</text>
  <text x="580" y="290" text-anchor="middle" font-size="9" fill="#6d5bd0">query</text>

  <!-- Backend -->
  <rect x="605" y="56" width="275" height="420" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="742" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Backend Intelligence</text>

  <rect x="620" y="90" width="245" height="44" rx="7" fill="#6d5bd0"/>
  <text x="742" y="108" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Context Assembler</text>
  <text x="742" y="124" text-anchor="middle" font-size="10" fill="#edeaf5">serialize product ctx → prompt</text>

  <rect x="620" y="146" width="245" height="44" rx="7" fill="#1a1822"/>
  <text x="742" y="164" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Intent Classifier</text>
  <text x="742" y="180" text-anchor="middle" font-size="10" fill="#d7d1e6">read / write / navigate / explain</text>

  <rect x="620" y="202" width="245" height="44" rx="7" fill="#2f9d74"/>
  <text x="742" y="220" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Permission Guard</text>
  <text x="742" y="236" text-anchor="middle" font-size="10" fill="#e8f5f0">block actions beyond user scope</text>

  <rect x="620" y="258" width="245" height="44" rx="7" fill="#6d5bd0" opacity="0.75"/>
  <text x="742" y="276" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">LLM + Tool Router</text>
  <text x="742" y="292" text-anchor="middle" font-size="10" fill="#edeaf5">stream response / call product APIs</text>

  <rect x="620" y="314" width="245" height="44" rx="7" fill="#d97843"/>
  <text x="742" y="332" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Action Executor</text>
  <text x="742" y="348" text-anchor="middle" font-size="10" fill="#fff">update record / send email / etc.</text>

  <rect x="620" y="370" width="245" height="44" rx="7" fill="#1a1822" opacity="0.7"/>
  <text x="742" y="388" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Audit Log</text>
  <text x="742" y="404" text-anchor="middle" font-size="10" fill="#d7d1e6">actor, AI action, before/after state</text>

  <!-- Bottom metrics bar -->
  <rect x="20" y="488" width="860" height="0" rx="0"/>
</svg>
