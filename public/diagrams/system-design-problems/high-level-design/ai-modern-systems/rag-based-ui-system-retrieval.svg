<svg viewBox="0 0 900 480" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="480" fill="#f3f1f8"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">RAG Retrieval Strategies &amp; Citation UI</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
  </defs>

  <!-- Retrieval strategies -->
  <rect x="20" y="56" width="260" height="400" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="150" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Retrieval Strategies</text>

  <rect x="35" y="90" width="230" height="52" rx="7" fill="#6d5bd0"/>
  <text x="150" y="109" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Naive RAG</text>
  <text x="150" y="126" text-anchor="middle" font-size="10" fill="#edeaf5">embed query → ANN → top-k → LLM</text>
  <text x="150" y="140" text-anchor="middle" font-size="10" fill="#edeaf5">fast, less accurate for complex Q</text>

  <rect x="35" y="154" width="230" height="52" rx="7" fill="#6d5bd0" opacity="0.8"/>
  <text x="150" y="173" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">HyDE (Hypothetical Doc)</text>
  <text x="150" y="190" text-anchor="middle" font-size="10" fill="#edeaf5">LLM generates hypothetical answer</text>
  <text x="150" y="204" text-anchor="middle" font-size="10" fill="#edeaf5">embed that → better retrieval</text>

  <rect x="35" y="218" width="230" height="52" rx="7" fill="#2f9d74"/>
  <text x="150" y="237" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Sub-Query Decomposition</text>
  <text x="150" y="254" text-anchor="middle" font-size="10" fill="#e8f5f0">complex Q → 3-5 sub-questions</text>
  <text x="150" y="268" text-anchor="middle" font-size="10" fill="#e8f5f0">retrieve independently → merge</text>

  <rect x="35" y="282" width="230" height="52" rx="7" fill="#1a1822"/>
  <text x="150" y="301" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Hybrid Search</text>
  <text x="150" y="318" text-anchor="middle" font-size="10" fill="#d7d1e6">ANN (semantic) + BM25 (keyword)</text>
  <text x="150" y="332" text-anchor="middle" font-size="10" fill="#d7d1e6">RRF fusion → best of both</text>

  <rect x="35" y="346" width="230" height="52" rx="7" fill="#d97843"/>
  <text x="150" y="365" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Cross-Encoder Re-ranking</text>
  <text x="150" y="382" text-anchor="middle" font-size="10" fill="#fff">top-20 → re-rank pair (q, chunk)</text>
  <text x="150" y="396" text-anchor="middle" font-size="10" fill="#fff">keep top-5 for LLM context</text>

  <!-- Citation UI -->
  <rect x="300" y="56" width="290" height="400" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="445" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Citation UI Design</text>

  <!-- Mock chat -->
  <rect x="315" y="90" width="260" height="80" rx="7" fill="#f3f1f8" stroke="#d7d1e6"/>
  <text x="340" y="110" font-size="10" fill="#1a1822">The transformer architecture uses</text>
  <text x="340" y="126" font-size="10" fill="#1a1822">self-attention mechanisms</text>
  <rect x="390" y="118" width="16" height="14" rx="3" fill="#6d5bd0"/>
  <text x="398" y="129" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">1</text>
  <text x="340" y="142" font-size="10" fill="#1a1822">to process tokens in parallel.</text>
  <rect x="432" y="134" width="16" height="14" rx="3" fill="#6d5bd0"/>
  <text x="440" y="145" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">2</text>
  <text x="340" y="161" font-size="10" fill="#2f9d74" font-weight="bold">● Confidence: High (3 sources)</text>

  <!-- Citations list -->
  <rect x="315" y="180" width="260" height="56" rx="7" fill="#6d5bd0" opacity="0.08" stroke="#6d5bd0" stroke-width="1"/>
  <text x="325" y="198" font-size="10" fill="#6d5bd0" font-weight="bold">[1] Attention Is All You Need (2017)</text>
  <text x="325" y="214" font-size="10" fill="#1a1822">Score: 0.94 · arxiv.org/abs/1706.03762</text>
  <text x="325" y="228" font-size="10" fill="#1a1822">"…scaled dot-product attention…"</text>

  <rect x="315" y="244" width="260" height="56" rx="7" fill="#6d5bd0" opacity="0.08" stroke="#6d5bd0" stroke-width="1"/>
  <text x="325" y="262" font-size="10" fill="#6d5bd0" font-weight="bold">[2] BERT: Pre-training (2018)</text>
  <text x="325" y="278" font-size="10" fill="#1a1822">Score: 0.87 · arxiv.org/abs/1810.04805</text>
  <text x="325" y="292" font-size="10" fill="#1a1822">"…bidirectional transformer…"</text>

  <!-- Hover popup -->
  <rect x="315" y="312" width="260" height="80" rx="7" fill="#1a1822"/>
  <text x="445" y="330" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Hover on [1] → preview popup</text>
  <text x="325" y="350" font-size="10" fill="#d7d1e6">Source: Attention Is All You Need</text>
  <text x="325" y="366" font-size="10" fill="#d7d1e6">Section 3.2, Page 4</text>
  <text x="325" y="382" font-size="10" fill="#2f9d74">→ Click to open source document</text>

  <!-- Feedback -->
  <rect x="315" y="402" width="260" height="40" rx="7" fill="#d97843" opacity="0.15" stroke="#d97843" stroke-width="1"/>
  <text x="445" y="420" text-anchor="middle" font-size="10" fill="#d97843" font-weight="bold">👍 Helpful  ·  👎 Wrong  ·  🔧 Improve</text>
  <text x="445" y="435" text-anchor="middle" font-size="10" fill="#1a1822">Feedback → RLHF training signal</text>

  <!-- Metrics / config -->
  <rect x="610" y="56" width="270" height="400" rx="10" fill="#fff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="745" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#6d5bd0">Config &amp; Quality Metrics</text>

  <text x="620" y="104" font-size="11" fill="#6d5bd0" font-weight="bold">Chunk Parameters</text>
  <text x="620" y="122" font-size="10" fill="#1a1822">Chunk size: 512 tokens</text>
  <text x="620" y="138" font-size="10" fill="#1a1822">Overlap: 20% (102 tokens)</text>
  <text x="620" y="154" font-size="10" fill="#1a1822">Splitter: recursive sentence</text>

  <line x1="620" y1="166" x2="870" y2="166" stroke="#d7d1e6"/>
  <text x="620" y="184" font-size="11" fill="#6d5bd0" font-weight="bold">Retrieval Quality</text>
  <text x="620" y="202" font-size="10" fill="#1a1822">Recall@5:  target &gt; 0.85</text>
  <text x="620" y="218" font-size="10" fill="#1a1822">MRR@5:    target &gt; 0.75</text>
  <text x="620" y="234" font-size="10" fill="#1a1822">NDCG@5:  target &gt; 0.80</text>

  <line x1="620" y1="246" x2="870" y2="246" stroke="#d7d1e6"/>
  <text x="620" y="264" font-size="11" fill="#6d5bd0" font-weight="bold">Tenant Filtering</text>
  <text x="620" y="282" font-size="10" fill="#1a1822">Pre-filter: tenantId = X</text>
  <text x="620" y="298" font-size="10" fill="#1a1822">Namespace isolation in Pinecone</text>
  <text x="620" y="314" font-size="10" fill="#1a1822">Row-level security on pgvector</text>

  <line x1="620" y1="326" x2="870" y2="326" stroke="#d7d1e6"/>
  <text x="620" y="344" font-size="11" fill="#d97843" font-weight="bold">Confidence Levels</text>
  <rect x="620" y="352" width="12" height="12" rx="2" fill="#2f9d74"/>
  <text x="638" y="363" font-size="10" fill="#1a1822">High: top score &gt; 0.85</text>
  <rect x="620" y="372" width="12" height="12" rx="2" fill="#d97843"/>
  <text x="638" y="383" font-size="10" fill="#1a1822">Medium: 0.65–0.85</text>
  <rect x="620" y="392" width="12" height="12" rx="2" fill="#d97843" opacity="0.5"/>
  <text x="638" y="403" font-size="10" fill="#1a1822">Low: &lt; 0.65, show warning</text>
  <rect x="620" y="412" width="12" height="12" rx="2" fill="#1a1822"/>
  <text x="638" y="423" font-size="10" fill="#1a1822">No data: answer withheld</text>

  <rect x="620" y="436" width="240" height="16" rx="5" fill="#6d5bd0" opacity="0.12"/>
  <text x="740" y="448" text-anchor="middle" font-size="10" fill="#6d5bd0" font-weight="bold">Feedback loop → weekly embedding fine-tune</text>
</svg>
