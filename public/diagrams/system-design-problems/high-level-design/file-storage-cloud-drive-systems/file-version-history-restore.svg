<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#eef2ff"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">File Version History &amp; Restore — Delta Storage &amp; Restore Pipeline</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="65" width="110" height="40" rx="8" fill="#6d5bd0"/>
  <text x="75" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Client / User</text>
  <text x="75" y="98" text-anchor="middle" font-size="10" fill="#edeaf5">save + restore</text>

  <rect x="198" y="65" width="115" height="40" rx="8" fill="#2563eb"/>
  <text x="255" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Version API</text>
  <text x="255" y="98" text-anchor="middle" font-size="10" fill="#dbeafe">version + restore</text>

  <rect x="388" y="65" width="115" height="40" rx="8" fill="#2f9d74"/>
  <text x="445" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Version Store</text>
  <text x="445" y="98" text-anchor="middle" font-size="10" fill="#d1fae5">S3 + delta DB</text>

  <rect x="578" y="65" width="115" height="40" rx="8" fill="#d97843"/>
  <text x="635" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Lifecycle Policy</text>
  <text x="635" y="98" text-anchor="middle" font-size="10" fill="#fef3c7">retention + GC</text>

  <rect x="768" y="65" width="112" height="40" rx="8" fill="#be123c"/>
  <text x="824" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Restore Worker</text>
  <text x="824" y="98" text-anchor="middle" font-size="10" fill="#fecdd3">reconstruct + swap</text>

  <!-- Lifelines -->
  <line x1="75"  y1="105" x2="75"  y2="490" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="255" y1="105" x2="255" y2="490" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="445" y1="105" x2="445" y2="490" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="635" y1="105" x2="635" y2="490" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="824" y1="105" x2="824" y2="490" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- SECTION 1: Version creation on upload -->
  <rect x="8" y="118" width="884" height="14" rx="3" fill="#6d5bd0" opacity="0.15"/>
  <text x="450" y="129" text-anchor="middle" font-size="9" font-weight="bold" fill="#4c1d95">1 · VERSION CREATION — every save creates a new version row; binary delta (bsdiff) vs full copy decision based on file size; S3 Versioning enabled</text>

  <line x1="75" y1="150" x2="240" y2="150" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="144" text-anchor="middle" font-size="9" fill="#374151">PUT /files/&#123;id&#125; — new file content upload</text>

  <line x1="240" y1="164" x2="430" y2="164" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="335" y="158" text-anchor="middle" font-size="9" fill="#374151">compute delta vs current; upload delta (or full copy if &gt;50% changed)</text>

  <line x1="430" y1="178" x2="90" y2="178" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="260" y="172" text-anchor="middle" font-size="9" fill="#374151">INSERT version &#123;versionId, fileId, s3Key, deltaKey, size, createdAt&#125;</text>

  <!-- Delta box -->
  <rect x="160" y="186" width="350" height="24" rx="6" fill="#fff" stroke="#6d5bd0" stroke-width="1"/>
  <text x="335" y="202" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a1822">Binary files (&lt;10MB): full copy per version. Text/docs: bsdiff delta chain. Max chain depth 100 → new full snapshot</text>

  <!-- SECTION 2: Version list + diff view -->
  <rect x="8" y="218" width="884" height="14" rx="3" fill="#2f9d74" opacity="0.18"/>
  <text x="450" y="229" text-anchor="middle" font-size="9" font-weight="bold" fill="#065f46">2 · VERSION LIST + DIFF — GET /files/&#123;id&#125;/versions; timeline UI with author + size delta; text diff computed on-the-fly from adjacent deltas</text>

  <line x1="75" y1="248" x2="240" y2="248" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="242" text-anchor="middle" font-size="9" fill="#374151">GET /files/&#123;id&#125;/versions?limit=30</text>

  <line x1="240" y1="262" x2="430" y2="262" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="335" y="256" text-anchor="middle" font-size="9" fill="#374151">SELECT versions ORDER BY createdAt DESC; return metadata only</text>

  <line x1="430" y1="276" x2="90" y2="276" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="260" y="270" text-anchor="middle" font-size="9" fill="#374151">version list: &#123;versionId, author, size, createdAt, label&#125;</text>

  <!-- SECTION 3: Restore -->
  <rect x="8" y="294" width="884" height="14" rx="3" fill="#d97843" opacity="0.18"/>
  <text x="450" y="305" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">3 · RESTORE — reconstruct target version (apply delta chain or fetch full snapshot); write as new version (non-destructive); update currentVersionId</text>

  <line x1="75" y1="324" x2="240" y2="324" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="318" text-anchor="middle" font-size="9" fill="#374151">POST /files/&#123;id&#125;/restore &#123;versionId&#125;</text>

  <line x1="240" y1="338" x2="809" y2="338" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="524" y="332" text-anchor="middle" font-size="9" fill="#374151">worker: walk delta chain from snapshot to target versionId; reconstruct bytes</text>

  <line x1="809" y1="352" x2="430" y2="352" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="619" y="346" text-anchor="middle" font-size="9" fill="#374151">upload reconstructed bytes as new S3 object; INSERT new version row</text>

  <line x1="430" y1="366" x2="90" y2="366" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="260" y="360" text-anchor="middle" font-size="9" fill="#374151">UPDATE files SET currentVersionId=new; 200 — original preserved</text>

  <!-- SECTION 4: Retention + GC -->
  <rect x="8" y="382" width="884" height="14" rx="3" fill="#be123c" opacity="0.12"/>
  <text x="450" y="393" text-anchor="middle" font-size="9" font-weight="bold" fill="#9f1239">4 · RETENTION + GC — free plan: 30 versions or 30 days; paid: unlimited; cron GC deletes expired S3 objects + version rows; soft-delete 7-day trash</text>

  <line x1="620" y1="412" x2="430" y2="412" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="525" y="406" text-anchor="middle" font-size="9" fill="#374151">nightly cron: mark versions beyond retention as expired</text>

  <line x1="430" y1="426" x2="240" y2="426" stroke="#2f9d74" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="335" y="420" text-anchor="middle" font-size="9" fill="#374151">S3 lifecycle rule deletes expired objects after 7-day grace</text>

  <line x1="75" y1="440" x2="240" y2="440" stroke="#6d5bd0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="157" y="434" text-anchor="middle" font-size="9" fill="#374151">trash: soft-delete; POST /trash/&#123;id&#125;/restore within 30 days</text>

  <!-- Footer -->
  <rect x="8" y="458" width="884" height="36" rx="6" fill="#1a1822"/>
  <text x="90" y="474" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">Delta Strategy</text>
  <text x="90" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">bsdiff / full copy</text>
  <text x="255" y="474" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Chain Limit</text>
  <text x="255" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">100 → new snapshot</text>
  <text x="450" y="474" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Restore</text>
  <text x="450" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">non-destructive new v</text>
  <text x="645" y="474" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Free Retention</text>
  <text x="645" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">30 versions / 30 days</text>
  <text x="820" y="474" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Trash Window</text>
  <text x="820" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">30 day soft-delete</text>
</svg>
