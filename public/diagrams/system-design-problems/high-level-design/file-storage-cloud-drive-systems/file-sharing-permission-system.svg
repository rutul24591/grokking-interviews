<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#eef2ff"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">File Sharing &amp; Permission System — ACL, Links &amp; Inheritance</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="65" width="110" height="40" rx="8" fill="#6d5bd0"/>
  <text x="75" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Owner / Editor</text>
  <text x="75" y="98" text-anchor="middle" font-size="10" fill="#edeaf5">share + manage</text>

  <rect x="198" y="65" width="115" height="40" rx="8" fill="#2563eb"/>
  <text x="255" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Share API</text>
  <text x="255" y="98" text-anchor="middle" font-size="10" fill="#dbeafe">ACL + link gen</text>

  <rect x="388" y="65" width="115" height="40" rx="8" fill="#2f9d74"/>
  <text x="445" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">ACL Store</text>
  <text x="445" y="98" text-anchor="middle" font-size="10" fill="#d1fae5">permissions DB</text>

  <rect x="578" y="65" width="115" height="40" rx="8" fill="#d97843"/>
  <text x="635" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Access Check</text>
  <text x="635" y="98" text-anchor="middle" font-size="10" fill="#fef3c7">policy evaluation</text>

  <rect x="768" y="65" width="112" height="40" rx="8" fill="#be123c"/>
  <text x="824" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Recipient</text>
  <text x="824" y="98" text-anchor="middle" font-size="10" fill="#fecdd3">invited / link user</text>

  <!-- Lifelines -->
  <line x1="75"  y1="105" x2="75"  y2="490" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="255" y1="105" x2="255" y2="490" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="445" y1="105" x2="445" y2="490" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="635" y1="105" x2="635" y2="490" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="824" y1="105" x2="824" y2="490" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- SECTION 1: Direct share -->
  <rect x="8" y="118" width="884" height="14" rx="3" fill="#6d5bd0" opacity="0.15"/>
  <text x="450" y="129" text-anchor="middle" font-size="9" font-weight="bold" fill="#4c1d95">1 · DIRECT SHARE — ACL row per (resourceId, principalId, role); role: viewer/commenter/editor/owner; inherits down folder tree unless overridden</text>

  <line x1="75" y1="150" x2="240" y2="150" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="144" text-anchor="middle" font-size="9" fill="#374151">POST /share &#123;fileId, email, role: "editor"&#125;</text>

  <line x1="240" y1="164" x2="430" y2="164" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="335" y="158" text-anchor="middle" font-size="9" fill="#374151">UPSERT acl (fileId, userId, role); send invite email</text>

  <line x1="430" y1="178" x2="90" y2="178" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="260" y="172" text-anchor="middle" font-size="9" fill="#374151">200; recipient gets email with "Open in Drive" link</text>

  <!-- Inheritance box -->
  <rect x="160" y="186" width="350" height="24" rx="6" fill="#fff" stroke="#6d5bd0" stroke-width="1"/>
  <text x="335" y="202" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a1822">Folder share inherits to all children; explicit child ACL overrides parent (deny or elevate)</text>

  <!-- SECTION 2: Link sharing -->
  <rect x="8" y="218" width="884" height="14" rx="3" fill="#2f9d74" opacity="0.18"/>
  <text x="450" y="229" text-anchor="middle" font-size="9" font-weight="bold" fill="#065f46">2 · LINK SHARING — random 128-bit token stored in share_links table; scope: anyone/org-only; optional password + expiry; view/download limits</text>

  <line x1="75" y1="248" x2="240" y2="248" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="242" text-anchor="middle" font-size="9" fill="#374151">POST /share/link &#123;fileId, scope: "anyone", role: "viewer", expiresAt&#125;</text>

  <line x1="240" y1="262" x2="430" y2="262" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="335" y="256" text-anchor="middle" font-size="9" fill="#374151">generate token; INSERT share_links &#123;token, fileId, role, expiresAt&#125;</text>

  <line x1="430" y1="276" x2="90" y2="276" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="260" y="270" text-anchor="middle" font-size="9" fill="#374151">return https://drive.example.com/s/&#123;token&#125;</text>

  <!-- SECTION 3: Access check on every request -->
  <rect x="8" y="294" width="884" height="14" rx="3" fill="#d97843" opacity="0.18"/>
  <text x="450" y="305" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">3 · ACCESS CHECK — walk resource ancestors; collect ACL rows; evaluate: owner &gt; editor &gt; commenter &gt; viewer; Redis cache 60s TTL per (userId, fileId)</text>

  <line x1="809" y1="324" x2="620" y2="324" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="714" y="318" text-anchor="middle" font-size="9" fill="#374151">GET /files/&#123;id&#125; (recipient with link token or session)</text>

  <line x1="620" y1="338" x2="430" y2="338" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="525" y="332" text-anchor="middle" font-size="9" fill="#374151">check ACL: direct grant OR valid share_link token</text>

  <line x1="430" y1="352" x2="620" y2="352" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="525" y="346" text-anchor="middle" font-size="9" fill="#374151">resolve effective role; cache in Redis 60s</text>

  <line x1="620" y1="366" x2="809" y2="366" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="714" y="360" text-anchor="middle" font-size="9" fill="#374151">200 with file data | 403 Forbidden | 401 if unauthenticated</text>

  <!-- SECTION 4: Revoke + audit -->
  <rect x="8" y="382" width="884" height="14" rx="3" fill="#be123c" opacity="0.12"/>
  <text x="450" y="393" text-anchor="middle" font-size="9" font-weight="bold" fill="#9f1239">4 · REVOKE + AUDIT — DELETE acl row; invalidate Redis cache; deactivate share link; all access logged: who accessed what, when, from where</text>

  <line x1="75" y1="412" x2="240" y2="412" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="406" text-anchor="middle" font-size="9" fill="#374151">DELETE /share &#123;fileId, userId&#125; or /share/link/&#123;token&#125;</text>

  <line x1="240" y1="426" x2="430" y2="426" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="335" y="420" text-anchor="middle" font-size="9" fill="#374151">DELETE acl row; Redis DEL acl:&#123;userId&#125;:&#123;fileId&#125;</text>

  <line x1="430" y1="440" x2="809" y2="440" stroke="#2f9d74" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="619" y="434" text-anchor="middle" font-size="9" fill="#374151">access_log: &#123;userId, fileId, action, ip, userAgent, timestamp&#125; → immutable append</text>

  <!-- Footer -->
  <rect x="8" y="458" width="884" height="36" rx="6" fill="#1a1822"/>
  <text x="90" y="474" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">Roles</text>
  <text x="90" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">owner &gt; editor &gt; viewer</text>
  <text x="255" y="474" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Inheritance</text>
  <text x="255" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">folder → children</text>
  <text x="450" y="474" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">ACL Cache</text>
  <text x="450" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">Redis 60s TTL</text>
  <text x="645" y="474" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Link Token</text>
  <text x="645" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">128-bit random</text>
  <text x="820" y="474" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Audit Log</text>
  <text x="820" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">immutable append</text>
</svg>
