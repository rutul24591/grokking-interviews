<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="QoE adaptation strategy prioritizing audio and degrading video based on network metrics">
  <title>QoE Adaptation and Graceful Degradation</title>
  <desc>Shows telemetry inputs (loss, jitter, RTT, CPU) driving audio-first adaptation, video downshift, and audio-only fallback.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
    .accent { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 14; }
    .good { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .muted { fill: #0b1220; stroke: #64748b; }
      .accent { fill: #06232a; stroke: #22d3ee; }
      .warn { fill: #2a140a; stroke: #fb923c; }
      .good { fill: #052018; stroke: #34d399; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="620" />

  <rect class="muted" x="60" y="70" width="360" height="190" />
  <text class="label bold" x="90" y="115">Telemetry inputs</text>
  <text class="label small" x="90" y="145">packet loss</text>
  <text class="label small" x="90" y="170">jitter</text>
  <text class="label small" x="90" y="195">RTT</text>
  <text class="label small" x="90" y="220">CPU / thermal</text>

  <rect class="accent" x="460" y="70" width="330" height="190" />
  <text class="label bold" x="490" y="115">Adaptation policy</text>
  <text class="label small" x="490" y="145">audio-first</text>
  <text class="label small" x="490" y="170">downshift video bitrate</text>
  <text class="label small" x="490" y="195">reduce fps / resolution</text>
  <text class="label small" x="490" y="220">pause non-critical tiles</text>

  <rect class="good" x="830" y="70" width="310" height="190" />
  <text class="label bold" x="860" y="115">Stable call</text>
  <text class="label small" x="860" y="145">audio continuous</text>
  <text class="label small" x="860" y="170">video adapted</text>
  <text class="label small" x="860" y="195">UI shows reason</text>

  <path class="arrow" d="M420 165 L460 165" />
  <path class="arrow" d="M790 165 L830 165" />

  <rect class="box" x="60" y="320" width="520" height="170" />
  <text class="label bold" x="90" y="365">Meeting scale policy</text>
  <text class="label small" x="90" y="395">high quality: active speaker + pinned</text>
  <text class="label small" x="90" y="420">medium: visible tiles</text>
  <text class="label small" x="90" y="445">low: off-screen (audio only or paused)</text>
  <text class="label small" x="90" y="470">prevents CPU decode overload</text>

  <rect class="warn" x="620" y="320" width="520" height="170" />
  <text class="label bold" x="650" y="365">Graceful degradation</text>
  <text class="label small" x="650" y="395">pause video first</text>
  <text class="label small" x="650" y="420">fall back to audio-only</text>
  <text class="label small" x="650" y="445">bounded reconnect attempts</text>
  <text class="label small" x="650" y="470">explicit failure with rejoin</text>

  <path class="arrow" d="M600 405 L620 405" />

  <rect class="box" x="60" y="530" width="1080" height="70" />
  <text class="label bold" x="90" y="575">Goal</text>
  <text class="label small" x="170" y="575">stable conversation over perfect video</text>
</svg>

