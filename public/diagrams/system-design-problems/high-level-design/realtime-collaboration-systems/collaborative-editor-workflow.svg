<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Workflow for collaborative editor join, edit, and reconnect using snapshot and deltas">
  <title>Collaborative Editor Workflow</title>
  <desc>Shows snapshot plus delta join, local-first edits, operation broadcast, and offline replay with idempotency on reconnect.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
    .accent { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .muted { fill: #0b1220; stroke: #64748b; }
      .accent { fill: #06232a; stroke: #22d3ee; }
      .warn { fill: #2a140a; stroke: #fb923c; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="640" />

  <rect class="box" x="60" y="70" width="330" height="160" />
  <text class="label bold" x="90" y="115">Open document</text>
  <text class="label small" x="90" y="145">load cached snapshot if any</text>
  <text class="label small" x="90" y="170">connect to room</text>
  <text class="label small" x="90" y="195">request deltas since snapshot</text>

  <rect class="accent" x="440" y="70" width="320" height="160" />
  <text class="label bold" x="470" y="115">Server join</text>
  <text class="label small" x="470" y="145">authorize</text>
  <text class="label small" x="470" y="170">serve snapshot + bounded deltas</text>
  <text class="label small" x="470" y="195">subscribe to broadcasts</text>

  <rect class="box" x="810" y="70" width="330" height="160" />
  <text class="label bold" x="840" y="115">Client in sync</text>
  <text class="label small" x="840" y="145">apply deltas</text>
  <text class="label small" x="840" y="170">render view</text>
  <text class="label small" x="840" y="195">show sync state</text>

  <path class="arrow" d="M390 150 L440 150" />
  <path class="arrow" d="M760 150 L810 150" />

  <rect class="box" x="90" y="300" width="350" height="150" />
  <text class="label bold" x="120" y="345">Local edits</text>
  <text class="label small" x="120" y="375">apply instantly to replica</text>
  <text class="label small" x="120" y="400">batch small bursts</text>
  <text class="label small" x="120" y="425">emit ops with op ids</text>

  <rect class="accent" x="500" y="300" width="330" height="150" />
  <text class="label bold" x="530" y="345">Realtime relay</text>
  <text class="label small" x="530" y="375">validate + dedupe</text>
  <text class="label small" x="530" y="400">assign ordering metadata</text>
  <text class="label small" x="530" y="425">broadcast to room</text>

  <rect class="box" x="880" y="300" width="260" height="150" />
  <text class="label bold" x="910" y="345">Remote apply</text>
  <text class="label small" x="910" y="375">apply ops to replica</text>
  <text class="label small" x="910" y="400">map selection anchors</text>
  <text class="label small" x="910" y="425">incremental render</text>

  <path class="arrow" d="M440 375 L500 375" />
  <path class="arrow" d="M830 375 L880 375" />

  <rect class="warn" x="90" y="500" width="500" height="110" />
  <text class="label bold" x="120" y="545">Disconnect</text>
  <text class="label small" x="120" y="575">queue ops durably, show offline</text>

  <rect class="muted" x="640" y="500" width="500" height="110" />
  <text class="label bold" x="670" y="545">Reconnect recovery</text>
  <text class="label small" x="670" y="575">fetch missed deltas, replay queued ops idempotently</text>

  <path class="arrow" d="M980 460 C980 485 960 490 960 500" />
  <path class="arrow" d="M590 555 L640 555" />
</svg>

