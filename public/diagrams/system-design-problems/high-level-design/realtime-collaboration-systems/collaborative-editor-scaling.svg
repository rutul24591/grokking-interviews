<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Scaling strategy for collaborative editor with sharded rooms, compaction, and separate ephemeral channel">
  <title>Collaborative Editor Scaling Strategy</title>
  <desc>Shows sharded room relays, durable edit pipeline with snapshots, and separate ephemeral presence pipeline for cursors and typing with throttling.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
    .accent { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .good { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .dash { stroke-dasharray: 7 6; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .muted { fill: #0b1220; stroke: #64748b; }
      .accent { fill: #06232a; stroke: #22d3ee; }
      .good { fill: #052018; stroke: #34d399; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="640" />

  <rect class="box" x="60" y="70" width="330" height="140" />
  <text class="label bold" x="90" y="115">Clients</text>
  <text class="label small" x="90" y="145">edit ops (durable)</text>
  <text class="label small" x="90" y="170">cursors/typing (ephemeral)</text>

  <rect class="accent" x="440" y="50" width="700" height="200" />
  <text class="label bold" x="470" y="95">Room relays (sharded)</text>
  <text class="label small" x="470" y="125">pin a document to a shard to keep fanout local</text>
  <text class="label small" x="470" y="150">batch ops, compress payloads, cap editors for very large rooms</text>
  <text class="label small" x="470" y="175">separate lanes for durable edits and ephemeral signals</text>

  <rect class="good" x="470" y="115" width="200" height="110" />
  <text class="label bold" x="495" y="155">Shard A</text>
  <text class="label small" x="495" y="185">docs 0..N</text>

  <rect class="good" x="690" y="115" width="200" height="110" />
  <text class="label bold" x="715" y="155">Shard B</text>
  <text class="label small" x="715" y="185">docs N..M</text>

  <rect class="good" x="910" y="115" width="200" height="110" />
  <text class="label bold" x="935" y="155">Shard C</text>
  <text class="label small" x="935" y="185">docs M..</text>

  <path class="arrow" d="M390 140 L440 140" />

  <rect class="box" x="110" y="280" width="1020" height="150" />
  <text class="label bold" x="140" y="325">Durable edit pipeline</text>
  <text class="label small" x="140" y="355">validate + dedupe ops, persist snapshots and bounded deltas, support snapshot + delta join</text>
  <text class="label small" x="140" y="380">compaction keeps join and reconnect bounded; audit hooks attach to durable stream</text>

  <rect class="muted" x="110" y="470" width="1020" height="130" />
  <text class="label bold" x="140" y="515">Ephemeral presence pipeline</text>
  <text class="label small" x="140" y="545">rate limit at client and server, store with short TTL, safe to drop under load</text>
  <text class="label small" x="140" y="570">shed ephemerals first during incidents to preserve durable edits</text>

  <path class="arrow dash" d="M740 250 L740 280" />
  <path class="arrow dash" d="M740 430 L740 470" />
</svg>

