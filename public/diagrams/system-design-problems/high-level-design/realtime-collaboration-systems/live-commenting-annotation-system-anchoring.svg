<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Anchoring strategies for annotations in different content models">
  <title>Annotation Anchoring Strategies</title>
  <desc>Compares anchoring to object ids, transform-aware text ranges, and coordinate anchors with uncertainty handling.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .ok { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 14; }
    .muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .ok { fill: #06232a; stroke: #22d3ee; }
      .warn { fill: #2a1608; stroke: #fb923c; }
      .muted { fill: #0b1220; stroke: #64748b; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="560" />

  <rect class="ok" x="70" y="70" width="520" height="160" />
  <text class="label bold" x="100" y="115">Structured objects</text>
  <text class="label small" x="100" y="145">anchor to stable object ids</text>
  <text class="label small" x="100" y="170">moves with object</text>
  <text class="label small" x="100" y="195">best correctness</text>

  <rect class="muted" x="640" y="70" width="490" height="160" />
  <text class="label bold" x="670" y="115">Rich text</text>
  <text class="label small" x="670" y="145">transform-aware ranges</text>
  <text class="label small" x="670" y="170">updated by OT/CRDT mapping</text>
  <text class="label small" x="670" y="195">deterministic when possible</text>

  <path class="arrow" d="M590 150 L640 150" />

  <rect class="warn" x="70" y="290" width="520" height="190" />
  <text class="label bold" x="100" y="335">Coordinates</text>
  <text class="label small" x="100" y="365">can drift under layout changes</text>
  <text class="label small" x="100" y="390">show uncertainty</text>
  <text class="label small" x="100" y="415">allow re-anchoring</text>

  <rect class="box" x="640" y="290" width="490" height="190" />
  <text class="label bold" x="670" y="335">When confidence is low</text>
  <text class="label small" x="670" y="365">mark “needs review”</text>
  <text class="label small" x="670" y="390">do not silently attach wrong</text>
  <text class="label small" x="670" y="415">preserve user trust</text>

  <path class="arrow" d="M590 385 L640 385" />
</svg>
