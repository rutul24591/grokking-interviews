<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="State machine for lobby UI including lobby, queued, match found, joining, and failure recovery">
  <title>Lobby UI State Machine</title>
  <desc>Shows explicit UI states and allowed transitions to prevent inconsistent lobby behavior under asynchronous events.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 16; }
    .accent { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 16; }
    .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 16; }
    .muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 16; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; marker-end: url(#m); }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .accent { fill: #06232a; stroke: #22d3ee; }
      .warn { fill: #2a140a; stroke: #fb923c; }
      .muted { fill: #0b1220; stroke: #64748b; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="560" />

  <rect class="box" x="80" y="90" width="260" height="120" />
  <text class="label bold" x="110" y="135">Lobby</text>
  <text class="label small" x="110" y="165">edit party + mode</text>
  <text class="label small" x="110" y="190">ready toggles</text>

  <rect class="accent" x="470" y="90" width="260" height="120" />
  <text class="label bold" x="500" y="135">Queued</text>
  <text class="label small" x="500" y="165">show status</text>
  <text class="label small" x="500" y="190">allow cancel</text>

  <rect class="warn" x="860" y="90" width="260" height="120" />
  <text class="label bold" x="890" y="135">Match found</text>
  <text class="label small" x="890" y="165">deadline</text>
  <text class="label small" x="890" y="190">accept/decline</text>

  <rect class="box" x="470" y="320" width="260" height="120" />
  <text class="label bold" x="500" y="365">Joining</text>
  <text class="label small" x="500" y="395">fetch join token</text>
  <text class="label small" x="500" y="420">connect to game</text>

  <rect class="muted" x="80" y="320" width="260" height="120" />
  <text class="label bold" x="110" y="365">Recovering</text>
  <text class="label small" x="110" y="395">reconnect</text>
  <text class="label small" x="110" y="420">snapshot refetch</text>

  <path class="arrow" d="M340 150 L470 150" />
  <path class="arrow" d="M730 150 L860 150" />
  <path class="arrow" d="M990 210 C990 270 730 280 650 320" />
  <path class="arrow" d="M600 210 L600 320" />
  <path class="arrow" d="M470 380 L340 380" />
  <path class="arrow" d="M210 210 L210 320" />
</svg>

