<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Scaling and load shedding strategy for cursor sharing">
  <title>Cursor Sharing Scaling</title>
  <desc>Shows cursor traffic as an ephemeral stream that can be reduced or dropped to protect core collaboration performance.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .ok { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .warn { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .ok { fill: #06232a; stroke: #22d3ee; }
      .warn { fill: #2a1608; stroke: #fb923c; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="560" />

  <rect class="ok" x="70" y="70" width="520" height="180" />
  <text class="label bold" x="100" y="115">Normal operation</text>
  <text class="label small" x="100" y="145">10–20 Hz sampling</text>
  <text class="label small" x="100" y="170">viewport scoping on</text>
  <text class="label small" x="100" y="195">interpolation on receivers</text>
  <text class="label small" x="100" y="220">bounded CPU and bandwidth</text>

  <rect class="warn" x="640" y="70" width="490" height="180" />
  <text class="label bold" x="670" y="115">High load / incident</text>
  <text class="label small" x="670" y="145">reduce send frequency</text>
  <text class="label small" x="670" y="170">tighten scoping</text>
  <text class="label small" x="670" y="195">drop cursor updates first</text>
  <text class="label small" x="670" y="220">preserve edit traffic</text>

  <path class="arrow" d="M590 160 L640 160" />

  <rect class="box" x="70" y="310" width="520" height="170" />
  <text class="label bold" x="100" y="355">Operability</text>
  <text class="label small" x="100" y="385">cursor send rate histograms</text>
  <text class="label small" x="100" y="410">relay drop rates</text>
  <text class="label small" x="100" y="435">end-to-end cursor latency</text>

  <rect class="box" x="640" y="310" width="490" height="170" />
  <text class="label bold" x="670" y="355">User-visible behavior</text>
  <text class="label small" x="670" y="385">show degraded indicator</text>
  <text class="label small" x="670" y="410">presence remains</text>
  <text class="label small" x="670" y="435">cursor motion less smooth acceptable</text>

  <path class="arrow" d="M590 395 L640 395" />
</svg>
