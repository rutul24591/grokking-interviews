<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Presence scaling and graceful degradation with scoped subscriptions and load shedding">
  <title>Presence Scaling and Degradation</title>
  <desc>Shows scoped subscriptions, coalescing, TTL store, and degradation path that sheds ephemeral signals before core presence state.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
    .accent { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .muted { fill: #0b1220; stroke: #64748b; }
      .accent { fill: #06232a; stroke: #22d3ee; }
      .warn { fill: #2a140a; stroke: #fb923c; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="640" />

  <rect class="box" x="60" y="80" width="330" height="150" />
  <text class="label bold" x="90" y="125">Clients</text>
  <text class="label small" x="90" y="155">heartbeats (adaptive cadence)</text>
  <text class="label small" x="90" y="180">typing (bounded rate)</text>
  <text class="label small" x="90" y="205">subscribe to scoped sets</text>

  <rect class="accent" x="440" y="60" width="320" height="190" />
  <text class="label bold" x="470" y="105">Presence service</text>
  <text class="label small" x="470" y="135">TTL store for sessions</text>
  <text class="label small" x="470" y="160">aggregate per user</text>
  <text class="label small" x="470" y="185">enforce privacy rules</text>

  <rect class="muted" x="810" y="60" width="330" height="190" />
  <text class="label bold" x="840" y="105">Fanout layer</text>
  <text class="label small" x="840" y="135">room scoped subscriptions</text>
  <text class="label small" x="840" y="160">friends/workspace (coarse)</text>
  <text class="label small" x="840" y="185">coalesce + batch updates</text>

  <path class="arrow" d="M390 155 L440 155" />
  <path class="arrow" d="M760 155 L810 155" />

  <rect class="box" x="60" y="300" width="1080" height="140" />
  <text class="label bold" x="90" y="345">Scaling levers</text>
  <text class="label small" x="90" y="375">reduce frequency (adaptive heartbeats), coalesce updates, cap subscription sizes, prefer coarse global states</text>
  <text class="label small" x="90" y="400">do not broadcast globally; always scope by relationship or room membership</text>

  <rect class="warn" x="60" y="470" width="1080" height="130" />
  <text class="label bold" x="90" y="515">Degradation path</text>
  <text class="label small" x="90" y="545">shed ephemeral typing/cursor signals first, then reduce update rate, then fall back to last-seen only</text>
  <text class="label small" x="90" y="570">never block messaging or editing on presence availability</text>
</svg>

