<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Workflow for lobby party updates, queue lifecycle, match-found acceptance, and join transition">
  <title>Lobby and Matchmaking Workflow</title>
  <desc>Shows server-authoritative party state, idempotent actions, realtime events, match-found acceptance window, and joining the game session.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
    .accent { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .warn { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .muted { fill: #0b1220; stroke: #64748b; }
      .accent { fill: #06232a; stroke: #22d3ee; }
      .warn { fill: #2a140a; stroke: #fb923c; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="640" />

  <rect class="box" x="60" y="70" width="330" height="150" />
  <text class="label bold" x="90" y="115">Party</text>
  <text class="label small" x="90" y="145">create / join</text>
  <text class="label small" x="90" y="170">invite members</text>
  <text class="label small" x="90" y="195">ready toggles</text>

  <rect class="accent" x="430" y="70" width="360" height="150" />
  <text class="label bold" x="460" y="115">Party service</text>
  <text class="label small" x="460" y="145">authoritative state</text>
  <text class="label small" x="460" y="170">versioned updates</text>
  <text class="label small" x="460" y="195">realtime emit</text>

  <rect class="box" x="830" y="70" width="310" height="150" />
  <text class="label bold" x="860" y="115">Clients</text>
  <text class="label small" x="860" y="145">subscribe to party</text>
  <text class="label small" x="860" y="170">render stable state</text>
  <text class="label small" x="860" y="195">refetch on reconnect</text>

  <path class="arrow" d="M390 145 L430 145" />
  <path class="arrow" d="M790 145 L830 145" />

  <rect class="muted" x="60" y="280" width="350" height="140" />
  <text class="label bold" x="90" y="325">Queue start (idempotent)</text>
  <text class="label small" x="90" y="355">leader starts queue</text>
  <text class="label small" x="90" y="380">server returns queue id</text>

  <rect class="accent" x="430" y="280" width="360" height="140" />
  <text class="label bold" x="460" y="325">Matchmaking</text>
  <text class="label small" x="460" y="355">status updates</text>
  <text class="label small" x="460" y="380">match found event</text>

  <rect class="warn" x="830" y="280" width="310" height="140" />
  <text class="label bold" x="860" y="325">Match found</text>
  <text class="label small" x="860" y="355">deadline countdown</text>
  <text class="label small" x="860" y="380">accept / decline</text>

  <path class="arrow" d="M410 350 L430 350" />
  <path class="arrow" d="M790 350 L830 350" />

  <rect class="box" x="60" y="470" width="1080" height="120" />
  <text class="label bold" x="90" y="515">Join session</text>
  <text class="label small" x="90" y="545">on accept: server issues join token and server info, client transitions to joining and then in-game</text>
</svg>

