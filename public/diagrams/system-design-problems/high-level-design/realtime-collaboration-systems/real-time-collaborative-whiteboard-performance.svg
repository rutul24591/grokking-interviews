<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Performance strategy for large collaborative whiteboards with spatial indexing and incremental rendering">
  <title>Whiteboard Performance Strategy</title>
  <desc>Shows spatial index and viewport culling, incremental rendering, batching updates, and separation between canvas scene and UI overlays.</desc>
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 14; }
    .muted { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; rx: 14; }
    .accent { fill: #ecfeff; stroke: #0891b2; stroke-width: 2; rx: 14; }
    .good { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 14; }
    .arrow { stroke: #1f2937; stroke-width: 2.5; fill: none; }
    .dash { stroke-dasharray: 7 6; }
    .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; fill: #0f172a; font-size: 18px; }
    .small { font-size: 14px; fill: #334155; }
    .bold { font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0b1220; }
      .box { fill: #0f172a; stroke: #e5e7eb; }
      .muted { fill: #0b1220; stroke: #64748b; }
      .accent { fill: #06232a; stroke: #22d3ee; }
      .good { fill: #052018; stroke: #34d399; }
      .arrow { stroke: #e5e7eb; }
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="1200" height="640" />

  <rect class="box" x="60" y="70" width="520" height="200" />
  <text class="label bold" x="90" y="115">Object store</text>
  <text class="label small" x="90" y="145">normalized entities by id</text>
  <text class="label small" x="90" y="170">apply ops incrementally</text>
  <text class="label small" x="90" y="195">changed ids drive render diff</text>
  <text class="label small" x="90" y="220">avoid full-board recompute</text>

  <rect class="good" x="620" y="70" width="520" height="200" />
  <text class="label bold" x="650" y="115">Spatial index + viewport culling</text>
  <text class="label small" x="650" y="145">quickly find visible objects</text>
  <text class="label small" x="650" y="170">subscribe to viewport regions</text>
  <text class="label small" x="650" y="195">render only intersecting tiles</text>
  <text class="label small" x="650" y="220">bounds work on huge boards</text>

  <path class="arrow" d="M580 170 L620 170" />

  <rect class="accent" x="60" y="320" width="520" height="190" />
  <text class="label bold" x="90" y="365">Canvas/WebGL renderer</text>
  <text class="label small" x="90" y="395">batch draw calls</text>
  <text class="label small" x="90" y="420">incremental redraw of dirty regions</text>
  <text class="label small" x="90" y="445">schedule remote apply work</text>

  <rect class="muted" x="620" y="320" width="520" height="190" />
  <text class="label bold" x="650" y="365">UI overlays</text>
  <text class="label small" x="650" y="395">text edit, toolbars, selection handles</text>
  <text class="label small" x="650" y="420">remote cursors (throttled)</text>
  <text class="label small" x="650" y="445">kept separate from scene graph</text>

  <path class="arrow dash" d="M320 270 L320 320" />
  <path class="arrow dash" d="M880 270 L880 320" />

  <rect class="box" x="60" y="540" width="1080" height="80" />
  <text class="label bold" x="90" y="585">Why this works</text>
  <text class="label small" x="320" y="585">bounds CPU, GPU, and network work by viewport and dirty regions</text>
</svg>

