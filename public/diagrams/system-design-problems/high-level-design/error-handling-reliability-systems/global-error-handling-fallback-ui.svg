<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">Global Error Handling &amp; Fallback UI — Catch, Classify &amp; Recover</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="65" width="110" height="40" rx="8" fill="#6d5bd0"/>
  <text x="75" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Client App</text>
  <text x="75" y="98" text-anchor="middle" font-size="10" fill="#edeaf5">UI + runtime</text>

  <rect x="198" y="65" width="115" height="40" rx="8" fill="#2563eb"/>
  <text x="255" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Error Boundary</text>
  <text x="255" y="98" text-anchor="middle" font-size="10" fill="#dbeafe">catch + classify</text>

  <rect x="388" y="65" width="115" height="40" rx="8" fill="#2f9d74"/>
  <text x="445" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Fallback Engine</text>
  <text x="445" y="98" text-anchor="middle" font-size="10" fill="#d1fae5">render + cache</text>

  <rect x="578" y="65" width="115" height="40" rx="8" fill="#d97843"/>
  <text x="635" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Error Reporter</text>
  <text x="635" y="98" text-anchor="middle" font-size="10" fill="#fef3c7">Sentry / LogRocket</text>

  <rect x="768" y="65" width="112" height="40" rx="8" fill="#be123c"/>
  <text x="824" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">On-call / Ops</text>
  <text x="824" y="98" text-anchor="middle" font-size="10" fill="#fecdd3">alert + remediate</text>

  <!-- Lifelines -->
  <line x1="75"  y1="105" x2="75"  y2="490" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="255" y1="105" x2="255" y2="490" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="445" y1="105" x2="445" y2="490" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="635" y1="105" x2="635" y2="490" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="824" y1="105" x2="824" y2="490" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- SECTION 1: Error caught + classified -->
  <rect x="8" y="118" width="884" height="14" rx="3" fill="#6d5bd0" opacity="0.15"/>
  <text x="450" y="129" text-anchor="middle" font-size="9" font-weight="bold" fill="#4c1d95">1 · CATCH — React Error Boundary wraps subtrees; global window.onerror catches unhandled rejections; classify: network / chunk-load / render / permission / unknown</text>

  <line x1="75" y1="150" x2="240" y2="150" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="144" text-anchor="middle" font-size="9" fill="#374151">throw / unhandledRejection / componentDidCatch(error, info)</text>

  <rect x="178" y="155" width="155" height="20" rx="5" fill="#2563eb"/>
  <text x="255" y="169" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">classify error type; extract stack + context</text>

  <line x1="240" y1="178" x2="90" y2="178" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="165" y="172" text-anchor="middle" font-size="9" fill="#374151">errorType, severity, affectedRoute, userId</text>

  <!-- SECTION 2: Fallback render + stale cache -->
  <rect x="8" y="192" width="884" height="14" rx="3" fill="#2f9d74" opacity="0.18"/>
  <text x="450" y="203" text-anchor="middle" font-size="9" font-weight="bold" fill="#065f46">2 · FALLBACK — select fallback by scope (widget / page / app); serve stale cache for network errors; skeleton for transient; hard error page for fatal</text>

  <line x1="240" y1="222" x2="430" y2="222" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="335" y="216" text-anchor="middle" font-size="9" fill="#374151">dispatch(errorType, scope) → select fallback strategy</text>

  <line x1="430" y1="236" x2="430" y2="236" stroke="#2f9d74" stroke-width="1"/>
  <rect x="350" y="238" width="190" height="20" rx="5" fill="#2f9d74"/>
  <text x="445" y="252" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">network → stale cache; render → skeleton; fatal → error page</text>

  <line x1="430" y1="262" x2="90" y2="262" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="260" y="256" text-anchor="middle" font-size="9" fill="#374151">render fallback UI: user-friendly message + retry CTA</text>

  <!-- SECTION 3: Error report + enrichment -->
  <rect x="8" y="276" width="884" height="14" rx="3" fill="#d97843" opacity="0.18"/>
  <text x="450" y="287" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">3 · REPORT — enrich with session replay URL, breadcrumbs, feature flags, build SHA; deduplicate by fingerprint; send to Sentry; sample at 100% errors / 10% warnings</text>

  <line x1="240" y1="306" x2="620" y2="306" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="430" y="300" text-anchor="middle" font-size="9" fill="#374151">POST /errors {stack, context, sessionReplayUrl, buildSha}</text>

  <line x1="430" y1="320" x2="620" y2="320" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="525" y="314" text-anchor="middle" font-size="9" fill="#374151">fingerprint dedup; group by issue; set severity</text>

  <line x1="620" y1="334" x2="430" y2="334" stroke="#d97843" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="525" y="328" text-anchor="middle" font-size="9" fill="#374151">200 OK: issueId, groupCount, firstSeen</text>

  <!-- SECTION 4: Alert + auto-recovery -->
  <rect x="8" y="348" width="884" height="14" rx="3" fill="#be123c" opacity="0.12"/>
  <text x="450" y="359" text-anchor="middle" font-size="9" font-weight="bold" fill="#9f1239">4 · ALERT &amp; RECOVER — spike in error rate → PagerDuty; client auto-retry with exponential backoff; chunk-load errors → hard reload; session continuity via localStorage draft save</text>

  <line x1="620" y1="378" x2="809" y2="378" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="714" y="372" text-anchor="middle" font-size="9" fill="#374151">error_rate &gt; threshold → PagerDuty alert + Slack</text>

  <line x1="809" y1="392" x2="430" y2="392" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="619" y="386" text-anchor="middle" font-size="9" fill="#374151">incident status banner: feature degraded, team investigating</text>

  <line x1="75" y1="412" x2="240" y2="412" stroke="#6d5bd0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="157" y="406" text-anchor="middle" font-size="9" fill="#374151">retry: exponential backoff 1s→2s→4s; chunk-load → location.reload()</text>

  <line x1="430" y1="430" x2="90" y2="430" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="260" y="424" text-anchor="middle" font-size="9" fill="#374151">save draft to localStorage; restore on successful reload</text>

  <!-- Footer -->
  <rect x="8" y="458" width="884" height="36" rx="6" fill="#1a1822"/>
  <text x="90" y="474" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">Error Classes</text>
  <text x="90" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">network / chunk / render</text>
  <text x="255" y="474" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Fallback Scope</text>
  <text x="255" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">widget / page / app</text>
  <text x="450" y="474" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Dedup</text>
  <text x="450" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">stack fingerprint</text>
  <text x="645" y="474" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Retry Backoff</text>
  <text x="645" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">1s → 2s → 4s</text>
  <text x="820" y="474" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Sampling</text>
  <text x="820" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">100% errors / 10% warn</text>
</svg>
