<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="960" height="620" fill="#f3f1f8"/>
  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Amazon / Flipkart Frontend — Rendering Strategy by Page Type</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Row: Actors -->
  <rect x="14" y="50" width="932" height="18" rx="4" fill="#6d5bd0" opacity="0.15"/>
  <text x="20" y="63" font-size="10" font-weight="bold" fill="#6d5bd0">ACTORS</text>

  <rect x="30" y="75" width="90" height="36" rx="7" fill="#6d5bd0"/>
  <text x="75" y="91" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">User</text>
  <text x="75" y="105" text-anchor="middle" font-size="10" fill="#edeaf5">Browser</text>

  <rect x="190" y="75" width="100" height="36" rx="7" fill="#6d5bd0"/>
  <text x="240" y="91" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">CDN Edge</text>
  <text x="240" y="105" text-anchor="middle" font-size="10" fill="#edeaf5">CloudFront</text>

  <rect x="370" y="75" width="110" height="36" rx="7" fill="#2f9d74"/>
  <text x="425" y="91" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Next.js SSR</text>
  <text x="425" y="105" text-anchor="middle" font-size="10" fill="#e8f5f0">Edge Runtime</text>

  <rect x="560" y="75" width="110" height="36" rx="7" fill="#2f9d74"/>
  <text x="615" y="91" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Product API</text>
  <text x="615" y="105" text-anchor="middle" font-size="10" fill="#e8f5f0">Catalog Service</text>

  <rect x="750" y="75" width="110" height="36" rx="7" fill="#d97843"/>
  <text x="805" y="91" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Personalization</text>
  <text x="805" y="105" text-anchor="middle" font-size="10" fill="#fff5ee">Service</text>

  <!-- Lifelines -->
  <line x1="75" y1="111" x2="75" y2="600" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="240" y1="111" x2="240" y2="600" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="425" y1="111" x2="425" y2="600" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="615" y1="111" x2="615" y2="600" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="805" y1="111" x2="805" y2="600" stroke="#c4b8e8" stroke-width="1" stroke-dasharray="4,5" opacity="0.5"/>

  <!-- PATH A: Homepage ISR -->
  <rect x="14" y="122" width="932" height="16" rx="4" fill="#2f9d74" opacity="0.13"/>
  <text x="480" y="134" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">PATH A — Homepage (ISR: revalidate=300s, CDN cached)</text>

  <line x1="75" y1="152" x2="230" y2="152" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="152" y="146" text-anchor="middle" font-size="10" fill="#1a1822">GET /  (homepage)</text>

  <rect x="192" y="158" width="100" height="20" rx="5" fill="#2f9d74"/>
  <text x="242" y="172" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">CDN HIT ✓ ~8ms</text>

  <line x1="230" y1="188" x2="85" y2="188" stroke="#2f9d74" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <text x="157" y="182" text-anchor="middle" font-size="10" fill="#2f9d74">Cached ISR shell (stale-while-revalidate)</text>

  <rect x="30" y="196" width="135" height="20" rx="5" fill="#2f9d74"/>
  <text x="97" y="210" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">FCP &lt; 50ms ✓ global</text>

  <!-- PATH B: PDP SSR -->
  <rect x="14" y="222" width="932" height="16" rx="4" fill="#6d5bd0" opacity="0.12"/>
  <text x="480" y="234" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">PATH B — Product Detail Page (SSR at edge, personalized, not cached)</text>

  <line x1="75" y1="254" x2="230" y2="254" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="152" y="248" text-anchor="middle" font-size="10" fill="#1a1822">GET /p/{productId} + cookie</text>

  <rect x="192" y="260" width="100" height="20" rx="5" fill="#c0392b"/>
  <text x="242" y="274" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">CDN MISS (private)</text>

  <line x1="240" y1="290" x2="415" y2="290" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="327" y="284" text-anchor="middle" font-size="10" fill="#1a1822">Forward to SSR edge worker</text>

  <line x1="425" y1="304" x2="605" y2="304" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="515" y="298" text-anchor="middle" font-size="10" fill="#1a1822">fetch product + reviews (parallel)</text>

  <line x1="425" y1="316" x2="795" y2="316" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="610" y="310" text-anchor="middle" font-size="10" fill="#d97843">fetch personalized recs (parallel)</text>

  <line x1="605" y1="332" x2="435" y2="332" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="520" y="326" text-anchor="middle" font-size="10" fill="#2f9d74">product JSON ~25ms</text>

  <line x1="795" y1="344" x2="435" y2="344" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="615" y="338" text-anchor="middle" font-size="10" fill="#d97843">recs JSON ~40ms</text>

  <rect x="378" y="350" width="96" height="20" rx="5" fill="#6d5bd0"/>
  <text x="426" y="364" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">SSR renders HTML</text>

  <line x1="415" y1="378" x2="250" y2="378" stroke="#2f9d74" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <line x1="240" y1="378" x2="85" y2="378" stroke="#2f9d74" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <text x="250" y="372" text-anchor="middle" font-size="10" fill="#2f9d74">Streamed HTML ~70ms TTFB</text>

  <!-- PATH C: Cart/Account CSR -->
  <rect x="14" y="396" width="932" height="16" rx="4" fill="#d97843" opacity="0.13"/>
  <text x="480" y="408" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">PATH C — Cart / Account Pages (CSR shell + client hydration)</text>

  <line x1="75" y1="426" x2="230" y2="426" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="152" y="420" text-anchor="middle" font-size="10" fill="#1a1822">GET /cart (CDN cached shell)</text>

  <rect x="192" y="432" width="100" height="20" rx="5" fill="#2f9d74"/>
  <text x="242" y="446" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">CDN HIT (empty shell)</text>

  <line x1="230" y1="460" x2="85" y2="460" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="157" y="454" text-anchor="middle" font-size="10" fill="#2f9d74">HTML shell (no user data)</text>

  <line x1="75" y1="476" x2="605" y2="476" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="340" y="470" text-anchor="middle" font-size="10" fill="#d97843">Client JS hydrates: GET /api/cart (with auth cookie)</text>

  <line x1="605" y1="492" x2="85" y2="492" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="340" y="486" text-anchor="middle" font-size="10" fill="#d97843">cart JSON → React renders items (LCP ~350ms)</text>

  <!-- Metrics Panel -->
  <rect x="14" y="516" width="932" height="16" rx="4" fill="#1a1822" opacity="0.08"/>
  <text x="480" y="528" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1822">RENDERING DECISION MATRIX</text>

  <rect x="30" y="538" width="200" height="56" rx="6" fill="#fff" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="130" y="554" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Homepage / Category</text>
  <text x="130" y="568" text-anchor="middle" font-size="10" fill="#1a1822">ISR  revalidate=300s</text>
  <text x="130" y="582" text-anchor="middle" font-size="10" fill="#2f9d74">CDN Cache-Control: s-maxage=300</text>

  <rect x="248" y="538" width="200" height="56" rx="6" fill="#fff" stroke="#2f9d74" stroke-width="1.5"/>
  <text x="348" y="554" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Product Detail Page</text>
  <text x="348" y="568" text-anchor="middle" font-size="10" fill="#1a1822">SSR at edge  (personalized)</text>
  <text x="348" y="582" text-anchor="middle" font-size="10" fill="#c0392b">Cache-Control: private, no-store</text>

  <rect x="466" y="538" width="200" height="56" rx="6" fill="#fff" stroke="#d97843" stroke-width="1.5"/>
  <text x="566" y="554" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Cart / Account / Orders</text>
  <text x="566" y="568" text-anchor="middle" font-size="10" fill="#1a1822">CSR shell  (client hydration)</text>
  <text x="566" y="582" text-anchor="middle" font-size="10" fill="#d97843">API calls with auth cookie</text>

  <rect x="684" y="538" width="258" height="56" rx="6" fill="#fff" stroke="#1a1822" stroke-width="1.5"/>
  <text x="813" y="554" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1822">Search Results</text>
  <text x="813" y="568" text-anchor="middle" font-size="10" fill="#1a1822">SSR + query-keyed CDN cache</text>
  <text x="813" y="582" text-anchor="middle" font-size="10" fill="#6d5bd0">Vary: Accept-Encoding  TTL=60s</text>
</svg>
