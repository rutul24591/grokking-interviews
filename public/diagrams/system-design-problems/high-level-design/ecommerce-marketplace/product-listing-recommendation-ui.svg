<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="960" height="640" fill="#f4f2fb"/>
  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Product Listing + Recommendation UI — Data Flow</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#d97843"/>
    </marker>
  </defs>

  <!-- Actors Row -->
  <rect x="14" y="50" width="932" height="16" rx="4" fill="#6d5bd0" opacity="0.14"/>
  <text x="20" y="62" font-size="10" font-weight="bold" fill="#6d5bd0">ACTORS</text>

  <rect x="30" y="72" width="90" height="36" rx="7" fill="#6d5bd0"/>
  <text x="75" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Browser</text>
  <text x="75" y="102" text-anchor="middle" font-size="10" fill="#edeaf5">React SPA</text>

  <rect x="185" y="72" width="100" height="36" rx="7" fill="#6d5bd0"/>
  <text x="235" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">BFF / API</text>
  <text x="235" y="102" text-anchor="middle" font-size="10" fill="#edeaf5">Gateway</text>

  <rect x="365" y="72" width="110" height="36" rx="7" fill="#2f9d74"/>
  <text x="420" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Search Service</text>
  <text x="420" y="102" text-anchor="middle" font-size="10" fill="#e8f5f0">Elasticsearch</text>

  <rect x="555" y="72" width="110" height="36" rx="7" fill="#2f9d74"/>
  <text x="610" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Reco Engine</text>
  <text x="610" y="102" text-anchor="middle" font-size="10" fill="#e8f5f0">ML Scoring</text>

  <rect x="745" y="72" width="110" height="36" rx="7" fill="#d97843"/>
  <text x="800" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Redis Cache</text>
  <text x="800" y="102" text-anchor="middle" font-size="10" fill="#fff5ee">reco:{userId}</text>

  <!-- Lifelines -->
  <line x1="75" y1="108" x2="75" y2="590" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="235" y1="108" x2="235" y2="590" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="420" y1="108" x2="420" y2="590" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="610" y1="108" x2="610" y2="590" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="800" y1="108" x2="800" y2="590" stroke="#c4b8e8" stroke-width="1" stroke-dasharray="4,5" opacity="0.5"/>

  <!-- PATH A: ISR listing page load -->
  <rect x="14" y="118" width="932" height="16" rx="4" fill="#2f9d74" opacity="0.13"/>
  <text x="480" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">PATH A — Listing Page Initial Load (ISR shell, CDN cached)</text>

  <line x1="75" y1="150" x2="225" y2="150" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="150" y="144" text-anchor="middle" font-size="10" fill="#1a1822">GET /category/shoes?page=1</text>

  <line x1="225" y1="164" x2="85" y2="164" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="150" y="158" text-anchor="middle" font-size="10" fill="#2f9d74">ISR HTML: 40 product skeletons (~10ms CDN)</text>

  <line x1="75" y1="180" x2="225" y2="180" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="150" y="174" text-anchor="middle" font-size="10" fill="#d97843">POST /api/listing (hydrate: filters+sort state)</text>

  <line x1="235" y1="192" x2="410" y2="192" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="323" y="186" text-anchor="middle" font-size="10" fill="#1a1822">search(q, filters, sort, page=1)</text>

  <line x1="410" y1="208" x2="245" y2="208" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="327" y="202" text-anchor="middle" font-size="10" fill="#2f9d74">{hits[40], total, facets} ~30ms</text>

  <line x1="225" y1="222" x2="85" y2="222" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="150" y="216" text-anchor="middle" font-size="10" fill="#2f9d74">React replaces skeletons with real product cards</text>

  <!-- PATH B: Personalized Recs (lazy) -->
  <rect x="14" y="238" width="932" height="16" rx="4" fill="#6d5bd0" opacity="0.12"/>
  <text x="480" y="250" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">PATH B — Personalized Recommendations (lazy, below-fold, client-side)</text>

  <line x1="75" y1="268" x2="225" y2="268" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="150" y="262" text-anchor="middle" font-size="10" fill="#d97843">IntersectionObserver fires: reco section visible</text>

  <line x1="235" y1="280" x2="790" y2="280" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="513" y="274" text-anchor="middle" font-size="10" fill="#1a1822">GET reco:{userId} from cache</text>

  <rect x="756" y="286" width="88" height="20" rx="5" fill="#2f9d74"/>
  <text x="800" y="300" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Cache HIT ✓</text>

  <line x1="790" y1="316" x2="245" y2="316" stroke="#2f9d74" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <text x="518" y="310" text-anchor="middle" font-size="10" fill="#2f9d74">recs: [{skuId, score, reason}×12] ~3ms</text>

  <line x1="225" y1="330" x2="85" y2="330" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="150" y="324" text-anchor="middle" font-size="10" fill="#2f9d74">"Because you viewed…" carousel rendered</text>

  <!-- PATH C: Cache miss, ML scoring -->
  <rect x="14" y="348" width="932" height="16" rx="4" fill="#d97843" opacity="0.13"/>
  <text x="480" y="360" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">PATH C — Reco Cache MISS → ML Engine (new/anonymous user)</text>

  <rect x="756" y="376" width="88" height="20" rx="5" fill="#c0392b"/>
  <text x="800" y="390" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Cache MISS ✗</text>

  <line x1="790" y1="404" x2="620" y2="404" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="705" y="398" text-anchor="middle" font-size="10" fill="#d97843">score(userId, context, topK=12)</text>

  <line x1="610" y1="418" x2="245" y2="418" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="428" y="412" text-anchor="middle" font-size="10" fill="#d97843">ranked recs ~80ms + SET reco:{userId} TTL 30min</text>

  <!-- PATH D: Facet filter update -->
  <rect x="14" y="436" width="932" height="16" rx="4" fill="#1a1822" opacity="0.08"/>
  <text x="480" y="448" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1822">PATH D — Facet / Filter Change (URL-state driven, debounced 300ms)</text>

  <line x1="75" y1="464" x2="225" y2="464" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="150" y="458" text-anchor="middle" font-size="10" fill="#1a1822">filter: brand=Nike, size=10 → pushState</text>

  <line x1="235" y1="476" x2="410" y2="476" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="323" y="470" text-anchor="middle" font-size="10" fill="#1a1822">search(q, {brand:[Nike],size:[10]}, page=1)</text>

  <line x1="410" y1="488" x2="245" y2="488" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="323" y="482" text-anchor="middle" font-size="10" fill="#2f9d74">new hits + updated facet counts</text>

  <line x1="225" y1="500" x2="85" y2="500" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="150" y="494" text-anchor="middle" font-size="10" fill="#2f9d74">Product grid patched (no full re-render)</text>

  <!-- Metrics Panel -->
  <rect x="14" y="518" width="932" height="16" rx="4" fill="#6d5bd0" opacity="0.10"/>
  <text x="480" y="530" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">KEY METRICS</text>

  <rect x="30" y="540" width="210" height="52" rx="6" fill="#fff" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="135" y="556" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Listing FCP</text>
  <text x="135" y="570" text-anchor="middle" font-size="10" fill="#1a1822">ISR shell from CDN: ~10ms</text>
  <text x="135" y="584" text-anchor="middle" font-size="10" fill="#2f9d74">Real cards hydrated: ~120ms</text>

  <rect x="258" y="540" width="210" height="52" rx="6" fill="#fff" stroke="#2f9d74" stroke-width="1.5"/>
  <text x="363" y="556" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Reco Latency</text>
  <text x="363" y="570" text-anchor="middle" font-size="10" fill="#1a1822">Cache hit: ~3ms</text>
  <text x="363" y="584" text-anchor="middle" font-size="10" fill="#d97843">Cache miss (ML): ~80ms</text>

  <rect x="486" y="540" width="210" height="52" rx="6" fill="#fff" stroke="#d97843" stroke-width="1.5"/>
  <text x="591" y="556" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Filter Response</text>
  <text x="591" y="570" text-anchor="middle" font-size="10" fill="#1a1822">Debounce: 300ms</text>
  <text x="591" y="584" text-anchor="middle" font-size="10" fill="#2f9d74">Elasticsearch: ~30ms P50</text>

  <rect x="714" y="540" width="228" height="52" rx="6" fill="#fff" stroke="#1a1822" stroke-width="1.5"/>
  <text x="828" y="556" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1822">Reco Cache TTL</text>
  <text x="828" y="570" text-anchor="middle" font-size="10" fill="#1a1822">reco:{userId} TTL = 30 min</text>
  <text x="828" y="584" text-anchor="middle" font-size="10" fill="#6d5bd0">pre-warm on login event (Kafka)</text>
</svg>
