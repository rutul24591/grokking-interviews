<svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="960" height="680" fill="#f3f1f8"/>
  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Order Tracking &amp; Returns System — Carrier Webhook, State Machine, Refund Saga</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="14" y="50" width="932" height="16" rx="4" fill="#6d5bd0" opacity="0.14"/>
  <text x="20" y="62" font-size="10" font-weight="bold" fill="#6d5bd0">ACTORS</text>

  <rect x="20" y="72" width="90" height="36" rx="7" fill="#6d5bd0"/>
  <text x="65" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Customer</text>
  <text x="65" y="102" text-anchor="middle" font-size="10" fill="#edeaf5">Browser</text>

  <rect x="174" y="72" width="96" height="36" rx="7" fill="#6d5bd0"/>
  <text x="222" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Order Status</text>
  <text x="222" y="102" text-anchor="middle" font-size="10" fill="#edeaf5">Service</text>

  <rect x="338" y="72" width="96" height="36" rx="7" fill="#2f9d74"/>
  <text x="386" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Carrier Layer</text>
  <text x="386" y="102" text-anchor="middle" font-size="10" fill="#e8f5f0">Adapters + Kafka</text>

  <rect x="502" y="72" width="96" height="36" rx="7" fill="#2f9d74"/>
  <text x="550" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Notification</text>
  <text x="550" y="102" text-anchor="middle" font-size="10" fill="#e8f5f0">Service</text>

  <rect x="666" y="72" width="96" height="36" rx="7" fill="#d97843"/>
  <text x="714" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Returns Svc</text>
  <text x="714" y="102" text-anchor="middle" font-size="10" fill="#fff5ee">Label + Refund</text>

  <rect x="830" y="72" width="96" height="36" rx="7" fill="#1a1822"/>
  <text x="878" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Payment GW</text>
  <text x="878" y="102" text-anchor="middle" font-size="10" fill="#d7d1e6">Idempotent</text>

  <!-- Lifelines -->
  <line x1="65" y1="108" x2="65" y2="540" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="222" y1="108" x2="222" y2="540" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="386" y1="108" x2="386" y2="540" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="550" y1="108" x2="550" y2="540" stroke="#c4b8e8" stroke-width="1" stroke-dasharray="4,5" opacity="0.6"/>
  <line x1="714" y1="108" x2="714" y2="540" stroke="#c4b8e8" stroke-width="1" stroke-dasharray="4,5" opacity="0.5"/>
  <line x1="878" y1="108" x2="878" y2="540" stroke="#c4b8e8" stroke-width="1" stroke-dasharray="4,5" opacity="0.4"/>

  <!-- PATH A: Carrier webhook normalization -->
  <rect x="14" y="118" width="932" height="16" rx="4" fill="#2f9d74" opacity="0.13"/>
  <text x="480" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">PATH A — Carrier Webhook Normalization → Kafka (FedEx / UPS webhook, USPS polling)</text>

  <line x1="386" y1="148" x2="232" y2="148" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="309" y="142" text-anchor="middle" font-size="10" fill="#d97843">FedEx POST webhook: "PD" event code</text>

  <rect x="180" y="154" width="84" height="20" rx="5" fill="#2f9d74"/>
  <text x="222" y="168" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">normalize → out_for_delivery</text>

  <line x1="222" y1="182" x2="386" y2="182" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="304" y="176" text-anchor="middle" font-size="10" fill="#1a1822">Kafka: TrackingEvent {trackingId, out_for_delivery}</text>

  <!-- PATH B: State machine transition -->
  <rect x="14" y="200" width="932" height="16" rx="4" fill="#6d5bd0" opacity="0.12"/>
  <text x="480" y="212" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">PATH B — Order State Machine Transition → Redis cache + SSE push</text>

  <line x1="386" y1="230" x2="232" y2="230" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="309" y="224" text-anchor="middle" font-size="10" fill="#1a1822">Kafka consumer: IN_TRANSIT → OUT_FOR_DELIVERY</text>

  <rect x="180" y="236" width="84" height="20" rx="5" fill="#6d5bd0"/>
  <text x="222" y="250" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">DB + Redis update</text>

  <line x1="222" y1="264" x2="540" y2="264" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="381" y="258" text-anchor="middle" font-size="10" fill="#2f9d74">Kafka: OrderStatusChanged {orderId, OUT_FOR_DELIVERY}</text>

  <line x1="550" y1="278" x2="75" y2="278" stroke="#2f9d74" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <text x="313" y="272" text-anchor="middle" font-size="10" fill="#2f9d74">SSE + email push notification (within 5s)</text>

  <!-- PATH C: GET tracking timeline -->
  <rect x="14" y="296" width="932" height="16" rx="4" fill="#1a1822" opacity="0.08"/>
  <text x="480" y="308" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1822">PATH C — Customer Tracking Page (Redis cache, &lt;10ms reads)</text>

  <line x1="65" y1="326" x2="212" y2="326" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="138" y="320" text-anchor="middle" font-size="10" fill="#1a1822">GET /api/orders/{id}/tracking</text>

  <line x1="222" y1="338" x2="222" y2="346" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="180" y="346" width="84" height="20" rx="5" fill="#2f9d74"/>
  <text x="222" y="360" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">HGET orders:{id} ~3ms</text>

  <line x1="212" y1="374" x2="75" y2="374" stroke="#2f9d74" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <text x="143" y="368" text-anchor="middle" font-size="10" fill="#2f9d74">Timeline: steps + carrier map embed</text>

  <!-- PATH D: Returns flow -->
  <rect x="14" y="390" width="932" height="16" rx="4" fill="#d97843" opacity="0.13"/>
  <text x="480" y="402" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">PATH D — Returns Initiation → Label Generation → Refund (idempotent)</text>

  <line x1="65" y1="420" x2="704" y2="420" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="385" y="414" text-anchor="middle" font-size="10" fill="#1a1822">POST /api/returns {orderId, items, reason, preference:refund}</text>

  <rect x="672" y="426" width="84" height="20" rx="5" fill="#d97843"/>
  <text x="714" y="440" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">eligibility check ✓</text>

  <line x1="714" y1="454" x2="714" y2="462" stroke="#d97843" stroke-width="1.5"/>
  <rect x="672" y="462" width="84" height="20" rx="5" fill="#d97843"/>
  <text x="714" y="476" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">label → S3 PDF</text>

  <line x1="704" y1="490" x2="75" y2="490" stroke="#d97843" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="390" y="484" text-anchor="middle" font-size="10" fill="#d97843">email presigned PDF URL (7-day expiry)</text>

  <!-- PATH E: Refund idempotency -->
  <line x1="714" y1="506" x2="868" y2="506" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="791" y="500" text-anchor="middle" font-size="10" fill="#c0392b">refund(idempotencyKey=returnId+attempt)</text>

  <line x1="868" y1="520" x2="724" y2="520" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="796" y="514" text-anchor="middle" font-size="10" fill="#2f9d74">refund.created webhook → PROCESSED</text>

  <!-- State Machine -->
  <rect x="14" y="540" width="932" height="16" rx="4" fill="#6d5bd0" opacity="0.10"/>
  <text x="480" y="552" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">ORDER STATE MACHINE + EXCEPTION DETECTION (4h cron)</text>

  <rect x="20" y="564" width="126" height="56" rx="6" fill="#fff" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="83" y="579" text-anchor="middle" font-size="9" font-weight="bold" fill="#6d5bd0">ORDER_PLACED</text>
  <text x="83" y="593" text-anchor="middle" font-size="9" fill="#1a1822">→ PAYMENT_CONFIRMED</text>
  <text x="83" y="607" text-anchor="middle" font-size="9" fill="#1a1822">on payment webhook</text>

  <rect x="160" y="564" width="126" height="56" rx="6" fill="#fff" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="223" y="579" text-anchor="middle" font-size="9" font-weight="bold" fill="#6d5bd0">SHIPPED</text>
  <text x="223" y="593" text-anchor="middle" font-size="9" fill="#1a1822">→ IN_TRANSIT</text>
  <text x="223" y="607" text-anchor="middle" font-size="9" fill="#1a1822">on picked_up event</text>

  <rect x="300" y="564" width="126" height="56" rx="6" fill="#fff" stroke="#2f9d74" stroke-width="1.5"/>
  <text x="363" y="579" text-anchor="middle" font-size="9" font-weight="bold" fill="#2f9d74">OUT_FOR_DELIVERY</text>
  <text x="363" y="593" text-anchor="middle" font-size="9" fill="#1a1822">carrier map embed</text>
  <text x="363" y="607" text-anchor="middle" font-size="9" fill="#2f9d74">→ DELIVERED on scan</text>

  <rect x="440" y="564" width="126" height="56" rx="6" fill="#fff" stroke="#2f9d74" stroke-width="1.5"/>
  <text x="503" y="579" text-anchor="middle" font-size="9" font-weight="bold" fill="#2f9d74">DELIVERED</text>
  <text x="503" y="593" text-anchor="middle" font-size="9" fill="#1a1822">return window opens</text>
  <text x="503" y="607" text-anchor="middle" font-size="9" fill="#2f9d74">"Return or Replace" CTA</text>

  <rect x="580" y="564" width="126" height="56" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="643" y="579" text-anchor="middle" font-size="9" font-weight="bold" fill="#c0392b">EXCEPTION</text>
  <text x="643" y="593" text-anchor="middle" font-size="9" fill="#1a1822">no scan 5 biz days</text>
  <text x="643" y="607" text-anchor="middle" font-size="9" fill="#c0392b">reship or refund CTA</text>

  <rect x="720" y="564" width="226" height="56" rx="6" fill="#fff" stroke="#1a1822" stroke-width="1.5"/>
  <text x="833" y="579" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a1822">Lost Shipment Cron (4h)</text>
  <text x="833" y="593" text-anchor="middle" font-size="9" fill="#1a1822">last_scan_at + 5 biz days &lt; now</text>
  <text x="833" y="607" text-anchor="middle" font-size="9" fill="#d97843">→ EXCEPTION + proactive email</text>
</svg>
