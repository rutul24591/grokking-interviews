<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="960" height="640" fill="#f3f1f8"/>
  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Dynamic Pricing UI — WebSocket Fan-out, Flash Sale, Price History</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#d97843"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="14" y="50" width="932" height="16" rx="4" fill="#6d5bd0" opacity="0.14"/>
  <text x="20" y="62" font-size="10" font-weight="bold" fill="#6d5bd0">ACTORS</text>

  <rect x="20" y="72" width="96" height="36" rx="7" fill="#6d5bd0"/>
  <text x="68" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Browser</text>
  <text x="68" y="102" text-anchor="middle" font-size="10" fill="#edeaf5">IntersectionObs</text>

  <rect x="184" y="72" width="100" height="36" rx="7" fill="#6d5bd0"/>
  <text x="234" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">WS Server</text>
  <text x="234" y="102" text-anchor="middle" font-size="10" fill="#edeaf5">Fan-out cluster</text>

  <rect x="356" y="72" width="100" height="36" rx="7" fill="#2f9d74"/>
  <text x="406" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Redis Pub/Sub</text>
  <text x="406" y="102" text-anchor="middle" font-size="10" fill="#e8f5f0">price:{skuId}</text>

  <rect x="528" y="72" width="100" height="36" rx="7" fill="#2f9d74"/>
  <text x="578" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Kafka Consumer</text>
  <text x="578" y="102" text-anchor="middle" font-size="10" fill="#e8f5f0">PriceChanged topic</text>

  <rect x="700" y="72" width="100" height="36" rx="7" fill="#d97843"/>
  <text x="750" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Pricing Engine</text>
  <text x="750" y="102" text-anchor="middle" font-size="10" fill="#fff5ee">Demand / ML</text>

  <rect x="864" y="72" width="80" height="36" rx="7" fill="#1a1822"/>
  <text x="904" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">ClickHouse</text>
  <text x="904" y="102" text-anchor="middle" font-size="10" fill="#d7d1e6">price_history</text>

  <!-- Lifelines -->
  <line x1="68" y1="108" x2="68" y2="510" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="234" y1="108" x2="234" y2="510" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="406" y1="108" x2="406" y2="510" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="578" y1="108" x2="578" y2="510" stroke="#c4b8e8" stroke-width="1" stroke-dasharray="4,5" opacity="0.6"/>
  <line x1="750" y1="108" x2="750" y2="510" stroke="#c4b8e8" stroke-width="1" stroke-dasharray="4,5" opacity="0.5"/>
  <line x1="904" y1="108" x2="904" y2="510" stroke="#c4b8e8" stroke-width="1" stroke-dasharray="4,5" opacity="0.4"/>

  <!-- PATH A: Price change fan-out -->
  <rect x="14" y="118" width="932" height="16" rx="4" fill="#d97843" opacity="0.13"/>
  <text x="480" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">PATH A — Price Change Fan-out (500K+ clients within 5s)</text>

  <line x1="750" y1="148" x2="568" y2="148" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="659" y="142" text-anchor="middle" font-size="10" fill="#d97843">Kafka: PriceChanged {skuId, newPrice}</text>

  <line x1="568" y1="162" x2="416" y2="162" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="492" y="156" text-anchor="middle" font-size="10" fill="#1a1822">PUBLISH price:{skuId} {newPrice:49.99}</text>

  <line x1="406" y1="176" x2="244" y2="176" stroke="#2f9d74" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <text x="325" y="170" text-anchor="middle" font-size="10" fill="#2f9d74">Redis delivers to all WS server instances (1 msg each)</text>

  <line x1="224" y1="192" x2="78" y2="192" stroke="#2f9d74" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <text x="151" y="186" text-anchor="middle" font-size="10" fill="#2f9d74">fan-out to ~10K local connections per server</text>

  <rect x="28" y="200" width="130" height="20" rx="5" fill="#2f9d74"/>
  <text x="93" y="214" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Price animates: $59→$49 ✓</text>

  <!-- PATH B: WS subscription lifecycle -->
  <rect x="14" y="228" width="932" height="16" rx="4" fill="#6d5bd0" opacity="0.12"/>
  <text x="480" y="240" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">PATH B — Client Subscription Lifecycle (IntersectionObserver-driven)</text>

  <line x1="68" y1="258" x2="224" y2="258" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="146" y="252" text-anchor="middle" font-size="10" fill="#1a1822">product scrolls into viewport → subscribe price:sku123</text>

  <rect x="192" y="264" width="84" height="20" rx="5" fill="#6d5bd0"/>
  <text x="234" y="278" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Channel added</text>

  <line x1="68" y1="294" x2="224" y2="294" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="146" y="288" text-anchor="middle" font-size="10" fill="#d97843">product scrolls out → unsubscribe price:sku123</text>

  <rect x="192" y="300" width="84" height="20" rx="5" fill="#d97843"/>
  <text x="234" y="314" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Channel freed</text>

  <!-- PATH C: Flash sale countdown -->
  <rect x="14" y="330" width="932" height="16" rx="4" fill="#c0392b" opacity="0.09"/>
  <text x="480" y="342" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">PATH C — Flash Sale Countdown (server-authoritative timestamp)</text>

  <line x1="578" y1="358" x2="244" y2="358" stroke="#d97843" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="411" y="352" text-anchor="middle" font-size="10" fill="#d97843">PDP API: {saleEndTimestamp: "2026-05-11T15:00:00Z", price: 29.99}</text>

  <line x1="224" y1="372" x2="78" y2="372" stroke="#d97843" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="151" y="366" text-anchor="middle" font-size="10" fill="#d97843">setInterval: remaining = saleEndTimestamp - Date.now()</text>

  <rect x="28" y="380" width="185" height="20" rx="5" fill="#c0392b"/>
  <text x="120" y="394" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Countdown: 01:24:33 remaining</text>

  <line x1="68" y1="408" x2="224" y2="408" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="146" y="402" text-anchor="middle" font-size="10" fill="#6d5bd0">remaining=0 → unmount timer + refetch price</text>

  <!-- PATH D: Price history sparkline -->
  <rect x="14" y="424" width="932" height="16" rx="4" fill="#2f9d74" opacity="0.13"/>
  <text x="480" y="436" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">PATH D — Price History Sparkline (ClickHouse OHLC, ISR-included)</text>

  <line x1="578" y1="452" x2="894" y2="452" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="736" y="446" text-anchor="middle" font-size="10" fill="#1a1822">SELECT hourly OHLC 30d WHERE sku_id=X</text>

  <line x1="894" y1="466" x2="588" y2="466" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="741" y="460" text-anchor="middle" font-size="10" fill="#2f9d74">720 data points ~40ms (columnar scan)</text>

  <line x1="568" y1="480" x2="78" y2="480" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="323" y="474" text-anchor="middle" font-size="10" fill="#2f9d74">SVG polyline sparkline in ISR page (no JS chart lib)</text>

  <!-- Metrics Panel -->
  <rect x="14" y="500" width="932" height="16" rx="4" fill="#1a1822" opacity="0.07"/>
  <text x="480" y="512" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1822">KEY DESIGN DECISIONS</text>

  <rect x="20" y="524" width="205" height="56" rx="6" fill="#fff" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="122" y="540" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Fan-out Architecture</text>
  <text x="122" y="554" text-anchor="middle" font-size="10" fill="#1a1822">1 Kafka msg → 1 Redis PUBLISH</text>
  <text x="122" y="568" text-anchor="middle" font-size="10" fill="#1a1822">→ N WS servers each fan-out locally</text>
  <text x="122" y="581" text-anchor="middle" font-size="10" fill="#2f9d74">O(1) per server, O(N) total</text>

  <rect x="240" y="524" width="205" height="56" rx="6" fill="#fff" stroke="#2f9d74" stroke-width="1.5"/>
  <text x="342" y="540" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Active Subscriptions</text>
  <text x="342" y="554" text-anchor="middle" font-size="10" fill="#1a1822">IntersectionObserver: only</text>
  <text x="342" y="568" text-anchor="middle" font-size="10" fill="#1a1822">visible 10-15 products subscribed</text>
  <text x="342" y="581" text-anchor="middle" font-size="10" fill="#2f9d74">bounded regardless of scroll depth</text>

  <rect x="460" y="524" width="205" height="56" rx="6" fill="#fff" stroke="#d97843" stroke-width="1.5"/>
  <text x="562" y="540" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Staleness Guard</text>
  <text x="562" y="554" text-anchor="middle" font-size="10" fill="#1a1822">lastFetchedAt &gt; 5 min</text>
  <text x="562" y="568" text-anchor="middle" font-size="10" fill="#1a1822">→ re-fetch before add-to-cart</text>
  <text x="562" y="581" text-anchor="middle" font-size="10" fill="#d97843">price-changed dialog if mismatch</text>

  <rect x="680" y="524" width="266" height="56" rx="6" fill="#fff" stroke="#1a1822" stroke-width="1.5"/>
  <text x="813" y="540" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1822">Personalized Price</text>
  <text x="813" y="554" text-anchor="middle" font-size="10" fill="#1a1822">ISR shell: base price placeholder</text>
  <text x="813" y="568" text-anchor="middle" font-size="10" fill="#1a1822">useEffect: POST /api/prices/personalized</text>
  <text x="813" y="581" text-anchor="middle" font-size="10" fill="#c0392b">Zustand only — no URL / localStorage</text>
</svg>
