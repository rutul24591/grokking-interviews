<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f3f1f8"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">UPI / Wallet Payment Flow — India Scale</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- 5 actors -->
  <rect x="20" y="65" width="110" height="40" rx="8" fill="#6d5bd0"/>
  <text x="75" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Payer App</text>
  <text x="75" y="98" text-anchor="middle" font-size="10" fill="#edeaf5">UPI intent / PIN</text>

  <rect x="198" y="65" width="115" height="40" rx="8" fill="#2563eb"/>
  <text x="255" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Payer Bank</text>
  <text x="255" y="98" text-anchor="middle" font-size="10" fill="#dbeafe">UPI SDK + debit</text>

  <rect x="388" y="65" width="115" height="40" rx="8" fill="#2f9d74"/>
  <text x="445" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">NPCI Switch</text>
  <text x="445" y="98" text-anchor="middle" font-size="10" fill="#d1fae5">routes + reversal</text>

  <rect x="578" y="65" width="115" height="40" rx="8" fill="#d97843"/>
  <text x="635" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Payee Bank</text>
  <text x="635" y="98" text-anchor="middle" font-size="10" fill="#fef3c7">credit + confirm</text>

  <rect x="768" y="65" width="112" height="40" rx="8" fill="#be123c"/>
  <text x="824" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Merchant Backend</text>
  <text x="824" y="98" text-anchor="middle" font-size="10" fill="#fecdd3">wallet ledger</text>

  <!-- Lifelines -->
  <line x1="75"  y1="105" x2="75"  y2="490" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="255" y1="105" x2="255" y2="490" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="445" y1="105" x2="445" y2="490" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="635" y1="105" x2="635" y2="490" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="824" y1="105" x2="824" y2="490" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- SECTION 1: UPI Intent + VPA Resolution -->
  <rect x="8" y="118" width="884" height="14" rx="3" fill="#6d5bd0" opacity="0.15"/>
  <text x="450" y="129" text-anchor="middle" font-size="9" font-weight="bold" fill="#4c1d95">1 · UPI INTENT + VPA — upi://pay?pa=merchant@bank&amp;am=500 deep-link; VPA resolution → NPCI lookup (name + masked account); rate-limited 5/min</text>

  <line x1="75" y1="150" x2="240" y2="150" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="144" text-anchor="middle" font-size="9" fill="#374151">deep-link opens payer UPI app with pre-filled amount</text>

  <line x1="240" y1="164" x2="430" y2="164" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="335" y="158" text-anchor="middle" font-size="9" fill="#374151">VPA lookup: POST NPCI API → {name, maskedAccount}</text>

  <line x1="430" y1="178" x2="90" y2="178" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="260" y="172" text-anchor="middle" font-size="9" fill="#374151">show: "Paying to: Ravi Kumar (HDFC Bank)" → user confirms</text>

  <!-- SECTION 2: UPI PIN + NPCI Routing -->
  <rect x="8" y="196" width="884" height="14" rx="3" fill="#2f9d74" opacity="0.18"/>
  <text x="450" y="207" text-anchor="middle" font-size="9" font-weight="bold" fill="#065f46">2 · PIN + NPCI ROUTING — bank's secure keyboard SDK (PIN never reaches app); payer bank debits; NPCI routes to payee bank</text>

  <line x1="75" y1="226" x2="240" y2="226" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="220" text-anchor="middle" font-size="9" fill="#374151">secure keyboard overlay → encrypted PIN to bank</text>

  <line x1="240" y1="240" x2="430" y2="240" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="335" y="234" text-anchor="middle" font-size="9" fill="#374151">payer bank debit → NPCI switch routes txn</text>

  <line x1="430" y1="254" x2="620" y2="254" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="525" y="248" text-anchor="middle" font-size="9" fill="#374151">NPCI → payee bank credit → SUCCESS callback</text>

  <!-- Status box -->
  <rect x="400" y="264" width="380" height="24" rx="6" fill="#fff" stroke="#2f9d74" stroke-width="1"/>
  <text x="590" y="280" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a1822">PENDING ≠ SUCCESS — wait for NPCI callback; auto-reversed at 30min by NPCI</text>

  <!-- SECTION 3: Merchant Callback + Wallet Ledger -->
  <rect x="8" y="298" width="884" height="14" rx="3" fill="#d97843" opacity="0.18"/>
  <text x="450" y="309" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">3 · MERCHANT + WALLET — NPCI callback to merchant; wallet double-entry ledger; optimistic lock (UPDATE WHERE balance &gt;= debit)</text>

  <line x1="620" y1="328" x2="809" y2="328" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="714" y="322" text-anchor="middle" font-size="9" fill="#374151">NPCI callback: {txnRef, amount, status: SUCCESS}</text>

  <line x1="809" y1="342" x2="240" y2="342" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="524" y="336" text-anchor="middle" font-size="9" fill="#374151">idempotent order create (unique txnRef constraint)</text>

  <!-- Wallet ledger box -->
  <rect x="20" y="352" width="370" height="32" rx="6" fill="#fff" stroke="#d97843" stroke-width="1"/>
  <text x="205" y="367" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a1822">Wallet: double-entry ledger; Redis materialized balance cache</text>
  <text x="205" y="382" text-anchor="middle" font-size="9" fill="#374151">UPDATE wallet SET balance = balance - ? WHERE balance &gt;= ? (optimistic lock)</text>

  <!-- SECTION 4: Scale + Circuit Breaker -->
  <rect x="8" y="394" width="884" height="14" rx="3" fill="#be123c" opacity="0.12"/>
  <text x="450" y="405" text-anchor="middle" font-size="9" font-weight="bold" fill="#9f1239">4 · SCALE — 50K–80K TPS peak; sharded DB by userId; Kafka fan-out; circuit breaker per bank (50% errors → open 30s)</text>

  <line x1="809" y1="424" x2="430" y2="424" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="619" y="418" text-anchor="middle" font-size="9" fill="#374151">Kafka: payment_confirmed → order, fraud, analytics (async)</text>

  <line x1="240" y1="438" x2="90" y2="438" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="157" y="432" text-anchor="middle" font-size="9" fill="#374151">circuit open: "HDFC temporarily unavailable"</text>

  <!-- Footer -->
  <rect x="8" y="456" width="884" height="36" rx="6" fill="#1a1822"/>
  <text x="90" y="472" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">Peak TPS</text>
  <text x="90" y="486" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">50K–80K</text>
  <text x="255" y="472" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Auto-Reversal</text>
  <text x="255" y="486" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">30 min NPCI</text>
  <text x="450" y="472" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">VPA Rate Limit</text>
  <text x="450" y="486" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">5 / min / device</text>
  <text x="645" y="472" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">KYC Daily Limit</text>
  <text x="645" y="486" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">₹1L (min) / ₹2L (full)</text>
  <text x="820" y="472" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Circuit Breaker</text>
  <text x="820" y="486" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">50% err / 30s</text>
</svg>
