<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" role="img" aria-label="Payment Gateway Integration UI: cross-plane flow">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#0f766e"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#c2410c"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#be123c"/></marker>
  </defs>
  <rect x="18" y="18" width="924" height="524" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="54" y="56" font-size="18" font-weight="700" fill="#172033">Payment Gateway Integration UI: cross-plane flow</text>
  <text x="54" y="78" font-size="11.5" fill="#526074">User-visible state crosses client, durable, async, and rollback planes explicitly.</text>
  <rect x="48" y="108" width="864" height="102" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1"/>
  <text x="68" y="131" font-size="12.5" font-weight="700" fill="#2563eb">CLIENT AND EDGE</text><rect x="82" y="146" width="146" height="48" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="96" y="171" font-size="12" font-weight="700" fill="#172033">checkout intent</text><rect x="316" y="146" width="146" height="48" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="330" y="171" font-size="12" font-weight="700" fill="#172033">inventory / risk</text><line x1="228" y1="170" x2="308" y2="170" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/><rect x="48" y="228" width="864" height="102" rx="9" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.1"/>
  <text x="68" y="251" font-size="12.5" font-weight="700" fill="#0f766e">DOMAIN AND DURABLE STATE</text><rect x="232" y="266" width="146" height="48" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
  <text x="246" y="291" font-size="12" font-weight="700" fill="#172033">payment provider</text><rect x="524" y="266" width="146" height="48" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="538" y="291" font-size="12" font-weight="700" fill="#172033">ledger commit</text><line x1="378" y1="290" x2="516" y2="290" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arrow-teal)"/><rect x="48" y="348" width="864" height="116" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="1.1"/>
  <text x="68" y="371" font-size="12.5" font-weight="700" fill="#c2410c">ASYNC PROJECTION AND RECOVERY</text><rect x="362" y="390" width="146" height="48" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="376" y="415" font-size="12" font-weight="700" fill="#172033">reconcile webhook</text><rect x="702" y="390" width="146" height="48" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="716" y="415" font-size="12" font-weight="700" fill="#172033">receipt state</text><line x1="508" y1="414" x2="694" y2="414" stroke="#c2410c" stroke-width="2.4" marker-end="url(#arrow-orange)"/><line x1="390" y1="194" x2="294" y2="258" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/><line x1="598" y1="314" x2="438" y2="382" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arrow-teal)"/><path d="M776 390 C850 332, 850 200, 470 170" fill="none" stroke="#be123c" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-rose)"/>
  <text x="684" y="346" font-size="10.5" font-weight="700" fill="#be123c">rollback / repair</text>
</svg>
