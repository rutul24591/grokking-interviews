<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arr-o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#fff8f8" rx="12"/>
  <rect width="900" height="48" fill="url(#hdr)" rx="12"/>
  <rect y="36" width="900" height="12" fill="url(#hdr)"/>
  <text x="450" y="30" text-anchor="middle" fill="white" font-size="16" font-weight="700">Alerting &amp; Anomaly Detection Dashboard</text>

  <!-- ── ROW 1: Alert State Machine ── -->
  <text x="24" y="76" fill="#991b1b" font-size="11" font-weight="700">① ALERT STATE MACHINE (30s EVALUATION CYCLE)</text>

  <!-- States flow -->
  <rect x="20" y="84" width="840" height="82" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>

  <rect x="38" y="98" width="110" height="52" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1"/>
  <text x="93" y="119" text-anchor="middle" fill="#991b1b" font-size="10" font-weight="600">Query</text>
  <text x="93" y="133" text-anchor="middle" fill="#374151" font-size="8">PromQL / SQL</text>
  <text x="93" y="146" text-anchor="middle" fill="#374151" font-size="8">every 30s</text>

  <line x1="150" y1="124" x2="185" y2="124" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="167" y="117" text-anchor="middle" fill="#991b1b" font-size="7">breach?</text>

  <rect x="187" y="98" width="110" height="52" rx="6" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
  <text x="242" y="119" text-anchor="middle" fill="#92400e" font-size="10" font-weight="600">Pending</text>
  <text x="242" y="133" text-anchor="middle" fill="#374151" font-size="8">violation_count++</text>
  <text x="242" y="146" text-anchor="middle" fill="#374151" font-size="8">not yet 2 cycles</text>

  <line x1="299" y1="124" x2="334" y2="124" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="316" y="117" text-anchor="middle" fill="#92400e" font-size="7">2nd cycle</text>

  <rect x="336" y="98" width="110" height="52" rx="6" fill="#fca5a5" stroke="#dc2626" stroke-width="1.5"/>
  <text x="391" y="119" text-anchor="middle" fill="#991b1b" font-size="10" font-weight="600">Firing 🔴</text>
  <text x="391" y="133" text-anchor="middle" fill="#374151" font-size="8">publish Kafka event</text>
  <text x="391" y="146" text-anchor="middle" fill="#374151" font-size="8">persist PostgreSQL</text>

  <line x1="448" y1="124" x2="483" y2="124" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="465" y="117" text-anchor="middle" fill="#991b1b" font-size="7">ack</text>

  <rect x="485" y="98" width="110" height="52" rx="6" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
  <text x="540" y="119" text-anchor="middle" fill="#92400e" font-size="10" font-weight="600">Acknowledged</text>
  <text x="540" y="133" text-anchor="middle" fill="#374151" font-size="8">ackBy, ackAt</text>
  <text x="540" y="146" text-anchor="middle" fill="#374151" font-size="8">still tracking</text>

  <line x1="597" y1="124" x2="632" y2="124" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="614" y="117" text-anchor="middle" fill="#059669" font-size="7">resolved</text>

  <rect x="634" y="98" width="110" height="52" rx="6" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="689" y="119" text-anchor="middle" fill="#059669" font-size="10" font-weight="600">Resolved ✓</text>
  <text x="689" y="133" text-anchor="middle" fill="#374151" font-size="8">MTTR computed</text>
  <text x="689" y="146" text-anchor="middle" fill="#374151" font-size="8">resolvedAt stored</text>

  <rect x="762" y="98" width="80" height="52" rx="6" fill="#e0e7ff" stroke="#6366f1" stroke-width="1"/>
  <text x="802" y="114" text-anchor="middle" fill="#4f46e5" font-size="9" font-weight="600">Silenced</text>
  <text x="802" y="128" text-anchor="middle" fill="#374151" font-size="8">POST /silences</text>
  <text x="802" y="141" text-anchor="middle" fill="#374151" font-size="8">maintenance</text>
  <text x="802" y="152" text-anchor="middle" fill="#374151" font-size="8">window</text>

  <!-- ── ROW 2: Anomaly Detection + Routing ── -->
  <line x1="20" y1="182" x2="880" y2="182" stroke="#e5e7eb" stroke-width="1"/>
  <text x="24" y="202" fill="#b45309" font-size="11" font-weight="700">② ANOMALY DETECTION</text>
  <text x="460" y="202" fill="#059669" font-size="11" font-weight="700">③ NOTIFICATION ROUTING</text>

  <rect x="20" y="210" width="400" height="102" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>

  <rect x="36" y="224" width="114" height="74" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="93" y="240" text-anchor="middle" fill="#92400e" font-size="9" font-weight="600">Z-score</text>
  <text x="93" y="254" text-anchor="middle" fill="#374151" font-size="8">rolling 7d same time-of-day</text>
  <text x="93" y="266" text-anchor="middle" fill="#374151" font-size="8">z = (v - mean) / std</text>
  <text x="93" y="278" text-anchor="middle" fill="#374151" font-size="8">|z| &gt; 3 → anomaly</text>
  <text x="93" y="290" text-anchor="middle" fill="#374151" font-size="8">Welford online update</text>

  <rect x="162" y="224" width="114" height="74" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="219" y="240" text-anchor="middle" fill="#92400e" font-size="9" font-weight="600">STL Seasonal</text>
  <text x="219" y="254" text-anchor="middle" fill="#374151" font-size="8">decompose weekly/daily</text>
  <text x="219" y="266" text-anchor="middle" fill="#374151" font-size="8">seasonality (LOESS)</text>
  <text x="219" y="278" text-anchor="middle" fill="#374151" font-size="8">alert on residuals</text>
  <text x="219" y="290" text-anchor="middle" fill="#374151" font-size="8">nightly batch model</text>

  <rect x="288" y="224" width="114" height="74" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="345" y="240" text-anchor="middle" fill="#92400e" font-size="9" font-weight="600">Isolation Forest</text>
  <text x="345" y="254" text-anchor="middle" fill="#374151" font-size="8">train on 30d history</text>
  <text x="345" y="266" text-anchor="middle" fill="#374151" font-size="8">score current point</text>
  <text x="345" y="278" text-anchor="middle" fill="#374151" font-size="8">score &gt; 0.7 → anomaly</text>
  <text x="345" y="290" text-anchor="middle" fill="#374151" font-size="8">retrain weekly</text>

  <rect x="450" y="210" width="420" height="102" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="660" y="232" text-anchor="middle" fill="#374151" font-size="9">Kafka alerts.events consumer → read severity + service labels</text>

  <rect x="465" y="242" width="114" height="56" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <text x="522" y="260" text-anchor="middle" fill="#dc2626" font-size="9" font-weight="600">Critical</text>
  <text x="522" y="274" text-anchor="middle" fill="#374151" font-size="8">PagerDuty</text>
  <text x="522" y="288" text-anchor="middle" fill="#374151" font-size="8">POST /incidents</text>

  <rect x="592" y="242" width="114" height="56" rx="6" fill="#fef9c3" stroke="#f59e0b" stroke-width="1"/>
  <text x="649" y="260" text-anchor="middle" fill="#92400e" font-size="9" font-weight="600">Warning</text>
  <text x="649" y="274" text-anchor="middle" fill="#374151" font-size="8">Slack webhook</text>
  <text x="649" y="288" text-anchor="middle" fill="#374151" font-size="8">#service-oncall</text>

  <rect x="720" y="242" width="136" height="56" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="788" y="260" text-anchor="middle" fill="#1d4ed8" font-size="9" font-weight="600">On-call Schedule</text>
  <text x="788" y="274" text-anchor="middle" fill="#374151" font-size="8">PagerDuty /oncall API</text>
  <text x="788" y="288" text-anchor="middle" fill="#374151" font-size="8">escalate: no ack 15min</text>

  <!-- ── ROW 3: Grouping + MTTR ── -->
  <line x1="20" y1="328" x2="880" y2="328" stroke="#e5e7eb" stroke-width="1"/>
  <text x="24" y="348" fill="#4f46e5" font-size="11" font-weight="700">④ ALERT GROUPING + INHIBITION</text>
  <text x="470" y="348" fill="#374151" font-size="11" font-weight="700">⑤ NOISE REDUCTION (MTTR)</text>

  <rect x="20" y="356" width="410" height="72" rx="8" fill="#f0f0ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="225" y="376" text-anchor="middle" fill="#374151" font-size="9">group_wait 30s → bundle related alerts → 1 Slack message</text>
  <text x="225" y="390" text-anchor="middle" fill="#374151" font-size="9">"20 alerts: auth payments orders [+17 more]"</text>
  <text x="225" y="404" text-anchor="middle" fill="#374151" font-size="9">Inhibition: database_down → suppress downstream service alerts</text>
  <text x="225" y="418" text-anchor="middle" fill="#374151" font-size="9">equal:[region, cluster] → only same region/cluster inhibited</text>

  <rect x="460" y="356" width="410" height="72" rx="8" fill="#f8faff" stroke="#374151" stroke-width="1.5"/>
  <text x="665" y="376" text-anchor="middle" fill="#374151" font-size="9">MTTR = avg(resolvedAt - firedAt) per service · rolling 30d</text>
  <text x="665" y="390" text-anchor="middle" fill="#374151" font-size="9">false-positive rate = firings resolved &lt;5min / total firings</text>
  <text x="665" y="404" text-anchor="middle" fill="#374151" font-size="9">replay: apply rule to last 7d → count historical fires</text>
  <text x="665" y="418" text-anchor="middle" fill="#374151" font-size="9">alert budget: max pages/week per team → fix or mute</text>

  <!-- Metrics bar -->
  <rect x="14" y="448" width="872" height="98" rx="8" fill="#1a0505"/>
  <text x="14" y="444" fill="#fca5a5" font-size="10" font-weight="600">KEY NUMBERS</text>

  <text x="90" y="472" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">Fire Latency</text>
  <text x="90" y="490" text-anchor="middle" fill="white" font-size="14" font-weight="700">&lt;1 min</text>
  <text x="90" y="506" text-anchor="middle" fill="#94a3b8" font-size="9">2 × 30s cycles</text>
  <text x="90" y="522" text-anchor="middle" fill="#6b7280" font-size="8">prevents transient spikes</text>
  <text x="90" y="536" text-anchor="middle" fill="#6b7280" font-size="8">2-cycle confirmation</text>

  <text x="260" y="472" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="600">PagerDuty</text>
  <text x="260" y="490" text-anchor="middle" fill="white" font-size="14" font-weight="700">&lt;30s</text>
  <text x="260" y="506" text-anchor="middle" fill="#94a3b8" font-size="9">from Firing state</text>
  <text x="260" y="522" text-anchor="middle" fill="#6b7280" font-size="8">escalate no-ack 15min</text>
  <text x="260" y="536" text-anchor="middle" fill="#6b7280" font-size="8">dedup: 1 page per anomaly</text>

  <text x="450" y="472" text-anchor="middle" fill="#fdba74" font-size="10" font-weight="600">Z-score Threshold</text>
  <text x="450" y="490" text-anchor="middle" fill="white" font-size="14" font-weight="700">|z| &gt; 3σ</text>
  <text x="450" y="506" text-anchor="middle" fill="#94a3b8" font-size="9">rolling 7d baseline</text>
  <text x="450" y="522" text-anchor="middle" fill="#6b7280" font-size="8">Welford online algorithm</text>
  <text x="450" y="536" text-anchor="middle" fill="#6b7280" font-size="8">anomaly → Slack not PD</text>

  <text x="640" y="472" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">Group Wait</text>
  <text x="640" y="490" text-anchor="middle" fill="white" font-size="14" font-weight="700">30s</text>
  <text x="640" y="506" text-anchor="middle" fill="#94a3b8" font-size="9">accumulate related</text>
  <text x="640" y="522" text-anchor="middle" fill="#6b7280" font-size="8">1 notification group</text>
  <text x="640" y="536" text-anchor="middle" fill="#6b7280" font-size="8">inhibition rules applied</text>

  <text x="810" y="472" text-anchor="middle" fill="#ddd6fe" font-size="10" font-weight="600">MTTR Tracking</text>
  <text x="810" y="490" text-anchor="middle" fill="white" font-size="13" font-weight="700">30-day rolling</text>
  <text x="810" y="506" text-anchor="middle" fill="#94a3b8" font-size="9">per-service + per-rule</text>
  <text x="810" y="522" text-anchor="middle" fill="#6b7280" font-size="8">false-pos rate visible</text>
  <text x="810" y="536" text-anchor="middle" fill="#6b7280" font-size="8">replay validation</text>
</svg>
