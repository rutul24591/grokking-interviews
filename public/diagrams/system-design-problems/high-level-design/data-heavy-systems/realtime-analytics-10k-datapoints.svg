<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0891b2"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arr-o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#f0f8ff" rx="12"/>
  <rect width="900" height="48" fill="url(#hdr)" rx="12"/>
  <rect y="36" width="900" height="12" fill="url(#hdr)"/>
  <text x="450" y="30" text-anchor="middle" fill="white" font-size="16" font-weight="700">Real-Time Analytics — 10,000+ Data Points/sec</text>

  <!-- ── ROW 1: Data path ── -->
  <text x="24" y="76" fill="#0f172a" font-size="11" font-weight="700">① DATA INGESTION → LTTB DOWNSAMPLING → BROWSER</text>

  <rect x="20" y="84" width="130" height="72" rx="8" fill="#f0f9ff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="85" y="103" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="600">Metrics</text>
  <text x="85" y="117" text-anchor="middle" fill="#374151" font-size="9">10K pts/sec/metric</text>
  <text x="85" y="130" text-anchor="middle" fill="#374151" font-size="9">IoT / App servers</text>
  <text x="85" y="143" text-anchor="middle" fill="#374151" font-size="9">Kafka fan-out</text>

  <line x1="152" y1="120" x2="196" y2="120" stroke="#0891b2" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="198" y="84" width="160" height="72" rx="8" fill="#f0fdff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="278" y="103" text-anchor="middle" fill="#0891b2" font-size="11" font-weight="600">InfluxDB / TimescaleDB</text>
  <text x="278" y="117" text-anchor="middle" fill="#374151" font-size="9">Write + persist</text>
  <text x="278" y="130" text-anchor="middle" fill="#374151" font-size="9">simultaneously fan-out</text>
  <text x="278" y="143" text-anchor="middle" fill="#374151" font-size="9">to Streaming Gateway</text>

  <line x1="360" y1="120" x2="404" y2="120" stroke="#0891b2" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="406" y="84" width="190" height="72" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="501" y="103" text-anchor="middle" fill="#7c3aed" font-size="11" font-weight="600">Streaming Gateway</text>
  <text x="501" y="117" text-anchor="middle" fill="#374151" font-size="9">Client subscribes {metricId, timeWindow, pixelWidth:1200}</text>
  <text x="501" y="130" text-anchor="middle" fill="#374151" font-size="9">LTTB: select 1200 pts max-triangle-area</text>
  <text x="501" y="143" text-anchor="middle" fill="#374151" font-size="9">batch per 16.7ms → delta {add:[…], remove_before:t}</text>

  <line x1="598" y1="120" x2="642" y2="120" stroke="#0891b2" stroke-width="2" marker-end="url(#arr)"/>
  <text x="620" y="113" text-anchor="middle" fill="#0891b2" font-size="8">WebSocket</text>

  <rect x="644" y="84" width="230" height="72" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="759" y="103" text-anchor="middle" fill="#d97706" font-size="11" font-weight="600">Browser</text>
  <text x="759" y="117" text-anchor="middle" fill="#374151" font-size="9">apply delta → Float64Array circular buffer</text>
  <text x="759" y="130" text-anchor="middle" fill="#374151" font-size="9">Web Worker: OffscreenCanvas draw</text>
  <text x="759" y="143" text-anchor="middle" fill="#374151" font-size="9">transferToImageBitmap → visible canvas 60fps</text>

  <!-- ── ROW 2: Canvas Rendering ── -->
  <line x1="20" y1="172" x2="880" y2="172" stroke="#e5e7eb" stroke-width="1"/>
  <text x="24" y="192" fill="#7c3aed" font-size="11" font-weight="700">② CANVAS RENDERING PIPELINE</text>

  <rect x="20" y="200" width="250" height="100" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="145" y="220" text-anchor="middle" fill="#7c3aed" font-size="11" font-weight="600">requestAnimationFrame Loop</text>
  <text x="145" y="237" text-anchor="middle" fill="#374151" font-size="9">1. clearRect (OffscreenCanvas)</text>
  <text x="145" y="251" text-anchor="middle" fill="#374151" font-size="9">2. timeToX + valueToY transforms</text>
  <text x="145" y="265" text-anchor="middle" fill="#374151" font-size="9">3. Path2D moveTo/lineTo each point</text>
  <text x="145" y="279" text-anchor="middle" fill="#374151" font-size="9">4. stroke + min-max band fill rgba(0.15)</text>
  <text x="145" y="293" text-anchor="middle" fill="#374151" font-size="9">5. transferToImageBitmap → visible canvas</text>

  <line x1="272" y1="250" x2="316" y2="250" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-p)"/>

  <rect x="318" y="200" width="230" height="100" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="433" y="220" text-anchor="middle" fill="#d97706" font-size="11" font-weight="600">Windowed Aggregation</text>
  <text x="433" y="237" text-anchor="middle" fill="#374151" font-size="9">1s buckets: {min, max, avg} per bucket</text>
  <text x="433" y="251" text-anchor="middle" fill="#374151" font-size="9">5s / 1min coarser granularity</text>
  <text x="433" y="265" text-anchor="middle" fill="#374151" font-size="9">Auto-select by timeWindow ÷ pixelWidth</text>
  <text x="433" y="279" text-anchor="middle" fill="#374151" font-size="9">Zoom &lt;30s window → raw data mode</text>
  <text x="433" y="293" text-anchor="middle" fill="#374151" font-size="9">WebGL upgrade if 10+ metrics/chart</text>

  <line x1="550" y1="250" x2="594" y2="250" stroke="#10b981" stroke-width="2" marker-end="url(#arr-g)"/>

  <rect x="596" y="200" width="278" height="100" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="735" y="220" text-anchor="middle" fill="#059669" font-size="11" font-weight="600">Backpressure + Gap Handling</text>
  <text x="735" y="237" text-anchor="middle" fill="#374151" font-size="9">WS buffer &gt;100 msgs → stop sending</text>
  <text x="735" y="251" text-anchor="middle" fill="#374151" font-size="9">send gap_marker {from:t1, to:t2}</text>
  <text x="735" y="265" text-anchor="middle" fill="#374151" font-size="9">chart renders dashed segment at gap</text>
  <text x="735" y="279" text-anchor="middle" fill="#374151" font-size="9">null points = sensor outage: line break</text>
  <text x="735" y="293" text-anchor="middle" fill="#374151" font-size="9">tab hidden → reduce to 1 msg/sec</text>

  <!-- ── ROW 3: Pause/rewind ── -->
  <line x1="20" y1="316" x2="880" y2="316" stroke="#e5e7eb" stroke-width="1"/>
  <text x="24" y="336" fill="#059669" font-size="11" font-weight="700">③ PAUSE / HISTORICAL REWIND</text>

  <rect x="20" y="344" width="840" height="72" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>

  <rect x="40" y="358" width="130" height="42" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1"/>
  <text x="105" y="376" text-anchor="middle" fill="#059669" font-size="10" font-weight="600">Pause</text>
  <text x="105" y="390" text-anchor="middle" fill="#374151" font-size="8.5">stop WS consumption</text>

  <line x1="172" y1="379" x2="212" y2="379" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="214" y="358" width="180" height="42" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1"/>
  <text x="304" y="376" text-anchor="middle" fill="#059669" font-size="10" font-weight="600">Drag time selection</text>
  <text x="304" y="390" text-anchor="middle" fill="#374151" font-size="8.5">pick historical range</text>

  <line x1="396" y1="379" x2="436" y2="379" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="438" y="358" width="230" height="42" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1"/>
  <text x="553" y="376" text-anchor="middle" fill="#059669" font-size="10" font-weight="600">InfluxDB: LTTB(value, 1200)</text>
  <text x="553" y="390" text-anchor="middle" fill="#374151" font-size="8.5">WHERE time&gt;=start AND time&lt;=end → &lt;500ms</text>

  <line x1="670" y1="379" x2="710" y2="379" stroke="#10b981" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="712" y="358" width="128" height="42" rx="6" fill="#dcfce7" stroke="#10b981" stroke-width="1"/>
  <text x="776" y="376" text-anchor="middle" fill="#059669" font-size="10" font-weight="600">Resume</text>
  <text x="776" y="390" text-anchor="middle" fill="#374151" font-size="8.5">reconnect → snap to live tail</text>

  <!-- Metrics bar -->
  <rect x="14" y="438" width="872" height="102" rx="8" fill="#0c1526"/>
  <text x="14" y="434" fill="#0891b2" font-size="10" font-weight="600">KEY NUMBERS</text>

  <text x="90" y="462" text-anchor="middle" fill="#7dd3fc" font-size="10" font-weight="600">Frame Budget</text>
  <text x="90" y="480" text-anchor="middle" fill="white" font-size="14" font-weight="700">16.7ms</text>
  <text x="90" y="496" text-anchor="middle" fill="#94a3b8" font-size="9">60fps target</text>

  <text x="90" y="516" text-anchor="middle" fill="#93c5fd" font-size="9">Canvas 2D: 1200 pts in 3–5ms</text>
  <text x="90" y="530" text-anchor="middle" fill="#94a3b8" font-size="8">WebGL: 100K pts/frame (GPU)</text>

  <text x="280" y="462" text-anchor="middle" fill="#a5f3fc" font-size="10" font-weight="600">LTTB Output</text>
  <text x="280" y="480" text-anchor="middle" fill="white" font-size="14" font-weight="700">≤pixelWidth pts</text>
  <text x="280" y="496" text-anchor="middle" fill="#94a3b8" font-size="9">never more than pixels</text>
  <text x="280" y="516" text-anchor="middle" fill="#93c5fd" font-size="9">O(N) algorithm server-side</text>
  <text x="280" y="530" text-anchor="middle" fill="#94a3b8" font-size="8">delta: add[] + remove_before:t</text>

  <text x="480" y="462" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">WS Message Rate</text>
  <text x="480" y="480" text-anchor="middle" fill="white" font-size="14" font-weight="700">60 msg/sec max</text>
  <text x="480" y="496" text-anchor="middle" fill="#94a3b8" font-size="9">1 batch per animation frame</text>
  <text x="480" y="516" text-anchor="middle" fill="#93c5fd" font-size="9">backpressure: gap_marker</text>
  <text x="480" y="530" text-anchor="middle" fill="#94a3b8" font-size="8">tab hidden → 1 msg/sec</text>

  <text x="680" y="462" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="600">Historical Fetch</text>
  <text x="680" y="480" text-anchor="middle" fill="white" font-size="14" font-weight="700">&lt;500ms</text>
  <text x="680" y="496" text-anchor="middle" fill="#94a3b8" font-size="9">InfluxDB LTTB query</text>
  <text x="680" y="516" text-anchor="middle" fill="#93c5fd" font-size="9">Float64Array circular buffer</text>
  <text x="680" y="530" text-anchor="middle" fill="#94a3b8" font-size="8">no GC pressure on updates</text>

  <text x="830" y="462" text-anchor="middle" fill="#ddd6fe" font-size="10" font-weight="600">WebGL Upgrade</text>
  <text x="830" y="480" text-anchor="middle" fill="white" font-size="14" font-weight="700">10+ metrics</text>
  <text x="830" y="496" text-anchor="middle" fill="#94a3b8" font-size="9">VBO + GLSL shader</text>
  <text x="830" y="516" text-anchor="middle" fill="#93c5fd" font-size="9">Canvas2D overlay for labels</text>
  <text x="830" y="530" text-anchor="middle" fill="#94a3b8" font-size="8">regl library</text>
</svg>
