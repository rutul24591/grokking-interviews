<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#f4f0ff" rx="12"/>
  <rect width="900" height="48" fill="url(#hdr)" rx="12"/>
  <rect y="36" width="900" height="12" fill="url(#hdr)"/>
  <text x="450" y="30" text-anchor="middle" fill="white" font-size="16" font-weight="700">Large Dataset Exploration UI (Millions of Rows)</text>

  <!-- ── ROW 1: Virtual Grid ── -->
  <text x="24" y="76" fill="#1e3a5f" font-size="11" font-weight="700">① TWO-DIMENSIONAL VIRTUAL GRID</text>

  <rect x="20" y="84" width="840" height="88" rx="8" fill="#eff6ff" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Row virtualisation -->
  <rect x="38" y="98" width="230" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="153" y="116" text-anchor="middle" fill="#1d4ed8" font-size="10" font-weight="600">Row Virtualization</text>
  <text x="153" y="130" text-anchor="middle" fill="#374151" font-size="8.5">render ~(viewportH ÷ 36px) visible rows</text>
  <text x="153" y="143" text-anchor="middle" fill="#374151" font-size="8.5">+ 20-row buffer above + below</text>
  <text x="153" y="156" text-anchor="middle" fill="#374151" font-size="8.5">spacer divs fill virtual scroll height</text>

  <line x1="270" y1="128" x2="310" y2="128" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Col virtualisation -->
  <rect x="312" y="98" width="230" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="427" y="116" text-anchor="middle" fill="#1d4ed8" font-size="10" font-weight="600">Column Virtualization</text>
  <text x="427" y="130" text-anchor="middle" fill="#374151" font-size="8.5">cumSum of colWidths → visible [firstCol,lastCol]</text>
  <text x="427" y="143" text-anchor="middle" fill="#374151" font-size="8.5">left/right filler spacers for off-screen cols</text>
  <text x="427" y="156" text-anchor="middle" fill="#374151" font-size="8.5">pinned cols: separate DOM, always rendered</text>

  <line x1="544" y1="128" x2="584" y2="128" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Result -->
  <rect x="586" y="98" width="256" height="60" rx="6" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1"/>
  <text x="714" y="116" text-anchor="middle" fill="#1e3a5f" font-size="10" font-weight="600">Result</text>
  <text x="714" y="130" text-anchor="middle" fill="#374151" font-size="8.5">~200 DOM cells regardless of dataset size</text>
  <text x="714" y="143" text-anchor="middle" fill="#374151" font-size="8.5">10M rows × 500 cols → 60fps smooth</text>
  <text x="714" y="156" text-anchor="middle" fill="#374151" font-size="8.5">AG Grid infinite row model</text>

  <!-- ── ROW 2: Keyset + Filter ── -->
  <line x1="20" y1="188" x2="880" y2="188" stroke="#e5e7eb" stroke-width="1"/>
  <text x="24" y="208" fill="#2563eb" font-size="11" font-weight="700">② KEYSET CURSOR PAGINATION</text>
  <text x="470" y="208" fill="#7c3aed" font-size="11" font-weight="700">③ PREDICATE FILTER BUILDER</text>

  <rect x="20" y="216" width="410" height="96" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="225" y="236" text-anchor="middle" fill="#374151" font-size="9">cursor = base64({revenue: 50234, id: "uuid-789"})</text>
  <text x="225" y="250" text-anchor="middle" fill="#374151" font-size="9">WHERE (revenue, id) &lt; (cursor.revenue, cursor.id)</text>
  <text x="225" y="264" text-anchor="middle" fill="#374151" font-size="9">ORDER BY revenue DESC, id ASC LIMIT 100</text>
  <text x="225" y="278" text-anchor="middle" fill="#374151" font-size="9">O(log N) index seek — no full prefix scan</text>
  <text x="225" y="292" text-anchor="middle" fill="#374151" font-size="9">vs OFFSET 50000: must scan + discard 50K rows first</text>
  <text x="225" y="306" text-anchor="middle" fill="#374151" font-size="9">bidirectional: reverse sort + comparison for prev page</text>

  <rect x="460" y="216" width="410" height="96" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="665" y="236" text-anchor="middle" fill="#374151" font-size="9">UI: {op:AND, conditions:[{field,op,value}, {op:OR,[…]}]}</text>
  <text x="665" y="250" text-anchor="middle" fill="#374151" font-size="9">serialize → base64 JSON → URL ?filter=… (shareable)</text>
  <text x="665" y="264" text-anchor="middle" fill="#374151" font-size="9">server: recursive walk → parameterized SQL WHERE</text>
  <text x="665" y="278" text-anchor="middle" fill="#374151" font-size="9">NO string interpolation — bound params only</text>
  <text x="665" y="292" text-anchor="middle" fill="#374151" font-size="9">predicate pushdown → partition pruning in Snowflake/BQ</text>
  <text x="665" y="306" text-anchor="middle" fill="#374151" font-size="9">query plan: EXPLAIN output → warn on full-table-scan</text>

  <!-- ── ROW 3: Profiling + Export ── -->
  <line x1="20" y1="328" x2="880" y2="328" stroke="#e5e7eb" stroke-width="1"/>
  <text x="24" y="348" fill="#059669" font-size="11" font-weight="700">④ COLUMN PROFILING</text>
  <text x="470" y="348" fill="#f59e0b" font-size="11" font-weight="700">⑤ EXPORT</text>

  <rect x="20" y="356" width="410" height="72" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="225" y="376" text-anchor="middle" fill="#374151" font-size="9">click header → GET /profile?col=revenue&amp;filters={active}</text>
  <text x="225" y="390" text-anchor="middle" fill="#374151" font-size="9">numeric: min / max / avg / median / p95 / stddev / nullRate</text>
  <text x="225" y="404" text-anchor="middle" fill="#374151" font-size="9">string: cardinality + top-10 values with counts</text>
  <text x="225" y="418" text-anchor="middle" fill="#374151" font-size="9">cache: Redis SHA256(tableId+col+filterHash) TTL=15min</text>

  <rect x="460" y="356" width="410" height="72" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="665" y="376" text-anchor="middle" fill="#374151" font-size="9">Small (&lt;10K rows): stream CSV directly to browser</text>
  <text x="665" y="390" text-anchor="middle" fill="#374151" font-size="9">Large (&gt;100K rows): async job → S3 Parquet multipart</text>
  <text x="665" y="404" text-anchor="middle" fill="#374151" font-size="9">SSE /api/exports/{jobId}/status → percent complete</text>
  <text x="665" y="418" text-anchor="middle" fill="#374151" font-size="9">complete → presigned S3 URL sent via email</text>

  <!-- Metrics bar -->
  <rect x="14" y="448" width="872" height="98" rx="8" fill="#0a0d1e"/>
  <text x="14" y="444" fill="#93c5fd" font-size="10" font-weight="600">KEY NUMBERS</text>

  <text x="88" y="472" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Initial Load</text>
  <text x="88" y="490" text-anchor="middle" fill="white" font-size="14" font-weight="700">&lt;500ms</text>
  <text x="88" y="506" text-anchor="middle" fill="#94a3b8" font-size="9">first 100 rows</text>
  <text x="88" y="522" text-anchor="middle" fill="#6b7280" font-size="8">SSR first page</text>
  <text x="88" y="536" text-anchor="middle" fill="#6b7280" font-size="8">instant paint</text>

  <text x="245" y="472" text-anchor="middle" fill="#bfdbfe" font-size="10" font-weight="600">Scroll Perf</text>
  <text x="245" y="490" text-anchor="middle" fill="white" font-size="14" font-weight="700">60fps</text>
  <text x="245" y="506" text-anchor="middle" fill="#94a3b8" font-size="9">~200 DOM cells max</text>
  <text x="245" y="522" text-anchor="middle" fill="#6b7280" font-size="8">10M rows × 500 cols</text>
  <text x="245" y="536" text-anchor="middle" fill="#6b7280" font-size="8">no layout thrashing</text>

  <text x="420" y="472" text-anchor="middle" fill="#ddd6fe" font-size="10" font-weight="600">Filter Apply</text>
  <text x="420" y="490" text-anchor="middle" fill="white" font-size="14" font-weight="700">&lt;2s</text>
  <text x="420" y="506" text-anchor="middle" fill="#94a3b8" font-size="9">indexed column</text>
  <text x="420" y="522" text-anchor="middle" fill="#6b7280" font-size="8">partition pruning</text>
  <text x="420" y="536" text-anchor="middle" fill="#6b7280" font-size="8">100M row dataset</text>

  <text x="600" y="472" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">Cursor Seek</text>
  <text x="600" y="490" text-anchor="middle" fill="white" font-size="14" font-weight="700">O(log N)</text>
  <text x="600" y="506" text-anchor="middle" fill="#94a3b8" font-size="9">any depth</text>
  <text x="600" y="522" text-anchor="middle" fill="#6b7280" font-size="8">vs O(N) OFFSET</text>
  <text x="600" y="536" text-anchor="middle" fill="#6b7280" font-size="8">composite sort key</text>

  <text x="790" y="472" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="600">Profile Cache</text>
  <text x="790" y="490" text-anchor="middle" fill="white" font-size="13" font-weight="700">SHA256 15min TTL</text>
  <text x="790" y="506" text-anchor="middle" fill="#94a3b8" font-size="9">per col × filter state</text>
  <text x="790" y="522" text-anchor="middle" fill="#6b7280" font-size="8">lazy-load on click</text>
  <text x="790" y="536" text-anchor="middle" fill="#6b7280" font-size="8">sparkline in group rows</text>
</svg>
