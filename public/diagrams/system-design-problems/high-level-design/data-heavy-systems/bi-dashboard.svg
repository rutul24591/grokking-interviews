<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6366f1"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#0891b2"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10b981"/>
    </marker>
    <marker id="arr-o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="560" fill="#f8faff" rx="12"/>
  <rect width="900" height="48" fill="url(#hdr)" rx="12"/>
  <rect y="36" width="900" height="12" fill="url(#hdr)"/>
  <text x="450" y="30" text-anchor="middle" fill="white" font-size="16" font-weight="700">BI Dashboard (Tableau-like) — Key Flows</text>

  <!-- ── ROW 1: Chart Builder → SQL → Warehouse ── -->
  <text x="24" y="80" fill="#1d4ed8" font-size="11" font-weight="700">① CHART BUILDER → QUERY EXECUTION</text>

  <!-- Chart Builder box -->
  <rect x="20" y="90" width="160" height="80" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="100" y="110" text-anchor="middle" fill="#1d4ed8" font-size="11" font-weight="600">Chart Builder</text>
  <text x="100" y="126" text-anchor="middle" fill="#374151" font-size="9">xField: region</text>
  <text x="100" y="139" text-anchor="middle" fill="#374151" font-size="9">yField: revenue  agg: SUM</text>
  <text x="100" y="152" text-anchor="middle" fill="#374151" font-size="9">chartType: bar</text>

  <!-- arrow -->
  <line x1="182" y1="130" x2="238" y2="130" stroke="#6366f1" stroke-width="2" marker-end="url(#arr)"/>
  <text x="210" y="124" text-anchor="middle" fill="#6366f1" font-size="8">generates</text>

  <!-- SQL Gen box -->
  <rect x="240" y="90" width="180" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="330" y="110" text-anchor="middle" fill="#7c3aed" font-size="11" font-weight="600">SQL Generator</text>
  <text x="330" y="126" text-anchor="middle" fill="#374151" font-size="8.5">SELECT region, SUM(revenue)</text>
  <text x="330" y="139" text-anchor="middle" fill="#374151" font-size="8.5">FROM sales WHERE {params}</text>
  <text x="330" y="152" text-anchor="middle" fill="#374151" font-size="8.5">GROUP BY region LIMIT 10000</text>

  <!-- arrow to query service -->
  <line x1="422" y1="130" x2="478" y2="130" stroke="#0891b2" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="450" y="124" text-anchor="middle" fill="#0891b2" font-size="8">+ inject RLS</text>

  <!-- Query Service -->
  <rect x="480" y="90" width="160" height="80" rx="8" fill="#f0fdff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="560" y="110" text-anchor="middle" fill="#0891b2" font-size="11" font-weight="600">Query Service</text>
  <text x="560" y="126" text-anchor="middle" fill="#374151" font-size="9">Cache: SHA256(sql+tenant+RLS)</text>
  <text x="560" y="139" text-anchor="middle" fill="#374151" font-size="9">TTL = datasource refresh rate</text>
  <text x="560" y="152" text-anchor="middle" fill="#374151" font-size="9">queue: max 10 concurrent/DS</text>

  <!-- arrow to warehouse -->
  <line x1="642" y1="130" x2="698" y2="130" stroke="#10b981" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="670" y="124" text-anchor="middle" fill="#10b981" font-size="8">miss</text>

  <!-- Warehouse -->
  <rect x="700" y="90" width="170" height="80" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
  <text x="785" y="110" text-anchor="middle" fill="#059669" font-size="11" font-weight="600">Data Warehouse</text>
  <text x="785" y="126" text-anchor="middle" fill="#374151" font-size="9">BigQuery / Snowflake</text>
  <text x="785" y="139" text-anchor="middle" fill="#374151" font-size="9">Redshift / Postgres</text>
  <text x="785" y="152" text-anchor="middle" fill="#374151" font-size="9">CSV → DuckDB (in-browser)</text>

  <!-- ── ROW 2: Live vs Extract Mode ── -->
  <line x1="20" y1="194" x2="880" y2="194" stroke="#e5e7eb" stroke-width="1"/>
  <text x="24" y="214" fill="#0891b2" font-size="11" font-weight="700">② LIVE MODE vs EXTRACT MODE</text>

  <!-- Live mode -->
  <rect x="20" y="222" width="390" height="90" rx="8" fill="#f0fdff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="215" y="242" text-anchor="middle" fill="#0891b2" font-size="11" font-weight="600">Live Mode</text>
  <text x="215" y="258" text-anchor="middle" fill="#374151" font-size="9">Every filter change → re-query warehouse</text>
  <text x="215" y="272" text-anchor="middle" fill="#374151" font-size="9">N charts load in parallel (Promise.all)</text>
  <text x="215" y="286" text-anchor="middle" fill="#374151" font-size="9">Redis cache absorbs burst of 500 concurrent viewers</text>
  <text x="215" y="300" text-anchor="middle" fill="#374151" font-size="9">Best for: always-current operations dashboards</text>

  <!-- Extract mode -->
  <rect x="440" y="222" width="430" height="90" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="655" y="242" text-anchor="middle" fill="#7c3aed" font-size="11" font-weight="600">Extract Mode</text>
  <text x="655" y="258" text-anchor="middle" fill="#374151" font-size="9">Full table prefetched → Apache Arrow buffer (≤10M rows)</text>
  <text x="655" y="272" text-anchor="middle" fill="#374151" font-size="9">Browser DuckDB-WASM runs SQL sub-queries client-side</text>
  <text x="655" y="286" text-anchor="middle" fill="#374151" font-size="9">Cross-filter response: &lt;100ms (no network round-trip)</text>
  <text x="655" y="300" text-anchor="middle" fill="#374151" font-size="9">Best for: dashboards with infrequent data changes</text>

  <text x="420" y="262" text-anchor="middle" fill="#9ca3af" font-size="9">vs</text>

  <!-- ── ROW 3: Cross-Filter + RLS ── -->
  <line x1="20" y1="330" x2="880" y2="330" stroke="#e5e7eb" stroke-width="1"/>
  <text x="24" y="350" fill="#059669" font-size="11" font-weight="700">③ CROSS-FILTER</text>
  <text x="450" y="350" fill="#f59e0b" font-size="11" font-weight="700">④ ROW-LEVEL SECURITY</text>

  <!-- Cross filter -->
  <rect x="20" y="358" width="390" height="80" rx="8" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="80" y="377" fill="#374151" font-size="9">Click "West" bar in Chart A</text>
  <line x1="200" y1="377" x2="240" y2="377" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="280" y="377" fill="#374151" font-size="9">dispatch {field:region, value:West}</text>
  <text x="80" y="393" fill="#374151" font-size="9">All charts WHERE region='West' (AND-merged)</text>
  <text x="80" y="409" fill="#374151" font-size="9">Highlight: dim non-selected opacity 0.3 (client-side, instant)</text>
  <text x="80" y="425" fill="#374151" font-size="9">Filter: re-query with additional WHERE clause</text>

  <!-- RLS -->
  <rect x="440" y="358" width="430" height="80" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="500" y="377" fill="#374151" font-size="9">Viewer JWT: {userId, region: "West"}</text>
  <line x1="640" y1="377" x2="680" y2="377" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="750" y="377" fill="#374151" font-size="9">inject AND region='West'</text>
  <text x="500" y="393" fill="#374151" font-size="9">Cache key includes RLS context (SHA256)</text>
  <text x="500" y="409" fill="#374151" font-size="9">Two viewers with diff RLS → separate cache entries</text>
  <text x="500" y="425" fill="#374151" font-size="9">Builder: "Preview as viewer" to verify restrictions</text>

  <!-- ── Metrics bar ── -->
  <rect x="14" y="460" width="872" height="80" rx="8" fill="#0f172a"/>
  <text x="14" y="456" fill="#6366f1" font-size="10" font-weight="600">KEY NUMBERS</text>

  <text x="100" y="486" text-anchor="middle" fill="#93c5fd" font-size="10" font-weight="600">Live Query p95</text>
  <text x="100" y="502" text-anchor="middle" fill="white" font-size="14" font-weight="700">&lt;3s</text>
  <text x="100" y="516" text-anchor="middle" fill="#94a3b8" font-size="9">100M row aggregation</text>

  <text x="260" y="486" text-anchor="middle" fill="#ddd6fe" font-size="10" font-weight="600">Extract Cross-filter</text>
  <text x="260" y="502" text-anchor="middle" fill="white" font-size="14" font-weight="700">&lt;100ms</text>
  <text x="260" y="516" text-anchor="middle" fill="#94a3b8" font-size="9">DuckDB-WASM in browser</text>

  <text x="450" y="486" text-anchor="middle" fill="#6ee7b7" font-size="10" font-weight="600">Dashboard Load</text>
  <text x="450" y="502" text-anchor="middle" fill="white" font-size="14" font-weight="700">&lt;5s</text>
  <text x="450" y="516" text-anchor="middle" fill="#94a3b8" font-size="9">all charts parallel</text>

  <text x="640" y="486" text-anchor="middle" fill="#fcd34d" font-size="10" font-weight="600">Cache Key</text>
  <text x="640" y="502" text-anchor="middle" fill="white" font-size="13" font-weight="700">SHA256(sql+tenant+RLS)</text>
  <text x="640" y="516" text-anchor="middle" fill="#94a3b8" font-size="9">per-viewer isolation</text>

  <text x="810" y="486" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">Concurrent Viewers</text>
  <text x="810" y="502" text-anchor="middle" fill="white" font-size="14" font-weight="700">500 → 1 query</text>
  <text x="810" y="516" text-anchor="middle" fill="#94a3b8" font-size="9">Redis cache absorbs burst</text>
</svg>
