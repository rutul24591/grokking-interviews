<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">Remote App Configuration — SDK Fetch, Targeting &amp; Evaluation</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="65" width="110" height="40" rx="8" fill="#6d5bd0"/>
  <text x="75" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Mobile / Web App</text>
  <text x="75" y="98" text-anchor="middle" font-size="10" fill="#edeaf5">SDK embedded</text>

  <rect x="198" y="65" width="115" height="40" rx="8" fill="#2563eb"/>
  <text x="255" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Config API</text>
  <text x="255" y="98" text-anchor="middle" font-size="10" fill="#dbeafe">context eval</text>

  <rect x="388" y="65" width="115" height="40" rx="8" fill="#2f9d74"/>
  <text x="445" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Targeting Engine</text>
  <text x="445" y="98" text-anchor="middle" font-size="10" fill="#d1fae5">rules evaluation</text>

  <rect x="578" y="65" width="115" height="40" rx="8" fill="#d97843"/>
  <text x="635" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Config Store</text>
  <text x="635" y="98" text-anchor="middle" font-size="10" fill="#fef3c7">rules + values DB</text>

  <rect x="768" y="65" width="112" height="40" rx="8" fill="#be123c"/>
  <text x="824" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">CDN Edge Cache</text>
  <text x="824" y="98" text-anchor="middle" font-size="10" fill="#fecdd3">non-targeted payload</text>

  <!-- Lifelines -->
  <line x1="75"  y1="105" x2="75"  y2="490" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="255" y1="105" x2="255" y2="490" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="445" y1="105" x2="445" y2="490" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="635" y1="105" x2="635" y2="490" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="824" y1="105" x2="824" y2="490" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- SECTION 1: SDK cold fetch on app launch -->
  <rect x="8" y="118" width="884" height="14" rx="3" fill="#6d5bd0" opacity="0.15"/>
  <text x="450" y="129" text-anchor="middle" font-size="9" font-weight="bold" fill="#4c1d95">1 · SDK COLD FETCH — app launches; SDK sends user context (userId, appVersion, platform, country); API evaluates targeting rules server-side; returns resolved config</text>

  <line x1="75" y1="150" x2="240" y2="150" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="144" text-anchor="middle" font-size="9" fill="#374151">POST /config/eval {userId, appVersion, country, platform}</text>

  <line x1="240" y1="164" x2="430" y2="164" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="335" y="158" text-anchor="middle" font-size="9" fill="#374151">fetch all rules for this appId; eval each rule against context</text>

  <line x1="430" y1="178" x2="620" y2="178" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="525" y="172" text-anchor="middle" font-size="9" fill="#374151">load config rules (Redis cache, TTL 60s)</text>

  <line x1="620" y1="192" x2="430" y2="192" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="525" y="186" text-anchor="middle" font-size="9" fill="#374151">rules: [{condition, key, value, priority}]</text>

  <line x1="430" y1="206" x2="90" y2="206" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="260" y="200" text-anchor="middle" font-size="9" fill="#374151">resolved config map: {key → value} + etag for caching</text>

  <!-- SECTION 2: CDN path for non-targeted configs -->
  <rect x="8" y="220" width="884" height="14" rx="3" fill="#2f9d74" opacity="0.18"/>
  <text x="450" y="231" text-anchor="middle" font-size="9" font-weight="bold" fill="#065f46">2 · CDN PATH (non-targeted) — global defaults with no user context served from CDN edge; ETag + If-None-Match for 304 short-circuit; &lt;5ms p99</text>

  <line x1="75" y1="250" x2="809" y2="250" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="440" y="244" text-anchor="middle" font-size="9" fill="#374151">GET /config/defaults?appId=X (If-None-Match: {etag})</text>

  <line x1="809" y1="264" x2="809" y2="264" stroke="#be123c" stroke-width="1"/>
  <rect x="735" y="266" width="178" height="20" rx="5" fill="#be123c"/>
  <text x="824" y="280" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">CDN HIT → 304 Not Modified (etag match)</text>

  <line x1="809" y1="290" x2="90" y2="290" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="440" y="284" text-anchor="middle" font-size="9" fill="#374151">304 (no body) → SDK uses cached config; saves bandwidth</text>

  <!-- SECTION 3: SDK local evaluation + offline fallback -->
  <rect x="8" y="304" width="884" height="14" rx="3" fill="#d97843" opacity="0.18"/>
  <text x="450" y="315" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">3 · LOCAL EVAL + OFFLINE — SDK caches rules on-device; evaluates locally when offline; stale-while-revalidate pattern; bundled defaults prevent blank state</text>

  <line x1="75" y1="334" x2="75" y2="334" stroke="#6d5bd0" stroke-width="1"/>
  <rect x="22" y="336" width="105" height="32" rx="5" fill="#6d5bd0"/>
  <text x="75" y="350" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">SDK: offline</text>
  <text x="75" y="362" text-anchor="middle" font-size="9" fill="#edeaf5">use cached rules</text>

  <line x1="75" y1="374" x2="240" y2="374" stroke="#6d5bd0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="157" y="368" text-anchor="middle" font-size="9" fill="#374151">reconnect → background revalidate; UI never blocks</text>

  <line x1="240" y1="388" x2="430" y2="388" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="335" y="382" text-anchor="middle" font-size="9" fill="#374151">POST /config/eval (with If-None-Match etag)</text>

  <line x1="430" y1="402" x2="90" y2="402" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="260" y="396" text-anchor="middle" font-size="9" fill="#374151">200 {updatedConfig} or 304 (no change) → update local cache</text>

  <!-- SECTION 4: Config publish + cache invalidation -->
  <rect x="8" y="416" width="884" height="14" rx="3" fill="#be123c" opacity="0.12"/>
  <text x="450" y="427" text-anchor="middle" font-size="9" font-weight="bold" fill="#9f1239">4 · PUBLISH + INVALIDATION — admin publishes new config; Redis PUBLISH triggers push to all API pods; CDN purge for non-targeted defaults; new etag issued</text>

  <line x1="620" y1="446" x2="430" y2="446" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="525" y="440" text-anchor="middle" font-size="9" fill="#374151">admin commit → Redis PUBLISH + CDN purge defaults</text>

  <line x1="430" y1="460" x2="809" y2="460" stroke="#2f9d74" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="619" y="454" text-anchor="middle" font-size="9" fill="#374151">next SDK poll gets fresh config; SSE push for real-time clients</text>

  <!-- Footer -->
  <rect x="8" y="476" width="884" height="36" rx="6" fill="#1a1822"/>
  <text x="90" y="492" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">Eval Model</text>
  <text x="90" y="506" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">server-side targeting</text>
  <text x="255" y="492" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">CDN Path</text>
  <text x="255" y="506" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">ETag 304 short-circuit</text>
  <text x="450" y="492" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Offline SDK</text>
  <text x="450" y="506" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">cached rules + defaults</text>
  <text x="645" y="492" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Invalidation</text>
  <text x="645" y="506" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">Redis pub/sub + CDN purge</text>
  <text x="820" y="492" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Rules Cache</text>
  <text x="820" y="506" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">Redis TTL 60s</text>
</svg>
