<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">Kill-Switch / Emergency Control Panel — Activate &amp; Propagation Pipeline</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="65" width="110" height="40" rx="8" fill="#6d5bd0"/>
  <text x="75" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">On-call Operator</text>
  <text x="75" y="98" text-anchor="middle" font-size="10" fill="#edeaf5">incident response</text>

  <rect x="198" y="65" width="115" height="40" rx="8" fill="#2563eb"/>
  <text x="255" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Control Panel API</text>
  <text x="255" y="98" text-anchor="middle" font-size="10" fill="#dbeafe">auth + audit</text>

  <rect x="388" y="65" width="115" height="40" rx="8" fill="#2f9d74"/>
  <text x="445" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Switch Store</text>
  <text x="445" y="98" text-anchor="middle" font-size="10" fill="#d1fae5">Redis + DB state</text>

  <rect x="578" y="65" width="115" height="40" rx="8" fill="#d97843"/>
  <text x="635" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Propagation Bus</text>
  <text x="635" y="98" text-anchor="middle" font-size="10" fill="#fef3c7">Kafka / Redis pub/sub</text>

  <rect x="768" y="65" width="112" height="40" rx="8" fill="#be123c"/>
  <text x="824" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Protected Services</text>
  <text x="824" y="98" text-anchor="middle" font-size="10" fill="#fecdd3">check + enforce</text>

  <!-- Lifelines -->
  <line x1="75"  y1="105" x2="75"  y2="490" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="255" y1="105" x2="255" y2="490" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="445" y1="105" x2="445" y2="490" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="635" y1="105" x2="635" y2="490" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="824" y1="105" x2="824" y2="490" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- SECTION 1: Kill-switch activation -->
  <rect x="8" y="118" width="884" height="14" rx="3" fill="#e05252" opacity="0.2"/>
  <text x="450" y="129" text-anchor="middle" font-size="9" font-weight="bold" fill="#9f1239">1 · ACTIVATION — MFA-gated; optional second approver for critical switches; Redis SET in &lt;5ms; DB write for audit; immediate propagation via pub/sub</text>

  <line x1="75" y1="150" x2="240" y2="150" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="157" y="144" text-anchor="middle" font-size="9" fill="#374151">POST /switches/{name}/activate {reason, scope, expiresIn}</text>

  <line x1="240" y1="164" x2="240" y2="164" stroke="#2563eb" stroke-width="1"/>
  <rect x="178" y="166" width="155" height="20" rx="5" fill="#2563eb"/>
  <text x="255" y="180" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">verify MFA token; check switch criticality</text>

  <line x1="240" y1="190" x2="430" y2="190" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="335" y="184" text-anchor="middle" font-size="9" fill="#374151">Redis SET switch:{name} ACTIVE EX {expiresIn}; DB INSERT</text>

  <line x1="430" y1="204" x2="90" y2="204" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="260" y="198" text-anchor="middle" font-size="9" fill="#374151">200 {switchId, activatedAt, scope, estimatedImpact}</text>

  <!-- SECTION 2: Propagation to services -->
  <rect x="8" y="218" width="884" height="14" rx="3" fill="#2f9d74" opacity="0.18"/>
  <text x="450" y="229" text-anchor="middle" font-size="9" font-weight="bold" fill="#065f46">2 · PROPAGATION — Redis PUBLISH fans out to all subscribed service pods; Kafka for durability; services apply switch within &lt;500ms of activation</text>

  <line x1="430" y1="248" x2="620" y2="248" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="525" y="242" text-anchor="middle" font-size="9" fill="#374151">Redis PUBLISH switches {name, state: ACTIVE, scope}</text>

  <line x1="620" y1="262" x2="809" y2="262" stroke="#d97843" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="714" y="256" text-anchor="middle" font-size="9" fill="#374151">all subscribed pods receive event; update in-memory flag</text>

  <line x1="809" y1="276" x2="809" y2="276" stroke="#be123c" stroke-width="1"/>
  <rect x="735" y="278" width="178" height="20" rx="5" fill="#be123c"/>
  <text x="824" y="292" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">gate check at request entry: if ACTIVE → reject/degrade</text>

  <!-- SECTION 3: Service enforcement -->
  <rect x="8" y="306" width="884" height="14" rx="3" fill="#d97843" opacity="0.18"/>
  <text x="450" y="317" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">3 · ENFORCEMENT — each service polls Redis every 5s as safety net; custom fallback: return cached data / 503 / graceful degradation message to user</text>

  <line x1="809" y1="336" x2="430" y2="336" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="619" y="330" text-anchor="middle" font-size="9" fill="#374151">every 5s: GET switch:{name} (safety-net poll)</text>

  <line x1="430" y1="350" x2="809" y2="350" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="619" y="344" text-anchor="middle" font-size="9" fill="#374151">ACTIVE → serve stale cache / return 503 / show maintenance</text>

  <line x1="809" y1="364" x2="240" y2="364" stroke="#be123c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="524" y="358" text-anchor="middle" font-size="9" fill="#374151">heartbeat metric: % pods that ack'd within 500ms → dashboard</text>

  <!-- SECTION 4: Auto-expiry + deactivation -->
  <rect x="8" y="378" width="884" height="14" rx="3" fill="#be123c" opacity="0.12"/>
  <text x="450" y="389" text-anchor="middle" font-size="9" font-weight="bold" fill="#9f1239">4 · DEACTIVATION + AUDIT — Redis TTL auto-expires switch; or manual deactivate; all state changes append to immutable audit log; PagerDuty alert on activate</text>

  <line x1="75" y1="408" x2="240" y2="408" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="402" text-anchor="middle" font-size="9" fill="#374151">POST /switches/{name}/deactivate {reason}</text>

  <line x1="240" y1="422" x2="430" y2="422" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="335" y="416" text-anchor="middle" font-size="9" fill="#374151">Redis DEL switch:{name}; DB INSERT state=INACTIVE</text>

  <line x1="430" y1="436" x2="620" y2="436" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="525" y="430" text-anchor="middle" font-size="9" fill="#374151">Redis PUBLISH switches {name, state: INACTIVE}</text>

  <line x1="620" y1="450" x2="90" y2="450" stroke="#d97843" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="355" y="444" text-anchor="middle" font-size="9" fill="#374151">PagerDuty alert; audit_log: {actor, switch, state, reason, ts}</text>

  <!-- Footer -->
  <rect x="8" y="468" width="884" height="36" rx="6" fill="#1a1822"/>
  <text x="90" y="484" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">Auth Gate</text>
  <text x="90" y="498" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">MFA + approver</text>
  <text x="255" y="484" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Propagation</text>
  <text x="255" y="498" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">&lt;500ms all pods</text>
  <text x="450" y="484" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Safety Net Poll</text>
  <text x="450" y="498" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">Redis every 5s</text>
  <text x="645" y="484" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Auto-Expiry</text>
  <text x="645" y="498" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">Redis TTL (expiresIn)</text>
  <text x="820" y="484" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Audit</text>
  <text x="820" y="498" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">immutable append</text>
</svg>
