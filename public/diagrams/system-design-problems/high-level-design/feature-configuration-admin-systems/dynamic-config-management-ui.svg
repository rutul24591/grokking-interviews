<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">Dynamic Config Management — Read, Write &amp; Push Pipeline</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="65" width="110" height="40" rx="8" fill="#6d5bd0"/>
  <text x="75" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Admin UI</text>
  <text x="75" y="98" text-anchor="middle" font-size="10" fill="#edeaf5">edit + publish</text>

  <rect x="198" y="65" width="115" height="40" rx="8" fill="#2563eb"/>
  <text x="255" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Config API</text>
  <text x="255" y="98" text-anchor="middle" font-size="10" fill="#dbeafe">validate + persist</text>

  <rect x="388" y="65" width="115" height="40" rx="8" fill="#2f9d74"/>
  <text x="445" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Config Store</text>
  <text x="445" y="98" text-anchor="middle" font-size="10" fill="#d1fae5">versioned DB + cache</text>

  <rect x="578" y="65" width="115" height="40" rx="8" fill="#d97843"/>
  <text x="635" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Push Service</text>
  <text x="635" y="98" text-anchor="middle" font-size="10" fill="#fef3c7">SSE / polling fan-out</text>

  <rect x="768" y="65" width="112" height="40" rx="8" fill="#be123c"/>
  <text x="824" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">App Services</text>
  <text x="824" y="98" text-anchor="middle" font-size="10" fill="#fecdd3">consumers of config</text>

  <!-- Lifelines -->
  <line x1="75"  y1="105" x2="75"  y2="490" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="255" y1="105" x2="255" y2="490" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="445" y1="105" x2="445" y2="490" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="635" y1="105" x2="635" y2="490" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="824" y1="105" x2="824" y2="490" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- SECTION 1: Config write + validation -->
  <rect x="8" y="118" width="884" height="14" rx="3" fill="#6d5bd0" opacity="0.15"/>
  <text x="450" y="129" text-anchor="middle" font-size="9" font-weight="bold" fill="#4c1d95">1 · CONFIG WRITE — admin edits key-value with type + schema validation; approval gate for prod; versioned INSERT with diff; audit log of who changed what</text>

  <line x1="75" y1="150" x2="240" y2="150" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="144" text-anchor="middle" font-size="9" fill="#374151">PUT /configs/{namespace}/{key} {value, env: prod}</text>

  <line x1="240" y1="164" x2="430" y2="164" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="335" y="158" text-anchor="middle" font-size="9" fill="#374151">validate type + schema; require approval if env=prod</text>

  <line x1="430" y1="178" x2="430" y2="178" stroke="#2f9d74" stroke-width="1"/>
  <rect x="340" y="180" width="210" height="20" rx="5" fill="#2f9d74"/>
  <text x="445" y="194" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">INSERT config_versions (key, value, version++, changedBy)</text>

  <line x1="430" y1="204" x2="90" y2="204" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="260" y="198" text-anchor="middle" font-size="9" fill="#374151">200 {versionId, diff, effectiveAt}</text>

  <!-- SECTION 2: Fan-out push to services -->
  <rect x="8" y="218" width="884" height="14" rx="3" fill="#2f9d74" opacity="0.18"/>
  <text x="450" y="229" text-anchor="middle" font-size="9" font-weight="bold" fill="#065f46">2 · PUSH FAN-OUT — on commit, push service broadcasts config delta to all subscribers; SSE for long-poll clients; polling fallback every 30s; Redis pub/sub</text>

  <line x1="430" y1="248" x2="620" y2="248" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="525" y="242" text-anchor="middle" font-size="9" fill="#374151">Redis PUBLISH config:{namespace} {key, value, version}</text>

  <line x1="620" y1="262" x2="809" y2="262" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="714" y="256" text-anchor="middle" font-size="9" fill="#374151">SSE push to all connected service pods (fan-out)</text>

  <line x1="809" y1="276" x2="809" y2="276" stroke="#be123c" stroke-width="1"/>
  <rect x="738" y="278" width="172" height="20" rx="5" fill="#be123c"/>
  <text x="824" y="292" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">in-memory cache update; no restart required</text>

  <!-- SECTION 3: Service config read (startup / polling) -->
  <rect x="8" y="306" width="884" height="14" rx="3" fill="#d97843" opacity="0.18"/>
  <text x="450" y="317" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">3 · CONFIG READ — services fetch on startup from Redis cache; version watermark prevents stale reads; local in-memory TTL 5min as circuit-breaker fallback</text>

  <line x1="809" y1="336" x2="240" y2="336" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="524" y="330" text-anchor="middle" font-size="9" fill="#374151">GET /configs/{namespace} (on startup, version=0)</text>

  <line x1="240" y1="350" x2="430" y2="350" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="335" y="344" text-anchor="middle" font-size="9" fill="#374151">Redis GET config:{namespace} (cache miss → DB read)</text>

  <line x1="430" y1="364" x2="809" y2="364" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="619" y="358" text-anchor="middle" font-size="9" fill="#374151">full config map + currentVersion; services cache locally 5min</text>

  <!-- SECTION 4: Rollback + audit -->
  <rect x="8" y="378" width="884" height="14" rx="3" fill="#be123c" opacity="0.12"/>
  <text x="450" y="389" text-anchor="middle" font-size="9" font-weight="bold" fill="#9f1239">4 · ROLLBACK + AUDIT — one-click rollback to any prior version; diff viewer for any two versions; audit log: who changed what, when, from which IP</text>

  <line x1="75" y1="408" x2="240" y2="408" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="402" text-anchor="middle" font-size="9" fill="#374151">POST /configs/{key}/rollback {targetVersionId}</text>

  <line x1="240" y1="422" x2="430" y2="422" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="335" y="416" text-anchor="middle" font-size="9" fill="#374151">re-publish old value as new version; push fan-out again</text>

  <line x1="430" y1="440" x2="90" y2="440" stroke="#2f9d74" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="260" y="434" text-anchor="middle" font-size="9" fill="#374151">audit_log: {actor, key, oldValue, newValue, env, ts, ip}</text>

  <!-- Footer -->
  <rect x="8" y="458" width="884" height="36" rx="6" fill="#1a1822"/>
  <text x="90" y="474" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">Versioning</text>
  <text x="90" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">immutable version rows</text>
  <text x="255" y="474" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Push Mechanism</text>
  <text x="255" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">Redis pub/sub + SSE</text>
  <text x="450" y="474" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Poll Fallback</text>
  <text x="450" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">30s version watermark</text>
  <text x="645" y="474" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Local Cache TTL</text>
  <text x="645" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">5 min circuit-breaker</text>
  <text x="820" y="474" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Prod Gate</text>
  <text x="820" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">approval required</text>
</svg>
