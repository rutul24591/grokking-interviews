<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">Ads Delivery &amp; Targeting — Auction &amp; Serving Pipeline</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="65" width="110" height="40" rx="8" fill="#6d5bd0"/>
  <text x="75" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Publisher App</text>
  <text x="75" y="98" text-anchor="middle" font-size="10" fill="#edeaf5">ad slot request</text>

  <rect x="198" y="65" width="115" height="40" rx="8" fill="#2563eb"/>
  <text x="255" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Ad Server</text>
  <text x="255" y="98" text-anchor="middle" font-size="10" fill="#dbeafe">targeting + auction</text>

  <rect x="388" y="65" width="115" height="40" rx="8" fill="#2f9d74"/>
  <text x="445" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Bidder / DSP</text>
  <text x="445" y="98" text-anchor="middle" font-size="10" fill="#d1fae5">RTB bid response</text>

  <rect x="578" y="65" width="115" height="40" rx="8" fill="#d97843"/>
  <text x="635" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Auction Engine</text>
  <text x="635" y="98" text-anchor="middle" font-size="10" fill="#fef3c7">second-price rank</text>

  <rect x="768" y="65" width="112" height="40" rx="8" fill="#be123c"/>
  <text x="824" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Event Logger</text>
  <text x="824" y="98" text-anchor="middle" font-size="10" fill="#fecdd3">impression + click</text>

  <!-- Lifelines -->
  <line x1="75"  y1="105" x2="75"  y2="490" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="255" y1="105" x2="255" y2="490" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="445" y1="105" x2="445" y2="490" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="635" y1="105" x2="635" y2="490" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="824" y1="105" x2="824" y2="490" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- SECTION 1: Ad request + targeting -->
  <rect x="8" y="118" width="884" height="14" rx="3" fill="#6d5bd0" opacity="0.15"/>
  <text x="450" y="129" text-anchor="middle" font-size="9" font-weight="bold" fill="#4c1d95">1 · AD REQUEST + TARGETING — publisher sends slot context; ad server resolves user segment via Redis in &lt;2ms; builds bid request with targeting signals</text>

  <line x1="75" y1="150" x2="240" y2="150" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="144" text-anchor="middle" font-size="9" fill="#374151">POST /ads/request {slotId, userId, pageUrl, geoIp}</text>

  <line x1="240" y1="164" x2="240" y2="164" stroke="#2563eb" stroke-width="1"/>
  <rect x="178" y="166" width="155" height="20" rx="5" fill="#2563eb"/>
  <text x="255" y="180" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">resolve segment: Redis GET seg:{userId} &lt;2ms</text>

  <line x1="240" y1="190" x2="430" y2="190" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="335" y="184" text-anchor="middle" font-size="9" fill="#374151">broadcast BidRequest to 50 DSPs in parallel (100ms deadline)</text>

  <!-- SECTION 2: RTB auction -->
  <rect x="8" y="204" width="884" height="14" rx="3" fill="#2f9d74" opacity="0.18"/>
  <text x="450" y="215" text-anchor="middle" font-size="9" font-weight="bold" fill="#065f46">2 · RTB AUCTION — DSPs respond with bid + ad creative within 80ms; late bids dropped; second-price Vickrey auction selects winner; eCPM = bid × pCTR</text>

  <line x1="430" y1="234" x2="620" y2="234" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="525" y="228" text-anchor="middle" font-size="9" fill="#374151">bid responses: [{dspId, bidCpm, adCreativeUrl, targeting}]</text>

  <line x1="620" y1="248" x2="620" y2="248" stroke="#d97843" stroke-width="1"/>
  <rect x="535" y="250" width="200" height="20" rx="5" fill="#d97843"/>
  <text x="635" y="264" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">rank by eCPM = bidCpm × pCTR; floor price check</text>

  <line x1="620" y1="274" x2="240" y2="274" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="430" y="268" text-anchor="middle" font-size="9" fill="#374151">winner: {adId, creativeUrl, clearingPrice = 2nd-highest bid + $0.01}</text>

  <!-- SECTION 3: Ad delivery to client -->
  <rect x="8" y="288" width="884" height="14" rx="3" fill="#d97843" opacity="0.18"/>
  <text x="450" y="299" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">3 · AD DELIVERY — winning creative served via CDN; beacon fired on impression; frequency cap checked in Redis before render; viewability tracked client-side</text>

  <line x1="240" y1="318" x2="90" y2="318" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="165" y="312" text-anchor="middle" font-size="9" fill="#374151">200 {adCreativeUrl (CDN), beaconUrl, adId}</text>

  <line x1="75" y1="332" x2="240" y2="332" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="326" text-anchor="middle" font-size="9" fill="#374151">GET creative from CDN; render in isolated iframe sandbox</text>

  <line x1="75" y1="348" x2="809" y2="348" stroke="#6d5bd0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="440" y="342" text-anchor="middle" font-size="9" fill="#374151">impression beacon → Kafka (async, non-blocking render path)</text>

  <!-- SECTION 4: Click + conversion tracking -->
  <rect x="8" y="362" width="884" height="14" rx="3" fill="#be123c" opacity="0.12"/>
  <text x="450" y="373" text-anchor="middle" font-size="9" font-weight="bold" fill="#9f1239">4 · CLICK + CONVERSION — click fires redirect through ad server for tracking; Kafka event pipeline; conversion pixel for downstream purchase attribution</text>

  <line x1="75" y1="392" x2="240" y2="392" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="386" text-anchor="middle" font-size="9" fill="#374151">GET /ads/click?adId=X&amp;userId=Y → 302 to advertiser</text>

  <line x1="240" y1="406" x2="809" y2="406" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="524" y="400" text-anchor="middle" font-size="9" fill="#374151">click event → Kafka → fraud check (IVT) → billing increment</text>

  <line x1="809" y1="420" x2="620" y2="420" stroke="#be123c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="714" y="414" text-anchor="middle" font-size="9" fill="#374151">INCR freq_cap:{userId}:{adId}:day; dedup 60s click window</text>

  <line x1="620" y1="440" x2="809" y2="440" stroke="#d97843" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="714" y="434" text-anchor="middle" font-size="9" fill="#374151">conversion pixel fires on purchase → Kafka attribution event</text>

  <!-- Footer -->
  <rect x="8" y="458" width="884" height="36" rx="6" fill="#1a1822"/>
  <text x="90" y="474" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">Bid Deadline</text>
  <text x="90" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">80ms hard cutoff</text>
  <text x="255" y="474" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Auction Type</text>
  <text x="255" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">2nd-price Vickrey</text>
  <text x="450" y="474" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Targeting Cache</text>
  <text x="450" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">Redis seg &lt;2ms</text>
  <text x="645" y="474" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Freq Cap</text>
  <text x="645" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">Redis INCR per day</text>
  <text x="820" y="474" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Events</text>
  <text x="820" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">Kafka async pipeline</text>
</svg>
