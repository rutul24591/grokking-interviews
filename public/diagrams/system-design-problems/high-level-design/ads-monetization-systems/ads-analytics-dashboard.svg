<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">Ads Analytics Dashboard — Ingestion, Aggregation &amp; Query Pipeline</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="65" width="110" height="40" rx="8" fill="#6d5bd0"/>
  <text x="75" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Advertiser UI</text>
  <text x="75" y="98" text-anchor="middle" font-size="10" fill="#edeaf5">dashboard queries</text>

  <rect x="198" y="65" width="115" height="40" rx="8" fill="#2563eb"/>
  <text x="255" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Analytics API</text>
  <text x="255" y="98" text-anchor="middle" font-size="10" fill="#dbeafe">query + cache</text>

  <rect x="388" y="65" width="115" height="40" rx="8" fill="#2f9d74"/>
  <text x="445" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">OLAP Store</text>
  <text x="445" y="98" text-anchor="middle" font-size="10" fill="#d1fae5">ClickHouse / Druid</text>

  <rect x="578" y="65" width="115" height="40" rx="8" fill="#d97843"/>
  <text x="635" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Stream Processor</text>
  <text x="635" y="98" text-anchor="middle" font-size="10" fill="#fef3c7">Flink aggregation</text>

  <rect x="768" y="65" width="112" height="40" rx="8" fill="#be123c"/>
  <text x="824" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Event Ingestor</text>
  <text x="824" y="98" text-anchor="middle" font-size="10" fill="#fecdd3">Kafka raw events</text>

  <!-- Lifelines -->
  <line x1="75"  y1="105" x2="75"  y2="490" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="255" y1="105" x2="255" y2="490" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="445" y1="105" x2="445" y2="490" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="635" y1="105" x2="635" y2="490" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="824" y1="105" x2="824" y2="490" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- SECTION 1: Event ingestion -->
  <rect x="8" y="118" width="884" height="14" rx="3" fill="#6d5bd0" opacity="0.15"/>
  <text x="450" y="129" text-anchor="middle" font-size="9" font-weight="bold" fill="#4c1d95">1 · EVENT INGESTION — impression/click/conversion beacons hit ingestor; dedup in Redis 60s window; publish to Kafka partitioned by campaignId</text>

  <line x1="809" y1="150" x2="620" y2="150" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="714" y="144" text-anchor="middle" font-size="9" fill="#374151">impression/click beacons arrive (10K–1M events/sec)</text>

  <line x1="620" y1="164" x2="620" y2="164" stroke="#d97843" stroke-width="1"/>
  <rect x="558" y="166" width="155" height="20" rx="5" fill="#d97843"/>
  <text x="635" y="180" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">dedup: Redis SETNX eventId 60s TTL</text>

  <line x1="620" y1="190" x2="809" y2="190" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="714" y="184" text-anchor="middle" font-size="9" fill="#374151">Kafka topic: ad-events, partitioned by campaignId</text>

  <!-- SECTION 2: Stream aggregation -->
  <rect x="8" y="204" width="884" height="14" rx="3" fill="#2f9d74" opacity="0.18"/>
  <text x="450" y="215" text-anchor="middle" font-size="9" font-weight="bold" fill="#065f46">2 · STREAM AGGREGATION — Flink 1-min tumbling windows; compute impressions/clicks/CTR/spend per campaign; write to ClickHouse + Redis near-real-time</text>

  <line x1="809" y1="234" x2="620" y2="234" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="714" y="228" text-anchor="middle" font-size="9" fill="#374151">Flink consumes Kafka; 1-min tumbling window aggregation</text>

  <line x1="620" y1="248" x2="430" y2="248" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="525" y="242" text-anchor="middle" font-size="9" fill="#374151">INSERT into ClickHouse: {campaignId, minute, imps, clicks, spend}</text>

  <line x1="430" y1="262" x2="240" y2="262" stroke="#2f9d74" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="335" y="256" text-anchor="middle" font-size="9" fill="#374151">Redis HSET campaign:{id}:live imps clicks spend (5s TTL)</text>

  <!-- SECTION 3: Dashboard query -->
  <rect x="8" y="276" width="884" height="14" rx="3" fill="#d97843" opacity="0.18"/>
  <text x="450" y="287" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">3 · DASHBOARD QUERY — time-series, breakdown by creative/geo/device; pre-aggregated rollups (hourly/daily); Redis cache 60s for last-1hr live data</text>

  <line x1="75" y1="306" x2="240" y2="306" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="300" text-anchor="middle" font-size="9" fill="#374151">GET /analytics?campaignId=X&amp;from=&amp;to=&amp;dim=geo</text>

  <line x1="240" y1="320" x2="240" y2="320" stroke="#2563eb" stroke-width="1"/>
  <rect x="178" y="322" width="155" height="20" rx="5" fill="#2563eb"/>
  <text x="255" y="336" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">cache HIT → Redis 60s; MISS → ClickHouse</text>

  <line x1="240" y1="346" x2="430" y2="346" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="335" y="340" text-anchor="middle" font-size="9" fill="#374151">SELECT sum(imps), sum(clicks), sum(spend) GROUP BY geo, hour</text>

  <line x1="430" y1="360" x2="90" y2="360" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="260" y="354" text-anchor="middle" font-size="9" fill="#374151">time-series chart data: [{hour, imps, clicks, ctr, cpm, spend}]</text>

  <!-- SECTION 4: Budget pacing + alerts -->
  <rect x="8" y="374" width="884" height="14" rx="3" fill="#be123c" opacity="0.12"/>
  <text x="450" y="385" text-anchor="middle" font-size="9" font-weight="bold" fill="#9f1239">4 · BUDGET PACING + ALERTS — daily budget tracked in Redis; pacing algo throttles bid rate; anomaly alerts (CTR spike, budget exhaustion) via webhook</text>

  <line x1="620" y1="404" x2="430" y2="404" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="525" y="398" text-anchor="middle" font-size="9" fill="#374151">every spend event: INCRBYFLOAT budget:{campaignId}:spent</text>

  <line x1="430" y1="418" x2="240" y2="418" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="335" y="412" text-anchor="middle" font-size="9" fill="#374151">pacing rate = dailyBudget / hoursRemaining; throttle bids</text>

  <line x1="240" y1="440" x2="90" y2="440" stroke="#2563eb" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="157" y="434" text-anchor="middle" font-size="9" fill="#374151">alert webhook: budget 90% consumed / CTR anomaly</text>

  <!-- Footer -->
  <rect x="8" y="458" width="884" height="36" rx="6" fill="#1a1822"/>
  <text x="90" y="474" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">Event Dedup</text>
  <text x="90" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">Redis SETNX 60s</text>
  <text x="255" y="474" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Aggregation</text>
  <text x="255" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">Flink 1-min window</text>
  <text x="450" y="474" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">OLAP Engine</text>
  <text x="450" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">ClickHouse columnar</text>
  <text x="645" y="474" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Live Cache</text>
  <text x="645" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">Redis 60s TTL</text>
  <text x="820" y="474" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Budget Guard</text>
  <text x="820" y="488" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">Redis INCRBYFLOAT</text>
</svg>
