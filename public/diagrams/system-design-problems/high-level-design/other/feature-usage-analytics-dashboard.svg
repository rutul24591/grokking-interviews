<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="960" height="580" fill="#f3f6f3"/>
  <text x="480" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f1e10">Feature Usage Analytics Dashboard</text>
  <text x="480" y="48" text-anchor="middle" font-size="11" fill="#2f9d74">Event SDK · Kafka ingestion · ClickHouse · Funnel · Retention cohorts · Feature flag correlation</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-b" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2266c8"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-p" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c84444"/>
    </marker>
  </defs>

  <!-- ══════════ ROW 1: Event Collection ══════════ -->
  <rect x="14" y="60" width="932" height="20" rx="4" fill="#2f9d74" opacity="0.15"/>
  <text x="480" y="74" text-anchor="middle" font-size="10" fill="#2f9d74" font-weight="bold" letter-spacing="1">EVENT COLLECTION — JS SDK batching · PII stripping · Kafka 100K ev/s</text>

  <!-- SDK -->
  <rect x="22" y="88" width="154" height="72" rx="8" fill="#2f9d74"/>
  <text x="99" y="107" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">JavaScript SDK</text>
  <text x="99" y="121" text-anchor="middle" font-size="9" fill="#d0ffe8">page() · track(event, props)</text>
  <text x="99" y="134" text-anchor="middle" font-size="9" fill="#d0ffe8">identify(userId, traits)</text>
  <text x="99" y="147" text-anchor="middle" font-size="9" fill="#d0ffe8">batch: 10s or 50 events</text>
  <text x="99" y="157" text-anchor="middle" font-size="8" fill="#b0eed0">navigator.sendBeacon on unload</text>

  <line x1="176" y1="124" x2="200" y2="124" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Ingestion API -->
  <rect x="202" y="88" width="160" height="72" rx="8" fill="#0f1e10"/>
  <text x="282" y="107" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Event Ingestion API</text>
  <text x="282" y="121" text-anchor="middle" font-size="9" fill="#90c890">POST /v1/events (batch 1000)</text>
  <text x="282" y="134" text-anchor="middle" font-size="9" fill="#90c890">schema validate + dedup</text>
  <text x="282" y="147" text-anchor="middle" font-size="9" fill="#90c890">reject ts &gt;72h old</text>
  <text x="282" y="157" text-anchor="middle" font-size="8" fill="#608060">hash partition by userId</text>

  <line x1="362" y1="124" x2="386" y2="124" stroke="#0f1e10" stroke-width="2" marker-end="url(#arr)"/>

  <!-- PII Stripper -->
  <rect x="388" y="88" width="134" height="72" rx="8" fill="#c84444"/>
  <text x="455" y="107" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">PII Stripper</text>
  <text x="455" y="121" text-anchor="middle" font-size="9" fill="#ffe0e0">regex: email · phone · CC</text>
  <text x="455" y="134" text-anchor="middle" font-size="9" fill="#ffe0e0">replace → [PII_REMOVED]</text>
  <text x="455" y="147" text-anchor="middle" font-size="9" fill="#ffe0e0">before Kafka write</text>
  <text x="455" y="157" text-anchor="middle" font-size="8" fill="#ffb0b0">sampling: 1-in-10 high-freq</text>

  <line x1="522" y1="124" x2="546" y2="124" stroke="#c84444" stroke-width="2" marker-end="url(#arr-r)"/>

  <!-- Kafka -->
  <rect x="548" y="88" width="104" height="72" rx="8" fill="#2266c8"/>
  <text x="600" y="107" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Kafka</text>
  <text x="600" y="121" text-anchor="middle" font-size="9" fill="#cce0ff">events topic</text>
  <text x="600" y="134" text-anchor="middle" font-size="9" fill="#cce0ff">100K ev/s peak</text>
  <text x="600" y="147" text-anchor="middle" font-size="9" fill="#cce0ff">userId hash partition</text>
  <text x="600" y="157" text-anchor="middle" font-size="8" fill="#aaccff">durable · ordered per user</text>

  <!-- SDK event schema box -->
  <rect x="668" y="82" width="272" height="84" rx="8" fill="#fff" stroke="#b8d8c8"/>
  <text x="684" y="100" font-size="10" fill="#2f9d74" font-weight="bold">Event Schema</text>
  <text x="684" y="115" font-size="9" fill="#333">{ eventName, timestamp, anonymousId, userId</text>
  <text x="684" y="128" font-size="9" fill="#333">  sessionId, properties{}, context{} }</text>
  <text x="684" y="142" font-size="9" fill="#555">context: SDK ver · page URL · referrer</text>
  <text x="684" y="156" font-size="9" fill="#555">     user-agent · screen · timezone</text>

  <!-- ══════════ ROW 2: Processing Layer ══════════ -->
  <rect x="14" y="176" width="932" height="20" rx="4" fill="#2266c8" opacity="0.10"/>
  <text x="480" y="190" text-anchor="middle" font-size="10" fill="#2266c8" font-weight="bold" letter-spacing="1">PROCESSING LAYER — Flink enrichment · ClickHouse columnar · Spark nightly cohorts</text>

  <!-- Flink -->
  <rect x="22" y="204" width="220" height="76" rx="8" fill="#2266c8"/>
  <text x="132" y="222" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Flink Enrichment Pipeline</text>
  <text x="132" y="236" text-anchor="middle" font-size="9" fill="#cce0ff">join user profile: plan · country · cohort</text>
  <text x="132" y="249" text-anchor="middle" font-size="9" fill="#cce0ff">join feature flags: variant assignment</text>
  <text x="132" y="262" text-anchor="middle" font-size="9" fill="#cce0ff">fan-out: → ClickHouse + → Redis</text>
  <text x="132" y="272" text-anchor="middle" font-size="8" fill="#aaccff">checkpoint every 60s; exactly-once</text>

  <line x1="600" y1="160" x2="242" y2="204" stroke="#2266c8" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <line x1="242" y1="242" x2="266" y2="242" stroke="#2266c8" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- ClickHouse -->
  <rect x="268" y="204" width="198" height="76" rx="8" fill="#6d5bd0"/>
  <text x="367" y="222" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">ClickHouse (MergeTree)</text>
  <text x="367" y="236" text-anchor="middle" font-size="9" fill="#e0daff">PARTITION BY toYYYYMM(event_date)</text>
  <text x="367" y="249" text-anchor="middle" font-size="9" fill="#e0daff">ORDER BY (project_id, user_id, event_ts)</text>
  <text x="367" y="262" text-anchor="middle" font-size="9" fill="#e0daff">LowCardinality(event_name)</text>
  <text x="367" y="272" text-anchor="middle" font-size="8" fill="#c0b8f8">co-located user events → fast funnel scan</text>

  <line x1="466" y1="242" x2="490" y2="242" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- Redis -->
  <rect x="492" y="204" width="148" height="76" rx="8" fill="#d97843"/>
  <text x="566" y="222" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Redis Real-Time</text>
  <text x="566" y="236" text-anchor="middle" font-size="9" fill="#fff5e8">DAU counter · active 5min</text>
  <text x="566" y="249" text-anchor="middle" font-size="9" fill="#fff5e8">hourly event volume</text>
  <text x="566" y="262" text-anchor="middle" font-size="9" fill="#fff5e8">TTL 5 minutes</text>
  <text x="566" y="272" text-anchor="middle" font-size="8" fill="#ffe0c0">&lt;2s dashboard reads</text>

  <!-- Spark nightly -->
  <rect x="658" y="204" width="282" height="76" rx="8" fill="#fff" stroke="#b8d8c8"/>
  <text x="674" y="222" font-size="10" fill="#2f9d74" font-weight="bold">Spark Nightly Batch — Retention Cohorts</text>
  <text x="674" y="237" font-size="9" fill="#333">1. Find cohort entry: first occurrence of event A per user</text>
  <text x="674" y="251" font-size="9" fill="#333">2. Find return events: subsequent event B occurrences</text>
  <text x="674" y="264" font-size="9" fill="#333">3. Aggregate: cohort_week × n_day → users retained</text>
  <text x="674" y="276" font-size="9" fill="#2f9d74">→ ClickHouse cohort_aggregates table (pre-computed)</text>

  <!-- ══════════ ROW 3: Funnel Query Deep Dive ══════════ -->
  <rect x="14" y="296" width="932" height="20" rx="4" fill="#6d5bd0" opacity="0.10"/>
  <text x="480" y="310" text-anchor="middle" font-size="10" fill="#6d5bd0" font-weight="bold" letter-spacing="1">FUNNEL ANALYSIS — ClickHouse windowFunnel · Feature flag correlation</text>

  <!-- Funnel query code block -->
  <rect x="22" y="324" width="460" height="100" rx="8" fill="#1a1825"/>
  <text x="38" y="342" font-size="9" fill="#9b7cf4" font-weight="bold">-- ClickHouse windowFunnel (7-day window)</text>
  <text x="38" y="356" font-size="9" fill="#60d080">SELECT</text>
  <text x="38" y="369" font-size="9" fill="#fff">  countIf(level &gt;= 1) AS step1_signed_up,</text>
  <text x="38" y="382" font-size="9" fill="#fff">  countIf(level &gt;= 2) AS step2_feature_viewed,</text>
  <text x="38" y="395" font-size="9" fill="#fff">  countIf(level &gt;= 3) AS step3_feature_used</text>
  <text x="38" y="408" font-size="9" fill="#60d080">FROM</text>
  <text x="38" y="418" font-size="9" fill="#e8d080">  (SELECT userId, windowFunnel(604800)(event_ts,</text>
  <text x="38" y="430" font-size="8" fill="#e8d080">   event='Signed Up', event='Feature Viewed', event='Feature Used') level ...)</text>

  <!-- Funnel visual -->
  <rect x="498" y="324" width="200" height="100" rx="8" fill="#fff" stroke="#c0b8d8"/>
  <text x="598" y="342" text-anchor="middle" font-size="10" fill="#6d5bd0" font-weight="bold">Funnel Visualization</text>
  <!-- Funnel steps -->
  <rect x="514" y="350" width="168" height="16" rx="3" fill="#6d5bd0"/>
  <text x="598" y="362" text-anchor="middle" font-size="8" fill="#fff">Signed Up: 10,000 (100%)</text>
  <rect x="524" y="372" width="148" height="16" rx="3" fill="#9b7cf4"/>
  <text x="598" y="384" text-anchor="middle" font-size="8" fill="#fff">Feature Viewed: 7,200 (72%)</text>
  <rect x="544" y="394" width="108" height="16" rx="3" fill="#c0a8ff"/>
  <text x="598" y="406" text-anchor="middle" font-size="8" fill="#333">Feature Used: 4,320 (43%)</text>
  <text x="514" y="420" font-size="8" fill="#c84444">Drop-off: 28% at view → use</text>

  <!-- Feature flag correlation -->
  <rect x="712" y="324" width="226" height="100" rx="8" fill="#fff3e8" stroke="#d97843"/>
  <text x="728" y="342" font-size="10" fill="#d97843" font-weight="bold">Feature Flag Correlation</text>
  <text x="728" y="357" font-size="9" fill="#333">JOIN feature_flag_called on userId</text>
  <text x="728" y="371" font-size="9" fill="#333">segment funnel by variant:</text>
  <text x="728" y="385" font-size="9" fill="#2f9d74">Flag ON  →  43% conversion</text>
  <text x="728" y="399" font-size="9" fill="#c84444">Flag OFF →  31% conversion</text>
  <text x="728" y="413" font-size="9" fill="#333">z-test p-value: 0.002 ✓ significant</text>

  <!-- ══════════ ROW 4: Serving + Privacy ══════════ -->
  <rect x="14" y="438" width="932" height="20" rx="4" fill="#d97843" opacity="0.10"/>
  <text x="480" y="452" text-anchor="middle" font-size="10" fill="#d97843" font-weight="bold" letter-spacing="1">SERVING LAYER + PRIVACY — Dashboard · Async queries · GDPR erasure</text>

  <!-- Query API -->
  <rect x="22" y="466" width="200" height="90" rx="8" fill="#0f1e10"/>
  <text x="122" y="484" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Analytics Query API</text>
  <text x="122" y="498" text-anchor="middle" font-size="9" fill="#90c890">funnel: windowFunnel ClickHouse 2–5s</text>
  <text x="122" y="511" text-anchor="middle" font-size="9" fill="#90c890">retention: cohort_aggregates &lt;100ms</text>
  <text x="122" y="524" text-anchor="middle" font-size="9" fill="#90c890">real-time: Redis DAU/active &lt;2s</text>
  <text x="122" y="537" text-anchor="middle" font-size="8" fill="#608060">async job queue for &gt;10s queries</text>
  <text x="122" y="549" text-anchor="middle" font-size="8" fill="#608060">SSE push result when complete</text>

  <line x1="222" y1="511" x2="246" y2="511" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Dashboard panels -->
  <rect x="248" y="466" width="220" height="90" rx="8" fill="#2f9d74"/>
  <text x="358" y="484" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Product Dashboard</text>
  <text x="358" y="498" text-anchor="middle" font-size="9" fill="#d0ffe8">funnel: step conversions + drop-off %</text>
  <text x="358" y="511" text-anchor="middle" font-size="9" fill="#d0ffe8">retention: cohort heatmap N-day %</text>
  <text x="358" y="524" text-anchor="middle" font-size="9" fill="#d0ffe8">feature flag: A/B metric comparison</text>
  <text x="358" y="537" text-anchor="middle" font-size="8" fill="#b0eed0">live: DAU · active users · event/hr</text>
  <text x="358" y="549" text-anchor="middle" font-size="8" fill="#b0eed0">query builder: any event sequence</text>

  <!-- Privacy box -->
  <rect x="484" y="460" width="460" height="102" rx="8" fill="#fff" stroke="#b8d8c8"/>
  <text x="500" y="478" font-size="10" fill="#2f9d74" font-weight="bold">Privacy &amp; Data Controls</text>
  <text x="500" y="493" font-size="9" fill="#c84444" font-weight="bold">GDPR Erasure:</text>
  <text x="500" y="507" font-size="9" fill="#333">  DELETE all events for userId via ClickHouse mutation (async, &lt;24h)</text>
  <text x="500" y="521" font-size="9" fill="#d97843" font-weight="bold">Sampling:</text>
  <text x="500" y="535" font-size="9" fill="#333">  1-in-10 for high-freq events (deterministic: userId hash mod 10)</text>
  <text x="500" y="549" font-size="9" fill="#333">  query results multiply by sample_rate for unbiased estimates</text>
  <text x="500" y="561" font-size="9" fill="#333">Retention: drop monthly ClickHouse partition (O(1) metadata op · 12–24mo)</text>
</svg>
