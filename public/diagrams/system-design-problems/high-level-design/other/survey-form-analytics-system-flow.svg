<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" role="img" aria-label="Survey Form Analytics System: lifecycle and rollback">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#0f766e"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#c2410c"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#be123c"/></marker>
  </defs>
  <rect x="18" y="18" width="924" height="524" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="54" y="56" font-size="18" font-weight="700" fill="#172033">Survey Form Analytics System: lifecycle and rollback</text>
  <text x="54" y="78" font-size="11.5" fill="#526074">A committed state appears only after policy, ordering, and recovery decisions.</text>
  <rect x="48" y="112" width="864" height="276" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1"/>
  <text x="68" y="135" font-size="12.5" font-weight="700" fill="#2563eb">USER-VISIBLE LIFECYCLE</text><line x1="90" y1="216" x2="862" y2="216" stroke="#cbd5e1" stroke-width="3"/><circle cx="90" cy="216" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="90" y="272" text-anchor="middle" font-size="10.5" font-weight="700" fill="#172033">user intent</text>
    <text x="90" y="296" text-anchor="middle" font-size="10" fill="#526074">intent</text><line x1="114" y1="216" x2="210" y2="216" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/><circle cx="238" cy="216" r="22" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
    <text x="238" y="272" text-anchor="middle" font-size="10.5" font-weight="700" fill="#172033">edge gateway</text>
    <text x="238" y="296" text-anchor="middle" font-size="10" fill="#526074">stage 1</text><line x1="262" y1="216" x2="358" y2="216" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arrow-teal)"/><circle cx="386" cy="216" r="22" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
    <text x="386" y="272" text-anchor="middle" font-size="10.5" font-weight="700" fill="#172033">domain service</text>
    <text x="386" y="296" text-anchor="middle" font-size="10" fill="#526074">stage 2</text><line x1="410" y1="216" x2="506" y2="216" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/><circle cx="534" cy="216" r="22" fill="#f5f3ff" stroke="#6d28d9" stroke-width="2"/>
    <text x="534" y="272" text-anchor="middle" font-size="10.5" font-weight="700" fill="#172033">durable state</text>
    <text x="534" y="296" text-anchor="middle" font-size="10" fill="#526074">stage 3</text><line x1="558" y1="216" x2="654" y2="216" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arrow-teal)"/><circle cx="682" cy="216" r="22" fill="#fff1f2" stroke="#be123c" stroke-width="2"/>
    <text x="682" y="272" text-anchor="middle" font-size="10.5" font-weight="700" fill="#172033">worker plane</text>
    <text x="682" y="296" text-anchor="middle" font-size="10" fill="#526074">stage 4</text><line x1="706" y1="216" x2="802" y2="216" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/><circle cx="830" cy="216" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="830" y="272" text-anchor="middle" font-size="10.5" font-weight="700" fill="#172033">client projection</text>
    <text x="830" y="296" text-anchor="middle" font-size="10" fill="#526074">visible state</text><path d="M460 316 L504 350 L460 384 L416 350 Z" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="460" y="354" text-anchor="middle" font-size="10.5" font-weight="700" fill="#172033">policy pass?</text><line x1="504" y1="350" x2="646" y2="350" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arrow-teal)"/><line x1="416" y1="350" x2="274" y2="350" stroke="#be123c" stroke-width="2.4" stroke-dasharray="7 6" marker-end="url(#arrow-rose)"/><text x="670" y="354" font-size="10.5" font-weight="700" fill="#0f766e">commit and expose</text>
  <text x="156" y="354" font-size="10.5" font-weight="700" fill="#be123c">deny, retry, or degrade</text><rect x="48" y="414" width="864" height="82" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="1.1"/>
  <text x="68" y="437" font-size="12.5" font-weight="700" fill="#c2410c">PRESSURE QUESTIONS</text><text x="76" y="457" font-size="11" fill="#172033">What is idempotent? Which stage can be stale? Where is ordering enforced? How does rollback change the visible state?</text>
  <text x="76" y="480" font-size="11" fill="#172033">Track latency budget, queue age, policy denials, stale projections, retries, and user-visible fallback rate.</text>
</svg>
