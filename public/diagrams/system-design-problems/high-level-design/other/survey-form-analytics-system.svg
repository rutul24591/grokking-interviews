<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="960" height="560" fill="#f4f2fb"/>
  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1530">Survey / Form Analytics System</text>
  <text x="480" y="50" text-anchor="middle" font-size="11" fill="#6d5bd0">Form delivery · Response ingestion · Analytics pipeline · Funnel &amp; drop-off · Export</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c84444"/>
    </marker>
    <marker id="arr-b" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2266c8"/>
    </marker>
  </defs>

  <!-- ══════════ ROW 1: Form Delivery ══════════ -->
  <rect x="14" y="62" width="932" height="20" rx="4" fill="#6d5bd0" opacity="0.14"/>
  <text x="480" y="76" text-anchor="middle" font-size="10" fill="#6d5bd0" font-weight="bold" letter-spacing="1">FORM DELIVERY PLANE — CDN-cached, client-side conditional logic</text>

  <rect x="22" y="88" width="120" height="50" rx="8" fill="#6d5bd0"/>
  <text x="82" y="108" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Form Builder UI</text>
  <text x="82" y="122" text-anchor="middle" font-size="9" fill="#e0daff">drag-drop questions</text>
  <text x="82" y="132" text-anchor="middle" font-size="9" fill="#e0daff">conditional logic</text>

  <line x1="142" y1="113" x2="166" y2="113" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="168" y="88" width="120" height="50" rx="8" fill="#6d5bd0"/>
  <text x="228" y="108" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Form Schema</text>
  <text x="228" y="120" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Store (PG)</text>
  <text x="228" y="132" text-anchor="middle" font-size="9" fill="#e0daff">versioned · immutable</text>

  <line x1="288" y1="113" x2="312" y2="113" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="314" y="88" width="110" height="50" rx="8" fill="#2f9d74"/>
  <text x="369" y="107" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">CDN Cache</text>
  <text x="369" y="120" text-anchor="middle" font-size="9" fill="#d0ffe8">max-age=3600</text>
  <text x="369" y="132" text-anchor="middle" font-size="9" fill="#d0ffe8">global edge nodes</text>

  <line x1="424" y1="113" x2="448" y2="113" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>

  <rect x="450" y="88" width="130" height="50" rx="8" fill="#1a1530"/>
  <text x="515" y="107" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Respondent Browser</text>
  <text x="515" y="120" text-anchor="middle" font-size="9" fill="#c0b8d8">client-side cond. logic</text>
  <text x="515" y="132" text-anchor="middle" font-size="9" fill="#c0b8d8">page-by-page save</text>

  <!-- Key: versions + partial save callout -->
  <rect x="598" y="82" width="342" height="64" rx="8" fill="#fff" stroke="#d0c8f0"/>
  <text x="615" y="98" font-size="10" fill="#6d5bd0" font-weight="bold">Form Versioning + Partial Recovery</text>
  <text x="615" y="112" font-size="9" fill="#444">• Publish → new immutable versionId; responses tagged to version</text>
  <text x="615" y="124" font-size="9" fill="#444">• Page submit → PATCH /responses/{id}/pages/{n} saved immediately</text>
  <text x="615" y="136" font-size="9" fill="#444">• Resume token in localStorage or email link — at most 1 page lost</text>

  <!-- ══════════ ROW 2: Response Ingestion ══════════ -->
  <rect x="14" y="160" width="932" height="20" rx="4" fill="#d97843" opacity="0.14"/>
  <text x="480" y="174" text-anchor="middle" font-size="10" fill="#d97843" font-weight="bold" letter-spacing="1">RESPONSE INGESTION PLANE — 200ms P99, three-layer validation</text>

  <!-- Respondent submits -->
  <rect x="22" y="190" width="104" height="48" rx="8" fill="#1a1530"/>
  <text x="74" y="210" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Respondent</text>
  <text x="74" y="222" text-anchor="middle" font-size="9" fill="#c0b8d8">submit answers</text>
  <text x="74" y="234" text-anchor="middle" font-size="9" fill="#c0b8d8">PATCH or POST</text>

  <line x1="126" y1="214" x2="148" y2="214" stroke="#1a1530" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Spam filter -->
  <rect x="150" y="190" width="118" height="48" rx="8" fill="#c84444"/>
  <text x="209" y="208" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Spam / Bot Filter</text>
  <text x="209" y="221" text-anchor="middle" font-size="9" fill="#ffe0e0">honeypot field check</text>
  <text x="209" y="233" text-anchor="middle" font-size="9" fill="#ffe0e0">IP rate limit · fingerprint</text>

  <line x1="268" y1="214" x2="292" y2="214" stroke="#c84444" stroke-width="2" marker-end="url(#arr-r)"/>

  <!-- Answer validator -->
  <rect x="294" y="190" width="118" height="48" rx="8" fill="#d97843"/>
  <text x="353" y="208" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Answer Validator</text>
  <text x="353" y="221" text-anchor="middle" font-size="9" fill="#fff5e8">type · required · range</text>
  <text x="353" y="233" text-anchor="middle" font-size="9" fill="#fff5e8">cond. logic re-validate</text>

  <line x1="412" y1="214" x2="436" y2="214" stroke="#d97843" stroke-width="2" marker-end="url(#arr-o)"/>

  <!-- Raw store + Kafka -->
  <rect x="438" y="190" width="140" height="48" rx="8" fill="#6d5bd0"/>
  <text x="508" y="207" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Raw Response Store</text>
  <text x="508" y="220" text-anchor="middle" font-size="9" fill="#e0daff">PostgreSQL (normalized)</text>
  <text x="508" y="233" text-anchor="middle" font-size="9" fill="#e0daff">S3 (file attachments)</text>

  <line x1="578" y1="214" x2="602" y2="214" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="604" y="190" width="100" height="48" rx="8" fill="#2f9d74"/>
  <text x="654" y="210" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Kafka</text>
  <text x="654" y="222" text-anchor="middle" font-size="9" fill="#d0ffe8">responses topic</text>
  <text x="654" y="234" text-anchor="middle" font-size="9" fill="#d0ffe8">outbox pattern</text>

  <!-- 200ms label -->
  <rect x="718" y="190" width="214" height="48" rx="8" fill="#fff" stroke="#2f9d74"/>
  <text x="730" y="207" font-size="10" fill="#2f9d74" font-weight="bold">Response API SLA</text>
  <text x="730" y="221" font-size="9" fill="#333">POST /responses → 200 OK in &lt;200ms P99</text>
  <text x="730" y="233" font-size="9" fill="#333">Kafka publish async (transactional outbox)</text>

  <!-- ══════════ ROW 3: Analytics Computation ══════════ -->
  <rect x="14" y="254" width="932" height="20" rx="4" fill="#2f9d74" opacity="0.14"/>
  <text x="480" y="268" text-anchor="middle" font-size="10" fill="#2f9d74" font-weight="bold" letter-spacing="1">ANALYTICS COMPUTATION — Flink streaming · ClickHouse · Redis hot cache</text>

  <!-- Flink -->
  <rect x="22" y="282" width="210" height="66" rx="8" fill="#2f9d74"/>
  <text x="127" y="299" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Flink Streaming Pipeline</text>
  <text x="127" y="312" text-anchor="middle" font-size="9" fill="#d0ffe8">response count · completion rate</text>
  <text x="127" y="325" text-anchor="middle" font-size="9" fill="#d0ffe8">NPS score · answer distributions</text>
  <text x="127" y="338" text-anchor="middle" font-size="8" fill="#b0eed0">per-question drop-off · avg completion time</text>

  <line x1="604" y1="214" x2="127" y2="282" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <line x1="232" y1="315" x2="276" y2="315" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>

  <!-- ClickHouse -->
  <rect x="278" y="282" width="160" height="66" rx="8" fill="#6d5bd0"/>
  <text x="358" y="299" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">ClickHouse</text>
  <text x="358" y="312" text-anchor="middle" font-size="9" fill="#e0daff">answer_events table</text>
  <text x="358" y="325" text-anchor="middle" font-size="9" fill="#e0daff">partitioned by form_id+date</text>
  <text x="358" y="338" text-anchor="middle" font-size="8" fill="#c0b8f8">GROUP BY queries &lt;100ms / 10M rows</text>

  <line x1="438" y1="315" x2="462" y2="315" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Redis -->
  <rect x="464" y="282" width="148" height="66" rx="8" fill="#d97843"/>
  <text x="538" y="299" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Redis Hot Cache</text>
  <text x="538" y="312" text-anchor="middle" font-size="9" fill="#fff5e8">response count</text>
  <text x="538" y="325" text-anchor="middle" font-size="9" fill="#fff5e8">completion rate · NPS</text>
  <text x="538" y="338" text-anchor="middle" font-size="8" fill="#ffe0c0">TTL 60s · &lt;5ms reads</text>

  <!-- Funnel / drop-off explanation -->
  <rect x="628" y="276" width="314" height="78" rx="8" fill="#fff" stroke="#d0c8f0"/>
  <text x="645" y="294" font-size="10" fill="#6d5bd0" font-weight="bold">Funnel &amp; Drop-off Computation</text>
  <text x="645" y="308" font-size="9" fill="#333">respondents_reached(Qn) = responses where last_page ≥ page(Qn)</text>
  <text x="645" y="322" font-size="9" fill="#333">drop_off(Qn) = 1 − reached(Qn+1) / reached(Qn)</text>
  <text x="645" y="336" font-size="9" fill="#c84444" font-weight="bold">&gt;15% drop-off → "high abandonment" flag in dashboard</text>
  <text x="645" y="349" font-size="9" fill="#333">time-on-page = consecutive page save timestamp delta</text>

  <!-- ══════════ ROW 4: Analytics Delivery + Export ══════════ -->
  <rect x="14" y="362" width="932" height="20" rx="4" fill="#2266c8" opacity="0.10"/>
  <text x="480" y="376" text-anchor="middle" font-size="10" fill="#2266c8" font-weight="bold" letter-spacing="1">ANALYTICS DELIVERY — Real-time SSE push · Async export pipeline</text>

  <!-- Analytics API -->
  <rect x="22" y="390" width="148" height="60" rx="8" fill="#2266c8"/>
  <text x="96" y="409" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Analytics API</text>
  <text x="96" y="422" text-anchor="middle" font-size="9" fill="#cce0ff">REST + SSE push</text>
  <text x="96" y="435" text-anchor="middle" font-size="9" fill="#cce0ff">Redis Pub/Sub → SSE</text>
  <text x="96" y="447" text-anchor="middle" font-size="8" fill="#aaccff">FormMetricsUpdated event</text>

  <line x1="170" y1="420" x2="194" y2="420" stroke="#2266c8" stroke-width="2" marker-end="url(#arr-b)"/>

  <!-- Dashboard -->
  <rect x="196" y="390" width="148" height="60" rx="8" fill="#1a1530"/>
  <text x="270" y="409" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Creator Dashboard</text>
  <text x="270" y="422" text-anchor="middle" font-size="9" fill="#c0b8d8">live response counter</text>
  <text x="270" y="435" text-anchor="middle" font-size="9" fill="#c0b8d8">completion % · NPS chart</text>
  <text x="270" y="447" text-anchor="middle" font-size="8" fill="#a090c8">drop-off funnel heatmap</text>

  <!-- Export pipeline -->
  <rect x="370" y="390" width="280" height="60" rx="8" fill="#2f9d74" opacity="0.9"/>
  <text x="510" y="408" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Async Export Pipeline</text>
  <text x="510" y="421" text-anchor="middle" font-size="9" fill="#d0ffe8">POST /exports → jobId returned immediately</text>
  <text x="510" y="434" text-anchor="middle" font-size="9" fill="#d0ffe8">worker batches 1000 rows → CSV/XLSX → S3</text>
  <text x="510" y="447" font-size="8" fill="#b0eed0" text-anchor="middle">presigned URL emailed · idempotent (same params = same job)</text>

  <!-- Multi-tenant -->
  <rect x="668" y="390" width="274" height="60" rx="8" fill="#fff" stroke="#d0c8f0"/>
  <text x="685" y="408" font-size="10" fill="#6d5bd0" font-weight="bold">Multi-Tenant Access Control</text>
  <text x="685" y="422" font-size="9" fill="#333">Row-level security: WHERE workspace_id = ? (enforced by middleware)</text>
  <text x="685" y="435" font-size="9" fill="#333">Role: Owner/Analyst → response-level · Viewer → aggregate only</text>
  <text x="685" y="447" font-size="9" fill="#333">Quotas: form count · monthly response count · storage per plan</text>

  <!-- ══════════ ROW 5: Signal weights + SLA summary ══════════ -->
  <rect x="14" y="464" width="932" height="82" rx="8" fill="#fff" stroke="#d0c8f0"/>
  <text x="30" y="482" font-size="10" fill="#6d5bd0" font-weight="bold">Question Types Supported</text>
  <text x="30" y="496" font-size="9" fill="#444">Short / Long text · Single / Multi choice · Rating 1–10 · NPS 0–10 · Date · File upload · Matrix · Ranking</text>
  <text x="30" y="510" font-size="9" fill="#444">Conditional show/hide · Branching · Versioning on publish · Server-side re-validation of conditions on submit</text>

  <line x1="440" y1="468" x2="440" y2="542" stroke="#d0c8f0" stroke-width="1"/>

  <text x="456" y="482" font-size="10" fill="#2f9d74" font-weight="bold">Metric Freshness</text>
  <text x="456" y="496" font-size="9" fill="#333">Real-time metrics (Redis): &lt;60s after submission</text>
  <text x="456" y="510" font-size="9" fill="#333">Analytical queries (ClickHouse): &lt;100ms for 10M rows</text>

  <line x1="680" y1="468" x2="680" y2="542" stroke="#d0c8f0" stroke-width="1"/>

  <text x="696" y="482" font-size="10" fill="#c84444" font-weight="bold">Spam Signals</text>
  <text x="696" y="496" font-size="9" fill="#333">Honeypot field filled · IP &gt;10 subs/hr · duplicate fingerprint</text>
  <text x="696" y="510" font-size="9" fill="#333">GDPR: individual response deletion within 24h of request</text>
</svg>
