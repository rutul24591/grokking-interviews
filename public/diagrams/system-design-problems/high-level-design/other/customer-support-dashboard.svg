<svg viewBox="0 0 960 580" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="960" height="580" fill="#f3f5f8"/>
  <text x="480" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#0f1e2e">Customer Support Dashboard (Zendesk-like)</text>
  <text x="480" y="48" text-anchor="middle" font-size="11" fill="#2266c8">Multi-channel ingestion · Routing · SLA timers · Agent workspace · Real-time WebSocket · Reporting</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2266c8"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#c84444"/>
    </marker>
    <marker id="arr-p" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
  </defs>

  <!-- ══════════ ROW 1: Channel Ingestion ══════════ -->
  <rect x="14" y="60" width="932" height="20" rx="4" fill="#2266c8" opacity="0.12"/>
  <text x="480" y="74" text-anchor="middle" font-size="10" fill="#2266c8" font-weight="bold" letter-spacing="1">CHANNEL INGESTION — Email thread matching · Web chat · Web form · API</text>

  <!-- Email -->
  <rect x="22" y="88" width="100" height="56" rx="8" fill="#2266c8"/>
  <text x="72" y="107" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Email</text>
  <text x="72" y="120" text-anchor="middle" font-size="9" fill="#cce0ff">IMAP poll 30s</text>
  <text x="72" y="132" text-anchor="middle" font-size="9" fill="#cce0ff">or SMTP webhook</text>
  <text x="72" y="142" text-anchor="middle" font-size="8" fill="#aaccff">Message-ID match</text>

  <!-- Chat -->
  <rect x="138" y="88" width="100" height="56" rx="8" fill="#2266c8"/>
  <text x="188" y="107" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Web Chat</text>
  <text x="188" y="120" text-anchor="middle" font-size="9" fill="#cce0ff">WebSocket</text>
  <text x="188" y="132" text-anchor="middle" font-size="9" fill="#cce0ff">&lt;1s latency</text>
  <text x="188" y="142" text-anchor="middle" font-size="8" fill="#aaccff">session → ticket</text>

  <!-- Form -->
  <rect x="254" y="88" width="100" height="56" rx="8" fill="#2266c8"/>
  <text x="304" y="107" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Web Form</text>
  <text x="304" y="120" text-anchor="middle" font-size="9" fill="#cce0ff">POST endpoint</text>
  <text x="304" y="132" text-anchor="middle" font-size="9" fill="#cce0ff">JSON body</text>
  <text x="304" y="142" text-anchor="middle" font-size="8" fill="#aaccff">anonymous ok</text>

  <!-- API -->
  <rect x="370" y="88" width="100" height="56" rx="8" fill="#2266c8"/>
  <text x="420" y="107" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">REST API</text>
  <text x="420" y="120" text-anchor="middle" font-size="9" fill="#cce0ff">programmatic</text>
  <text x="420" y="132" text-anchor="middle" font-size="9" fill="#cce0ff">POST /tickets</text>
  <text x="420" y="142" text-anchor="middle" font-size="8" fill="#aaccff">OAuth 2.0</text>

  <!-- Channel Ingestion Svc -->
  <line x1="122" y1="116" x2="518" y2="116" stroke="#dde5f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="512" y1="88" x2="512" y2="88"/>
  <line x1="72" y1="144" x2="72" y2="158" stroke="#2266c8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="188" y1="144" x2="188" y2="158" stroke="#2266c8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="304" y1="144" x2="304" y2="158" stroke="#2266c8" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="420" y1="144" x2="420" y2="158" stroke="#2266c8" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="22" y="160" width="448" height="44" rx="8" fill="#0f1e2e"/>
  <text x="246" y="179" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Channel Ingestion Service</text>
  <text x="246" y="196" text-anchor="middle" font-size="9" fill="#a0b8d0">normalize → canonical Ticket + Message schema → write PostgreSQL + publish Kafka ticket-events</text>

  <line x1="470" y1="182" x2="514" y2="182" stroke="#2266c8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Kafka -->
  <rect x="516" y="160" width="100" height="44" rx="8" fill="#2f9d74"/>
  <text x="566" y="178" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Kafka</text>
  <text x="566" y="192" text-anchor="middle" font-size="9" fill="#d0ffe8">ticket-events</text>

  <!-- Thread matching box -->
  <rect x="634" y="82" width="296" height="128" rx="8" fill="#fff" stroke="#c0d0e8"/>
  <text x="650" y="100" font-size="10" fill="#2266c8" font-weight="bold">Email Thread Matching Logic</text>
  <text x="650" y="115" font-size="9" fill="#333">1. Extract Message-ID + References headers</text>
  <text x="650" y="129" font-size="9" fill="#2f9d74">2. References match existing thread_id → append message</text>
  <text x="650" y="143" font-size="9" fill="#d97843">3. No match → create new ticket (new thread anchor)</text>
  <text x="650" y="157" font-size="9" fill="#999">4. Fallback: same subject + sender (less reliable)</text>
  <text x="650" y="172" font-size="10" fill="#c84444" font-weight="bold">Chat: session_id maps directly to ticket</text>
  <text x="650" y="186" font-size="9" fill="#333">New session → new ticket; messages appended</text>

  <!-- ══════════ ROW 2: Routing + SLA ══════════ -->
  <rect x="14" y="220" width="932" height="20" rx="4" fill="#d97843" opacity="0.12"/>
  <text x="480" y="234" text-anchor="middle" font-size="10" fill="#d97843" font-weight="bold" letter-spacing="1">ROUTING ENGINE + SLA TRACKING</text>

  <!-- Routing engine -->
  <rect x="22" y="248" width="220" height="80" rx="8" fill="#d97843"/>
  <text x="132" y="267" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Routing Engine</text>
  <text x="132" y="281" text-anchor="middle" font-size="9" fill="#fff5e8">1. VIP flag → VIP queue</text>
  <text x="132" y="294" text-anchor="middle" font-size="9" fill="#fff5e8">2. Tag → agent skill match</text>
  <text x="132" y="307" text-anchor="middle" font-size="9" fill="#fff5e8">3. Fewest open tickets (load balance)</text>
  <text x="132" y="318" text-anchor="middle" font-size="8" fill="#ffe0c0">4. Fallback: round-robin default group</text>

  <line x1="566" y1="204" x2="242" y2="248" stroke="#2f9d74" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-g)"/>

  <line x1="242" y1="288" x2="266" y2="288" stroke="#d97843" stroke-width="2" marker-end="url(#arr-o)"/>

  <!-- Capacity tracker -->
  <rect x="268" y="248" width="160" height="80" rx="8" fill="#fff" stroke="#d97843"/>
  <text x="348" y="267" text-anchor="middle" font-size="10" fill="#d97843" font-weight="bold">Capacity Tracker</text>
  <text x="348" y="281" text-anchor="middle" font-size="9" fill="#333">Redis ZSET: score=open_tickets</text>
  <text x="348" y="294" text-anchor="middle" font-size="9" fill="#333">member=agent_id</text>
  <text x="348" y="307" text-anchor="middle" font-size="9" fill="#333">max_open default: 20</text>
  <text x="348" y="318" text-anchor="middle" font-size="8" fill="#888">atomic incr/decr on assign/resolve</text>

  <line x1="428" y1="288" x2="452" y2="288" stroke="#d97843" stroke-width="2" marker-end="url(#arr-o)"/>

  <!-- SLA Service -->
  <rect x="454" y="248" width="210" height="80" rx="8" fill="#c84444"/>
  <text x="559" y="267" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">SLA Service</text>
  <text x="559" y="281" text-anchor="middle" font-size="9" fill="#ffe0e0">ZSET score = breach_epoch</text>
  <text x="559" y="294" text-anchor="middle" font-size="9" fill="#ffe0e0">monitor every 30s ZRANGEBYSCORE</text>
  <text x="559" y="307" text-anchor="middle" font-size="9" fill="#ffe0e0">T−15min → agent notification</text>
  <text x="559" y="318" text-anchor="middle" font-size="8" fill="#ffb0b0">breach → escalation (reassign senior)</text>

  <!-- SLA pause/resume callout -->
  <rect x="682" y="242" width="250" height="92" rx="8" fill="#fff" stroke="#c0d0e8"/>
  <text x="698" y="260" font-size="10" fill="#c84444" font-weight="bold">SLA Clock Pause/Resume</text>
  <text x="698" y="275" font-size="9" fill="#333">Status → "Awaiting Customer Reply"</text>
  <text x="698" y="289" font-size="9" fill="#888">  → record pause_timestamp</text>
  <text x="698" y="303" font-size="9" fill="#333">Customer replies → status → "Open"</text>
  <text x="698" y="317" font-size="9" fill="#888">  → breach_time += pause_duration</text>
  <text x="698" y="329" font-size="9" fill="#2f9d74">SLA measures team time only, not customer wait</text>

  <!-- ══════════ ROW 3: Agent Workspace ══════════ -->
  <rect x="14" y="344" width="932" height="20" rx="4" fill="#6d5bd0" opacity="0.12"/>
  <text x="480" y="358" text-anchor="middle" font-size="10" fill="#6d5bd0" font-weight="bold" letter-spacing="1">AGENT WORKSPACE — WebSocket real-time · Unified inbox · Reply composer</text>

  <!-- WebSocket server -->
  <rect x="22" y="372" width="148" height="72" rx="8" fill="#6d5bd0"/>
  <text x="96" y="390" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Real-Time Service</text>
  <text x="96" y="403" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">(WebSocket/SSE)</text>
  <text x="96" y="416" text-anchor="middle" font-size="9" fill="#e0daff">agent presence Redis Hash</text>
  <text x="96" y="429" text-anchor="middle" font-size="9" fill="#e0daff">ws_id → node_id mapping</text>
  <text x="96" y="439" text-anchor="middle" font-size="8" fill="#c0b8f8">fan-out per agent assignment</text>

  <line x1="170" y1="408" x2="194" y2="408" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr-p)"/>

  <!-- Agent browser -->
  <rect x="196" y="372" width="200" height="72" rx="8" fill="#0f1e2e"/>
  <text x="296" y="390" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Agent Browser Workspace</text>
  <text x="296" y="403" text-anchor="middle" font-size="9" fill="#a0b8d0">unified inbox · sorted by SLA urgency</text>
  <text x="296" y="416" text-anchor="middle" font-size="9" fill="#a0b8d0">ticket detail: thread + customer profile</text>
  <text x="296" y="429" text-anchor="middle" font-size="9" fill="#a0b8d0">rich text reply · canned responses</text>
  <text x="296" y="439" text-anchor="middle" font-size="8" fill="#8090a8">internal notes · file attachments</text>

  <!-- Status machine -->
  <rect x="414" y="366" width="320" height="84" rx="8" fill="#fff" stroke="#c0d0e8"/>
  <text x="430" y="384" font-size="10" fill="#2266c8" font-weight="bold">Ticket Status State Machine</text>
  <!-- States -->
  <rect x="430" y="392" width="48" height="20" rx="4" fill="#2266c8"/>
  <text x="454" y="406" text-anchor="middle" font-size="8" fill="#fff">New</text>
  <line x1="478" y1="402" x2="494" y2="402" stroke="#2266c8" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="496" y="392" width="48" height="20" rx="4" fill="#d97843"/>
  <text x="520" y="406" text-anchor="middle" font-size="8" fill="#fff">Open</text>
  <line x1="544" y1="402" x2="560" y2="402" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <rect x="562" y="392" width="52" height="20" rx="4" fill="#888"/>
  <text x="588" y="406" text-anchor="middle" font-size="8" fill="#fff">Pending</text>
  <line x1="614" y1="402" x2="630" y2="402" stroke="#888" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="632" y="392" width="58" height="20" rx="4" fill="#2f9d74"/>
  <text x="661" y="406" text-anchor="middle" font-size="8" fill="#fff">Resolved</text>
  <line x1="690" y1="402" x2="706" y2="402" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <rect x="708" y="392" width="48" height="20" rx="4" fill="#444"/>
  <text x="732" y="406" text-anchor="middle" font-size="8" fill="#fff">Closed</text>
  <text x="430" y="432" font-size="9" fill="#333">Pending = awaiting customer (SLA clock paused)</text>
  <text x="430" y="444" font-size="9" fill="#888">Concurrent viewers tracked in Redis Set(ticket_id → {agent_ids})</text>

  <!-- Collision resolution -->
  <rect x="750" y="366" width="196" height="84" rx="8" fill="#fff3e8" stroke="#d97843"/>
  <text x="766" y="384" font-size="10" fill="#d97843" font-weight="bold">Concurrent Reply Conflict</text>
  <text x="766" y="399" font-size="9" fill="#333">Two agents draft reply simultaneously</text>
  <text x="766" y="412" font-size="9" fill="#2f9d74">→ First submit wins (no lock needed)</text>
  <text x="766" y="426" font-size="9" fill="#c84444">→ Second submit: 409 error</text>
  <text x="766" y="440" font-size="9" fill="#333">Draft preserved · user notified</text>
  <text x="766" y="446" font-size="8" fill="#888">optimistic concurrency via reply version</text>

  <!-- ══════════ ROW 4: Reporting ══════════ -->
  <rect x="14" y="462" width="932" height="20" rx="4" fill="#2f9d74" opacity="0.12"/>
  <text x="480" y="476" text-anchor="middle" font-size="10" fill="#2f9d74" font-weight="bold" letter-spacing="1">REPORTING PIPELINE — Kafka → ClickHouse · Nightly Spark · Redis live counters</text>

  <rect x="22" y="490" width="200" height="72" rx="8" fill="#2f9d74"/>
  <text x="122" y="508" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">ClickHouse Analytics Store</text>
  <text x="122" y="521" text-anchor="middle" font-size="9" fill="#d0ffe8">ticket lifecycle events (1 row/event)</text>
  <text x="122" y="534" text-anchor="middle" font-size="9" fill="#d0ffe8">avg first-response · CSAT · SLA breach%</text>
  <text x="122" y="547" text-anchor="middle" font-size="8" fill="#b0eed0">Spark nightly snapshots → report_snapshots</text>

  <line x1="222" y1="526" x2="246" y2="526" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>

  <rect x="248" y="490" width="172" height="72" rx="8" fill="#0f1e2e"/>
  <text x="334" y="508" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Reporting Dashboard</text>
  <text x="334" y="521" text-anchor="middle" font-size="9" fill="#a0b8d0">avg FRT by group/agent/channel</text>
  <text x="334" y="534" text-anchor="middle" font-size="9" fill="#a0b8d0">SLA breach rate · ticket volume</text>
  <text x="334" y="547" text-anchor="middle" font-size="8" fill="#8090a8">daily/weekly supervisor email reports</text>

  <!-- Metrics summary table -->
  <rect x="440" y="484" width="500" height="78" rx="8" fill="#fff" stroke="#c0d0e8"/>
  <text x="456" y="502" font-size="10" fill="#2266c8" font-weight="bold">Key Metrics &amp; SLAs</text>
  <text x="456" y="517" font-size="9" fill="#333">Chat message → agent: <tspan font-weight="bold" fill="#2f9d74">&lt;1 second</tspan>   Ticket assignment push: <tspan font-weight="bold" fill="#2266c8">&lt;2 seconds</tspan></text>
  <text x="456" y="531" font-size="9" fill="#333">SLA warning: <tspan font-weight="bold" fill="#d97843">T−15min email</tspan>   SLA breach: <tspan font-weight="bold" fill="#c84444">auto-escalate to senior agent</tspan></text>
  <text x="456" y="545" font-size="9" fill="#333">10K concurrent agents · 500 agents/org · 100K open tickets/org</text>
  <text x="456" y="557" font-size="9" fill="#333">Isolation: org_id WHERE clause enforced by JWT middleware · Redis key prefix per org</text>
</svg>
