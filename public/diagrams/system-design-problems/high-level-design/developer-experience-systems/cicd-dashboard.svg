<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="600" fill="#f3f1f8"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">CI/CD Dashboard (GitHub Actions Style)</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="14" y="52" width="80" height="36" rx="7" fill="#6d5bd0"/>
  <text x="54" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Developer</text>
  <text x="54" y="82" text-anchor="middle" font-size="9" fill="#edeaf5">Browser UI</text>

  <rect x="152" y="52" width="90" height="36" rx="7" fill="#2563eb"/>
  <text x="197" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Runs API</text>
  <text x="197" y="82" text-anchor="middle" font-size="9" fill="#dbeafe">REST + SSE</text>

  <rect x="308" y="52" width="90" height="36" rx="7" fill="#2f9d74"/>
  <text x="353" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Log Stream</text>
  <text x="353" y="82" text-anchor="middle" font-size="9" fill="#d1fae5">SSE EventSource</text>

  <rect x="462" y="52" width="90" height="36" rx="7" fill="#d97843"/>
  <text x="507" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">DAG Engine</text>
  <text x="507" y="82" text-anchor="middle" font-size="9" fill="#fef3c7">topo sort + SVG</text>

  <rect x="616" y="52" width="90" height="36" rx="7" fill="#7c3aed"/>
  <text x="661" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Gate API</text>
  <text x="661" y="82" text-anchor="middle" font-size="9" fill="#ede9fe">approval + audit</text>

  <rect x="786" y="52" width="90" height="36" rx="7" fill="#be123c"/>
  <text x="831" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Flaky API</text>
  <text x="831" y="82" text-anchor="middle" font-size="9" fill="#fecdd3">pass-rate cron</text>

  <!-- Lifelines -->
  <line x1="54" y1="88" x2="54" y2="566" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="197" y1="88" x2="197" y2="566" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="353" y1="88" x2="353" y2="566" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="507" y1="88" x2="507" y2="566" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="661" y1="88" x2="661" y2="566" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="831" y1="88" x2="831" y2="566" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- BAND A: Run List + SSE -->
  <rect x="8" y="98" width="878" height="16" rx="3" fill="#2563eb" opacity="0.2"/>
  <text x="450" y="110" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">PATH A — RUN LIST + SSE UPDATES (GET runs; EventSource /runs/events; Last-Event-ID resume)</text>

  <line x1="54" y1="128" x2="187" y2="128" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="120" y="122" text-anchor="middle" font-size="9" fill="#374151">GET /api/runs?limit=25 → reverse-chron list</text>

  <line x1="187" y1="142" x2="64" y2="142" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="120" y="136" text-anchor="middle" font-size="9" fill="#374151">[&#123;runId, sha, branch, status, duration, actor&#125;] → Map keyed by runId</text>

  <line x1="54" y1="158" x2="187" y2="158" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="120" y="170" text-anchor="middle" font-size="9" fill="#374151">EventSource /runs/events → run_created / run_updated → O(1) Map update → re-render badge</text>

  <!-- BAND B: Job DAG -->
  <rect x="8" y="184" width="878" height="16" rx="3" fill="#d97843" opacity="0.2"/>
  <text x="450" y="196" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">PATH B — JOB DAG VISUALIZATION (topological sort; SVG nodes; Bézier edges; status color animation)</text>

  <line x1="54" y1="214" x2="497" y2="214" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="275" y="208" text-anchor="middle" font-size="9" fill="#374151">click run → useMemo: topo sort jobs + assign columns → SVG &lt;rect&gt; nodes + &lt;path&gt; Bézier edges</text>

  <rect x="20" y="224" width="460" height="40" rx="5" fill="#fffbeb" stroke="#d97843" stroke-width="1"/>
  <text x="250" y="239" text-anchor="middle" font-size="8.5" fill="#92400e" font-weight="600">DAG Layout: longest-path column assignment | parallel jobs stacked vertically</text>
  <text x="250" y="253" text-anchor="middle" font-size="8" fill="#374151">node: &lt;rect&gt; + status &lt;circle&gt; (pulsing CSS on running) | edge: cubic Bézier C-command green/grey/red</text>

  <line x1="497" y1="268" x2="64" y2="268" stroke="#d97843" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="280" y="262" text-anchor="middle" font-size="9" fill="#374151">click node → navigate to job log view; keyboard focus via SVG tabIndex</text>

  <!-- BAND C: Live Log Streaming -->
  <rect x="8" y="282" width="878" height="16" rx="3" fill="#2f9d74" opacity="0.2"/>
  <text x="450" y="294" text-anchor="middle" font-size="9" fill="#065f46" font-weight="bold">PATH C — LIVE LOG SSE (lines ref + 100ms rAF batch; ANSI→span; TanStack Virtual; auto-scroll pause)</text>

  <line x1="54" y1="312" x2="343" y2="312" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="198" y="306" text-anchor="middle" font-size="9" fill="#374151">EventSource /logs → onmessage: push to lines[] ref (not state)</text>

  <line x1="343" y1="326" x2="64" y2="326" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="198" y="320" text-anchor="middle" font-size="9" fill="#374151">rAF 100ms throttle → setState(lineCount) → virtual list renders visible [start, end] rows</text>

  <line x1="54" y1="342" x2="343" y2="342" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="198" y="354" text-anchor="middle" font-size="9" fill="#374151">ANSI parser: ESC[32m → &lt;span class="ansi-green"&gt;; state persists across lines; no dangerouslySetInnerHTML</text>

  <line x1="343" y1="368" x2="64" y2="368" stroke="#2f9d74" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="198" y="362" text-anchor="middle" font-size="9" fill="#374151">user scrolls up → pause auto-scroll; job done → SSE close → static download link</text>

  <!-- BAND D: Deployment Gate -->
  <rect x="8" y="382" width="878" height="16" rx="3" fill="#7c3aed" opacity="0.15"/>
  <text x="450" y="394" text-anchor="middle" font-size="9" fill="#5b21b6" font-weight="bold">PATH D — DEPLOYMENT GATE (approver group; commit diff; POST approve; SSE gate_updated to all viewers)</text>

  <line x1="54" y1="412" x2="651" y2="412" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="352" y="406" text-anchor="middle" font-size="9" fill="#374151">deploy stage "waiting" → show diff + approver group; usePermission("deploy:approve") → enable buttons</text>

  <line x1="651" y1="426" x2="187" y2="426" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="419" y="420" text-anchor="middle" font-size="9" fill="#374151">POST /gates/{id}/approve &#123;decision, comment&#125; → audit log: approver+timestamp+commit-range</text>

  <line x1="651" y1="440" x2="64" y2="440" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="357" y="434" text-anchor="middle" font-size="9" fill="#374151">SSE gate_updated → all run viewers: DAG node color green + pipeline continues to deploy stage</text>

  <!-- BAND E: Flaky Tests -->
  <rect x="8" y="454" width="878" height="16" rx="3" fill="#be123c" opacity="0.15"/>
  <text x="450" y="466" text-anchor="middle" font-size="9" fill="#9f1239" font-weight="bold">PATH E — FLAKY TEST DETECTION (&lt;95% pass rate / 30 runs; sparkline histogram; known-flaky exclusion)</text>

  <line x1="54" y1="484" x2="821" y2="484" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="437" y="478" text-anchor="middle" font-size="9" fill="#374151">click "Flaky tests" tab → GET /api/repos/{repoId}/flaky-tests (daily cron pre-computed)</text>

  <line x1="821" y1="498" x2="64" y2="498" stroke="#be123c" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="437" y="492" text-anchor="middle" font-size="9" fill="#374151">render: test name + pass-rate sparkline + last-failure; POST /mark-flaky → exclude from gate</text>

  <!-- Metrics footer -->
  <rect x="8" y="514" width="878" height="50" rx="6" fill="#1a1822"/>
  <text x="70" y="532" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">Log Render</text>
  <text x="70" y="550" text-anchor="middle" font-size="12" fill="white" font-weight="700">100K+ virtual</text>

  <text x="210" y="532" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">SSE Resume</text>
  <text x="210" y="550" text-anchor="middle" font-size="12" fill="white" font-weight="700">Last-Event-ID</text>

  <text x="370" y="532" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Log Batch</text>
  <text x="370" y="550" text-anchor="middle" font-size="12" fill="white" font-weight="700">100ms rAF</text>

  <text x="530" y="532" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">DAG Layout</text>
  <text x="530" y="550" text-anchor="middle" font-size="12" fill="white" font-weight="700">topo sort O(V+E)</text>

  <text x="700" y="532" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Flaky Threshold</text>
  <text x="700" y="550" text-anchor="middle" font-size="12" fill="white" font-weight="700">&lt;95% / 30 runs</text>

  <text x="855" y="532" text-anchor="middle" font-size="9" fill="#fecdd3" font-weight="600">Gate Audit</text>
  <text x="855" y="550" text-anchor="middle" font-size="12" fill="white" font-weight="700">immutable log</text>
</svg>
