<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="600" fill="#f3f1f8"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Developer Documentation System (Docusaurus-Style)</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="14" y="52" width="80" height="36" rx="7" fill="#6d5bd0"/>
  <text x="54" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Developer</text>
  <text x="54" y="82" text-anchor="middle" font-size="9" fill="#edeaf5">Browser</text>

  <rect x="148" y="52" width="90" height="36" rx="7" fill="#2563eb"/>
  <text x="193" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Build Pipeline</text>
  <text x="193" y="82" text-anchor="middle" font-size="9" fill="#dbeafe">MDX → static</text>

  <rect x="302" y="52" width="90" height="36" rx="7" fill="#2f9d74"/>
  <text x="347" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">CDN / Static</text>
  <text x="347" y="82" text-anchor="middle" font-size="9" fill="#d1fae5">versioned routes</text>

  <rect x="456" y="52" width="90" height="36" rx="7" fill="#d97843"/>
  <text x="501" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Pagefind</text>
  <text x="501" y="82" text-anchor="middle" font-size="9" fill="#fef3c7">WASM search</text>

  <rect x="610" y="52" width="90" height="36" rx="7" fill="#7c3aed"/>
  <text x="655" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">OpenAPI Ref</text>
  <text x="655" y="82" text-anchor="middle" font-size="9" fill="#ede9fe">CORS proxy Try-it</text>

  <rect x="786" y="52" width="90" height="36" rx="7" fill="#be123c"/>
  <text x="831" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Health Cron</text>
  <text x="831" y="82" text-anchor="middle" font-size="9" fill="#fecdd3">staleness + links</text>

  <!-- Lifelines -->
  <line x1="54" y1="88" x2="54" y2="566" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="193" y1="88" x2="193" y2="566" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="347" y1="88" x2="347" y2="566" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="501" y1="88" x2="501" y2="566" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="655" y1="88" x2="655" y2="566" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="831" y1="88" x2="831" y2="566" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- BAND A: Build Pipeline -->
  <rect x="8" y="98" width="878" height="16" rx="3" fill="#2563eb" opacity="0.2"/>
  <text x="450" y="110" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">PATH A — BUILD PIPELINE (git push → MDX compile → Shiki highlight → Pagefind index → CDN deploy)</text>

  <line x1="183" y1="128" x2="337" y2="128" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="260" y="122" text-anchor="middle" font-size="9" fill="#374151">MDX compile + Shiki (build-time highlight, no runtime JS) + frontmatter extract</text>

  <line x1="183" y1="142" x2="491" y2="142" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="337" y="136" text-anchor="middle" font-size="9" fill="#374151">Pagefind crawl built HTML → compressed search index chunks</text>

  <line x1="183" y1="156" x2="337" y2="156" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="260" y="168" text-anchor="middle" font-size="9" fill="#374151">static export → CDN; PR preview URL → CI webhook → PR comment; health JSON report</text>

  <!-- BAND B: Versioned Docs -->
  <rect x="8" y="182" width="878" height="16" rx="3" fill="#2f9d74" opacity="0.2"/>
  <text x="450" y="194" text-anchor="middle" font-size="9" fill="#065f46" font-weight="bold">PATH B — VERSIONED DOCS (/docs current; /docs/v1.x old; version switcher navigate-or-fallback; CDN cache)</text>

  <line x1="54" y1="212" x2="337" y2="212" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="195" y="206" text-anchor="middle" font-size="9" fill="#374151">GET /docs/authentication (Cache-Control: 60s SWR; current version)</text>

  <line x1="337" y1="226" x2="64" y2="226" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="200" y="220" text-anchor="middle" font-size="9" fill="#374151">rendered page with version badge + version switcher dropdown</text>

  <line x1="54" y1="242" x2="337" y2="242" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="195" y="254" text-anchor="middle" font-size="9" fill="#374151">switch v1.x → navigate /v1.x/authentication (exists) or /v1.x root; old = immutable cache max-age=1yr</text>

  <!-- BAND C: Client-Side Search -->
  <rect x="8" y="268" width="878" height="16" rx="3" fill="#d97843" opacity="0.2"/>
  <text x="450" y="280" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">PATH C — PAGEFIND SEARCH (WASM lazy chunk; code separately filtered; title+snippet+breadcrumb)</text>

  <line x1="54" y1="298" x2="491" y2="298" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="272" y="292" text-anchor="middle" font-size="9" fill="#374151">first search → download pagefind.wasm (~30KB) + index chunk (lazy per term)</text>

  <line x1="491" y1="312" x2="64" y2="312" stroke="#d97843" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="277" y="306" text-anchor="middle" font-size="9" fill="#374151">results: page title + bold-highlighted snippet + breadcrumb; code blocks: "Code" label (data-pagefind-filter)</text>

  <!-- BAND D: OpenAPI Try-it -->
  <rect x="8" y="328" width="878" height="16" rx="3" fill="#7c3aed" opacity="0.15"/>
  <text x="450" y="340" text-anchor="middle" font-size="9" fill="#5b21b6" font-weight="bold">PATH D — OPENAPI REF + TRY-IT (spec→MDX; CORS proxy; localStorage API key; interactive sandbox)</text>

  <line x1="183" y1="358" x2="645" y2="358" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="414" y="352" text-anchor="middle" font-size="9" fill="#374151">build: openapi.yaml → per-endpoint MDX (params table + schemas + examples side-by-side)</text>

  <line x1="54" y1="374" x2="645" y2="374" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="349" y="368" text-anchor="middle" font-size="9" fill="#374151">Try-it click → inject localStorage API key → POST /proxy → forward to live API → display response</text>

  <line x1="54" y1="390" x2="645" y2="390" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="349" y="402" text-anchor="middle" font-size="9" fill="#374151">```js sandbox → sandpack iframe (SDK preloaded + inline output); backend → Lambda serverless</text>

  <!-- BAND E: Scroll-spy ToC -->
  <rect x="8" y="414" width="878" height="16" rx="3" fill="#2563eb" opacity="0.15"/>
  <text x="450" y="426" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">PATH E — SCROLL-SPY TOC (IntersectionObserver h2/h3; activeHeadingId; smooth scroll + URL hash)</text>

  <line x1="54" y1="444" x2="337" y2="444" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="195" y="438" text-anchor="middle" font-size="9" fill="#374151">IntersectionObserver on h2+h3 → activeHeadingId → ToC item highlight + ToC auto-scroll</text>

  <line x1="54" y1="460" x2="337" y2="460" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="195" y="472" text-anchor="middle" font-size="9" fill="#374151">click ToC item → element.scrollIntoView(smooth) + history.pushState(#heading-id)</text>

  <!-- BAND F: Health Report -->
  <rect x="8" y="480" width="878" height="16" rx="3" fill="#be123c" opacity="0.15"/>
  <text x="450" y="492" text-anchor="middle" font-size="9" fill="#9f1239" font-weight="bold">PATH F — HEALTH REPORT (build-time: broken links; staleness vs OpenAPI git; Slack alert; PR check)</text>

  <line x1="183" y1="510" x2="821" y2="510" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="502" y="504" text-anchor="middle" font-size="9" fill="#374151">build: AST scan links + compare page.lastUpdated vs endpoint git-log → health.json</text>

  <line x1="821" y1="524" x2="64" y2="524" stroke="#be123c" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="442" y="518" text-anchor="middle" font-size="9" fill="#374151">/docs/health auth-gated dashboard; Slack alert on new broken links; PR CI check fails on broken link</text>

  <!-- Metrics footer -->
  <rect x="8" y="540" width="878" height="46" rx="6" fill="#1a1822"/>
  <text x="70" y="558" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">Build</text>
  <text x="70" y="574" text-anchor="middle" font-size="12" fill="white" font-weight="700">incremental Shiki</text>

  <text x="215" y="558" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Search</text>
  <text x="215" y="574" text-anchor="middle" font-size="12" fill="white" font-weight="700">&lt;50ms WASM</text>

  <text x="380" y="558" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Old Versions</text>
  <text x="380" y="574" text-anchor="middle" font-size="12" fill="white" font-weight="700">1yr immutable</text>

  <text x="540" y="558" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Current</text>
  <text x="540" y="574" text-anchor="middle" font-size="12" fill="white" font-weight="700">60s SWR cache</text>

  <text x="700" y="558" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Staleness</text>
  <text x="700" y="574" text-anchor="middle" font-size="12" fill="white" font-weight="700">&gt;90d flagged</text>

  <text x="855" y="558" text-anchor="middle" font-size="9" fill="#fecdd3" font-weight="600">Index Size</text>
  <text x="855" y="574" text-anchor="middle" font-size="12" fill="white" font-weight="700">1-5% of HTML</text>
</svg>
