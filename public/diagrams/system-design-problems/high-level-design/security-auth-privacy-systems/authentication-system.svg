<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="560" fill="#f3f1f8"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Authentication System (OAuth, SSO, MFA)</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="58" width="80" height="36" rx="7" fill="#6d5bd0"/>
  <text x="60" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Browser</text>
  <text x="60" y="88" text-anchor="middle" font-size="9" fill="#edeaf5">React UI</text>

  <rect x="160" y="58" width="90" height="36" rx="7" fill="#2563eb"/>
  <text x="205" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Auth Backend</text>
  <text x="205" y="88" text-anchor="middle" font-size="9" fill="#dbeafe">session + tokens</text>

  <rect x="315" y="58" width="90" height="36" rx="7" fill="#2f9d74"/>
  <text x="360" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">OAuth / IdP</text>
  <text x="360" y="88" text-anchor="middle" font-size="9" fill="#d1fae5">Google / Okta</text>

  <rect x="475" y="58" width="95" height="36" rx="7" fill="#d97843"/>
  <text x="522" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">MFA Service</text>
  <text x="522" y="88" text-anchor="middle" font-size="9" fill="#fef3c7">TOTP / WebAuthn</text>

  <rect x="640" y="58" width="90" height="36" rx="7" fill="#7c3aed"/>
  <text x="685" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Token Store</text>
  <text x="685" y="88" text-anchor="middle" font-size="9" fill="#ede9fe">memory + HttpOnly</text>

  <rect x="800" y="58" width="80" height="36" rx="7" fill="#be123c"/>
  <text x="840" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Session DB</text>
  <text x="840" y="88" text-anchor="middle" font-size="9" fill="#fecdd3">Redis + rotate</text>

  <!-- Lifelines -->
  <line x1="60" y1="94" x2="60" y2="526" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="205" y1="94" x2="205" y2="526" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="360" y1="94" x2="360" y2="526" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="522" y1="94" x2="522" y2="526" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="685" y1="94" x2="685" y2="526" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="840" y1="94" x2="840" y2="526" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- BAND A: OAuth PKCE -->
  <rect x="14" y="104" width="872" height="16" rx="3" fill="#2563eb" opacity="0.2"/>
  <text x="450" y="116" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">PATH A — OAUTH 2.0 + PKCE (codeVerifier → SHA-256 challenge → state CSRF nonce)</text>

  <line x1="60" y1="132" x2="675" y2="132" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="367" y="126" text-anchor="middle" font-size="9" fill="#374151">gen codeVerifier → SHA-256 codeChallenge → store in sessionStorage</text>

  <line x1="60" y1="144" x2="350" y2="144" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="205" y="156" text-anchor="middle" font-size="9" fill="#374151">redirect /authorize?code_challenge=…&amp;state=nonce</text>

  <line x1="350" y1="168" x2="70" y2="168" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="210" y="162" text-anchor="middle" font-size="9" fill="#374151">callback: code + state (verify state==nonce CSRF check)</text>

  <line x1="60" y1="182" x2="195" y2="182" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="127" y="176" text-anchor="middle" font-size="9" fill="#374151">POST code + codeVerifier</text>

  <line x1="195" y1="196" x2="350" y2="196" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="272" y="190" text-anchor="middle" font-size="9" fill="#374151">exchange at token endpoint</text>

  <line x1="195" y1="210" x2="70" y2="210" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="132" y="204" text-anchor="middle" font-size="9" fill="#374151">Set-Cookie: session=…; HttpOnly; Secure; SameSite=Strict</text>

  <!-- BAND B: MFA Challenge -->
  <rect x="14" y="224" width="872" height="16" rx="3" fill="#d97843" opacity="0.2"/>
  <text x="450" y="236" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">PATH B — MFA CHALLENGE (mfaToken gate → TOTP 6-digit or WebAuthn assertion)</text>

  <line x1="60" y1="254" x2="195" y2="254" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="127" y="248" text-anchor="middle" font-size="9" fill="#374151">POST /auth/login &#123;email, password&#125;</text>

  <rect x="165" y="262" width="80" height="18" rx="4" fill="#d97843"/>
  <text x="205" y="275" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">mfaRequired</text>

  <line x1="195" y1="290" x2="70" y2="290" stroke="#d97843" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="132" y="284" text-anchor="middle" font-size="9" fill="#374151">200 &#123;mfaRequired:true, mfaToken, methods:[totp,webauthn]&#125;</text>

  <line x1="60" y1="306" x2="512" y2="306" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="286" y="300" text-anchor="middle" font-size="9" fill="#374151">TOTP: POST &#123;mfaToken, totpCode&#125; · WebAuthn: credentials.get(challenge) → assertion</text>

  <line x1="512" y1="320" x2="70" y2="320" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="291" y="314" text-anchor="middle" font-size="9" fill="#374151">verified → Set-Cookie: session HttpOnly · mfaToken TTL 5min enforced</text>

  <!-- BAND C: Token Lifecycle -->
  <rect x="14" y="334" width="872" height="16" rx="3" fill="#7c3aed" opacity="0.15"/>
  <text x="450" y="346" text-anchor="middle" font-size="9" fill="#5b21b6" font-weight="bold">PATH C — TOKEN LIFECYCLE (in-memory access token + HttpOnly refresh rotation)</text>

  <line x1="60" y1="364" x2="675" y2="364" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="367" y="358" text-anchor="middle" font-size="9" fill="#374151">page load → POST /auth/refresh (HttpOnly cookie sent automatically)</text>

  <line x1="675" y1="378" x2="830" y2="378" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="752" y="372" text-anchor="middle" font-size="9" fill="#374151">verify + rotate refresh token</text>

  <line x1="675" y1="392" x2="70" y2="392" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="372" y="386" text-anchor="middle" font-size="9" fill="#374151">new access token → store in memory (JS var); new HttpOnly refresh cookie</text>

  <line x1="675" y1="408" x2="70" y2="408" stroke="#e05252" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="372" y="418" text-anchor="middle" font-size="9" fill="#374151">stolen refresh reused after rotation → family revocation → 401 → redirect login</text>

  <!-- BAND D: Brute Force -->
  <rect x="14" y="428" width="872" height="16" rx="3" fill="#be123c" opacity="0.15"/>
  <text x="450" y="440" text-anchor="middle" font-size="9" fill="#9f1239" font-weight="bold">PATH D — BRUTE FORCE PROTECTION (5 attempts → lockout; 3 attempts → reCAPTCHA)</text>

  <line x1="60" y1="458" x2="195" y2="458" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="127" y="452" text-anchor="middle" font-size="9" fill="#374151">5th failed login</text>

  <rect x="165" y="466" width="80" height="18" rx="4" fill="#be123c"/>
  <text x="205" y="479" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">429 lockout</text>

  <line x1="195" y1="494" x2="70" y2="494" stroke="#e05252" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="132" y="488" text-anchor="middle" font-size="9" fill="#374151">lockout msg + countdown timer; button disabled; reCAPTCHA at attempt 3</text>

  <!-- Metrics footer -->
  <rect x="14" y="510" width="872" height="34" rx="6" fill="#1a1822"/>
  <text x="80" y="528" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Access Token TTL</text>
  <text x="80" y="540" text-anchor="middle" font-size="11" fill="white" font-weight="700">15min memory</text>
  <text x="240" y="528" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Refresh Cookie</text>
  <text x="240" y="540" text-anchor="middle" font-size="11" fill="white" font-weight="700">HttpOnly 30d</text>
  <text x="420" y="528" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">MFA Token TTL</text>
  <text x="420" y="540" text-anchor="middle" font-size="11" fill="white" font-weight="700">5min one-time</text>
  <text x="610" y="528" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Lockout Trigger</text>
  <text x="610" y="540" text-anchor="middle" font-size="11" fill="white" font-weight="700">5 failures</text>
  <text x="800" y="528" text-anchor="middle" font-size="9" fill="#ddd6fe" font-weight="600">PKCE Method</text>
  <text x="800" y="540" text-anchor="middle" font-size="11" fill="white" font-weight="700">S256 SHA-256</text>
</svg>
