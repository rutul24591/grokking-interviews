<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" role="img" aria-label="Privacy Consent Management: degradation and rollback ladder">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#0f766e"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#c2410c"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#be123c"/></marker>
  </defs>
  <rect x="18" y="18" width="924" height="524" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="54" y="56" font-size="18" font-weight="700" fill="#172033">Privacy Consent Management: degradation and rollback ladder</text>
  <text x="54" y="78" font-size="11.5" fill="#526074">Failure containment is a policy ladder, not an accidental timeout cascade.</text>
  <rect x="48" y="108" width="864" height="344" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="1.1"/>
  <text x="68" y="131" font-size="12.5" font-weight="700" fill="#c2410c">DEGRADATION LADDER</text><circle cx="104" cy="154" r="22" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.6"/>
    <text x="104" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#172033">0</text>
    <text x="154" y="149" font-size="11" font-weight="700" fill="#172033">healthy</text>
    <text x="154" y="168" font-size="10.5" fill="#526074">recovery path</text>
    <text x="590" y="158" font-size="10.5" fill="#172033">full fidelity</text><line x1="104" y1="178" x2="104" y2="196" stroke="#c2410c" stroke-width="2.4" marker-end="url(#arrow-orange)"/><circle cx="104" cy="222" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="104" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#172033">1</text>
    <text x="154" y="217" font-size="11" font-weight="700" fill="#172033">dependency pressure</text>
    <text x="154" y="236" font-size="10.5" fill="#526074">cache recovery path</text>
    <text x="590" y="226" font-size="10.5" fill="#172033">shed optional work</text><line x1="104" y1="246" x2="104" y2="264" stroke="#c2410c" stroke-width="2.4" marker-end="url(#arrow-orange)"/><circle cx="104" cy="290" r="22" fill="#fff7ed" stroke="#c2410c" stroke-width="1.6"/>
    <text x="104" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#172033">2</text>
    <text x="154" y="285" font-size="11" font-weight="700" fill="#172033">write risk</text>
    <text x="154" y="304" font-size="10.5" fill="#526074">freeze session state</text>
    <text x="590" y="294" font-size="10.5" fill="#172033">serve stable projection</text><line x1="104" y1="314" x2="104" y2="332" stroke="#c2410c" stroke-width="2.4" marker-end="url(#arrow-orange)"/><circle cx="104" cy="358" r="22" fill="#fff1f2" stroke="#be123c" stroke-width="1.6"/>
    <text x="104" y="362" text-anchor="middle" font-size="11" font-weight="700" fill="#172033">3</text>
    <text x="154" y="353" font-size="11" font-weight="700" fill="#172033">integrity risk</text>
    <text x="154" y="372" font-size="10.5" fill="#526074">rollback version</text>
    <text x="590" y="362" font-size="10.5" fill="#172033">repair then reopen</text><text x="590" y="132" font-size="11" font-weight="700" fill="#c2410c">USER-VISIBLE POLICY</text>
  <text x="72" y="486" font-size="11" fill="#172033">Every rung has an entry signal, explicit owner, visible behavior, audit event, and exit condition.</text>
</svg>
