<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="580" fill="#f3f1f8"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Privacy &amp; Consent Management System (CMP)</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
    <marker id="arr-b" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="14" y="52" width="80" height="36" rx="7" fill="#6d5bd0"/>
  <text x="54" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Browser</text>
  <text x="54" y="82" text-anchor="middle" font-size="9" fill="#edeaf5">inline script</text>

  <rect x="148" y="52" width="90" height="36" rx="7" fill="#2563eb"/>
  <text x="193" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Consent Cookie</text>
  <text x="193" y="82" text-anchor="middle" font-size="9" fill="#dbeafe">1yr, Secure/Lax</text>

  <rect x="308" y="52" width="90" height="36" rx="7" fill="#2f9d74"/>
  <text x="353" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Banner / UI</text>
  <text x="353" y="82" text-anchor="middle" font-size="9" fill="#d1fae5">lazy-loaded React</text>

  <rect x="465" y="52" width="90" height="36" rx="7" fill="#d97843"/>
  <text x="510" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Tag Manager</text>
  <text x="510" y="82" text-anchor="middle" font-size="9" fill="#fef3c7">GTM consent mode</text>

  <rect x="625" y="52" width="90" height="36" rx="7" fill="#7c3aed"/>
  <text x="670" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Consent API</text>
  <text x="670" y="82" text-anchor="middle" font-size="9" fill="#ede9fe">audit log</text>

  <rect x="792" y="52" width="90" height="36" rx="7" fill="#be123c"/>
  <text x="837" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Rights API</text>
  <text x="837" y="82" text-anchor="middle" font-size="9" fill="#fecdd3">GDPR/CCPA</text>

  <!-- Lifelines -->
  <line x1="54" y1="88" x2="54" y2="550" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="193" y1="88" x2="193" y2="550" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="353" y1="88" x2="353" y2="550" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="510" y1="88" x2="510" y2="550" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="670" y1="88" x2="670" y2="550" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="837" y1="88" x2="837" y2="550" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- BAND A: CMP Initialization -->
  <rect x="8" y="98" width="878" height="16" rx="3" fill="#6d5bd0" opacity="0.2"/>
  <text x="450" y="110" text-anchor="middle" font-size="9" fill="#4c1d95" font-weight="bold">PATH A — CMP INIT (synchronous inline script; read cookie before GTM; GPC/DNT auto-reject)</text>

  <line x1="54" y1="126" x2="183" y2="126" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="119" y="120" text-anchor="middle" font-size="9" fill="#374151">read consent-token cookie</text>

  <line x1="183" y1="140" x2="64" y2="140" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="119" y="134" text-anchor="middle" font-size="9" fill="#374151">&#123;version:"2.3", analytics:true, marketing:false&#125;</text>

  <line x1="54" y1="154" x2="183" y2="154" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="119" y="166" text-anchor="middle" font-size="9" fill="#374151">check navigator.globalPrivacyControl → GPC=true → default all=false</text>

  <line x1="54" y1="178" x2="500" y2="178" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="277" y="172" text-anchor="middle" font-size="9" fill="#374151">version match + consented → set window.__consent=&#123;analytics:true,marketing:false&#125; → GTM proceeds</text>

  <!-- BAND B: Consent Banner -->
  <rect x="8" y="194" width="878" height="16" rx="3" fill="#2f9d74" opacity="0.2"/>
  <text x="450" y="206" text-anchor="middle" font-size="9" fill="#065f46" font-weight="bold">PATH B — CONSENT BANNER (no dark patterns; reject=same prominence as accept; lazy-loaded)</text>

  <line x1="54" y1="224" x2="343" y2="224" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="199" y="218" text-anchor="middle" font-size="9" fill="#374151">version mismatch / no cookie → dynamic import banner component</text>

  <rect x="360" y="232" width="380" height="30" rx="4" fill="#f0fdf4" stroke="#2f9d74" stroke-width="1"/>
  <text x="550" y="246" text-anchor="middle" font-size="8.5" fill="#065f46" font-weight="600">GDPR Compliant Banner: Accept All / Reject All (same size) / Manage Preferences</text>
  <text x="550" y="258" text-anchor="middle" font-size="8" fill="#374151">Necessary always on | no pre-checked optional categories | bottom of screen</text>

  <line x1="343" y1="272" x2="660" y2="272" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr)"/>
  <text x="501" y="266" text-anchor="middle" font-size="9" fill="#374151">user clicks Accept All → POST /api/consent &#123;version:"2.3", categories, method:"explicit"&#125;</text>

  <line x1="660" y1="286" x2="183" y2="286" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="421" y="280" text-anchor="middle" font-size="9" fill="#374151">save immutable audit record (IP hash + UA + timestamp) → write consent-token cookie</text>

  <!-- BAND C: Version Management -->
  <rect x="8" y="302" width="878" height="16" rx="3" fill="#d97843" opacity="0.2"/>
  <text x="450" y="314" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">PATH C — VERSION MANAGEMENT (meta tag compare; re-consent on material changes; prior choices preserved)</text>

  <line x1="54" y1="332" x2="183" y2="332" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="119" y="326" text-anchor="middle" font-size="9" fill="#374151">read cookie version="2.2"</text>

  <line x1="54" y1="346" x2="183" y2="346" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="119" y="358" text-anchor="middle" font-size="9" fill="#374151">read &lt;meta name="consent-version" content="2.3"&gt;</text>

  <line x1="183" y1="370" x2="343" y2="370" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="263" y="364" text-anchor="middle" font-size="9" fill="#374151">version mismatch → lazy load banner with "Policy updated" notice</text>

  <line x1="343" y1="384" x2="64" y2="384" stroke="#2f9d74" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="204" y="378" text-anchor="middle" font-size="9" fill="#374151">prior consents pre-filled but require active re-confirm to be legally valid</text>

  <!-- BAND D: Data Subject Rights -->
  <rect x="8" y="398" width="878" height="16" rx="3" fill="#7c3aed" opacity="0.15"/>
  <text x="450" y="410" text-anchor="middle" font-size="9" fill="#5b21b6" font-weight="bold">PATH D — DATA SUBJECT RIGHTS (access/deletion/portability; 30-day SLA; pre-signed S3 URL download)</text>

  <line x1="54" y1="428" x2="827" y2="428" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="440" y="422" text-anchor="middle" font-size="9" fill="#374151">POST /api/privacy/requests &#123;type:"access"&#125; (authenticated user, /settings/privacy)</text>

  <line x1="827" y1="442" x2="64" y2="442" stroke="#be123c" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="440" y="436" text-anchor="middle" font-size="9" fill="#374151">requestId + status:"Received" → email confirmation → async ZIP generation → pre-signed S3 URL</text>

  <line x1="54" y1="460" x2="827" y2="460" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="440" y="472" text-anchor="middle" font-size="9" fill="#374151">GET /api/privacy/requests polled every 60s → status: Received → Processing → Complete + download</text>

  <!-- Metrics footer -->
  <rect x="8" y="486" width="878" height="50" rx="6" fill="#1a1822"/>
  <text x="70" y="506" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">CMP Init</text>
  <text x="70" y="524" text-anchor="middle" font-size="12" fill="white" font-weight="700">&lt;50ms sync</text>

  <text x="210" y="506" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Cookie</text>
  <text x="210" y="524" text-anchor="middle" font-size="12" fill="white" font-weight="700">1-yr / Secure+Lax</text>

  <text x="380" y="506" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">GDPR Rule</text>
  <text x="380" y="524" text-anchor="middle" font-size="12" fill="white" font-weight="700">reject = accept</text>

  <text x="560" y="506" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">GPC Signal</text>
  <text x="560" y="524" text-anchor="middle" font-size="12" fill="white" font-weight="700">CCPA binding</text>

  <text x="730" y="506" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Rights SLA</text>
  <text x="730" y="524" text-anchor="middle" font-size="12" fill="white" font-weight="700">30 days</text>

  <text x="860" y="506" text-anchor="middle" font-size="9" fill="#fecdd3" font-weight="600">Audit Log</text>
  <text x="860" y="524" text-anchor="middle" font-size="12" fill="white" font-weight="700">immutable</text>
</svg>
