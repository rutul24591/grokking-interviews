<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="540" fill="#f3f1f8"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Permission &amp; Access Control System UI</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="58" width="80" height="36" rx="7" fill="#6d5bd0"/>
  <text x="60" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">User / UI</text>
  <text x="60" y="88" text-anchor="middle" font-size="9" fill="#edeaf5">React + hooks</text>

  <rect x="165" y="58" width="90" height="36" rx="7" fill="#2563eb"/>
  <text x="210" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Auth Context</text>
  <text x="210" y="88" text-anchor="middle" font-size="9" fill="#dbeafe">JWT claims Set</text>

  <rect x="325" y="58" width="90" height="36" rx="7" fill="#2f9d74"/>
  <text x="370" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Perms API</text>
  <text x="370" y="88" text-anchor="middle" font-size="9" fill="#d1fae5">roles + matrix</text>

  <rect x="490" y="58" width="90" height="36" rx="7" fill="#d97843"/>
  <text x="535" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">WS Server</text>
  <text x="535" y="88" text-anchor="middle" font-size="9" fill="#fef3c7">PERMISSION_UPD</text>

  <rect x="655" y="58" width="90" height="36" rx="7" fill="#7c3aed"/>
  <text x="700" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Admin UI</text>
  <text x="700" y="88" text-anchor="middle" font-size="9" fill="#ede9fe">matrix + roles</text>

  <rect x="808" y="58" width="72" height="36" rx="7" fill="#be123c"/>
  <text x="844" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Audit Log</text>
  <text x="844" y="88" text-anchor="middle" font-size="9" fill="#fecdd3">immutable</text>

  <!-- Lifelines -->
  <line x1="60" y1="94" x2="60" y2="510" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="210" y1="94" x2="210" y2="510" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="370" y1="94" x2="370" y2="510" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="535" y1="94" x2="535" y2="510" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="700" y1="94" x2="700" y2="510" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="844" y1="94" x2="844" y2="510" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- BAND A: JWT claims + hook -->
  <rect x="14" y="104" width="872" height="16" rx="3" fill="#2563eb" opacity="0.2"/>
  <text x="450" y="116" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">PATH A — JWT CLAIMS → usePermission HOOK (Set.has() O(1), no async)</text>

  <line x1="210" y1="132" x2="70" y2="132" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="140" y="126" text-anchor="middle" font-size="9" fill="#374151">JWT decoded: permissions:['project:create','user:invite']</text>

  <line x1="60" y1="146" x2="200" y2="146" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="130" y="158" text-anchor="middle" font-size="9" fill="#374151">usePermission('project:create') → permSet.has() → true/false</text>

  <line x1="200" y1="170" x2="70" y2="170" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="135" y="164" text-anchor="middle" font-size="9" fill="#374151">canCreate=true → render &lt;CreateButton/&gt;; canEdit=false → button disabled+tooltip</text>

  <!-- BAND B: UI Enforcement -->
  <rect x="14" y="184" width="872" height="16" rx="3" fill="#2f9d74" opacity="0.2"/>
  <text x="450" y="196" text-anchor="middle" font-size="9" fill="#065f46" font-weight="bold">PATH B — UI ENFORCEMENT (hide never-accessible; disable+tooltip for upgradeable)</text>

  <rect x="20" y="212" width="390" height="50" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="215" y="228" text-anchor="middle" font-size="8.5" fill="#1d4ed8" font-weight="600">HIDE pattern (Viewer role)</text>
  <text x="215" y="242" text-anchor="middle" font-size="8" fill="#374151">&#123;canCreate &amp;&amp; &lt;CreateButton/&gt;&#125;</text>
  <text x="215" y="255" text-anchor="middle" font-size="8" fill="#374151">Button simply not rendered — role never has this permission</text>

  <rect x="450" y="212" width="434" height="50" rx="5" fill="#fef3c7" stroke="#d97843" stroke-width="1"/>
  <text x="667" y="228" text-anchor="middle" font-size="8.5" fill="#92400e" font-weight="600">DISABLE pattern (needs higher role)</text>
  <text x="667" y="242" text-anchor="middle" font-size="8" fill="#374151">&lt;Button disabled=&#123;!canEdit&#125; title="Requires Editor role"&gt;</text>
  <text x="667" y="255" text-anchor="middle" font-size="8" fill="#374151">User sees feature exists + knows how to unlock it</text>

  <!-- BAND C: Admin matrix + save -->
  <rect x="14" y="274" width="872" height="16" rx="3" fill="#7c3aed" opacity="0.15"/>
  <text x="450" y="286" text-anchor="middle" font-size="9" fill="#5b21b6" font-weight="bold">PATH C — ADMIN MATRIX (roles × perms checkboxes; delta PATCH; inherited locked)</text>

  <line x1="700" y1="304" x2="360" y2="304" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr)"/>
  <text x="530" y="298" text-anchor="middle" font-size="9" fill="#374151">admin toggles 'billing:manage' for Manager role</text>

  <line x1="360" y1="318" x2="70" y2="318" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="215" y="312" text-anchor="middle" font-size="9" fill="#374151">PATCH /roles/manager/permissions &#123;add:['billing:manage']&#125;</text>

  <line x1="370" y1="332" x2="834" y2="332" stroke="#2f9d74" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="602" y="326" text-anchor="middle" font-size="9" fill="#374151">write immutable audit log: actorId+targetRole+old/new+timestamp</text>

  <!-- BAND D: Permission propagation -->
  <rect x="14" y="346" width="872" height="16" rx="3" fill="#d97843" opacity="0.2"/>
  <text x="450" y="358" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">PATH D — REAL-TIME PROPAGATION (HMAC-signed WS event → AuthContext update → re-render)</text>

  <line x1="370" y1="376" x2="525" y2="376" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="447" y="370" text-anchor="middle" font-size="9" fill="#374151">queue PERMISSION_UPDATED for all affected users</text>

  <line x1="525" y1="390" x2="200" y2="390" stroke="#d97843" stroke-width="2" marker-end="url(#arr)"/>
  <text x="362" y="384" text-anchor="middle" font-size="9" fill="#374151">WS &#123;permissions:[…], sig:HMAC&#125; → verify sig → update Set</text>

  <line x1="200" y1="404" x2="70" y2="404" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="135" y="398" text-anchor="middle" font-size="9" fill="#374151">React re-render: PermissionGate shows/hides buttons immediately</text>

  <!-- BAND E: Resource 403 -->
  <rect x="14" y="418" width="872" height="16" rx="3" fill="#be123c" opacity="0.15"/>
  <text x="450" y="430" text-anchor="middle" font-size="9" fill="#9f1239" font-weight="bold">PATH E — RESOURCE-LEVEL 403 (optimistic show → server 403 → inline error)</text>

  <line x1="60" y1="448" x2="360" y2="448" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="210" y="442" text-anchor="middle" font-size="9" fill="#374151">PUT /api/projects/XYZ (has project:update in JWT)</text>

  <line x1="360" y1="462" x2="70" y2="462" stroke="#e05252" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="215" y="456" text-anchor="middle" font-size="9" fill="#374151">403 Forbidden → inline: "No permission to edit this project. Contact workspace admin."</text>

  <!-- Metrics footer -->
  <rect x="14" y="478" width="872" height="46" rx="6" fill="#1a1822"/>
  <text x="80" y="496" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Perm Check</text>
  <text x="80" y="512" text-anchor="middle" font-size="12" fill="white" font-weight="700">O(1) Set.has()</text>

  <text x="240" y="496" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Propagation</text>
  <text x="240" y="512" text-anchor="middle" font-size="12" fill="white" font-weight="700">&lt;15min / instant WS</text>

  <text x="420" y="496" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">JWT Claims</text>
  <text x="420" y="512" text-anchor="middle" font-size="12" fill="white" font-weight="700">5–15 strings</text>

  <text x="610" y="496" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Audit Log</text>
  <text x="610" y="512" text-anchor="middle" font-size="12" fill="white" font-weight="700">immutable</text>

  <text x="800" y="496" text-anchor="middle" font-size="9" fill="#ddd6fe" font-weight="600">WS Signature</text>
  <text x="800" y="512" text-anchor="middle" font-size="12" fill="white" font-weight="700">HMAC verified</text>
</svg>
