<svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="580" fill="#f3f1f8"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Secure Token &amp; Session Handling System</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="14" y="52" width="80" height="36" rx="7" fill="#6d5bd0"/>
  <text x="54" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Browser</text>
  <text x="54" y="82" text-anchor="middle" font-size="9" fill="#edeaf5">in-memory AT</text>

  <rect x="152" y="52" width="90" height="36" rx="7" fill="#2563eb"/>
  <text x="197" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Auth Server</text>
  <text x="197" y="82" text-anchor="middle" font-size="9" fill="#dbeafe">sign + rotate</text>

  <rect x="310" y="52" width="90" height="36" rx="7" fill="#2f9d74"/>
  <text x="355" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Redis Store</text>
  <text x="355" y="82" text-anchor="middle" font-size="9" fill="#d1fae5">RT family</text>

  <rect x="468" y="52" width="90" height="36" rx="7" fill="#d97843"/>
  <text x="513" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">API Server</text>
  <text x="513" y="82" text-anchor="middle" font-size="9" fill="#fef3c7">stateless JWT</text>

  <rect x="626" y="52" width="90" height="36" rx="7" fill="#7c3aed"/>
  <text x="671" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Cookie Jar</text>
  <text x="671" y="82" text-anchor="middle" font-size="9" fill="#ede9fe">HttpOnly RT</text>

  <rect x="790" y="52" width="90" height="36" rx="7" fill="#be123c"/>
  <text x="835" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Attacker</text>
  <text x="835" y="82" text-anchor="middle" font-size="9" fill="#fecdd3">XSS / CSRF</text>

  <!-- Lifelines -->
  <line x1="54" y1="88" x2="54" y2="548" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="197" y1="88" x2="197" y2="548" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="355" y1="88" x2="355" y2="548" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="513" y1="88" x2="513" y2="548" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="671" y1="88" x2="671" y2="548" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="835" y1="88" x2="835" y2="548" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- BAND A: Silent Refresh -->
  <rect x="8" y="98" width="878" height="16" rx="3" fill="#2563eb" opacity="0.2"/>
  <text x="450" y="110" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">PATH A — SILENT REFRESH (page load; HttpOnly cookie → new AT in memory; singleton promise)</text>

  <line x1="54" y1="128" x2="661" y2="128" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="357" y="122" text-anchor="middle" font-size="9" fill="#374151">page load → schedule refresh 60s before exp(AT)</text>

  <line x1="54" y1="142" x2="187" y2="142" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="120" y="136" text-anchor="middle" font-size="9" fill="#374151">POST /auth/refresh (RT cookie auto-sent)</text>

  <line x1="187" y1="156" x2="345" y2="156" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="266" y="150" text-anchor="middle" font-size="9" fill="#374151">GET rt:{jti} → valid → rotate: new RT + revoke old</text>

  <line x1="187" y1="170" x2="64" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="125" y="164" text-anchor="middle" font-size="9" fill="#374151">new AT (body) + Set-Cookie: RT HttpOnly; Path=/auth/refresh</text>

  <!-- BAND B: API Request with CSRF -->
  <rect x="8" y="186" width="878" height="16" rx="3" fill="#2f9d74" opacity="0.2"/>
  <text x="450" y="198" text-anchor="middle" font-size="9" fill="#065f46" font-weight="bold">PATH B — CSRF DOUBLE-SUBMIT (X-CSRF-Token header = csrf-token cookie; attacker blocked by SOP)</text>

  <line x1="54" y1="216" x2="503" y2="216" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="278" y="210" text-anchor="middle" font-size="9" fill="#374151">POST /api/data (Authorization: Bearer AT; X-CSRF-Token: read from csrf-token cookie)</text>

  <line x1="503" y1="230" x2="64" y2="230" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="278" y="224" text-anchor="middle" font-size="9" fill="#374151">verify JWT sig (RS256 pubkey) + exp; verify X-CSRF-Token == session csrf → 200 OK</text>

  <line x1="825" y1="248" x2="503" y2="248" stroke="#e05252" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="664" y="242" text-anchor="middle" font-size="9" fill="#e05252">attacker POST /api/data (cookie sent by browser, X-CSRF-Token missing) → 403</text>

  <!-- BAND C: Refresh Token Family Revocation -->
  <rect x="8" y="264" width="878" height="16" rx="3" fill="#d97843" opacity="0.2"/>
  <text x="450" y="276" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">PATH C — FAMILY REVOCATION (attacker reuses stolen RT; server detects → revoke entire family)</text>

  <line x1="825" y1="294" x2="187" y2="294" stroke="#e05252" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="506" y="288" text-anchor="middle" font-size="9" fill="#374151">attacker: POST /auth/refresh with stolen RT (jti=old)</text>

  <line x1="187" y1="308" x2="345" y2="308" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="266" y="302" text-anchor="middle" font-size="9" fill="#374151">GET rt:{old-jti} → "revoked" (legit client already rotated)</text>

  <line x1="345" y1="322" x2="187" y2="322" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="266" y="316" text-anchor="middle" font-size="9" fill="#374151">SCAN rt:* where familyId=X → SET all "revoked" EX original-TTL</text>

  <line x1="187" y1="336" x2="64" y2="336" stroke="#e05252" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="125" y="330" text-anchor="middle" font-size="9" fill="#374151">legit user: 401 → redirect /login "Session expired for security"</text>

  <!-- BAND D: Secure Logout -->
  <rect x="8" y="350" width="878" height="16" rx="3" fill="#7c3aed" opacity="0.15"/>
  <text x="450" y="362" text-anchor="middle" font-size="9" fill="#5b21b6" font-weight="bold">PATH D — SECURE LOGOUT (memory clear + Redis revoke + cookie clear + query cache flush)</text>

  <line x1="54" y1="380" x2="187" y2="380" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="120" y="374" text-anchor="middle" font-size="9" fill="#374151">user clicks logout → clear AT from memory → POST /auth/logout</text>

  <line x1="187" y1="394" x2="345" y2="394" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="266" y="388" text-anchor="middle" font-size="9" fill="#374151">SET rt:{jti} "revoked" + revoke entire family</text>

  <line x1="187" y1="408" x2="64" y2="408" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="125" y="402" text-anchor="middle" font-size="9" fill="#374151">Set-Cookie: RT Max-Age=0 (clear) + csrf-token Max-Age=0 (clear)</text>

  <line x1="54" y1="424" x2="503" y2="424" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="278" y="436" text-anchor="middle" font-size="9" fill="#374151">queryClient.clear() → flush all cached API responses (prevent data leak to next user)</text>

  <!-- BAND E: Session Fixation Prevention -->
  <rect x="8" y="448" width="878" height="16" rx="3" fill="#be123c" opacity="0.15"/>
  <text x="450" y="460" text-anchor="middle" font-size="9" fill="#9f1239" font-weight="bold">PATH E — SESSION FIXATION (new token family on login/MFA; never promote pre-auth session)</text>

  <line x1="54" y1="478" x2="187" y2="478" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="120" y="472" text-anchor="middle" font-size="9" fill="#374151">user completes MFA → POST /auth/mfa/verify</text>

  <line x1="187" y1="492" x2="345" y2="492" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="266" y="486" text-anchor="middle" font-size="9" fill="#374151">CREATE new familyId + jti; revoke pre-auth mfaToken</text>

  <line x1="187" y1="506" x2="64" y2="506" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="125" y="500" text-anchor="middle" font-size="9" fill="#374151">new AT (memory) + new RT (HttpOnly cookie) — old session ID never promoted</text>

  <!-- Metrics footer -->
  <rect x="8" y="522" width="878" height="46" rx="6" fill="#1a1822"/>
  <text x="70" y="540" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">AT TTL</text>
  <text x="70" y="558" text-anchor="middle" font-size="12" fill="white" font-weight="700">15 min memory</text>

  <text x="215" y="540" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">RT TTL</text>
  <text x="215" y="558" text-anchor="middle" font-size="12" fill="white" font-weight="700">30d HttpOnly</text>

  <text x="380" y="540" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">CSRF</text>
  <text x="380" y="558" text-anchor="middle" font-size="12" fill="white" font-weight="700">double-submit</text>

  <text x="540" y="540" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">JWT Verify</text>
  <text x="540" y="558" text-anchor="middle" font-size="12" fill="white" font-weight="700">RS256 stateless</text>

  <text x="710" y="540" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Silent Refresh</text>
  <text x="710" y="558" text-anchor="middle" font-size="12" fill="white" font-weight="700">60s before exp</text>

  <text x="855" y="540" text-anchor="middle" font-size="9" fill="#fecdd3" font-weight="600">Revocation</text>
  <text x="855" y="558" text-anchor="middle" font-size="12" fill="white" font-weight="700">family Redis</text>
</svg>
