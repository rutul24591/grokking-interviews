<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="540" fill="#f3f1f8"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Account Security Dashboard (Sessions, Devices)</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="58" width="80" height="36" rx="7" fill="#6d5bd0"/>
  <text x="60" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">User (A)</text>
  <text x="60" y="88" text-anchor="middle" font-size="9" fill="#edeaf5">Dashboard</text>

  <rect x="160" y="58" width="90" height="36" rx="7" fill="#2563eb"/>
  <text x="205" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Session API</text>
  <text x="205" y="88" text-anchor="middle" font-size="9" fill="#dbeafe">list + revoke</text>

  <rect x="315" y="58" width="85" height="36" rx="7" fill="#2f9d74"/>
  <text x="357" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Redis Store</text>
  <text x="357" y="88" text-anchor="middle" font-size="9" fill="#d1fae5">session flags</text>

  <rect x="465" y="58" width="90" height="36" rx="7" fill="#d97843"/>
  <text x="510" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">WS Server</text>
  <text x="510" y="88" text-anchor="middle" font-size="9" fill="#fef3c7">revoke push</text>

  <rect x="625" y="58" width="90" height="36" rx="7" fill="#7c3aed"/>
  <text x="670" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Session B</text>
  <text x="670" y="88" text-anchor="middle" font-size="9" fill="#ede9fe">target device</text>

  <rect x="790" y="58" width="90" height="36" rx="7" fill="#be123c"/>
  <text x="835" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">HIBP API</text>
  <text x="835" y="88" text-anchor="middle" font-size="9" fill="#fecdd3">k-anon breach</text>

  <!-- Lifelines -->
  <line x1="60" y1="94" x2="60" y2="510" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="205" y1="94" x2="205" y2="510" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="357" y1="94" x2="357" y2="510" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="510" y1="94" x2="510" y2="510" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="670" y1="94" x2="670" y2="510" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="835" y1="94" x2="835" y2="510" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- BAND A: Session listing -->
  <rect x="14" y="104" width="872" height="16" rx="3" fill="#2563eb" opacity="0.2"/>
  <text x="450" y="116" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">PATH A — SESSION LISTING (device type, IP geo, lastActive; current session badge)</text>

  <line x1="60" y1="132" x2="195" y2="132" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="127" y="126" text-anchor="middle" font-size="9" fill="#374151">GET /api/sessions</text>

  <line x1="195" y1="146" x2="70" y2="146" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="132" y="140" text-anchor="middle" font-size="9" fill="#374151">[&#123;id, device, browser, ip, city, country, lastActive, isCurrent&#125;]</text>

  <line x1="60" y1="160" x2="195" y2="160" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="127" y="172" text-anchor="middle" font-size="9" fill="#374151">render: laptop/phone icon + "This device" badge on current</text>

  <!-- BAND B: Session Revocation -->
  <rect x="14" y="182" width="872" height="16" rx="3" fill="#e05252" opacity="0.15"/>
  <text x="450" y="194" text-anchor="middle" font-size="9" fill="#9f1239" font-weight="bold">PATH B — SESSION REVOCATION (DELETE → Redis revoked → WS REVOKE → target logout)</text>

  <line x1="60" y1="212" x2="195" y2="212" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="127" y="206" text-anchor="middle" font-size="9" fill="#374151">click Revoke on Session B</text>

  <line x1="195" y1="226" x2="347" y2="226" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="271" y="220" text-anchor="middle" font-size="9" fill="#374151">SET session:B:revoked 1 EX 86400</text>

  <line x1="195" y1="240" x2="500" y2="240" stroke="#e05252" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="347" y="234" text-anchor="middle" font-size="9" fill="#374151">PUBLISH revoke:sessionB</text>

  <line x1="500" y1="254" x2="660" y2="254" stroke="#e05252" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="580" y="248" text-anchor="middle" font-size="9" fill="#374151">WS REVOKE event</text>

  <rect x="630" y="262" width="80" height="18" rx="4" fill="#e05252"/>
  <text x="670" y="275" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">clear + logout</text>

  <line x1="660" y1="290" x2="70" y2="290" stroke="#e05252" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="365" y="284" text-anchor="middle" font-size="9" fill="#374151">Session B: delete cookie → redirect /login "Your session was signed out"</text>

  <!-- BAND C: Login history anomaly -->
  <rect x="14" y="304" width="872" height="16" rx="3" fill="#d97843" opacity="0.2"/>
  <text x="450" y="316" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">PATH C — LOGIN HISTORY (anomaly flags: NEW_COUNTRY / UNUSUAL_HOUR; "Wasn't me" lockdown)</text>

  <line x1="60" y1="334" x2="195" y2="334" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="127" y="328" text-anchor="middle" font-size="9" fill="#374151">GET /api/login-history?days=90</text>

  <line x1="195" y1="348" x2="70" y2="348" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="132" y="342" text-anchor="middle" font-size="9" fill="#374151">events with anomalyFlags:['NEW_COUNTRY','UNUSUAL_HOUR'] → amber badge</text>

  <line x1="60" y1="368" x2="195" y2="368" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="127" y="362" text-anchor="middle" font-size="9" fill="#374151">"Wasn't me" → POST /api/security/account-lockdown</text>

  <line x1="195" y1="382" x2="70" y2="382" stroke="#e05252" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="132" y="376" text-anchor="middle" font-size="9" fill="#374151">revoke all other sessions + send password reset email</text>

  <!-- BAND D: HIBP breach check -->
  <rect x="14" y="396" width="872" height="16" rx="3" fill="#7c3aed" opacity="0.15"/>
  <text x="450" y="408" text-anchor="middle" font-size="9" fill="#5b21b6" font-weight="bold">PATH D — HIBP k-ANONYMITY BREACH CHECK (SHA-1 first 5 chars; full hash never sent)</text>

  <line x1="60" y1="426" x2="675" y2="426" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="367" y="420" text-anchor="middle" font-size="9" fill="#374151">new password entered → SHA-1(password) → first 5 hex chars</text>

  <line x1="675" y1="440" x2="825" y2="440" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="750" y="434" text-anchor="middle" font-size="9" fill="#374151">GET /range/{"{5chars}"}</text>

  <line x1="825" y1="454" x2="70" y2="454" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="447" y="448" text-anchor="middle" font-size="9" fill="#374151">list of hash suffixes → check if SHA-1[5:] in list → found: warn "appeared in breach"</text>

  <!-- Metrics footer -->
  <rect x="14" y="470" width="872" height="46" rx="6" fill="#1a1822"/>
  <text x="80" y="488" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Revocation</text>
  <text x="80" y="504" text-anchor="middle" font-size="12" fill="white" font-weight="700">&lt;3s WS push</text>

  <text x="240" y="488" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Redis TTL</text>
  <text x="240" y="504" text-anchor="middle" font-size="12" fill="white" font-weight="700">86400s revoked</text>

  <text x="420" y="488" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">History</text>
  <text x="420" y="504" text-anchor="middle" font-size="12" fill="white" font-weight="700">90 days</text>

  <text x="610" y="488" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">HIBP Privacy</text>
  <text x="610" y="504" text-anchor="middle" font-size="12" fill="white" font-weight="700">k-anon 5 chars</text>

  <text x="800" y="488" text-anchor="middle" font-size="9" fill="#ddd6fe" font-weight="600">Re-auth Gate</text>
  <text x="800" y="504" text-anchor="middle" font-size="12" fill="white" font-weight="700">destructive ops</text>
</svg>
