<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="620" fill="#f3f1f8"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">PWA with Offline Sync Architecture</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="14" y="52" width="78" height="36" rx="7" fill="#6d5bd0"/>
  <text x="53" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Browser</text>
  <text x="53" y="82" text-anchor="middle" font-size="9" fill="#edeaf5">React UI</text>

  <rect x="148" y="52" width="88" height="36" rx="7" fill="#2563eb"/>
  <text x="192" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Service</text>
  <text x="192" y="82" text-anchor="middle" font-size="9" fill="#dbeafe">Worker</text>

  <rect x="298" y="52" width="88" height="36" rx="7" fill="#2f9d74"/>
  <text x="342" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">IndexedDB</text>
  <text x="342" y="82" text-anchor="middle" font-size="9" fill="#d1fae5">Dexie live query</text>

  <rect x="448" y="52" width="88" height="36" rx="7" fill="#d97843"/>
  <text x="492" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Cache API</text>
  <text x="492" y="82" text-anchor="middle" font-size="9" fill="#fef3c7">versioned</text>

  <rect x="598" y="52" width="88" height="36" rx="7" fill="#7c3aed"/>
  <text x="642" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">API Server</text>
  <text x="642" y="82" text-anchor="middle" font-size="9" fill="#ede9fe">authoritative</text>

  <rect x="790" y="52" width="88" height="36" rx="7" fill="#be123c"/>
  <text x="834" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Push Svc</text>
  <text x="834" y="82" text-anchor="middle" font-size="9" fill="#fecdd3">VAPID Web Push</text>

  <!-- Lifelines -->
  <line x1="53" y1="88" x2="53" y2="585" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="192" y1="88" x2="192" y2="585" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="342" y1="88" x2="342" y2="585" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="492" y1="88" x2="492" y2="585" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="642" y1="88" x2="642" y2="585" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="834" y1="88" x2="834" y2="585" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- BAND A: Cache Strategies -->
  <rect x="8" y="98" width="878" height="16" rx="3" fill="#2563eb" opacity="0.2"/>
  <text x="450" y="110" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">PATH A — CACHE STRATEGIES (app shell cache-first SWR; API network-first 5min; auth network-only)</text>

  <line x1="53" y1="128" x2="182" y2="128" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="117" y="122" text-anchor="middle" font-size="9" fill="#374151">fetch(appShell.js) → SW intercept</text>

  <line x1="182" y1="142" x2="482" y2="142" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="332" y="136" text-anchor="middle" font-size="9" fill="#374151">cache-first: serve instantly; SWR update in bg → next load fresh</text>

  <line x1="53" y1="158" x2="182" y2="158" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="117" y="152" text-anchor="middle" font-size="9" fill="#374151">fetch(GET /tasks) → network-first; offline → cached ≤5min fallback</text>

  <line x1="182" y1="172" x2="63" y2="172" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="117" y="166" text-anchor="middle" font-size="9" fill="#374151">auth calls: network-only, no cache; fail → offline error banner</text>

  <!-- BAND B: Offline Mutation Queue -->
  <rect x="8" y="188" width="878" height="16" rx="3" fill="#2f9d74" opacity="0.2"/>
  <text x="450" y="200" text-anchor="middle" font-size="9" fill="#065f46" font-weight="bold">PATH B — OFFLINE MUTATION QUEUE (optimistic IDB write + queue; FIFO replay; 4xx failed; 5xx backoff)</text>

  <line x1="53" y1="218" x2="332" y2="218" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="192" y="212" text-anchor="middle" font-size="9" fill="#374151">offline: POST /tasks → optimistic IDB write (syncStatus:'pending') + queue &#123;id,op,payload&#125;</text>

  <line x1="332" y1="232" x2="63" y2="232" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="197" y="226" text-anchor="middle" font-size="9" fill="#374151">Dexie live query → React re-renders instantly (spinner icon on pending task)</text>

  <line x1="192" y1="248" x2="632" y2="248" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="412" y="242" text-anchor="middle" font-size="9" fill="#374151">online → replay queue FIFO: POST task to server</text>

  <line x1="632" y1="262" x2="332" y2="262" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="482" y="256" text-anchor="middle" font-size="9" fill="#374151">2xx → syncStatus:'synced'; 4xx → 'failed'+notify user; 5xx → backoff 2^retry×1s max 30s</text>

  <!-- BAND C: Background Sync -->
  <rect x="8" y="278" width="878" height="16" rx="3" fill="#d97843" opacity="0.2"/>
  <text x="450" y="290" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">PATH C — BACKGROUND SYNC API (sw.sync.register; sync fires tab-closed; processMutationQueue())</text>

  <line x1="53" y1="308" x2="182" y2="308" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="117" y="302" text-anchor="middle" font-size="9" fill="#374151">queue write → sw.sync.register('sync-mutations')</text>

  <line x1="182" y1="322" x2="332" y2="322" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="257" y="316" text-anchor="middle" font-size="9" fill="#374151">connectivity restored (tab closed) → browser fires sync event</text>

  <line x1="182" y1="338" x2="632" y2="338" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
  <text x="407" y="332" text-anchor="middle" font-size="9" fill="#374151">event.waitUntil(processMutationQueue()) → open IDB + replay all pending entries</text>

  <!-- BAND D: Conflict Resolution -->
  <rect x="8" y="354" width="878" height="16" rx="3" fill="#7c3aed" opacity="0.15"/>
  <text x="450" y="366" text-anchor="middle" font-size="9" fill="#5b21b6" font-weight="bold">PATH D — CONFLICT RESOLUTION (409 from server → LWW / server-auth / three-way merge by record type)</text>

  <line x1="632" y1="384" x2="182" y2="384" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="407" y="378" text-anchor="middle" font-size="9" fill="#374151">409 Conflict: server version changed since client mutation</text>

  <rect x="20" y="392" width="560" height="26" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1"/>
  <text x="300" y="408" text-anchor="middle" font-size="8.5" fill="#5b21b6" font-weight="600">User-owned record → LWW (client wins) | Shared record → server-auth (re-fetch) | Collaborative → three-way merge diff UI</text>

  <!-- BAND E: Web Push -->
  <rect x="8" y="428" width="878" height="16" rx="3" fill="#be123c" opacity="0.15"/>
  <text x="450" y="440" text-anchor="middle" font-size="9" fill="#9f1239" font-weight="bold">PATH E — WEB PUSH (VAPID subscribe; push event→showNotification; notificationclick→focus/open)</text>

  <line x1="53" y1="458" x2="182" y2="458" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="117" y="452" text-anchor="middle" font-size="9" fill="#374151">user clicks Enable → pushManager.subscribe(VAPID) → endpoint to server</text>

  <line x1="824" y1="472" x2="182" y2="472" stroke="#be123c" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="503" y="466" text-anchor="middle" font-size="9" fill="#374151">server pushes VAPID message → push service → SW push event → showNotification(title, &#123;data:url&#125;)</text>

  <line x1="182" y1="488" x2="63" y2="488" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="117" y="482" text-anchor="middle" font-size="9" fill="#374151">notificationclick → clients.openWindow(url) or focus existing tab</text>

  <!-- BAND F: SW Update -->
  <rect x="8" y="502" width="878" height="16" rx="3" fill="#2563eb" opacity="0.12"/>
  <text x="450" y="514" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">PATH F — SW UPDATE (skipWaiting install; controllerchange→reload; "Update available" toast)</text>

  <line x1="182" y1="532" x2="482" y2="532" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="332" y="526" text-anchor="middle" font-size="9" fill="#374151">new SW deployed → browser downloads → install: self.skipWaiting()</text>

  <line x1="182" y1="546" x2="63" y2="546" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="117" y="540" text-anchor="middle" font-size="9" fill="#374151">controllerchange event → show toast "Update available" → reload</text>

  <!-- Metrics footer -->
  <rect x="8" y="562" width="878" height="44" rx="6" fill="#1a1822"/>
  <text x="65" y="580" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">App Shell</text>
  <text x="65" y="597" text-anchor="middle" font-size="12" fill="white" font-weight="700">cache-first SWR</text>

  <text x="200" y="580" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">API Cache</text>
  <text x="200" y="597" text-anchor="middle" font-size="12" fill="white" font-weight="700">5min fallback</text>

  <text x="355" y="580" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Queue Retry</text>
  <text x="355" y="597" text-anchor="middle" font-size="12" fill="white" font-weight="700">2^n ≤30s x5</text>

  <text x="510" y="580" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">BG Sync</text>
  <text x="510" y="597" text-anchor="middle" font-size="12" fill="white" font-weight="700">tab-closed</text>

  <text x="680" y="580" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Conflict</text>
  <text x="680" y="597" text-anchor="middle" font-size="12" fill="white" font-weight="700">LWW/merge</text>

  <text x="845" y="580" text-anchor="middle" font-size="9" fill="#fecdd3" font-weight="600">Push Perm</text>
  <text x="845" y="597" text-anchor="middle" font-size="12" fill="white" font-weight="700">in-app first</text>
</svg>
