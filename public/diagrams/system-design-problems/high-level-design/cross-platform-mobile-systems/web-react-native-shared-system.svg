<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="600" fill="#f3f1f8"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Web + React Native Shared Monorepo System</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="14" y="52" width="80" height="36" rx="7" fill="#6d5bd0"/>
  <text x="54" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">apps/web</text>
  <text x="54" y="82" text-anchor="middle" font-size="9" fill="#edeaf5">Next.js</text>

  <rect x="152" y="52" width="90" height="36" rx="7" fill="#be123c"/>
  <text x="197" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">apps/mobile</text>
  <text x="197" y="82" text-anchor="middle" font-size="9" fill="#fecdd3">RN / Expo</text>

  <rect x="308" y="52" width="90" height="36" rx="7" fill="#2f9d74"/>
  <text x="353" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">packages/ui</text>
  <text x="353" y="82" text-anchor="middle" font-size="9" fill="#d1fae5">.web.tsx/.native</text>

  <rect x="462" y="52" width="90" height="36" rx="7" fill="#2563eb"/>
  <text x="507" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">packages/core</text>
  <text x="507" y="82" text-anchor="middle" font-size="9" fill="#dbeafe">no platform API</text>

  <rect x="616" y="52" width="90" height="36" rx="7" fill="#d97843"/>
  <text x="661" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">packages/tokens</text>
  <text x="661" y="82" text-anchor="middle" font-size="9" fill="#fef3c7">JS → CSS/RN</text>

  <rect x="786" y="52" width="90" height="36" rx="7" fill="#7c3aed"/>
  <text x="831" y="68" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">CI/CD</text>
  <text x="831" y="82" text-anchor="middle" font-size="9" fill="#ede9fe">Turborepo cache</text>

  <!-- Lifelines -->
  <line x1="54" y1="88" x2="54" y2="566" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="197" y1="88" x2="197" y2="566" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="353" y1="88" x2="353" y2="566" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="507" y1="88" x2="507" y2="566" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="661" y1="88" x2="661" y2="566" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="831" y1="88" x2="831" y2="566" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- BAND A: Platform File Resolution -->
  <rect x="8" y="98" width="878" height="16" rx="3" fill="#2f9d74" opacity="0.2"/>
  <text x="450" y="110" text-anchor="middle" font-size="9" fill="#065f46" font-weight="bold">PATH A — PLATFORM FILE RESOLUTION (same import → .web.tsx or .native.tsx; bundler selects)</text>

  <line x1="64" y1="128" x2="343" y2="128" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="203" y="122" text-anchor="middle" font-size="9" fill="#374151">import &#123;Button&#125; from "@repo/ui" → webpack resolves Button.web.tsx</text>

  <line x1="207" y1="142" x2="343" y2="142" stroke="#be123c" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="275" y="136" text-anchor="middle" font-size="9" fill="#374151">import &#123;Button&#125; from "@repo/ui" → Metro resolves Button.native.tsx</text>

  <rect x="20" y="150" width="540" height="24" rx="4" fill="#f0fdf4" stroke="#2f9d74" stroke-width="1"/>
  <text x="290" y="166" text-anchor="middle" font-size="8.5" fill="#065f46" font-weight="600">Button.web.tsx: &lt;button&gt; + CSS | Button.native.tsx: TouchableOpacity | Button.types.ts: shared props</text>

  <!-- BAND B: Shared Core Boundary -->
  <rect x="8" y="182" width="878" height="16" rx="3" fill="#2563eb" opacity="0.2"/>
  <text x="450" y="194" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">PATH B — PLATFORM BOUNDARY (ESLint no-restricted-imports; TypeScript no-dom lib; zero RN dep in core)</text>

  <line x1="497" y1="212" x2="343" y2="212" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="420" y="206" text-anchor="middle" font-size="9" fill="#374151">packages/core imports → ESLint blocks react-dom, window, document, localStorage</text>

  <rect x="20" y="220" width="560" height="24" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1"/>
  <text x="300" y="236" text-anchor="middle" font-size="8.5" fill="#1d4ed8" font-weight="600">tsconfig: no "dom" lib | Zod schemas, Zustand stores, API client, validators → run on both runtimes</text>

  <!-- BAND C: Shared Storage -->
  <rect x="8" y="252" width="878" height="16" rx="3" fill="#d97843" opacity="0.2"/>
  <text x="450" y="264" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">PATH C — PLATFORM STORAGE (createStorage() factory; .web.ts→localStorage; .native.ts→AsyncStorage)</text>

  <line x1="497" y1="282" x2="64" y2="282" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="280" y="276" text-anchor="middle" font-size="9" fill="#374151">Zustand persist(store, &#123;storage: createStorage()&#125;) → storage.web.ts returns localStorage adapter</text>

  <line x1="497" y1="296" x2="207" y2="296" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="352" y="290" text-anchor="middle" font-size="9" fill="#374151">storage.native.ts → AsyncStorage; SecureStore for auth tokens (HttpOnly not available in RN)</text>

  <!-- BAND D: Design Tokens -->
  <rect x="8" y="312" width="878" height="16" rx="3" fill="#d97843" opacity="0.15"/>
  <text x="450" y="324" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">PATH D — DESIGN TOKENS (JS object once; CSS custom-props for web; StyleSheet.create() values for RN)</text>

  <line x1="651" y1="342" x2="64" y2="342" stroke="#d97843" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="357" y="336" text-anchor="middle" font-size="9" fill="#374151">tokens.js &#123;colors.primary:'#6d5bd0', spacing[4]:16&#125; → build script generates tokens.css (--color-primary)</text>

  <line x1="651" y1="356" x2="207" y2="356" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="429" y="350" text-anchor="middle" font-size="9" fill="#374151">RN: import tokens → StyleSheet.create(&#123;btn:&#123;backgroundColor:tokens.colors.primary&#125;&#125;) — same value guaranteed</text>

  <!-- BAND E: Deep Links + Push -->
  <rect x="8" y="372" width="878" height="16" rx="3" fill="#7c3aed" opacity="0.15"/>
  <text x="450" y="384" text-anchor="middle" font-size="9" fill="#5b21b6" font-weight="bold">PATH E — DEEP LINKS + PUSH (RN linking config URL→screen; AASA universal links; shared notif handlers)</text>

  <line x1="207" y1="402" x2="497" y2="402" stroke="#be123c" stroke-width="2" marker-end="url(#arr)"/>
  <text x="352" y="396" text-anchor="middle" font-size="9" fill="#374151">myapp://profile/123 → React Navigation linking config → ProfileScreen(&#123;id:123&#125;)</text>

  <line x1="207" y1="416" x2="64" y2="416" stroke="#be123c" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="135" y="410" text-anchor="middle" font-size="9" fill="#374151">web: React Router handles https://; RN cold-start: Linking.getInitialURL()</text>

  <line x1="207" y1="432" x2="497" y2="432" stroke="#be123c" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="352" y="444" text-anchor="middle" font-size="9" fill="#374151">push tap → shared handleNotification(payload) in core → web: navigate(url); RN: navigation.navigate(screen)</text>

  <!-- BAND F: CI/CD Turborepo -->
  <rect x="8" y="456" width="878" height="16" rx="3" fill="#be123c" opacity="0.15"/>
  <text x="450" y="468" text-anchor="middle" font-size="9" fill="#9f1239" font-weight="bold">PATH F — TURBOREPO CI (topo order: tokens→core→ui→apps parallel; remote cache; changed pkg only)</text>

  <line x1="821" y1="486" x2="497" y2="486" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="659" y="480" text-anchor="middle" font-size="9" fill="#374151">turbo build → topo: tokens first, then core+validators, then ui, then web+mobile parallel</text>

  <line x1="821" y1="500" x2="64" y2="500" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="442" y="494" text-anchor="middle" font-size="9" fill="#374151">remote cache: unchanged packages skipped → PR CI: change in apps/web only rebuilds web (not core or ui)</text>

  <!-- Metrics footer -->
  <rect x="8" y="516" width="878" height="50" rx="6" fill="#1a1822"/>
  <text x="70" y="534" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">Code Share</text>
  <text x="70" y="552" text-anchor="middle" font-size="12" fill="white" font-weight="700">~65% shared</text>

  <text x="210" y="534" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Boundary</text>
  <text x="210" y="552" text-anchor="middle" font-size="12" fill="white" font-weight="700">ESLint + tsc</text>

  <text x="370" y="534" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Storage</text>
  <text x="370" y="552" text-anchor="middle" font-size="12" fill="white" font-weight="700">factory pattern</text>

  <text x="530" y="534" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Tokens</text>
  <text x="530" y="552" text-anchor="middle" font-size="12" fill="white" font-weight="700">single source</text>

  <text x="700" y="534" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">CI Cache</text>
  <text x="700" y="552" text-anchor="middle" font-size="12" fill="white" font-weight="700">remote Turborepo</text>

  <text x="855" y="534" text-anchor="middle" font-size="9" fill="#fecdd3" font-weight="600">Validation</text>
  <text x="855" y="552" text-anchor="middle" font-size="12" fill="white" font-weight="700">Zod both</text>
</svg>
