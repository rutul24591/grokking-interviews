<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="960" height="660" fill="#f4f2fb"/>
  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Viral Sharing &amp; Engagement — Deep Links, OG Images, Attribution, HLL Counts</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="14" y="50" width="932" height="16" rx="4" fill="#6d5bd0" opacity="0.14"/>
  <text x="20" y="62" font-size="10" font-weight="bold" fill="#6d5bd0">ACTORS</text>

  <rect x="20" y="72" width="90" height="36" rx="7" fill="#6d5bd0"/>
  <text x="65" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Sender</text>
  <text x="65" y="102" text-anchor="middle" font-size="10" fill="#edeaf5">Browser/App</text>

  <rect x="180" y="72" width="96" height="36" rx="7" fill="#6d5bd0"/>
  <text x="228" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Share API</text>
  <text x="228" y="102" text-anchor="middle" font-size="10" fill="#edeaf5">shortlink gen</text>

  <rect x="348" y="72" width="100" height="36" rx="7" fill="#2f9d74"/>
  <text x="398" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">OG Image Svc</text>
  <text x="398" y="102" text-anchor="middle" font-size="10" fill="#e8f5f0">Puppeteer + S3</text>

  <rect x="520" y="72" width="100" height="36" rx="7" fill="#2f9d74"/>
  <text x="570" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Attribution Svc</text>
  <text x="570" y="102" text-anchor="middle" font-size="10" fill="#e8f5f0">click → register</text>

  <rect x="692" y="72" width="100" height="36" rx="7" fill="#d97843"/>
  <text x="742" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Redis HLL</text>
  <text x="742" y="102" text-anchor="middle" font-size="10" fill="#fff5ee">PFADD/PFCOUNT</text>

  <rect x="856" y="72" width="90" height="36" rx="7" fill="#1a1822"/>
  <text x="901" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">CDN Pre-warm</text>
  <text x="901" y="102" text-anchor="middle" font-size="10" fill="#d7d1e6">viral detection</text>

  <!-- Lifelines -->
  <line x1="65" y1="108" x2="65" y2="520" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="228" y1="108" x2="228" y2="520" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="398" y1="108" x2="398" y2="520" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="570" y1="108" x2="570" y2="520" stroke="#c4b8e8" stroke-width="1" stroke-dasharray="4,5" opacity="0.6"/>
  <line x1="742" y1="108" x2="742" y2="520" stroke="#c4b8e8" stroke-width="1" stroke-dasharray="4,5" opacity="0.5"/>
  <line x1="901" y1="108" x2="901" y2="520" stroke="#c4b8e8" stroke-width="1" stroke-dasharray="4,5" opacity="0.4"/>

  <!-- PATH A: Share link + OG image -->
  <rect x="14" y="118" width="932" height="16" rx="4" fill="#2f9d74" opacity="0.13"/>
  <text x="480" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">PATH A — Share Link Generation + OG Image (cached &lt;2s first render, &lt;5ms cache hit)</text>

  <line x1="65" y1="148" x2="218" y2="148" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="141" y="142" text-anchor="middle" font-size="10" fill="#1a1822">POST /api/share {contentId} → Web Share API</text>

  <line x1="228" y1="162" x2="218" y2="162" stroke="#6d5bd0" stroke-width="1"/>
  <rect x="186" y="162" width="84" height="20" rx="5" fill="#6d5bd0"/>
  <text x="228" y="176" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">s.app/{code}?ref=uid</text>

  <line x1="228" y1="190" x2="388" y2="190" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="308" y="184" text-anchor="middle" font-size="10" fill="#1a1822">GET og:{contentId} cache check</text>

  <rect x="356" y="196" width="84" height="20" rx="5" fill="#c0392b"/>
  <text x="398" y="210" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">MISS → Puppeteer</text>

  <line x1="398" y1="224" x2="398" y2="232" stroke="#d97843" stroke-width="1.5"/>
  <rect x="356" y="232" width="84" height="20" rx="5" fill="#2f9d74"/>
  <text x="398" y="246" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">screenshot PNG → S3</text>

  <line x1="388" y1="260" x2="238" y2="260" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="313" y="254" text-anchor="middle" font-size="10" fill="#2f9d74">cache og:{contentId} TTL 24h → ogImageUrl</text>

  <line x1="218" y1="274" x2="75" y2="274" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="146" y="268" text-anchor="middle" font-size="10" fill="#2f9d74">{shortUrl, ogImageUrl} → Web Share API triggers native sheet</text>

  <!-- PATH B: Deep link flow -->
  <rect x="14" y="292" width="932" height="16" rx="4" fill="#6d5bd0" opacity="0.12"/>
  <text x="480" y="304" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">PATH B — Deep Link + Deferred Deep Link (Universal Link, fingerprint attribution)</text>

  <rect x="25" y="316" width="260" height="36" rx="6" fill="#6d5bd0" opacity="0.18"/>
  <text x="155" y="330" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Universal Link: /.well-known/apple-app-site-association</text>
  <text x="155" y="344" text-anchor="middle" font-size="10" fill="#6d5bd0">tap → app installed: open to contentId</text>

  <rect x="300" y="316" width="330" height="36" rx="6" fill="#d97843" opacity="0.18"/>
  <text x="465" y="330" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">App NOT installed: web fallback + app store link</text>
  <text x="465" y="344" text-anchor="middle" font-size="10" fill="#d97843">store fingerprint {contentId, ref, deviceHash} in DB</text>

  <line x1="65" y1="362" x2="560" y2="362" stroke="#2f9d74" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="312" y="356" text-anchor="middle" font-size="10" fill="#2f9d74">app first open: POST /api/deep-link/resolve {deviceFingerprint} → {contentId} ~85% accuracy</text>

  <!-- PATH C: Referral attribution -->
  <rect x="14" y="378" width="932" height="16" rx="4" fill="#d97843" opacity="0.13"/>
  <text x="480" y="390" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">PATH C — Referral Attribution (7-day last-touch cookie join)</text>

  <line x1="65" y1="406" x2="560" y2="406" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="312" y="400" text-anchor="middle" font-size="10" fill="#1a1822">click shortlink → record click_events {shortCode, refUserId, visitorId cookie}</text>

  <line x1="570" y1="420" x2="78" y2="420" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="324" y="414" text-anchor="middle" font-size="10" fill="#2f9d74">on register: JOIN click_events WHERE visitorId=newUser AND ts &gt; now-7d → referral.attributed Kafka</text>

  <!-- PATH D: Share count HLL + viral detection -->
  <rect x="14" y="436" width="932" height="16" rx="4" fill="#c0392b" opacity="0.09"/>
  <text x="480" y="448" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">PATH D — Share Count HyperLogLog + Viral Detection → CDN Pre-warm</text>

  <line x1="228" y1="464" x2="732" y2="464" stroke="#d97843" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="480" y="458" text-anchor="middle" font-size="10" fill="#d97843">PFADD shares:{contentId} {userId} on each share event</text>

  <line x1="742" y1="478" x2="238" y2="478" stroke="#d97843" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="490" y="472" text-anchor="middle" font-size="10" fill="#d97843">PFCOUNT → ~0.81% error; display "1.2K shares" / "3.4M shares"</text>

  <line x1="742" y1="494" x2="891" y2="494" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="816" y="488" text-anchor="middle" font-size="10" fill="#c0392b">velocity &gt;100/min → CDN pre-warm all edges</text>

  <!-- Metrics Panel -->
  <rect x="14" y="516" width="932" height="16" rx="4" fill="#1a1822" opacity="0.07"/>
  <text x="480" y="528" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1822">KEY METRICS AND DESIGN DECISIONS</text>

  <rect x="20" y="540" width="220" height="68" rx="6" fill="#fff" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="130" y="556" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">OG Image Cache</text>
  <text x="130" y="570" text-anchor="middle" font-size="10" fill="#1a1822">First share: Puppeteer render &lt;2s</text>
  <text x="130" y="584" text-anchor="middle" font-size="10" fill="#1a1822">Subsequent: Redis cache &lt;5ms</text>
  <text x="130" y="598" text-anchor="middle" font-size="10" fill="#2f9d74">Pre-warm on publish for popular content</text>

  <rect x="256" y="540" width="220" height="68" rx="6" fill="#fff" stroke="#2f9d74" stroke-width="1.5"/>
  <text x="366" y="556" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">HyperLogLog</text>
  <text x="366" y="570" text-anchor="middle" font-size="10" fill="#1a1822">12 KB per counter always</text>
  <text x="366" y="584" text-anchor="middle" font-size="10" fill="#1a1822">±0.81% error (invisible at display granularity)</text>
  <text x="366" y="598" text-anchor="middle" font-size="10" fill="#2f9d74">PFADD = distinct users (no double-count)</text>

  <rect x="492" y="540" width="220" height="68" rx="6" fill="#fff" stroke="#d97843" stroke-width="1.5"/>
  <text x="602" y="556" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Attribution Window</text>
  <text x="602" y="570" text-anchor="middle" font-size="10" fill="#1a1822">7-day last-touch cookie</text>
  <text x="602" y="584" text-anchor="middle" font-size="10" fill="#1a1822">fingerprint fallback for deferred DL</text>
  <text x="602" y="598" text-anchor="middle" font-size="10" fill="#d97843">~85% deferred accuracy</text>

  <rect x="728" y="540" width="218" height="68" rx="6" fill="#fff" stroke="#1a1822" stroke-width="1.5"/>
  <text x="837" y="556" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1822">CDN Pre-warm</text>
  <text x="837" y="570" text-anchor="middle" font-size="10" fill="#1a1822">share velocity &gt;100/min threshold</text>
  <text x="837" y="584" text-anchor="middle" font-size="10" fill="#1a1822">HTTP/2 parallel HEAD to all regions</text>
  <text x="837" y="598" text-anchor="middle" font-size="10" fill="#c0392b">completes &lt;10s before traffic spike</text>
</svg>
