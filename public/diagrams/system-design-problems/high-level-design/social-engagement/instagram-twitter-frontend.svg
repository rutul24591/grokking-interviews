<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="960" height="660" fill="#f3f1f8"/>
  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Instagram / Twitter Frontend — Feed, Media Upload, Real-Time Engagement</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="14" y="50" width="932" height="16" rx="4" fill="#6d5bd0" opacity="0.14"/>
  <text x="20" y="62" font-size="10" font-weight="bold" fill="#6d5bd0">ACTORS</text>

  <rect x="20" y="72" width="90" height="36" rx="7" fill="#6d5bd0"/>
  <text x="65" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Browser</text>
  <text x="65" y="102" text-anchor="middle" font-size="10" fill="#edeaf5">React SPA</text>

  <rect x="178" y="72" width="96" height="36" rx="7" fill="#6d5bd0"/>
  <text x="226" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Feed API</text>
  <text x="226" y="102" text-anchor="middle" font-size="10" fill="#edeaf5">+ Engagement</text>

  <rect x="344" y="72" width="96" height="36" rx="7" fill="#2f9d74"/>
  <text x="392" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Media Svc</text>
  <text x="392" y="102" text-anchor="middle" font-size="10" fill="#e8f5f0">Lambda + FFmpeg</text>

  <rect x="510" y="72" width="90" height="36" rx="7" fill="#2f9d74"/>
  <text x="555" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">S3 + CDN</text>
  <text x="555" y="102" text-anchor="middle" font-size="10" fill="#e8f5f0">CloudFront</text>

  <rect x="672" y="72" width="96" height="36" rx="7" fill="#d97843"/>
  <text x="720" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">WS Server</text>
  <text x="720" y="102" text-anchor="middle" font-size="10" fill="#fff5ee">Engagement Pub</text>

  <rect x="840" y="72" width="96" height="36" rx="7" fill="#1a1822"/>
  <text x="888" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Kafka</text>
  <text x="888" y="102" text-anchor="middle" font-size="10" fill="#d7d1e6">interactions</text>

  <!-- Lifelines -->
  <line x1="65" y1="108" x2="65" y2="540" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="226" y1="108" x2="226" y2="540" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="392" y1="108" x2="392" y2="540" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="555" y1="108" x2="555" y2="540" stroke="#c4b8e8" stroke-width="1" stroke-dasharray="4,5" opacity="0.6"/>
  <line x1="720" y1="108" x2="720" y2="540" stroke="#c4b8e8" stroke-width="1" stroke-dasharray="4,5" opacity="0.5"/>
  <line x1="888" y1="108" x2="888" y2="540" stroke="#c4b8e8" stroke-width="1" stroke-dasharray="4,5" opacity="0.4"/>

  <!-- PATH A: Feed load -->
  <rect x="14" y="118" width="932" height="16" rx="4" fill="#2f9d74" opacity="0.13"/>
  <text x="480" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">PATH A — Feed Load (static shell CDN + personalized feed client-side)</text>

  <line x1="65" y1="148" x2="545" y2="148" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="305" y="142" text-anchor="middle" font-size="10" fill="#1a1822">GET cdn/shell.html (static, max-age=3600)</text>

  <line x1="545" y1="162" x2="75" y2="162" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="310" y="156" text-anchor="middle" font-size="10" fill="#2f9d74">Shell HTML ~8ms from CDN edge</text>

  <line x1="65" y1="176" x2="216" y2="176" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="140" y="170" text-anchor="middle" font-size="10" fill="#d97843">GET /api/feed?cursor=null (hydrate)</text>

  <line x1="226" y1="188" x2="226" y2="196" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="184" y="196" width="84" height="20" rx="5" fill="#6d5bd0"/>
  <text x="226" y="210" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Redis feed cache</text>

  <line x1="216" y1="224" x2="75" y2="224" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="145" y="218" text-anchor="middle" font-size="10" fill="#2f9d74">{posts[20] + next_cursor} + engagement state</text>

  <!-- PATH B: Direct S3 media upload -->
  <rect x="14" y="240" width="932" height="16" rx="4" fill="#6d5bd0" opacity="0.12"/>
  <text x="480" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">PATH B — Media Upload (presigned S3 — no proxy, direct browser-to-S3)</text>

  <line x1="65" y1="270" x2="216" y2="270" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="140" y="264" text-anchor="middle" font-size="10" fill="#1a1822">POST /api/upload/presign {type,size}</text>

  <line x1="216" y1="284" x2="75" y2="284" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="145" y="278" text-anchor="middle" font-size="10" fill="#6d5bd0">presignedUrl (15min TTL)</text>

  <line x1="65" y1="298" x2="545" y2="298" stroke="#2f9d74" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <text x="305" y="292" text-anchor="middle" font-size="10" fill="#2f9d74">PUT s3://bucket/raw/photo.jpg (direct, no proxy, 100MB)</text>

  <line x1="555" y1="312" x2="382" y2="312" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="469" y="306" text-anchor="middle" font-size="10" fill="#d97843">s3:ObjectCreated → Lambda: resize 320/640/1080w WebP AVIF</text>

  <line x1="392" y1="326" x2="545" y2="326" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="469" y="320" text-anchor="middle" font-size="10" fill="#2f9d74">processed assets → CDN origin (immutable URLs)</text>

  <rect x="25" y="334" width="180" height="20" rx="5" fill="#2f9d74"/>
  <text x="115" y="348" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">poll /api/posts/{id}/status → LIVE</text>

  <!-- PATH C: Reels HLS playback -->
  <rect x="14" y="360" width="932" height="16" rx="4" fill="#d97843" opacity="0.13"/>
  <text x="480" y="372" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">PATH C — Reels HLS Adaptive Bitrate (hls.js, prefetch next 2 reels)</text>

  <line x1="65" y1="390" x2="545" y2="390" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="305" y="384" text-anchor="middle" font-size="10" fill="#1a1822">GET cdn/reels/{id}/manifest.m3u8 (HLS playlist)</text>

  <rect x="25" y="398" width="200" height="20" rx="5" fill="#d97843"/>
  <text x="125" y="412" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">hls.js: probe BW → switch 360p→1080p</text>

  <line x1="65" y1="426" x2="545" y2="426" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="305" y="420" text-anchor="middle" font-size="10" fill="#d97843">prefetch next 2 reels manifests + first segments</text>

  <!-- PATH D: Real-time engagement WS -->
  <rect x="14" y="442" width="932" height="16" rx="4" fill="#c0392b" opacity="0.09"/>
  <text x="480" y="454" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">PATH D — Real-Time Engagement (WebSocket + Optimistic UI)</text>

  <line x1="65" y1="472" x2="710" y2="472" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="387" y="466" text-anchor="middle" font-size="10" fill="#1a1822">WS subscribe: post:{postId} (on post visible)</text>

  <rect x="25" y="480" width="175" height="20" rx="5" fill="#c0392b"/>
  <text x="112" y="494" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">♥ tap → optimistic +1 animation</text>

  <line x1="65" y1="508" x2="216" y2="508" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="140" y="502" text-anchor="middle" font-size="10" fill="#d97843">POST /api/like {postId} (async confirm)</text>

  <line x1="888" y1="520" x2="730" y2="520" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="809" y="514" text-anchor="middle" font-size="10" fill="#2f9d74">Kafka like.created → fan-out → WS push {likeCount}</text>

  <line x1="710" y1="532" x2="75" y2="532" stroke="#2f9d74" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <text x="392" y="526" text-anchor="middle" font-size="10" fill="#2f9d74">WS push → like count updated within 3s</text>

  <!-- Metrics Panel -->
  <rect x="14" y="550" width="932" height="16" rx="4" fill="#1a1822" opacity="0.07"/>
  <text x="480" y="562" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1822">CDN IMAGE DELIVERY: responsive srcset + AVIF/WebP + blurhash placeholder</text>

  <rect x="20" y="574" width="220" height="56" rx="6" fill="#fff" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="130" y="590" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Srcset Variants</text>
  <text x="130" y="604" text-anchor="middle" font-size="10" fill="#1a1822">320w, 640w, 1080w WebP + AVIF</text>
  <text x="130" y="618" text-anchor="middle" font-size="10" fill="#2f9d74">Cache-Control: max-age=31536000 immutable</text>

  <rect x="256" y="574" width="220" height="56" rx="6" fill="#fff" stroke="#2f9d74" stroke-width="1.5"/>
  <text x="366" y="590" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Blurhash Placeholder</text>
  <text x="366" y="604" text-anchor="middle" font-size="10" fill="#1a1822">~30-byte Base83 color palette</text>
  <text x="366" y="618" text-anchor="middle" font-size="10" fill="#2f9d74">canvas decode → CSS fade-in 200ms</text>

  <rect x="492" y="574" width="220" height="56" rx="6" fill="#fff" stroke="#d97843" stroke-width="1.5"/>
  <text x="602" y="590" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Feed Performance</text>
  <text x="602" y="604" text-anchor="middle" font-size="10" fill="#1a1822">Above-fold: rel=preload; rest: loading=lazy</text>
  <text x="602" y="618" text-anchor="middle" font-size="10" fill="#d97843">First content visible &lt;1.5s on 4G</text>

  <rect x="728" y="574" width="218" height="56" rx="6" fill="#fff" stroke="#1a1822" stroke-width="1.5"/>
  <text x="837" y="590" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1822">Engagement Optimistic</text>
  <text x="837" y="604" text-anchor="middle" font-size="10" fill="#1a1822">Like: instant anim → async confirm</text>
  <text x="837" y="618" text-anchor="middle" font-size="10" fill="#c0392b">Rollback on error (&lt;1% rate)</text>
</svg>
