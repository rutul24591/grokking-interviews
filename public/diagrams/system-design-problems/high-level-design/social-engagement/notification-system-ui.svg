<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="960" height="660" fill="#f4f2fb"/>
  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Notification System UI — Multi-Channel: In-App, Web Push, Email</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="14" y="50" width="932" height="16" rx="4" fill="#6d5bd0" opacity="0.14"/>
  <text x="20" y="62" font-size="10" font-weight="bold" fill="#6d5bd0">ACTORS</text>

  <rect x="20" y="72" width="90" height="36" rx="7" fill="#6d5bd0"/>
  <text x="65" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Browser</text>
  <text x="65" y="102" text-anchor="middle" font-size="10" fill="#edeaf5">+ ServiceWorker</text>

  <rect x="180" y="72" width="96" height="36" rx="7" fill="#6d5bd0"/>
  <text x="228" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">SSE Server</text>
  <text x="228" y="102" text-anchor="middle" font-size="10" fill="#edeaf5">badge stream</text>

  <rect x="348" y="72" width="100" height="36" rx="7" fill="#2f9d74"/>
  <text x="398" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Redis Pub/Sub</text>
  <text x="398" y="102" text-anchor="middle" font-size="10" fill="#e8f5f0">notif:{userId}</text>

  <rect x="520" y="72" width="100" height="36" rx="7" fill="#2f9d74"/>
  <text x="570" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Aggregation</text>
  <text x="570" y="102" text-anchor="middle" font-size="10" fill="#e8f5f0">Worker + DB</text>

  <rect x="692" y="72" width="100" height="36" rx="7" fill="#d97843"/>
  <text x="742" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Push Gateway</text>
  <text x="742" y="102" text-anchor="middle" font-size="10" fill="#fff5ee">VAPID / FCM</text>

  <rect x="856" y="72" width="90" height="36" rx="7" fill="#1a1822"/>
  <text x="901" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Email Svc</text>
  <text x="901" y="102" text-anchor="middle" font-size="10" fill="#d7d1e6">SendGrid</text>

  <!-- Lifelines -->
  <line x1="65" y1="108" x2="65" y2="520" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="228" y1="108" x2="228" y2="520" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="398" y1="108" x2="398" y2="520" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="570" y1="108" x2="570" y2="520" stroke="#c4b8e8" stroke-width="1" stroke-dasharray="4,5" opacity="0.6"/>
  <line x1="742" y1="108" x2="742" y2="520" stroke="#c4b8e8" stroke-width="1" stroke-dasharray="4,5" opacity="0.5"/>
  <line x1="901" y1="108" x2="901" y2="520" stroke="#c4b8e8" stroke-width="1" stroke-dasharray="4,5" opacity="0.4"/>

  <!-- PATH A: Notification generation and SSE badge -->
  <rect x="14" y="118" width="932" height="16" rx="4" fill="#2f9d74" opacity="0.13"/>
  <text x="480" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">PATH A — Notification Generation → SSE Badge Update (within 5s)</text>

  <line x1="570" y1="148" x2="408" y2="148" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="489" y="142" text-anchor="middle" font-size="10" fill="#d97843">Kafka like.created → aggregate (5min window)</text>

  <line x1="570" y1="162" x2="408" y2="162" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="489" y="156" text-anchor="middle" font-size="10" fill="#1a1822">PUBLISH notif:{userId} {unreadCount:7}</text>

  <line x1="398" y1="176" x2="238" y2="176" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="318" y="170" text-anchor="middle" font-size="10" fill="#2f9d74">Redis delivers to SSE server</text>

  <line x1="218" y1="190" x2="75" y2="190" stroke="#2f9d74" stroke-width="2.5" marker-end="url(#arr-g)"/>
  <text x="146" y="184" text-anchor="middle" font-size="10" fill="#2f9d74">SSE event: data:{unreadCount:7}</text>

  <rect x="25" y="198" width="150" height="20" rx="5" fill="#2f9d74"/>
  <text x="100" y="212" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Bell badge: 7 (red circle)</text>

  <!-- PATH B: Web Push registration -->
  <rect x="14" y="226" width="932" height="16" rx="4" fill="#6d5bd0" opacity="0.12"/>
  <text x="480" y="238" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">PATH B — Web Push Registration (VAPID, deferred 30s prompt)</text>

  <rect x="25" y="248" width="190" height="20" rx="5" fill="#6d5bd0" opacity="0.20"/>
  <text x="120" y="262" text-anchor="middle" font-size="10" fill="#6d5bd0" font-weight="bold">30s active: requestNotificationPermission()</text>

  <line x1="65" y1="278" x2="65" y2="286" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="25" y="286" width="180" height="20" rx="5" fill="#6d5bd0"/>
  <text x="115" y="300" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">SW register → pushManager.subscribe</text>

  <line x1="65" y1="314" x2="570" y2="314" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="317" y="308" text-anchor="middle" font-size="10" fill="#1a1822">POST /api/push/subscribe {endpoint, keys}</text>

  <rect x="528" y="320" width="84" height="20" rx="5" fill="#2f9d74"/>
  <text x="570" y="334" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">Stored ✓</text>

  <!-- PATH C: Push delivery -->
  <rect x="14" y="352" width="932" height="16" rx="4" fill="#d97843" opacity="0.13"/>
  <text x="480" y="364" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">PATH C — High-Priority Web Push Delivery (DM / mention, within 10s)</text>

  <line x1="570" y1="382" x2="732" y2="382" stroke="#d97843" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="651" y="376" text-anchor="middle" font-size="10" fill="#d97843">POST push endpoint (VAPID signed payload)</text>

  <line x1="742" y1="396" x2="75" y2="396" stroke="#d97843" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="408" y="390" text-anchor="middle" font-size="10" fill="#d97843">SW: self.addEventListener push → showNotification(title, body, icon, url)</text>

  <line x1="65" y1="410" x2="65" y2="418" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="25" y="418" width="190" height="20" rx="5" fill="#d97843"/>
  <text x="120" y="432" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">click → clients.openWindow(url)</text>

  <!-- PATH D: Notification inbox -->
  <rect x="14" y="444" width="932" height="16" rx="4" fill="#1a1822" opacity="0.08"/>
  <text x="480" y="456" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1822">PATH D — Notification Inbox (stale-while-revalidate, grouped actors, read sync)</text>

  <line x1="65" y1="472" x2="218" y2="472" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="141" y="466" text-anchor="middle" font-size="10" fill="#1a1822">GET /api/notifications?cursor=null (SWR 30s)</text>

  <line x1="218" y1="486" x2="75" y2="486" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="146" y="480" text-anchor="middle" font-size="10" fill="#2f9d74">grouped: "Alice, Bob +498 others liked your post"</text>

  <line x1="65" y1="500" x2="560" y2="500" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="312" y="494" text-anchor="middle" font-size="10" fill="#6d5bd0">PATCH /api/notifications/{id}/read → PUBLISH {unreadCount:6} → badge-1</text>

  <!-- Metrics Panel -->
  <rect x="14" y="528" width="932" height="16" rx="4" fill="#6d5bd0" opacity="0.10"/>
  <text x="480" y="540" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">AGGREGATION + PREFERENCES</text>

  <rect x="20" y="552" width="220" height="68" rx="6" fill="#fff" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="130" y="568" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Grouping Window</text>
  <text x="130" y="582" text-anchor="middle" font-size="10" fill="#1a1822">Social: 5min sliding window</text>
  <text x="130" y="596" text-anchor="middle" font-size="10" fill="#1a1822">Mentions/DMs: immediate</text>
  <text x="130" y="610" text-anchor="middle" font-size="10" fill="#2f9d74">Actors stored: top 3 + total count</text>

  <rect x="256" y="552" width="220" height="68" rx="6" fill="#fff" stroke="#2f9d74" stroke-width="1.5"/>
  <text x="366" y="568" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Preference Grid</text>
  <text x="366" y="582" text-anchor="middle" font-size="10" fill="#1a1822">Row: Likes / Comments / Follows</text>
  <text x="366" y="596" text-anchor="middle" font-size="10" fill="#1a1822">Col: In-app / Push / Email</text>
  <text x="366" y="610" text-anchor="middle" font-size="10" fill="#d97843">Toggle → PATCH optimistic update</text>

  <rect x="492" y="552" width="220" height="68" rx="6" fill="#fff" stroke="#d97843" stroke-width="1.5"/>
  <text x="602" y="568" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Email Digest</text>
  <text x="602" y="582" text-anchor="middle" font-size="10" fill="#1a1822">real-time / daily 9am / weekly Mon</text>
  <text x="602" y="596" text-anchor="middle" font-size="10" fill="#1a1822">batch unread since last digest</text>
  <text x="602" y="610" text-anchor="middle" font-size="10" fill="#d97843">SendGrid scheduled send</text>

  <rect x="728" y="552" width="218" height="68" rx="6" fill="#fff" stroke="#1a1822" stroke-width="1.5"/>
  <text x="837" y="568" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1822">Push Prompt Timing</text>
  <text x="837" y="582" text-anchor="middle" font-size="10" fill="#1a1822">Defer 30s after active use</text>
  <text x="837" y="596" text-anchor="middle" font-size="10" fill="#1a1822">One-shot: rejected = can't re-ask</text>
  <text x="837" y="610" text-anchor="middle" font-size="10" fill="#2f9d74">Deferred → 20-40% accept rate</text>
</svg>
