<svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="960" height="680" fill="#f3f1f8"/>
  <text x="480" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Content Moderation &amp; Reporting UI — Auto-Moderation, Queue, Appeals</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="14" y="50" width="932" height="16" rx="4" fill="#6d5bd0" opacity="0.14"/>
  <text x="20" y="62" font-size="10" font-weight="bold" fill="#6d5bd0">ACTORS</text>

  <rect x="20" y="72" width="90" height="36" rx="7" fill="#6d5bd0"/>
  <text x="65" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Reporter</text>
  <text x="65" y="102" text-anchor="middle" font-size="10" fill="#edeaf5">User Browser</text>

  <rect x="180" y="72" width="96" height="36" rx="7" fill="#6d5bd0"/>
  <text x="228" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Reports API</text>
  <text x="228" y="102" text-anchor="middle" font-size="10" fill="#edeaf5">+ Kafka</text>

  <rect x="350" y="72" width="96" height="36" rx="7" fill="#c0392b"/>
  <text x="398" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">ML Classifier</text>
  <text x="398" y="102" text-anchor="middle" font-size="10" fill="#ffe0dd">on upload</text>

  <rect x="516" y="72" width="100" height="36" rx="7" fill="#2f9d74"/>
  <text x="566" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Mod Queue</text>
  <text x="566" y="102" text-anchor="middle" font-size="10" fill="#e8f5f0">Redis sorted set</text>

  <rect x="686" y="72" width="100" height="36" rx="7" fill="#d97843"/>
  <text x="736" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Moderator UI</text>
  <text x="736" y="102" text-anchor="middle" font-size="10" fill="#fff5ee">Dashboard SPA</text>

  <rect x="852" y="72" width="94" height="36" rx="7" fill="#1a1822"/>
  <text x="899" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Audit Log</text>
  <text x="899" y="102" text-anchor="middle" font-size="10" fill="#d7d1e6">append-only</text>

  <!-- Lifelines -->
  <line x1="65" y1="108" x2="65" y2="540" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="228" y1="108" x2="228" y2="540" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="398" y1="108" x2="398" y2="540" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="566" y1="108" x2="566" y2="540" stroke="#c4b8e8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="736" y1="108" x2="736" y2="540" stroke="#c4b8e8" stroke-width="1" stroke-dasharray="4,5" opacity="0.6"/>
  <line x1="899" y1="108" x2="899" y2="540" stroke="#c4b8e8" stroke-width="1" stroke-dasharray="4,5" opacity="0.4"/>

  <!-- PATH A: Auto-moderation on upload -->
  <rect x="14" y="118" width="932" height="16" rx="4" fill="#c0392b" opacity="0.10"/>
  <text x="480" y="130" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">PATH A — Automated Pre-Moderation on Upload (&lt;30s, before content is indexed)</text>

  <line x1="228" y1="148" x2="388" y2="148" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="308" y="142" text-anchor="middle" font-size="10" fill="#d97843">content.uploaded Kafka → ML classify</text>

  <rect x="356" y="154" width="84" height="20" rx="5" fill="#c0392b"/>
  <text x="398" y="168" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">confidence: 0.97</text>

  <line x1="398" y1="182" x2="218" y2="182" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="308" y="176" text-anchor="middle" font-size="10" fill="#c0392b">&gt;0.95 → auto-remove (soft-delete visibility=HIDDEN)</text>

  <line x1="398" y1="196" x2="556" y2="196" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="477" y="190" text-anchor="middle" font-size="10" fill="#d97843">0.5-0.95 → ZADD queue:moderation score=0.82 itemId (URGENT)</text>

  <!-- PATH B: User report flow -->
  <rect x="14" y="214" width="932" height="16" rx="4" fill="#6d5bd0" opacity="0.12"/>
  <text x="480" y="226" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">PATH B — User Report (3-step sheet modal, no page navigation)</text>

  <rect x="25" y="238" width="220" height="36" rx="6" fill="#6d5bd0" opacity="0.18"/>
  <text x="135" y="252" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Bottom Sheet: category → sub-category → context</text>
  <text x="135" y="266" text-anchor="middle" font-size="10" fill="#6d5bd0">Stays on page — no navigate-away</text>

  <line x1="65" y1="284" x2="218" y2="284" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="141" y="278" text-anchor="middle" font-size="10" fill="#1a1822">POST /api/reports {contentId type subType}</text>

  <line x1="228" y1="298" x2="556" y2="298" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="392" y="292" text-anchor="middle" font-size="10" fill="#1a1822">priority = ml*0.4 + reporter*0.2 + risk*0.2 + reach*0.2</text>

  <line x1="566" y1="312" x2="566" y2="312" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="524" y="318" width="84" height="20" rx="5" fill="#6d5bd0"/>
  <text x="566" y="332" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">ZADD queue:mod</text>

  <line x1="218" y1="346" x2="75" y2="346" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="146" y="340" text-anchor="middle" font-size="10" fill="#2f9d74">toast: "Report submitted"</text>

  <!-- PATH C: Moderator review -->
  <rect x="14" y="364" width="932" height="16" rx="4" fill="#d97843" opacity="0.13"/>
  <text x="480" y="376" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">PATH C — Moderator Review (ZPOPMAX, keyboard shortcuts, next-item prefetch)</text>

  <line x1="736" y1="392" x2="576" y2="392" stroke="#d97843" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="656" y="386" text-anchor="middle" font-size="10" fill="#d97843">ZPOPMAX queue:moderation → highest priority item</text>

  <rect x="694" y="398" width="84" height="20" rx="5" fill="#d97843"/>
  <text x="736" y="412" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">A/R/S/E/T shortcuts</text>

  <line x1="736" y1="430" x2="218" y2="430" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="477" y="424" text-anchor="middle" font-size="10" fill="#1a1822">POST /api/mod/decisions {action:remove, itemId, rationale}</text>

  <line x1="228" y1="444" x2="889" y2="444" stroke="#1a1822" stroke-width="2" marker-end="url(#arr)"/>
  <text x="558" y="438" text-anchor="middle" font-size="10" fill="#1a1822">INSERT moderation_log (append-only, never deleted)</text>

  <line x1="228" y1="458" x2="75" y2="458" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="151" y="452" text-anchor="middle" font-size="10" fill="#c0392b">notify user: content removed + appeal link</text>

  <!-- PATH D: Shadow ban + appeals -->
  <rect x="14" y="474" width="932" height="16" rx="4" fill="#2f9d74" opacity="0.12"/>
  <text x="480" y="486" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">PATH D — Shadow-Ban + Appeal Flow (48h SLA, expedited queue)</text>

  <line x1="736" y1="502" x2="576" y2="502" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="656" y="496" text-anchor="middle" font-size="10" fill="#c0392b">action=shadow-ban → SET shadow:{userId} 1 TTL 30d</text>

  <line x1="65" y1="516" x2="218" y2="516" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="141" y="510" text-anchor="middle" font-size="10" fill="#1a1822">POST /api/appeals {contentId reason} → ZADD queue:appeals</text>

  <line x1="736" y1="528" x2="576" y2="528" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="656" y="522" text-anchor="middle" font-size="10" fill="#2f9d74">appeals queue: 48h SLA; overturn → visibility=PUBLIC</text>

  <!-- Metrics Panel -->
  <rect x="14" y="546" width="932" height="16" rx="4" fill="#1a1822" opacity="0.07"/>
  <text x="480" y="558" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1822">PRIORITY SCORE FORMULA + SLA MONITORING</text>

  <rect x="20" y="570" width="220" height="68" rx="6" fill="#fff" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="130" y="586" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Priority Formula</text>
  <text x="130" y="600" text-anchor="middle" font-size="9" fill="#1a1822">ml_conf*0.4 + reporter_cred*0.2</text>
  <text x="130" y="613" text-anchor="middle" font-size="9" fill="#1a1822">+ account_risk*0.2 + reach*0.2</text>
  <text x="130" y="626" text-anchor="middle" font-size="9" fill="#2f9d74">ZADD → ZPOPMAX O(log N)</text>

  <rect x="256" y="570" width="220" height="68" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="366" y="586" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Auto-Remove Threshold</text>
  <text x="366" y="600" text-anchor="middle" font-size="9" fill="#1a1822">CSAM/violence: conf &gt; 0.70</text>
  <text x="366" y="613" text-anchor="middle" font-size="9" fill="#1a1822">Hate/spam: conf &gt; 0.95</text>
  <text x="366" y="626" text-anchor="middle" font-size="9" fill="#c0392b">Per-category threshold config</text>

  <rect x="492" y="570" width="220" height="68" rx="6" fill="#fff" stroke="#d97843" stroke-width="1.5"/>
  <text x="602" y="586" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Appeals SLA Dashboard</text>
  <text x="602" y="600" text-anchor="middle" font-size="9" fill="#1a1822">total / &gt;24h / &gt;36h (orange) / &gt;44h (red)</text>
  <text x="602" y="613" text-anchor="middle" font-size="9" fill="#1a1822">alert fires at &gt;44h queue depth</text>
  <text x="602" y="626" text-anchor="middle" font-size="9" fill="#d97843">real-time counter SSE widget</text>

  <rect x="728" y="570" width="218" height="68" rx="6" fill="#fff" stroke="#1a1822" stroke-width="1.5"/>
  <text x="837" y="586" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1822">Moderator Throughput</text>
  <text x="837" y="600" text-anchor="middle" font-size="9" fill="#1a1822">300 reviews/hour per mod</text>
  <text x="837" y="613" text-anchor="middle" font-size="9" fill="#1a1822">next item pre-fetched during submit</text>
  <text x="837" y="626" text-anchor="middle" font-size="9" fill="#6d5bd0">keyboard A/R/S/E/T shortcuts</text>
</svg>
