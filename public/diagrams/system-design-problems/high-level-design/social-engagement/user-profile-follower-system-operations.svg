<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" role="img" aria-label="User Profile Follower System: failure and recovery control loop">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#0f766e"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#c2410c"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#be123c"/></marker>
  </defs>
  <rect x="18" y="18" width="924" height="524" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="54" y="56" font-size="18" font-weight="700" fill="#172033">User Profile Follower System: failure and recovery control loop</text>
  <text x="54" y="78" font-size="11.5" fill="#526074">Normal traffic is separated from containment, rollback, audit, and projection repair.</text>
  <rect x="48" y="110" width="864" height="156" rx="9" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.1"/>
  <text x="68" y="133" font-size="12.5" font-weight="700" fill="#0f766e">NORMAL PATH</text><rect x="86" y="158" width="172" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="100" y="183" font-size="12" font-weight="700" fill="#172033">edge gateway</text><text x="100" y="206" font-size="10.5" fill="#526074">accept intent</text><text x="100" y="223" font-size="10.5" fill="#526074">emit trace</text><rect x="330" y="158" width="172" height="70" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="344" y="183" font-size="12" font-weight="700" fill="#172033">durable state</text><text x="344" y="206" font-size="10.5" fill="#526074">commit truth</text><text x="344" y="223" font-size="10.5" fill="#526074">publish version</text><rect x="574" y="158" width="172" height="70" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="588" y="183" font-size="12" font-weight="700" fill="#172033">client projection</text><text x="588" y="206" font-size="10.5" fill="#526074">serve projection</text><text x="588" y="223" font-size="10.5" fill="#526074">measure SLO</text><line x1="258" y1="193" x2="322" y2="193" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/><line x1="502" y1="193" x2="566" y2="193" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arrow-teal)"/><rect x="48" y="286" width="864" height="184" rx="9" fill="#fff1f2" stroke="#be123c" stroke-width="1.1"/>
  <text x="68" y="309" font-size="12.5" font-weight="700" fill="#be123c">FAILURE, ROLLBACK, AND GOVERNANCE</text><path d="M178 326 L222 360 L178 394 L134 360 Z" fill="#fff1f2" stroke="#be123c" stroke-width="1.5"/>
  <text x="178" y="364" text-anchor="middle" font-size="10.5" font-weight="700" fill="#172033">SLO breach?</text><rect x="286" y="320" width="160" height="76" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
  <text x="300" y="345" font-size="12" font-weight="700" fill="#172033">contain blast radius</text><text x="300" y="368" font-size="10.5" fill="#526074">shed optional work</text><text x="300" y="385" font-size="10.5" fill="#526074">freeze risky writes</text><rect x="490" y="320" width="160" height="76" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="504" y="345" font-size="12" font-weight="700" fill="#172033">recover safely</text><text x="504" y="368" font-size="10.5" fill="#526074">rollback version</text><text x="504" y="385" font-size="10.5" fill="#526074">repair projection</text><rect x="694" y="320" width="160" height="76" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="708" y="345" font-size="12" font-weight="700" fill="#172033">prove outcome</text><text x="708" y="368" font-size="10.5" fill="#526074">audit evidence</text><text x="708" y="385" font-size="10.5" fill="#526074">cost + privacy</text><line x1="222" y1="360" x2="278" y2="360" stroke="#be123c" stroke-width="2.4" marker-end="url(#arrow-rose)"/><line x1="446" y1="360" x2="482" y2="360" stroke="#c2410c" stroke-width="2.4" marker-end="url(#arrow-orange)"/><line x1="650" y1="360" x2="686" y2="360" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arrow-teal)"/><text x="76" y="446" font-size="10.5" fill="#172033">Observe: p50/p99 latency, error budget burn, queue age, stale reads, policy denials, rollback duration, and cost per operation.</text>
</svg>
