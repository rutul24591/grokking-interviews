<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="540" fill="#f3f1f8"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Multi-Region Frontend Architecture</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
    <marker id="arr-b" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="58" width="80" height="36" rx="7" fill="#6d5bd0"/>
  <text x="60" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">EU User</text>
  <text x="60" y="88" text-anchor="middle" font-size="9" fill="#edeaf5">Frankfurt</text>

  <rect x="160" y="58" width="85" height="36" rx="7" fill="#2563eb"/>
  <text x="202" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">GeoDNS</text>
  <text x="202" y="88" text-anchor="middle" font-size="9" fill="#dbeafe">Route 53 latency</text>

  <rect x="310" y="58" width="90" height="36" rx="7" fill="#0891b2"/>
  <text x="355" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Edge Worker</text>
  <text x="355" y="88" text-anchor="middle" font-size="9" fill="#cffafe">CF Worker PoP</text>

  <rect x="470" y="58" width="90" height="36" rx="7" fill="#2f9d74"/>
  <text x="515" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">eu-west-1</text>
  <text x="515" y="88" text-anchor="middle" font-size="9" fill="#d1fae5">EU API cluster</text>

  <rect x="630" y="58" width="90" height="36" rx="7" fill="#d97843"/>
  <text x="675" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">us-east-1</text>
  <text x="675" y="88" text-anchor="middle" font-size="9" fill="#fef3c7">US API cluster</text>

  <rect x="790" y="58" width="90" height="36" rx="7" fill="#be123c"/>
  <text x="835" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">CDN PoP</text>
  <text x="835" y="88" text-anchor="middle" font-size="9" fill="#fecdd3">Frankfurt edge</text>

  <!-- Lifelines -->
  <line x1="60" y1="94" x2="60" y2="510" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="202" y1="94" x2="202" y2="510" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="355" y1="94" x2="355" y2="510" stroke="#a5f3fc" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="515" y1="94" x2="515" y2="510" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="675" y1="94" x2="675" y2="510" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="835" y1="94" x2="835" y2="510" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- BAND A: Static Assets via CDN -->
  <rect x="14" y="104" width="872" height="16" rx="3" fill="#be123c" opacity="0.15"/>
  <text x="450" y="116" text-anchor="middle" font-size="9" fill="#9f1239" font-weight="bold">PATH A — STATIC ASSETS (CDN PoP anycast, &lt;50ms globally)</text>

  <line x1="60" y1="132" x2="825" y2="132" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="442" y="126" text-anchor="middle" font-size="9" fill="#374151">GET /main.a3f8d.js (anycast → nearest PoP)</text>

  <rect x="795" y="140" width="80" height="18" rx="4" fill="#be123c"/>
  <text x="835" y="153" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">cache HIT ✓</text>

  <line x1="825" y1="168" x2="70" y2="168" stroke="#be123c" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="442" y="162" text-anchor="middle" font-size="9" fill="#374151">200 + immutable max-age=31536000 — same file worldwide</text>

  <!-- BAND B: GeoDNS + Edge Auth -->
  <rect x="14" y="180" width="872" height="16" rx="3" fill="#2563eb" opacity="0.2"/>
  <text x="450" y="192" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">PATH B — API REQUEST (GeoDNS → nearest region + edge JWT verify)</text>

  <line x1="60" y1="210" x2="192" y2="210" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="126" y="204" text-anchor="middle" font-size="9" fill="#374151">DNS api.example.com</text>

  <rect x="162" y="218" width="80" height="18" rx="4" fill="#2563eb"/>
  <text x="202" y="231" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">→ eu-west-1</text>

  <line x1="202" y1="246" x2="345" y2="246" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-b)"/>
  <text x="273" y="240" text-anchor="middle" font-size="9" fill="#374151">request + JWT</text>

  <rect x="315" y="254" width="80" height="18" rx="4" fill="#0891b2"/>
  <text x="355" y="267" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">verify JWT</text>

  <line x1="355" y1="282" x2="505" y2="282" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="430" y="276" text-anchor="middle" font-size="9" fill="#374151">X-User-Region: eu + X-Serving-Region: eu ✓</text>

  <!-- BAND C: Read vs Write routing -->
  <rect x="14" y="294" width="872" height="16" rx="3" fill="#2f9d74" opacity="0.2"/>
  <text x="450" y="306" text-anchor="middle" font-size="9" fill="#065f46" font-weight="bold">PATH C — READ (local replica) vs WRITE (home region proxy)</text>

  <line x1="60" y1="324" x2="505" y2="324" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="282" y="318" text-anchor="middle" font-size="9" fill="#374151">GET /api/feed (read) → eu-west-1 read replica</text>

  <line x1="505" y1="340" x2="70" y2="340" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="282" y="334" text-anchor="middle" font-size="9" fill="#374151">200 feed JSON — local replica p95 &lt;50ms</text>

  <line x1="60" y1="360" x2="505" y2="360" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="282" y="354" text-anchor="middle" font-size="9" fill="#374151">POST /api/post (write, JWT region=eu)</text>

  <line x1="515" y1="368" x2="665" y2="368" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="590" y="362" text-anchor="middle" font-size="9" fill="#374151">proxy to us-east-1? NO — region=eu → handle locally</text>

  <line x1="505" y1="384" x2="70" y2="384" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="282" y="378" text-anchor="middle" font-size="9" fill="#374151">201 Created — EU data stays in eu-west-1 (GDPR)</text>

  <!-- BAND D: Failover -->
  <rect x="14" y="396" width="872" height="16" rx="3" fill="#d97843" opacity="0.2"/>
  <text x="450" y="408" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">PATH D — FAILOVER (eu-west-1 unhealthy → Route 53 removes record)</text>

  <rect x="172" y="424" width="60" height="18" rx="4" fill="#e05252"/>
  <text x="202" y="437" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">region DOWN</text>

  <line x1="202" y1="452" x2="345" y2="452" stroke="#e05252" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="273" y="446" text-anchor="middle" font-size="9" fill="#374151">health check fail × 3 → remove DNS record (30s TTL)</text>

  <line x1="60" y1="462" x2="665" y2="462" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="362" y="456" text-anchor="middle" font-size="9" fill="#374151">re-resolve → us-east-1 (next nearest) · PII read-only until home region recovers</text>

  <!-- Metrics footer -->
  <rect x="14" y="478" width="872" height="46" rx="6" fill="#1a1822"/>
  <text x="80" y="496" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">DNS Failover</text>
  <text x="80" y="512" text-anchor="middle" font-size="12" fill="white" font-weight="700">60s window</text>

  <text x="240" y="496" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">CDN Latency</text>
  <text x="240" y="512" text-anchor="middle" font-size="12" fill="white" font-weight="700">&lt;50ms p95</text>

  <text x="420" y="496" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">API Latency</text>
  <text x="420" y="512" text-anchor="middle" font-size="12" fill="white" font-weight="700">&lt;200ms p95</text>

  <text x="610" y="496" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Data Residency</text>
  <text x="610" y="512" text-anchor="middle" font-size="12" fill="white" font-weight="700">451 enforced</text>

  <text x="800" y="496" text-anchor="middle" font-size="9" fill="#ddd6fe" font-weight="600">DNS TTL</text>
  <text x="800" y="512" text-anchor="middle" font-size="12" fill="white" font-weight="700">30s fast-failover</text>
</svg>
