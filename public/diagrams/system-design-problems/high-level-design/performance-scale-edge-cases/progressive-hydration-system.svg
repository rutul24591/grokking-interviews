<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="540" fill="#f3f1f8"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Progressive Hydration System</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="58" width="75" height="36" rx="7" fill="#6d5bd0"/>
  <text x="57" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Browser</text>
  <text x="57" y="88" text-anchor="middle" font-size="9" fill="#edeaf5">Moto G4</text>

  <rect x="155" y="58" width="90" height="36" rx="7" fill="#2563eb"/>
  <text x="200" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">SSR Server</text>
  <text x="200" y="88" text-anchor="middle" font-size="9" fill="#dbeafe">renderToPipeable</text>

  <rect x="310" y="58" width="95" height="36" rx="7" fill="#2f9d74"/>
  <text x="357" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Critical JS</text>
  <text x="357" y="88" text-anchor="middle" font-size="9" fill="#d1fae5">~20KB chunk</text>

  <rect x="475" y="58" width="95" height="36" rx="7" fill="#d97843"/>
  <text x="522" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Lazy Chunks</text>
  <text x="522" y="88" text-anchor="middle" font-size="9" fill="#fef3c7">dynamic import()</text>

  <rect x="640" y="58" width="95" height="36" rx="7" fill="#7c3aed"/>
  <text x="687" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Hydration Orch.</text>
  <text x="687" y="88" text-anchor="middle" font-size="9" fill="#ede9fe">priority queues</text>

  <rect x="805" y="58" width="75" height="36" rx="7" fill="#be123c"/>
  <text x="842" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">React 18</text>
  <text x="842" y="88" text-anchor="middle" font-size="9" fill="#fecdd3">hydrateRoot</text>

  <!-- Lifelines -->
  <line x1="57" y1="94" x2="57" y2="510" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="200" y1="94" x2="200" y2="510" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="357" y1="94" x2="357" y2="510" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="522" y1="94" x2="522" y2="510" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="687" y1="94" x2="687" y2="510" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="842" y1="94" x2="842" y2="510" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- BAND A: Streaming SSR -->
  <rect x="14" y="104" width="872" height="16" rx="3" fill="#2563eb" opacity="0.2"/>
  <text x="450" y="116" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">PATH A — STREAMING SSR (above-fold HTML first, Suspense for below-fold)</text>

  <line x1="57" y1="132" x2="190" y2="132" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="123" y="126" text-anchor="middle" font-size="9" fill="#374151">GET /</text>

  <rect x="160" y="140" width="80" height="18" rx="4" fill="#2563eb"/>
  <text x="200" y="153" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">stream start</text>

  <line x1="190" y1="168" x2="67" y2="168" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="128" y="162" text-anchor="middle" font-size="9" fill="#374151">chunk 1: HTML head + above-fold → FCP paint</text>

  <line x1="200" y1="178" x2="67" y2="188" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="148" y="195" text-anchor="middle" font-size="9" fill="#374151">chunk 2: below-fold HTML streamed after DB resolves</text>

  <!-- BAND B: Critical hydration -->
  <rect x="14" y="206" width="872" height="16" rx="3" fill="#2f9d74" opacity="0.2"/>
  <text x="450" y="218" text-anchor="middle" font-size="9" fill="#065f46" font-weight="bold">PATH B — CRITICAL HYDRATION (P1: nav + hero CTA + search bar, synchronous)</text>

  <line x1="57" y1="236" x2="347" y2="236" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="202" y="230" text-anchor="middle" font-size="9" fill="#374151">critical-bundle.js loaded (~20KB)</text>

  <line x1="357" y1="244" x2="832" y2="244" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="594" y="238" text-anchor="middle" font-size="9" fill="#374151">hydrateRoot(criticalRoot) — synchronous on main thread</text>

  <line x1="832" y1="260" x2="67" y2="260" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="449" y="254" text-anchor="middle" font-size="9" fill="#374151">nav + hero CTA interactive — FCP→TTI gap &lt;1s for critical</text>

  <!-- BAND C: Interaction-triggered hydration -->
  <rect x="14" y="274" width="872" height="16" rx="3" fill="#d97843" opacity="0.2"/>
  <text x="450" y="286" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">PATH C — INTERACTION-TRIGGERED (P2: event capture → import → hydrate → replay)</text>

  <line x1="57" y1="304" x2="677" y2="304" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="367" y="298" text-anchor="middle" font-size="9" fill="#374151">user clicks un-hydrated dropdown</text>

  <rect x="647" y="312" width="80" height="18" rx="4" fill="#d97843"/>
  <text x="687" y="325" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">capture event</text>

  <line x1="687" y1="340" x2="512" y2="340" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="599" y="334" text-anchor="middle" font-size="9" fill="#374151">dynamic import(dropdown-chunk)</text>

  <line x1="522" y1="354" x2="832" y2="354" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="677" y="348" text-anchor="middle" font-size="9" fill="#374151">hydrate subtree</text>

  <line x1="832" y1="368" x2="67" y2="368" stroke="#d97843" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="449" y="362" text-anchor="middle" font-size="9" fill="#374151">replay queued click → dropdown opens</text>

  <!-- BAND D: Idle + Visibility hydration -->
  <rect x="14" y="382" width="872" height="16" rx="3" fill="#7c3aed" opacity="0.15"/>
  <text x="450" y="394" text-anchor="middle" font-size="9" fill="#5b21b6" font-weight="bold">PATH D — IDLE (P3: requestIdleCallback) + VISIBLE (P4: IntersectionObserver)</text>

  <line x1="677" y1="414" x2="832" y2="414" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="754" y="408" text-anchor="middle" font-size="9" fill="#374151">idle: chatbot widget</text>

  <line x1="832" y1="428" x2="67" y2="428" stroke="#7c3aed" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="449" y="422" text-anchor="middle" font-size="9" fill="#374151">requestIdleCallback: hydrate when deadline.timeRemaining() &gt; 5ms</text>

  <line x1="57" y1="448" x2="677" y2="448" stroke="#6d5bd0" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="367" y="442" text-anchor="middle" font-size="9" fill="#374151">user scrolls → IntersectionObserver 0.1 threshold → comments hydrate</text>

  <!-- Metrics footer -->
  <rect x="14" y="468" width="872" height="46" rx="6" fill="#1a1822"/>
  <text x="80" y="486" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">FCP Target</text>
  <text x="80" y="502" text-anchor="middle" font-size="12" fill="white" font-weight="700">&lt;2s SSR</text>

  <text x="240" y="486" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Critical TTI</text>
  <text x="240" y="502" text-anchor="middle" font-size="12" fill="white" font-weight="700">FCP + &lt;1s</text>

  <text x="420" y="486" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Critical Bundle</text>
  <text x="420" y="502" text-anchor="middle" font-size="12" fill="white" font-weight="700">~20KB only</text>

  <text x="610" y="486" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">TTI Improvement</text>
  <text x="610" y="502" text-anchor="middle" font-size="12" fill="white" font-weight="700">40%+ vs full</text>

  <text x="800" y="486" text-anchor="middle" font-size="9" fill="#ddd6fe" font-weight="600">Idle Guard</text>
  <text x="800" y="502" text-anchor="middle" font-size="12" fill="white" font-weight="700">&gt;5ms remain</text>
</svg>
