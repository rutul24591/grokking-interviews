<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f3f1f8"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Frontend for 1M+ Concurrent Users</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="58" width="90" height="36" rx="7" fill="#6d5bd0"/>
  <text x="65" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">1M Users</text>
  <text x="65" y="88" text-anchor="middle" font-size="9" fill="#edeaf5">Browser</text>

  <rect x="175" y="58" width="100" height="36" rx="7" fill="#2563eb"/>
  <text x="225" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">CDN PoPs</text>
  <text x="225" y="88" text-anchor="middle" font-size="9" fill="#dbeafe">Cloudflare/Fastly</text>

  <rect x="345" y="58" width="110" height="36" rx="7" fill="#d97843"/>
  <text x="400" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">API Gateway</text>
  <text x="400" y="88" text-anchor="middle" font-size="9" fill="#fef3c7">Rate limit · Coalesce</text>

  <rect x="530" y="58" width="100" height="36" rx="7" fill="#2f9d74"/>
  <text x="580" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Origin / ISR</text>
  <text x="580" y="88" text-anchor="middle" font-size="9" fill="#d1fae5">Next.js SSR</text>

  <rect x="700" y="58" width="110" height="36" rx="7" fill="#be123c"/>
  <text x="755" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">WS Cluster</text>
  <text x="755" y="88" text-anchor="middle" font-size="9" fill="#fecdd3">20 × 50K conn</text>

  <!-- Lifelines -->
  <line x1="65" y1="94" x2="65" y2="490" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="225" y1="94" x2="225" y2="490" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="400" y1="94" x2="400" y2="490" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="580" y1="94" x2="580" y2="490" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="755" y1="94" x2="755" y2="490" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- BAND A: Static Asset Delivery -->
  <rect x="14" y="104" width="872" height="16" rx="3" fill="#2563eb" opacity="0.2"/>
  <text x="450" y="116" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">PATH A — STATIC ASSETS (CDN cache hit &gt;95%)</text>

  <line x1="65" y1="132" x2="215" y2="132" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="140" y="126" text-anchor="middle" font-size="9" fill="#374151">GET /main.a3f8d.js</text>

  <rect x="175" y="140" width="100" height="18" rx="4" fill="#2563eb"/>
  <text x="225" y="153" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">Cache HIT ✓</text>

  <line x1="215" y1="168" x2="75" y2="168" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="145" y="162" text-anchor="middle" font-size="9" fill="#374151">200 + immutable · max-age=31536000</text>

  <!-- BAND B: HTML Shell -->
  <rect x="14" y="180" width="872" height="16" rx="3" fill="#d97843" opacity="0.2"/>
  <text x="450" y="192" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">PATH B — HTML SHELL (stale-while-revalidate)</text>

  <line x1="65" y1="210" x2="215" y2="210" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="140" y="204" text-anchor="middle" font-size="9" fill="#374151">GET /</text>

  <rect x="175" y="218" width="100" height="18" rx="4" fill="#d97843"/>
  <text x="225" y="231" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">stale → serve</text>

  <line x1="225" y1="246" x2="390" y2="246" stroke="#d97843" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="307" y="240" text-anchor="middle" font-size="9" fill="#374151">revalidate in background (s-maxage expired)</text>

  <line x1="390" y1="260" x2="225" y2="260" stroke="#2f9d74" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="307" y="254" text-anchor="middle" font-size="9" fill="#374151">ISR: serve cached render, update async</text>

  <line x1="215" y1="274" x2="75" y2="274" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="145" y="268" text-anchor="middle" font-size="9" fill="#374151">stale HTML returned instantly to user</text>

  <!-- BAND C: API / Rate Limit -->
  <rect x="14" y="286" width="872" height="16" rx="3" fill="#2f9d74" opacity="0.2"/>
  <text x="450" y="298" text-anchor="middle" font-size="9" fill="#065f46" font-weight="bold">PATH C — AUTHENTICATED API (rate limit + coalesce)</text>

  <line x1="65" y1="316" x2="390" y2="316" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="227" y="310" text-anchor="middle" font-size="9" fill="#374151">GET /api/feed  Authorization: Bearer {JWT}</text>

  <rect x="350" y="324" width="100" height="18" rx="4" fill="#d97843"/>
  <text x="400" y="337" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">verify JWT edge</text>

  <line x1="400" y1="352" x2="570" y2="352" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="485" y="346" text-anchor="middle" font-size="9" fill="#374151">1 upstream (coalescing: 500 identical → 1)</text>

  <line x1="570" y1="366" x2="75" y2="366" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="323" y="360" text-anchor="middle" font-size="9" fill="#374151">feed JSON · Cache-Control: s-maxage=30, stale-while-revalidate=120</text>

  <!-- BAND D: WebSocket Fan-out -->
  <rect x="14" y="378" width="872" height="16" rx="3" fill="#be123c" opacity="0.2"/>
  <text x="450" y="390" text-anchor="middle" font-size="9" fill="#9f1239" font-weight="bold">PATH D — REAL-TIME PUSH (WebSocket + Redis pub/sub)</text>

  <line x1="65" y1="408" x2="745" y2="408" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="405" y="402" text-anchor="middle" font-size="9" fill="#374151">WS connect · subscribe user:{userId} channel</text>

  <rect x="710" y="416" width="90" height="18" rx="4" fill="#be123c"/>
  <text x="755" y="429" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">Redis PUBLISH</text>

  <line x1="745" y1="444" x2="75" y2="444" stroke="#be123c" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="410" y="438" text-anchor="middle" font-size="9" fill="#374151">push event: 20 WS servers fan-out → 1M clients simultaneously</text>

  <!-- Metrics footer -->
  <rect x="14" y="460" width="872" height="46" rx="6" fill="#1a1822"/>
  <text x="90" y="478" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">CDN Cache Hit</text>
  <text x="90" y="494" text-anchor="middle" font-size="12" fill="white" font-weight="700">&gt;95%</text>

  <text x="240" y="478" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Rate Limit</text>
  <text x="240" y="494" text-anchor="middle" font-size="12" fill="white" font-weight="700">100 req/min/IP</text>

  <text x="420" y="478" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">WS Scale</text>
  <text x="420" y="494" text-anchor="middle" font-size="12" fill="white" font-weight="700">20 × 50K = 1M</text>

  <text x="610" y="478" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Load Shed Trigger</text>
  <text x="610" y="494" text-anchor="middle" font-size="12" fill="white" font-weight="700">5% errors / 10s</text>

  <text x="800" y="478" text-anchor="middle" font-size="9" fill="#ddd6fe" font-weight="600">Asset TTL</text>
  <text x="800" y="494" text-anchor="middle" font-size="12" fill="white" font-weight="700">1 year immutable</text>
</svg>
