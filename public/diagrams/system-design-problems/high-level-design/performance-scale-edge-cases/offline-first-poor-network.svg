<svg viewBox="0 0 900 540" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="540" fill="#f3f1f8"/>
  <text x="450" y="32" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a1822">Offline-First System (Poor Network)</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- Actors -->
  <rect x="20" y="58" width="85" height="36" rx="7" fill="#6d5bd0"/>
  <text x="62" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">React UI</text>
  <text x="62" y="88" text-anchor="middle" font-size="9" fill="#edeaf5">optimistic</text>

  <rect x="165" y="58" width="100" height="36" rx="7" fill="#2563eb"/>
  <text x="215" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Service Worker</text>
  <text x="215" y="88" text-anchor="middle" font-size="9" fill="#dbeafe">fetch intercept</text>

  <rect x="335" y="58" width="95" height="36" rx="7" fill="#2f9d74"/>
  <text x="382" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">IndexedDB</text>
  <text x="382" y="88" text-anchor="middle" font-size="9" fill="#d1fae5">Dexie.js local store</text>

  <rect x="505" y="58" width="100" height="36" rx="7" fill="#d97843"/>
  <text x="555" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Sync Queue</text>
  <text x="555" y="88" text-anchor="middle" font-size="9" fill="#fef3c7">pending mutations</text>

  <rect x="675" y="58" width="105" height="36" rx="7" fill="#be123c"/>
  <text x="727" y="74" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Origin API</text>
  <text x="727" y="88" text-anchor="middle" font-size="9" fill="#fecdd3">ETag conflict detect</text>

  <!-- Lifelines -->
  <line x1="62" y1="94" x2="62" y2="510" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="215" y1="94" x2="215" y2="510" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="382" y1="94" x2="382" y2="510" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="555" y1="94" x2="555" y2="510" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="727" y1="94" x2="727" y2="510" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- BAND A: Offline Read -->
  <rect x="14" y="104" width="872" height="16" rx="3" fill="#2f9d74" opacity="0.2"/>
  <text x="450" y="116" text-anchor="middle" font-size="9" fill="#065f46" font-weight="bold">PATH A — OFFLINE READ (stale-while-revalidate, 0ms latency)</text>

  <line x1="62" y1="132" x2="205" y2="132" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="133" y="126" text-anchor="middle" font-size="9" fill="#374151">fetch /api/todos (SW intercepts)</text>

  <line x1="215" y1="140" x2="372" y2="140" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="293" y="134" text-anchor="middle" font-size="9" fill="#374151">read apiCache by URL hash</text>

  <line x1="372" y1="155" x2="72" y2="155" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="222" y="149" text-anchor="middle" font-size="9" fill="#374151">cached JSON → instant render (&lt;50ms) — no spinner</text>

  <line x1="215" y1="165" x2="717" y2="165" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-o)"/>
  <text x="466" y="159" text-anchor="middle" font-size="9" fill="#374151">background revalidate (if online)</text>

  <!-- BAND B: Offline Write -->
  <rect x="14" y="180" width="872" height="16" rx="3" fill="#d97843" opacity="0.2"/>
  <text x="450" y="192" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">PATH B — OFFLINE WRITE (optimistic update + sync queue enqueue)</text>

  <line x1="62" y1="210" x2="205" y2="210" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>
  <text x="133" y="204" text-anchor="middle" font-size="9" fill="#374151">PUT /api/todos/123 (offline)</text>

  <rect x="175" y="218" width="80" height="18" rx="4" fill="#2563eb"/>
  <text x="215" y="231" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">SW intercept</text>

  <line x1="215" y1="246" x2="372" y2="246" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="293" y="240" text-anchor="middle" font-size="9" fill="#374151">write entity to IndexedDB immediately</text>

  <line x1="215" y1="258" x2="545" y2="258" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="380" y="252" text-anchor="middle" font-size="9" fill="#374151">enqueue &#123;method:PUT, url, body, etag, createdAt&#125;</text>

  <line x1="205" y1="274" x2="72" y2="274" stroke="#d97843" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="133" y="268" text-anchor="middle" font-size="9" fill="#374151">synthetic 202 → optimistic render in &lt;20ms</text>

  <!-- BAND C: Sync Flush -->
  <rect x="14" y="286" width="872" height="16" rx="3" fill="#2563eb" opacity="0.2"/>
  <text x="450" y="298" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">PATH C — SYNC QUEUE FLUSH (online event / Background Sync API)</text>

  <line x1="555" y1="318" x2="717" y2="318" stroke="#d97843" stroke-width="2" marker-end="url(#arr-o)"/>
  <text x="636" y="312" text-anchor="middle" font-size="9" fill="#374151">PUT + If-Match: {"{etag}"}</text>

  <rect x="687" y="326" width="80" height="18" rx="4" fill="#2f9d74"/>
  <text x="727" y="339" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">200 OK</text>

  <line x1="717" y1="354" x2="545" y2="354" stroke="#2f9d74" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="631" y="348" text-anchor="middle" font-size="9" fill="#374151">dequeue · update etag in IndexedDB</text>

  <!-- BAND D: Conflict Resolution -->
  <rect x="14" y="368" width="872" height="16" rx="3" fill="#be123c" opacity="0.15"/>
  <text x="450" y="380" text-anchor="middle" font-size="9" fill="#9f1239" font-weight="bold">PATH D — 409 CONFLICT (last-write-wins timestamp or CRDT merge)</text>

  <rect x="687" y="394" width="80" height="18" rx="4" fill="#be123c"/>
  <text x="727" y="407" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">409 Conflict</text>

  <line x1="717" y1="422" x2="545" y2="422" stroke="#be123c" stroke-width="2" marker-end="url(#arr-r)"/>
  <text x="631" y="416" text-anchor="middle" font-size="9" fill="#374151">server version in body</text>

  <line x1="545" y1="432" x2="372" y2="432" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="458" y="443" text-anchor="middle" font-size="9" fill="#374151">LWW: keep newer ts · CRDT: union add-set minus remove-set</text>

  <line x1="372" y1="452" x2="72" y2="452" stroke="#e05252" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-r)"/>
  <text x="217" y="446" text-anchor="middle" font-size="9" fill="#374151">unresolvable → conflict banner shown to user</text>

  <!-- Metrics footer -->
  <rect x="14" y="466" width="872" height="46" rx="6" fill="#1a1822"/>
  <text x="80" y="484" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Read Latency</text>
  <text x="80" y="500" text-anchor="middle" font-size="12" fill="white" font-weight="700">&lt;50ms IDB</text>

  <text x="240" y="484" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Write Latency</text>
  <text x="240" y="500" text-anchor="middle" font-size="12" fill="white" font-weight="700">&lt;20ms opt.</text>

  <text x="420" y="484" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">Retry Backoff</text>
  <text x="420" y="500" text-anchor="middle" font-size="12" fill="white" font-weight="700">1→30min exp.</text>

  <text x="610" y="484" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">BG Sync</text>
  <text x="610" y="500" text-anchor="middle" font-size="12" fill="white" font-weight="700">tab-closed sync</text>

  <text x="800" y="484" text-anchor="middle" font-size="9" fill="#ddd6fe" font-weight="600">Conflict Strategy</text>
  <text x="800" y="500" text-anchor="middle" font-size="12" fill="white" font-weight="700">LWW / CRDT</text>
</svg>
