<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f3f1f8"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">Voice-Based UI System — Wake Word to Response Pipeline</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- 5 actors -->
  <rect x="20" y="65" width="115" height="40" rx="8" fill="#6d5bd0"/>
  <text x="77" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Microphone</text>
  <text x="77" y="98" text-anchor="middle" font-size="10" fill="#edeaf5">AudioWorklet</text>

  <rect x="205" y="65" width="115" height="40" rx="8" fill="#2563eb"/>
  <text x="262" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">STT Pipeline</text>
  <text x="262" y="98" text-anchor="middle" font-size="10" fill="#dbeafe">Whisper streaming</text>

  <rect x="392" y="65" width="115" height="40" rx="8" fill="#2f9d74"/>
  <text x="449" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">NLU Engine</text>
  <text x="449" y="98" text-anchor="middle" font-size="10" fill="#d1fae5">intent + slots</text>

  <rect x="580" y="65" width="115" height="40" rx="8" fill="#d97843"/>
  <text x="637" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Action + TTS</text>
  <text x="637" y="98" text-anchor="middle" font-size="10" fill="#fef3c7">dispatch + SSML</text>

  <rect x="768" y="65" width="112" height="40" rx="8" fill="#be123c"/>
  <text x="824" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">UI / Captions</text>
  <text x="824" y="98" text-anchor="middle" font-size="10" fill="#fecdd3">stream + display</text>

  <!-- Lifelines -->
  <line x1="77"  y1="105" x2="77"  y2="490" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="262" y1="105" x2="262" y2="490" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="449" y1="105" x2="449" y2="490" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="637" y1="105" x2="637" y2="490" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="824" y1="105" x2="824" y2="490" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- SECTION 1: Wake Word Detection -->
  <rect x="8" y="118" width="884" height="14" rx="3" fill="#6d5bd0" opacity="0.15"/>
  <text x="450" y="129" text-anchor="middle" font-size="9" font-weight="bold" fill="#4c1d95">1 · WAKE WORD — on-device WASM CNN via AudioWorklet; 16kHz PCM; confidence &gt;0.85; no audio sent to server before wake</text>

  <line x1="77" y1="150" x2="247" y2="150" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="162" y="144" text-anchor="middle" font-size="9" fill="#374151">raw audio → 16kHz PCM → WASM keyword model</text>

  <line x1="247" y1="164" x2="92" y2="164" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="169" y="158" text-anchor="middle" font-size="9" fill="#374151">confidence &gt;0.85 → wake event + chime (no server contact)</text>

  <!-- SECTION 2: STT + VAD -->
  <rect x="8" y="182" width="884" height="14" rx="3" fill="#2563eb" opacity="0.15"/>
  <text x="450" y="193" text-anchor="middle" font-size="9" font-weight="bold" fill="#1e3a8a">2 · STT + VAD — RNNoise suppression; Silero VAD 30ms frames; Whisper WebSocket 100ms chunks; partial transcripts to UI real-time</text>

  <line x1="77" y1="212" x2="247" y2="212" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="162" y="206" text-anchor="middle" font-size="9" fill="#374151">RNNoise → Silero VAD → 100ms PCM frames to WebSocket</text>

  <line x1="247" y1="226" x2="809" y2="226" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="528" y="220" text-anchor="middle" font-size="9" fill="#374151">partial transcripts streamed → shown as real-time text on screen</text>

  <line x1="247" y1="240" x2="434" y2="240" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="340" y="234" text-anchor="middle" font-size="9" fill="#374151">5×30ms silence → utterance end → final transcript</text>

  <!-- SECTION 3: NLU + Speculative Dispatch -->
  <rect x="8" y="258" width="884" height="14" rx="3" fill="#2f9d74" opacity="0.18"/>
  <text x="450" y="269" text-anchor="middle" font-size="9" font-weight="bold" fill="#065f46">3 · NLU + DISPATCH — BERT-tiny intent + NER slots; speculative exec on partial &gt;0.95 confidence; conversation state machine</text>

  <line x1="434" y1="288" x2="622" y2="288" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="528" y="282" text-anchor="middle" font-size="9" fill="#374151">intent classifier + slot NER → {intent, slots}</text>

  <!-- Conversation state box -->
  <rect x="20" y="298" width="400" height="32" rx="6" fill="#fff" stroke="#2f9d74" stroke-width="1"/>
  <text x="220" y="313" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a1822">State: Idle → Listening → Processing → Speaking → AwaitingSlot</text>
  <text x="220" y="328" text-anchor="middle" font-size="9" fill="#374151">context stack {intent, filledSlots} for multi-turn correction</text>

  <!-- SECTION 4: TTS + Caption -->
  <rect x="8" y="340" width="884" height="14" rx="3" fill="#d97843" opacity="0.18"/>
  <text x="450" y="351" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">4 · TTS + CAPTIONS — SSML response to cloud TTS; streaming AudioContext chunks (TTFA &lt;100ms); captions displayed simultaneously</text>

  <line x1="622" y1="370" x2="809" y2="370" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="715" y="364" text-anchor="middle" font-size="9" fill="#374151">SSML text → cloud neural TTS → streaming audio chunks</text>

  <line x1="809" y1="384" x2="622" y2="384" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="715" y="378" text-anchor="middle" font-size="9" fill="#374151">AudioContext decodeAudioData per chunk + caption text</text>

  <line x1="809" y1="398" x2="92" y2="398" stroke="#be123c" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="450" y="392" text-anchor="middle" font-size="9" fill="#374151">closed caption displayed for all TTS (accessibility)</text>

  <!-- Footer -->
  <rect x="8" y="416" width="884" height="36" rx="6" fill="#1a1822"/>
  <text x="90" y="432" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">Wake Confidence</text>
  <text x="90" y="446" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">&gt;0.85 threshold</text>
  <text x="255" y="432" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">VAD Silence</text>
  <text x="255" y="446" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">5 × 30ms frames</text>
  <text x="450" y="432" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">Total Latency</text>
  <text x="450" y="446" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">500ms budget</text>
  <text x="645" y="432" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">TTFA Target</text>
  <text x="645" y="446" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">&lt;100ms TTS</text>
  <text x="820" y="432" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Speculative Exec</text>
  <text x="820" y="446" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">&gt;0.95 partial conf</text>

  <!-- Latency budget bar -->
  <rect x="8" y="456" width="884" height="36" rx="6" fill="#312e81" opacity="0.85"/>
  <text x="450" y="468" text-anchor="middle" font-size="9" fill="#e0e7ff" font-weight="600">Latency Budget: 150ms VAD end + 150ms STT final + 50ms NLU + 50ms dispatch + 100ms TTS first chunk = 500ms</text>
  <rect x="18" y="476" width="150" height="8" rx="3" fill="#818cf8"/>
  <rect x="172" y="476" width="150" height="8" rx="3" fill="#60a5fa"/>
  <rect x="326" y="476" width="50" height="8" rx="3" fill="#34d399"/>
  <rect x="380" y="476" width="50" height="8" rx="3" fill="#fbbf24"/>
  <rect x="434" y="476" width="100" height="8" rx="3" fill="#f87171"/>
  <text x="93" y="491" text-anchor="middle" font-size="8" fill="#c7d2fe">VAD 150ms</text>
  <text x="247" y="491" text-anchor="middle" font-size="8" fill="#bfdbfe">STT 150ms</text>
  <text x="351" y="491" text-anchor="middle" font-size="8" fill="#a7f3d0">NLU 50</text>
  <text x="405" y="491" text-anchor="middle" font-size="8" fill="#fde68a">Dispatch 50</text>
  <text x="484" y="491" text-anchor="middle" font-size="8" fill="#fecaca">TTS 100ms</text>
</svg>
