<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <rect width="900" height="520" fill="#f3f1f8"/>
  <text x="450" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1822">On-Device AI Inference UI — Model Load, Inference &amp; Fallback</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr-g" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2f9d74"/>
    </marker>
    <marker id="arr-o" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97843"/>
    </marker>
    <marker id="arr-r" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e05252"/>
    </marker>
  </defs>

  <!-- 5 actors -->
  <rect x="20" y="65" width="110" height="40" rx="8" fill="#6d5bd0"/>
  <text x="75" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">App UI</text>
  <text x="75" y="98" text-anchor="middle" font-size="10" fill="#edeaf5">model picker + stream</text>

  <rect x="198" y="65" width="115" height="40" rx="8" fill="#2563eb"/>
  <text x="255" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">IndexedDB Cache</text>
  <text x="255" y="98" text-anchor="middle" font-size="10" fill="#dbeafe">model chunks + meta</text>

  <rect x="388" y="65" width="115" height="40" rx="8" fill="#2f9d74"/>
  <text x="445" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Web Worker</text>
  <text x="445" y="98" text-anchor="middle" font-size="10" fill="#d1fae5">inference engine</text>

  <rect x="578" y="65" width="115" height="40" rx="8" fill="#d97843"/>
  <text x="635" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">WebGPU / WASM</text>
  <text x="635" y="98" text-anchor="middle" font-size="10" fill="#fef3c7">backend + KV cache</text>

  <rect x="768" y="65" width="112" height="40" rx="8" fill="#be123c"/>
  <text x="824" y="83" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">Cloud API</text>
  <text x="824" y="98" text-anchor="middle" font-size="10" fill="#fecdd3">fallback w/ notice</text>

  <!-- Lifelines -->
  <line x1="75"  y1="105" x2="75"  y2="490" stroke="#c4bde8" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="255" y1="105" x2="255" y2="490" stroke="#93c5fd" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="445" y1="105" x2="445" y2="490" stroke="#6ee7b7" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="635" y1="105" x2="635" y2="490" stroke="#fcd34d" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="824" y1="105" x2="824" y2="490" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- SECTION 1: Model Load + Cache -->
  <rect x="8" y="118" width="884" height="14" rx="3" fill="#6d5bd0" opacity="0.15"/>
  <text x="450" y="129" text-anchor="middle" font-size="9" font-weight="bold" fill="#4c1d95">1 · MODEL LOAD — check IndexedDB; if missing: CDN Range 10MB chunks → streaming write → SHA-256 validate; read chunks → Web Worker</text>

  <line x1="75" y1="150" x2="240" y2="150" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="144" text-anchor="middle" font-size="9" fill="#374151">check IndexedDB for model (by URL hash)</text>

  <line x1="240" y1="164" x2="75" y2="164" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="157" y="158" text-anchor="middle" font-size="9" fill="#374151">miss: CDN fetch Range 10MB chunks → streaming IDB write</text>

  <line x1="240" y1="178" x2="430" y2="178" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="335" y="172" text-anchor="middle" font-size="9" fill="#374151">SHA-256 validated → postMessage ArrayBuffer to worker</text>

  <!-- SECTION 2: Backend Selection + Inference -->
  <rect x="8" y="196" width="884" height="14" rx="3" fill="#2f9d74" opacity="0.18"/>
  <text x="450" y="207" text-anchor="middle" font-size="9" font-weight="bold" fill="#065f46">2 · INFERENCE — WebGPU if navigator.gpu, else WASM+SIMD; KV cache GPU buffers reused per token; streaming tokens via postMessage</text>

  <line x1="430" y1="226" x2="620" y2="226" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-o)"/>
  <text x="525" y="220" text-anchor="middle" font-size="9" fill="#374151">feature detect: navigator.gpu → WebGPU session; else WASM</text>

  <line x1="620" y1="240" x2="430" y2="240" stroke="#d97843" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="525" y="234" text-anchor="middle" font-size="9" fill="#374151">KV cache GPU buffers reused; only new token computed per step</text>

  <line x1="430" y1="254" x2="90" y2="254" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="260" y="248" text-anchor="middle" font-size="9" fill="#374151">postMessage token per step → ReadableStream → textContent append</text>

  <!-- Token stream box -->
  <rect x="20" y="264" width="360" height="32" rx="6" fill="#fff" stroke="#2f9d74" stroke-width="1"/>
  <text x="200" y="279" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a1822">AbortController: signal.aborted checked per token step</text>
  <text x="200" y="294" text-anchor="middle" font-size="9" fill="#374151">partial output preserved + "Cancelled" badge on abort</text>

  <!-- SECTION 3: Quantization + Memory -->
  <rect x="8" y="306" width="884" height="14" rx="3" fill="#d97843" opacity="0.18"/>
  <text x="450" y="317" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">3 · QUANTIZATION + MEMORY — FP32/FP16/INT8/INT4 picker; device-aware default; evict in-memory session on memory pressure</text>

  <line x1="75" y1="336" x2="240" y2="336" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="157" y="330" text-anchor="middle" font-size="9" fill="#374151">model picker: size + accuracy score per quantization</text>

  <!-- Quantization table box -->
  <rect x="160" y="346" width="420" height="42" rx="6" fill="#fff" stroke="#d97843" stroke-width="1"/>
  <text x="370" y="361" text-anchor="middle" font-size="9" font-weight="bold" fill="#1a1822">FP32: full acc | FP16: −1%, ½ size | INT8: −3%, ¼ size | INT4: −10%, ⅛ size</text>
  <text x="370" y="378" text-anchor="middle" font-size="9" fill="#374151">navigator.deviceMemory + GPU VRAM query → default recommendation</text>

  <line x1="430" y1="393" x2="90" y2="393" stroke="#d97843" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-g)"/>
  <text x="260" y="387" text-anchor="middle" font-size="9" fill="#374151">memory-warning → evict session (IDB retained); notify UI</text>

  <!-- SECTION 4: Cloud Fallback -->
  <rect x="8" y="408" width="884" height="14" rx="3" fill="#be123c" opacity="0.12"/>
  <text x="450" y="419" text-anchor="middle" font-size="9" font-weight="bold" fill="#9f1239">4 · CLOUD FALLBACK — same interface; privacy notice with provider name; privacy-sensitive mode: disable AI when on-device unavailable</text>

  <line x1="430" y1="438" x2="809" y2="438" stroke="#e05252" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="619" y="432" text-anchor="middle" font-size="9" fill="#374151">no WebGPU / low RAM / incognito → cloud API (same fn sig)</text>

  <line x1="809" y1="452" x2="90" y2="452" stroke="#be123c" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="449" y="446" text-anchor="middle" font-size="9" fill="#374151">☁ cloud icon + "data sent to [provider]" privacy notice shown</text>

  <!-- Footer -->
  <rect x="8" y="468" width="884" height="36" rx="6" fill="#1a1822"/>
  <text x="90" y="484" text-anchor="middle" font-size="9" fill="#c4b5fd" font-weight="600">Chunk Size</text>
  <text x="90" y="498" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">10MB Range</text>
  <text x="255" y="484" text-anchor="middle" font-size="9" fill="#93c5fd" font-weight="600">WebGPU Speedup</text>
  <text x="255" y="498" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">10–50× vs WASM</text>
  <text x="450" y="484" text-anchor="middle" font-size="9" fill="#6ee7b7" font-weight="600">KV Cache</text>
  <text x="450" y="498" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">GPU buffer reuse</text>
  <text x="645" y="484" text-anchor="middle" font-size="9" fill="#fcd34d" font-weight="600">Cold Start</text>
  <text x="645" y="498" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">2–5s + warmup</text>
  <text x="820" y="484" text-anchor="middle" font-size="9" fill="#fca5a5" font-weight="600">Privacy Default</text>
  <text x="820" y="498" text-anchor="middle" font-size="11" fill="#fff" font-weight="700">on-device = lock 🔒</text>
</svg>
