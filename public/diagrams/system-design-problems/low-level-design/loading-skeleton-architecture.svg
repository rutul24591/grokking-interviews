<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Loading Skeleton — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Skeleton config · Shimmer animation · Layout match · Stagger &amp; aria-busy</text>
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — SKELETON CONFIG</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">SkeletonProps</text>
  <text x="34" y="133" font-size="9" fill="#374151">width: number | string | "100%"</text>
  <text x="34" y="148" font-size="9" fill="#374151">height: number | string</text>
  <text x="34" y="163" font-size="9" fill="#374151">variant: text|rect|circle|card</text>
  <text x="34" y="178" font-size="9" fill="#374151">count: repeat N skeletons</text>
  <text x="34" y="193" font-size="9" fill="#374151">borderRadius: px or % (circle)</text>
  <text x="34" y="208" font-size="9" fill="#374151">animation: shimmer|pulse|none</text>
  <text x="34" y="223" font-size="9" fill="#374151">baseColor: #e2e8f0 (light mode)</text>
  <text x="34" y="240" font-size="9" fill="#374151">highlightColor: #f8fafc shimmer</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Skeleton Variants</text>
  <text x="236" y="133" font-size="9" fill="#374151">text: h=1em, radius=4px</text>
  <text x="236" y="148" font-size="9" fill="#374151">  multiple = line group</text>
  <text x="236" y="163" font-size="9" fill="#374151">  last line: 70% width (natural)</text>
  <text x="236" y="178" font-size="9" fill="#374151">rect: arbitrary box placeholder</text>
  <text x="236" y="193" font-size="9" fill="#374151">circle: w=h, radius=50%</text>
  <text x="236" y="208" font-size="9" fill="#374151">  avatar / icon placeholder</text>
  <text x="236" y="223" font-size="9" fill="#374151">card: flex row with avatar+lines</text>
  <text x="236" y="240" font-size="9" fill="#374151">  pre-composed common pattern</text>
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — SHIMMER ANIMATION</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Shimmer Technique</text>
  <text x="485" y="133" font-size="9" fill="#374151">CSS linear-gradient overlay</text>
  <text x="485" y="148" font-size="9" fill="#374151">  -90deg: left → shiny → right</text>
  <text x="485" y="163" font-size="9" fill="#374151">  base → highlight → base</text>
  <text x="485" y="178" font-size="9" fill="#374151">@keyframes shimmer:</text>
  <text x="485" y="193" font-size="9" fill="#374151">  translateX(-100% → 100%)</text>
  <text x="485" y="208" font-size="9" fill="#374151">Duration: 1.5s ease-in-out</text>
  <text x="485" y="225" font-size="9" fill="#374151">  repeat: infinite</text>
  <text x="485" y="240" font-size="9" fill="#374151">background-size: 200% 100%</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Pulse Alternative</text>
  <text x="682" y="133" font-size="9" fill="#374151">@keyframes pulse:</text>
  <text x="682" y="148" font-size="9" fill="#374151">  opacity: 1 → 0.5 → 1</text>
  <text x="682" y="163" font-size="9" fill="#374151">  2s ease infinite</text>
  <text x="682" y="178" font-size="9" fill="#374151">Lower GPU cost than shimmer</text>
  <text x="682" y="193" font-size="9" fill="#374151">  good for many skeletons</text>
  <text x="682" y="208" font-size="9" fill="#374151">prefers-reduced-motion:</text>
  <text x="682" y="225" font-size="9" fill="#374151">  animation: none override</text>
  <text x="682" y="240" font-size="9" fill="#374151">  static placeholder shown</text>
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — LAYOUT MATCH</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Pixel Match Strategy</text>
  <text x="34" y="358" font-size="9" fill="#374151">Skeleton mirrors real layout</text>
  <text x="34" y="373" font-size="9" fill="#374151">  same width/height/spacing</text>
  <text x="34" y="388" font-size="9" fill="#374151">CLS prevention: reserve space</text>
  <text x="34" y="403" font-size="9" fill="#374151">  no layout shift on load</text>
  <text x="34" y="418" font-size="9" fill="#374151">Aspect ratio boxes: padding-top</text>
  <text x="34" y="433" font-size="9" fill="#374151">  e.g. 16:9 image placeholder</text>
  <text x="34" y="448" font-size="9" fill="#374151">Grid: skeleton fills same columns</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Fade Transition</text>
  <text x="236" y="358" font-size="9" fill="#374151">Wrap: position:relative container</text>
  <text x="236" y="373" font-size="9" fill="#374151">Skeleton: absolute top:0 left:0</text>
  <text x="236" y="388" font-size="9" fill="#374151">  same dimensions as content</text>
  <text x="236" y="403" font-size="9" fill="#374151">Content: opacity:0 while loading</text>
  <text x="236" y="418" font-size="9" fill="#374151">  fade in: opacity→1 200ms</text>
  <text x="236" y="433" font-size="9" fill="#374151">Skeleton: fade out simultaneously</text>
  <text x="236" y="448" font-size="9" fill="#374151">  unmount after transition ends</text>
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — STAGGER &amp; ARIA</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Stagger Effect</text>
  <text x="485" y="358" font-size="9" fill="#374151">Multiple skeletons stagger</text>
  <text x="485" y="373" font-size="9" fill="#374151">  animation-delay: i × 100ms</text>
  <text x="485" y="388" font-size="9" fill="#374151">  gives sequential cascade feel</text>
  <text x="485" y="403" font-size="9" fill="#374151">Max stagger delay: 500ms cap</text>
  <text x="485" y="418" font-size="9" fill="#374151">  beyond 5 items: same delay</text>
  <text x="485" y="433" font-size="9" fill="#374151">Fade-in: stagger applies on</text>
  <text x="485" y="448" font-size="9" fill="#374151">  content reveal too (optional)</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Accessibility</text>
  <text x="682" y="358" font-size="9" fill="#374151">aria-busy="true" on container</text>
  <text x="682" y="373" font-size="9" fill="#374151">  set while loading</text>
  <text x="682" y="388" font-size="9" fill="#374151">  remove on content ready</text>
  <text x="682" y="403" font-size="9" fill="#374151">aria-label="Loading..." on wrap</text>
  <text x="682" y="418" font-size="9" fill="#374151">Skeleton: aria-hidden="true"</text>
  <text x="682" y="433" font-size="9" fill="#374151">  not read by screen readers</text>
  <text x="682" y="448" font-size="9" fill="#374151">role="status" for polite updates</text>
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Shimmer duration: 1.5s infinite</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Stagger step: 100ms per item</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Fade-out: 200ms on content ready</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">aria-busy: true while loading</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">CLS: reserve space matches layout</text>
</svg>
