<text x="304" y="175" font-family="Arial" font-size="18" font-weight="700" fill="#854d0e">Pressure</text><text x="300" y="204" font-family="Arial" font-size="14" fill="#334155">scale limit</text>
<text x="537" y="343" font-family="Arial" font-size="19" font-weight="700" fill="#164e63">Policy gate</text><text x="532" y="374" font-family="Arial" font-size="14" fill="#334155">validate intent</text>
<text x="790" y="175" font-family="Arial" font-size="18" font-weight="700" fill="#991b1b">Failure</text><text x="786" y="204" font-family="Arial" font-size="14" fill="#334155">reject or timeout</text>
<text x="988" y="344" font-family="Arial" font-size="18" font-weight="700" fill="#14532d">Recover</text><text x="980" y="373" font-family="Arial" font-size="14" fill="#334155">stable fallback</text>
<text x="785" y="535" font-family="Arial" font-size="18" font-weight="700" fill="#5b21b6">Observe</text><text x="778" y="564" font-family="Arial" font-size="14" fill="#334155">emit evidence</text>
<text x="306" y="535" font-family="Arial" font-size="18" font-weight="700" fill="#9d174d">Reconcile</text><text x="290" y="564" font-family="Arial" font-size="14" fill="#334155">restore commit</text>
<rect x="94" y="628" width="1012" height="56" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="120" y="663" font-family="Arial" font-size="15" fill="#334155">retain the draft on validation failure, distinguish invalid from ambiguous times, offer an explicit offset choice, and degrade to typed input when advanced UI is unavailable</text>
