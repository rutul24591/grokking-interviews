" stroke-width="3"/><text x="976" y="405" font-family="Arial" font-size="15" font-weight="700" fill="#0f172a">viewport projectio</text><text x="982" y="432" font-family="Arial" font-size="13" fill="#475569">stage 6</text><rect x="86" y="608" width="1028" height="62" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="112" y="646" font-family="Arial" font-size="14" fill="#334155">cell addressing, range selection, formula parsing, dependency tracking, recalculation, virtualization, clipboard, undo, and edit commit</text></svg>