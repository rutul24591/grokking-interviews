<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Pagination Component — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Page state · Range algorithm · URL sync · Cursor mode &amp; scroll</text>
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — PAGE STATE MODEL</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">PaginationState</text>
  <text x="34" y="133" font-size="9" fill="#374151">currentPage: number (1-indexed)</text>
  <text x="34" y="148" font-size="9" fill="#374151">totalPages: Math.ceil(total/size)</text>
  <text x="34" y="163" font-size="9" fill="#374151">pageSize: number (default 20)</text>
  <text x="34" y="178" font-size="9" fill="#374151">totalItems: number from API</text>
  <text x="34" y="193" font-size="9" fill="#374151">isLoading: fetch in progress</text>
  <text x="34" y="208" font-size="9" fill="#374151">pageSizeOptions: [10,20,50,100]</text>
  <text x="34" y="223" font-size="9" fill="#374151">  select dropdown on right</text>
  <text x="34" y="240" font-size="9" fill="#374151">Controlled: page + onPageChange</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">PaginationProps</text>
  <text x="236" y="133" font-size="9" fill="#374151">page: number (controlled)</text>
  <text x="236" y="148" font-size="9" fill="#374151">count: number (total pages)</text>
  <text x="236" y="163" font-size="9" fill="#374151">onChange(page): void</text>
  <text x="236" y="178" font-size="9" fill="#374151">siblingCount: 1 (pages around)</text>
  <text x="236" y="193" font-size="9" fill="#374151">boundaryCount: 1 (first/last)</text>
  <text x="236" y="208" font-size="9" fill="#374151">showFirstLast: boolean</text>
  <text x="236" y="223" font-size="9" fill="#374151">disabled: boolean</text>
  <text x="236" y="240" font-size="9" fill="#374151">shape: rounded|circular|square</text>
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — RANGE ALGORITHM</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Page Range Calc</text>
  <text x="485" y="133" font-size="9" fill="#374151">Always show: 1 and totalPages</text>
  <text x="485" y="148" font-size="9" fill="#374151">Always show: ± siblingCount</text>
  <text x="485" y="163" font-size="9" fill="#374151">  around currentPage</text>
  <text x="485" y="178" font-size="9" fill="#374151">Ellipsis: when gap &gt; 1</text>
  <text x="485" y="193" font-size="9" fill="#374151">  ... between boundary + siblings</text>
  <text x="485" y="208" font-size="9" fill="#374151">Max buttons: 7 (configurable)</text>
  <text x="485" y="225" font-size="9" fill="#374151">  beyond → show ellipsis</text>
  <text x="485" y="240" font-size="9" fill="#374151">E.g.: 1 ... 4 [5] 6 ... 20</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Navigation Controls</text>
  <text x="682" y="133" font-size="9" fill="#374151">Prev: disabled on page=1</text>
  <text x="682" y="148" font-size="9" fill="#374151">Next: disabled on last page</text>
  <text x="682" y="163" font-size="9" fill="#374151">First/Last: optional ⟨⟨ ⟩⟩ buttons</text>
  <text x="682" y="178" font-size="9" fill="#374151">Jump: text input → Go button</text>
  <text x="682" y="193" font-size="9" fill="#374151">  validate: 1 ≤ input ≤ total</text>
  <text x="682" y="208" font-size="9" fill="#374151">Loading state: show spinner</text>
  <text x="682" y="225" font-size="9" fill="#374151">  prevent double-click fetch</text>
  <text x="682" y="240" font-size="9" fill="#374151">aria-current="page" active btn</text>
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — URL SYNC</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Offset Pagination</text>
  <text x="34" y="358" font-size="9" fill="#374151">?page=3 query param</text>
  <text x="34" y="373" font-size="9" fill="#374151">  pushState on page change</text>
  <text x="34" y="388" font-size="9" fill="#374151">?pageSize=50: persist preference</text>
  <text x="34" y="403" font-size="9" fill="#374151">On mount: read from URL</text>
  <text x="34" y="418" font-size="9" fill="#374151">  clamp to valid range</text>
  <text x="34" y="433" font-size="9" fill="#374151">Browser back: restore page</text>
  <text x="34" y="448" font-size="9" fill="#374151">  popstate → update state</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Scroll Behaviour</text>
  <text x="236" y="358" font-size="9" fill="#374151">On page change: scroll to top</text>
  <text x="236" y="373" font-size="9" fill="#374151">  scrollTo({ top: 0, behavior: smooth })</text>
  <text x="236" y="388" font-size="9" fill="#374151">  or scroll to list container top</text>
  <text x="236" y="403" font-size="9" fill="#374151">Offset: tableRef.current.scrollIntoView</text>
  <text x="236" y="418" font-size="9" fill="#374151">  skip scroll if already at top</text>
  <text x="236" y="433" font-size="9" fill="#374151">Focus: first item after page load</text>
  <text x="236" y="448" font-size="9" fill="#374151">  accessibility after navigation</text>
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — CURSOR MODE &amp; A11Y</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Cursor Pagination</text>
  <text x="485" y="358" font-size="9" fill="#374151">cursor: opaque token from API</text>
  <text x="485" y="373" font-size="9" fill="#374151">  ?after=cursor or ?before=</text>
  <text x="485" y="388" font-size="9" fill="#374151">No random page access</text>
  <text x="485" y="403" font-size="9" fill="#374151">  only Prev / Next buttons</text>
  <text x="485" y="418" font-size="9" fill="#374151">Stack: cursors[] for Back nav</text>
  <text x="485" y="433" font-size="9" fill="#374151">  push on next, pop on prev</text>
  <text x="485" y="448" font-size="9" fill="#374151">Token TTL: 15min server-side</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Accessibility</text>
  <text x="682" y="358" font-size="9" fill="#374151">nav role="navigation"</text>
  <text x="682" y="373" font-size="9" fill="#374151">  aria-label="Pagination"</text>
  <text x="682" y="388" font-size="9" fill="#374151">Each btn: aria-label="Page 3"</text>
  <text x="682" y="403" font-size="9" fill="#374151">  current: aria-current="page"</text>
  <text x="682" y="418" font-size="9" fill="#374151">Ellipsis: aria-hidden="true"</text>
  <text x="682" y="433" font-size="9" fill="#374151">Keyboard: Tab + Enter to page</text>
  <text x="682" y="448" font-size="9" fill="#374151">Results: "Showing 21–40 of 200"</text>
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Max buttons: 7 (with ellipsis)</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Ellipsis threshold: gap &gt; 1</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">URL param: ?page=N</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Cursor token TTL: 15min</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Scroll: smooth to top on change</text>
</svg>
