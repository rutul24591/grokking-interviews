<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Spreadsheet-like Grid — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Cell model · Formula engine · Selection &amp; range · Conditional format &amp; undo</text>
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — CELL MODEL</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">CellData</text>
  <text x="34" y="133" font-size="9" fill="#374151">id: "A1" (col+row notation)</text>
  <text x="34" y="148" font-size="9" fill="#374151">raw: string (user input)</text>
  <text x="34" y="163" font-size="9" fill="#374151">computed: number|string|null</text>
  <text x="34" y="178" font-size="9" fill="#374151">type: text|number|bool|formula</text>
  <text x="34" y="193" font-size="9" fill="#374151">  |date|error</text>
  <text x="34" y="208" font-size="9" fill="#374151">format: { type, pattern }</text>
  <text x="34" y="223" font-size="9" fill="#374151">  e.g. "currency" "#,##0.00"</text>
  <text x="34" y="240" font-size="9" fill="#374151">style: bold|italic|align|bg</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Grid Storage</text>
  <text x="236" y="133" font-size="9" fill="#374151">cells: Map&lt;id, CellData&gt;</text>
  <text x="236" y="148" font-size="9" fill="#374151">  sparse: only non-empty cells</text>
  <text x="236" y="163" font-size="9" fill="#374151">cols: ColMeta[] (width, frozen)</text>
  <text x="236" y="178" font-size="9" fill="#374151">rows: RowMeta[] (height, frozen)</text>
  <text x="236" y="193" font-size="9" fill="#374151">Merge: mergedCells: Range[]</text>
  <text x="236" y="208" font-size="9" fill="#374151">  master cell renders span</text>
  <text x="236" y="223" font-size="9" fill="#374151">Virtualise: canvas or DOM grid</text>
  <text x="236" y="240" font-size="9" fill="#374151">  render visible viewport only</text>
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — FORMULA ENGINE</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Parse &amp; Evaluate</text>
  <text x="485" y="133" font-size="9" fill="#374151">Detect: raw starts with "="</text>
  <text x="485" y="148" font-size="9" fill="#374151">Tokenise: lexer splits formula</text>
  <text x="485" y="163" font-size="9" fill="#374151">AST: recursive descent parser</text>
  <text x="485" y="178" font-size="9" fill="#374151">Evaluate: depth-first AST walk</text>
  <text x="485" y="193" font-size="9" fill="#374151">Cell refs: resolve via cells Map</text>
  <text x="485" y="208" font-size="9" fill="#374151">Range: SUM(A1:A10) expand</text>
  <text x="485" y="225" font-size="9" fill="#374151">Errors: #DIV/0! #REF! #NAME?</text>
  <text x="485" y="240" font-size="9" fill="#374151">Built-ins: SUM|AVG|IF|VLOOKUP</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Dependency Graph</text>
  <text x="682" y="133" font-size="9" fill="#374151">deps: Map&lt;id, Set&lt;id&gt;&gt;</text>
  <text x="682" y="148" font-size="9" fill="#374151">  A1 depends on B2, C3</text>
  <text x="682" y="163" font-size="9" fill="#374151">On edit: topological sort</text>
  <text x="682" y="178" font-size="9" fill="#374151">  recalculate in dep order</text>
  <text x="682" y="193" font-size="9" fill="#374151">Circular: detect DFS cycle</text>
  <text x="682" y="208" font-size="9" fill="#374151">  show #CIRCULAR! error</text>
  <text x="682" y="225" font-size="9" fill="#374151">Max depth: 50 levels</text>
  <text x="682" y="240" font-size="9" fill="#374151">  abort beyond to prevent hang</text>
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — SELECTION &amp; RANGE</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Selection Model</text>
  <text x="34" y="358" font-size="9" fill="#374151">anchor: { row, col } (start)</text>
  <text x="34" y="373" font-size="9" fill="#374151">focus: { row, col } (end)</text>
  <text x="34" y="388" font-size="9" fill="#374151">Multi: Ctrl+click adds range</text>
  <text x="34" y="403" font-size="9" fill="#374151">Column: click header → full col</text>
  <text x="34" y="418" font-size="9" fill="#374151">Row: click row header → full row</text>
  <text x="34" y="433" font-size="9" fill="#374151">All: Ctrl+A select all cells</text>
  <text x="34" y="448" font-size="9" fill="#374151">Copy: Ctrl+C → clipboard TSV</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Keyboard Navigation</text>
  <text x="236" y="358" font-size="9" fill="#374151">↑↓←→: move active cell</text>
  <text x="236" y="373" font-size="9" fill="#374151">Tab: next col, Enter: next row</text>
  <text x="236" y="388" font-size="9" fill="#374151">Shift+↑↓←→: extend selection</text>
  <text x="236" y="403" font-size="9" fill="#374151">Ctrl+→: jump to last in row</text>
  <text x="236" y="418" font-size="9" fill="#374151">F2: enter edit mode on cell</text>
  <text x="236" y="433" font-size="9" fill="#374151">Delete: clear cell value</text>
  <text x="236" y="448" font-size="9" fill="#374151">Escape: cancel edit, restore</text>
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — CONDITIONAL FORMAT &amp; UNDO</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Conditional Format</text>
  <text x="485" y="358" font-size="9" fill="#374151">CFRule: { range, condition, style }</text>
  <text x="485" y="373" font-size="9" fill="#374151">Conditions: gt|lt|eq|between</text>
  <text x="485" y="388" font-size="9" fill="#374151">  |contains|formula</text>
  <text x="485" y="403" font-size="9" fill="#374151">Priority: lower index wins</text>
  <text x="485" y="418" font-size="9" fill="#374151">Data bars: linear gradient fill</text>
  <text x="485" y="433" font-size="9" fill="#374151">Color scales: interpolate range</text>
  <text x="485" y="448" font-size="9" fill="#374151">Max rules: 50 per sheet</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Undo / Redo</text>
  <text x="682" y="358" font-size="9" fill="#374151">History: Command[] stack</text>
  <text x="682" y="373" font-size="9" fill="#374151">  max 100 commands</text>
  <text x="682" y="388" font-size="9" fill="#374151">Command: { execute, undo }</text>
  <text x="682" y="403" font-size="9" fill="#374151">  CellEditCmd, PasteCmd...</text>
  <text x="682" y="418" font-size="9" fill="#374151">Ctrl+Z: pop + run undo()</text>
  <text x="682" y="433" font-size="9" fill="#374151">Ctrl+Y: push + run execute()</text>
  <text x="682" y="448" font-size="9" fill="#374151">Batch: multi-cell paste = 1 cmd</text>
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Formula depth: max 50 levels</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Circular ref: DFS detection</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">CF rules max: 50 per sheet</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Undo stack: 100 commands</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Copy: Ctrl+C → TSV clipboard</text>
</svg>
