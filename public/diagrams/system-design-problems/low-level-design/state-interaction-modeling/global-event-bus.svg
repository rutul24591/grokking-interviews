<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Global Event Bus System: Pub/Sub Architecture</text>

  <!-- Event Bus Core -->
  <g>
    <text x="220" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Event Bus Architecture</text>

    <!-- Publishers -->
    <rect x="30" y="80" width="140" height="45" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="100" y="107" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">Header Component</text>

    <rect x="30" y="145" width="140" height="45" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="100" y="172" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">Auth Service</text>

    <rect x="30" y="210" width="140" height="45" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="100" y="237" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">WebSocket Handler</text>

    <!-- Arrows to bus -->
    <path d="M 170 102 L 210 175" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#aebB)"/>
    <path d="M 170 167 L 210 185" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#aebB)"/>
    <path d="M 170 232 L 210 200" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#aebB)"/>

    <!-- Event Bus -->
    <rect x="210" y="120" width="220" height="145" fill="#fef3c7" stroke="#f59e0b" stroke-width="3" rx="6"/>
    <text x="320" y="148" font-size="13" font-weight="bold" text-anchor="middle" fill="#92400e">Event Bus</text>
    <text x="320" y="168" font-size="10" text-anchor="middle" fill="#374151">emit(event, payload)</text>
    <text x="320" y="186" font-size="10" text-anchor="middle" fill="#374151">on(event, handler)</text>
    <text x="320" y="204" font-size="10" text-anchor="middle" fill="#374151">off(event, handler)</text>
    <text x="320" y="222" font-size="10" text-anchor="middle" fill="#374151">once(event, handler)</text>
    <text x="320" y="242" font-size="9" text-anchor="middle" fill="#92400e">Map&lt;event, Set&lt;handler&gt;&gt;</text>

    <!-- Arrows from bus -->
    <path d="M 430 160 L 470 115" stroke="#10b981" stroke-width="1.5" fill="none" marker-end="url(#aebG)"/>
    <path d="M 430 185 L 470 185" stroke="#10b981" stroke-width="1.5" fill="none" marker-end="url(#aebG)"/>
    <path d="M 430 210 L 470 255" stroke="#10b981" stroke-width="1.5" fill="none" marker-end="url(#aebG)"/>

    <!-- Subscribers -->
    <rect x="470" y="90" width="140" height="45" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="540" y="117" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">Toast System</text>

    <rect x="470" y="162" width="140" height="45" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="540" y="189" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">Analytics Tracker</text>

    <rect x="470" y="234" width="140" height="45" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="540" y="261" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">Cart Sync Module</text>
  </g>

  <!-- Event Catalog -->
  <g>
    <text x="760" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Event Design &amp; Pitfalls</text>

    <rect x="640" y="75" width="430" height="210" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="855" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">Event Catalog (Typed Events)</text>
    <text x="655" y="122" font-size="10" fill="#374151">user:login       → {userId, role, timestamp}</text>
    <text x="655" y="140" font-size="10" fill="#374151">user:logout      → {reason: 'timeout'|'manual'}</text>
    <text x="655" y="158" font-size="10" fill="#374151">cart:updated     → {items, total}</text>
    <text x="655" y="176" font-size="10" fill="#374151">notification:new → {id, type, message}</text>
    <text x="655" y="194" font-size="10" fill="#374151">ws:message       → {channel, data}</text>
    <text x="655" y="214" font-size="11" font-weight="bold" fill="#374151">TypeScript safety:</text>
    <text x="655" y="232" font-size="10" fill="#374151">  type EventMap = {</text>
    <text x="655" y="250" font-size="10" fill="#374151">    'user:login': {userId: string}</text>
    <text x="655" y="268" font-size="10" fill="#374151">  }</text>
    <text x="655" y="278" font-size="9" fill="#a855f7">Enforce: emit/on infer payload type from event name</text>

    <rect x="640" y="300" width="430" height="180" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="855" y="325" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Pitfalls &amp; Mitigations</text>
    <text x="655" y="348" font-size="10" fill="#374151">Memory leaks: always call off() in cleanup/unmount</text>
    <text x="655" y="366" font-size="10" fill="#374151">Event storms: debounce high-freq emitters</text>
    <text x="655" y="384" font-size="10" fill="#374151">Hidden coupling: log all events in dev mode</text>
    <text x="655" y="402" font-size="10" fill="#374151">Order dependency: events should be order-independent</text>
    <text x="655" y="420" font-size="10" fill="#374151">Synchronous: event bus is sync by default (blocks emitter)</text>
    <text x="655" y="438" font-size="10" fill="#374151">  Use queueMicrotask/setTimeout for async delivery</text>
    <text x="655" y="456" font-size="10" fill="#374151">Testing: spy on emit + assert handlers called</text>
    <text x="655" y="472" font-size="9" fill="#ef4444">Overuse: don't replace all props/context — use for cross-module comms only</text>

    <rect x="640" y="495" width="430" height="55" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="855" y="518" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">When to Use</text>
    <text x="655" y="538" font-size="10" fill="#374151">Cross-cutting concerns (analytics, logging), plugin systems, decoupled modules, WebSocket dispatch</text>
  </g>

  <!-- Implementation -->
  <g>
    <text x="220" y="320" font-size="14" font-weight="bold" fill="#1a1a1a">Implementation &amp; Lifecycle</text>

    <rect x="30" y="335" width="590" height="140" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="320" y="360" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">React Integration Pattern</text>
    <text x="45" y="382" font-size="10" fill="#374151">useEventBus hook: subscribe in useEffect, cleanup on unmount</text>
    <text x="45" y="400" font-size="10" fill="#374151">useEffect(() =&gt; {"{"} bus.on('user:login', handler); return () =&gt; bus.off('user:login', handler) {"}"}, [])</text>
    <text x="45" y="420" font-size="10" fill="#374151">Emit from anywhere: bus.emit('cart:updated', {items, total})</text>
    <text x="45" y="440" font-size="10" fill="#374151">Context alternative: use React Context for component-tree-local events</text>
    <text x="45" y="458" font-size="10" fill="#374151">vs Redux: event bus is fire-and-forget; Redux is synchronous state store with history</text>
    <text x="45" y="470" font-size="9" fill="#3b82f6">Singleton: export a single bus instance from module — shared across entire app</text>
  </g>

  <defs>
    <marker id="aebB" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/></marker>
    <marker id="aebG" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#10b981"/></marker>
  </defs>
</svg>
