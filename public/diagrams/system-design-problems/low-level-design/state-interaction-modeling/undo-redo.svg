<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Undo / Redo System: Stack Architecture &amp; Patterns</text>

  <!-- Command Stack -->
  <g>
    <text x="220" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Command Stack Model</text>

    <rect x="30" y="75" width="380" height="380" fill="#f9fafb" stroke="#d1d5db" stroke-width="2" rx="6"/>

    <!-- Undo stack -->
    <text x="140" y="98" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Undo Stack</text>
    <rect x="45" y="108" width="185" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="137" y="133" font-size="10" text-anchor="middle" fill="#374151">AddNode {id:3, x:100, y:200}</text>
    <rect x="45" y="152" width="185" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="137" y="177" font-size="10" text-anchor="middle" fill="#374151">MoveNode {id:1, dx:50}</text>
    <rect x="45" y="196" width="185" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="137" y="221" font-size="10" text-anchor="middle" fill="#374151">DeleteEdge {from:1, to:2}</text>
    <text x="137" y="258" font-size="10" text-anchor="middle" fill="#9ca3af">← top of stack (most recent)</text>

    <!-- Redo stack -->
    <text x="330" y="98" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Redo Stack</text>
    <rect x="240" y="108" width="155" height="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="3"/>
    <text x="317" y="133" font-size="10" text-anchor="middle" fill="#374151">RenameNode "B"</text>
    <text x="317" y="170" font-size="10" text-anchor="middle" fill="#9ca3af">(cleared on new action)</text>

    <!-- Undo action -->
    <rect x="45" y="285" width="350" height="65" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="3"/>
    <text x="220" y="307" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">Undo Operation</text>
    <text x="60" y="325" font-size="10" fill="#374151">cmd = undoStack.pop()</text>
    <text x="60" y="340" font-size="10" fill="#374151">cmd.undo()  →  redoStack.push(cmd)</text>

    <!-- Redo action -->
    <rect x="45" y="360" width="350" height="65" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="3"/>
    <text x="220" y="382" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">Redo Operation</text>
    <text x="60" y="400" font-size="10" fill="#374151">cmd = redoStack.pop()</text>
    <text x="60" y="415" font-size="10" fill="#374151">cmd.execute()  →  undoStack.push(cmd)</text>

    <text x="220" y="448" font-size="10" text-anchor="middle" fill="#374151">New action → clear redoStack, push to undoStack</text>
  </g>

  <!-- Patterns -->
  <g>
    <text x="740" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Undo Patterns</text>

    <rect x="450" y="75" width="620" height="175" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="760" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">Command Pattern</text>
    <text x="465" y="122" font-size="10" fill="#374151">Each operation is an object with execute() + undo()</text>
    <text x="465" y="140" font-size="10" fill="#374151">execute: apply the change to state</text>
    <text x="465" y="158" font-size="10" fill="#374151">undo: reverse the change (inverse operation)</text>
    <text x="465" y="176" font-size="10" fill="#374151">Composable: MacroCommand groups multiple cmds as one</text>
    <text x="465" y="194" font-size="10" fill="#374151">Serializable: persist to disk for cross-session undo</text>
    <text x="465" y="212" font-size="10" fill="#374151">Examples: AddNodeCommand, DeleteTextCommand, MoveCommand</text>
    <text x="465" y="228" font-size="9" fill="#a855f7">Command objects: {execute(), undo(), description, timestamp}</text>

    <rect x="450" y="265" width="295" height="185" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="598" y="290" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Snapshot Pattern</text>
    <text x="465" y="312" font-size="10" fill="#374151">Store full state snapshot per action</text>
    <text x="465" y="330" font-size="10" fill="#374151">Undo = restore previous snapshot</text>
    <text x="465" y="348" font-size="10" fill="#374151">Simple to implement</text>
    <text x="465" y="366" font-size="10" fill="#374151">Memory-expensive for large states</text>
    <text x="465" y="384" font-size="10" fill="#374151">Structural sharing (Immer) reduces cost</text>
    <text x="465" y="402" font-size="10" fill="#374151">Limit history depth (e.g., 50 states)</text>
    <text x="465" y="420" font-size="10" fill="#374151">Fast: O(1) undo/redo</text>
    <text x="465" y="438" font-size="9" fill="#3b82f6">Best for: small-medium state trees</text>

    <rect x="760" y="265" width="310" height="185" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="915" y="290" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Selective Undo</text>
    <text x="775" y="312" font-size="10" fill="#374151">Not all actions are undoable:</text>
    <text x="775" y="330" font-size="10" fill="#374151">  Undoable: edit, move, delete content</text>
    <text x="775" y="348" font-size="10" fill="#374151">  Not undoable: navigation, zoom, scroll</text>
    <text x="775" y="368" font-size="10" fill="#374151">Collaborative undo:</text>
    <text x="775" y="386" font-size="10" fill="#374151">  Only undo your own actions</text>
    <text x="775" y="404" font-size="10" fill="#374151">  Non-linear undo (complex)</text>
    <text x="775" y="422" font-size="10" fill="#374151">Scoped undo: per-field or per-component</text>
    <text x="775" y="438" font-size="9" fill="#10b981">Mark commands: isUndoable flag per command</text>

    <rect x="450" y="465" width="620" height="80" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="760" y="488" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Keyboard Shortcuts &amp; UX</text>
    <text x="465" y="510" font-size="10" fill="#374151">Cmd/Ctrl+Z = undo, Cmd/Ctrl+Shift+Z = redo, Cmd/Ctrl+Y = redo (Windows)</text>
    <text x="465" y="527" font-size="10" fill="#374151">Toolbar: undo/redo buttons, disabled when stack empty. Tooltip shows action name: "Undo: Delete Node"</text>
  </g>

  <rect x="30" y="478" width="400" height="58" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="3"/>
  <text x="50" y="498" font-size="11" fill="#374151"><tspan font-weight="bold">Choose:</tspan> Command pattern for complex apps, snapshot for simple state.</text>
  <text x="50" y="516" font-size="11" fill="#374151"><tspan font-weight="bold">Limit:</tspan> Max 50-100 history entries to bound memory usage.</text>
  <text x="50" y="531" font-size="9" fill="#6b7280">Libraries: Immer (structural sharing), Zustand middleware, Redux DevTools.</text>
</svg>
