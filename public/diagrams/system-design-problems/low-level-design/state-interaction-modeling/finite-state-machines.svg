<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Finite State Machines: Workflow State Modeling</text>

  <!-- Traffic light FSM example -->
  <g>
    <text x="200" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Traffic Light FSM</text>

    <ellipse cx="120" cy="130" rx="70" ry="32" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="120" y="134" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">GREEN</text>

    <ellipse cx="310" cy="130" rx="70" ry="32" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="310" y="134" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">YELLOW</text>

    <ellipse cx="120" cy="260" rx="70" ry="32" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="120" y="264" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">RED</text>

    <path d="M 190 130 L 240 130" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#afsmY)"/>
    <text x="215" y="122" font-size="9" text-anchor="middle" fill="#92400e">timer</text>

    <path d="M 310 162 L 155 245" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#afsmR)"/>
    <text x="250" y="220" font-size="9" fill="#991b1b">timer</text>

    <path d="M 120 228 L 120 162" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#afsmG)"/>
    <text x="132" y="200" font-size="9" fill="#065f46">timer</text>
  </g>

  <!-- Checkout FSM -->
  <g>
    <text x="220" y="320" font-size="14" font-weight="bold" fill="#1a1a1a">Checkout Workflow FSM</text>

    <ellipse cx="80" cy="380" rx="65" ry="28" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="80" y="384" font-size="10" font-weight="bold" text-anchor="middle" fill="#374151">CART</text>

    <path d="M 145 380 L 175 380" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#afsmG)"/>
    <text x="160" y="372" font-size="8" text-anchor="middle" fill="#374151">checkout</text>

    <ellipse cx="240" cy="380" rx="65" ry="28" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="240" y="384" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e40af">SHIPPING</text>

    <path d="M 305 380 L 335 380" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#afsmG)"/>
    <text x="320" y="372" font-size="8" text-anchor="middle" fill="#374151">submit</text>

    <ellipse cx="400" cy="380" rx="65" ry="28" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="400" y="384" font-size="10" font-weight="bold" text-anchor="middle" fill="#92400e">PAYMENT</text>

    <path d="M 465 380 L 495 380" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#afsmG)"/>
    <text x="480" y="372" font-size="8" text-anchor="middle" fill="#374151">pay</text>

    <ellipse cx="560" cy="380" rx="65" ry="28" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="560" y="377" font-size="10" font-weight="bold" text-anchor="middle" fill="#92400e">PROCESSING</text>
    <text x="560" y="391" font-size="9" text-anchor="middle" fill="#374151">(async)</text>

    <!-- Success branch -->
    <path d="M 600 365 L 660 330" stroke="#10b981" stroke-width="1.5" fill="none" marker-end="url(#afsmG)"/>
    <text x="640" y="345" font-size="8" fill="#065f46">success</text>
    <ellipse cx="720" cy="315" rx="65" ry="28" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="720" y="319" font-size="10" font-weight="bold" text-anchor="middle" fill="#065f46">CONFIRMED</text>

    <!-- Failure branch -->
    <path d="M 600 392 L 660 430" stroke="#ef4444" stroke-width="1.5" fill="none" marker-end="url(#afsmR)"/>
    <text x="642" y="420" font-size="8" fill="#991b1b">failure</text>
    <ellipse cx="720" cy="445" rx="65" ry="28" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="720" y="449" font-size="10" font-weight="bold" text-anchor="middle" fill="#991b1b">FAILED</text>

    <!-- Retry from failed -->
    <path d="M 655 445 L 505 408" stroke="#a855f7" stroke-width="1.5" fill="none" stroke-dasharray="4,2" marker-end="url(#afsmP)"/>
    <text x="580" y="440" font-size="8" fill="#581c87">retry</text>
  </g>

  <!-- XState / Architecture -->
  <g>
    <text x="800" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">FSM Architecture</text>

    <rect x="620" y="75" width="460" height="225" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="850" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">FSM Definition</text>
    <text x="635" y="122" font-size="10" fill="#374151">States: finite set {idle, loading, success, error}</text>
    <text x="635" y="140" font-size="10" fill="#374151">Events: inputs that trigger transitions {SUBMIT, RETRY}</text>
    <text x="635" y="158" font-size="10" fill="#374151">Transitions: (state, event) → nextState + actions</text>
    <text x="635" y="176" font-size="10" fill="#374151">Actions: side effects on transition (fetch, notify)</text>
    <text x="635" y="194" font-size="10" fill="#374151">Guards: conditions on transitions (if retries &lt; 3)</text>
    <text x="635" y="212" font-size="10" fill="#374151">Context: extended state (retry count, data)</text>
    <text x="635" y="230" font-size="10" fill="#374151">Initial state: defined at creation</text>
    <text x="635" y="252" font-size="11" font-weight="bold" fill="#374151">Guarantees:</text>
    <text x="635" y="270" font-size="10" fill="#374151">  Only valid transitions possible — impossible states prevented</text>
    <text x="635" y="286" font-size="9" fill="#3b82f6">XState: industry-standard FSM library for JS/React</text>

    <rect x="620" y="315" width="460" height="165" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="850" y="340" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">Hierarchical State Machines (Statecharts)</text>
    <text x="635" y="362" font-size="10" fill="#374151">Compound states: state containing sub-states</text>
    <text x="635" y="380" font-size="10" fill="#374151">Parallel states: multiple active states simultaneously</text>
    <text x="635" y="398" font-size="10" fill="#374151">History states: remember last active sub-state</text>
    <text x="635" y="416" font-size="10" fill="#374151">Entry/exit actions: run on state enter/leave</text>
    <text x="635" y="434" font-size="10" fill="#374151">Delayed transitions: after(3000, 'TIMEOUT')</text>
    <text x="635" y="452" font-size="10" fill="#374151">Services: invoke async processes from state</text>
    <text x="635" y="469" font-size="9" fill="#a855f7">Statecharts = FSM + hierarchy + parallelism + history</text>

    <rect x="620" y="495" width="460" height="65" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="850" y="518" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">When to Use FSM</text>
    <text x="635" y="538" font-size="10" fill="#374151">Multi-step forms, async operations (loading/error), UI modes (view/edit/delete), animations, game logic</text>
    <text x="635" y="553" font-size="9" fill="#10b981">If you have if/else chains checking "current status" — FSM will simplify it dramatically</text>
  </g>

  <rect x="30" y="520" width="580" height="48" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="3"/>
  <text x="50" y="540" font-size="11" fill="#374151"><tspan font-weight="bold">Benefits:</tspan> Impossible states impossible. Self-documenting. Testable. Visual tooling (XState visualizer).</text>
  <text x="50" y="558" font-size="11" fill="#374151"><tspan font-weight="bold">Avoid:</tspan> Simple boolean flags that never coexist. Use when state combinations matter.</text>

  <defs>
    <marker id="afsmG" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#10b981"/></marker>
    <marker id="afsmY" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/></marker>
    <marker id="afsmR" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/></marker>
    <marker id="afsmP" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#a855f7"/></marker>
  </defs>
</svg>
