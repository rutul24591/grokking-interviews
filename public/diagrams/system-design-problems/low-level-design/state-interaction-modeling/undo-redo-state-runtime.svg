<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Undo Redo runtime model</title>
  <desc id="desc">A state runtime with API calls, guarded transitions, effect runner, snapshots, subscribers, and observability.</desc>
  <defs>
    <marker id="arrow-undo-redo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow-undo-redo" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#f8fafc"/>
  <rect x="38" y="34" width="1124" height="652" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="72" y="86" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">Undo Redo: guarded state runtime</text>
  <text x="72" y="120" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Implementation view: API intent becomes a validated transition before effects or UI observers run.</text>
  <g filter="url(#shadow-undo-redo)">
    <path d="M78 182 C150 120, 260 136, 322 200 C380 260, 338 356, 240 366 C130 378, 48 308, 78 182" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="128" y="218" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">Callers</text>
    <text x="104" y="250" font-family="Inter, Arial, sans-serif" font-size="15" fill="#1e40af">components</text>
    <text x="104" y="274" font-family="Inter, Arial, sans-serif" font-size="15" fill="#1e40af">hooks</text>
    <text x="104" y="298" font-family="Inter, Arial, sans-serif" font-size="15" fill="#1e40af">debug tools</text>
  </g>
  <path d="M330 258 L452 258" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-undo-redo)"/>
  <g filter="url(#shadow-undo-redo)">
    <rect x="456" y="166" width="286" height="184" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
    <text x="486" y="210" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#164e63">Transition engine</text>
    <text x="486" y="244" font-family="Inter, Arial, sans-serif" font-size="15" fill="#155e75">ready -&gt; grouping -&gt; undoing</text>
    <text x="486" y="274" font-family="Inter, Arial, sans-serif" font-size="15" fill="#155e75">guard table + version check</text>
    <text x="486" y="304" font-family="Inter, Arial, sans-serif" font-size="15" fill="#155e75">reject impossible transitions</text>
  </g>
  <path d="M742 258 C805 258, 808 168, 872 168" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow-undo-redo)"/>
  <g filter="url(#shadow-undo-redo)">
    <rect x="874" y="120" width="236" height="126" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="906" y="162" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#78350f">Effect runner</text>
    <text x="906" y="195" font-family="Inter, Arial, sans-serif" font-size="15" fill="#92400e">I/O, timers, storage</text>
    <text x="906" y="219" font-family="Inter, Arial, sans-serif" font-size="15" fill="#92400e">abort + settlement guard</text>
  </g>
  <path d="M742 304 C812 330, 812 438, 890 452" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow-undo-redo)"/>
  <g filter="url(#shadow-undo-redo)">
    <rect x="880" y="392" width="246" height="146" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="912" y="434" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#14532d">Snapshots</text>
    <text x="912" y="468" font-family="Inter, Arial, sans-serif" font-size="15" fill="#166534">selector notifications</text>
    <text x="912" y="492" font-family="Inter, Arial, sans-serif" font-size="15" fill="#166534">readonly versions</text>
    <text x="912" y="516" font-family="Inter, Arial, sans-serif" font-size="15" fill="#166534">metrics + debug trace</text>
  </g>
  <path d="M992 246 C1002 304, 1002 334, 992 392" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8" fill="none"/>
  <g>
    <rect x="154" y="478" width="626" height="86" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="184" y="512" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Internal structures</text>
    <text x="184" y="542" font-family="Inter, Arial, sans-serif" font-size="15" fill="#334155">undo stack, redo stack, command log, inverse patch, checkpoint, scope index, non-undoable barrier</text>
  </g>
  <path d="M458 350 C410 414, 330 446, 222 478" stroke="#2563eb" stroke-width="3" stroke-dasharray="10 8" fill="none" marker-end="url(#arrow-undo-redo)"/>
</svg>