<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">State Hydration / Rehydration System</text>

  <!-- SSR Hydration Flow -->
  <g>
    <text x="220" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">SSR Hydration Flow</text>

    <rect x="30" y="75" width="380" height="60" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="220" y="98" font-size="11" font-weight="bold" text-anchor="middle" fill="#581c87">1. Server: Fetch data + render HTML</text>
    <text x="220" y="116" font-size="10" text-anchor="middle" fill="#374151">Serialize state → embed in __NEXT_DATA__ or script tag</text>

    <path d="M 220 135 L 220 155" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#ahyd)"/>

    <rect x="30" y="155" width="380" height="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="220" y="178" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">2. Client receives HTML + JSON state</text>
    <text x="220" y="196" font-size="10" text-anchor="middle" fill="#374151">Browser parses HTML (visible immediately), downloads JS</text>

    <path d="M 220 215 L 220 235" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#ahyd)"/>

    <rect x="30" y="235" width="380" height="60" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="220" y="258" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">3. Rehydrate: Initialize store from server state</text>
    <text x="220" y="276" font-size="10" text-anchor="middle" fill="#374151">store.setState(JSON.parse(window.__SERVER_STATE__))</text>

    <path d="M 220 295 L 220 315" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#ahyd)"/>

    <rect x="30" y="315" width="380" height="60" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="220" y="338" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">4. React reconciles — attaches event handlers</text>
    <text x="220" y="356" font-size="10" text-anchor="middle" fill="#374151">DOM matches server HTML (no flash). Interactive.</text>

    <!-- Mismatch warning -->
    <rect x="30" y="390" width="380" height="75" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="220" y="413" font-size="11" font-weight="bold" text-anchor="middle" fill="#991b1b">Hydration Mismatch</text>
    <text x="45" y="435" font-size="10" fill="#374151">Server and client render different HTML → React throws warning</text>
    <text x="45" y="453" font-size="10" fill="#374151">Cause: Date.now(), Math.random(), localStorage in SSR</text>
    <text x="45" y="462" font-size="9" fill="#ef4444">Fix: suppressHydrationWarning or defer client-only rendering</text>
  </g>

  <!-- Persistence Rehydration -->
  <g>
    <text x="740" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Persistence Rehydration</text>

    <rect x="450" y="75" width="620" height="195" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="760" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">localStorage / SessionStorage Rehydration</text>
    <text x="465" y="122" font-size="10" fill="#374151">On app init: read persisted state, merge with defaults</text>
    <text x="465" y="140" font-size="10" fill="#374151">Zustand persist: auto serialize/deserialize with storage key</text>
    <text x="465" y="158" font-size="10" fill="#374151">Partial rehydration: pick specific slices (avoid stale auth)</text>
    <text x="465" y="176" font-size="10" fill="#374151">skipHydration: true → prevent SSR/client mismatch</text>
    <text x="465" y="194" font-size="10" fill="#374151">Version migration: stored state may be from old schema</text>
    <text x="465" y="212" font-size="10" fill="#374151">  version field + migrate() function in persist config</text>
    <text x="465" y="232" font-size="10" fill="#374151">Security: never persist sensitive data (tokens, passwords)</text>
    <text x="465" y="252" font-size="9" fill="#3b82f6">IndexedDB: use for large state (e.g., draft documents, offline queue)</text>

    <rect x="450" y="285" width="620" height="160" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="760" y="310" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">Schema Migration Strategy</text>
    <text x="465" y="332" font-size="10" fill="#374151">Store schema version alongside data</text>
    <text x="465" y="350" font-size="10" fill="#374151">migrations: {1: (v0) =&gt; v1, 2: (v1) =&gt; v2}</text>
    <text x="465" y="368" font-size="10" fill="#374151">Run migrations chain on rehydration if version mismatch</text>
    <text x="465" y="386" font-size="10" fill="#374151">Fallback: if migration fails → reset to defaults</text>
    <text x="465" y="404" font-size="10" fill="#374151">Test migrations: unit test each version transition</text>
    <text x="465" y="420" font-size="9" fill="#a855f7">Example: renamed field, restructured nested object, added required field</text>

    <rect x="450" y="460" width="620" height="90" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="760" y="483" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Rehydration Order</text>
    <text x="465" y="505" font-size="10" fill="#374151">1. Apply defaults (from store definition)</text>
    <text x="465" y="523" font-size="10" fill="#374151">2. Merge persisted state (overwrites matching keys)</text>
    <text x="465" y="540" font-size="9" fill="#10b981">3. Apply runtime overrides (URL params, feature flags). Order matters.</text>
  </g>

  <rect x="30" y="490" width="400" height="58" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="3"/>
  <text x="50" y="510" font-size="11" fill="#374151"><tspan font-weight="bold">SSR:</tspan> Server embeds state in HTML → client reads + initializes store before render.</text>
  <text x="50" y="528" font-size="11" fill="#374151"><tspan font-weight="bold">Persistence:</tspan> Version your schema. Migrate stale state. Skip hydrating sensitive slices.</text>
  <text x="50" y="543" font-size="9" fill="#6b7280">Libraries: Zustand persist, Redux Persist, TanStack Query (cache restore).</text>

  <defs>
    <marker id="ahyd" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/></marker>
  </defs>
</svg>
