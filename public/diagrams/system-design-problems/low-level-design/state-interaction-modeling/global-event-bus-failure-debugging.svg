<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">a Global Event Bus failure model</title>
  <desc id="desc">A failure and debugging flow showing stale events, rejected transitions, dead letters, rollback policy, and telemetry.</desc>
  <defs>
    <marker id="arrow2-global-event-bus" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#fff7ed"/>
  <rect x="42" y="40" width="1116" height="640" rx="24" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
  <text x="78" y="92" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#431407">a Global Event Bus: failure, rollback, and debugging</text>
  <text x="78" y="128" font-family="Inter, Arial, sans-serif" font-size="16" fill="#7c2d12">Principal-ready LLD names what can fail, where it is caught, and what evidence is kept.</text>
  <g>
    <path d="M130 220 C188 174, 264 182, 310 234 C356 286, 324 366, 242 382 C156 398, 90 340, 104 272 C108 250, 116 234, 130 220" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="146" y="252" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#7f1d1d">Unsafe input</text>
    <text x="138" y="286" font-family="Inter, Arial, sans-serif" font-size="15" fill="#991b1b">late event</text>
    <text x="138" y="312" font-family="Inter, Arial, sans-serif" font-size="15" fill="#991b1b">duplicate command</text>
    <text x="138" y="338" font-family="Inter, Arial, sans-serif" font-size="15" fill="#991b1b">invalid version</text>
  </g>
  <path d="M322 292 L456 292" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow2-global-event-bus)"/>
  <g>
    <rect x="458" y="190" width="262" height="204" rx="18" fill="#f3e8ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="490" y="232" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#4c1d95">Guard rail</text>
    <text x="490" y="266" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5b21b6">state + version check</text>
    <text x="490" y="292" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5b21b6">scope ownership check</text>
    <text x="490" y="318" font-family="Inter, Arial, sans-serif" font-size="15" fill="#5b21b6">effect safety check</text>
    <text x="490" y="354" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#4c1d95">Policy: ordered delivery per topic with at-least-once local dispatch and explicit dead-letter handling.</text>
  </g>
  <path d="M720 250 C798 210, 826 172, 898 168" stroke="#7c3aed" stroke-width="4" fill="none" marker-end="url(#arrow2-global-event-bus)"/>
  <g>
    <rect x="900" y="118" width="220" height="128" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <text x="932" y="160" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#075985">Recoverable</text>
    <text x="932" y="194" font-family="Inter, Arial, sans-serif" font-size="15" fill="#0369a1">retry or coalesce</text>
    <text x="932" y="218" font-family="Inter, Arial, sans-serif" font-size="15" fill="#0369a1">typed settlement</text>
  </g>
  <path d="M720 336 C800 380, 820 438, 898 460" stroke="#7c3aed" stroke-width="4" fill="none" marker-end="url(#arrow2-global-event-bus)"/>
  <g>
    <rect x="900" y="410" width="220" height="142" rx="18" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/>
    <text x="932" y="452" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#7f1d1d">Blocked</text>
    <text x="932" y="486" font-family="Inter, Arial, sans-serif" font-size="15" fill="#991b1b">dead letter or barrier</text>
    <text x="932" y="510" font-family="Inter, Arial, sans-serif" font-size="15" fill="#991b1b">manual conflict surface</text>
  </g>
  <g>
    <rect x="134" y="504" width="608" height="90" rx="18" fill="#ecfccb" stroke="#65a30d" stroke-width="3"/>
    <text x="164" y="538" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#365314">Incident evidence</text>
    <text x="164" y="568" font-family="Inter, Arial, sans-serif" font-size="15" fill="#3f6212">transition reason, prior snapshot, operation id, subscriber count, failure: handler exception, recursive publish loop, subscriber leak after unmount, unbounded replay buffer</text>
  </g>
  <path d="M586 394 C570 452, 518 486, 454 504" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 8" fill="none" marker-end="url(#arrow2-global-event-bus)"/>
</svg>