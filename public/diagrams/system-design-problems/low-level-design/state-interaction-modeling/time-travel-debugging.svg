<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Time-Travel Debugging System</text>

  <!-- State History Timeline -->
  <g>
    <text x="300" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">State History Timeline</text>

    <rect x="30" y="75" width="640" height="200" fill="#f9fafb" stroke="#d1d5db" stroke-width="2" rx="6"/>

    <!-- Timeline entries -->
    <rect x="50" y="95" width="110" height="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="105" y="117" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e40af">t=0 INIT</text>
    <text x="105" y="133" font-size="9" text-anchor="middle" fill="#374151">items:[]</text>
    <text x="105" y="148" font-size="9" text-anchor="middle" fill="#374151">total: 0</text>

    <path d="M 160 125 L 178 125" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#attD)"/>

    <rect x="180" y="95" width="110" height="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="235" y="117" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e40af">t=1 ADD_ITEM</text>
    <text x="235" y="133" font-size="9" text-anchor="middle" fill="#374151">items:[A]</text>
    <text x="235" y="148" font-size="9" text-anchor="middle" fill="#374151">total: 10</text>

    <path d="M 290 125 L 308 125" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#attD)"/>

    <rect x="310" y="95" width="110" height="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="365" y="117" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e40af">t=2 ADD_ITEM</text>
    <text x="365" y="133" font-size="9" text-anchor="middle" fill="#374151">items:[A,B]</text>
    <text x="365" y="148" font-size="9" text-anchor="middle" fill="#374151">total: 25</text>

    <path d="M 420 125 L 438 125" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#attD)"/>

    <!-- Current state highlighted -->
    <rect x="440" y="85" width="110" height="80" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="3"/>
    <text x="495" y="100" font-size="8" font-weight="bold" text-anchor="middle" fill="#92400e">← CURRENT</text>
    <text x="495" y="117" font-size="10" font-weight="bold" text-anchor="middle" fill="#92400e">t=3 REMOVE</text>
    <text x="495" y="133" font-size="9" text-anchor="middle" fill="#374151">items:[A]</text>
    <text x="495" y="148" font-size="9" text-anchor="middle" fill="#374151">total: 10</text>

    <path d="M 550 125 L 568 125" stroke="#d1d5db" stroke-width="2" fill="none" stroke-dasharray="4,2"/>

    <rect x="570" y="95" width="80" height="60" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1" rx="3"/>
    <text x="610" y="125" font-size="10" text-anchor="middle" fill="#9ca3af">future...</text>

    <!-- Time travel arrows -->
    <text x="340" y="185" font-size="11" font-weight="bold" text-anchor="middle" fill="#374151">Time Travel Controls</text>
    <rect x="50" y="195" width="100" height="30" fill="#dcfce7" stroke="#10b981" stroke-width="1" rx="3"/>
    <text x="100" y="215" font-size="10" font-weight="bold" text-anchor="middle" fill="#065f46">◀ Step Back</text>

    <rect x="165" y="195" width="100" height="30" fill="#dcfce7" stroke="#10b981" stroke-width="1" rx="3"/>
    <text x="215" y="215" font-size="10" font-weight="bold" text-anchor="middle" fill="#065f46">▶ Step Fwd</text>

    <rect x="280" y="195" width="110" height="30" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="335" y="215" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e40af">Jump to t=1</text>

    <rect x="405" y="195" width="100" height="30" fill="#fee2e2" stroke="#ef4444" stroke-width="1" rx="3"/>
    <text x="455" y="215" font-size="10" font-weight="bold" text-anchor="middle" fill="#991b1b">Reset to t=0</text>

    <rect x="520" y="195" width="130" height="30" fill="#f3e8ff" stroke="#a855f7" stroke-width="1" rx="3"/>
    <text x="585" y="215" font-size="10" font-weight="bold" text-anchor="middle" fill="#581c87">▶ Play (replay)</text>

    <text x="340" y="258" font-size="9" text-anchor="middle" fill="#6b7280">Scrubbing: drag timeline to jump to any historical state instantly</text>
  </g>

  <!-- Implementation -->
  <g>
    <text x="820" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Implementation</text>

    <rect x="700" y="75" width="370" height="195" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="885" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">State History Store</text>
    <text x="715" y="122" font-size="10" fill="#374151">past: State[]       ← previous states</text>
    <text x="715" y="140" font-size="10" fill="#374151">present: State      ← current state</text>
    <text x="715" y="158" font-size="10" fill="#374151">future: State[]     ← redo states</text>
    <text x="715" y="178" font-size="10" fill="#374151">cursor: number      ← index in history</text>
    <text x="715" y="200" font-size="11" font-weight="bold" fill="#374151">Reducer wrapper:</text>
    <text x="715" y="218" font-size="10" fill="#374151">  on action: push present to past</text>
    <text x="715" y="236" font-size="10" fill="#374151">  compute new present via reducer</text>
    <text x="715" y="254" font-size="9" fill="#3b82f6">Max history: slice past to last N (memory bound)</text>

    <rect x="700" y="285" width="370" height="160" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="885" y="310" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Action Log (DevTools)</text>
    <text x="715" y="332" font-size="10" fill="#374151">Log: [{action, prevState, nextState, time}]</text>
    <text x="715" y="350" font-size="10" fill="#374151">Inspect: diff prev vs next per action</text>
    <text x="715" y="368" font-size="10" fill="#374151">Skip action: replay log omitting target</text>
    <text x="715" y="386" font-size="10" fill="#374151">Import/Export: save + share state snapshots</text>
    <text x="715" y="404" font-size="10" fill="#374151">Filter: hide noisy actions (MOUSE_MOVE etc.)</text>
    <text x="715" y="422" font-size="9" fill="#10b981">Redux DevTools: industry standard time-travel UI</text>

    <rect x="700" y="460" width="370" height="90" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="885" y="483" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Production Considerations</text>
    <text x="715" y="505" font-size="10" fill="#374151">Limit history depth (50 states) to bound memory</text>
    <text x="715" y="523" font-size="10" fill="#374151">Strip in prod builds (dev-only feature)</text>
    <text x="715" y="537" font-size="9" fill="#f59e0b">Structural sharing (Immer) reduces snapshot memory overhead</text>
  </g>

  <!-- Use Cases -->
  <g>
    <text x="320" y="310" font-size="14" font-weight="bold" fill="#1a1a1a">Use Cases &amp; Applications</text>

    <rect x="30" y="325" width="640" height="155" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="350" y="350" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">Where Time-Travel Adds Value</text>
    <text x="45" y="372" font-size="10" fill="#374151">Debug: "What state caused this bug?" → step back to moment before</text>
    <text x="45" y="390" font-size="10" fill="#374151">Undo/Redo: time travel as user-facing feature (text editors, design tools)</text>
    <text x="45" y="408" font-size="10" fill="#374151">Replay: reproduce user sessions for bug reports</text>
    <text x="45" y="426" font-size="10" fill="#374151">Testing: snapshot-based testing of state transitions</text>
    <text x="45" y="444" font-size="10" fill="#374151">Demos: record interaction sequence, replay for demos</text>
    <text x="45" y="462" font-size="10" fill="#374151">Collaborative: show edit history, revert to version</text>
    <text x="45" y="476" font-size="9" fill="#a855f7">Redux DevTools, Zustand devtools, XState inspector — all support time-travel</text>
  </g>

  <defs>
    <marker id="attD" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/></marker>
  </defs>
</svg>
