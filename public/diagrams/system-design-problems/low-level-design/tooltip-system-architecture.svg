<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2563eb"/>
    </marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Tooltip System — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Position engine · Portal mount · Show/hide timing · Content &amp; A11y</text>

  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — POSITION ENGINE</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Placement Algorithm</text>
  <text x="34" y="133" font-size="9" fill="#374151">12 placements: top, bottom, left</text>
  <text x="34" y="148" font-size="9" fill="#374151">  right + -start, -end variants</text>
  <text x="34" y="163" font-size="9" fill="#374151">  + auto (best-fit detection)</text>
  <text x="34" y="178" font-size="9" fill="#374151">computePosition(trigger, tooltip)</text>
  <text x="34" y="193" font-size="9" fill="#374151">  getBoundingClientRect both els</text>
  <text x="34" y="208" font-size="9" fill="#374151">  offset: 8px gap from trigger</text>
  <text x="34" y="223" font-size="9" fill="#374151">  arrow: 6px triangle pointing in</text>
  <text x="34" y="240" font-size="9" fill="#374151">  result: { x, y, side, arrowOffset }</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Flip &amp; Shift</text>
  <text x="236" y="133" font-size="9" fill="#374151">flip(): detect viewport overflow</text>
  <text x="236" y="148" font-size="9" fill="#374151">  top clips → try bottom first</text>
  <text x="236" y="163" font-size="9" fill="#374151">  fallback order: all 12 placements</text>
  <text x="236" y="178" font-size="9" fill="#374151">shift(): slide along primary axis</text>
  <text x="236" y="193" font-size="9" fill="#374151">  keeps tooltip fully in viewport</text>
  <text x="236" y="208" font-size="9" fill="#374151">  padding: 8px from viewport edge</text>
  <text x="236" y="223" font-size="9" fill="#374151">Re-compute: on scroll + resize</text>
  <text x="236" y="240" font-size="9" fill="#374151">  ResizeObserver on trigger el</text>

  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — PORTAL MOUNT</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Portal Strategy</text>
  <text x="485" y="133" font-size="9" fill="#374151">Render to document.body portal</text>
  <text x="485" y="148" font-size="9" fill="#374151">  escapes overflow:hidden parents</text>
  <text x="485" y="163" font-size="9" fill="#374151">  avoids z-index stacking context</text>
  <text x="485" y="178" font-size="9" fill="#374151">position: fixed on tooltip element</text>
  <text x="485" y="193" font-size="9" fill="#374151">  left/top set from computePosition</text>
  <text x="485" y="208" font-size="9" fill="#374151">z-index: 9000 (above modals)</text>
  <text x="485" y="225" font-size="9" fill="#374151">Lazy mount: only when open=true</text>
  <text x="485" y="240" font-size="9" fill="#374151">  unmount on hide (keepMounted opt)</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Singleton vs Instance</text>
  <text x="682" y="133" font-size="9" fill="#374151">Singleton: one portal, swap content</text>
  <text x="682" y="148" font-size="9" fill="#374151">  fewer DOM nodes, faster hide</text>
  <text x="682" y="163" font-size="9" fill="#374151">  shared z-index management</text>
  <text x="682" y="178" font-size="9" fill="#374151">Instance: own portal per trigger</text>
  <text x="682" y="193" font-size="9" fill="#374151">  easier for interactive content</text>
  <text x="682" y="208" font-size="9" fill="#374151">Non-interactive only: use Tooltip</text>
  <text x="682" y="225" font-size="9" fill="#374151">Interactive: use Popover instead</text>
  <text x="682" y="240" font-size="9" fill="#374151">Max width: 250px word-wrap</text>

  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — SHOW / HIDE TIMING</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Timing Model</text>
  <text x="34" y="358" font-size="9" fill="#374151">openDelay: 400ms (no flicker)</text>
  <text x="34" y="373" font-size="9" fill="#374151">closeDelay: 100ms (grace period)</text>
  <text x="34" y="388" font-size="9" fill="#374151">  allows mouse to move into tooltip</text>
  <text x="34" y="403" font-size="9" fill="#374151">Trigger: mouseenter, focus</text>
  <text x="34" y="418" font-size="9" fill="#374151">Hide: mouseleave, blur, Escape</text>
  <text x="34" y="433" font-size="9" fill="#374151">  click outside if interactive</text>
  <text x="34" y="448" font-size="9" fill="#374151">Keyboard focus: instant open</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Animation</text>
  <text x="236" y="358" font-size="9" fill="#374151">Enter: opacity 0→1, scale 0.95→1</text>
  <text x="236" y="373" font-size="9" fill="#374151">  100ms ease-out</text>
  <text x="236" y="388" font-size="9" fill="#374151">Exit: opacity 1→0, 75ms ease-in</text>
  <text x="236" y="403" font-size="9" fill="#374151">  faster close feels snappier</text>
  <text x="236" y="418" font-size="9" fill="#374151">prefers-reduced-motion: skip anim</text>
  <text x="236" y="433" font-size="9" fill="#374151">CSS @keyframes tooltipIn/Out</text>
  <text x="236" y="448" font-size="9" fill="#374151">transform-origin: from arrow side</text>

  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — CONTENT &amp; ACCESSIBILITY</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">ARIA Pattern</text>
  <text x="485" y="358" font-size="9" fill="#374151">Trigger: aria-describedby={id}</text>
  <text x="485" y="373" font-size="9" fill="#374151">Tooltip: role="tooltip" id={id}</text>
  <text x="485" y="388" font-size="9" fill="#374151">  rendered even when hidden</text>
  <text x="485" y="403" font-size="9" fill="#374151">  visibility:hidden not display:none</text>
  <text x="485" y="418" font-size="9" fill="#374151">Touch: long-press 500ms to open</text>
  <text x="485" y="433" font-size="9" fill="#374151">  tap elsewhere to close</text>
  <text x="485" y="448" font-size="9" fill="#374151">No interactive content in tooltip</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Edge Cases</text>
  <text x="682" y="358" font-size="9" fill="#374151">Content: string | ReactNode</text>
  <text x="682" y="373" font-size="9" fill="#374151">  rich content: use Popover</text>
  <text x="682" y="388" font-size="9" fill="#374151">Disabled trigger: wrap in span</text>
  <text x="682" y="403" font-size="9" fill="#374151">  disabled el ignores events</text>
  <text x="682" y="418" font-size="9" fill="#374151">Long content: max-w-[250px] wrap</text>
  <text x="682" y="433" font-size="9" fill="#374151">Virtual trigger: manual open/close</text>
  <text x="682" y="448" font-size="9" fill="#374151">  ref + imperative API</text>

  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>

  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">12 placements + auto best-fit</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Flip: viewport overflow detection</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Show delay: 400ms / hide: 100ms</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Hide grace: 100ms cursor entry</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">z-index: 9000 above modals</text>
</svg>
