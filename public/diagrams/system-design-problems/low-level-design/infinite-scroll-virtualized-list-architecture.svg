<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Infinite Scroll / Virtualised List — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Scroll state · Sentinel observer · Window buffer · Network retry &amp; anchor</text>
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — SCROLL STATE</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">VirtualListState</text>
  <text x="34" y="133" font-size="9" fill="#374151">items: Item[] (all loaded)</text>
  <text x="34" y="148" font-size="9" fill="#374151">scrollTop: number</text>
  <text x="34" y="163" font-size="9" fill="#374151">containerHeight: number</text>
  <text x="34" y="178" font-size="9" fill="#374151">totalHeight: items × rowH</text>
  <text x="34" y="193" font-size="9" fill="#374151">startIndex: first visible row</text>
  <text x="34" y="208" font-size="9" fill="#374151">endIndex: last visible row</text>
  <text x="34" y="223" font-size="9" fill="#374151">  + overscan above/below</text>
  <text x="34" y="240" font-size="9" fill="#374151">isLoadingMore: boolean</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Row Positioning</text>
  <text x="236" y="133" font-size="9" fill="#374151">rowHeight: 60px fixed default</text>
  <text x="236" y="148" font-size="9" fill="#374151">  variable: measure + Map cache</text>
  <text x="236" y="163" font-size="9" fill="#374151">Spacer top: startIndex × rowH</text>
  <text x="236" y="178" font-size="9" fill="#374151">  translateY rows into position</text>
  <text x="236" y="193" font-size="9" fill="#374151">Spacer bottom: remaining rows</text>
  <text x="236" y="208" font-size="9" fill="#374151">position: absolute inside outer</text>
  <text x="236" y="223" font-size="9" fill="#374151">  outer: relative + overflow-y</text>
  <text x="236" y="240" font-size="9" fill="#374151">will-change: transform perf</text>
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — SENTINEL OBSERVER</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Intersection Trigger</text>
  <text x="485" y="133" font-size="9" fill="#374151">Sentinel: div at end of list</text>
  <text x="485" y="148" font-size="9" fill="#374151">  rootMargin: "200px" ahead</text>
  <text x="485" y="163" font-size="9" fill="#374151">IntersectionObserver fires:</text>
  <text x="485" y="178" font-size="9" fill="#374151">  → fetch next page</text>
  <text x="485" y="193" font-size="9" fill="#374151">Disconnect: when no more pages</text>
  <text x="485" y="208" font-size="9" fill="#374151">  hasNextPage: false</text>
  <text x="485" y="225" font-size="9" fill="#374151">Throttle: one fetch at a time</text>
  <text x="485" y="240" font-size="9" fill="#374151">  guard with isLoadingMore</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Cursor Pagination</text>
  <text x="682" y="133" font-size="9" fill="#374151">cursor: opaque string from API</text>
  <text x="682" y="148" font-size="9" fill="#374151">  passed as ?after=cursor</text>
  <text x="682" y="163" font-size="9" fill="#374151">Response: { items, nextCursor }</text>
  <text x="682" y="178" font-size="9" fill="#374151">  nextCursor=null → end</text>
  <text x="682" y="193" font-size="9" fill="#374151">Append: items.push(...newItems)</text>
  <text x="682" y="208" font-size="9" fill="#374151">Page size: 20 items default</text>
  <text x="682" y="225" font-size="9" fill="#374151">De-dup: check id before push</text>
  <text x="682" y="240" font-size="9" fill="#374151">  WS push may duplicate</text>
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — WINDOW BUFFER</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Render Window</text>
  <text x="34" y="358" font-size="9" fill="#374151">overscan: 5 rows above / below</text>
  <text x="34" y="373" font-size="9" fill="#374151">  prevents flash on fast scroll</text>
  <text x="34" y="388" font-size="9" fill="#374151">Rendered: [start-5, end+5]</text>
  <text x="34" y="403" font-size="9" fill="#374151">  rest are unmounted (or cached)</text>
  <text x="34" y="418" font-size="9" fill="#374151">Dynamic rows: ResizeObserver</text>
  <text x="34" y="433" font-size="9" fill="#374151">  update height cache on change</text>
  <text x="34" y="448" font-size="9" fill="#374151">  recalc startIndex + totalH</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Scroll Anchor</text>
  <text x="236" y="358" font-size="9" fill="#374151">Problem: new items shift view</text>
  <text x="236" y="373" font-size="9" fill="#374151">  on prepend (live feed)</text>
  <text x="236" y="388" font-size="9" fill="#374151">Anchor: record scroll target item</text>
  <text x="236" y="403" font-size="9" fill="#374151">  after insert: restore position</text>
  <text x="236" y="418" font-size="9" fill="#374151">CSS: overflow-anchor: auto</text>
  <text x="236" y="433" font-size="9" fill="#374151">  native browser anchor</text>
  <text x="236" y="448" font-size="9" fill="#374151">Manual: scrollTop += diffHeight</text>
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — NETWORK RETRY &amp; UX</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Error &amp; Retry</text>
  <text x="485" y="358" font-size="9" fill="#374151">Retry: 3 attempts on fetch fail</text>
  <text x="485" y="373" font-size="9" fill="#374151">  exponential: 1s, 2s, 4s</text>
  <text x="485" y="388" font-size="9" fill="#374151">Error state: "Load more" button</text>
  <text x="485" y="403" font-size="9" fill="#374151">  replaces sentinel on fail</text>
  <text x="485" y="418" font-size="9" fill="#374151">Network offline: queue retries</text>
  <text x="485" y="433" font-size="9" fill="#374151">  resume on navigator.onLine</text>
  <text x="485" y="448" font-size="9" fill="#374151">Stale data: pull-to-refresh</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Loading UX</text>
  <text x="682" y="358" font-size="9" fill="#374151">Initial: full skeleton rows</text>
  <text x="682" y="373" font-size="9" fill="#374151">Load more: bottom spinner</text>
  <text x="682" y="388" font-size="9" fill="#374151">Empty: "No items" placeholder</text>
  <text x="682" y="403" font-size="9" fill="#374151">End of list: "All caught up" msg</text>
  <text x="682" y="418" font-size="9" fill="#374151">aria-live: announce new count</text>
  <text x="682" y="433" font-size="9" fill="#374151">  "10 more items loaded"</text>
  <text x="682" y="448" font-size="9" fill="#374151">Scroll to top: after refresh</text>
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Overscan: 5 rows above/below</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Sentinel margin: 200px ahead</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Page size: 20 items default</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Retry backoff: 1s → 2s → 4s</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Anchor: overflow-anchor or manual</text>
</svg>
