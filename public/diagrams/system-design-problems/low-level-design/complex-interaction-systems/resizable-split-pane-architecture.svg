<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Resizable Split Pane — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Pane sizes · Divider drag · Constraints · Persist &amp; A11y</text>
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — PANE SIZE MODEL</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">SplitPaneProps</text>
  <text x="34" y="133" font-size="9" fill="#374151">direction: horizontal|vertical</text>
  <text x="34" y="148" font-size="9" fill="#374151">sizes: number[] (% per pane)</text>
  <text x="34" y="163" font-size="9" fill="#374151">defaultSizes: number[]</text>
  <text x="34" y="178" font-size="9" fill="#374151">minSize: number | number[] (px)</text>
  <text x="34" y="193" font-size="9" fill="#374151">maxSize: number | number[] (px)</text>
  <text x="34" y="208" font-size="9" fill="#374151">onResize(sizes): void</text>
  <text x="34" y="223" font-size="9" fill="#374151">onResizeEnd(sizes): void</text>
  <text x="34" y="240" font-size="9" fill="#374151">gutterSize: number (px, default 4)</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Size Calculation</text>
  <text x="236" y="133" font-size="9" fill="#374151">sizes stored as fractions (0–1)</text>
  <text x="236" y="148" font-size="9" fill="#374151">  must sum to 1.0</text>
  <text x="236" y="163" font-size="9" fill="#374151">Render: flex-basis = size * 100%</text>
  <text x="236" y="178" font-size="9" fill="#374151">  or width/height direct CSS</text>
  <text x="236" y="193" font-size="9" fill="#374151">Gutter: flex-shrink: 0 always</text>
  <text x="236" y="208" font-size="9" fill="#374151">Panes: overflow hidden prevents</text>
  <text x="236" y="223" font-size="9" fill="#374151">  content overflow on resize</text>
  <text x="236" y="240" font-size="9" fill="#374151">box-sizing: border-box enforced</text>
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — DIVIDER DRAG</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Drag Logic</text>
  <text x="485" y="133" font-size="9" fill="#374151">pointerdown on gutter: capture ptr</text>
  <text x="485" y="148" font-size="9" fill="#374151">  record startPos + startSizes</text>
  <text x="485" y="163" font-size="9" fill="#374151">pointermove: compute delta</text>
  <text x="485" y="178" font-size="9" fill="#374151">  delta = currentPos - startPos</text>
  <text x="485" y="193" font-size="9" fill="#374151">  adjust adjacent panes ± delta</text>
  <text x="485" y="208" font-size="9" fill="#374151">  clamp to minSize / maxSize</text>
  <text x="485" y="225" font-size="9" fill="#374151">pointerup: commit + persist sizes</text>
  <text x="485" y="240" font-size="9" fill="#374151">cursor: col-resize or row-resize</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Gutter UX</text>
  <text x="682" y="133" font-size="9" fill="#374151">Gutter: 4px wide, 12px hit area</text>
  <text x="682" y="148" font-size="9" fill="#374151">  transparent overlay while drag</text>
  <text x="682" y="163" font-size="9" fill="#374151">Hover: highlight gutter darker</text>
  <text x="682" y="178" font-size="9" fill="#374151">user-select: none during drag</text>
  <text x="682" y="193" font-size="9" fill="#374151">iframe overlay: prevent ptr loss</text>
  <text x="682" y="208" font-size="9" fill="#374151">  fixed overlay covers iframes</text>
  <text x="682" y="225" font-size="9" fill="#374151">Double-click: equalize all panes</text>
  <text x="682" y="240" font-size="9" fill="#374151">  reset to defaultSizes</text>
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — CONSTRAINTS &amp; COLLAPSE</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Size Constraints</text>
  <text x="34" y="358" font-size="9" fill="#374151">minSize: default 50px per pane</text>
  <text x="34" y="373" font-size="9" fill="#374151">maxSize: optional per-pane cap</text>
  <text x="34" y="388" font-size="9" fill="#374151">Clamp: newSize = max(min, val)</text>
  <text x="34" y="403" font-size="9" fill="#374151">  steal from next pane if needed</text>
  <text x="34" y="418" font-size="9" fill="#374151">Adjacent pane compensates delta</text>
  <text x="34" y="433" font-size="9" fill="#374151">  chain clamp through all panes</text>
  <text x="34" y="448" font-size="9" fill="#374151">Total always sums to container</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Collapse Behaviour</text>
  <text x="236" y="358" font-size="9" fill="#374151">collapseThreshold: 30px default</text>
  <text x="236" y="373" font-size="9" fill="#374151">  drag below → snap to 0</text>
  <text x="236" y="388" font-size="9" fill="#374151">collapsedSize: 0 or iconified px</text>
  <text x="236" y="403" font-size="9" fill="#374151">Expand: click collapse indicator</text>
  <text x="236" y="418" font-size="9" fill="#374151">  restore to last non-zero size</text>
  <text x="236" y="433" font-size="9" fill="#374151">onCollapse / onExpand callbacks</text>
  <text x="236" y="448" font-size="9" fill="#374151">Animation: 150ms ease on collapse</text>
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — PERSIST &amp; ACCESSIBILITY</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Persistence</text>
  <text x="485" y="358" font-size="9" fill="#374151">storageKey: localStorage save</text>
  <text x="485" y="373" font-size="9" fill="#374151">  value: JSON sizes array</text>
  <text x="485" y="388" font-size="9" fill="#374151">Save: onResizeEnd (not every frame)</text>
  <text x="485" y="403" font-size="9" fill="#374151">Restore: read on mount if key set</text>
  <text x="485" y="418" font-size="9" fill="#374151">  validate: sum + min bounds check</text>
  <text x="485" y="433" font-size="9" fill="#374151">  fallback to defaultSizes if invalid</text>
  <text x="485" y="448" font-size="9" fill="#374151">SSR safe: typeof window check</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Accessibility</text>
  <text x="682" y="358" font-size="9" fill="#374151">Gutter: role="separator"</text>
  <text x="682" y="373" font-size="9" fill="#374151">  aria-orientation: h|v</text>
  <text x="682" y="388" font-size="9" fill="#374151">  aria-valuenow: % of left pane</text>
  <text x="682" y="403" font-size="9" fill="#374151">  aria-valuemin=0 aria-valuemax=100</text>
  <text x="682" y="418" font-size="9" fill="#374151">Keyboard: ← → resize (or ↑ ↓)</text>
  <text x="682" y="433" font-size="9" fill="#374151">  step: 1% / Shift = 10%</text>
  <text x="682" y="448" font-size="9" fill="#374151">tabIndex=0 on gutter for focus</text>
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Min pane: 50px default</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Collapse threshold: 30px snap</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Persist: localStorage on resize-end</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">ARIA: role=separator, valuenow=%</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Keyboard: 1% step / Shift=10%</text>
</svg>
