<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <!-- Title -->
  <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Snap-to-Grid & Alignment Guides System
  </text>

  <!-- Section 1: Grid Snapping -->
  <g>
    <text x="150" y="70" font-size="14" font-weight="bold" fill="#1a1a1a">Grid Snapping (8px Grid)</text>

    <!-- Canvas with grid -->
    <rect x="50" y="90" width="200" height="180" fill="#ffffff" stroke="#ccc" stroke-width="2"/>

    <!-- Grid pattern -->
    <g stroke="#e5e7eb" stroke-width="1">
      <line x1="50" y1="98" x2="250" y2="98"/>
      <line x1="50" y1="106" x2="250" y2="106"/>
      <line x1="50" y1="114" x2="250" y2="114"/>
      <line x1="50" y1="122" x2="250" y2="122"/>
      <line x1="50" y1="130" x2="250" y2="130"/>
      <line x1="50" y1="138" x2="250" y2="138"/>
      <line x1="50" y1="146" x2="250" y2="146"/>
      <line x1="50" y1="154" x2="250" y2="154"/>
      <line x1="58" y1="90" x2="58" y2="270"/>
      <line x1="66" y1="90" x2="66" y2="270"/>
      <line x1="74" y1="90" x2="74" y2="270"/>
      <line x1="82" y1="90" x2="82" y2="270"/>
      <line x1="90" y1="90" x2="90" y2="270"/>
      <line x1="98" y1="90" x2="98" y2="270"/>
      <line x1="106" y1="90" x2="106" y2="270"/>
      <line x1="114" y1="90" x2="114" y2="270"/>
      <line x1="122" y1="90" x2="122" y2="270"/>
      <line x1="130" y1="90" x2="130" y2="270"/>
      <line x1="138" y1="90" x2="138" y2="270"/>
      <line x1="146" y1="90" x2="146" y2="270"/>
      <line x1="154" y1="90" x2="154" y2="270"/>
      <line x1="162" y1="90" x2="162" y2="270"/>
      <line x1="170" y1="90" x2="170" y2="270"/>
      <line x1="178" y1="90" x2="178" y2="270"/>
      <line x1="186" y1="90" x2="186" y2="270"/>
      <line x1="194" y1="90" x2="194" y2="270"/>
      <line x1="202" y1="90" x2="202" y2="270"/>
      <line x1="210" y1="90" x2="210" y2="270"/>
      <line x1="218" y1="90" x2="218" y2="270"/>
      <line x1="226" y1="90" x2="226" y2="270"/>
      <line x1="234" y1="90" x2="234" y2="270"/>
      <line x1="242" y1="90" x2="242" y2="270"/>
    </g>

    <!-- Element snapped to grid -->
    <rect x="98" y="130" width="40" height="40" fill="#3b82f6" fill-opacity="0.7" stroke="#1e40af" stroke-width="2"/>
    <text x="118" y="158" font-size="10" text-anchor="middle" fill="white" font-weight="bold">A</text>

    <text x="150" y="290" font-size="11" text-anchor="middle" fill="#374151">Position: (98px, 130px)</text>
    <text x="150" y="305" font-size="11" text-anchor="middle" fill="#374151">Snapped to 8px grid</text>
  </g>

  <!-- Section 2: Alignment Guides -->
  <g>
    <text x="450" y="70" font-size="14" font-weight="bold" fill="#1a1a1a">Alignment Guides</text>

    <!-- Canvas -->
    <rect x="350" y="90" width="200" height="180" fill="#ffffff" stroke="#ccc" stroke-width="2"/>

    <!-- Reference objects -->
    <rect x="360" y="110" width="35" height="35" fill="#10b981" fill-opacity="0.6" stroke="#059669" stroke-width="2"/>
    <text x="377.5" y="133" font-size="9" text-anchor="middle" fill="white" font-weight="bold">B</text>

    <rect x="410" y="150" width="35" height="35" fill="#f59e0b" fill-opacity="0.6" stroke="#d97706" stroke-width="2"/>
    <text x="427.5" y="173" font-size="9" text-anchor="middle" fill="white" font-weight="bold">C</text>

    <!-- Dragged object with guides -->
    <rect x="460" y="110" width="35" height="35" fill="#3b82f6" fill-opacity="0.7" stroke="#1e40af" stroke-width="2"/>
    <text x="477.5" y="133" font-size="9" text-anchor="middle" fill="white" font-weight="bold">D</text>

    <!-- Alignment guides (vertical and horizontal) -->
    <line x1="395" y1="90" x2="395" y2="270" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="397" y="285" font-size="10" fill="#ef4444" font-weight="bold">Left align</text>

    <line x1="350" y1="147" x2="550" y2="147" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="360" y="300" font-size="10" fill="#10b981" font-weight="bold">Center align</text>
  </g>

  <!-- Section 3: Equal Spacing Detection -->
  <g>
    <text x="750" y="70" font-size="14" font-weight="bold" fill="#1a1a1a">Equal Spacing Detection</text>

    <!-- Canvas -->
    <rect x="650" y="90" width="200" height="180" fill="#ffffff" stroke="#ccc" stroke-width="2"/>

    <!-- Three objects in a row with equal spacing -->
    <rect x="665" y="130" width="25" height="25" fill="#8b5cf6" fill-opacity="0.6" stroke="#6d28d9" stroke-width="2"/>
    <text x="677.5" y="148" font-size="9" text-anchor="middle" fill="white" font-weight="bold">E</text>

    <rect x="710" y="130" width="25" height="25" fill="#8b5cf6" fill-opacity="0.6" stroke="#6d28d9" stroke-width="2"/>
    <text x="722.5" y="148" font-size="9" text-anchor="middle" fill="white" font-weight="bold">F</text>

    <rect x="755" y="130" width="25" height="25" fill="#8b5cf6" fill-opacity="0.6" stroke="#6d28d9" stroke-width="2"/>
    <text x="767.5" y="148" font-size="9" text-anchor="middle" fill="white" font-weight="bold">G</text>

    <!-- Spacing indicators -->
    <line x1="690" y1="165" x2="710" y2="165" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="690" y1="160" x2="690" y2="170" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="710" y1="160" x2="710" y2="170" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="700" y="182" font-size="10" text-anchor="middle" fill="#06b6d4">45px</text>

    <line x1="735" y1="165" x2="755" y2="165" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="735" y1="160" x2="735" y2="170" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="755" y1="160" x2="755" y2="170" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="745" y="182" font-size="10" text-anchor="middle" fill="#06b6d4">45px</text>

    <text x="750" y="210" font-size="11" text-anchor="middle" fill="#374151">Equal spacing detected:</text>
    <text x="750" y="225" font-size="11" text-anchor="middle" fill="#374151">45px gaps</text>
  </g>

  <!-- Bottom: Snap Threshold Visualization -->
  <g>
    <text x="250" y="380" font-size="14" font-weight="bold" fill="#1a1a1a">Snap Threshold Zones</text>

    <!-- Grid with snap zones -->
    <rect x="50" y="400" width="400" height="150" fill="#ffffff" stroke="#ccc" stroke-width="2"/>

    <!-- Grid lines -->
    <line x1="50" y1="425" x2="450" y2="425" stroke="#ddd" stroke-width="1"/>
    <line x1="50" y1="450" x2="450" y2="450" stroke="#ddd" stroke-width="1"/>
    <line x1="50" y1="475" x2="450" y2="475" stroke="#ddd" stroke-width="1"/>
    <line x1="150" y1="400" x2="150" y2="550" stroke="#ddd" stroke-width="1"/>
    <line x1="250" y1="400" x2="250" y2="550" stroke="#ddd" stroke-width="1"/>
    <line x1="350" y1="400" x2="350" y2="550" stroke="#ddd" stroke-width="1"/>

    <!-- Snap threshold zones (shaded areas around grid lines) -->
    <rect x="140" y="400" width="20" height="150" fill="#3b82f6" fill-opacity="0.1"/>
    <rect x="240" y="400" width="20" height="150" fill="#3b82f6" fill-opacity="0.1"/>
    <rect x="50" y="415" width="400" height="20" fill="#3b82f6" fill-opacity="0.1"/>
    <rect x="50" y="440" width="400" height="20" fill="#3b82f6" fill-opacity="0.1"/>
    <rect x="50" y="465" width="400" height="20" fill="#3b82f6" fill-opacity="0.1"/>

    <!-- Grid snap lines -->
    <line x1="150" y1="400" x2="150" y2="550" stroke="#1e40af" stroke-width="2"/>
    <line x1="250" y1="400" x2="250" y2="550" stroke="#1e40af" stroke-width="2"/>
    <line x1="350" y1="400" x2="350" y2="550" stroke="#1e40af" stroke-width="2"/>

    <!-- Labels -->
    <text x="160" y="470" font-size="10" fill="#1e40af" font-weight="bold">10px</text>
    <text x="160" y="485" font-size="10" fill="#1e40af" font-weight="bold">threshold</text>
  </g>

  <!-- Right: Snap History -->
  <g>
    <text x="750" y="380" font-size="14" font-weight="bold" fill="#1a1a1a">Snap Priority Ranking</text>

    <rect x="650" y="400" width="300" height="150" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" rx="4"/>

    <text x="670" y="425" font-size="12" fill="#374151" font-weight="bold">1. Grid Snap</text>
    <text x="690" y="443" font-size="11" fill="#6b7280">(Weakest priority)</text>

    <text x="670" y="465" font-size="12" fill="#374151" font-weight="bold">2. Edge Alignment</text>
    <text x="690" y="483" font-size="11" fill="#6b7280">(Left/Right/Top/Bottom)</text>

    <text x="670" y="505" font-size="12" fill="#374151" font-weight="bold">3. Center Alignment</text>
    <text x="690" y="523" font-size="11" fill="#6b7280">(Strongest priority)</text>
  </g>

  <!-- Legend -->
  <g>
    <rect x="50" y="520" width="900" height="60" fill="#f0fdf4" stroke="#86efac" stroke-width="1" rx="4"/>
    <text x="70" y="542" font-size="12" fill="#1a1a1a" font-weight="bold">Snap Behavior:</text>
    <text x="70" y="562" font-size="11" fill="#374151">
      When dragging element within snap threshold (10px) of grid line or other object edge/center, element snaps to that position.
      Hold Shift to disable snapping. Guides highlight alignment opportunities.
    </text>
  </g>
</svg>