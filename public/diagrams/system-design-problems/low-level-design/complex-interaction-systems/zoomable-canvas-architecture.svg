<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Zoomable Canvas: Transform Model &amp; Rendering Architecture</text>

  <!-- Transform Model -->
  <g>
    <text x="200" y="65" font-size="14" font-weight="bold" fill="#1a1a1a">Viewport Transform</text>

    <rect x="30" y="80" width="340" height="200" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="200" y="105" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Matrix Transform (CSS / Canvas)</text>
    <text x="45" y="130" font-size="11" fill="#374151">transform: translate(tx, ty) scale(s)</text>
    <text x="45" y="150" font-size="10" fill="#374151">or: matrix(s, 0, 0, s, tx, ty)</text>
    <text x="45" y="172" font-size="11" font-weight="bold" fill="#1e40af">State:</text>
    <text x="45" y="190" font-size="10" fill="#374151">  zoom: number   // scale factor (0.1 → 5.0)</text>
    <text x="45" y="207" font-size="10" fill="#374151">  offsetX: number // pan in canvas coords</text>
    <text x="45" y="224" font-size="10" fill="#374151">  offsetY: number // pan in canvas coords</text>
    <text x="45" y="247" font-size="9" fill="#3b82f6">Apply to single container div — children transform for free</text>

    <!-- Coordinate conversion -->
    <rect x="30" y="295" width="340" height="120" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="200" y="318" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Coordinate Conversion</text>
    <text x="45" y="340" font-size="10" fill="#374151">screenToCanvas(sx, sy):</text>
    <text x="45" y="357" font-size="10" fill="#374151">  cx = (sx - offsetX) / zoom</text>
    <text x="45" y="374" font-size="10" fill="#374151">  cy = (sy - offsetY) / zoom</text>
    <text x="45" y="393" font-size="10" fill="#374151">canvasToScreen(cx, cy):</text>
    <text x="45" y="410" font-size="10" fill="#374151">  sx = cx * zoom + offsetX</text>
  </g>

  <!-- Layer Architecture -->
  <g>
    <text x="570" y="65" font-size="14" font-weight="bold" fill="#1a1a1a">Layer Architecture</text>

    <rect x="400" y="80" width="300" height="340" fill="#f9fafb" stroke="#d1d5db" stroke-width="2" rx="6"/>

    <!-- Background grid layer -->
    <rect x="415" y="100" width="270" height="55" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" rx="3"/>
    <text x="550" y="122" font-size="11" font-weight="bold" text-anchor="middle" fill="#374151">Background / Grid Layer</text>
    <text x="550" y="140" font-size="10" text-anchor="middle" fill="#6b7280">SVG or Canvas — static dots/lines</text>

    <!-- Content layer -->
    <rect x="415" y="170" width="270" height="70" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="3"/>
    <text x="550" y="195" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">Content Layer (transformed)</text>
    <text x="550" y="213" font-size="10" text-anchor="middle" fill="#374151">Nodes, edges, shapes — all items</text>
    <text x="550" y="228" font-size="10" text-anchor="middle" fill="#374151">translateX/Y + scale applied here</text>

    <!-- Selection/Guide layer -->
    <rect x="415" y="255" width="270" height="55" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="3"/>
    <text x="550" y="277" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">Selection / Guide Layer</text>
    <text x="550" y="295" font-size="10" text-anchor="middle" fill="#374151">Overlays, handles, alignment guides</text>

    <!-- HUD layer -->
    <rect x="415" y="325" width="270" height="55" fill="#dcfce7" stroke="#10b981" stroke-width="1" rx="3"/>
    <text x="550" y="347" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">HUD Layer (fixed position)</text>
    <text x="550" y="365" font-size="10" text-anchor="middle" fill="#374151">Zoom %, toolbar — NO transform</text>

    <text x="550" y="408" font-size="9" fill="#6b7280" text-anchor="middle">Layers stack via z-index, absolute positioning</text>
  </g>

  <!-- Performance & Culling -->
  <g>
    <text x="890" y="65" font-size="14" font-weight="bold" fill="#1a1a1a">Rendering &amp; Performance</text>

    <rect x="730" y="80" width="330" height="160" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="895" y="105" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">Viewport Culling</text>
    <text x="745" y="128" font-size="10" fill="#374151">Compute visible rect in canvas coords:</text>
    <text x="745" y="146" font-size="10" fill="#374151">  left = -offsetX / zoom</text>
    <text x="745" y="163" font-size="10" fill="#374151">  right = (vpW - offsetX) / zoom</text>
    <text x="745" y="180" font-size="10" fill="#374151">  top/bottom = similar</text>
    <text x="745" y="197" font-size="10" fill="#374151">Only render nodes intersecting visible rect</text>
    <text x="745" y="215" font-size="10" fill="#374151">Quadtree / R-tree for O(log n) lookup</text>
    <text x="745" y="232" font-size="9" fill="#a855f7">Critical for 10k+ node performance</text>

    <rect x="730" y="260" width="330" height="120" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="895" y="285" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Level of Detail (LOD)</text>
    <text x="745" y="308" font-size="10" fill="#374151">zoom &lt; 0.3: show simplified shapes</text>
    <text x="745" y="325" font-size="10" fill="#374151">zoom 0.3–1.0: standard rendering</text>
    <text x="745" y="342" font-size="10" fill="#374151">zoom &gt; 1.0: show full detail + text</text>
    <text x="745" y="360" font-size="10" fill="#374151">Labels hidden at very low zoom levels</text>
    <text x="745" y="374" font-size="9" fill="#f59e0b">Prevents text clutter and overdraw at scale</text>

    <rect x="730" y="400" width="330" height="110" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="895" y="425" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Smooth Interaction</text>
    <text x="745" y="448" font-size="10" fill="#374151">wheel → requestAnimationFrame batching</text>
    <text x="745" y="465" font-size="10" fill="#374151">CSS transform (GPU layer, no layout)</text>
    <text x="745" y="482" font-size="10" fill="#374151">Pointer capture: setPointerCapture(id)</text>
    <text x="745" y="496" font-size="9" fill="#ef4444">60fps target — avoid getBoundingClientRect in hot path</text>
  </g>

  <!-- Summary bar -->
  <rect x="30" y="520" width="1040" height="48" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="3"/>
  <text x="50" y="540" font-size="11" fill="#374151"><tspan font-weight="bold">State:</tspan> {zoom, offsetX, offsetY} — single source of truth. <tspan font-weight="bold">Zoom toward cursor:</tspan> adjust offset so canvas point under cursor stays fixed.</text>
  <text x="50" y="558" font-size="11" fill="#374151"><tspan font-weight="bold">Libraries:</tspan> react-flow, konva.js, d3-zoom, pixi.js. For custom: use CSS transform on container + pointer events.</text>
</svg>
