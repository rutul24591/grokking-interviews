<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Stepper / Progress Tracker — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Step state · Validation gate · Navigation rules · URL sync &amp; guards</text>
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — STEP STATE MODEL</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">StepperState</text>
  <text x="34" y="133" font-size="9" fill="#374151">currentStep: number (0-indexed)</text>
  <text x="34" y="148" font-size="9" fill="#374151">totalSteps: number</text>
  <text x="34" y="163" font-size="9" fill="#374151">steps[]: { id, label, status }</text>
  <text x="34" y="178" font-size="9" fill="#374151">  status: pending|active|complete</text>
  <text x="34" y="193" font-size="9" fill="#374151">  |error|skipped</text>
  <text x="34" y="208" font-size="9" fill="#374151">stepData: Record&lt;id, FormData&gt;</text>
  <text x="34" y="223" font-size="9" fill="#374151">isLinear: boolean</text>
  <text x="34" y="240" font-size="9" fill="#374151">allowSkip: boolean per step</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">StepperProps</text>
  <text x="236" y="133" font-size="9" fill="#374151">steps: StepConfig[]</text>
  <text x="236" y="148" font-size="9" fill="#374151">activeStep: number (controlled)</text>
  <text x="236" y="163" font-size="9" fill="#374151">onStepChange(step): void</text>
  <text x="236" y="178" font-size="9" fill="#374151">onComplete(allData): void</text>
  <text x="236" y="193" font-size="9" fill="#374151">orientation: horizontal|vertical</text>
  <text x="236" y="208" font-size="9" fill="#374151">variant: default|dots|numbered</text>
  <text x="236" y="223" font-size="9" fill="#374151">connector: line|dashed|none</text>
  <text x="236" y="240" font-size="9" fill="#374151">completedIcon: ReactNode slot</text>
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — VALIDATION GATE</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Step Validation</text>
  <text x="485" y="133" font-size="9" fill="#374151">validate(stepData): Promise&lt;bool&gt;</text>
  <text x="485" y="148" font-size="9" fill="#374151">  called on Next click</text>
  <text x="485" y="163" font-size="9" fill="#374151">Sync validators run first</text>
  <text x="485" y="178" font-size="9" fill="#374151">  async validators: max 5000ms</text>
  <text x="485" y="193" font-size="9" fill="#374151">  timeout → show error state</text>
  <text x="485" y="208" font-size="9" fill="#374151">Error pinned to step header</text>
  <text x="485" y="225" font-size="9" fill="#374151">  step status → 'error'</text>
  <text x="485" y="240" font-size="9" fill="#374151">isLoading: spinner on Next btn</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Navigation Rules</text>
  <text x="682" y="133" font-size="9" fill="#374151">Linear: Next only if valid</text>
  <text x="682" y="148" font-size="9" fill="#374151">  Previous always allowed</text>
  <text x="682" y="163" font-size="9" fill="#374151">Non-linear: click any step</text>
  <text x="682" y="178" font-size="9" fill="#374151">  completed steps freely jump</text>
  <text x="682" y="193" font-size="9" fill="#374151">  future steps gated by rule</text>
  <text x="682" y="208" font-size="9" fill="#374151">canGoBack: optional override fn</text>
  <text x="682" y="225" font-size="9" fill="#374151">Back preserves step form data</text>
  <text x="682" y="240" font-size="9" fill="#374151">  no re-validation on backward</text>
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — VISUAL &amp; TRANSITION</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Step Indicator</text>
  <text x="34" y="358" font-size="9" fill="#374151">Circle: pending=grey border</text>
  <text x="34" y="373" font-size="9" fill="#374151">  active=brand fill+number</text>
  <text x="34" y="388" font-size="9" fill="#374151">  complete=checkmark icon</text>
  <text x="34" y="403" font-size="9" fill="#374151">  error=X icon red fill</text>
  <text x="34" y="418" font-size="9" fill="#374151">Connector: width fills on advance</text>
  <text x="34" y="433" font-size="9" fill="#374151">  transition: width 300ms ease</text>
  <text x="34" y="448" font-size="9" fill="#374151">Label: below/right of circle</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Content Panel</text>
  <text x="236" y="358" font-size="9" fill="#374151">Slide in: translateX 100%→0</text>
  <text x="236" y="373" font-size="9" fill="#374151">  backward: translateX -100%→0</text>
  <text x="236" y="388" font-size="9" fill="#374151">Duration: 250ms ease-out</text>
  <text x="236" y="403" font-size="9" fill="#374151">prefers-reduced-motion: instant</text>
  <text x="236" y="418" font-size="9" fill="#374151">Panel: fixed height or auto</text>
  <text x="236" y="433" font-size="9" fill="#374151">  overflow: hidden during anim</text>
  <text x="236" y="448" font-size="9" fill="#374151">Focus: first input in new step</text>
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — URL SYNC &amp; UNSAVED GUARD</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">URL Sync</text>
  <text x="485" y="358" font-size="9" fill="#374151">?step=2 query param</text>
  <text x="485" y="373" font-size="9" fill="#374151">  replaceState on advance</text>
  <text x="485" y="388" font-size="9" fill="#374151">On mount: restore from URL</text>
  <text x="485" y="403" font-size="9" fill="#374151">  validate restored step index</text>
  <text x="485" y="418" font-size="9" fill="#374151">  clamp to [0, totalSteps-1]</text>
  <text x="485" y="433" font-size="9" fill="#374151">Hash: #step-{id} for deep link</text>
  <text x="485" y="448" font-size="9" fill="#374151">SSR: skip window access</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Navigation Guard &amp; A11y</text>
  <text x="682" y="358" font-size="9" fill="#374151">Unsaved guard: beforeunload</text>
  <text x="682" y="373" font-size="9" fill="#374151">  isDirty flag per step</text>
  <text x="682" y="388" font-size="9" fill="#374151">  confirm dialog on navigate</text>
  <text x="682" y="403" font-size="9" fill="#374151">role="tablist" on indicator bar</text>
  <text x="682" y="418" font-size="9" fill="#374151">role="tab" aria-selected each step</text>
  <text x="682" y="433" font-size="9" fill="#374151">aria-label: "Step 2 of 5: Address"</text>
  <text x="682" y="448" font-size="9" fill="#374151">Keyboard: ← → between steps</text>
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Async validate: max 5000ms</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Backward: no re-validation</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Unsaved guard: beforeunload</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">URL param: ?step=N</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">ARIA: role=tablist, aria-selected</text>
</svg>
