<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">History Timeline UI: Architecture &amp; Grouping Strategy</text>

  <!-- Timeline Visual -->
  <g>
    <text x="200" y="65" font-size="14" font-weight="bold" fill="#1a1a1a">Timeline Layout</text>
    <!-- Vertical line -->
    <line x1="120" y1="80" x2="120" y2="460" stroke="#d1d5db" stroke-width="3"/>

    <!-- Group: Today -->
    <rect x="30" y="80" width="80" height="28" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="70" y="99" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">Today</text>

    <circle cx="120" cy="130" r="8" fill="#3b82f6" stroke="white" stroke-width="2"/>
    <rect x="140" y="110" width="240" height="50" fill="white" stroke="#e2e8f0" stroke-width="1" rx="4"/>
    <text x="155" y="130" font-size="11" font-weight="bold" fill="#1a1a1a">Edited document title</text>
    <text x="155" y="148" font-size="10" fill="#6b7280">Alice · 2:34 PM · Title changed</text>

    <circle cx="120" cy="195" r="8" fill="#10b981" stroke="white" stroke-width="2"/>
    <rect x="140" y="175" width="240" height="50" fill="white" stroke="#e2e8f0" stroke-width="1" rx="4"/>
    <text x="155" y="195" font-size="11" font-weight="bold" fill="#1a1a1a">Comment added</text>
    <text x="155" y="213" font-size="10" fill="#6b7280">Bob · 11:12 AM · Section 3</text>

    <!-- Group: Yesterday -->
    <rect x="30" y="255" width="80" height="28" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="3"/>
    <text x="70" y="274" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">Yesterday</text>

    <circle cx="120" cy="315" r="8" fill="#f59e0b" stroke="white" stroke-width="2"/>
    <rect x="140" y="295" width="240" height="50" fill="white" stroke="#e2e8f0" stroke-width="1" rx="4"/>
    <text x="155" y="315" font-size="11" font-weight="bold" fill="#1a1a1a">Section deleted</text>
    <text x="155" y="333" font-size="10" fill="#6b7280">Carol · 4:00 PM · Section 2</text>

    <circle cx="120" cy="380" r="8" fill="#ef4444" stroke="white" stroke-width="2"/>
    <rect x="140" y="360" width="240" height="50" fill="white" stroke="#e2e8f0" stroke-width="1" rx="4"/>
    <text x="155" y="380" font-size="11" font-weight="bold" fill="#1a1a1a">Document created</text>
    <text x="155" y="398" font-size="10" fill="#6b7280">Dan · 9:00 AM · Initial version</text>

    <!-- Legend -->
    <circle cx="40" cy="440" r="6" fill="#3b82f6"/>
    <text x="52" y="445" font-size="10" fill="#374151">Edit</text>
    <circle cx="85" cy="440" r="6" fill="#10b981"/>
    <text x="97" y="445" font-size="10" fill="#374151">Comment</text>
    <circle cx="150" cy="440" r="6" fill="#f59e0b"/>
    <text x="162" y="445" font-size="10" fill="#374151">Delete</text>
    <circle cx="210" cy="440" r="6" fill="#ef4444"/>
    <text x="222" y="445" font-size="10" fill="#374151">Create</text>
  </g>

  <!-- Data Architecture -->
  <g>
    <text x="700" y="65" font-size="14" font-weight="bold" fill="#1a1a1a">Data Architecture</text>

    <!-- Flat events array -->
    <rect x="460" y="80" width="260" height="130" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" rx="4"/>
    <text x="590" y="103" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Flat Events Array</text>
    <text x="475" y="125" font-size="10" fill="#374151">[{id, timestamp, type,</text>
    <text x="475" y="142" font-size="10" fill="#374151">  author, description},</text>
    <text x="475" y="159" font-size="10" fill="#374151"> {id, timestamp, ...},</text>
    <text x="475" y="176" font-size="10" fill="#374151"> ...]</text>
    <text x="475" y="197" font-size="9" fill="#6b7280">Sorted descending by timestamp</text>

    <!-- Arrow down -->
    <path d="M 590 210 L 590 250" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arrowgray)"/>
    <text x="600" y="234" font-size="10" fill="#6b7280">groupBy(date)</text>

    <!-- Grouped structure -->
    <rect x="460" y="250" width="260" height="150" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="590" y="273" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Grouped Map</text>
    <text x="475" y="295" font-size="10" fill="#374151">"Today" → [event1,</text>
    <text x="475" y="312" font-size="10" fill="#374151">            event2]</text>
    <text x="475" y="329" font-size="10" fill="#374151">"Yesterday" → [event3,</text>
    <text x="475" y="346" font-size="10" fill="#374151">               event4]</text>
    <text x="475" y="363" font-size="10" fill="#374151">"Last week" → [...]</text>
    <text x="475" y="390" font-size="9" fill="#1e40af">O(1) render per group header</text>

    <!-- Pagination -->
    <rect x="460" y="420" width="260" height="80" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="590" y="445" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Cursor Pagination</text>
    <text x="475" y="465" font-size="10" fill="#374151">First load: 50 events</text>
    <text x="475" y="482" font-size="10" fill="#374151">Scroll to end → fetch next 50</text>
    <text x="475" y="499" font-size="10" fill="#374151">cursor = last event timestamp</text>

    <!-- Filters -->
    <rect x="760" y="80" width="280" height="200" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="900" y="103" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">Filter System</text>
    <text x="775" y="128" font-size="11" font-weight="bold" fill="#374151">Filter by Type:</text>
    <text x="775" y="146" font-size="10" fill="#374151">☑ Edits  ☑ Comments</text>
    <text x="775" y="162" font-size="10" fill="#374151">☑ Creates  ☐ Deletes</text>
    <text x="775" y="185" font-size="11" font-weight="bold" fill="#374151">Filter by User:</text>
    <text x="775" y="203" font-size="10" fill="#374151">Alice, Bob, Carol...</text>
    <text x="775" y="225" font-size="11" font-weight="bold" fill="#374151">Date Range:</text>
    <text x="775" y="243" font-size="10" fill="#374151">May 1 → May 7</text>
    <text x="775" y="265" font-size="9" fill="#a855f7">Under 1k: client-side filter</text>

    <!-- Virtualization -->
    <rect x="760" y="300" width="280" height="120" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="900" y="323" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Virtualization</text>
    <text x="775" y="345" font-size="10" fill="#374151">Only render visible items</text>
    <text x="775" y="362" font-size="10" fill="#374151">Overscan: 5 items above/below</text>
    <text x="775" y="379" font-size="10" fill="#374151">ResizeObserver: dynamic heights</text>
    <text x="775" y="396" font-size="10" fill="#374151">Height cache for scroll accuracy</text>
    <text x="775" y="413" font-size="9" fill="#f59e0b">Handles 10k+ events smoothly</text>
  </g>

  <defs>
    <marker id="arrowgray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
