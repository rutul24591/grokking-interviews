<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Kanban Board: Data Flow &amp; State Management</text>

  <!-- Columns -->
  <g>
    <!-- Todo Column -->
    <rect x="30" y="60" width="230" height="380" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="6"/>
    <rect x="30" y="60" width="230" height="44" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="6"/>
    <text x="145" y="87" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e40af">To Do  (3)</text>
    <rect x="42" y="116" width="206" height="70" fill="white" stroke="#e2e8f0" stroke-width="1" rx="4"/>
    <text x="55" y="138" font-size="11" font-weight="bold" fill="#1a1a1a">Design login flow</text>
    <text x="55" y="155" font-size="10" fill="#6b7280">Priority: High</text>
    <text x="55" y="170" font-size="10" fill="#6b7280">Assignee: Alice</text>
    <rect x="42" y="196" width="206" height="70" fill="white" stroke="#e2e8f0" stroke-width="1" rx="4"/>
    <text x="55" y="218" font-size="11" font-weight="bold" fill="#1a1a1a">Write unit tests</text>
    <text x="55" y="235" font-size="10" fill="#6b7280">Priority: Medium</text>
    <text x="55" y="250" font-size="10" fill="#6b7280">Assignee: Bob</text>
    <rect x="42" y="276" width="206" height="70" fill="white" stroke="#e2e8f0" stroke-width="1" rx="4"/>
    <text x="55" y="298" font-size="11" font-weight="bold" fill="#1a1a1a">Update docs</text>
    <text x="55" y="315" font-size="10" fill="#6b7280">Priority: Low</text>
    <text x="55" y="330" font-size="10" fill="#6b7280">Assignee: Carol</text>

    <!-- In Progress Column -->
    <rect x="290" y="60" width="230" height="380" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="6"/>
    <rect x="290" y="60" width="230" height="44" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="6"/>
    <text x="405" y="87" font-size="13" font-weight="bold" text-anchor="middle" fill="#92400e">In Progress  (2)</text>
    <rect x="302" y="116" width="206" height="70" fill="white" stroke="#e2e8f0" stroke-width="1" rx="4"/>
    <text x="315" y="138" font-size="11" font-weight="bold" fill="#1a1a1a">Build API layer</text>
    <text x="315" y="155" font-size="10" fill="#6b7280">Priority: High</text>
    <text x="315" y="170" font-size="10" fill="#6b7280">Assignee: Dan</text>
    <rect x="302" y="196" width="206" height="70" fill="white" stroke="#e2e8f0" stroke-width="1" rx="4"/>
    <text x="315" y="218" font-size="11" font-weight="bold" fill="#1a1a1a">Fix auth bug</text>
    <text x="315" y="235" font-size="10" fill="#6b7280">Priority: Critical</text>
    <text x="315" y="250" font-size="10" fill="#6b7280">Assignee: Eve</text>

    <!-- Review Column -->
    <rect x="550" y="60" width="230" height="380" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="6"/>
    <rect x="550" y="60" width="230" height="44" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="6"/>
    <text x="665" y="87" font-size="13" font-weight="bold" text-anchor="middle" fill="#581c87">Review  (1)</text>
    <rect x="562" y="116" width="206" height="70" fill="white" stroke="#e2e8f0" stroke-width="1" rx="4"/>
    <text x="575" y="138" font-size="11" font-weight="bold" fill="#1a1a1a">Checkout page</text>
    <text x="575" y="155" font-size="10" fill="#6b7280">Priority: High</text>
    <text x="575" y="170" font-size="10" fill="#6b7280">Reviewer: Frank</text>

    <!-- Done Column -->
    <rect x="810" y="60" width="230" height="380" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" rx="6"/>
    <rect x="810" y="60" width="230" height="44" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="6"/>
    <text x="925" y="87" font-size="13" font-weight="bold" text-anchor="middle" fill="#065f46">Done  (2)</text>
    <rect x="822" y="116" width="206" height="70" fill="white" stroke="#e2e8f0" stroke-width="1" rx="4"/>
    <text x="835" y="138" font-size="11" font-weight="bold" fill="#1a1a1a">Setup CI/CD</text>
    <text x="835" y="155" font-size="10" fill="#6b7280">Completed: May 5</text>
    <text x="835" y="170" font-size="10" fill="#6b7280">Assignee: Grace</text>
    <rect x="822" y="196" width="206" height="70" fill="white" stroke="#e2e8f0" stroke-width="1" rx="4"/>
    <text x="835" y="218" font-size="11" font-weight="bold" fill="#1a1a1a">Database schema</text>
    <text x="835" y="235" font-size="10" fill="#6b7280">Completed: May 4</text>
    <text x="835" y="250" font-size="10" fill="#6b7280">Assignee: Henry</text>

    <!-- Drag arrow -->
    <path d="M 248 156 L 288 156" stroke="#f59e0b" stroke-width="2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
    <text x="268" y="148" font-size="9" text-anchor="middle" fill="#f59e0b">drag</text>
  </g>

  <!-- State Machine -->
  <g>
    <text x="550" y="480" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Card Move State: Optimistic Update + Server Sync</text>
    <rect x="30" y="500" width="1040" height="80" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="4"/>
    <text x="50" y="525" font-size="11" fill="#374151"><tspan font-weight="bold">1. Drag start:</tspan> Record source column + index. Set dragging=true. Show drop zones.</text>
    <text x="50" y="545" font-size="11" fill="#374151"><tspan font-weight="bold">2. Drop:</tspan> Optimistically move card in local state. Send PATCH /cards/:id {columnId, position} to server.</text>
    <text x="50" y="565" font-size="11" fill="#374151"><tspan font-weight="bold">3. Server fail:</tspan> Rollback card to source column+index. Show toast error. <tspan font-weight="bold">Server success:</tspan> Confirm new state.</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/>
    </marker>
  </defs>
</svg>
