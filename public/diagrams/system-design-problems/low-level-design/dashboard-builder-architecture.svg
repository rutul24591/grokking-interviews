<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Dashboard Builder — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Widget registry · Grid placement · Resize constraints · Data &amp; persistence</text>
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — WIDGET REGISTRY</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">WidgetDefinition</text>
  <text x="34" y="133" font-size="9" fill="#374151">type: string (unique key)</text>
  <text x="34" y="148" font-size="9" fill="#374151">component: React.ComponentType</text>
  <text x="34" y="163" font-size="9" fill="#374151">defaultW: number (grid cols)</text>
  <text x="34" y="178" font-size="9" fill="#374151">defaultH: number (grid rows)</text>
  <text x="34" y="193" font-size="9" fill="#374151">minW / maxW: col constraints</text>
  <text x="34" y="208" font-size="9" fill="#374151">minH / maxH: row constraints</text>
  <text x="34" y="223" font-size="9" fill="#374151">configSchema: JSONSchema</text>
  <text x="34" y="240" font-size="9" fill="#374151">icon, label, category</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Registry &amp; Lifecycle</text>
  <text x="236" y="133" font-size="9" fill="#374151">registerWidget(def): void</text>
  <text x="236" y="148" font-size="9" fill="#374151">  keyed by def.type</text>
  <text x="236" y="163" font-size="9" fill="#374151">getWidget(type): WidgetDef</text>
  <text x="236" y="178" font-size="9" fill="#374151">Dynamic: lazy(() =&gt; import())</text>
  <text x="236" y="193" font-size="9" fill="#374151">  bundle split per widget type</text>
  <text x="236" y="208" font-size="9" fill="#374151">Error boundary wraps each</text>
  <text x="236" y="223" font-size="9" fill="#374151">  isolate widget crash</text>
  <text x="236" y="240" font-size="9" fill="#374151">Suspense: skeleton on load</text>
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — GRID PLACEMENT</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Grid Layout Model</text>
  <text x="485" y="133" font-size="9" fill="#374151">cols: 12 default (CSS grid)</text>
  <text x="485" y="148" font-size="9" fill="#374151">rowHeight: 80px default</text>
  <text x="485" y="163" font-size="9" fill="#374151">gap: 8px between cells</text>
  <text x="485" y="178" font-size="9" fill="#374151">LayoutItem: { i, x, y, w, h }</text>
  <text x="485" y="193" font-size="9" fill="#374151">  i=widget instance id</text>
  <text x="485" y="208" font-size="9" fill="#374151">Collision: push down (compact)</text>
  <text x="485" y="225" font-size="9" fill="#374151">  or swap (free-form mode)</text>
  <text x="485" y="240" font-size="9" fill="#374151">Breakpoints: lg/md/sm/xs</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Drag &amp; Resize</text>
  <text x="682" y="133" font-size="9" fill="#374151">Drag: pointerdown on header</text>
  <text x="682" y="148" font-size="9" fill="#374151">  ghost clone follows pointer</text>
  <text x="682" y="163" font-size="9" fill="#374151">  grid snaps to nearest cell</text>
  <text x="682" y="178" font-size="9" fill="#374151">Resize handle: SE corner</text>
  <text x="682" y="193" font-size="9" fill="#374151">  clamp to minW/minH</text>
  <text x="682" y="208" font-size="9" fill="#374151">Drop preview: blue outline</text>
  <text x="682" y="225" font-size="9" fill="#374151">  invalid zone: red outline</text>
  <text x="682" y="240" font-size="9" fill="#374151">onLayoutChange(layout): void</text>
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — RESIZE CONSTRAINTS</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Constraint Enforcement</text>
  <text x="34" y="358" font-size="9" fill="#374151">minW: 1 col, minH: 1 row</text>
  <text x="34" y="373" font-size="9" fill="#374151">maxW: grid cols (full width)</text>
  <text x="34" y="388" font-size="9" fill="#374151">Aspect ratio lock: optional</text>
  <text x="34" y="403" font-size="9" fill="#374151">  chart widgets: fixed ratio</text>
  <text x="34" y="418" font-size="9" fill="#374151">Static items: isDraggable=false</text>
  <text x="34" y="433" font-size="9" fill="#374151">  isResizable=false flag</text>
  <text x="34" y="448" font-size="9" fill="#374151">Out of bounds: reject placement</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Responsive Layouts</text>
  <text x="236" y="358" font-size="9" fill="#374151">layouts: { lg, md, sm, xs }</text>
  <text x="236" y="373" font-size="9" fill="#374151">  each breakpoint: LayoutItem[]</text>
  <text x="236" y="388" font-size="9" fill="#374151">Derive smaller from larger</text>
  <text x="236" y="403" font-size="9" fill="#374151">  if no explicit smaller layout</text>
  <text x="236" y="418" font-size="9" fill="#374151">Width: ResizeObserver on wrap</text>
  <text x="236" y="433" font-size="9" fill="#374151">  select active breakpoint</text>
  <text x="236" y="448" font-size="9" fill="#374151">Mobile: stack vertically always</text>
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — DATA &amp; PERSISTENCE</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Widget Data Fetching</text>
  <text x="485" y="358" font-size="9" fill="#374151">Each widget: own data hook</text>
  <text x="485" y="373" font-size="9" fill="#374151">  useWidgetData(config, refresh)</text>
  <text x="485" y="388" font-size="9" fill="#374151">Refresh interval: per widget</text>
  <text x="485" y="403" font-size="9" fill="#374151">  default 30s polling</text>
  <text x="485" y="418" font-size="9" fill="#374151">Lazy: only visible widgets fetch</text>
  <text x="485" y="433" font-size="9" fill="#374151">  IntersectionObserver gate</text>
  <text x="485" y="448" font-size="9" fill="#374151">Global loading bar on any fetch</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Persist &amp; Share</text>
  <text x="682" y="358" font-size="9" fill="#374151">storageKey: localStorage JSON</text>
  <text x="682" y="373" font-size="9" fill="#374151">  save: { layouts, widgets[] }</text>
  <text x="682" y="388" font-size="9" fill="#374151">Debounce: 500ms after change</text>
  <text x="682" y="403" font-size="9" fill="#374151">Server: PUT /dashboard on idle</text>
  <text x="682" y="418" font-size="9" fill="#374151">Export: JSON download button</text>
  <text x="682" y="433" font-size="9" fill="#374151">Import: JSON file upload</text>
  <text x="682" y="448" font-size="9" fill="#374151">Share: URL-encoded layout state</text>
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Grid: 12 cols, 80px row height</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Min widget: 1×1 cell</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Breakpoints: lg/md/sm/xs</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Lazy load: IntersectionObserver</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Persist: localStorage debounce 500ms</text>
</svg>
