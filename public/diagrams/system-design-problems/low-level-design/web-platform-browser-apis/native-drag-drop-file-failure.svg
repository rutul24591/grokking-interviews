<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" role="img" aria-label="Native Drag Drop File: edge-case recovery">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#0f766e"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#c2410c"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#be123c"/></marker>
  </defs>
  <rect x="18" y="18" width="924" height="524" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="54" y="56" font-size="18" font-weight="700" fill="#172033">Native Drag Drop File: edge-case recovery</text>
  <text x="54" y="78" font-size="11.5" fill="#526074">Stale work, dependency failure, rollback, cleanup, and evidence are explicit state transitions.</text>
  <rect x="48" y="110" width="864" height="340" rx="9" fill="#fff1f2" stroke="#be123c" stroke-width="1.1"/>
  <text x="68" y="133" font-size="12.5" font-weight="700" fill="#be123c">EDGE CASE AND RECOVERY DECISIONS</text><rect x="84" y="160" width="174" height="78" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="98" y="185" font-size="12" font-weight="700" fill="#172033">late / duplicate work</text><text x="98" y="208" font-size="10.5" fill="#526074">hit testing</text><text x="98" y="225" font-size="10.5" fill="#526074">stale generation</text><rect x="84" y="286" width="174" height="78" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
  <text x="98" y="311" font-size="12" font-weight="700" fill="#172033">dependency failure</text><text x="98" y="334" font-size="10.5" fill="#526074">drop policy</text><text x="98" y="351" font-size="10.5" fill="#526074">timeout or denial</text><path d="M382 180 L426 214 L382 248 L338 214 Z" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="382" y="218" text-anchor="middle" font-size="10.5" font-weight="700" fill="#172033">still current?</text><path d="M382 306 L426 340 L382 374 L338 340 Z" fill="#fff1f2" stroke="#be123c" stroke-width="1.5"/>
  <text x="382" y="344" text-anchor="middle" font-size="10.5" font-weight="700" fill="#172033">retry safe?</text><rect x="514" y="164" width="164" height="72" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="528" y="189" font-size="12" font-weight="700" fill="#172033">commit guarded</text><text x="528" y="212" font-size="10.5" fill="#526074">reorder commit</text><text x="528" y="229" font-size="10.5" fill="#526074">notify view</text><rect x="514" y="290" width="164" height="72" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
  <text x="528" y="315" font-size="12" font-weight="700" fill="#172033">contain failure</text><text x="528" y="338" font-size="10.5" fill="#526074">retain stable state</text><text x="528" y="355" font-size="10.5" fill="#526074">degrade visibly</text><rect x="744" y="226" width="146" height="86" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="758" y="251" font-size="12" font-weight="700" fill="#172033">evidence</text><text x="758" y="274" font-size="10.5" fill="#526074">reason code</text><text x="758" y="291" font-size="10.5" fill="#526074">attempt + age</text><text x="758" y="308" font-size="10.5" fill="#526074">cleanup proof</text><line x1="258" y1="199" x2="330" y2="199" stroke="#be123c" stroke-width="2.4" marker-end="url(#arrow-rose)"/><line x1="426" y1="214" x2="506" y2="200" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arrow-teal)"/><line x1="258" y1="325" x2="330" y2="325" stroke="#c2410c" stroke-width="2.4" marker-end="url(#arrow-orange)"/><line x1="426" y1="340" x2="506" y2="326" stroke="#be123c" stroke-width="2.4" marker-end="url(#arrow-rose)"/><line x1="678" y1="200" x2="736" y2="252" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arrow-teal)"/><line x1="678" y1="326" x2="736" y2="286" stroke="#c2410c" stroke-width="2.4" marker-end="url(#arrow-orange)"/><text x="82" y="420" font-size="10.5" fill="#172033">Rollback target: last committed state. Never let completion order silently become business order.</text>
  <text x="82" y="442" font-size="10.5" fill="#172033">User-visible fallback must explain whether the action was ignored, queued, retried, or requires review.</text>
</svg>
