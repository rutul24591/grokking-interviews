<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" role="img" aria-label="Component Library System: lifecycle swimlanes">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#0f766e"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#c2410c"/></marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#be123c"/></marker>
  </defs>
  <rect x="18" y="18" width="924" height="524" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="54" y="56" font-size="18" font-weight="700" fill="#172033">Component Library System: lifecycle swimlanes</text>
  <text x="54" y="78" font-size="11.5" fill="#526074">State transitions, async effects, guarded commit, cancellation, and cleanup are separated.</text>
  <rect x="48" y="104" width="864" height="94" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.1"/>
  <text x="68" y="127" font-size="12.5" font-weight="700" fill="#2563eb">EVENT LANE</text><rect x="80" y="136" width="160" height="44" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="94" y="161" font-size="12" font-weight="700" fill="#172033">user intent</text><rect x="326" y="136" width="160" height="44" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="340" y="161" font-size="12" font-weight="700" fill="#172033">typed state</text><line x1="240" y1="158" x2="318" y2="158" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/><rect x="48" y="214" width="864" height="94" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="1.1"/>
  <text x="68" y="237" font-size="12.5" font-weight="700" fill="#c2410c">EFFECT LANE</text><rect x="228" y="246" width="160" height="44" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.4"/>
  <text x="242" y="271" font-size="12" font-weight="700" fill="#172033">derived projection</text><rect x="550" y="246" width="160" height="44" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="564" y="271" font-size="12" font-weight="700" fill="#172033">effect boundary</text><line x1="388" y1="268" x2="542" y2="268" stroke="#c2410c" stroke-width="2.4" marker-end="url(#arrow-orange)"/><rect x="48" y="324" width="864" height="118" rx="9" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.1"/>
  <text x="68" y="347" font-size="12.5" font-weight="700" fill="#0f766e">COMMIT AND CLEANUP LANE</text><rect x="360" y="364" width="160" height="52" rx="8" fill="#fff1f2" stroke="#be123c" stroke-width="1.4"/>
  <text x="374" y="389" font-size="12" font-weight="700" fill="#172033">commit guard</text><text x="374" y="412" font-size="10.5" fill="#526074">validate current scope</text><rect x="696" y="364" width="160" height="52" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="710" y="389" font-size="12" font-weight="700" fill="#172033">visible result</text><text x="710" y="412" font-size="10.5" fill="#526074">release resources</text><line x1="520" y1="390" x2="688" y2="390" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arrow-teal)"/><line x1="408" y1="180" x2="294" y2="238" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-blue)"/><line x1="630" y1="290" x2="440" y2="356" stroke="#c2410c" stroke-width="2.4" marker-end="url(#arrow-orange)"/><path d="M776 364 C856 306, 846 164, 494 158" fill="none" stroke="#be123c" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-rose)"/>
  <text x="724" y="320" font-size="10.5" font-weight="700" fill="#be123c">cancel / supersede</text>
  <text x="72" y="482" font-size="11" fill="#172033">Each async boundary carries generation, owner, cancellation, deadline, and trace context.</text>
</svg>
