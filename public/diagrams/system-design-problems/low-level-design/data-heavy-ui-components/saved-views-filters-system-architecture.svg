<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Saved Views / Filters System — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Filter model · View store · URL sync · Sharing &amp; defaults</text>

  <!-- Section A: purple, top-left -->
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — FILTER MODEL</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">FilterDef</text>
  <text x="34" y="133" font-size="9" fill="#374151">field: string</text>
  <text x="34" y="148" font-size="9" fill="#374151">op: eq|ne|gt|lt|in|contains</text>
  <text x="34" y="163" font-size="9" fill="#374151">value: any</text>
  <text x="34" y="178" font-size="9" fill="#374151">label: string</text>
  <text x="34" y="193" font-size="9" fill="#374151">type: text|number|date|select</text>
  <text x="34" y="208" font-size="9" fill="#374151">negate: boolean (NOT)</text>
  <text x="34" y="223" font-size="9" fill="#374151">group: AND|OR combinator</text>
  <text x="34" y="240" font-size="9" fill="#374151">between: [low, high] tuple</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">FilterState</text>
  <text x="236" y="133" font-size="9" fill="#374151">active: FilterDef[]</text>
  <text x="236" y="148" font-size="9" fill="#374151">sort: {field, dir}</text>
  <text x="236" y="163" font-size="9" fill="#374151">pageSize: number</text>
  <text x="236" y="178" font-size="9" fill="#374151">derived: visible rows</text>
  <text x="236" y="193" font-size="9" fill="#374151">apply(filters, data): rows[]</text>
  <text x="236" y="208" font-size="9" fill="#374151">count: filtered vs total</text>
  <text x="236" y="223" font-size="9" fill="#374151">dirty: unsaved filter changes</text>
  <text x="236" y="240" font-size="9" fill="#374151">activeViewId: string|null</text>

  <!-- Section B: blue, top-right -->
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — FILTER UI</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Filter Bar</text>
  <text x="485" y="133" font-size="9" fill="#374151">add: field picker + op + value</text>
  <text x="485" y="148" font-size="9" fill="#374151">chip per active filter: label + ×</text>
  <text x="485" y="163" font-size="9" fill="#374151">clear all button</text>
  <text x="485" y="178" font-size="9" fill="#374151">filter count badge</text>
  <text x="485" y="193" font-size="9" fill="#374151">pill click: edit filter inline</text>
  <text x="485" y="208" font-size="9" fill="#374151">drag reorder filter chips</text>
  <text x="485" y="223" font-size="9" fill="#374151">collapse: hide bar if 0 filters</text>
  <text x="485" y="240" font-size="9" fill="#374151">keyboard: add via search+enter</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Advanced Panel</text>
  <text x="682" y="133" font-size="9" fill="#374151">range: dual slider or date range</text>
  <text x="682" y="148" font-size="9" fill="#374151">multi: checkbox list + search</text>
  <text x="682" y="163" font-size="9" fill="#374151">preset: Today/Last7d/Month</text>
  <text x="682" y="178" font-size="9" fill="#374151">custom: freeform input</text>
  <text x="682" y="193" font-size="9" fill="#374151">apply: close + activate</text>
  <text x="682" y="208" font-size="9" fill="#374151">reset: revert to open state</text>
  <text x="682" y="223" font-size="9" fill="#374151">preview: count matching rows</text>
  <text x="682" y="240" font-size="9" fill="#374151">save: shortcut to SavedView</text>

  <!-- Arrow A→B -->
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Section C: green, bottom-left -->
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — VIEW PERSISTENCE</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">SavedView Model</text>
  <text x="34" y="358" font-size="9" fill="#374151">{id, name, filters, sort, cols}</text>
  <text x="34" y="373" font-size="9" fill="#374151">isDefault: boolean</text>
  <text x="34" y="388" font-size="9" fill="#374151">POST /views</text>
  <text x="34" y="403" font-size="9" fill="#374151">GET /views?userId</text>
  <text x="34" y="418" font-size="9" fill="#374151">PUT /views/:id</text>
  <text x="34" y="433" font-size="9" fill="#374151">DELETE /views/:id</text>
  <text x="34" y="448" font-size="9" fill="#374151">owner: userId for access ctrl</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Load / Apply</text>
  <text x="236" y="358" font-size="9" fill="#374151">select: apply filters+sort+cols</text>
  <text x="236" y="373" font-size="9" fill="#374151">set as default: flag isDefault</text>
  <text x="236" y="388" font-size="9" fill="#374151">share: link with viewId param</text>
  <text x="236" y="403" font-size="9" fill="#374151">import: paste JSON filters</text>
  <text x="236" y="418" font-size="9" fill="#374151">clone: copy + rename view</text>
  <text x="236" y="433" font-size="9" fill="#374151">list: dropdown selector</text>
  <text x="236" y="448" font-size="9" fill="#374151">autosave: 2s debounce on change</text>

  <!-- Section D: amber, bottom-right -->
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — URL SYNC</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">URL Serialization</text>
  <text x="485" y="358" font-size="9" fill="#374151">encode: ?f=base64(JSON)</text>
  <text x="485" y="373" font-size="9" fill="#374151">sort: ?sort=field:dir</text>
  <text x="485" y="388" font-size="9" fill="#374151">page: ?page=N</text>
  <text x="485" y="403" font-size="9" fill="#374151">push on change: replaceState</text>
  <text x="485" y="418" font-size="9" fill="#374151">parse on mount: decode+validate</text>
  <text x="485" y="433" font-size="9" fill="#374151">invalid: skip + log warning</text>
  <text x="485" y="448" font-size="9" fill="#374151">popstate: restore on back/fwd</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Sharing</text>
  <text x="682" y="358" font-size="9" fill="#374151">share link: copy URL w/ filters</text>
  <text x="682" y="373" font-size="9" fill="#374151">expiring share: token 24h</text>
  <text x="682" y="388" font-size="9" fill="#374151">embed: iframe-safe URL params</text>
  <text x="682" y="403" font-size="9" fill="#374151">reset: navigate to base URL</text>
  <text x="682" y="418" font-size="9" fill="#374151">QR code: mobile share</text>
  <text x="682" y="433" font-size="9" fill="#374151">public: no auth share toggle</text>
  <text x="682" y="448" font-size="9" fill="#374151">preview: thumbnail of view</text>

  <!-- Arrows B→D, A→C, C→D -->
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Footer -->
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Filter ops: eq|ne|gt|lt|in|contains</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">View persist: POST /views</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">URL: base64 encoded</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Share: token 24h</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Default: per-user flag</text>
</svg>
