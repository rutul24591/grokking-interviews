<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Virtualized 2D Grid — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Cell model · Row+col windowing · Scroll sync · Frozen panes &amp; edit</text>

  <!-- Section A: purple, top-left -->
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — CELL MODEL</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">CellDef</text>
  <text x="34" y="133" font-size="9" fill="#374151">row: number, col: number</text>
  <text x="34" y="148" font-size="9" fill="#374151">value: any</text>
  <text x="34" y="163" font-size="9" fill="#374151">type: text|number|date|bool</text>
  <text x="34" y="178" font-size="9" fill="#374151">format: string</text>
  <text x="34" y="193" font-size="9" fill="#374151">style: {bg, color, bold, align}</text>
  <text x="34" y="208" font-size="9" fill="#374151">merged: {rowSpan, colSpan}</text>
  <text x="34" y="223" font-size="9" fill="#374151">readonly: boolean</text>
  <text x="34" y="240" font-size="9" fill="#374151">formula: string (=SUM(A1:A10))</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">GridState</text>
  <text x="236" y="133" font-size="9" fill="#374151">scrollTop: number</text>
  <text x="236" y="148" font-size="9" fill="#374151">scrollLeft: number</text>
  <text x="236" y="163" font-size="9" fill="#374151">viewportH / viewportW: number</text>
  <text x="236" y="178" font-size="9" fill="#374151">rowHeights: Map&lt;r, h&gt;</text>
  <text x="236" y="193" font-size="9" fill="#374151">colWidths: Map&lt;c, w&gt;</text>
  <text x="236" y="208" font-size="9" fill="#374151">frozenRows: number</text>
  <text x="236" y="223" font-size="9" fill="#374151">frozenCols: number</text>
  <text x="236" y="240" font-size="9" fill="#374151">totalRows / totalCols: number</text>

  <!-- Section B: blue, top-right -->
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — 2D WINDOWING</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Visible Range</text>
  <text x="485" y="133" font-size="9" fill="#374151">startRow = scrollTop/rowH</text>
  <text x="485" y="148" font-size="9" fill="#374151">endRow = startRow + vh/rowH</text>
  <text x="485" y="163" font-size="9" fill="#374151">overscan: ±3 rows, ±2 cols</text>
  <text x="485" y="178" font-size="9" fill="#374151">render only [start,end] cells</text>
  <text x="485" y="193" font-size="9" fill="#374151">spacers: top+bottom+left+right</text>
  <text x="485" y="208" font-size="9" fill="#374151">window: recalc on scroll</text>
  <text x="485" y="223" font-size="9" fill="#374151">throttle: rAF for scroll events</text>
  <text x="485" y="240" font-size="9" fill="#374151">merged cells: extend range</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Variable Sizes</text>
  <text x="682" y="133" font-size="9" fill="#374151">row heights: Map, default 24px</text>
  <text x="682" y="148" font-size="9" fill="#374151">col widths: Map, default 100px</text>
  <text x="682" y="163" font-size="9" fill="#374151">update: ResizeObserver on cell</text>
  <text x="682" y="178" font-size="9" fill="#374151">recalc cumulative offsets</text>
  <text x="682" y="193" font-size="9" fill="#374151">binary search: offset → index</text>
  <text x="682" y="208" font-size="9" fill="#374151">cache: summed offset array</text>
  <text x="682" y="223" font-size="9" fill="#374151">batch: resize triggers single pass</text>
  <text x="682" y="240" font-size="9" fill="#374151">autorow: expand on text wrap</text>

  <!-- Arrow A→B -->
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Section C: green, bottom-left -->
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — SCROLL SYNC</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Scroll Container</text>
  <text x="34" y="358" font-size="9" fill="#374151">outer: overflow scroll container</text>
  <text x="34" y="373" font-size="9" fill="#374151">inner: totalH × totalW div</text>
  <text x="34" y="388" font-size="9" fill="#374151">cells: absolute by cumOffset</text>
  <text x="34" y="403" font-size="9" fill="#374151">scrollbars: native + overlay</text>
  <text x="34" y="418" font-size="9" fill="#374151">sync: header scroll with body</text>
  <text x="34" y="433" font-size="9" fill="#374151">momentum: touch scroll support</text>
  <text x="34" y="448" font-size="9" fill="#374151">keyboard: PgUp/PgDn/Home/End</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Frozen Panes</text>
  <text x="236" y="358" font-size="9" fill="#374151">frozen rows: sticky top=0</text>
  <text x="236" y="373" font-size="9" fill="#374151">frozen cols: sticky left=0</text>
  <text x="236" y="388" font-size="9" fill="#374151">frozen corner: sticky top+left</text>
  <text x="236" y="403" font-size="9" fill="#374151">z-index: corner &gt; row &gt; col</text>
  <text x="236" y="418" font-size="9" fill="#374151">border: separator line after frozen</text>
  <text x="236" y="433" font-size="9" fill="#374151">scroll: frozen cols don't scroll X</text>
  <text x="236" y="448" font-size="9" fill="#374151">resize: frozen cols width adjust</text>

  <!-- Section D: amber, bottom-right -->
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — EDIT &amp; SELECTION</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Selection Model</text>
  <text x="485" y="358" font-size="9" fill="#374151">anchor: {row, col}</text>
  <text x="485" y="373" font-size="9" fill="#374151">focus: {row, col}</text>
  <text x="485" y="388" font-size="9" fill="#374151">range: anchor→focus rect</text>
  <text x="485" y="403" font-size="9" fill="#374151">shift+click: extend range</text>
  <text x="485" y="418" font-size="9" fill="#374151">ctrl+click: multi-range</text>
  <text x="485" y="433" font-size="9" fill="#374151">arrow+shift: keyboard extend</text>
  <text x="485" y="448" font-size="9" fill="#374151">ctrl+A: select all cells</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Cell Edit</text>
  <text x="682" y="358" font-size="9" fill="#374151">dblclick: enter edit mode</text>
  <text x="682" y="373" font-size="9" fill="#374151">type: replace current value</text>
  <text x="682" y="388" font-size="9" fill="#374151">F2: append to value</text>
  <text x="682" y="403" font-size="9" fill="#374151">Enter: commit + move down</text>
  <text x="682" y="418" font-size="9" fill="#374151">Tab: commit + move right</text>
  <text x="682" y="433" font-size="9" fill="#374151">clipboard: paste into range</text>
  <text x="682" y="448" font-size="9" fill="#374151">undo: Ctrl+Z per cell change</text>

  <!-- Arrows B→D, A→C, C→D -->
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Footer -->
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Overscan: 3 rows / 2 cols</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Default cell: 24px×100px</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Frozen: sticky positioning</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Selection: anchor+focus rect</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Paste: range-aware</text>
</svg>
