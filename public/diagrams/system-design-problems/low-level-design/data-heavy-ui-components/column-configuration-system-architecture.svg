<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Column Configuration System — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Column model · Visibility toggle · Resize · Reorder &amp; persist</text>

  <!-- Section A: purple, top-left -->
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — COLUMN MODEL</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">ColumnDef</text>
  <text x="34" y="133" font-size="9" fill="#374151">id: string</text>
  <text x="34" y="148" font-size="9" fill="#374151">header: string</text>
  <text x="34" y="163" font-size="9" fill="#374151">accessor: string | fn</text>
  <text x="34" y="178" font-size="9" fill="#374151">width: number</text>
  <text x="34" y="193" font-size="9" fill="#374151">minWidth: 60, maxWidth: 800</text>
  <text x="34" y="208" font-size="9" fill="#374151">sortable: boolean</text>
  <text x="34" y="223" font-size="9" fill="#374151">filterable: boolean</text>
  <text x="34" y="240" font-size="9" fill="#374151">pinned: left|right|none</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">ColumnState</text>
  <text x="236" y="133" font-size="9" fill="#374151">order: id[]</text>
  <text x="236" y="148" font-size="9" fill="#374151">widths: Record&lt;id, number&gt;</text>
  <text x="236" y="163" font-size="9" fill="#374151">visibility: Record&lt;id, bool&gt;</text>
  <text x="236" y="178" font-size="9" fill="#374151">pinned: {left: id[], right: id[]}</text>
  <text x="236" y="193" font-size="9" fill="#374151">persist: localStorage key</text>
  <text x="236" y="208" font-size="9" fill="#374151">hidden: boolean per column</text>
  <text x="236" y="223" font-size="9" fill="#374151">groupBy: id[] for grouping</text>
  <text x="236" y="240" font-size="9" fill="#374151">frozenCount: left frozen cols</text>

  <!-- Section B: blue, top-right -->
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — VISIBILITY &amp; REORDER</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Toggle Panel</text>
  <text x="485" y="133" font-size="9" fill="#374151">checkbox list per column</text>
  <text x="485" y="148" font-size="9" fill="#374151">show/hide: toggle hidden flag</text>
  <text x="485" y="163" font-size="9" fill="#374151">drag reorder in panel</text>
  <text x="485" y="178" font-size="9" fill="#374151">search filter: large column sets</text>
  <text x="485" y="193" font-size="9" fill="#374151">reset: restore default order</text>
  <text x="485" y="208" font-size="9" fill="#374151">lock: prevent hide for required</text>
  <text x="485" y="223" font-size="9" fill="#374151">count badge: N hidden cols</text>
  <text x="485" y="240" font-size="9" fill="#374151">preview: instant table update</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Column Reorder</text>
  <text x="682" y="133" font-size="9" fill="#374151">DnD headers: pointer events</text>
  <text x="682" y="148" font-size="9" fill="#374151">drop zone: highlight target slot</text>
  <text x="682" y="163" font-size="9" fill="#374151">swap order array on drop</text>
  <text x="682" y="178" font-size="9" fill="#374151">animation: FLIP column headers</text>
  <text x="682" y="193" font-size="9" fill="#374151">ghost: dragging column preview</text>
  <text x="682" y="208" font-size="9" fill="#374151">constraint: keep pinned cols</text>
  <text x="682" y="223" font-size="9" fill="#374151">cancel: Escape key restores</text>
  <text x="682" y="240" font-size="9" fill="#374151">a11y: keyboard reorder support</text>

  <!-- Arrow A→B -->
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Section C: green, bottom-left -->
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — RESIZE SYSTEM</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Resize Handle</text>
  <text x="34" y="358" font-size="9" fill="#374151">div at right edge of header</text>
  <text x="34" y="373" font-size="9" fill="#374151">onPointerDown: capture + track dx</text>
  <text x="34" y="388" font-size="9" fill="#374151">width = clamp(w+dx, min, max)</text>
  <text x="34" y="403" font-size="9" fill="#374151">table-layout: fixed for perf</text>
  <text x="34" y="418" font-size="9" fill="#374151">cursor: col-resize on hover</text>
  <text x="34" y="433" font-size="9" fill="#374151">snap: grid units if enabled</text>
  <text x="34" y="448" font-size="9" fill="#374151">live: update while dragging</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Auto-fit</text>
  <text x="236" y="358" font-size="9" fill="#374151">dblclick: auto-fit to content</text>
  <text x="236" y="373" font-size="9" fill="#374151">measure widest cell: hidden span</text>
  <text x="236" y="388" font-size="9" fill="#374151">cap at maxWidth</text>
  <text x="236" y="403" font-size="9" fill="#374151">batch: resize all via button</text>
  <text x="236" y="418" font-size="9" fill="#374151">header text: include in measure</text>
  <text x="236" y="433" font-size="9" fill="#374151">virtualized: sample 100 rows</text>
  <text x="236" y="448" font-size="9" fill="#374151">animate: smooth width transition</text>

  <!-- Section D: amber, bottom-right -->
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — PERSIST &amp; EXPORT</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Persistence</text>
  <text x="485" y="358" font-size="9" fill="#374151">save: JSON.stringify state</text>
  <text x="485" y="373" font-size="9" fill="#374151">key: tableId + userId</text>
  <text x="485" y="388" font-size="9" fill="#374151">load on mount: merge defaults</text>
  <text x="485" y="403" font-size="9" fill="#374151">reset: clear localStorage key</text>
  <text x="485" y="418" font-size="9" fill="#374151">server sync: PUT /user-prefs</text>
  <text x="485" y="433" font-size="9" fill="#374151">version: migrate old schemas</text>
  <text x="485" y="448" font-size="9" fill="#374151">debounce: 500ms before save</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Column Export</text>
  <text x="682" y="358" font-size="9" fill="#374151">export visible columns only</text>
  <text x="682" y="373" font-size="9" fill="#374151">CSV header = column label</text>
  <text x="682" y="388" font-size="9" fill="#374151">width hint for Excel: custom XML</text>
  <text x="682" y="403" font-size="9" fill="#374151">column order matches visible</text>
  <text x="682" y="418" font-size="9" fill="#374151">format: apply cell formatter</text>
  <text x="682" y="433" font-size="9" fill="#374151">hidden: omit from export</text>
  <text x="682" y="448" font-size="9" fill="#374151">pinned: always first in export</text>

  <!-- Arrows B→D, A→C, C→D -->
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Footer -->
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">minWidth: 60px | maxWidth: 800px</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Persist: localStorage</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Auto-fit: measure widest cell</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Pin: left/right</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Export: visible cols only</text>
</svg>
