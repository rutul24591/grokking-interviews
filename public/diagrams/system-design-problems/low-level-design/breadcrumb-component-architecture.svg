<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2563eb"/>
    </marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Breadcrumb Component — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Route parser · Schema markup · Render &amp; truncation · Mobile &amp; SEO</text>

  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — ROUTE PARSER &amp; DATA MODEL</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">BreadcrumbItem Shape</text>
  <text x="34" y="133" font-size="9" fill="#374151">label: string  (display text)</text>
  <text x="34" y="148" font-size="9" fill="#374151">href?: string  (omit = current)</text>
  <text x="34" y="163" font-size="9" fill="#374151">icon?: ReactNode</text>
  <text x="34" y="178" font-size="9" fill="#374151">isCurrent: boolean</text>
  <text x="34" y="193" font-size="9" fill="#374151">i18nKey?: string (translation key)</text>
  <text x="34" y="210" font-size="9" fill="#6d5bd0" font-weight="bold">Auto from pathname:</text>
  <text x="34" y="225" font-size="9" fill="#374151">'/a/b/c' builds cumulative hrefs</text>
  <text x="34" y="240" font-size="9" fill="#374151">Last item: isCurrent=true, no href</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Path Parsing Logic</text>
  <text x="236" y="133" font-size="9" fill="#374151">splitPathname(path): string[]</text>
  <text x="236" y="148" font-size="9" fill="#374151">  filter empty + decodeURI</text>
  <text x="236" y="163" font-size="9" fill="#374151">labelFromSegment(seg): string</text>
  <text x="236" y="178" font-size="9" fill="#374151">  '[id]' dynamic → lookup map</text>
  <text x="236" y="193" font-size="9" fill="#374151">  kebab-case → Title Case</text>
  <text x="236" y="208" font-size="9" fill="#374151">Custom labelMap prop overrides</text>
  <text x="236" y="223" font-size="9" fill="#374151">Collapse IDs: /users/123 → Users</text>
  <text x="236" y="240" font-size="9" fill="#374151">Max depth configurable (default 6)</text>

  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — SCHEMA MARKUP &amp; i18n</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">JSON-LD BreadcrumbList</text>
  <text x="485" y="133" font-size="9" fill="#374151">script type="application/ld+json"</text>
  <text x="485" y="148" font-size="9" fill="#374151">@type: BreadcrumbList</text>
  <text x="485" y="163" font-size="9" fill="#374151">itemListElement: ListItem[]</text>
  <text x="485" y="178" font-size="9" fill="#374151">  position, name, item (URL)</text>
  <text x="485" y="193" font-size="9" fill="#374151">Google rich result eligible</text>
  <text x="485" y="208" font-size="9" fill="#374151">SSR rendered → crawler visible</text>
  <text x="485" y="223" font-size="9" fill="#374151">Absolute URLs required for item</text>
  <text x="485" y="240" font-size="9" fill="#374151">baseUrl prop or env variable</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Internationalisation</text>
  <text x="682" y="133" font-size="9" fill="#374151">i18n prop: Record&lt;key, string&gt;</text>
  <text x="682" y="148" font-size="9" fill="#374151">Segment → i18nKey lookup first</text>
  <text x="682" y="163" font-size="9" fill="#374151">Fallback: labelFromSegment()</text>
  <text x="682" y="178" font-size="9" fill="#374151">RTL support: dir="rtl" on nav</text>
  <text x="682" y="193" font-size="9" fill="#374151">  separator flips › to ‹</text>
  <text x="682" y="208" font-size="9" fill="#374151">Custom separator prop (string|node)</text>
  <text x="682" y="223" font-size="9" fill="#374151">  default: '/' aria-hidden="true"</text>
  <text x="682" y="240" font-size="9" fill="#374151">Home label from i18n.home key</text>

  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — RENDER &amp; TRUNCATION</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Render Strategy</text>
  <text x="34" y="358" font-size="9" fill="#374151">&lt;nav aria-label="Breadcrumb"&gt;</text>
  <text x="34" y="373" font-size="9" fill="#374151">  &lt;ol&gt; → &lt;li&gt; per crumb</text>
  <text x="34" y="388" font-size="9" fill="#374151">Current: aria-current="page" span</text>
  <text x="34" y="403" font-size="9" fill="#374151">Ancestors: &lt;a href&gt; clickable</text>
  <text x="34" y="418" font-size="9" fill="#374151">Separator: aria-hidden="true"</text>
  <text x="34" y="433" font-size="9" fill="#374151">max-width + text-overflow ellipsis</text>
  <text x="34" y="448" font-size="9" fill="#374151">title={fullLabel} on truncated</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Collapse Strategy</text>
  <text x="236" y="358" font-size="9" fill="#374151">maxVisible prop (default: 4)</text>
  <text x="236" y="373" font-size="9" fill="#374151">Keep: first + last + ellipsis</text>
  <text x="236" y="388" font-size="9" fill="#374151">  Home / … / Parent / Current</text>
  <text x="236" y="403" font-size="9" fill="#374151">Ellipsis btn: aria-expanded toggle</text>
  <text x="236" y="418" font-size="9" fill="#374151">  reveals hidden middle crumbs</text>
  <text x="236" y="433" font-size="9" fill="#374151">Mobile (&lt;640px): overflow scroll</text>
  <text x="236" y="448" font-size="9" fill="#374151">  or back-button single-link mode</text>

  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — MOBILE &amp; SEO CONSIDERATIONS</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Mobile Patterns</text>
  <text x="485" y="358" font-size="9" fill="#374151">≤640px: last 2 segments only</text>
  <text x="485" y="373" font-size="9" fill="#374151">Back mode: ← Parent label link</text>
  <text x="485" y="388" font-size="9" fill="#374151">Touch target: min 44×44px</text>
  <text x="485" y="403" font-size="9" fill="#374151">Horizontal scroll if overflow</text>
  <text x="485" y="418" font-size="9" fill="#374151">  scrollbar-width: none</text>
  <text x="485" y="433" font-size="9" fill="#374151">Icon-only home crumb on mobile</text>
  <text x="485" y="448" font-size="9" fill="#374151">CSS clamp for responsive font</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">SEO &amp; Edge Cases</text>
  <text x="682" y="358" font-size="9" fill="#374151">JSON-LD absolute URLs critical</text>
  <text x="682" y="373" font-size="9" fill="#374151">No JS: renders fully server-side</text>
  <text x="682" y="388" font-size="9" fill="#374151">Dynamic routes: pass labelMap</text>
  <text x="682" y="403" font-size="9" fill="#374151">  /products/[id] → product name</text>
  <text x="682" y="418" font-size="9" fill="#374151">Hash routes: strip # for schema</text>
  <text x="682" y="433" font-size="9" fill="#374151">Long labels: title attr full text</text>
  <text x="682" y="448" font-size="9" fill="#374151">Single-crumb: omit nav entirely</text>

  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>

  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Max visible: 4 items</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Collapse threshold: &gt;4 crumbs</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">JSON-LD: BreadcrumbList schema</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">ARIA: aria-current="page" on last</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Separator: aria-hidden="true"</text>
</svg>
