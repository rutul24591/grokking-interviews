<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2563eb"/>
    </marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Color Picker — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Color state · Space conversions · Contrast engine · A11y &amp; palette</text>

  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — COLOR STATE MODEL</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Internal Color State</text>
  <text x="34" y="133" font-size="9" fill="#374151">hue: number (0–360)</text>
  <text x="34" y="148" font-size="9" fill="#374151">saturation: number (0–100)</text>
  <text x="34" y="163" font-size="9" fill="#374151">lightness: number (0–100)</text>
  <text x="34" y="178" font-size="9" fill="#374151">alpha: number (0–1)</text>
  <text x="34" y="193" font-size="9" fill="#374151">format: 'hex'|'rgb'|'hsl'|'oklch'</text>
  <text x="34" y="208" font-size="9" fill="#374151">inputText: string (raw input)</text>
  <text x="34" y="225" font-size="9" fill="#374151">isValid: boolean (parse result)</text>
  <text x="34" y="240" font-size="9" fill="#374151">history: Color[] (last 8 used)</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Component Props</text>
  <text x="236" y="133" font-size="9" fill="#374151">value: string (controlled)</text>
  <text x="236" y="148" font-size="9" fill="#374151">defaultValue?: string (uncontrolled)</text>
  <text x="236" y="163" font-size="9" fill="#374151">onChange: (color: Color) =&gt; void</text>
  <text x="236" y="178" font-size="9" fill="#374151">format?: 'hex'|'rgb'|'hsl'|'oklch'</text>
  <text x="236" y="193" font-size="9" fill="#374151">showAlpha?: boolean</text>
  <text x="236" y="208" font-size="9" fill="#374151">palette?: string[] (swatches)</text>
  <text x="236" y="223" font-size="9" fill="#374151">showEyedropper?: boolean</text>
  <text x="236" y="240" font-size="9" fill="#374151">disabled?: boolean</text>

  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — COLOR SPACE CONVERSIONS</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Conversion Pipeline</text>
  <text x="485" y="133" font-size="9" fill="#374151">parseColor(str): HSL|null</text>
  <text x="485" y="148" font-size="9" fill="#374151">  hex #rrggbb, #rgb, #rgba</text>
  <text x="485" y="163" font-size="9" fill="#374151">  rgb(r,g,b), rgba(r,g,b,a)</text>
  <text x="485" y="178" font-size="9" fill="#374151">  hsl(h,s%,l%), oklch(l,c,h)</text>
  <text x="485" y="193" font-size="9" fill="#374151">hslToRgb(): [r,g,b] 0–255</text>
  <text x="485" y="208" font-size="9" fill="#374151">rgbToHex(): #rrggbb string</text>
  <text x="485" y="225" font-size="9" fill="#374151">hslToOklch(): perceptual space</text>
  <text x="485" y="240" font-size="9" fill="#374151">precision: 4 decimal oklch</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Gradient Canvas</text>
  <text x="682" y="133" font-size="9" fill="#374151">SL panel: 200×200 canvas</text>
  <text x="682" y="148" font-size="9" fill="#374151">  x=saturation, y=lightness</text>
  <text x="682" y="163" font-size="9" fill="#374151">  two gradients: white→hue</text>
  <text x="682" y="178" font-size="9" fill="#374151">  and transparent→black</text>
  <text x="682" y="193" font-size="9" fill="#374151">Hue slider: 360-stop gradient</text>
  <text x="682" y="208" font-size="9" fill="#374151">Alpha slider: checker pattern bg</text>
  <text x="682" y="223" font-size="9" fill="#374151">Pointer: draggable circle handle</text>
  <text x="682" y="240" font-size="9" fill="#374151">  clamped to canvas bounds</text>

  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — CONTRAST ENGINE</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">WCAG Contrast</text>
  <text x="34" y="358" font-size="9" fill="#374151">relativeLuminance(rgb): number</text>
  <text x="34" y="373" font-size="9" fill="#374151">  linearise: &lt;=0.04045? /12.92</text>
  <text x="34" y="388" font-size="9" fill="#374151">  else ((val+0.055)/1.055)^2.4</text>
  <text x="34" y="403" font-size="9" fill="#374151">contrastRatio(fg,bg): ratio</text>
  <text x="34" y="418" font-size="9" fill="#374151">  (L1+0.05)/(L2+0.05)</text>
  <text x="34" y="433" font-size="9" fill="#374151">AA normal: 4.5:1 minimum</text>
  <text x="34" y="448" font-size="9" fill="#374151">AAA large text: 7:1 threshold</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Contrast Preview</text>
  <text x="236" y="358" font-size="9" fill="#374151">Inline badge: ratio + pass/fail</text>
  <text x="236" y="373" font-size="9" fill="#374151">Against white and black bg</text>
  <text x="236" y="388" font-size="9" fill="#374151">Live update on drag/type</text>
  <text x="236" y="403" font-size="9" fill="#374151">Suggestion: auto-adjust L</text>
  <text x="236" y="418" font-size="9" fill="#374151">  binary search for 4.5 ratio</text>
  <text x="236" y="433" font-size="9" fill="#374151">Custom bg input for AA check</text>
  <text x="236" y="448" font-size="9" fill="#374151">Icon: ✓ green / ✗ red badge</text>

  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — A11Y &amp; PALETTE MANAGEMENT</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Keyboard &amp; A11y</text>
  <text x="485" y="358" font-size="9" fill="#374151">SL canvas: arrow key nudge</text>
  <text x="485" y="373" font-size="9" fill="#374151">  shift+arrow: 10× step</text>
  <text x="485" y="388" font-size="9" fill="#374151">Hue slider: role="slider"</text>
  <text x="485" y="403" font-size="9" fill="#374151">  aria-valuemin/max/now</text>
  <text x="485" y="418" font-size="9" fill="#374151">Eyedropper: EyeDropper API</text>
  <text x="485" y="433" font-size="9" fill="#374151">  async pick from screen</text>
  <text x="485" y="448" font-size="9" fill="#374151">Tab order: panel→sliders→input</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Saved Palette</text>
  <text x="682" y="358" font-size="9" fill="#374151">Max 20 saved swatches</text>
  <text x="682" y="373" font-size="9" fill="#374151">Persisted to localStorage</text>
  <text x="682" y="388" font-size="9" fill="#374151">Duplicate detection (hex eq)</text>
  <text x="682" y="403" font-size="9" fill="#374151">Swatch: 24×24 rounded, border</text>
  <text x="682" y="418" font-size="9" fill="#374151">aria-label: hex value on swatch</text>
  <text x="682" y="433" font-size="9" fill="#374151">Delete: keyboard Delete key</text>
  <text x="682" y="448" font-size="9" fill="#374151">Custom palette prop overrides</text>

  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>

  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">WCAG AA ratio: 4.5:1 minimum</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">oklch precision: 4 decimals</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">EyeDropper API: async screen pick</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Saved palette max: 20 swatches</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Tab order: panel → sliders → input</text>
</svg>
