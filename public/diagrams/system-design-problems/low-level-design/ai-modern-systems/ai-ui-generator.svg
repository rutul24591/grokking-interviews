<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="580">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">AI UI Generator: Architecture &amp; Safety Model</text>

  <!-- Generation Pipeline -->
  <g>
    <text x="220" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Generation Pipeline</text>

    <rect x="30" y="75" width="380" height="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="220" y="98" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">1. User Describes UI</text>
    <text x="220" y="115" font-size="10" text-anchor="middle" fill="#374151">"A login form with email, password, and a submit button"</text>

    <path d="M 220 135 L 220 155" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#agui)"/>

    <rect x="30" y="155" width="380" height="60" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="220" y="178" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">2. LLM Generates UI Spec</text>
    <text x="220" y="195" font-size="10" text-anchor="middle" fill="#374151">Structured output: JSON component tree or JSX string</text>

    <path d="M 220 215 L 220 235" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#agui)"/>

    <rect x="30" y="235" width="380" height="60" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="220" y="258" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">3. Validate &amp; Sanitize</text>
    <text x="220" y="275" font-size="10" text-anchor="middle" fill="#374151">Parse AST, check allowed components, strip dangerous patterns</text>

    <path d="M 220 295 L 220 315" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#agui)"/>

    <rect x="30" y="315" width="380" height="60" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="220" y="338" font-size="11" font-weight="bold" text-anchor="middle" fill="#581c87">4. Render in Sandbox</text>
    <text x="220" y="355" font-size="10" text-anchor="middle" fill="#374151">Isolated iframe + CSP. No access to parent scope.</text>

    <path d="M 220 375 L 220 395" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#agui)"/>

    <rect x="30" y="395" width="380" height="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="220" y="418" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">5. User Refines</text>
    <text x="220" y="435" font-size="10" text-anchor="middle" fill="#374151">"Make the button blue and add a remember me checkbox"</text>
  </g>

  <!-- Output Formats & Safety -->
  <g>
    <text x="740" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Output Formats &amp; Safety</text>

    <rect x="450" y="75" width="620" height="175" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="760" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">Output Strategies</text>
    <text x="465" y="122" font-size="10" fill="#374151">JSON Component Tree (safest):</text>
    <text x="465" y="140" font-size="10" fill="#374151">  {type:'Input', props:{type:'email', label:'Email'}}</text>
    <text x="465" y="158" font-size="10" fill="#374151">  → Renderer maps types to real components (whitelist)</text>
    <text x="465" y="178" font-size="10" fill="#374151">JSX String (controlled):</text>
    <text x="465" y="196" font-size="10" fill="#374151">  Parse → Babel AST → allow only whitelisted imports</text>
    <text x="465" y="214" font-size="10" fill="#374151">  No eval() — use Babel to transform + sandbox</text>
    <text x="465" y="234" font-size="10" fill="#374151">Tailwind class generation: AI picks classes from allowed set</text>
    <text x="465" y="248" font-size="9" fill="#a855f7">Never: eval(aiOutput) or dangerouslySetInnerHTML — XSS risk</text>

    <rect x="450" y="265" width="620" height="175" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="760" y="290" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Security Model</text>
    <text x="465" y="312" font-size="10" fill="#374151">Component whitelist: only allowed elements (Input, Button, Text...)</text>
    <text x="465" y="330" font-size="10" fill="#374151">Prop sanitization: strip event handlers (onClick=... user code)</text>
    <text x="465" y="348" font-size="10" fill="#374151">No fetch/localStorage access from generated code</text>
    <text x="465" y="366" font-size="10" fill="#374151">Sandbox iframe: sandboxed="allow-scripts" + strict CSP</text>
    <text x="465" y="384" font-size="10" fill="#374151">PostMessage: only structured data between parent + sandbox</text>
    <text x="465" y="402" font-size="10" fill="#374151">Rate limit: prevent abuse (cost, compute)</text>
    <text x="465" y="420" font-size="10" fill="#374151">Content policy: block prompts requesting auth bypass, data exfil</text>
    <text x="465" y="434" font-size="9" fill="#ef4444">Trust boundary: treat AI output as untrusted user input — always sanitize</text>

    <rect x="450" y="455" width="620" height="100" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="760" y="478" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Iterative Refinement UX</text>
    <text x="465" y="500" font-size="10" fill="#374151">Maintain conversation context: each prompt builds on previous state</text>
    <text x="465" y="518" font-size="10" fill="#374151">Inline editing: click component to edit props directly (not via prompt)</text>
    <text x="465" y="536" font-size="9" fill="#10b981">Version history: save each generation — undo refinements. Export to code.</text>
  </g>

  <rect x="30" y="480" width="400" height="68" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="3"/>
  <text x="50" y="500" font-size="11" fill="#374151"><tspan font-weight="bold">Key tension:</tspan> Flexibility vs safety. More flexibility = more attack surface.</text>
  <text x="50" y="518" font-size="11" fill="#374151"><tspan font-weight="bold">Pattern:</tspan> JSON spec → whitelist renderer is safest. Never eval string output.</text>
  <text x="50" y="535" font-size="9" fill="#6b7280">Examples: v0 (Vercel), Bolt.new, Lovable — all use sandboxed rendering approaches.</text>
  <text x="50" y="550" font-size="9" fill="#6b7280">Structured output (LLM JSON mode) is more reliable than free-form JSX generation.</text>

  <defs>
    <marker id="agui" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/></marker>
  </defs>
</svg>
