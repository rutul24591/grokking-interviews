<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">AI-Assisted Search / Q&amp;A UI: Architecture &amp; RAG Pipeline</text>

  <!-- Query Pipeline -->
  <g>
    <text x="220" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Query Pipeline</text>

    <rect x="30" y="75" width="380" height="55" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="220" y="98" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">1. User Query Input</text>
    <text x="220" y="115" font-size="10" text-anchor="middle" fill="#374151">Search box with live suggestions + semantic query detection</text>

    <path d="M 220 130 L 220 150" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#aqs)"/>

    <rect x="30" y="150" width="380" height="55" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="220" y="173" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">2. Intent Classification</text>
    <text x="220" y="191" font-size="10" text-anchor="middle" fill="#374151">Keyword search | Q&amp;A | Navigation | Comparison</text>

    <path d="M 220 205 L 220 225" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#aqs)"/>

    <rect x="30" y="225" width="380" height="55" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="220" y="248" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">3. Retrieval (RAG)</text>
    <text x="220" y="265" font-size="10" text-anchor="middle" fill="#374151">Embed query → vector search → top-K documents</text>

    <path d="M 220 280 L 220 300" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#aqs)"/>

    <rect x="30" y="300" width="380" height="55" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="220" y="323" font-size="11" font-weight="bold" text-anchor="middle" fill="#581c87">4. LLM Generation</text>
    <text x="220" y="341" font-size="10" text-anchor="middle" fill="#374151">Prompt: context + query → stream answer with citations</text>

    <path d="M 220 355 L 220 375" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#aqs)"/>

    <rect x="30" y="375" width="380" height="55" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="220" y="398" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">5. Render Results</text>
    <text x="220" y="415" font-size="10" text-anchor="middle" fill="#374151">AI answer + source cards + traditional search fallback</text>
  </g>

  <!-- UI Components -->
  <g>
    <text x="680" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">UI Result Patterns</text>

    <rect x="450" y="75" width="620" height="175" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>
    <!-- AI Answer Card -->
    <rect x="465" y="90" width="590" height="145" fill="white" stroke="#e2e8f0" stroke-width="1" rx="4"/>
    <text x="480" y="112" font-size="11" font-weight="bold" fill="#581c87">✦ AI Answer</text>
    <text x="480" y="130" font-size="10" fill="#374151">Async/await pauses execution until a Promise resolves,</text>
    <text x="480" y="147" font-size="10" fill="#374151">making async code appear synchronous. Unlike callbacks...</text>
    <text x="480" y="167" font-size="10" font-weight="bold" fill="#374151">Sources:</text>
    <rect x="480" y="175" width="120" height="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="540" y="191" font-size="9" text-anchor="middle" fill="#1e40af">[1] MDN Web Docs</text>
    <rect x="610" y="175" width="130" height="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="675" y="191" font-size="9" text-anchor="middle" fill="#1e40af">[2] JS.info Tutorial</text>
    <rect x="750" y="175" width="100" height="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="800" y="191" font-size="9" text-anchor="middle" fill="#1e40af">[3] RFC 2119</text>

    <rect x="450" y="265" width="620" height="170" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="760" y="290" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">Citation &amp; Source Handling</text>
    <text x="465" y="312" font-size="10" fill="#374151">Inline citations: [1] numbered references inline in text</text>
    <text x="465" y="330" font-size="10" fill="#374151">Source cards: show title, URL, excerpt, relevance score</text>
    <text x="465" y="348" font-size="10" fill="#374151">Hover preview: show source snippet on citation hover</text>
    <text x="465" y="366" font-size="10" fill="#374151">Grounding: highlight which part of answer each source supports</text>
    <text x="465" y="384" font-size="10" fill="#374151">Confidence: show when LLM is uncertain (hedge phrases)</text>
    <text x="465" y="402" font-size="10" fill="#374151">No hallucination UX: "I don't know" vs fabricating</text>
    <text x="465" y="420" font-size="9" fill="#a855f7">Structured output: {answer, citations:[{id,url,excerpt}]} from LLM</text>

    <rect x="450" y="450" width="620" height="115" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="760" y="475" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Hybrid Search Results</text>
    <text x="465" y="497" font-size="10" fill="#374151">AI answer panel (top): streaming response with sources</text>
    <text x="465" y="515" font-size="10" fill="#374151">Traditional results (below): ranked keyword search results</text>
    <text x="465" y="533" font-size="10" fill="#374151">Follow-up suggestions: "Did you mean...?" / related queries</text>
    <text x="465" y="549" font-size="9" fill="#3b82f6">User controls: "Use AI" toggle, feedback buttons (helpful/not)</text>
  </g>

  <rect x="30" y="460" width="400" height="100" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="3"/>
  <text x="50" y="480" font-size="11" fill="#374151"><tspan font-weight="bold">RAG:</tspan> Retrieve relevant docs → inject as context → generate answer.</text>
  <text x="50" y="498" font-size="11" fill="#374151"><tspan font-weight="bold">UX:</tspan> Show sources alongside answer. Stream answer.</text>
  <text x="50" y="516" font-size="11" fill="#374151"><tspan font-weight="bold">Hybrid:</tspan> AI answers + traditional search = best of both worlds.</text>
  <text x="50" y="534" font-size="9" fill="#6b7280">Tools: Algolia AI, Azure AI Search, Pinecone + OpenAI embeddings.</text>
  <text x="50" y="551" font-size="9" fill="#6b7280">Cache embeddings. Rate limit by user. Log queries for fine-tuning.</text>

  <defs>
    <marker id="aqs" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/></marker>
  </defs>
</svg>
