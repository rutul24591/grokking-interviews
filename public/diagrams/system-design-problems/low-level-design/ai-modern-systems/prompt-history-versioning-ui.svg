<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Prompt History &amp; Versioning UI</text>

  <!-- History Timeline UI -->
  <g>
    <text x="220" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Prompt Version Timeline</text>

    <rect x="30" y="75" width="380" height="390" fill="#f9fafb" stroke="#d1d5db" stroke-width="2" rx="6"/>

    <!-- Version entries -->
    <circle cx="80" cy="130" r="10" fill="#10b981" stroke="white" stroke-width="2"/>
    <text x="75" y="134" font-size="10" font-weight="bold" text-anchor="middle" fill="white">v4</text>
    <rect x="100" y="110" width="290" height="60" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="3"/>
    <text x="115" y="130" font-size="10" font-weight="bold" fill="#065f46">v4 — Current</text>
    <text x="115" y="148" font-size="9" fill="#374151">Added: "Output in JSON format with..."</text>
    <text x="115" y="163" font-size="9" fill="#6b7280">Saved by Alice · 2 min ago</text>

    <line x1="80" y1="140" x2="80" y2="200" stroke="#d1d5db" stroke-width="2"/>

    <circle cx="80" cy="210" r="10" fill="#3b82f6" stroke="white" stroke-width="2"/>
    <text x="75" y="214" font-size="10" font-weight="bold" text-anchor="middle" fill="white">v3</text>
    <rect x="100" y="190" width="290" height="55" fill="white" stroke="#e2e8f0" stroke-width="1" rx="3"/>
    <text x="115" y="210" font-size="10" font-weight="bold" fill="#374151">v3</text>
    <text x="115" y="228" font-size="9" fill="#374151">Changed: "Be concise" → "Be detailed"</text>
    <text x="115" y="240" font-size="9" fill="#6b7280">Alice · 1 hour ago · [Restore]</text>

    <line x1="80" y1="220" x2="80" y2="280" stroke="#d1d5db" stroke-width="2"/>

    <circle cx="80" cy="290" r="10" fill="#3b82f6" stroke="white" stroke-width="2"/>
    <text x="75" y="294" font-size="10" font-weight="bold" text-anchor="middle" fill="white">v2</text>
    <rect x="100" y="270" width="290" height="55" fill="white" stroke="#e2e8f0" stroke-width="1" rx="3"/>
    <text x="115" y="290" font-size="10" font-weight="bold" fill="#374151">v2</text>
    <text x="115" y="308" font-size="9" fill="#374151">Added few-shot examples block</text>
    <text x="115" y="320" font-size="9" fill="#6b7280">Bob · Yesterday · [Restore] [Compare]</text>

    <line x1="80" y1="300" x2="80" y2="360" stroke="#d1d5db" stroke-width="2"/>

    <circle cx="80" cy="370" r="10" fill="#9ca3af" stroke="white" stroke-width="2"/>
    <text x="75" y="374" font-size="10" font-weight="bold" text-anchor="middle" fill="white">v1</text>
    <rect x="100" y="350" width="290" height="55" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1" rx="3"/>
    <text x="115" y="370" font-size="10" font-weight="bold" fill="#6b7280">v1 — Initial</text>
    <text x="115" y="388" font-size="9" fill="#374151">Original prompt template</text>
    <text x="115" y="400" font-size="9" fill="#6b7280">Alice · 2 days ago</text>

    <text x="220" y="455" font-size="10" text-anchor="middle" fill="#6b7280">Named versions: "Before JSON", "With Examples"</text>
  </g>

  <!-- Data Model & Diff -->
  <g>
    <text x="740" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Data Model &amp; Diff View</text>

    <rect x="450" y="75" width="620" height="185" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="760" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">PromptVersion Schema</text>
    <text x="465" y="122" font-size="10" fill="#374151">id: uuid</text>
    <text x="465" y="140" font-size="10" fill="#374151">promptId: uuid (parent prompt)</text>
    <text x="465" y="158" font-size="10" fill="#374151">version: number (auto-increment)</text>
    <text x="465" y="176" font-size="10" fill="#374151">content: string (full prompt text)</text>
    <text x="465" y="194" font-size="10" fill="#374151">variables: {[key]: description}[]</text>
    <text x="465" y="212" font-size="10" fill="#374151">author: userId</text>
    <text x="465" y="230" font-size="10" fill="#374151">label: string? (named version)</text>
    <text x="465" y="248" font-size="10" fill="#374151">createdAt: timestamp</text>
    <text x="465" y="252" font-size="9" fill="#3b82f6">metrics: {avgTokens, avgLatency, thumbsUp/Down} from eval runs</text>

    <rect x="450" y="275" width="620" height="155" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="760" y="300" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">Diff View</text>
    <text x="465" y="322" font-size="10" fill="#374151">Side-by-side: v2 (left) | v3 (right)</text>
    <text x="465" y="340" font-size="10" fill="#374151">Inline diff: green = added, red = removed</text>
    <rect x="465" y="350" width="590" height="60" fill="white" stroke="#e2e8f0" stroke-width="1" rx="3"/>
    <text x="480" y="370" font-size="10" fill="#374151">You are a helpful assistant.</text>
    <text x="480" y="388" font-size="10" fill="#10b981">+ Please respond in JSON format.</text>
    <text x="480" y="406" font-size="10" fill="#ef4444" text-decoration="line-through">- Be concise in your answers.</text>
    <text x="465" y="424" font-size="9" fill="#a855f7">Unified diff (git-style) or visual split-pane — user preference</text>

    <rect x="450" y="445" width="620" height="110" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="760" y="468" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Evaluation Metrics per Version</text>
    <text x="465" y="490" font-size="10" fill="#374151">Run A/B test: 50% traffic to v3, 50% to v4</text>
    <text x="465" y="508" font-size="10" fill="#374151">Track: avg output tokens, latency, user rating, task success rate</text>
    <text x="465" y="526" font-size="10" fill="#374151">Champion: promote best-performing version to production</text>
    <text x="465" y="540" font-size="9" fill="#10b981">Rollback: one-click restore to any previous version if regression detected</text>
  </g>

  <rect x="30" y="490" width="400" height="58" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="3"/>
  <text x="50" y="510" font-size="11" fill="#374151"><tspan font-weight="bold">Versioning:</tspan> Immutable records. Never overwrite — always create new version.</text>
  <text x="50" y="528" font-size="11" fill="#374151"><tspan font-weight="bold">Variables:</tspan> {"{"}{"{"}customer_name{"}"}{"}"}, {"{"}{"{"}product{"}"}{"}"} — extract and surface in UI for templating.</text>
  <text x="50" y="543" font-size="9" fill="#6b7280">Tools: PromptLayer, LangSmith, Braintrust — dedicated prompt management platforms.</text>
</svg>
