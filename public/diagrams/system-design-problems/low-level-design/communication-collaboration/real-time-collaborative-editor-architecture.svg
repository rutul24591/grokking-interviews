<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Real-time Collaborative Editor — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">CRDT doc · Operation broadcast · Merge engine · Awareness &amp; undo</text>

  <!-- Section A: purple, top-left -->
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — CRDT DOCUMENT</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Yjs Doc</text>
  <text x="34" y="133" font-size="9" fill="#374151">Y.Doc: shared document root</text>
  <text x="34" y="148" font-size="9" fill="#374151">Y.Text: collaborative text</text>
  <text x="34" y="163" font-size="9" fill="#374151">Y.Map: key-value store</text>
  <text x="34" y="178" font-size="9" fill="#374151">Y.Array: ordered list</text>
  <text x="34" y="193" font-size="9" fill="#374151">Y.XmlFragment: rich text DOM</text>
  <text x="34" y="208" font-size="9" fill="#374151">transaction: batch operations</text>
  <text x="34" y="223" font-size="9" fill="#374151">observe: subscribe to changes</text>
  <text x="34" y="240" font-size="9" fill="#374151">snapshot: encode state at point</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Provider</text>
  <text x="236" y="133" font-size="9" fill="#374151">WebsocketProvider: sync via ws</text>
  <text x="236" y="148" font-size="9" fill="#374151">IndexeddbPersistence: offline</text>
  <text x="236" y="163" font-size="9" fill="#374151">awareness: presence + cursor</text>
  <text x="236" y="178" font-size="9" fill="#374151">origin: local vs remote changes</text>
  <text x="236" y="193" font-size="9" fill="#374151">synced: event on full sync</text>
  <text x="236" y="208" font-size="9" fill="#374151">room: docName on ws server</text>
  <text x="236" y="223" font-size="9" fill="#374151">params: auth token in headers</text>
  <text x="236" y="240" font-size="9" fill="#374151">gc: garbage collect tombstones</text>

  <!-- Section B: blue, top-right -->
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — OPERATION BROADCAST</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Update Flow</text>
  <text x="485" y="133" font-size="9" fill="#374151">local change → Y.Doc applies</text>
  <text x="485" y="148" font-size="9" fill="#374151">encodeStateAsUpdate() → delta</text>
  <text x="485" y="163" font-size="9" fill="#374151">send binary delta to server</text>
  <text x="485" y="178" font-size="9" fill="#374151">server: broadcast to all peers</text>
  <text x="485" y="193" font-size="9" fill="#374151">peer: Y.applyUpdate(doc, delta)</text>
  <text x="485" y="208" font-size="9" fill="#374151">binary: Uint8Array encoding</text>
  <text x="485" y="223" font-size="9" fill="#374151">size: typical delta 50–200 bytes</text>
  <text x="485" y="240" font-size="9" fill="#374151">persist: server stores all updates</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Network Layer</text>
  <text x="682" y="133" font-size="9" fill="#374151">reconnect: exp backoff 1s→30s</text>
  <text x="682" y="148" font-size="9" fill="#374151">resync: exchange state vectors</text>
  <text x="682" y="163" font-size="9" fill="#374151">sync-step1|sync-step2|update</text>
  <text x="682" y="178" font-size="9" fill="#374151">awareness: presence messages</text>
  <text x="682" y="193" font-size="9" fill="#374151">batch: buffer 50ms window</text>
  <text x="682" y="208" font-size="9" fill="#374151">offline: queue to IndexedDB</text>
  <text x="682" y="223" font-size="9" fill="#374151">compression: zlib on large msgs</text>
  <text x="682" y="240" font-size="9" fill="#374151">auth: JWT in ws connection</text>

  <!-- Arrow A→B -->
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Section C: green, bottom-left -->
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — MERGE ENGINE</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">CRDT Properties</text>
  <text x="34" y="358" font-size="9" fill="#374151">convergent: all reach same state</text>
  <text x="34" y="373" font-size="9" fill="#374151">commutative: order independent</text>
  <text x="34" y="388" font-size="9" fill="#374151">idempotent: apply twice = once</text>
  <text x="34" y="403" font-size="9" fill="#374151">no conflicts by design</text>
  <text x="34" y="418" font-size="9" fill="#374151">tombstone: delete = mark</text>
  <text x="34" y="433" font-size="9" fill="#374151">clock: logical Lamport time</text>
  <text x="34" y="448" font-size="9" fill="#374151">GC: remove old tombstones</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Binding</text>
  <text x="236" y="358" font-size="9" fill="#374151">ProseMirror: y-prosemirror</text>
  <text x="236" y="373" font-size="9" fill="#374151">CodeMirror: y-codemirror.next</text>
  <text x="236" y="388" font-size="9" fill="#374151">Quill: y-quill plugin</text>
  <text x="236" y="403" font-size="9" fill="#374151">Monaco: custom plugin</text>
  <text x="236" y="418" font-size="9" fill="#374151">binding: sync ops ↔ Y.Doc</text>
  <text x="236" y="433" font-size="9" fill="#374151">relative: cursor position maps</text>
  <text x="236" y="448" font-size="9" fill="#374151">transaction: batch local ops</text>

  <!-- Section D: amber, bottom-right -->
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — AWARENESS &amp; UNDO</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Awareness Protocol</text>
  <text x="485" y="358" font-size="9" fill="#374151">cursor: {user, color, anchor}</text>
  <text x="485" y="373" font-size="9" fill="#374151">broadcast: on selection change</text>
  <text x="485" y="388" font-size="9" fill="#374151">TTL: clear after 30s</text>
  <text x="485" y="403" font-size="9" fill="#374151">render: remote cursor highlights</text>
  <text x="485" y="418" font-size="9" fill="#374151">throttle: 50ms emit rate</text>
  <text x="485" y="433" font-size="9" fill="#374151">cleanup: on disconnect</text>
  <text x="485" y="448" font-size="9" fill="#374151">encode: MessagePack binary</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Undo Manager</text>
  <text x="682" y="358" font-size="9" fill="#374151">Y.UndoManager: local ops only</text>
  <text x="682" y="373" font-size="9" fill="#374151">undo: revert own operations</text>
  <text x="682" y="388" font-size="9" fill="#374151">redo: apply reverted ops</text>
  <text x="682" y="403" font-size="9" fill="#374151">scope: per Y.Text or whole doc</text>
  <text x="682" y="418" font-size="9" fill="#374151">clear: on disconnect</text>
  <text x="682" y="433" font-size="9" fill="#374151">trackedOrigins: filter local</text>
  <text x="682" y="448" font-size="9" fill="#374151">captureTimeout: 500ms merge</text>

  <!-- Arrows B→D, A→C, C→D -->
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Footer -->
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">CRDT: Yjs Y.Doc</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Sync: binary delta</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Reconnect: 1s→30s</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Undo: local ops only</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Awareness TTL: 30s</text>
</svg>
