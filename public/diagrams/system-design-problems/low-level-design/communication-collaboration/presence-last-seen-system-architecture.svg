<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Presence / Last-seen System — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Online state · Heartbeat · Status display · Privacy &amp; TTL</text>

  <!-- Section A: purple, top-left -->
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — PRESENCE STATE</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">PresenceRecord</text>
  <text x="34" y="133" font-size="9" fill="#374151">userId: string</text>
  <text x="34" y="148" font-size="9" fill="#374151">status: online|away|offline</text>
  <text x="34" y="163" font-size="9" fill="#374151">lastSeen: ISO timestamp</text>
  <text x="34" y="178" font-size="9" fill="#374151">device: web|mobile|desktop</text>
  <text x="34" y="193" font-size="9" fill="#374151">customStatus: string | null</text>
  <text x="34" y="208" font-size="9" fill="#374151">emoji: status emoji</text>
  <text x="34" y="223" font-size="9" fill="#374151">expiresAt: custom status expiry</text>
  <text x="34" y="240" font-size="9" fill="#374151">sessionId: per-tab identifier</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Status Rules</text>
  <text x="236" y="133" font-size="9" fill="#374151">online: heartbeat within 30s</text>
  <text x="236" y="148" font-size="9" fill="#374151">away: no activity for 5min</text>
  <text x="236" y="163" font-size="9" fill="#374151">offline: missed 2× ping = 60s</text>
  <text x="236" y="178" font-size="9" fill="#374151">manual: user sets Do Not Disturb</text>
  <text x="236" y="193" font-size="9" fill="#374151">focus: DND + busy indication</text>
  <text x="236" y="208" font-size="9" fill="#374151">invisible: online but shows offline</text>
  <text x="236" y="223" font-size="9" fill="#374151">activity: track mouse/key events</text>
  <text x="236" y="240" font-size="9" fill="#374151">multi-device: merge statuses</text>

  <!-- Section B: blue, top-right -->
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — HEARTBEAT</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Client Heartbeat</text>
  <text x="485" y="133" font-size="9" fill="#374151">send ping every 20s via ws</text>
  <text x="485" y="148" font-size="9" fill="#374151">tab hidden: pause heartbeat</text>
  <text x="485" y="163" font-size="9" fill="#374151">tab visible: resume + send now</text>
  <text x="485" y="178" font-size="9" fill="#374151">unload: send offline event</text>
  <text x="485" y="193" font-size="9" fill="#374151">payload: {userId, sessionId, ts}</text>
  <text x="485" y="208" font-size="9" fill="#374151">activity: track last user action</text>
  <text x="485" y="223" font-size="9" fill="#374151">idle: away after 5min no action</text>
  <text x="485" y="240" font-size="9" fill="#374151">compress: 1 byte ping message</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Server TTL</text>
  <text x="682" y="133" font-size="9" fill="#374151">mark offline: no ping &gt; 60s</text>
  <text x="682" y="148" font-size="9" fill="#374151">Redis: expire key at 60s</text>
  <text x="682" y="163" font-size="9" fill="#374151">recovery: re-online on next ping</text>
  <text x="682" y="178" font-size="9" fill="#374151">pubsub: broadcast status change</text>
  <text x="682" y="193" font-size="9" fill="#374151">SET NX: atomic presence claim</text>
  <text x="682" y="208" font-size="9" fill="#374151">EXPIRE: rolling TTL on ping</text>
  <text x="682" y="223" font-size="9" fill="#374151">channel: user:${userId}:presence</text>
  <text x="682" y="240" font-size="9" fill="#374151">fan-out: notify subscribers</text>

  <!-- Arrow A→B -->
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Section C: green, bottom-left -->
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — STATUS DISPLAY</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Presence Indicator</text>
  <text x="34" y="358" font-size="9" fill="#374151">green dot: online</text>
  <text x="34" y="373" font-size="9" fill="#374151">yellow dot: away</text>
  <text x="34" y="388" font-size="9" fill="#374151">grey: offline</text>
  <text x="34" y="403" font-size="9" fill="#374151">animated: pulse for online</text>
  <text x="34" y="418" font-size="9" fill="#374151">tooltip: "Last seen 2h ago"</text>
  <text x="34" y="433" font-size="9" fill="#374151">size: 8px dot on avatar</text>
  <text x="34" y="448" font-size="9" fill="#374151">ring: border color on avatar</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Last-seen Text</text>
  <text x="236" y="358" font-size="9" fill="#374151">"Just now" (&lt;1min)</text>
  <text x="236" y="373" font-size="9" fill="#374151">"5 minutes ago"</text>
  <text x="236" y="388" font-size="9" fill="#374151">"Today at 3:45pm"</text>
  <text x="236" y="403" font-size="9" fill="#374151">"Yesterday"</text>
  <text x="236" y="418" font-size="9" fill="#374151">"Mar 15"</text>
  <text x="236" y="433" font-size="9" fill="#374151">hide: if user disabled</text>
  <text x="236" y="448" font-size="9" fill="#374151">locale: user timezone format</text>

  <!-- Section D: amber, bottom-right -->
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — PRIVACY &amp; SCALE</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Privacy Controls</text>
  <text x="485" y="358" font-size="9" fill="#374151">show: everyone|contacts|nobody</text>
  <text x="485" y="373" font-size="9" fill="#374151">granular: hide last-seen only</text>
  <text x="485" y="388" font-size="9" fill="#374151">mutual: both share to see</text>
  <text x="485" y="403" font-size="9" fill="#374151">hide: return null in API</text>
  <text x="485" y="418" font-size="9" fill="#374151">blocked: always hide from block</text>
  <text x="485" y="433" font-size="9" fill="#374151">DND: suppress read receipts</text>
  <text x="485" y="448" font-size="9" fill="#374151">audit: log privacy setting changes</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Scale</text>
  <text x="682" y="358" font-size="9" fill="#374151">Redis pub/sub: fan-out changes</text>
  <text x="682" y="373" font-size="9" fill="#374151">batch: group N updates per ws</text>
  <text x="682" y="388" font-size="9" fill="#374151">on-demand: subscribe visible</text>
  <text x="682" y="403" font-size="9" fill="#374151">lazy: load last-seen on hover</text>
  <text x="682" y="418" font-size="9" fill="#374151">shard: Redis cluster by userId</text>
  <text x="682" y="433" font-size="9" fill="#374151">cache: 5s client-side TTL</text>
  <text x="682" y="448" font-size="9" fill="#374151">cold start: REST for initial load</text>

  <!-- Arrows B→D, A→C, C→D -->
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Footer -->
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Heartbeat: every 20s</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Away: 5min inactivity</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Offline TTL: 60s</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Last-seen: user-controlled</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Redis: pub/sub fan-out</text>
</svg>
