<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Live Cursor / Presence System — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Cursor state · Broadcast channel · Throttle · Render &amp; cleanup</text>

  <!-- Section A: purple, top-left -->
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — CURSOR STATE</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">CursorPayload</text>
  <text x="34" y="133" font-size="9" fill="#374151">clientId: string</text>
  <text x="34" y="148" font-size="9" fill="#374151">userId: string</text>
  <text x="34" y="163" font-size="9" fill="#374151">name: string</text>
  <text x="34" y="178" font-size="9" fill="#374151">color: string</text>
  <text x="34" y="193" font-size="9" fill="#374151">position: {x,y} | {row,col}</text>
  <text x="34" y="208" font-size="9" fill="#374151">selection: Range | null</text>
  <text x="34" y="223" font-size="9" fill="#374151">lastSeen: timestamp</text>
  <text x="34" y="240" font-size="9" fill="#374151">avatar: URL | null</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Presence Store</text>
  <text x="236" y="133" font-size="9" fill="#374151">cursors: Map&lt;clientId, Payload&gt;</text>
  <text x="236" y="148" font-size="9" fill="#374151">add/update on message</text>
  <text x="236" y="163" font-size="9" fill="#374151">remove on leave event</text>
  <text x="236" y="178" font-size="9" fill="#374151">prune: delete if lastSeen &gt; 30s</text>
  <text x="236" y="193" font-size="9" fill="#374151">self: exclude own clientId</text>
  <text x="236" y="208" font-size="9" fill="#374151">count: online users display</text>
  <text x="236" y="223" font-size="9" fill="#374151">list: sorted by lastSeen desc</text>
  <text x="236" y="240" font-size="9" fill="#374151">max: cap at 50 visible cursors</text>

  <!-- Section B: blue, top-right -->
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — BROADCAST</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">WebSocket Channel</text>
  <text x="485" y="133" font-size="9" fill="#374151">ws://api/presence?docId=</text>
  <text x="485" y="148" font-size="9" fill="#374151">emit cursor-move events</text>
  <text x="485" y="163" font-size="9" fill="#374151">throttle: 50ms (20fps)</text>
  <text x="485" y="178" font-size="9" fill="#374151">send on: mousemove/keydown</text>
  <text x="485" y="193" font-size="9" fill="#374151">binary: MessagePack encoding</text>
  <text x="485" y="208" font-size="9" fill="#374151">room: server-side grouping</text>
  <text x="485" y="223" font-size="9" fill="#374151">fan-out: server to all peers</text>
  <text x="485" y="240" font-size="9" fill="#374151">auth: JWT in ws handshake</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Channel Alternatives</text>
  <text x="682" y="133" font-size="9" fill="#374151">BroadcastChannel: same-origin</text>
  <text x="682" y="148" font-size="9" fill="#374151">WebRTC: P2P low latency</text>
  <text x="682" y="163" font-size="9" fill="#374151">SSE: server fan-out</text>
  <text x="682" y="178" font-size="9" fill="#374151">Yjs awareness: built-in</text>
  <text x="682" y="193" font-size="9" fill="#374151">polling: fallback 2s interval</text>
  <text x="682" y="208" font-size="9" fill="#374151">CRDT awareness: conflict-free</text>
  <text x="682" y="223" font-size="9" fill="#374151">edge: Cloudflare Durable Objects</text>
  <text x="682" y="240" font-size="9" fill="#374151">Partykit: hosted room server</text>

  <!-- Arrow A→B -->
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Section C: green, bottom-left -->
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — THROTTLE &amp; INTERPOLATE</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Client Throttle</text>
  <text x="34" y="358" font-size="9" fill="#374151">throttle emit: 50ms window</text>
  <text x="34" y="373" font-size="9" fill="#374151">skip: identical position</text>
  <text x="34" y="388" font-size="9" fill="#374151">batch: queue moves, flush</text>
  <text x="34" y="403" font-size="9" fill="#374151">pause: tab hidden → stop</text>
  <text x="34" y="418" font-size="9" fill="#374151">resume: tab visible + send now</text>
  <text x="34" y="433" font-size="9" fill="#374151">diff: only send delta position</text>
  <text x="34" y="448" font-size="9" fill="#374151">idle: reduce to 1fps after 5s</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Remote Interpolation</text>
  <text x="236" y="358" font-size="9" fill="#374151">lerp: smooth to new position</text>
  <text x="236" y="373" font-size="9" fill="#374151">spring: physics-based easing</text>
  <text x="236" y="388" font-size="9" fill="#374151">max jump: teleport if &gt;200px</text>
  <text x="236" y="403" font-size="9" fill="#374151">lag: +100ms delay buffer</text>
  <text x="236" y="418" font-size="9" fill="#374151">frame: rAF for smooth anim</text>
  <text x="236" y="433" font-size="9" fill="#374151">predict: extrapolate velocity</text>
  <text x="236" y="448" font-size="9" fill="#374151">snap: on selection change</text>

  <!-- Section D: amber, bottom-right -->
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — RENDER &amp; CLEANUP</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Cursor Renderer</text>
  <text x="485" y="358" font-size="9" fill="#374151">absolute div per cursor</text>
  <text x="485" y="373" font-size="9" fill="#374151">color: hash(clientId) → hue</text>
  <text x="485" y="388" font-size="9" fill="#374151">label: user name + color tag</text>
  <text x="485" y="403" font-size="9" fill="#374151">z-index: above content</text>
  <text x="485" y="418" font-size="9" fill="#374151">pointer-events: none</text>
  <text x="485" y="433" font-size="9" fill="#374151">fade: label after 3s idle</text>
  <text x="485" y="448" font-size="9" fill="#374151">portal: render outside editor</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Cleanup</text>
  <text x="682" y="358" font-size="9" fill="#374151">leave: send cursor-leave event</text>
  <text x="682" y="373" font-size="9" fill="#374151">disconnect: server broadcasts</text>
  <text x="682" y="388" font-size="9" fill="#374151">TTL: prune after 30s no update</text>
  <text x="682" y="403" font-size="9" fill="#374151">reconnect: re-broadcast position</text>
  <text x="682" y="418" font-size="9" fill="#374151">unload: beforeunload event</text>
  <text x="682" y="433" font-size="9" fill="#374151">animation: exit fade on remove</text>
  <text x="682" y="448" font-size="9" fill="#374151">tab switch: pause rendering</text>

  <!-- Arrows B→D, A→C, C→D -->
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Footer -->
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Throttle: 50ms (20fps)</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Prune TTL: 30s</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Lerp: smooth remote cursors</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Color: hash(clientId)</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Max jump: 200px teleport</text>
</svg>
