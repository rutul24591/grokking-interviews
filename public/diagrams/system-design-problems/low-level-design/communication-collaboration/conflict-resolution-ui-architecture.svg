<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Conflict Resolution UI — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Conflict detection · Diff view · Merge strategy · Accept &amp; publish</text>

  <!-- Section A: purple, top-left -->
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — CONFLICT DETECTION</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Version Vectors</text>
  <text x="34" y="133" font-size="9" fill="#374151">client: {clientId, clock} Lamport</text>
  <text x="34" y="148" font-size="9" fill="#374151">server: reject if clock &lt; last seen</text>
  <text x="34" y="163" font-size="9" fill="#374151">conflict: two writes same field</text>
  <text x="34" y="178" font-size="9" fill="#374151">mark: conflictedFields: Set&lt;string&gt;</text>
  <text x="34" y="193" font-size="9" fill="#374151">vector: {clientId: seqNum}</text>
  <text x="34" y="208" font-size="9" fill="#374151">concurrent: both clocks advanced</text>
  <text x="34" y="223" font-size="9" fill="#374151">causally before: one clock wins</text>
  <text x="34" y="240" font-size="9" fill="#374151">hash: detect field-level change</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Conflict Metadata</text>
  <text x="236" y="133" font-size="9" fill="#374151">docId: string</text>
  <text x="236" y="148" font-size="9" fill="#374151">fieldId: string</text>
  <text x="236" y="163" font-size="9" fill="#374151">localValue: any</text>
  <text x="236" y="178" font-size="9" fill="#374151">remoteValue: any</text>
  <text x="236" y="193" font-size="9" fill="#374151">localTs / remoteTs: timestamp</text>
  <text x="236" y="208" font-size="9" fill="#374151">localAuthor / remoteAuthor</text>
  <text x="236" y="223" font-size="9" fill="#374151">baseValue: common ancestor</text>
  <text x="236" y="240" font-size="9" fill="#374151">status: pending|resolved</text>

  <!-- Section B: blue, top-right -->
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — DIFF VIEW</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Field-level Diff</text>
  <text x="485" y="133" font-size="9" fill="#374151">side-by-side: local vs remote</text>
  <text x="485" y="148" font-size="9" fill="#374151">highlight changed tokens</text>
  <text x="485" y="163" font-size="9" fill="#374151">unchanged: dim text</text>
  <text x="485" y="178" font-size="9" fill="#374151">conflict badge: orange dot</text>
  <text x="485" y="193" font-size="9" fill="#374151">expand: click for full diff</text>
  <text x="485" y="208" font-size="9" fill="#374151">word-level diff algorithm</text>
  <text x="485" y="223" font-size="9" fill="#374151">ins: green highlight</text>
  <text x="485" y="240" font-size="9" fill="#374151">del: red strikethrough</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Rich Text Diff</text>
  <text x="682" y="133" font-size="9" fill="#374151">Slate/ProseMirror diff</text>
  <text x="682" y="148" font-size="9" fill="#374151">char-level: ins/del marks</text>
  <text x="682" y="163" font-size="9" fill="#374151">author color coding</text>
  <text x="682" y="178" font-size="9" fill="#374151">accept range: per-block</text>
  <text x="682" y="193" font-size="9" fill="#374151">scroll: sync both panels</text>
  <text x="682" y="208" font-size="9" fill="#374151">unified: single-panel toggle</text>
  <text x="682" y="223" font-size="9" fill="#374151">line numbers: show position</text>
  <text x="682" y="240" font-size="9" fill="#374151">copy: copy either side</text>

  <!-- Arrow A→B -->
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Section C: green, bottom-left -->
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — MERGE STRATEGIES</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Auto-merge Rules</text>
  <text x="34" y="358" font-size="9" fill="#374151">non-overlapping: merge silently</text>
  <text x="34" y="373" font-size="9" fill="#374151">same field: flag for manual</text>
  <text x="34" y="388" font-size="9" fill="#374151">list append: concat both</text>
  <text x="34" y="403" font-size="9" fill="#374151">numeric: take max or sum</text>
  <text x="34" y="418" font-size="9" fill="#374151">text: 3-way merge</text>
  <text x="34" y="433" font-size="9" fill="#374151">schema: field-type aware merge</text>
  <text x="34" y="448" font-size="9" fill="#374151">log: audit trail of auto-merges</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Manual Resolution</text>
  <text x="236" y="358" font-size="9" fill="#374151">pick mine: apply local value</text>
  <text x="236" y="373" font-size="9" fill="#374151">pick theirs: apply remote value</text>
  <text x="236" y="388" font-size="9" fill="#374151">merge: editor with both values</text>
  <text x="236" y="403" font-size="9" fill="#374151">discard: revert to base value</text>
  <text x="236" y="418" font-size="9" fill="#374151">undo: re-open conflict</text>
  <text x="236" y="433" font-size="9" fill="#374151">navigate: prev/next conflict</text>
  <text x="236" y="448" font-size="9" fill="#374151">batch: resolve-all like-type</text>

  <!-- Section D: amber, bottom-right -->
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — ACCEPT &amp; PUBLISH</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Resolution Flow</text>
  <text x="485" y="358" font-size="9" fill="#374151">resolve all: enable Publish btn</text>
  <text x="485" y="373" font-size="9" fill="#374151">partial: remaining count badge</text>
  <text x="485" y="388" font-size="9" fill="#374151">undo resolution: re-open</text>
  <text x="485" y="403" font-size="9" fill="#374151">timeout: auto-accept after 10min</text>
  <text x="485" y="418" font-size="9" fill="#374151">progress bar: N/M resolved</text>
  <text x="485" y="433" font-size="9" fill="#374151">jump: navigate to next conflict</text>
  <text x="485" y="448" font-size="9" fill="#374151">lock: prevent edit during resolve</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Publish</text>
  <text x="682" y="358" font-size="9" fill="#374151">POST /resolve {docId, resolutions}</text>
  <text x="682" y="373" font-size="9" fill="#374151">optimistic: apply locally first</text>
  <text x="682" y="388" font-size="9" fill="#374151">failure: rollback + re-show</text>
  <text x="682" y="403" font-size="9" fill="#374151">success: increment version vector</text>
  <text x="682" y="418" font-size="9" fill="#374151">notify: broadcast to collaborators</text>
  <text x="682" y="433" font-size="9" fill="#374151">history: save resolved snapshot</text>
  <text x="682" y="448" font-size="9" fill="#374151">confirm: modal before publish</text>

  <!-- Arrows B→D, A→C, C→D -->
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Footer -->
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Clock: Lamport timestamps</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Auto-merge: non-overlapping</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Manual: pick/merge/discard</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Timeout: 10min auto-accept</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Publish: POST /resolve</text>
</svg>
