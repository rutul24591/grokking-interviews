<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Typing Indicator System — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Typing state · Throttle broadcast · Display · Timeout &amp; cleanup</text>

  <!-- Section A: purple, top-left -->
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — TYPING STATE</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">TypingPayload</text>
  <text x="34" y="133" font-size="9" fill="#374151">roomId | threadId: string</text>
  <text x="34" y="148" font-size="9" fill="#374151">userId: string</text>
  <text x="34" y="163" font-size="9" fill="#374151">displayName: string</text>
  <text x="34" y="178" font-size="9" fill="#374151">isTyping: boolean</text>
  <text x="34" y="193" font-size="9" fill="#374151">ts: Date.now()</text>
  <text x="34" y="208" font-size="9" fill="#374151">channelType: dm|group|thread</text>
  <text x="34" y="223" font-size="9" fill="#374151">composerId: input element id</text>
  <text x="34" y="240" font-size="9" fill="#374151">msgType: text|voice|file</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Client State</text>
  <text x="236" y="133" font-size="9" fill="#374151">localTyping: boolean</text>
  <text x="236" y="148" font-size="9" fill="#374151">typingUsers: Map&lt;userId, {name,ts}&gt;</text>
  <text x="236" y="163" font-size="9" fill="#374151">selfSuppressed: true (no own)</text>
  <text x="236" y="178" font-size="9" fill="#374151">timers: Map&lt;userId, timeout&gt;</text>
  <text x="236" y="193" font-size="9" fill="#374151">lastEmit: timestamp</text>
  <text x="236" y="208" font-size="9" fill="#374151">isComposing: IME aware</text>
  <text x="236" y="223" font-size="9" fill="#374151">maxDisplay: cap at 5 users</text>
  <text x="236" y="240" font-size="9" fill="#374151">order: FIFO insert order</text>

  <!-- Section B: blue, top-right -->
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — THROTTLE BROADCAST</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Emit Strategy</text>
  <text x="485" y="133" font-size="9" fill="#374151">on keydown: isTyping=true</text>
  <text x="485" y="148" font-size="9" fill="#374151">throttle: every 2s while typing</text>
  <text x="485" y="163" font-size="9" fill="#374151">on blur/send: emit false now</text>
  <text x="485" y="178" font-size="9" fill="#374151">paused: no event if tab hidden</text>
  <text x="485" y="193" font-size="9" fill="#374151">IME: compositionstart/end</text>
  <text x="485" y="208" font-size="9" fill="#374151">paste: single emit on paste</text>
  <text x="485" y="223" font-size="9" fill="#374151">focus: emit false on blur</text>
  <text x="485" y="240" font-size="9" fill="#374151">emoji: compositionend aware</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Debounce Stop</text>
  <text x="682" y="133" font-size="9" fill="#374151">debounce 3s after last keydown</text>
  <text x="682" y="148" font-size="9" fill="#374151">emit isTyping=false</text>
  <text x="682" y="163" font-size="9" fill="#374151">server-side TTL: clear at 5s</text>
  <text x="682" y="178" font-size="9" fill="#374151">both: client + server for safety</text>
  <text x="682" y="193" font-size="9" fill="#374151">cancel: clearTimeout on keydown</text>
  <text x="682" y="208" font-size="9" fill="#374151">reset: on message send</text>
  <text x="682" y="223" font-size="9" fill="#374151">cleanup: on component unmount</text>
  <text x="682" y="240" font-size="9" fill="#374151">send: explicit false on empty</text>

  <!-- Arrow A→B -->
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Section C: green, bottom-left -->
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — SERVER RELAY</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Fan-out</text>
  <text x="34" y="358" font-size="9" fill="#374151">ws message from client</text>
  <text x="34" y="373" font-size="9" fill="#374151">broadcast to room: excl. sender</text>
  <text x="34" y="388" font-size="9" fill="#374151">Redis pub/sub: per roomId</text>
  <text x="34" y="403" font-size="9" fill="#374151">batch: 100ms window events</text>
  <text x="34" y="418" font-size="9" fill="#374151">dedup: one event per user</text>
  <text x="34" y="433" font-size="9" fill="#374151">scale: horizontal ws servers</text>
  <text x="34" y="448" font-size="9" fill="#374151">sticky: same server per room</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Persistence</text>
  <text x="236" y="358" font-size="9" fill="#374151">do NOT persist: ephemeral</text>
  <text x="236" y="373" font-size="9" fill="#374151">no DB write for typing events</text>
  <text x="236" y="388" font-size="9" fill="#374151">Redis: expire key 5s</text>
  <text x="236" y="403" font-size="9" fill="#374151">recovery: no replay needed</text>
  <text x="236" y="418" font-size="9" fill="#374151">audit: no typing log</text>
  <text x="236" y="433" font-size="9" fill="#374151">E2E: encrypt if needed</text>
  <text x="236" y="448" font-size="9" fill="#374151">privacy: GDPR no-store</text>

  <!-- Section D: amber, bottom-right -->
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — DISPLAY &amp; CLEANUP</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Indicator UI</text>
  <text x="485" y="358" font-size="9" fill="#374151">"Alice is typing..."</text>
  <text x="485" y="373" font-size="9" fill="#374151">"Alice and Bob are typing..."</text>
  <text x="485" y="388" font-size="9" fill="#374151">3+: "Several people typing..."</text>
  <text x="485" y="403" font-size="9" fill="#374151">animation: 3-dot bounce</text>
  <text x="485" y="418" font-size="9" fill="#374151">position: below message list</text>
  <text x="485" y="433" font-size="9" fill="#374151">height: reserve space to avoid</text>
  <text x="485" y="448" font-size="9" fill="#374151">layout shift</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Timeout Cleanup</text>
  <text x="682" y="358" font-size="9" fill="#374151">prune: remove if ts &gt; 5s ago</text>
  <text x="682" y="373" font-size="9" fill="#374151">setInterval: check every 1s</text>
  <text x="682" y="388" font-size="9" fill="#374151">explicit: remove on isTyping=false</text>
  <text x="682" y="403" font-size="9" fill="#374151">disconnect: server sends stop</text>
  <text x="682" y="418" font-size="9" fill="#374151">fade: animate out on remove</text>
  <text x="682" y="433" font-size="9" fill="#374151">prevent: don't flicker</text>
  <text x="682" y="448" font-size="9" fill="#374151">debounce: 200ms before hide</text>

  <!-- Arrows B→D, A→C, C→D -->
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Footer -->
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Throttle: emit every 2s</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Debounce stop: 3s after last key</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Server TTL: 5s</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Display: "several" at 3+ users</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">No persistence</text>
</svg>
