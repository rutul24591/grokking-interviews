<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Real-time Notification Delivery — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Event model · Fan-out · Client channel · Read state &amp; badge</text>

  <!-- Section A: purple, top-left -->
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — EVENT MODEL</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">NotificationEvent</text>
  <text x="34" y="133" font-size="9" fill="#374151">id: uuid</text>
  <text x="34" y="148" font-size="9" fill="#374151">type: mention|reply|like|system</text>
  <text x="34" y="163" font-size="9" fill="#374151">actorId: string</text>
  <text x="34" y="178" font-size="9" fill="#374151">targetId: string</text>
  <text x="34" y="193" font-size="9" fill="#374151">targetType: post|comment|doc</text>
  <text x="34" y="208" font-size="9" fill="#374151">payload: {} metadata</text>
  <text x="34" y="223" font-size="9" fill="#374151">ts: timestamp</text>
  <text x="34" y="240" font-size="9" fill="#374151">priority: high|normal</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Routing Rules</text>
  <text x="236" y="133" font-size="9" fill="#374151">mention → push + ws</text>
  <text x="236" y="148" font-size="9" fill="#374151">like → ws only</text>
  <text x="236" y="163" font-size="9" fill="#374151">system → push + email + ws</text>
  <text x="236" y="178" font-size="9" fill="#374151">priority high: bypass rate limit</text>
  <text x="236" y="193" font-size="9" fill="#374151">mute: per user×type pref</text>
  <text x="236" y="208" font-size="9" fill="#374151">digest: batch low-priority</text>
  <text x="236" y="223" font-size="9" fill="#374151">quiet hours: delay delivery</text>
  <text x="236" y="240" font-size="9" fill="#374151">unsubscribe: per-type toggle</text>

  <!-- Section B: blue, top-right -->
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — SERVER FAN-OUT</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Publish</text>
  <text x="485" y="133" font-size="9" fill="#374151">producer: service → queue</text>
  <text x="485" y="148" font-size="9" fill="#374151">consumer: notification svc</text>
  <text x="485" y="163" font-size="9" fill="#374151">Redis: check user online status</text>
  <text x="485" y="178" font-size="9" fill="#374151">online → ws delivery</text>
  <text x="485" y="193" font-size="9" fill="#374151">offline → push queue</text>
  <text x="485" y="208" font-size="9" fill="#374151">dedup: same event 1min window</text>
  <text x="485" y="223" font-size="9" fill="#374151">rate: max 10/min per user</text>
  <text x="485" y="240" font-size="9" fill="#374151">retry: 3× on delivery failure</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Delivery Channels</text>
  <text x="682" y="133" font-size="9" fill="#374151">WebSocket: instant in-app</text>
  <text x="682" y="148" font-size="9" fill="#374151">Push (FCM/APNs): mobile</text>
  <text x="682" y="163" font-size="9" fill="#374151">Email: digest or immediate</text>
  <text x="682" y="178" font-size="9" fill="#374151">SMS: high-priority only</text>
  <text x="682" y="193" font-size="9" fill="#374151">in-app inbox: always persist</text>
  <text x="682" y="208" font-size="9" fill="#374151">Slack: webhook integration</text>
  <text x="682" y="223" font-size="9" fill="#374151">desktop: Electron IPC</text>
  <text x="682" y="240" font-size="9" fill="#374151">preference: per-channel opt-in</text>

  <!-- Arrow A→B -->
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Section C: green, bottom-left -->
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — CLIENT CHANNEL</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">WebSocket Delivery</text>
  <text x="34" y="358" font-size="9" fill="#374151">ws: {type: "notification", data}</text>
  <text x="34" y="373" font-size="9" fill="#374151">client: push to store</text>
  <text x="34" y="388" font-size="9" fill="#374151">toast: show if app foreground</text>
  <text x="34" y="403" font-size="9" fill="#374151">sound: optional beep</text>
  <text x="34" y="418" font-size="9" fill="#374151">animate: slide-in toast</text>
  <text x="34" y="433" font-size="9" fill="#374151">action: click → navigate</text>
  <text x="34" y="448" font-size="9" fill="#374151">dismiss: swipe or × button</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Push Fallback</text>
  <text x="236" y="358" font-size="9" fill="#374151">Service Worker: push event</text>
  <text x="236" y="373" font-size="9" fill="#374151">show Notification API</text>
  <text x="236" y="388" font-size="9" fill="#374151">click: focus tab + navigate</text>
  <text x="236" y="403" font-size="9" fill="#374151">offline: queue in SW</text>
  <text x="236" y="418" font-size="9" fill="#374151">online: process SW queue</text>
  <text x="236" y="433" font-size="9" fill="#374151">permission: request on opt-in</text>
  <text x="236" y="448" font-size="9" fill="#374151">badge: update app icon count</text>

  <!-- Section D: amber, bottom-right -->
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — READ STATE &amp; BADGE</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Read Tracking</text>
  <text x="485" y="358" font-size="9" fill="#374151">mark read: PATCH /notifs/:id</text>
  <text x="485" y="373" font-size="9" fill="#374151">mark all: PATCH ?read=true</text>
  <text x="485" y="388" font-size="9" fill="#374151">optimistic: update store now</text>
  <text x="485" y="403" font-size="9" fill="#374151">server: persist read_at</text>
  <text x="485" y="418" font-size="9" fill="#374151">rollback: on 4xx error</text>
  <text x="485" y="433" font-size="9" fill="#374151">auto: mark on view-in-panel</text>
  <text x="485" y="448" font-size="9" fill="#374151">grouping: collapse same-type</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Badge Count</text>
  <text x="682" y="358" font-size="9" fill="#374151">unread: GET /notifs?unread=true</text>
  <text x="682" y="373" font-size="9" fill="#374151">ws: badge-update {count}</text>
  <text x="682" y="388" font-size="9" fill="#374151">document.title: prepend (N)</text>
  <text x="682" y="403" font-size="9" fill="#374151">favicon: badge overlay</text>
  <text x="682" y="418" font-size="9" fill="#374151">reset: on mark-all-read</text>
  <text x="682" y="433" font-size="9" fill="#374151">cap: show 99+ beyond 99</text>
  <text x="682" y="448" font-size="9" fill="#374151">sync: match across tabs</text>

  <!-- Arrows B→D, A→C, C→D -->
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Footer -->
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Fan-out: queue consumer</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Channels: ws+push+email</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Push: FCM/APNs</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Badge: ws badge-update event</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Read: PATCH optimistic</text>
</svg>
