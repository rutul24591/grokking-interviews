<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Theme / Theming System — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Token layers · CSS variable injection · SSR strategy · Dark mode &amp; persist</text>
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — TOKEN LAYERS</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">3-Tier Hierarchy</text>
  <text x="34" y="133" font-size="9" fill="#374151">Primitive: raw values</text>
  <text x="34" y="148" font-size="9" fill="#374151">  --blue-500: #3b82f6</text>
  <text x="34" y="163" font-size="9" fill="#374151">  --space-4: 16px</text>
  <text x="34" y="178" font-size="9" fill="#374151">Semantic: intent-named</text>
  <text x="34" y="193" font-size="9" fill="#374151">  --color-primary: var(--blue-500)</text>
  <text x="34" y="208" font-size="9" fill="#374151">  --color-bg: var(--gray-50)</text>
  <text x="34" y="223" font-size="9" fill="#374151">Component: scoped tokens</text>
  <text x="34" y="240" font-size="9" fill="#374151">  --btn-bg: var(--color-primary)</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Token Schema</text>
  <text x="236" y="133" font-size="9" fill="#374151">Design tokens: JSON source</text>
  <text x="236" y="148" font-size="9" fill="#374151">  { "color.primary": "#..." }</text>
  <text x="236" y="163" font-size="9" fill="#374151">Style Dictionary: transform</text>
  <text x="236" y="178" font-size="9" fill="#374151">  tokens → CSS vars at build</text>
  <text x="236" y="193" font-size="9" fill="#374151">Theme obj: { light, dark, brand }</text>
  <text x="236" y="208" font-size="9" fill="#374151">  each overrides semantic layer</text>
  <text x="236" y="223" font-size="9" fill="#374151">Custom theme: merge + override</text>
  <text x="236" y="240" font-size="9" fill="#374151">  partial override supported</text>
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — CSS VARIABLE INJECTION</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Injection Strategy</text>
  <text x="485" y="133" font-size="9" fill="#374151">:root {} primitive + semantic</text>
  <text x="485" y="148" font-size="9" fill="#374151">  all themes inherit primitives</text>
  <text x="485" y="163" font-size="9" fill="#374151">[data-theme="dark"] {} overrides</text>
  <text x="485" y="178" font-size="9" fill="#374151">  semantic layer for dark mode</text>
  <text x="485" y="193" font-size="9" fill="#374151">Dynamic: inject &lt;style&gt; tag</text>
  <text x="485" y="208" font-size="9" fill="#374151">  set root.style.setProperty()</text>
  <text x="485" y="225" font-size="9" fill="#374151">  for runtime theme switching</text>
  <text x="485" y="240" font-size="9" fill="#374151">Scoped: [data-brand="acme"]</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">ThemeProvider</text>
  <text x="682" y="133" font-size="9" fill="#374151">Context: current theme name</text>
  <text x="682" y="148" font-size="9" fill="#374151">useTheme(): { theme, setTheme }</text>
  <text x="682" y="163" font-size="9" fill="#374151">Set data-theme on &lt;html&gt;</text>
  <text x="682" y="178" font-size="9" fill="#374151">  or root container element</text>
  <text x="682" y="193" font-size="9" fill="#374151">No re-render: CSS handles swap</text>
  <text x="682" y="208" font-size="9" fill="#374151">  var() resolves at paint time</text>
  <text x="682" y="225" font-size="9" fill="#374151">Transition: 200ms color change</text>
  <text x="682" y="240" font-size="9" fill="#374151">  * { transition: color 200ms }</text>
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — SSR STRATEGY</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Flash Prevention</text>
  <text x="34" y="358" font-size="9" fill="#374151">Problem: FOUC on hydration</text>
  <text x="34" y="373" font-size="9" fill="#374151">Solution A: blocking script</text>
  <text x="34" y="388" font-size="9" fill="#374151">  read localStorage before paint</text>
  <text x="34" y="403" font-size="9" fill="#374151">  set data-theme synchronously</text>
  <text x="34" y="418" font-size="9" fill="#374151">Solution B: cookie + SSR class</text>
  <text x="34" y="433" font-size="9" fill="#374151">  server reads cookie, emits class</text>
  <text x="34" y="448" font-size="9" fill="#374151">  no hydration mismatch</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">SSR-safe Pattern</text>
  <text x="236" y="358" font-size="9" fill="#374151">Initial render: system default</text>
  <text x="236" y="373" font-size="9" fill="#374151">  or server-resolved value</text>
  <text x="236" y="388" font-size="9" fill="#374151">suppressHydrationWarning on el</text>
  <text x="236" y="403" font-size="9" fill="#374151">  data-theme set in script</text>
  <text x="236" y="418" font-size="9" fill="#374151">Next.js: script strategy="beforeInteractive"</text>
  <text x="236" y="433" font-size="9" fill="#374151">  runs before React hydrates</text>
  <text x="236" y="448" font-size="9" fill="#374151">typeof window guard in store</text>
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — DARK MODE &amp; PERSIST</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Dark Mode Logic</text>
  <text x="485" y="358" font-size="9" fill="#374151">mode: light | dark | system</text>
  <text x="485" y="373" font-size="9" fill="#374151">system: matchMedia(prefers-dark)</text>
  <text x="485" y="388" font-size="9" fill="#374151">  addEventListener change event</text>
  <text x="485" y="403" font-size="9" fill="#374151">Resolved: system → actual value</text>
  <text x="485" y="418" font-size="9" fill="#374151">  used to set data-theme attr</text>
  <text x="485" y="433" font-size="9" fill="#374151">Toggle: cycles light→dark→system</text>
  <text x="485" y="448" font-size="9" fill="#374151">Icon: sun / moon / auto indicator</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Persistence</text>
  <text x="682" y="358" font-size="9" fill="#374151">localStorage key: "theme"</text>
  <text x="682" y="373" font-size="9" fill="#374151">  value: "light"|"dark"|"system"</text>
  <text x="682" y="388" font-size="9" fill="#374151">Read: blocking inline script</text>
  <text x="682" y="403" font-size="9" fill="#374151">  before first paint (FOUC fix)</text>
  <text x="682" y="418" font-size="9" fill="#374151">Cross-tab: storage event sync</text>
  <text x="682" y="433" font-size="9" fill="#374151">  other tabs update instantly</text>
  <text x="682" y="448" font-size="9" fill="#374151">Cookie fallback for SSR apps</text>
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Layers: primitive→semantic→component</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Injection: data-theme attr on html</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">FOUC: blocking inline script</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Storage key: "theme" localStorage</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Cross-tab: storage event sync</text>
</svg>
