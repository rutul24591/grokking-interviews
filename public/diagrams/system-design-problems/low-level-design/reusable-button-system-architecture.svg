<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2563eb"/>
    </marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/>
    </marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Reusable Button System — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Variant system · Loading state · Icon slot · Focus &amp; disabled handling</text>

  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — VARIANT SYSTEM</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">ButtonProps</text>
  <text x="34" y="133" font-size="9" fill="#374151">variant: 'solid'|'outline'|'ghost'</text>
  <text x="34" y="148" font-size="9" fill="#374151">  |'link'|'destructive'</text>
  <text x="34" y="163" font-size="9" fill="#374151">intent: 'primary'|'secondary'</text>
  <text x="34" y="178" font-size="9" fill="#374151">  |'success'|'warning'|'danger'</text>
  <text x="34" y="193" font-size="9" fill="#374151">size: 'xs'|'sm'|'md'|'lg'|'xl'</text>
  <text x="34" y="208" font-size="9" fill="#374151">fullWidth?: boolean</text>
  <text x="34" y="223" font-size="9" fill="#374151">as?: 'button'|'a'|'span'</text>
  <text x="34" y="240" font-size="9" fill="#374151">  href when as="a"</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">CVA / Class Map</text>
  <text x="236" y="133" font-size="9" fill="#374151">cva() composes base + variants</text>
  <text x="236" y="148" font-size="9" fill="#374151">base: flex items-center font-medium</text>
  <text x="236" y="163" font-size="9" fill="#374151">  rounded transition focus-ring</text>
  <text x="236" y="178" font-size="9" fill="#374151">size variants: px, py, text-size</text>
  <text x="236" y="193" font-size="9" fill="#374151">variant × intent compound class</text>
  <text x="236" y="208" font-size="9" fill="#374151">5 variants × 6 intents = 30 combos</text>
  <text x="236" y="223" font-size="9" fill="#374151">compoundVariants for edge cases</text>
  <text x="236" y="240" font-size="9" fill="#374151">className: clsx + twMerge merge</text>

  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — LOADING STATE</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Spinner Behaviour</text>
  <text x="485" y="133" font-size="9" fill="#374151">loading?: boolean prop</text>
  <text x="485" y="148" font-size="9" fill="#374151">  aria-disabled="true" while loading</text>
  <text x="485" y="163" font-size="9" fill="#374151">  pointer-events: none</text>
  <text x="485" y="178" font-size="9" fill="#374151">Spinner: SVG stroke-dasharray anim</text>
  <text x="485" y="193" font-size="9" fill="#374151">  animation: spin 1s linear infinite</text>
  <text x="485" y="208" font-size="9" fill="#374151">  replaces leadingIcon slot</text>
  <text x="485" y="225" font-size="9" fill="#374151">Delay: 200ms before show (no flash)</text>
  <text x="485" y="240" font-size="9" fill="#374151">  useDelay hook + CSS opacity</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Async Click Handler</text>
  <text x="682" y="133" font-size="9" fill="#374151">onClick: async (e) =&gt; Promise</text>
  <text x="682" y="148" font-size="9" fill="#374151">auto-loading: try/finally pattern</text>
  <text x="682" y="163" font-size="9" fill="#374151">  setLoading(true) → await fn</text>
  <text x="682" y="178" font-size="9" fill="#374151">  setLoading(false) in finally</text>
  <text x="682" y="193" font-size="9" fill="#374151">Prevent double-submit: ref guard</text>
  <text x="682" y="208" font-size="9" fill="#374151">Error: surface via onError prop</text>
  <text x="682" y="225" font-size="9" fill="#374151">Success: flash green state 1s</text>
  <text x="682" y="240" font-size="9" fill="#374151">  optional successIcon swap</text>

  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — ICON SLOT SYSTEM</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Icon Placement</text>
  <text x="34" y="358" font-size="9" fill="#374151">leadingIcon?: ReactNode (left)</text>
  <text x="34" y="373" font-size="9" fill="#374151">trailingIcon?: ReactNode (right)</text>
  <text x="34" y="388" font-size="9" fill="#374151">iconOnly?: boolean (square btn)</text>
  <text x="34" y="403" font-size="9" fill="#374151">  requires aria-label</text>
  <text x="34" y="418" font-size="9" fill="#374151">Icon size: sm=14 md=16 lg=20 px</text>
  <text x="34" y="433" font-size="9" fill="#374151">Gap: 8px between icon and label</text>
  <text x="34" y="448" font-size="9" fill="#374151">aria-hidden="true" on decorative</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Polymorphic As Prop</text>
  <text x="236" y="358" font-size="9" fill="#374151">as="a": renders anchor element</text>
  <text x="236" y="373" font-size="9" fill="#374151">  href, target, rel forwarded</text>
  <text x="236" y="388" font-size="9" fill="#374151">as="button": default behaviour</text>
  <text x="236" y="403" font-size="9" fill="#374151">as="span": for nested link context</text>
  <text x="236" y="418" font-size="9" fill="#374151">TS: polymorphicForwardRef pattern</text>
  <text x="236" y="433" font-size="9" fill="#374151">  conditional prop inference</text>
  <text x="236" y="448" font-size="9" fill="#374151">Ref forwarded to underlying el</text>

  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — FOCUS &amp; DISABLED HANDLING</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Focus Visible</text>
  <text x="485" y="358" font-size="9" fill="#374151">:focus-visible ring: 2px offset 2px</text>
  <text x="485" y="373" font-size="9" fill="#374151">  outline-color matches intent</text>
  <text x="485" y="388" font-size="9" fill="#374151">:focus (not :focus-visible): hidden</text>
  <text x="485" y="403" font-size="9" fill="#374151">  avoids mouse click ring</text>
  <text x="485" y="418" font-size="9" fill="#374151">High-contrast: forced-colors CSS</text>
  <text x="485" y="433" font-size="9" fill="#374151">  ButtonText / ButtonFace tokens</text>
  <text x="485" y="448" font-size="9" fill="#374151">focus-visible polyfill for Safari</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Disabled State</text>
  <text x="682" y="358" font-size="9" fill="#374151">disabled attr: prevents all events</text>
  <text x="682" y="373" font-size="9" fill="#374151">  removed from tab order</text>
  <text x="682" y="388" font-size="9" fill="#374151">aria-disabled: visible + inactive</text>
  <text x="682" y="403" font-size="9" fill="#374151">  stays in tab order + focusable</text>
  <text x="682" y="418" font-size="9" fill="#374151">  onClick: preventDefault()</text>
  <text x="682" y="433" font-size="9" fill="#374151">opacity-50 cursor-not-allowed</text>
  <text x="682" y="448" font-size="9" fill="#374151">Tooltip: "Why is this disabled?"</text>

  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>

  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Variant count: 5 × 6 intents = 30</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Spinner delay: 200ms (no flash)</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Icon size: md=16px, lg=20px</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Focus ring: 2px outline, 2px offset</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Polymorphic: button | a | span</text>
</svg>
