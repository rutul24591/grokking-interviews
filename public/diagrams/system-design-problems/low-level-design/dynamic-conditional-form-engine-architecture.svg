<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" fill="none" font-family="system-ui, sans-serif">
  <rect width="760" height="360" fill="transparent"/>

  <rect x="20" y="40" width="150" height="80" rx="8" fill="#f0f9ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="95" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Rule Schema</text>
  <text x="35" y="90" font-size="11" fill="#3b82f6">when: DSL string</text>
  <text x="35" y="106" font-size="11" fill="#3b82f6">target + effect</text>

  <rect x="20" y="160" width="150" height="80" rx="8" fill="#f0f9ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="95" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Form Values</text>
  <text x="35" y="210" font-size="11" fill="#3b82f6">live store state</text>
  <text x="35" y="226" font-size="11" fill="#3b82f6">change → trigger</text>

  <line x1="170" y1="80" x2="240" y2="120" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="170" y1="200" x2="240" y2="160" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="240" y="80" width="220" height="160" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="350" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">Conditional Engine</text>
  <text x="255" y="132" font-size="11" fill="#92400e">• Parser → AST (safe DSL)</text>
  <text x="255" y="150" font-size="11" fill="#92400e">• DependencyExtractor</text>
  <text x="255" y="168" font-size="11" fill="#92400e">• Compile → DAG (topo sort)</text>
  <text x="255" y="186" font-size="11" fill="#92400e">• CycleDetector (fail fast)</text>
  <text x="255" y="204" font-size="11" fill="#92400e">• Evaluator (pure)</text>
  <text x="255" y="222" font-size="11" fill="#92400e">• EffectApplier (dispatch)</text>

  <line x1="460" y1="160" x2="540" y2="160" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="540" y="80" width="200" height="160" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="640" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Field Effects</text>
  <text x="555" y="132" font-size="11" fill="#166534">• visible: boolean</text>
  <text x="555" y="150" font-size="11" fill="#166534">• disabled: boolean</text>
  <text x="555" y="168" font-size="11" fill="#166534">• required: boolean</text>
  <text x="555" y="186" font-size="11" fill="#166534">• value: computed</text>
  <text x="555" y="204" font-size="11" fill="#166534">• options: dynamic list</text>
  <text x="555" y="222" font-size="10" fill="#15803d">batched single commit</text>

  <text x="350" y="280" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">spreadsheet-style reactive graph: change → topological cascade → deterministic effects</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
