<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Login / Auth Flow &amp; Session Management</text>

  <!-- Auth Flow -->
  <g>
    <text x="220" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Authentication Flow</text>

    <!-- Step boxes -->
    <rect x="30" y="75" width="180" height="50" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="120" y="98" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">1. User submits credentials</text>
    <text x="120" y="114" font-size="10" text-anchor="middle" fill="#374151">email + password (HTTPS)</text>

    <path d="M 120 125 L 120 145" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#a1)"/>

    <rect x="30" y="145" width="180" height="50" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="120" y="168" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">2. Server validates</text>
    <text x="120" y="184" font-size="10" text-anchor="middle" fill="#374151">bcrypt compare, rate limit</text>

    <path d="M 120 195 L 120 215" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#a1)"/>

    <rect x="30" y="215" width="180" height="50" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="120" y="238" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">3. Issue tokens</text>
    <text x="120" y="254" font-size="10" text-anchor="middle" fill="#374151">access (15m) + refresh (7d)</text>

    <path d="M 120 265 L 120 285" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#a1)"/>

    <rect x="30" y="285" width="180" height="50" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="120" y="308" font-size="11" font-weight="bold" text-anchor="middle" fill="#581c87">4. Store tokens</text>
    <text x="120" y="324" font-size="10" text-anchor="middle" fill="#374151">access: memory, refresh: httpOnly cookie</text>

    <path d="M 120 335 L 120 355" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#a1)"/>

    <rect x="30" y="355" width="180" height="50" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="120" y="378" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">5. Attach to requests</text>
    <text x="120" y="394" font-size="10" text-anchor="middle" fill="#374151">Authorization: Bearer &lt;access&gt;</text>

    <!-- Logout -->
    <rect x="30" y="430" width="180" height="50" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="120" y="453" font-size="11" font-weight="bold" text-anchor="middle" fill="#991b1b">Logout</text>
    <text x="120" y="469" font-size="10" text-anchor="middle" fill="#374151">Clear memory + revoke refresh</text>
  </g>

  <!-- Session State Machine -->
  <g>
    <text x="530" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Session State Machine</text>

    <rect x="250" y="75" width="540" height="380" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>

    <!-- States -->
    <ellipse cx="380" cy="130" rx="80" ry="28" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="380" y="134" font-size="11" font-weight="bold" text-anchor="middle" fill="#374151">UNAUTHENTICATED</text>

    <ellipse cx="650" cy="130" rx="70" ry="28" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="650" y="134" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">AUTHENTICATED</text>

    <ellipse cx="380" cy="280" rx="70" ry="28" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="380" y="284" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">REFRESHING</text>

    <ellipse cx="650" cy="280" rx="70" ry="28" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="650" y="284" font-size="11" font-weight="bold" text-anchor="middle" fill="#991b1b">EXPIRED</text>

    <ellipse cx="515" cy="400" rx="70" ry="28" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
    <text x="515" y="404" font-size="11" font-weight="bold" text-anchor="middle" fill="#581c87">LOADING</text>

    <!-- Transitions -->
    <path d="M 460 130 L 580 130" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#ag)"/>
    <text x="520" y="122" font-size="9" text-anchor="middle" fill="#065f46">login success</text>

    <path d="M 580 130 L 460 130" stroke="#6b7280" stroke-width="2" fill="none" stroke-dasharray="4,2" marker-end="url(#agr)"/>
    <text x="520" y="145" font-size="9" text-anchor="middle" fill="#374151">logout</text>

    <path d="M 650 158 L 650 252" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#ay)"/>
    <text x="662" y="210" font-size="9" fill="#92400e">token expires</text>

    <path d="M 580 280 L 450 280" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#ag)"/>
    <text x="515" y="272" font-size="9" text-anchor="middle" fill="#065f46">refresh OK</text>

    <path d="M 380 252 L 380 158" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#agr)"/>
    <text x="345" y="210" font-size="9" text-anchor="middle" fill="#374151">refresh call</text>

    <path d="M 450 295 L 445 372" stroke="#a855f7" stroke-width="2" fill="none" marker-end="url(#ap)"/>
    <text x="432" y="340" font-size="9" text-anchor="middle" fill="#581c87">refresh fail</text>

    <path d="M 515 372 L 380 308" stroke="#a855f7" stroke-width="2" fill="none" marker-end="url(#ap)"/>
    <text x="430" y="352" font-size="9" text-anchor="middle" fill="#374151">re-login</text>

    <text x="515" y="455" font-size="9" text-anchor="middle" fill="#6b7280">Initial app load → LOADING → check stored token → route to state</text>
  </g>

  <!-- Token Security -->
  <g>
    <text x="890" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Token Security</text>

    <rect x="810" y="75" width="260" height="200" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="940" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Storage Rules</text>
    <text x="825" y="122" font-size="10" fill="#374151">Access token:</text>
    <text x="825" y="139" font-size="10" fill="#374151">  → in-memory (JS variable)</text>
    <text x="825" y="156" font-size="10" fill="#374151">  → NOT localStorage (XSS risk)</text>
    <text x="825" y="178" font-size="10" fill="#374151">Refresh token:</text>
    <text x="825" y="195" font-size="10" fill="#374151">  → httpOnly cookie (CSRF-safe)</text>
    <text x="825" y="212" font-size="10" fill="#374151">  → SameSite=Strict</text>
    <text x="825" y="229" font-size="10" fill="#374151">  → Secure flag (HTTPS only)</text>
    <text x="825" y="252" font-size="9" fill="#ef4444">Never store sensitive tokens in localStorage</text>

    <rect x="810" y="290" width="260" height="160" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="940" y="315" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Silent Refresh</text>
    <text x="825" y="338" font-size="10" fill="#374151">Timer: refresh 1 min before expiry</text>
    <text x="825" y="355" font-size="10" fill="#374151">On 401: queue requests, refresh, retry</text>
    <text x="825" y="372" font-size="10" fill="#374151">Dedup: only one refresh in-flight</text>
    <text x="825" y="389" font-size="10" fill="#374151">Fail: clear state → redirect to login</text>
    <text x="825" y="436" font-size="9" fill="#3b82f6">Use axios interceptor or fetch wrapper</text>

    <rect x="810" y="465" width="260" height="60" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="940" y="490" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">Persisting Login</text>
    <text x="825" y="510" font-size="10" fill="#374151">Check httpOnly cookie on app load → silent refresh</text>
  </g>

  <!-- Summary -->
  <rect x="30" y="520" width="1040" height="48" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="3"/>
  <text x="50" y="540" font-size="11" fill="#374151"><tspan font-weight="bold">Key:</tspan> Short-lived access tokens (15m) in memory. Long-lived refresh (7d) in httpOnly cookie. <tspan font-weight="bold">Silent refresh:</tspan> proactive + reactive (on 401).</text>
  <text x="50" y="558" font-size="11" fill="#374151"><tspan font-weight="bold">UX:</tspan> Show loading state on init. Redirect unauthenticated to /login with returnUrl. Persist auth across tabs via BroadcastChannel.</text>

  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#10b981"/></marker>
    <marker id="agr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/></marker>
    <marker id="ay" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/></marker>
    <marker id="ap" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#a855f7"/></marker>
  </defs>
</svg>
