<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Device / Session Management UI</text>

  <!-- Session List UI -->
  <g>
    <text x="230" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Active Sessions List</text>

    <rect x="30" y="75" width="420" height="390" fill="#f9fafb" stroke="#d1d5db" stroke-width="2" rx="6"/>

    <!-- Current session -->
    <rect x="45" y="90" width="390" height="80" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="60" y="112" font-size="11" font-weight="bold" fill="#065f46">● Current Session</text>
    <text x="60" y="130" font-size="10" fill="#374151">MacBook Pro · Chrome 124 · macOS</text>
    <text x="60" y="147" font-size="10" fill="#374151">San Francisco, CA · Active now</text>
    <text x="360" y="130" font-size="10" fill="#6b7280" text-anchor="end">This device</text>

    <!-- Other session 1 -->
    <rect x="45" y="185" width="390" height="75" fill="white" stroke="#e2e8f0" stroke-width="1" rx="4"/>
    <text x="60" y="207" font-size="11" font-weight="bold" fill="#374151">iPhone 15 · Safari · iOS 17</text>
    <text x="60" y="224" font-size="10" fill="#374151">New York, NY · 2 hours ago</text>
    <text x="60" y="242" font-size="10" fill="#374151">Token: abc...xyz</text>
    <text x="400" y="224" font-size="10" fill="#ef4444" text-anchor="middle" style="cursor:pointer">Revoke</text>

    <!-- Other session 2 -->
    <rect x="45" y="275" width="390" height="75" fill="white" stroke="#e2e8f0" stroke-width="1" rx="4"/>
    <text x="60" y="297" font-size="11" font-weight="bold" fill="#374151">Windows PC · Firefox 123</text>
    <text x="60" y="314" font-size="10" fill="#374151">Chicago, IL · 3 days ago</text>
    <text x="60" y="332" font-size="10" fill="#6b7280">Inactive</text>
    <text x="400" y="314" font-size="10" fill="#ef4444" text-anchor="middle">Revoke</text>

    <!-- Other session 3 - suspicious -->
    <rect x="45" y="365" width="390" height="80" fill="#fff1f2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="60" y="387" font-size="11" font-weight="bold" fill="#991b1b">⚠ Unknown Device · Unknown Browser</text>
    <text x="60" y="405" font-size="10" fill="#374151">Lagos, Nigeria · 1 hour ago</text>
    <text x="60" y="422" font-size="10" fill="#ef4444">Suspicious location</text>
    <text x="400" y="405" font-size="10" fill="#ef4444" text-anchor="middle">Revoke</text>
  </g>

  <!-- Data Model -->
  <g>
    <text x="650" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Session Data Model &amp; Revocation</text>

    <rect x="480" y="75" width="590" height="200" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="775" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Session Record (DB)</text>
    <text x="495" y="122" font-size="10" fill="#374151">id: uuid (session identifier)</text>
    <text x="495" y="140" font-size="10" fill="#374151">userId: foreign key</text>
    <text x="495" y="158" font-size="10" fill="#374151">refreshTokenHash: SHA-256 of refresh token</text>
    <text x="495" y="176" font-size="10" fill="#374151">deviceInfo: {ua, os, browser, deviceType}</text>
    <text x="495" y="194" font-size="10" fill="#374151">ipAddress: string (for geo lookup)</text>
    <text x="495" y="212" font-size="10" fill="#374151">lastActiveAt: timestamp</text>
    <text x="495" y="230" font-size="10" fill="#374151">createdAt: timestamp</text>
    <text x="495" y="248" font-size="9" fill="#3b82f6">Revoke = DELETE session row → refresh token invalidated</text>

    <rect x="480" y="290" width="590" height="150" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="775" y="315" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">Revocation Mechanisms</text>
    <text x="495" y="338" font-size="10" fill="#374151">Single session: DELETE /sessions/:id (admin or user)</text>
    <text x="495" y="356" font-size="10" fill="#374151">All other sessions: DELETE /sessions?except=current</text>
    <text x="495" y="374" font-size="10" fill="#374151">All sessions: DELETE /sessions (full logout everywhere)</text>
    <text x="495" y="392" font-size="10" fill="#374151">Server: on refresh token use, check session active</text>
    <text x="495" y="410" font-size="10" fill="#374151">Revocation propagates within one refresh cycle (~15 min)</text>
    <text x="495" y="424" font-size="9" fill="#a855f7">For instant revocation: JWT blocklist or short-lived tokens</text>

    <rect x="480" y="455" width="590" height="90" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="775" y="478" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Anomaly Detection</text>
    <text x="495" y="500" font-size="10" fill="#374151">Flag if new session login from new country/city</text>
    <text x="495" y="517" font-size="10" fill="#374151">Email alert: "New sign-in from [device] in [location]"</text>
    <text x="495" y="531" font-size="9" fill="#f59e0b">User can mark session as "Not me" → auto-revoke + password reset prompt</text>
  </g>

  <rect x="30" y="500" width="1040" height="48" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="3"/>
  <text x="50" y="520" font-size="11" fill="#374151"><tspan font-weight="bold">Model:</tspan> Each refresh token = one session row. Revoke = delete row. Access tokens expire naturally (15 min).</text>
  <text x="50" y="538" font-size="11" fill="#374151"><tspan font-weight="bold">UX:</tspan> Parse User-Agent for device info. Geo-IP for location. Highlight suspicious sessions. "Revoke all others" one-click security.</text>
</svg>
