<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">User Onboarding / Guided Tour Architecture</text>

  <!-- Tour Flow -->
  <g>
    <text x="200" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Tour Step Flow</text>

    <rect x="30" y="75" width="340" height="55" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="200" y="98" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">Entry Trigger</text>
    <text x="200" y="115" font-size="10" text-anchor="middle" fill="#374151">First login / feature flag / manual start / URL param</text>

    <path d="M 200 130 L 200 150" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#aot)"/>

    <rect x="30" y="150" width="340" height="55" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="200" y="173" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">Tour Engine</text>
    <text x="200" y="191" font-size="10" text-anchor="middle" fill="#374151">Load step config → find target element → position tooltip</text>

    <path d="M 200 205 L 200 225" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#aot)"/>

    <!-- Steps visualization -->
    <rect x="30" y="225" width="340" height="130" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="4"/>
    <text x="200" y="248" font-size="11" font-weight="bold" text-anchor="middle" fill="#374151">Active Step Lifecycle</text>

    <rect x="50" y="258" width="80" height="32" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="90" y="278" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e40af">Highlight</text>

    <path d="M 130 274 L 148 274" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#aot)"/>

    <rect x="150" y="258" width="80" height="32" fill="#dcfce7" stroke="#10b981" stroke-width="1" rx="3"/>
    <text x="190" y="278" font-size="10" font-weight="bold" text-anchor="middle" fill="#065f46">Tooltip</text>

    <path d="M 230 274 L 248 274" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#aot)"/>

    <rect x="250" y="258" width="80" height="32" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="3"/>
    <text x="290" y="278" font-size="10" font-weight="bold" text-anchor="middle" fill="#92400e">Action</text>

    <text x="55" y="315" font-size="10" fill="#374151">prev / next / skip / complete</text>
    <text x="55" y="332" font-size="10" fill="#374151">Keyboard: ← → Escape</text>
    <text x="55" y="348" font-size="10" fill="#374151">Progress: Step 2 of 5</text>

    <path d="M 200 355 L 200 375" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#aot)"/>

    <rect x="30" y="375" width="340" height="55" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="200" y="398" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">Completion</text>
    <text x="200" y="415" font-size="10" text-anchor="middle" fill="#374151">Mark seen in user profile → never show again</text>
  </g>

  <!-- Positioning Engine -->
  <g>
    <text x="580" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Tooltip Positioning Engine</text>

    <rect x="400" y="75" width="380" height="200" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="590" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">Smart Placement</text>
    <text x="415" y="122" font-size="10" fill="#374151">1. Get target element getBoundingClientRect()</text>
    <text x="415" y="140" font-size="10" fill="#374151">2. Preferred position: top | right | bottom | left</text>
    <text x="415" y="158" font-size="10" fill="#374151">3. Check viewport overflow → flip if needed</text>
    <text x="415" y="176" font-size="10" fill="#374151">4. ScrollIntoView: scroll target to center</text>
    <text x="415" y="194" font-size="10" fill="#374151">5. Spotlight: highlight target (darken backdrop)</text>
    <text x="415" y="212" font-size="10" fill="#374151">6. Arrow pointer: points to target element</text>
    <text x="415" y="230" font-size="10" fill="#374151">7. Re-position on resize / scroll</text>
    <text x="415" y="253" font-size="9" fill="#a855f7">Use position: fixed on tooltip to escape stacking contexts</text>

    <rect x="400" y="290" width="380" height="140" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="590" y="315" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Step Configuration</text>
    <text x="415" y="338" font-size="10" fill="#374151">target: CSS selector or React ref</text>
    <text x="415" y="356" font-size="10" fill="#374151">title: string, content: string | ReactNode</text>
    <text x="415" y="374" font-size="10" fill="#374151">placement: 'top' | 'right' | 'bottom' | 'left'</text>
    <text x="415" y="392" font-size="10" fill="#374151">action: 'click' | 'hover' | null (wait for user)</text>
    <text x="415" y="410" font-size="10" fill="#374151">condition: () =&gt; boolean (skip if not ready)</text>
    <text x="415" y="424" font-size="9" fill="#f59e0b">Dynamic targets: observe DOM for element appearance</text>
  </g>

  <!-- State & Persistence -->
  <g>
    <text x="900" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">State &amp; Persistence</text>

    <rect x="810" y="75" width="260" height="175" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="940" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Tour State</text>
    <text x="825" y="122" font-size="10" fill="#374151">active: boolean</text>
    <text x="825" y="140" font-size="10" fill="#374151">currentStep: number</text>
    <text x="825" y="158" font-size="10" fill="#374151">tourId: string (version tours)</text>
    <text x="825" y="176" font-size="10" fill="#374151">completedTours: string[]</text>
    <text x="825" y="194" font-size="10" fill="#374151">skippedAt: step index</text>
    <text x="825" y="212" font-size="10" fill="#374151">Persist in: user profile (DB)</text>
    <text x="825" y="228" font-size="9" fill="#3b82f6">Fallback: localStorage (anonymous users)</text>

    <rect x="810" y="265" width="260" height="130" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="940" y="290" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Tour Variants</text>
    <text x="825" y="313" font-size="10" fill="#374151">Welcome: first login walkthrough</text>
    <text x="825" y="331" font-size="10" fill="#374151">Feature: new feature announcement</text>
    <text x="825" y="349" font-size="10" fill="#374151">Contextual: triggered by user action</text>
    <text x="825" y="367" font-size="10" fill="#374151">Manual: help menu "Take a tour"</text>
    <text x="825" y="381" font-size="9" fill="#10b981">A/B test: show tour to % of new users</text>

    <rect x="810" y="410" width="260" height="80" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="940" y="433" font-size="11" font-weight="bold" text-anchor="middle" fill="#991b1b">Accessibility</text>
    <text x="825" y="455" font-size="10" fill="#374151">role="dialog" aria-modal on tooltip</text>
    <text x="825" y="472" font-size="10" fill="#374151">Focus trap inside tooltip; Escape = skip</text>
    <text x="825" y="485" font-size="9" fill="#ef4444">Announce step changes to screen readers</text>
  </g>

  <!-- Summary -->
  <rect x="30" y="500" width="1040" height="48" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="3"/>
  <text x="50" y="520" font-size="11" fill="#374151"><tspan font-weight="bold">Architecture:</tspan> Tour engine reads step config → finds DOM target → positions tooltip → handles prev/next/skip actions.</text>
  <text x="50" y="538" font-size="11" fill="#374151"><tspan font-weight="bold">Persistence:</tspan> Store completed tour IDs per user in DB. Version tours (v1/v2) so new tours re-trigger for existing users. Libraries: Shepherd.js, Intro.js, Joyride.</text>
</svg>
