<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RBAC UI System: Roles, Permissions &amp; UI Enforcement</text>

  <!-- Role Hierarchy -->
  <g>
    <text x="175" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Role Hierarchy</text>

    <rect x="120" y="75" width="110" height="40" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="175" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Super Admin</text>

    <path d="M 120 95 L 60 135" stroke="#6b7280" stroke-width="1.5" fill="none"/>
    <path d="M 230 95 L 290 135" stroke="#6b7280" stroke-width="1.5" fill="none"/>

    <rect x="30" y="135" width="90" height="38" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="75" y="158" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">Admin</text>

    <rect x="260" y="135" width="90" height="38" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="305" y="158" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">Manager</text>

    <path d="M 75 173 L 50 213" stroke="#6b7280" stroke-width="1.5" fill="none"/>
    <path d="M 75 173 L 100 213" stroke="#6b7280" stroke-width="1.5" fill="none"/>
    <path d="M 305 173 L 280 213" stroke="#6b7280" stroke-width="1.5" fill="none"/>
    <path d="M 305 173 L 330 213" stroke="#6b7280" stroke-width="1.5" fill="none"/>

    <rect x="25" y="213" width="70" height="35" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="4"/>
    <text x="60" y="235" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e40af">Editor</text>

    <rect x="100" y="213" width="70" height="35" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="4"/>
    <text x="135" y="235" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e40af">Viewer</text>

    <rect x="255" y="213" width="70" height="35" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="4"/>
    <text x="290" y="235" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e40af">Approver</text>

    <rect x="330" y="213" width="70" height="35" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" rx="4"/>
    <text x="365" y="235" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e40af">Reporter</text>

    <text x="200" y="275" font-size="9" text-anchor="middle" fill="#6b7280">Roles inherit parent permissions</text>
  </g>

  <!-- Permission Matrix -->
  <g>
    <text x="620" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Permission Matrix</text>

    <!-- Table header -->
    <rect x="420" y="75" width="650" height="30" fill="#1e40af" rx="4"/>
    <text x="510" y="95" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Resource</text>
    <text x="620" y="95" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Super Admin</text>
    <text x="730" y="95" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Admin</text>
    <text x="830" y="95" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Manager</text>
    <text x="930" y="95" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Editor</text>
    <text x="1020" y="95" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Viewer</text>

    <!-- Rows -->
    <rect x="420" y="105" width="650" height="28" fill="#f0fdf4"/>
    <text x="510" y="124" font-size="10" text-anchor="middle" fill="#374151">Users</text>
    <text x="620" y="124" font-size="13" text-anchor="middle" fill="#10b981">✓ CRUD</text>
    <text x="730" y="124" font-size="13" text-anchor="middle" fill="#10b981">✓ CRUD</text>
    <text x="830" y="124" font-size="13" text-anchor="middle" fill="#f59e0b">✓ Read</text>
    <text x="930" y="124" font-size="13" text-anchor="middle" fill="#ef4444">✗</text>
    <text x="1020" y="124" font-size="13" text-anchor="middle" fill="#ef4444">✗</text>

    <rect x="420" y="133" width="650" height="28" fill="white"/>
    <text x="510" y="152" font-size="10" text-anchor="middle" fill="#374151">Billing</text>
    <text x="620" y="152" font-size="13" text-anchor="middle" fill="#10b981">✓ CRUD</text>
    <text x="730" y="152" font-size="13" text-anchor="middle" fill="#10b981">✓ CRUD</text>
    <text x="830" y="152" font-size="13" text-anchor="middle" fill="#ef4444">✗</text>
    <text x="930" y="152" font-size="13" text-anchor="middle" fill="#ef4444">✗</text>
    <text x="1020" y="152" font-size="13" text-anchor="middle" fill="#ef4444">✗</text>

    <rect x="420" y="161" width="650" height="28" fill="#f0fdf4"/>
    <text x="510" y="180" font-size="10" text-anchor="middle" fill="#374151">Reports</text>
    <text x="620" y="180" font-size="13" text-anchor="middle" fill="#10b981">✓ CRUD</text>
    <text x="730" y="180" font-size="13" text-anchor="middle" fill="#10b981">✓ CRUD</text>
    <text x="830" y="180" font-size="13" text-anchor="middle" fill="#10b981">✓ CRUD</text>
    <text x="930" y="180" font-size="13" text-anchor="middle" fill="#f59e0b">✓ Read</text>
    <text x="1020" y="180" font-size="13" text-anchor="middle" fill="#f59e0b">✓ Read</text>

    <rect x="420" y="189" width="650" height="28" fill="white"/>
    <text x="510" y="208" font-size="10" text-anchor="middle" fill="#374151">Settings</text>
    <text x="620" y="208" font-size="13" text-anchor="middle" fill="#10b981">✓ CRUD</text>
    <text x="730" y="208" font-size="13" text-anchor="middle" fill="#10b981">✓ CRUD</text>
    <text x="830" y="208" font-size="13" text-anchor="middle" fill="#ef4444">✗</text>
    <text x="930" y="208" font-size="13" text-anchor="middle" fill="#ef4444">✗</text>
    <text x="1020" y="208" font-size="13" text-anchor="middle" fill="#ef4444">✗</text>
  </g>

  <!-- UI Enforcement -->
  <g>
    <text x="220" y="310" font-size="14" font-weight="bold" fill="#1a1a1a">UI Enforcement Patterns</text>

    <rect x="30" y="325" width="310" height="140" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="185" y="348" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">Component-Level Guards</text>
    <text x="45" y="370" font-size="10" fill="#374151">can('edit', 'reports') ? &lt;EditBtn /&gt; : null</text>
    <text x="45" y="388" font-size="10" fill="#374151">usePermission('billing.read') hook</text>
    <text x="45" y="406" font-size="10" fill="#374151">withPermission HOC wrapper</text>
    <text x="45" y="424" font-size="10" fill="#374151">Disable vs hide: prefer disable + tooltip</text>
    <text x="45" y="450" font-size="9" fill="#a855f7">Always enforce on server — UI is UX only</text>

    <rect x="360" y="325" width="310" height="140" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="515" y="348" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Route Guards</text>
    <text x="375" y="370" font-size="10" fill="#374151">ProtectedRoute checks role before render</text>
    <text x="375" y="388" font-size="10" fill="#374151">Redirect to /forbidden (not 404)</text>
    <text x="375" y="406" font-size="10" fill="#374151">Show 403 page with contact admin CTA</text>
    <text x="375" y="424" font-size="10" fill="#374151">Nested routes inherit parent permissions</text>
    <text x="375" y="450" font-size="9" fill="#3b82f6">Check on client + server (Next.js middleware)</text>

    <rect x="690" y="325" width="380" height="140" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="880" y="348" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Permission Context</text>
    <text x="705" y="370" font-size="10" fill="#374151">AuthContext: {user, roles, permissions}</text>
    <text x="705" y="388" font-size="10" fill="#374151">can(action, resource): boolean</text>
    <text x="705" y="406" font-size="10" fill="#374151">canAny([...permissions]): boolean</text>
    <text x="705" y="424" font-size="10" fill="#374151">Load permissions with user object at login</text>
    <text x="705" y="442" font-size="10" fill="#374151">Re-check on token refresh (role may change)</text>
    <text x="705" y="458" font-size="9" fill="#10b981">Normalize permissions: {resource}.{action}</text>
  </g>

  <!-- Summary -->
  <rect x="30" y="490" width="1040" height="48" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="3"/>
  <text x="50" y="510" font-size="11" fill="#374151"><tspan font-weight="bold">RBAC model:</tspan> User → Roles → Permissions → Resources. <tspan font-weight="bold">Granularity:</tspan> action-resource pairs (reports.create, billing.read).</text>
  <text x="50" y="528" font-size="11" fill="#374151"><tspan font-weight="bold">Security:</tspan> UI guards are UX — server always re-validates. <tspan font-weight="bold">Dynamic:</tspan> permissions fetched with auth token, not hardcoded in frontend.</text>
</svg>
