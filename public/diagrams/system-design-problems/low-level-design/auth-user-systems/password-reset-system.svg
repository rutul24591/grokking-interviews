<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Password Reset / Recovery Flow</text>

  <!-- Flow Steps -->
  <g>
    <text x="260" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Reset Flow (Token-based)</text>

    <!-- Step 1 -->
    <rect x="30" y="75" width="200" height="55" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="130" y="98" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">1. User requests reset</text>
    <text x="130" y="116" font-size="10" text-anchor="middle" fill="#374151">Enters email on /forgot-password</text>

    <path d="M 130 130 L 130 150" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#ap1)"/>

    <!-- Step 2 -->
    <rect x="30" y="150" width="200" height="65" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="130" y="173" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">2. Server generates token</text>
    <text x="130" y="190" font-size="10" text-anchor="middle" fill="#374151">crypto.randomBytes(32)</text>
    <text x="130" y="207" font-size="10" text-anchor="middle" fill="#374151">Store hash + expiry (15 min)</text>

    <path d="M 130 215 L 130 235" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#ap1)"/>

    <!-- Step 3 -->
    <rect x="30" y="235" width="200" height="55" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="130" y="258" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">3. Email sent</text>
    <text x="130" y="276" font-size="10" text-anchor="middle" fill="#374151">Link: /reset?token=&lt;raw&gt;</text>

    <path d="M 130 290 L 130 310" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#ap1)"/>

    <!-- Step 4 -->
    <rect x="30" y="310" width="200" height="65" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="130" y="333" font-size="11" font-weight="bold" text-anchor="middle" fill="#581c87">4. User clicks link</text>
    <text x="130" y="350" font-size="10" text-anchor="middle" fill="#374151">App verifies token hash</text>
    <text x="130" y="367" font-size="10" text-anchor="middle" fill="#374151">Check expiry, single-use</text>

    <path d="M 130 375 L 130 395" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#ap1)"/>

    <!-- Step 5 -->
    <rect x="30" y="395" width="200" height="65" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="130" y="418" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">5. New password set</text>
    <text x="130" y="435" font-size="10" text-anchor="middle" fill="#374151">Validate strength, hash (bcrypt)</text>
    <text x="130" y="452" font-size="10" text-anchor="middle" fill="#374151">Invalidate all sessions</text>
  </g>

  <!-- Security Details -->
  <g>
    <text x="520" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Security Requirements</text>

    <rect x="260" y="75" width="360" height="190" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="440" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Token Security</text>
    <text x="275" y="122" font-size="10" fill="#374151">• Token: cryptographically random (256-bit)</text>
    <text x="275" y="140" font-size="10" fill="#374151">• Store only hash in DB (SHA-256)</text>
    <text x="275" y="158" font-size="10" fill="#374151">• Expire in 15 minutes</text>
    <text x="275" y="176" font-size="10" fill="#374151">• Single-use: delete after use</text>
    <text x="275" y="194" font-size="10" fill="#374151">• Invalidate old tokens on new request</text>
    <text x="275" y="212" font-size="10" fill="#374151">• Rate limit: 3 requests / hour / email</text>
    <text x="275" y="230" font-size="10" fill="#374151">• Constant-time comparison (timing attacks)</text>
    <text x="275" y="253" font-size="9" fill="#ef4444">Generic response: "If account exists, email sent"</text>

    <rect x="260" y="280" width="360" height="160" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="440" y="305" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">UI States</text>
    <text x="275" y="328" font-size="10" fill="#374151">Idle: email input form</text>
    <text x="275" y="346" font-size="10" fill="#374151">Loading: submit spinner (disable button)</text>
    <text x="275" y="364" font-size="10" fill="#374151">Sent: generic success message</text>
    <text x="275" y="382" font-size="10" fill="#374151">Token valid: new password form</text>
    <text x="275" y="400" font-size="10" fill="#374151">Token invalid/expired: error + resend link</text>
    <text x="275" y="428" font-size="9" fill="#f59e0b">Never reveal if email exists — security risk</text>
  </g>

  <!-- Password Strength -->
  <g>
    <text x="840" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">New Password UX</text>

    <rect x="650" y="75" width="420" height="200" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="860" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Password Strength Meter</text>
    <text x="665" y="122" font-size="10" fill="#374151">Real-time strength evaluation (zxcvbn or custom)</text>
    <text x="665" y="140" font-size="10" fill="#374151">Score 0-4 → weak / fair / good / strong / very strong</text>
    <text x="665" y="158" font-size="10" fill="#374151">Visual bar (red → yellow → green)</text>
    <text x="665" y="176" font-size="10" fill="#374151">Feedback: "Add a symbol", "Avoid common words"</text>
    <text x="665" y="198" font-size="11" font-weight="bold" fill="#374151">Requirements checklist:</text>
    <text x="665" y="216" font-size="10" fill="#374151">  ✓ 8+ chars  ✓ uppercase  ✓ number  ✓ symbol</text>
    <text x="665" y="234" font-size="10" fill="#374151">Confirm password: live match indicator</text>
    <text x="665" y="256" font-size="9" fill="#10b981">Block submit until all requirements met</text>

    <rect x="650" y="290" width="420" height="150" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="860" y="315" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">Post-Reset Actions</text>
    <text x="665" y="338" font-size="10" fill="#374151">1. Invalidate all existing sessions / refresh tokens</text>
    <text x="665" y="356" font-size="10" fill="#374151">2. Send confirmation email (password changed)</text>
    <text x="665" y="374" font-size="10" fill="#374151">3. Log security event (IP, timestamp)</text>
    <text x="665" y="392" font-size="10" fill="#374151">4. Auto-login or redirect to /login</text>
    <text x="665" y="422" font-size="9" fill="#a855f7">Alert user if reset requested but not initiated by them</text>
  </g>

  <!-- Summary -->
  <rect x="30" y="490" width="1040" height="48" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="3"/>
  <text x="50" y="510" font-size="11" fill="#374151"><tspan font-weight="bold">Flow:</tspan> email → server generates random token (store hash) → send link → verify token → new password → invalidate sessions.</text>
  <text x="50" y="528" font-size="11" fill="#374151"><tspan font-weight="bold">Security:</tspan> Constant-time compare, single-use, rate limit, never reveal email existence, bcrypt new password.</text>

  <defs>
    <marker id="ap1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/></marker>
  </defs>
</svg>
