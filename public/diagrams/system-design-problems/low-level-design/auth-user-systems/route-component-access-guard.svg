<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Route / Component Access Guard System</text>

  <!-- Route Guard Flow -->
  <g>
    <text x="220" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Route Guard Decision Tree</text>

    <rect x="100" y="80" width="240" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="220" y="105" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">User navigates to route</text>

    <path d="M 220 120 L 220 145" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#ag1)"/>

    <!-- Diamond: authenticated? -->
    <polygon points="220,145 300,175 220,205 140,175" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="220" y="179" font-size="10" font-weight="bold" text-anchor="middle" fill="#92400e">Authenticated?</text>

    <path d="M 140 175 L 60 175 L 60 240" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#ar1)"/>
    <text x="90" y="168" font-size="10" fill="#ef4444">No</text>
    <rect x="20" y="240" width="160" height="40" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="100" y="265" font-size="10" font-weight="bold" text-anchor="middle" fill="#991b1b">Redirect to /login</text>
    <text x="100" y="280" font-size="9" text-anchor="middle" fill="#6b7280">?returnUrl=/original</text>

    <path d="M 300 175 L 380 175 L 380 245" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#ag1)"/>
    <text x="345" y="168" font-size="10" fill="#10b981">Yes</text>

    <!-- Diamond: authorized? -->
    <polygon points="380,245 460,275 380,305 300,275" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="380" y="279" font-size="10" font-weight="bold" text-anchor="middle" fill="#92400e">Has permission?</text>

    <path d="M 300 275 L 220 275 L 220 350" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#ar1)"/>
    <text x="250" y="268" font-size="10" fill="#ef4444">No</text>
    <rect x="160" y="350" width="120" height="40" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="220" y="375" font-size="10" font-weight="bold" text-anchor="middle" fill="#991b1b">403 Forbidden</text>

    <path d="M 460 275 L 540 275 L 540 245" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#ag1)"/>
    <text x="505" y="268" font-size="10" fill="#10b981">Yes</text>

    <rect x="460" y="205" width="160" height="40" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="540" y="230" font-size="10" font-weight="bold" text-anchor="middle" fill="#065f46">Render Route Component</text>
  </g>

  <!-- Implementation Patterns -->
  <g>
    <text x="780" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Implementation Patterns</text>

    <rect x="640" y="75" width="430" height="200" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="855" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">React Router v6 Guard</text>
    <text x="655" y="122" font-size="10" fill="#374151">function ProtectedRoute({permission, children}) {"{"}</text>
    <text x="655" y="140" font-size="10" fill="#374151">  const {user} = useAuth()</text>
    <text x="655" y="158" font-size="10" fill="#374151">  if (!user) return &lt;Navigate to="/login" /&gt;</text>
    <text x="655" y="176" font-size="10" fill="#374151">  if (!can(user, permission))</text>
    <text x="655" y="194" font-size="10" fill="#374151">    return &lt;Navigate to="/forbidden" /&gt;</text>
    <text x="655" y="212" font-size="10" fill="#374151">  return children</text>
    <text x="655" y="230" font-size="10" fill="#374151">{"}"}</text>
    <text x="655" y="255" font-size="9" fill="#a855f7">Wrap routes: &lt;ProtectedRoute permission="billing.read"&gt;</text>

    <rect x="640" y="290" width="430" height="150" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="855" y="315" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Next.js Middleware Guard</text>
    <text x="655" y="338" font-size="10" fill="#374151">middleware.ts (Edge runtime):</text>
    <text x="655" y="356" font-size="10" fill="#374151">  Verify JWT on every request</text>
    <text x="655" y="374" font-size="10" fill="#374151">  Check route patterns vs user roles</text>
    <text x="655" y="392" font-size="10" fill="#374151">  Redirect unauthenticated before page load</text>
    <text x="655" y="410" font-size="10" fill="#374151">  No flash of protected content</text>
    <text x="655" y="424" font-size="9" fill="#3b82f6">Best for: SSR apps where client guard alone shows flash</text>

    <rect x="640" y="455" width="430" height="90" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="855" y="478" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Component-Level Guard</text>
    <text x="655" y="500" font-size="10" fill="#374151">{"{"}can('reports.export') &amp;&amp; &lt;ExportButton /&gt;{"}"}</text>
    <text x="655" y="518" font-size="10" fill="#374151">usePermission('admin') hook → disable/hide UI elements</text>
    <text x="655" y="532" font-size="9" fill="#f59e0b">UI-only: always re-validate on server for data mutations</text>
  </g>

  <!-- Anti-patterns -->
  <g>
    <text x="220" y="440" font-size="14" font-weight="bold" fill="#1a1a1a">Key Principles</text>

    <rect x="30" y="455" width="580" height="90" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="320" y="478" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Client-side guards are UX, not security</text>
    <text x="45" y="500" font-size="10" fill="#374151">• Always validate permissions server-side on every API call</text>
    <text x="45" y="518" font-size="10" fill="#374151">• Never rely solely on hiding UI elements — API endpoints must enforce access control</text>
    <text x="45" y="533" font-size="10" fill="#374151">• Show 403 page (not 404) — reveals route exists, access denied (intentional transparency)</text>
  </g>

  <defs>
    <marker id="ag1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/></marker>
    <marker id="ar1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/></marker>
  </defs>
</svg>
