<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Secure Token Storage UX: Threat Model &amp; Storage Strategy</text>

  <!-- Storage Options Comparison -->
  <g>
    <text x="300" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Storage Options &amp; Security Trade-offs</text>

    <!-- Header -->
    <rect x="30" y="75" width="670" height="30" fill="#1e40af" rx="3"/>
    <text x="150" y="95" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Storage</text>
    <text x="310" y="95" font-size="11" font-weight="bold" text-anchor="middle" fill="white">XSS Risk</text>
    <text x="440" y="95" font-size="11" font-weight="bold" text-anchor="middle" fill="white">CSRF Risk</text>
    <text x="570" y="95" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Persists</text>
    <text x="660" y="95" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Verdict</text>

    <!-- localStorage -->
    <rect x="30" y="105" width="670" height="35" fill="#fee2e2"/>
    <text x="150" y="127" font-size="10" text-anchor="middle" fill="#374151">localStorage</text>
    <text x="310" y="127" font-size="11" text-anchor="middle" fill="#ef4444">HIGH ✗</text>
    <text x="440" y="127" font-size="10" text-anchor="middle" fill="#374151">No</text>
    <text x="570" y="127" font-size="10" text-anchor="middle" fill="#374151">Yes (until cleared)</text>
    <text x="660" y="127" font-size="11" text-anchor="middle" fill="#ef4444">Never for tokens</text>

    <!-- sessionStorage -->
    <rect x="30" y="140" width="670" height="35" fill="#fef3c7"/>
    <text x="150" y="162" font-size="10" text-anchor="middle" fill="#374151">sessionStorage</text>
    <text x="310" y="162" font-size="11" text-anchor="middle" fill="#f59e0b">MEDIUM ⚠</text>
    <text x="440" y="162" font-size="10" text-anchor="middle" fill="#374151">No</text>
    <text x="570" y="162" font-size="10" text-anchor="middle" fill="#374151">Tab session only</text>
    <text x="660" y="162" font-size="11" text-anchor="middle" fill="#f59e0b">Avoid if possible</text>

    <!-- httpOnly cookie -->
    <rect x="30" y="175" width="670" height="35" fill="#dcfce7"/>
    <text x="150" y="197" font-size="10" text-anchor="middle" fill="#374151">httpOnly cookie</text>
    <text x="310" y="197" font-size="11" text-anchor="middle" fill="#10b981">LOW ✓</text>
    <text x="440" y="197" font-size="11" text-anchor="middle" fill="#f59e0b">MEDIUM ⚠</text>
    <text x="570" y="197" font-size="10" text-anchor="middle" fill="#374151">Configurable</text>
    <text x="660" y="197" font-size="11" text-anchor="middle" fill="#10b981">Refresh token ✓</text>

    <!-- Memory -->
    <rect x="30" y="210" width="670" height="35" fill="#dcfce7"/>
    <text x="150" y="232" font-size="10" text-anchor="middle" fill="#374151">JS Memory (variable)</text>
    <text x="310" y="232" font-size="11" text-anchor="middle" fill="#10b981">LOW ✓</text>
    <text x="440" y="232" font-size="10" text-anchor="middle" fill="#374151">No</text>
    <text x="570" y="232" font-size="10" text-anchor="middle" fill="#374151">No (page refresh)</text>
    <text x="660" y="232" font-size="11" text-anchor="middle" fill="#10b981">Access token ✓</text>

    <!-- Secure cookie -->
    <rect x="30" y="245" width="670" height="35" fill="#dcfce7"/>
    <text x="150" y="267" font-size="10" text-anchor="middle" fill="#374151">Secure+SameSite cookie</text>
    <text x="310" y="267" font-size="11" text-anchor="middle" fill="#10b981">LOW ✓</text>
    <text x="440" y="267" font-size="11" text-anchor="middle" fill="#10b981">LOW ✓</text>
    <text x="570" y="267" font-size="10" text-anchor="middle" fill="#374151">Configurable</text>
    <text x="660" y="267" font-size="11" text-anchor="middle" fill="#10b981">Best option ✓</text>
  </g>

  <!-- Recommended Architecture -->
  <g>
    <text x="890" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Recommended Setup</text>

    <rect x="730" y="75" width="340" height="220" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="900" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Two-Token Pattern</text>
    <text x="745" y="122" font-size="11" font-weight="bold" fill="#374151">Access Token (15 min):</text>
    <text x="745" y="140" font-size="10" fill="#374151">  Store in JS memory (closure/ref)</text>
    <text x="745" y="158" font-size="10" fill="#374151">  Attach via Authorization header</text>
    <text x="745" y="176" font-size="10" fill="#374151">  Lost on refresh → silent refresh</text>
    <text x="745" y="198" font-size="11" font-weight="bold" fill="#374151">Refresh Token (7 days):</text>
    <text x="745" y="216" font-size="10" fill="#374151">  httpOnly Secure SameSite=Strict</text>
    <text x="745" y="234" font-size="10" fill="#374151">  Sent only to /auth/refresh endpoint</text>
    <text x="745" y="252" font-size="10" fill="#374151">  Rotate on every use</text>
    <text x="745" y="270" font-size="9" fill="#3b82f6">Cookie sent automatically — no JS access needed</text>
  </g>

  <!-- Attack Mitigations -->
  <g>
    <text x="300" y="320" font-size="14" font-weight="bold" fill="#1a1a1a">Attack Surface &amp; Mitigations</text>

    <rect x="30" y="335" width="330" height="155" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="195" y="358" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">XSS Mitigation</text>
    <text x="45" y="380" font-size="10" fill="#374151">• Content-Security-Policy header</text>
    <text x="45" y="398" font-size="10" fill="#374151">• Escape all user input (DOMPurify)</text>
    <text x="45" y="416" font-size="10" fill="#374151">• Avoid eval(), innerHTML with user data</text>
    <text x="45" y="434" font-size="10" fill="#374151">• httpOnly cookies: no JS access even if XSS</text>
    <text x="45" y="452" font-size="10" fill="#374151">• Short-lived access tokens: limit window</text>
    <text x="45" y="474" font-size="9" fill="#ef4444">Even with XSS: attacker can't steal httpOnly cookie</text>

    <rect x="380" y="335" width="320" height="155" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="540" y="358" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">CSRF Mitigation</text>
    <text x="395" y="380" font-size="10" fill="#374151">• SameSite=Strict: blocks cross-site requests</text>
    <text x="395" y="398" font-size="10" fill="#374151">• CSRF token for state-changing requests</text>
    <text x="395" y="416" font-size="10" fill="#374151">• Check Origin / Referer header server-side</text>
    <text x="395" y="434" font-size="10" fill="#374151">• Double-submit cookie pattern</text>
    <text x="395" y="452" font-size="10" fill="#374151">• SameSite=Lax for read operations</text>
    <text x="395" y="474" font-size="9" fill="#f59e0b">SameSite=Strict breaks OAuth redirects — use Lax there</text>

    <rect x="720" y="335" width="350" height="155" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="895" y="358" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">Token Rotation</text>
    <text x="735" y="380" font-size="10" fill="#374151">• Refresh token rotates on every use</text>
    <text x="735" y="398" font-size="10" fill="#374151">• Detect reuse: if old token used, revoke all</text>
    <text x="735" y="416" font-size="10" fill="#374151">• Family tracking: tied to original session</text>
    <text x="735" y="434" font-size="10" fill="#374151">• Short access token life limits blast radius</text>
    <text x="735" y="452" font-size="10" fill="#374151">• Logout: revoke refresh + blocklist access</text>
    <text x="735" y="474" font-size="9" fill="#a855f7">Rotation detects token theft via reuse detection</text>
  </g>

  <rect x="30" y="510" width="1040" height="38" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="3"/>
  <text x="50" y="530" font-size="11" fill="#374151"><tspan font-weight="bold">Rule:</tspan> Access token in memory (lost on refresh = feature), refresh token in httpOnly Secure SameSite=Strict cookie. Never localStorage for auth tokens.</text>
</svg>
