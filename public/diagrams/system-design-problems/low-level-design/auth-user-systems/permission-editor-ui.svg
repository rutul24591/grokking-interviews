<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Permission Editor UI: Architecture &amp; UX Patterns</text>

  <!-- Editor UI Mockup -->
  <g>
    <text x="220" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Permission Editor Layout</text>

    <rect x="30" y="75" width="390" height="390" fill="#f9fafb" stroke="#d1d5db" stroke-width="2" rx="6"/>

    <!-- Role selector -->
    <rect x="45" y="90" width="360" height="38" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="60" y="114" font-size="11" fill="#374151">Role: </text>
    <text x="100" y="114" font-size="11" font-weight="bold" fill="#1e40af">Editor ▾</text>
    <text x="340" y="114" font-size="10" fill="#6b7280">3 users</text>

    <!-- Permission groups -->
    <text x="60" y="152" font-size="11" font-weight="bold" fill="#374151">Content</text>
    <rect x="45" y="160" width="360" height="30" fill="white" stroke="#e2e8f0" stroke-width="1" rx="2"/>
    <text x="60" y="180" font-size="10" fill="#374151">articles.create</text>
    <rect x="350" y="165" width="40" height="20" rx="10" fill="#10b981"/>
    <circle cx="380" cy="175" r="8" fill="white"/>

    <rect x="45" y="194" width="360" height="30" fill="white" stroke="#e2e8f0" stroke-width="1" rx="2"/>
    <text x="60" y="214" font-size="10" fill="#374151">articles.edit</text>
    <rect x="350" y="199" width="40" height="20" rx="10" fill="#10b981"/>
    <circle cx="380" cy="209" r="8" fill="white"/>

    <rect x="45" y="228" width="360" height="30" fill="white" stroke="#e2e8f0" stroke-width="1" rx="2"/>
    <text x="60" y="248" font-size="10" fill="#374151">articles.delete</text>
    <rect x="350" y="233" width="40" height="20" rx="10" fill="#d1d5db"/>
    <circle cx="360" cy="243" r="8" fill="white"/>

    <text x="60" y="278" font-size="11" font-weight="bold" fill="#374151">Users</text>
    <rect x="45" y="285" width="360" height="30" fill="white" stroke="#e2e8f0" stroke-width="1" rx="2"/>
    <text x="60" y="305" font-size="10" fill="#374151">users.read</text>
    <rect x="350" y="290" width="40" height="20" rx="10" fill="#10b981"/>
    <circle cx="380" cy="300" r="8" fill="white"/>

    <rect x="45" y="319" width="360" height="30" fill="white" stroke="#e2e8f0" stroke-width="1" rx="2"/>
    <text x="60" y="339" font-size="10" fill="#374151">users.manage</text>
    <rect x="350" y="324" width="40" height="20" rx="10" fill="#d1d5db"/>
    <circle cx="360" cy="334" r="8" fill="white"/>

    <!-- Save / Cancel -->
    <rect x="240" y="420" width="90" height="32" fill="#1e40af" rx="4"/>
    <text x="285" y="440" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Save</text>
    <rect x="340" y="420" width="90" height="32" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1" rx="4"/>
    <text x="385" y="440" font-size="11" text-anchor="middle" fill="#374151">Cancel</text>

    <text x="215" y="475" font-size="10" text-anchor="middle" fill="#6b7280">Preview permissions diff before saving</text>
  </g>

  <!-- Architecture -->
  <g>
    <text x="690" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Architecture &amp; Data Flow</text>

    <rect x="450" y="75" width="620" height="180" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="760" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Permission Data Model</text>
    <text x="465" y="122" font-size="10" fill="#374151">Role: {id, name, inheritsFrom?: roleId}</text>
    <text x="465" y="140" font-size="10" fill="#374151">Permission: {id, resource, action} e.g. "articles.delete"</text>
    <text x="465" y="158" font-size="10" fill="#374151">RolePermission: {roleId, permissionId, granted: boolean}</text>
    <text x="465" y="176" font-size="10" fill="#374151">UserRole: {userId, roleId} (many-to-many)</text>
    <text x="465" y="198" font-size="11" font-weight="bold" fill="#374151">Effective permissions =</text>
    <text x="465" y="215" font-size="10" fill="#374151">  union of all role permissions (inheritance chain)</text>
    <text x="465" y="233" font-size="10" fill="#374151">  explicit DENY overrides inherited ALLOW</text>
    <text x="465" y="247" font-size="9" fill="#3b82f6">Compute on server — send computed set to client on login</text>

    <rect x="450" y="270" width="300" height="170" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="600" y="295" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">UX Patterns</text>
    <text x="465" y="318" font-size="10" fill="#374151">Diff view: highlight changed permissions</text>
    <text x="465" y="336" font-size="10" fill="#374151">Confirm dialog for breaking changes</text>
    <text x="465" y="354" font-size="10" fill="#374151">Impact: "Affects 5 users" warning</text>
    <text x="465" y="372" font-size="10" fill="#374151">Inherited from: show source role</text>
    <text x="465" y="390" font-size="10" fill="#374151">Search permissions: filter by name</text>
    <text x="465" y="420" font-size="9" fill="#a855f7">Optimistic UI — revert on save error</text>

    <rect x="770" y="270" width="300" height="170" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="920" y="295" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Audit &amp; Safety</text>
    <text x="785" y="318" font-size="10" fill="#374151">Log all permission changes with actor + diff</text>
    <text x="785" y="336" font-size="10" fill="#374151">Require reason for sensitive changes</text>
    <text x="785" y="354" font-size="10" fill="#374151">Email affected users when roles change</text>
    <text x="785" y="372" font-size="10" fill="#374151">Version history: restore previous config</text>
    <text x="785" y="390" font-size="10" fill="#374151">Two-person rule for admin permission changes</text>
    <text x="785" y="420" font-size="9" fill="#10b981">Permissions applied on next request (not retroactively)</text>

    <rect x="450" y="455" width="620" height="75" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="760" y="478" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Bulk Operations</text>
    <text x="465" y="500" font-size="10" fill="#374151">Clone role: copy all permissions from existing role as starting point</text>
    <text x="465" y="517" font-size="10" fill="#374151">Export / import permission sets as JSON for environment parity</text>
  </g>

  <rect x="30" y="500" width="1040" height="48" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="3"/>
  <text x="50" y="520" font-size="11" fill="#374151"><tspan font-weight="bold">Model:</tspan> Permission strings (resource.action), role hierarchy with inheritance, deny overrides allow.</text>
  <text x="50" y="538" font-size="11" fill="#374151"><tspan font-weight="bold">UX:</tspan> Show inherited vs direct permissions. Diff before save. Warn on impact. Full audit trail of all changes.</text>
</svg>
