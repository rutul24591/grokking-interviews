<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Session Timeout &amp; Auto-Logout System</text>

  <!-- Activity Detection -->
  <g>
    <text x="220" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Activity Detection</text>

    <rect x="30" y="75" width="380" height="160" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="220" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Idle Tracking Events</text>
    <text x="45" y="122" font-size="10" fill="#374151">mousemove, mousedown, keydown</text>
    <text x="45" y="140" font-size="10" fill="#374151">touchstart, scroll, click</text>
    <text x="45" y="158" font-size="10" fill="#374151">→ Reset idle timer on any activity</text>
    <text x="45" y="180" font-size="11" font-weight="bold" fill="#374151">Throttle:</text>
    <text x="45" y="197" font-size="10" fill="#374151">  Throttle handler to 1/sec (avoid perf issues)</text>
    <text x="45" y="214" font-size="10" fill="#374151">  Use passive: true for scroll/touch listeners</text>
    <text x="45" y="228" font-size="9" fill="#3b82f6">document-level listeners (not per component)</text>

    <rect x="30" y="250" width="380" height="130" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="220" y="275" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Cross-Tab Sync</text>
    <text x="45" y="298" font-size="10" fill="#374151">BroadcastChannel('session_activity')</text>
    <text x="45" y="316" font-size="10" fill="#374151">→ Activity in tab A resets timer in tab B</text>
    <text x="45" y="334" font-size="10" fill="#374151">→ Logout in tab A triggers logout in all tabs</text>
    <text x="45" y="352" font-size="10" fill="#374151">Fallback: localStorage 'lastActivity' + storage event</text>
    <text x="45" y="366" font-size="9" fill="#10b981">Essential: user may be active in another tab</text>
  </g>

  <!-- Timer State Machine -->
  <g>
    <text x="600" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Timeout State Machine</text>

    <rect x="430" y="75" width="640" height="320" fill="#f9fafb" stroke="#d1d5db" stroke-width="1" rx="6"/>

    <ellipse cx="570" cy="135" rx="80" ry="28" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="570" y="139" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">ACTIVE</text>

    <path d="M 650 135 L 750 135" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#ato)"/>
    <text x="700" y="127" font-size="9" text-anchor="middle" fill="#92400e">idle &gt; 14 min</text>

    <ellipse cx="820" cy="135" rx="80" ry="28" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="820" y="139" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">WARNING</text>

    <path d="M 740 135 L 650 135" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="4,2" marker-end="url(#atg)"/>
    <text x="700" y="148" font-size="9" text-anchor="middle" fill="#065f46">user activity</text>

    <path d="M 820 163 L 820 220" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#atr)"/>
    <text x="832" y="196" font-size="9" fill="#991b1b">1 min no action</text>

    <ellipse cx="700" cy="250" rx="80" ry="28" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="700" y="254" font-size="11" font-weight="bold" text-anchor="middle" fill="#991b1b">LOGGED OUT</text>

    <path d="M 570 163 L 700 222" stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="4,2" marker-end="url(#atr)"/>
    <text x="610" y="210" font-size="9" fill="#991b1b">force logout (server)</text>

    <path d="M 700 278 L 570 307" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#atb)"/>
    <text x="610" y="308" font-size="9" fill="#1e40af">re-login</text>

    <ellipse cx="570" cy="330" rx="80" ry="28" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
    <text x="570" y="334" font-size="11" font-weight="bold" text-anchor="middle" fill="#581c87">RE-AUTH</text>

    <text x="750" y="355" font-size="9" fill="#6b7280">Timers: 14 min idle → warn; 15 min → logout</text>
    <text x="750" y="370" font-size="9" fill="#6b7280">Server-side: refresh token expiry enforces hard limit</text>
  </g>

  <!-- Warning Dialog & UX -->
  <g>
    <text x="220" y="415" font-size="14" font-weight="bold" fill="#1a1a1a">Warning Dialog UX</text>

    <rect x="30" y="430" width="380" height="110" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="220" y="455" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Warning Modal (1 min countdown)</text>
    <text x="45" y="477" font-size="10" fill="#374151">"You'll be logged out in 00:45"</text>
    <text x="45" y="495" font-size="10" fill="#374151">[Stay Logged In]   [Log Out Now]</text>
    <text x="45" y="513" font-size="10" fill="#374151">Countdown timer updates every second</text>
    <text x="45" y="528" font-size="9" fill="#92400e">aria-live="assertive" — screen reader alerts</text>
  </g>

  <g>
    <text x="790" y="415" font-size="14" font-weight="bold" fill="#1a1a1a">Post-Logout UX</text>

    <rect x="450" y="430" width="620" height="110" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="760" y="455" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Auto-Logout Actions</text>
    <text x="465" y="477" font-size="10" fill="#374151">1. Clear access token from memory</text>
    <text x="465" y="494" font-size="10" fill="#374151">2. Clear httpOnly cookie (POST /auth/logout)</text>
    <text x="465" y="511" font-size="10" fill="#374151">3. Redirect to /login?reason=timeout&amp;returnUrl=/previous-page</text>
    <text x="465" y="526" font-size="9" fill="#ef4444">Show "Session expired" message on login page; pre-fill returnUrl on re-auth</text>
  </g>

  <defs>
    <marker id="ato" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#f59e0b"/></marker>
    <marker id="atg" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#10b981"/></marker>
    <marker id="atr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#ef4444"/></marker>
    <marker id="atb" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/></marker>
  </defs>
</svg>
