<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Title -->
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Frontend Caching Layer Architecture
  </text>

  <!-- Request Flow -->
  <g>
    <text x="100" y="70" font-size="16" font-weight="bold" fill="#1a1a1a">Request Flow</text>

    <!-- Component -->
    <rect x="30" y="100" width="140" height="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="100" y="135" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Component</text>
    <text x="100" y="152" font-size="10" text-anchor="middle" fill="#1e40af">get(key)</text>

    <!-- Arrow to Cache -->
    <path d="M 170 130 L 220 130" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <!-- Cache Layer -->
    <rect x="220" y="100" width="140" height="60" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="290" y="135" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Cache Layer</text>
    <text x="290" y="152" font-size="10" text-anchor="middle" fill="#065f46">Check entry</text>

    <!-- Hit path -->
    <path d="M 290 160 L 290 210" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowgreen)"/>
    <text x="310" y="185" font-size="10" fill="#059669" font-weight="bold">Hit (fresh)</text>

    <rect x="230" y="210" width="120" height="50" fill="#dcfce7" stroke="#10b981" stroke-width="1" rx="3"/>
    <text x="290" y="240" font-size="10" text-anchor="middle" fill="#065f46" font-weight="bold">Return cached</text>

    <!-- Miss path -->
    <path d="M 360 130 L 420 130" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowred)"/>
    <text x="385" y="120" font-size="10" fill="#dc2626" font-weight="bold">Miss/Stale</text>

    <!-- Network -->
    <rect x="420" y="100" width="140" height="60" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="490" y="135" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Network</text>
    <text x="490" y="152" font-size="10" text-anchor="middle" fill="#991b1b">Fetch API</text>

    <!-- Return to cache -->
    <path d="M 490 160 L 490 210" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowred)"/>
    <text x="510" y="185" font-size="10" fill="#dc2626" font-weight="bold">Response</text>

    <!-- Cache Response -->
    <rect x="420" y="210" width="140" height="50" fill="#fee2e2" stroke="#ef4444" stroke-width="1" rx="3"/>
    <text x="490" y="240" font-size="10" text-anchor="middle" fill="#991b1b" font-weight="bold">Store + Return</text>

    <!-- Return to component -->
    <path d="M 360 235 L 170 235" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
    <text x="260" y="225" font-size="10" fill="#1e40af" font-weight="bold">data</text>
  </g>

  <!-- Cache Internal Structure -->
  <g>
    <text x="100" y="310" font-size="16" font-weight="bold" fill="#1a1a1a">Cache Internal Data Structures</text>

    <!-- Primary Cache Map -->
    <rect x="30" y="340" width="200" height="150" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" rx="4"/>
    <text x="130" y="360" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Primary Cache Map</text>
    <text x="40" y="382" font-size="10" fill="#374151">user-123 → {</text>
    <text x="50" y="398" font-size="10" fill="#374151">data: {...},</text>
    <text x="50" y="414" font-size="10" fill="#374151">timestamp: 123456,</text>
    <text x="50" y="430" font-size="10" fill="#374151">ttl: 300000,</text>
    <text x="50" y="446" font-size="10" fill="#374151">tags: ['user', 'profile']</text>
    <text x="40" y="462" font-size="10" fill="#374151">}</text>
    <text x="40" y="480" font-size="9" fill="#6b7280">O(1) lookup by key</text>

    <!-- Tag Index -->
    <rect x="250" y="340" width="200" height="150" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" rx="4"/>
    <text x="350" y="360" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Tag Index</text>
    <text x="260" y="382" font-size="10" fill="#374151">'user' → Set {</text>
    <text x="280" y="398" font-size="10" fill="#374151">user-123,</text>
    <text x="280" y="414" font-size="10" fill="#374151">posts-123,</text>
    <text x="280" y="430" font-size="10" fill="#374151">comments-456</text>
    <text x="260" y="446" font-size="10" fill="#374151">}</text>
    <text x="260" y="462" font-size="10" fill="#374151">'profile' → Set {user-123}</text>
    <text x="260" y="480" font-size="9" fill="#6b7280">Fast tag-based invalidation</text>

    <!-- LRU List -->
    <rect x="470" y="340" width="200" height="150" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" rx="4"/>
    <text x="570" y="360" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">LRU List (Ordered)</text>
    <text x="480" y="382" font-size="10" fill="#374151">HEAD →</text>
    <text x="480" y="398" font-size="10" fill="#374151">user-123 (most recent)</text>
    <text x="480" y="414" font-size="10" fill="#374151">↓</text>
    <text x="480" y="430" font-size="10" fill="#374151">posts-456</text>
    <text x="480" y="446" font-size="10" fill="#374151">↓</text>
    <text x="480" y="462" font-size="10" fill="#374151">comments-789 (least recent)</text>
    <text x="480" y="478" font-size="10" fill="#374151">← TAIL</text>
    <text x="480" y="480" font-size="9" fill="#6b7280">Evict tail when full</text>

    <!-- Memory Tracker -->
    <rect x="690" y="340" width="200" height="150" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" rx="4"/>
    <text x="790" y="360" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Memory Tracker</text>
    <text x="700" y="382" font-size="10" fill="#374151">currentSize: 32.5MB</text>
    <text x="700" y="398" font-size="10" fill="#374151">maxSize: 50MB</text>
    <text x="700" y="414" font-size="10" fill="#374151">threshold: 40MB (80%)</text>
    <text x="700" y="430" font-size="10" fill="#374151">entryCount: 256</text>
    <text x="700" y="446" font-size="10" fill="#374151">hitRate: 72%</text>
    <text x="700" y="462" font-size="10" fill="#374151">missRate: 28%</text>
    <text x="700" y="480" font-size="9" fill="#6b7280">Monitor &amp; trigger eviction</text>
  </g>

  <!-- Cache Operations -->
  <g>
    <text x="100" y="540" font-size="16" font-weight="bold" fill="#1a1a1a">Cache Operations &amp; Scenarios</text>

    <!-- Set Operation -->
    <rect x="30" y="570" width="280" height="110" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" rx="4"/>
    <text x="170" y="590" font-size="12" font-weight="bold" text-anchor="middle" fill="#312e81">Set(key, data, ttl, tags)</text>
    <text x="40" y="610" font-size="10" fill="#312e81">1. Store in primary map</text>
    <text x="40" y="626" font-size="10" fill="#312e81">2. Add to tag index</text>
    <text x="40" y="642" font-size="10" fill="#312e81">3. Move to LRU head</text>
    <text x="40" y="658" font-size="10" fill="#312e81">4. Update memory tracker</text>
    <text x="40" y="674" font-size="10" fill="#312e81">5. If over limit, evict LRU tail</text>

    <!-- Get Operation -->
    <rect x="330" y="570" width="280" height="110" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="470" y="590" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Get(key)</text>
    <text x="340" y="610" font-size="10" fill="#065f46">1. Look up key in map</text>
    <text x="340" y="626" font-size="10" fill="#065f46">2. Check if fresh (TTL)</text>
    <text x="340" y="642" font-size="10" fill="#065f46">3. If fresh, move to LRU head</text>
    <text x="340" y="658" font-size="10" fill="#065f46">4. Return (fresh or stale)</text>
    <text x="340" y="674" font-size="10" fill="#065f46">5. If stale, queue refetch</text>

    <!-- Invalidate Operation -->
    <rect x="630" y="570" width="280" height="110" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="770" y="590" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Invalidate(tag)</text>
    <text x="640" y="610" font-size="10" fill="#991b1b">1. Look up tag in index</text>
    <text x="640" y="626" font-size="10" fill="#991b1b">2. Get all affected keys</text>
    <text x="640" y="642" font-size="10" fill="#991b1b">3. Mark entries stale</text>
    <text x="640" y="658" font-size="10" fill="#991b1b">4. Remove from tag index</text>
    <text x="640" y="674" font-size="10" fill="#991b1b">5. Notify subscribers</text>
  </g>

  <!-- Key Metrics -->
  <g>
    <rect x="30" y="720" width="1140" height="70" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="2"/>
    <text x="50" y="742" font-size="11" fill="#92400e" font-weight="bold">Key Performance Metrics:</text>
    <text x="50" y="760" font-size="10" fill="#92400e">• Lookup: O(1) average, sub-millisecond. • Invalidation: O(k) where k = affected entries. • Memory: Bounded by max size with LRU eviction. • Hit rate: Increases with TTL/access patterns. • Stale-while-revalidate: Serves stale immediately, refetch async.</text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
    </marker>
  </defs>
</svg>
