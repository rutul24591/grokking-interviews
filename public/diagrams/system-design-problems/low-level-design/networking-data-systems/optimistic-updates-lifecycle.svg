<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <!-- Title -->
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Optimistic Update Lifecycle &amp; State Machine
  </text>

  <!-- State Machine -->
  <g>
    <text x="100" y="70" font-size="16" font-weight="bold" fill="#1a1a1a">State Transitions</text>

    <!-- Idle -->
    <circle cx="100" cy="160" r="35" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="100" y="167" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Idle</text>

    <!-- Optimistic Pending -->
    <circle cx="280" cy="160" r="45" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="280" y="160" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">Optimistic</text>
    <text x="280" y="175" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">Pending</text>

    <!-- Success -->
    <circle cx="100" cy="340" r="40" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="350" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Success</text>

    <!-- Rolled Back -->
    <circle cx="280" cy="340" r="40" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="280" y="350" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Rolled Back</text>

    <!-- Confirmed -->
    <circle cx="460" cy="160" r="40" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="460" y="167" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Confirmed</text>

    <!-- Transitions -->
    <!-- Idle to Optimistic Pending -->
    <path d="M 135 160 L 235 160" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowyellow)"/>
    <text x="180" y="150" font-size="10" fill="#f59e0b" font-weight="bold">mutation()</text>

    <!-- Optimistic Pending to Success -->
    <path d="M 260 190 L 130 310" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowgreen)"/>
    <text x="170" y="260" font-size="10" fill="#10b981" font-weight="bold">server success</text>

    <!-- Optimistic Pending to Rolled Back -->
    <path d="M 300 190 L 280 300" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowred)"/>
    <text x="300" y="250" font-size="10" fill="#dc2626" font-weight="bold">server error</text>

    <!-- Success to Confirmed -->
    <path d="M 140 330 Q 280 200 420 190" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowgreen)"/>
    <text x="250" y="260" font-size="10" fill="#10b981" font-weight="bold">confirmed</text>

    <!-- Rolled Back back to Idle -->
    <path d="M 240 340 Q 100 400 100 200" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowred)"/>
    <text x="80" y="280" font-size="10" fill="#dc2626" font-weight="bold">retry</text>

    <!-- Timeout path (Optimistic Pending waits) -->
    <path d="M 325 180 L 400 200" stroke="#9333ea" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
    <text x="350" y="175" font-size="10" fill="#7e22ce" font-weight="bold">timeout</text>
  </g>

  <!-- Undo Stack Visualization -->
  <g>
    <text x="650" y="70" font-size="16" font-weight="bold" fill="#1a1a1a">Undo Stack During Optimistic Update</text>

    <!-- Stack before mutation -->
    <rect x="600" y="100" width="180" height="120" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" rx="4"/>
    <text x="690" y="120" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Before Mutation</text>
    <rect x="610" y="135" width="160" height="30" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="690" y="155" font-size="10" text-anchor="middle" fill="#1e40af">prev_state: {title: "Old"}</text>
    <rect x="610" y="170" width="160" height="30" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="690" y="190" font-size="9" text-anchor="middle" fill="#1e40af">(empty if first mutation)</text>

    <!-- Arrow to during -->
    <path d="M 800 160 L 860 160" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#arrowgray)"/>

    <!-- Stack during mutation (optimistic) -->
    <rect x="860" y="100" width="180" height="120" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="950" y="120" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">During Mutation</text>
    <rect x="870" y="135" width="160" height="30" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="950" y="155" font-size="10" text-anchor="middle" fill="#991b1b">PUSHED: old state</text>
    <rect x="870" y="170" width="160" height="30" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="950" y="190" font-size="9" text-anchor="middle" fill="#1e40af">UI: {title: "New"}</text>

    <!-- Arrow to after success -->
    <path d="M 800 230 L 860 230" stroke="#9ca3af" stroke-width="2" fill="none" marker-end="url(#arrowgray)"/>

    <!-- Stack after success -->
    <rect x="860" y="220" width="180" height="120" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="950" y="240" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">After Success</text>
    <rect x="870" y="255" width="160" height="30" fill="#dcfce7" stroke="#10b981" stroke-width="1"/>
    <text x="950" y="275" font-size="10" text-anchor="middle" fill="#065f46">CONFIRMED</text>
    <rect x="870" y="290" width="160" height="30" fill="#dcfce7" stroke="#10b981" stroke-width="1"/>
    <text x="950" y="310" font-size="9" text-anchor="middle" fill="#059669">Stack cleared or</text>

    <!-- Stack after error (rollback) -->
    <rect x="600" y="240" width="180" height="120" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="690" y="260" font-size="11" font-weight="bold" text-anchor="middle" fill="#991b1b">After Error (Rollback)</text>
    <rect x="610" y="275" width="160" height="30" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="690" y="295" font-size="10" text-anchor="middle" fill="#991b1b">POPPED: restored</text>
    <rect x="610" y="310" width="160" height="30" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="690" y="330" font-size="9" text-anchor="middle" fill="#1e40af">UI reverted to old</text>
  </g>

  <!-- Request Lifecycle Timeline -->
  <g>
    <text x="100" y="430" font-size="16" font-weight="bold" fill="#1a1a1a">Complete Request Lifecycle</text>

    <!-- Timeline -->
    <line x1="50" y1="480" x2="1100" y2="480" stroke="#d1d5db" stroke-width="2"/>

    <!-- T0: User initiates -->
    <circle cx="50" cy="480" r="5" fill="#f59e0b"/>
    <text x="50" y="510" font-size="10" text-anchor="middle" fill="#374151">T0: Initiate</text>
    <text x="50" y="525" font-size="9" text-anchor="middle" fill="#92400e" font-weight="bold">mutation()</text>

    <!-- T1: Optimistic update -->
    <circle cx="250" cy="480" r="5" fill="#f59e0b"/>
    <text x="250" y="510" font-size="10" text-anchor="middle" fill="#374151">T1: Optimistic</text>
    <text x="250" y="525" font-size="9" text-anchor="middle" fill="#92400e" font-weight="bold">Update UI</text>

    <!-- T2: Request sent -->
    <circle cx="450" cy="480" r="5" fill="#6366f1"/>
    <text x="450" y="510" font-size="10" text-anchor="middle" fill="#374151">T2: Request</text>
    <text x="450" y="525" font-size="9" text-anchor="middle" fill="#4f46e5" font-weight="bold">Network sent</text>

    <!-- T3: Response -->
    <circle cx="700" cy="480" r="5" fill="#10b981"/>
    <text x="700" y="510" font-size="10" text-anchor="middle" fill="#374151">T3: Response</text>
    <text x="700" y="525" font-size="9" text-anchor="middle" fill="#059669" font-weight="bold">Server replies</text>

    <!-- T4a: Success -->
    <circle cx="850" cy="480" r="5" fill="#10b981"/>
    <text x="850" y="510" font-size="10" text-anchor="middle" fill="#374151">T4a: Confirmed</text>
    <text x="850" y="525" font-size="9" text-anchor="middle" fill="#059669" font-weight="bold">Success path</text>

    <!-- T4b: Error (branch) -->
    <circle cx="850" cy="550" r="5" fill="#ef4444"/>
    <text x="850" y="580" font-size="10" text-anchor="middle" fill="#374151">T4b: Rollback</text>
    <text x="850" y="595" font-size="9" text-anchor="middle" fill="#dc2626" font-weight="bold">Error path</text>

    <!-- Branching arrow -->
    <path d="M 700 480 L 850 480" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowgreen)"/>
    <path d="M 700 480 L 850 550" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowred)"/>
    <text x="750" y="470" font-size="10" fill="#059669" font-weight="bold">success</text>
    <text x="750" y="520" font-size="10" fill="#dc2626" font-weight="bold">error</text>

    <!-- T5: Final states -->
    <circle cx="1050" cy="480" r="5" fill="#10b981"/>
    <text x="1050" y="510" font-size="10" text-anchor="middle" fill="#374151">T5: Done</text>
    <text x="1050" y="525" font-size="9" text-anchor="middle" fill="#059669" font-weight="bold">Confirmed</text>

    <circle cx="1050" cy="550" r="5" fill="#ef4444"/>
    <text x="1050" y="580" font-size="10" text-anchor="middle" fill="#374151">T5: Done</text>
    <text x="1050" y="595" font-size="9" text-anchor="middle" fill="#dc2626" font-weight="bold">Reverted</text>
  </g>

  <!-- Key Metrics -->
  <g>
    <rect x="50" y="660" width="1100" height="70" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="2"/>
    <text x="70" y="682" font-size="11" fill="#92400e" font-weight="bold">Optimistic Update Success Metrics:</text>
    <text x="70" y="700" font-size="10" fill="#92400e">• Success Rate: % mutations confirmed immediately. • Rollback Rate: % mutations that fail and revert. • Time to Optimistic Update: &lt;10ms (synchronous). • Time to Server Response: 100-500ms. • Conflict Rate: % mutations that conflict with concurrent mutations.</text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowyellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowgray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
