<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Title -->
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Data Fetching Hook Lifecycle &amp; State Machine
  </text>

  <!-- State Machine Section -->
  <g>
    <text x="600" y="70" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">State Transitions</text>

    <!-- Idle State -->
    <circle cx="150" cy="180" r="40" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
    <text x="150" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Idle</text>

    <!-- Loading State -->
    <circle cx="150" cy="320" r="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
    <text x="150" y="325" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Loading</text>

    <!-- Success State -->
    <circle cx="350" cy="320" r="40" fill="#dcfce7" stroke="#10b981" stroke-width="2"/>
    <text x="350" y="325" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Success</text>

    <!-- Error State -->
    <circle cx="550" cy="320" r="40" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="550" y="325" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Error</text>

    <!-- Refetching State -->
    <circle cx="350" cy="480" r="40" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="350" y="480" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">Refetching</text>

    <!-- Transitions -->
    <!-- Idle to Loading -->
    <path d="M 150 220 L 150 280" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrowblue)"/>
    <text x="120" y="250" font-size="10" fill="#3b82f6" font-weight="bold">mount/deps change</text>

    <!-- Loading to Success -->
    <path d="M 190 300 L 310 300" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowgreen)"/>
    <text x="240" y="290" font-size="10" fill="#10b981" font-weight="bold">response OK</text>

    <!-- Loading to Error -->
    <path d="M 190 330 L 510 330" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowred)"/>
    <text x="350" y="350" font-size="10" fill="#ef4444" font-weight="bold">request fails</text>

    <!-- Success to Refetching -->
    <path d="M 350 360 L 350 440" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowyellow)"/>
    <text x="365" y="400" font-size="10" fill="#f59e0b" font-weight="bold">refetch()</text>

    <!-- Refetching back to Success -->
    <path d="M 310 460 Q 280 420 310 380" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowgreen)"/>
    <text x="270" y="420" font-size="10" fill="#10b981" font-weight="bold">success</text>

    <!-- Refetching to Error -->
    <path d="M 390 460 Q 450 390 520 350" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowred)"/>
    <text x="440" y="410" font-size="10" fill="#ef4444" font-weight="bold">fails</text>

    <!-- Error to Refetching (retry) -->
    <path d="M 510 360 Q 480 420 390 460" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowyellow)"/>
    <text x="480" y="420" font-size="10" fill="#f59e0b" font-weight="bold">retry</text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowyellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Request Lifecycle Phases -->
  <g>
    <text x="900" y="70" font-size="16" font-weight="bold" fill="#1a1a1a">Request Lifecycle Phases</text>

    <!-- Phase 1 -->
    <rect x="750" y="100" width="280" height="80" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="4"/>
    <text x="760" y="120" font-size="11" font-weight="bold" fill="#1a1a1a">1. Initialization</text>
    <text x="760" y="138" font-size="10" fill="#374151">Hook mounts, dependencies</text>
    <text x="760" y="152" font-size="10" fill="#374151">evaluated, state initialized</text>
    <text x="760" y="166" font-size="10" fill="#374151">to idle.</text>

    <!-- Phase 2 -->
    <rect x="750" y="195" width="280" height="80" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="4"/>
    <text x="760" y="215" font-size="11" font-weight="bold" fill="#1e40af">2. Cache Check</text>
    <text x="760" y="233" font-size="10" fill="#374151">Before fetch, check cache</text>
    <text x="760" y="247" font-size="10" fill="#374151">for data. If fresh, return.</text>
    <text x="760" y="261" font-size="10" fill="#374151">If stale, proceed to fetch.</text>

    <!-- Phase 3 -->
    <rect x="750" y="290" width="280" height="80" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="4"/>
    <text x="760" y="310" font-size="11" font-weight="bold" fill="#92400e">3. Request Setup</text>
    <text x="760" y="328" font-size="10" fill="#374151">Create AbortController,</text>
    <text x="760" y="342" font-size="10" fill="#374151">set timeout, add auth tokens,</text>
    <text x="760" y="356" font-size="10" fill="#374151">trace IDs to headers.</text>

    <!-- Phase 4 -->
    <rect x="750" y="385" width="280" height="80" fill="#e0e7ff" stroke="#6366f1" stroke-width="1" rx="4"/>
    <text x="760" y="405" font-size="11" font-weight="bold" fill="#312e81">4. Network Request</text>
    <text x="760" y="423" font-size="10" fill="#374151">Fetch initiated, network</text>
    <text x="760" y="437" font-size="10" fill="#374151">activity tracked, state set</text>
    <text x="760" y="451" font-size="10" fill="#374151">to loading.</text>

    <!-- Phase 5 -->
    <rect x="750" y="480" width="280" height="80" fill="#dcfce7" stroke="#10b981" stroke-width="1" rx="4"/>
    <text x="760" y="500" font-size="11" font-weight="bold" fill="#065f46">5. Response Processing</text>
    <text x="760" y="518" font-size="10" fill="#374151">Response received, body</text>
    <text x="760" y="532" font-size="10" fill="#374151">parsed, schema validated,</text>
    <text x="760" y="546" font-size="10" fill="#374151">errors checked.</text>

    <!-- Phase 6 -->
    <rect x="750" y="575" width="280" height="80" fill="#fce7f3" stroke="#ec4899" stroke-width="1" rx="4"/>
    <text x="760" y="595" font-size="11" font-weight="bold" fill="#831843">6. State Update</text>
    <text x="760" y="613" font-size="10" fill="#374151">Hook state updated with</text>
    <text x="760" y="627" font-size="10" fill="#374151">data or error, state set to</text>
    <text x="760" y="641" font-size="10" fill="#374151">success or error.</text>

    <!-- Phase 7 -->
    <rect x="750" y="670" width="280" height="80" fill="#f3e8ff" stroke="#a855f7" stroke-width="1" rx="4"/>
    <text x="760" y="690" font-size="11" font-weight="bold" fill="#581c87">7. Downstream Effects</text>
    <text x="760" y="708" font-size="10" fill="#374151">Components re-render,</text>
    <text x="760" y="722" font-size="10" fill="#374151">effects triggered, dependent</text>
    <text x="760" y="736" font-size="10" fill="#374151">fetches may initiate.</text>
  </g>

  <!-- Sample Request Flow -->
  <g>
    <text x="300" y="600" font-size="16" font-weight="bold" fill="#1a1a1a">Typical Request Flow</text>

    <!-- Timeline -->
    <line x1="50" y1="650" x2="700" y2="650" stroke="#d1d5db" stroke-width="2"/>

    <!-- T0: Mount -->
    <circle cx="50" cy="650" r="5" fill="#3b82f6"/>
    <text x="50" y="680" font-size="10" text-anchor="middle" fill="#374151">Mount</text>
    <text x="50" y="695" font-size="9" text-anchor="middle" fill="#1e40af" font-weight="bold">Idle → Loading</text>

    <!-- T1: Request sent -->
    <circle cx="200" cy="650" r="5" fill="#3b82f6"/>
    <text x="200" y="680" font-size="10" text-anchor="middle" fill="#374151">Request</text>
    <text x="200" y="695" font-size="9" text-anchor="middle" fill="#1e40af" font-weight="bold">Network sent</text>

    <!-- T2: Response -->
    <circle cx="400" cy="650" r="5" fill="#10b981"/>
    <text x="400" y="680" font-size="10" text-anchor="middle" fill="#374151">Response</text>
    <text x="400" y="695" font-size="9" text-anchor="middle" fill="#065f46" font-weight="bold">Loading → Success</text>

    <!-- T3: Render -->
    <circle cx="550" cy="650" r="5" fill="#10b981"/>
    <text x="550" y="680" font-size="10" text-anchor="middle" fill="#374151">Render</text>
    <text x="550" y="695" font-size="9" text-anchor="middle" fill="#065f46" font-weight="bold">UI updated</text>

    <!-- T4: Refetch -->
    <circle cx="700" cy="650" r="5" fill="#f59e0b"/>
    <text x="700" y="680" font-size="10" text-anchor="middle" fill="#374151">Refetch</text>
    <text x="700" y="695" font-size="9" text-anchor="middle" fill="#92400e" font-weight="bold">Success → Refetching</text>
  </g>

  <!-- Key Considerations -->
  <g>
    <rect x="50" y="750" width="1100" height="35" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="2"/>
    <text x="70" y="772" font-size="11" fill="#374151"><tspan font-weight="bold">State Machine ensures</tspan>: Consistent state transitions prevent invalid sequences. Deduplication at request level, not state. Cleanup handlers (AbortController) called on unmount. Error classification determines retry strategy.</text>
  </g>
</svg>
