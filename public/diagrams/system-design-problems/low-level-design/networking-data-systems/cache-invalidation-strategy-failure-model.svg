<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <marker id="arrow-red-cache-invalidation-strategy" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#dc2626"/></marker>
    <marker id="arrow-orange-cache-invalidation-strategy" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#d97843"/></marker>
  </defs>
  <rect x="18" y="18" width="924" height="524" rx="14" fill="#ffffff" stroke="#d7d2e8" stroke-width="1.5"/>
  <text x="480" y="46" text-anchor="middle" font-size="18" font-weight="700" fill="#171321">Cache Invalidation Strategy After Mutations Failure Model</text>
  <text x="480" y="68" text-anchor="middle" font-size="12" fill="#5f5a6f">Failure decisions that decide commit, retry, degrade, rollback, or ignore</text>
  <rect x="54" y="104" width="852" height="78" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="78" y="130" font-size="13" font-weight="700" fill="#9a3412">Critical edge case</text>
  <text x="78" y="154" font-size="11" fill="#334155">creating a comment should update the comment list, count badge, activity feed, and detail page without refetching everything</text>
  <rect x="70" y="226" width="176" height="74" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="158" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">stale or duplicate work</text>
  <text x="158" y="278" text-anchor="middle" font-size="10.5" fill="#334155">late response, retry, replay</text>
  <line x1="248" y1="263" x2="340" y2="263" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red-cache-invalidation-strategy)"/>
  <rect x="350" y="214" width="212" height="98" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="456" y="240" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">guard checks</text>
  <text x="456" y="264" text-anchor="middle" font-size="10.5" fill="#334155">key, token, auth, deadline</text>
  <text x="456" y="286" text-anchor="middle" font-size="10.5" fill="#334155">idempotency and freshness</text>
  <line x1="564" y1="263" x2="648" y2="263" stroke="#d97843" stroke-width="2.5" marker-end="url(#arrow-orange-cache-invalidation-strategy)"/>
  <rect x="658" y="204" width="230" height="118" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="773" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">recovery outcome</text>
  <text x="773" y="256" text-anchor="middle" font-size="10.5" fill="#334155">commit current response</text>
  <text x="773" y="278" text-anchor="middle" font-size="10.5" fill="#334155">retry with budget or degrade</text>
  <text x="773" y="300" text-anchor="middle" font-size="10.5" fill="#334155">ignore, rollback, or resync</text>
  <rect x="54" y="364" width="256" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="78" y="390" font-size="12" font-weight="700" fill="#0f172a">User-visible state</text>
  <text x="78" y="414" font-size="10.5" fill="#334155">stale banner, disabled action, retry CTA</text>
  <rect x="352" y="364" width="256" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="376" y="390" font-size="12" font-weight="700" fill="#0f172a">Rollback path</text>
  <text x="376" y="414" font-size="10.5" fill="#334155">over-invalidation causes thundering refetches; under-invalidatio</text>
  <rect x="650" y="364" width="256" height="86" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="674" y="390" font-size="12" font-weight="700" fill="#0f172a">Telemetry</text>
  <text x="674" y="414" font-size="10.5" fill="#334155">reason, attempt, stale age, fallback</text>
  <text x="480" y="512" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Goal: failures become explicit reducer events, not accidental promise ordering.</text>
  <g font-size="10.5" fill="#334155">
    <rect x="92" y="474" width="132" height="28" rx="6" fill="#ffffff" stroke="#fca5a5"/>
    <text x="158" y="492" text-anchor="middle">ignore stale</text>
    <rect x="244" y="474" width="132" height="28" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="310" y="492" text-anchor="middle">retry with jitter</text>
    <rect x="396" y="474" width="132" height="28" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="462" y="492" text-anchor="middle">commit current</text>
    <rect x="548" y="474" width="132" height="28" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="614" y="492" text-anchor="middle">rollback patch</text>
    <rect x="700" y="474" width="132" height="28" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="766" y="492" text-anchor="middle">snapshot resync</text>
    <rect x="396" y="516" width="168" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="480" y="532" text-anchor="middle">audit reason attached</text>
  </g>
</svg>