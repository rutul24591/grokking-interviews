<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <marker id="arrow-blue-token-refresh-system" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#2563eb"/></marker>
    <marker id="arrow-green-token-refresh-system" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#2f9d74"/></marker>
  </defs>
  <rect x="18" y="18" width="924" height="524" rx="14" fill="#ffffff" stroke="#d7d2e8" stroke-width="1.5"/>
  <text x="480" y="46" text-anchor="middle" font-size="18" font-weight="700" fill="#171321">Token Refresh System Runtime Flow</text>
  <text x="480" y="68" text-anchor="middle" font-size="12" fill="#5f5a6f">refresh coordinator with deterministic lifecycle, cache policy, transport, and observer signals</text>
  <rect x="54" y="102" width="852" height="72" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="78" y="126" font-size="13" font-weight="700" fill="#1d4ed8">Public API lane</text>
  <text x="78" y="150" font-size="11" fill="#334155">authFetch(request) with refreshQueue.enqueue(failedRequest)</text>
  <line x1="160" y1="190" x2="800" y2="190" stroke="#171321" stroke-width="2"/>
  <g fill="#5f5a6f" font-size="10" text-anchor="middle">
    <text x="160" y="210">normalize key</text><text x="292" y="210">registry lookup</text><text x="430" y="210">state event</text><text x="570" y="210">transport</text><text x="704" y="210">commit guard</text><text x="800" y="210">notify UI</text>
  </g>
  <g stroke="#171321" stroke-width="1.4">
    <line x1="160" y1="184" x2="160" y2="198"/><line x1="292" y1="184" x2="292" y2="198"/><line x1="430" y1="184" x2="430" y2="198"/><line x1="570" y1="184" x2="570" y2="198"/><line x1="704" y1="184" x2="704" y2="198"/><line x1="800" y1="184" x2="800" y2="198"/>
  </g>
  <rect x="54" y="238" width="250" height="104" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="78" y="264" font-size="13" font-weight="700" fill="#065f46">Lifecycle reducer</text>
  <text x="78" y="288" font-size="11" fill="#334155">valid, expiring, refreshing, replaying, failed, loggedOut</text>
  <text x="78" y="314" font-size="11" fill="#334155">pure transitions, testable without React</text>
  <rect x="356" y="238" width="250" height="104" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="380" y="264" font-size="13" font-weight="700" fill="#9a3412">Registry and cache</text>
  <text x="380" y="288" font-size="11" fill="#334155">access token in memory, refresh token in secure cookie, refresh status b</text>
  <text x="380" y="314" font-size="11" fill="#334155">dedupe, stale age, subscribers, eviction</text>
  <rect x="658" y="238" width="248" height="104" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="682" y="264" font-size="13" font-weight="700" fill="#5b21b6">Transport adapter</text>
  <text x="682" y="288" font-size="11" fill="#334155">fetch, GraphQL, WebSocket, upload, auth</text>
  <text x="682" y="314" font-size="11" fill="#334155">abort, timeout, retry, sequence validation</text>
  <line x1="304" y1="290" x2="350" y2="290" stroke="#2f9d74" stroke-width="2.5" marker-end="url(#arrow-green-token-refresh-system)"/>
  <line x1="606" y1="290" x2="652" y2="290" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow-blue-token-refresh-system)"/>
  <rect x="54" y="378" width="852" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="78" y="404" font-size="13" font-weight="700" fill="#0f172a">Commit and observer lane</text>
  <text x="78" y="430" font-size="11" fill="#334155">Commit guard checks current key, auth scope, sequence token, cache freshness, and subscriber liveness.</text>
  <text x="78" y="454" font-size="11" fill="#334155">Observer emits latency, cache source, retry reason, stale suppression, rollback, and user-visible fallback metrics.</text>
  <text x="480" y="512" text-anchor="middle" font-size="11" font-weight="700" fill="#1d4ed8">Invariant: the UI only commits responses that still match the latest accepted operation and security scope.</text>
  <g font-size="10.5" fill="#334155">
    <rect x="74" y="486" width="118" height="28" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="133" y="504" text-anchor="middle">abort token</text>
    <rect x="210" y="486" width="118" height="28" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="269" y="504" text-anchor="middle">retry budget</text>
    <rect x="346" y="486" width="118" height="28" rx="6" fill="#ffffff" stroke="#fdba74"/>
    <text x="405" y="504" text-anchor="middle">LRU entry</text>
    <rect x="482" y="486" width="118" height="28" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
    <text x="541" y="504" text-anchor="middle">subscriber set</text>
    <rect x="618" y="486" width="118" height="28" rx="6" fill="#ffffff" stroke="#fca5a5"/>
    <text x="677" y="504" text-anchor="middle">commit guard</text>
    <rect x="754" y="486" width="118" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="813" y="504" text-anchor="middle">trace event</text>
  </g>
</svg>