<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500">
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Retry Mechanism: Exponential Backoff Strategies</text>

  <!-- Backoff Strategies Comparison -->
  <g>
    <text x="100" y="70" font-size="14" font-weight="bold" fill="#1a1a1a">Backoff Strategies</text>

    <!-- No Backoff (Bad) -->
    <rect x="50" y="100" width="200" height="140" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="150" y="125" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">No Backoff (Bad)</text>
    <text x="60" y="150" font-size="10" fill="#374151">Retry immediately:</text>
    <line x1="60" y1="165" x2="180" y2="165" stroke="#ef4444" stroke-width="2"/>
    <circle cx="60" cy="165" r="3" fill="#ef4444"/>
    <text x="70" y="172" font-size="9" fill="#374151">Req</text>
    <circle cx="95" cy="165" r="3" fill="#ef4444"/>
    <text x="100" y="172" font-size="9" fill="#374151">Req</text>
    <circle cx="130" cy="165" r="3" fill="#ef4444"/>
    <text x="135" y="172" font-size="9" fill="#374151">Req</text>
    <circle cx="165" cy="165" r="3" fill="#ef4444"/>
    <text x="170" y="172" font-size="9" fill="#374151">Req</text>
    <text x="60" y="205" font-size="9" fill="#374151">→ Thundering herd</text>
    <text x="60" y="220" font-size="9" fill="#374151">→ Overwhelms server</text>

    <!-- Fixed Backoff -->
    <rect x="280" y="100" width="200" height="140" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="380" y="125" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Fixed Backoff</text>
    <text x="290" y="150" font-size="10" fill="#374151">Delay: 500ms always</text>
    <line x1="290" y1="165" x2="460" y2="165" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="290" cy="165" r="3" fill="#f59e0b"/>
    <text x="295" y="172" font-size="9" fill="#374151">Req</text>
    <text x="310" y="172" font-size="9" fill="#374151">-500ms-</text>
    <circle cx="365" cy="165" r="3" fill="#f59e0b"/>
    <text x="375" y="172" font-size="9" fill="#374151">Req</text>
    <text x="395" y="172" font-size="9" fill="#374151">-500ms-</text>
    <circle cx="450" cy="165" r="3" fill="#f59e0b"/>
    <text x="460" y="172" font-size="9" fill="#374151">Req</text>
    <text x="290" y="205" font-size="9" fill="#374151">→ Synchronized retries</text>
    <text x="290" y="220" font-size="9" fill="#374151">→ Load spikes</text>

    <!-- Exponential Backoff -->
    <rect x="510" y="100" width="200" height="140" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="610" y="125" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Exponential Backoff</text>
    <text x="520" y="150" font-size="10" fill="#374151">Delay: 2^n * 100ms</text>
    <line x1="520" y1="165" x2="690" y2="165" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="520" cy="165" r="3" fill="#3b82f6"/>
    <text x="525" y="172" font-size="8" fill="#374151">Req</text>
    <text x="540" y="172" font-size="8" fill="#374151">-100ms-</text>
    <circle cx="575" cy="165" r="3" fill="#3b82f6"/>
    <text x="580" y="172" font-size="8" fill="#374151">Req</text>
    <text x="600" y="172" font-size="8" fill="#374151">-200ms-</text>
    <circle cx="650" cy="165" r="3" fill="#3b82f6"/>
    <text x="655" y="172" font-size="8" fill="#374151">Req</text>
    <text x="210" y="205" font-size="9" fill="#374151">→ Spreading retries</text>
    <text x="210" y="220" font-size="9" fill="#374151">→ Reduces load spikes</text>

    <!-- Jitter -->
    <rect x="740" y="100" width="200" height="140" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="840" y="125" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Exponential + Jitter</text>
    <text x="750" y="150" font-size="10" fill="#374151">Delay: 2^n +random</text>
    <line x1="750" y1="165" x2="920" y2="165" stroke="#10b981" stroke-width="2"/>
    <circle cx="750" cy="165" r="3" fill="#10b981"/>
    <text x="755" y="172" font-size="8" fill="#374151">Req</text>
    <text x="765" y="172" font-size="8" fill="#374151">-130ms-</text>
    <circle cx="800" cy="165" r="3" fill="#10b981"/>
    <text x="805" y="172" font-size="8" fill="#374151">Req</text>
    <text x="825" y="172" font-size="8" fill="#374151">-280ms-</text>
    <circle cx="900" cy="165" r="3" fill="#10b981"/>
    <text x="905" y="172" font-size="8" fill="#374151">Req</text>
    <text x="750" y="205" font-size="9" fill="#374151">→ Prevents synchronization</text>
    <text x="750" y="220" font-size="9" fill="#374151">→ Optimal distribution</text>
  </g>

  <!-- Error Classification and Retry Decision -->
  <g>
    <text x="100" y="290" font-size="14" font-weight="bold" fill="#1a1a1a">Error Types & Retry Decision</text>

    <!-- Retryable Errors -->
    <rect x="50" y="320" width="280" height="140" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="190" y="345" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Retryable Errors</text>
    <text x="60" y="370" font-size="10" fill="#374151">✓ Network timeout</text>
    <text x="60" y="385" font-size="10" fill="#374151">✓ 429 (Rate limited)</text>
    <text x="60" y="400" font-size="10" fill="#374151">✓ 500 (Server error)</text>
    <text x="60" y="415" font-size="10" fill="#374151">✓ 503 (Unavailable)</text>
    <text x="60" y="430" font-size="10" fill="#374151">✓ Connection reset</text>
    <text x="60" y="445" font-size="10" fill="#374151">Action: Auto-retry with backoff</text>

    <!-- Non-Retryable Errors -->
    <rect x="360" y="320" width="280" height="140" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="500" y="345" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Non-Retryable</text>
    <text x="370" y="370" font-size="10" fill="#374151">✗ 400 (Bad request)</text>
    <text x="370" y="385" font-size="10" fill="#374151">✗ 401 (Unauthorized)</text>
    <text x="370" y="400" font-size="10" fill="#374151">✗ 403 (Forbidden)</text>
    <text x="370" y="415" font-size="10" fill="#374151">✗ 404 (Not found)</text>
    <text x="370" y="430" font-size="10" fill="#374151">✗ Invalid JSON</text>
    <text x="370" y="445" font-size="10" fill="#374151">Action: Fail immediately</text>

    <!-- Conditional Retry -->
    <rect x="670" y="320" width="280" height="140" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="810" y="345" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Conditional Retry</text>
    <text x="680" y="370" font-size="10" fill="#374151">? 408 (Request timeout)</text>
    <text x="680" y="385" font-size="10" fill="#374151">? 502 (Bad gateway)</text>
    <text x="680" y="400" font-size="10" fill="#374151">? 504 (Gateway timeout)</text>
    <text x="680" y="415" font-size="10" fill="#374151">? Depends on idempotency</text>
    <text x="680" y="430" font-size="10" fill="#374151">? Depends on operation</text>
    <text x="680" y="445" font-size="10" fill="#374151">Action: Assess before retrying</text>
  </g>
</svg>