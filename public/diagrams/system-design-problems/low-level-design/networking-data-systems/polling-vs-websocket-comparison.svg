<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <!-- Title -->
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Polling vs WebSocket: Architecture Comparison
  </text>

  <!-- Polling Architecture -->
  <g>
    <text x="250" y="70" font-size="16" font-weight="bold" fill="#1a1a1a">Polling Pattern</text>

    <rect x="120" y="100" width="260" height="280" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" rx="4"/>

    <!-- Client -->
    <rect x="140" y="120" width="100" height="50" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="3"/>
    <text x="190" y="152" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Client</text>

    <!-- Timer -->
    <text x="140" y="195" font-size="11" fill="#374151">Every N seconds:</text>

    <!-- Request arrow -->
    <path d="M 240 180 L 320 180" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowyellow)"/>
    <text x="270" y="170" font-size="10" fill="#f59e0b" font-weight="bold">GET /updates</text>

    <!-- Server -->
    <rect x="320" y="140" width="100" height="50" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="3"/>
    <text x="370" y="172" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Server</text>

    <!-- Response arrow -->
    <path d="M 320 220 L 240 220" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowgreen)"/>
    <text x="270" y="240" font-size="10" fill="#059669" font-weight="bold">Response (may be empty)</text>

    <!-- Timeline section -->
    <text x="140" y="280" font-size="11" font-weight="bold" fill="#1a1a1a">Timeline Example (30s interval):</text>
    <line x1="140" y1="295" x2="360" y2="295" stroke="#d1d5db" stroke-width="1"/>

    <circle cx="140" cy="295" r="3" fill="#f59e0b"/>
    <text x="140" y="320" font-size="9" text-anchor="middle" fill="#374151">T=0s: Req</text>

    <circle cx="205" cy="295" r="3" fill="#10b981"/>
    <text x="205" y="320" font-size="9" text-anchor="middle" fill="#374151">T=10s: Resp</text>

    <circle cx="270" cy="295" r="3" fill="#f59e0b"/>
    <text x="270" y="320" font-size="9" text-anchor="middle" fill="#374151">T=30s: Req</text>

    <circle cx="335" cy="295" r="3" fill="#10b981"/>
    <text x="335" y="320" font-size="9" text-anchor="middle" fill="#374151">T=40s: Resp</text>

    <!-- Characteristics -->
    <text x="140" y="360" font-size="11" font-weight="bold" fill="#1a1a1a">Characteristics:</text>
    <text x="140" y="380" font-size="10" fill="#374151">• Latency: Up to N seconds (30s delay)</text>
    <text x="140" y="398" font-size="10" fill="#374151">• Traffic: Many empty responses</text>
    <text x="140" y="416" font-size="10" fill="#374151">• Bandwidth: High (overhead)</text>
  </g>

  <!-- WebSocket Architecture -->
  <g>
    <text x="900" y="70" font-size="16" font-weight="bold" fill="#1a1a1a">WebSocket Pattern</text>

    <rect x="770" y="100" width="260" height="280" fill="#f3f4f6" stroke="#6b7280" stroke-width="2" rx="4"/>

    <!-- Client -->
    <rect x="790" y="120" width="100" height="50" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="3"/>
    <text x="840" y="152" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Client</text>

    <!-- Connection -->
    <text x="790" y="195" font-size="11" fill="#374151">Persistent connection:</text>

    <!-- Bidirectional -->
    <path d="M 890 160 L 950 160" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#arrow2)"/>
    <path d="M 950 190 L 890 190" stroke="#6366f1" stroke-width="2" fill="none" marker-end="url(#arrow2back)"/>
    <text x="900" y="150" font-size="9" fill="#4f46e5" font-weight="bold">send/receive</text>

    <!-- Server -->
    <rect x="950" y="140" width="100" height="50" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="3"/>
    <text x="1000" y="172" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Server</text>

    <!-- Timeline section -->
    <text x="790" y="280" font-size="11" font-weight="bold" fill="#1a1a1a">Timeline Example (instant push):</text>
    <line x1="790" y1="295" x2="1010" y2="295" stroke="#d1d5db" stroke-width="1"/>

    <circle cx="790" cy="295" r="3" fill="#6366f1"/>
    <text x="790" y="320" font-size="9" text-anchor="middle" fill="#374151">T=0s: Connect</text>

    <circle cx="875" cy="295" r="3" fill="#10b981"/>
    <text x="875" y="320" font-size="9" text-anchor="middle" fill="#374151">T=7s: Push</text>

    <circle cx="945" cy="295" r="3" fill="#10b981"/>
    <text x="945" y="320" font-size="9" text-anchor="middle" fill="#374151">T=15s: Push</text>

    <circle cx="1010" cy="295" r="3" fill="#10b981"/>
    <text x="1010" y="320" font-size="9" text-anchor="middle" fill="#374151">T=22s: Push</text>

    <!-- Characteristics -->
    <text x="790" y="360" font-size="11" font-weight="bold" fill="#1a1a1a">Characteristics:</text>
    <text x="790" y="380" font-size="10" fill="#374151">• Latency: Sub-second (instant)</text>
    <text x="790" y="398" font-size="10" fill="#374151">• Traffic: Only actual updates</text>
    <text x="790" y="416" font-size="10" fill="#374151">• Bandwidth: Low (efficient)</text>
  </g>

  <!-- Comparison Matrix -->
  <g>
    <text x="600" y="460" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Decision Matrix</text>

    <!-- Headers -->
    <rect x="50" y="480" width="200" height="40" fill="#e5e7eb" stroke="#6b7280" stroke-width="1"/>
    <text x="150" y="510" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Criteria</text>

    <rect x="250" y="480" width="170" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="335" y="510" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">Polling</text>

    <rect x="420" y="480" width="170" height="40" fill="#dcfce7" stroke="#10b981" stroke-width="1"/>
    <text x="505" y="510" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">WebSocket</text>

    <!-- Latency -->
    <rect x="50" y="520" width="200" height="35" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
    <text x="150" y="545" font-size="10" text-anchor="middle" fill="#374151">Latency</text>

    <rect x="250" y="520" width="170" height="35" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="335" y="545" font-size="10" text-anchor="middle" fill="#92400e">500ms-30s</text>

    <rect x="420" y="520" width="170" height="35" fill="#dcfce7" stroke="#10b981" stroke-width="1"/>
    <text x="505" y="545" font-size="10" text-anchor="middle" fill="#065f46">&lt;100ms</text>

    <!-- Bandwidth -->
    <rect x="50" y="555" width="200" height="35" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
    <text x="150" y="580" font-size="10" text-anchor="middle" fill="#374151">Bandwidth</text>

    <rect x="250" y="555" width="170" height="35" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="335" y="580" font-size="10" text-anchor="middle" fill="#991b1b">High (overhead)</text>

    <rect x="420" y="555" width="170" height="35" fill="#dcfce7" stroke="#10b981" stroke-width="1"/>
    <text x="505" y="580" font-size="10" text-anchor="middle" fill="#065f46">Low (efficient)</text>

    <!-- Complexity -->
    <rect x="50" y="590" width="200" height="35" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
    <text x="150" y="615" font-size="10" text-anchor="middle" fill="#374151">Complexity</text>

    <rect x="250" y="590" width="170" height="35" fill="#dcfce7" stroke="#10b981" stroke-width="1"/>
    <text x="335" y="615" font-size="10" text-anchor="middle" fill="#065f46">Low (simple)</text>

    <rect x="420" y="590" width="170" height="35" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
    <text x="505" y="615" font-size="10" text-anchor="middle" fill="#991b1b">Medium (stateful)</text>

    <!-- Best For -->
    <rect x="50" y="625" width="200" height="35" fill="#f3f4f6" stroke="#6b7280" stroke-width="1"/>
    <text x="150" y="650" font-size="10" text-anchor="middle" fill="#374151">Best For</text>

    <rect x="250" y="625" width="170" height="35" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="335" y="650" font-size="9" text-anchor="middle" fill="#92400e">Email, Notifications</text>

    <rect x="420" y="625" width="170" height="35" fill="#dcfce7" stroke="#10b981" stroke-width="1"/>
    <text x="505" y="650" font-size="9" text-anchor="middle" fill="#065f46">Chat, Live Updates</text>
  </g>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowyellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6366f1"/>
    </marker>
    <marker id="arrow2back" markerWidth="10" markerHeight="10" refX="0" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M9,0 L9,6 L0,3 z" fill="#6366f1"/>
    </marker>
  </defs>
</svg>