<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <text x="600" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Request Batching: Combining Multiple Queries</text>

  <!-- Without Batching -->
  <g>
    <text x="200" y="70" font-size="14" font-weight="bold" fill="#1a1a1a">Without Batching (N+1 Problem)</text>

    <!-- Components -->
    <rect x="80" y="100" width="80" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="3"/>
    <text x="120" y="127" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e40af">Component A</text>

    <rect x="180" y="100" width="80" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="3"/>
    <text x="220" y="127" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e40af">Component B</text>

    <rect x="280" y="100" width="80" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="3"/>
    <text x="320" y="127" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e40af">Component C</text>

    <!-- Three separate requests -->
    <path d="M 120 140 L 120 200" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowred)"/>
    <path d="M 220 140 L 220 200" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowred)"/>
    <path d="M 320 140 L 320 200" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrowred)"/>

    <text x="120" y="165" font-size="9" text-anchor="middle" fill="#dc2626">GET /a</text>
    <text x="220" y="165" font-size="9" text-anchor="middle" fill="#dc2626">GET /b</text>
    <text x="320" y="165" font-size="9" text-anchor="middle" fill="#dc2626">GET /c</text>

    <!-- Network -->
    <rect x="80" y="200" width="300" height="50" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="3"/>
    <text x="230" y="230" font-size="11" font-weight="bold" text-anchor="middle" fill="#991b1b">3 Requests (serial or parallel)</text>

    <!-- Timeline -->
    <line x1="80" y1="280" x2="380" y2="280" stroke="#d1d5db" stroke-width="1"/>
    <circle cx="100" cy="280" r="3" fill="#ef4444"/>
    <circle cx="170" cy="280" r="3" fill="#ef4444"/>
    <circle cx="240" cy="280" r="3" fill="#ef4444"/>
    <circle cx="310" cy="280" r="3" fill="#ef4444"/>
    <circle cx="360" cy="280" r="3" fill="#ef4444"/>
    <text x="230" y="300" font-size="10" text-anchor="middle" fill="#374151">Total latency: ~500ms (3 RTTs)</text>
  </g>

  <!-- With Batching -->
  <g>
    <text x="850" y="70" font-size="14" font-weight="bold" fill="#1a1a1a">With Batching (Grouped)</text>

    <!-- Components -->
    <rect x="730" y="100" width="80" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="3"/>
    <text x="770" y="127" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e40af">Component A</text>

    <rect x="830" y="100" width="80" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="3"/>
    <text x="870" y="127" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e40af">Component B</text>

    <rect x="930" y="100" width="80" height="40" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="3"/>
    <text x="970" y="127" font-size="10" font-weight="bold" text-anchor="middle" fill="#1e40af">Component C</text>

    <!-- All queue to batcher -->
    <path d="M 770 140 L 820 180" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowyellow)"/>
    <path d="M 870 140 L 870 180" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowyellow)"/>
    <path d="M 970 140 L 920 180" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#arrowyellow)"/>

    <!-- Batcher -->
    <rect x="770" y="180" width="150" height="50" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="3"/>
    <text x="845" y="212" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">Request Batcher</text>

    <!-- One batched request -->
    <path d="M 845 230 L 845 280" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowgreen)"/>

    <text x="845" y="255" font-size="9" text-anchor="middle" fill="#059669">POST /batch</text>

    <!-- Network -->
    <rect x="730" y="280" width="230" height="50" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="3"/>
    <text x="845" y="310" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">1 Batched Request</text>

    <!-- Timeline -->
    <line x1="730" y1="360" x2="980" y2="360" stroke="#d1d5db" stroke-width="1"/>
    <circle cx="750" cy="360" r="3" fill="#10b981"/>
    <circle cx="800" cy="360" r="3" fill="#10b981"/>
    <circle cx="950" cy="360" r="3" fill="#10b981"/>
    <text x="845" y="380" font-size="10" text-anchor="middle" fill="#374151">Total latency: ~170ms (1 RTT)</text>
  </g>

  <!-- Batching Strategy Details -->
  <g>
    <text x="100" y="450" font-size="14" font-weight="bold" fill="#1a1a1a">Batching Strategies</text>

    <!-- Time-Based -->
    <rect x="50" y="480" width="280" height="100" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="190" y="505" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Time-Based Batching</text>
    <text x="60" y="530" font-size="10" fill="#374151">• Accumulate requests for Nms</text>
    <text x="60" y="546" font-size="10" fill="#374151">• On timeout, send batch</text>
    <text x="60" y="562" font-size="10" fill="#374151">• Default: 10-50ms window</text>

    <!-- Size-Based -->
    <rect x="360" y="480" width="280" height="100" fill="#e0e7ff" stroke="#6366f1" stroke-width="2" rx="4"/>
    <text x="500" y="505" font-size="12" font-weight="bold" text-anchor="middle" fill="#312e81">Size-Based Batching</text>
    <text x="370" y="530" font-size="10" fill="#374151">• Batch when reaches size limit</text>
    <text x="370" y="546" font-size="10" fill="#374151">• Default: 20-50 requests</text>
    <text x="370" y="562" font-size="10" fill="#374151">• Send immediately when full</text>

    <!-- Hybrid -->
    <rect x="670" y="480" width="280" height="100" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="810" y="505" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Hybrid Batching</text>
    <text x="680" y="530" font-size="10" fill="#374151">• Combine time + size</text>
    <text x="680" y="546" font-size="10" fill="#374151">• Send on timeout OR size limit</text>
    <text x="680" y="562" font-size="10" fill="#374151">• Best latency vs throughput</text>
  </g>

  <defs>
    <marker id="arrowred" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
    </marker>
    <marker id="arrowyellow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
    </marker>
  </defs>
</svg>