<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><rect width="1200" height="720" rx="28" fill="#eff6ff"/><rect x="42" y="38" width="1116" height="642" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="76" y="88" font-family="Arial" font-size="29" font-weight="700" fill="#0f172a">Design a RAG-based Search UI: runtime</text><text x="76" y="122" font-family="Arial" font-size="16" fill="#475569">Generated answers must expose grounding and incomplete states instead of presenting every token as authoritative.</text><path d="M100 222 C150 154 264 150 320 220 C370 286 320 376 220 390 C126 402 62 316 100 222" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="138" y="250" font-family="Arial" font-size="20" font-weight="700" fill="#1e3a8a">Search session</text><text x="132" y="284" font-family="Arial" font-size="15" fill="#1d4ed8">focus + query</text><text x="132" y="310" font-family="Arial" font-size="15" fill="#1d4ed8">URL + filters</text><path d="M326 292 L446 292" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="452" y="184" width="276" height="216" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/><text x="484" y="226" font-family="Arial" font-size="20" font-weight="700" fill="#164e63">Query coordinator</text><text x="484" y="260" font-family="Arial" font-size="15" fill="#155e75">submitQuestion /  streamAnswer /  appendCitation</text><text x="484" y="292" font-family="Arial" font-size="15" fill="#155e75">debounce + dedupe</text><text x="484" y="318" font-family="Arial" font-size="15" fill="#155e75">abort + settle guard</text><path d="M728 248 C804 204 832 174 900 168" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="900" y="118" width="220" height="132" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="930" y="160" font-family="Arial" font-size="20" font-weight="700" fill="#14532d">Projection</text><text x="930" y="194" font-family="Arial" font-size="15" fill="#166534">stable results</text><text x="930" y="220" font-family="Arial" font-size="15" fill="#166534">facets / citations</text><path d="M728 342 C806 394 834 448 900 470" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="900" y="420" width="220" height="142" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="930" y="462" font-family="Arial" font-size="20" font-weight="700" fill="#7f1d1d">Recovery</text><text x="930" y="496" font-family="Arial" font-size="15" fill="#991b1b">stale / partial</text><text x="930" y="522" font-family="Arial" font-size="15" fill="#991b1b">retry / fallback</text><rect x="136" y="506" width="628" height="88" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/><text x="166" y="540" font-family="Arial" font-size="18" font-weight="700" fill="#0f172a">Search evidence</text><text x="166" y="570" font-family="Arial" font-size="15" fill="#334155">question id, retrieval set, answer buffer, citation registry, source preview, stream cursor, confidence state</text><path d="M586 400 C566 456 510 490 430 506" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8" fill="none" marker-end="url(#a)"/></svg>