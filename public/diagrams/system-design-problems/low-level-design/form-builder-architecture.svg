<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Form Builder — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Field schema · Conditional graph · Validation engine · Multi-step &amp; submit</text>
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — FIELD SCHEMA</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">FieldDefinition</text>
  <text x="34" y="133" font-size="9" fill="#374151">id: string (unique)</text>
  <text x="34" y="148" font-size="9" fill="#374151">type: text|email|number|date</text>
  <text x="34" y="163" font-size="9" fill="#374151">  |select|multi|radio|checkbox</text>
  <text x="34" y="178" font-size="9" fill="#374151">  |file|rating|signature</text>
  <text x="34" y="193" font-size="9" fill="#374151">label: string</text>
  <text x="34" y="208" font-size="9" fill="#374151">placeholder / helpText</text>
  <text x="34" y="223" font-size="9" fill="#374151">required: boolean</text>
  <text x="34" y="240" font-size="9" fill="#374151">defaultValue: any</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">FormSchema</text>
  <text x="236" y="133" font-size="9" fill="#374151">fields: FieldDef[]</text>
  <text x="236" y="148" font-size="9" fill="#374151">  ordered drag-reorder list</text>
  <text x="236" y="163" font-size="9" fill="#374151">pages: { title, fieldIds[] }[]</text>
  <text x="236" y="178" font-size="9" fill="#374151">  multi-step grouping</text>
  <text x="236" y="193" font-size="9" fill="#374151">settings: { submitBtn, redirect }</text>
  <text x="236" y="208" font-size="9" fill="#374151">  successMessage, webhookUrl</text>
  <text x="236" y="223" font-size="9" fill="#374151">Export: JSON schema download</text>
  <text x="236" y="240" font-size="9" fill="#374151">Import: paste JSON or URL</text>
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — CONDITIONAL LOGIC GRAPH</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Condition Rules</text>
  <text x="485" y="133" font-size="9" fill="#374151">Rule: { if: Condition, then: Action }</text>
  <text x="485" y="148" font-size="9" fill="#374151">Condition: { fieldId, op, value }</text>
  <text x="485" y="163" font-size="9" fill="#374151">  op: eq|ne|gt|lt|contains</text>
  <text x="485" y="178" font-size="9" fill="#374151">  |isEmpty|isNotEmpty</text>
  <text x="485" y="193" font-size="9" fill="#374151">Action: show|hide|require|skip</text>
  <text x="485" y="208" font-size="9" fill="#374151">  |setValue|jumpToPage</text>
  <text x="485" y="225" font-size="9" fill="#374151">Logical: AND | OR operators</text>
  <text x="485" y="240" font-size="9" fill="#374151">  group multiple conditions</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Rule Evaluation</text>
  <text x="682" y="133" font-size="9" fill="#374151">On value change: re-eval rules</text>
  <text x="682" y="148" font-size="9" fill="#374151">  affected fields only</text>
  <text x="682" y="163" font-size="9" fill="#374151">visibleFields: derived Set</text>
  <text x="682" y="178" font-size="9" fill="#374151">  hide → exclude from submit</text>
  <text x="682" y="193" font-size="9" fill="#374151">Cycle detection: rule graph DFS</text>
  <text x="682" y="208" font-size="9" fill="#374151">  max rule depth: 10 levels</text>
  <text x="682" y="225" font-size="9" fill="#374151">Animation: slide show/hide</text>
  <text x="682" y="240" font-size="9" fill="#374151">  200ms height transition</text>
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — VALIDATION ENGINE</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Built-in Rules</text>
  <text x="34" y="358" font-size="9" fill="#374151">required: non-empty check</text>
  <text x="34" y="373" font-size="9" fill="#374151">minLength / maxLength</text>
  <text x="34" y="388" font-size="9" fill="#374151">min / max: numeric range</text>
  <text x="34" y="403" font-size="9" fill="#374151">pattern: regex string match</text>
  <text x="34" y="418" font-size="9" fill="#374151">email / url / phone formats</text>
  <text x="34" y="433" font-size="9" fill="#374151">Custom: async server validate</text>
  <text x="34" y="448" font-size="9" fill="#374151">  timeout: 5000ms cap</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Error Presentation</text>
  <text x="236" y="358" font-size="9" fill="#374151">Show errors: after blur or submit</text>
  <text x="236" y="373" font-size="9" fill="#374151">  configurable via showErrors</text>
  <text x="236" y="388" font-size="9" fill="#374151">Field error: below input</text>
  <text x="236" y="403" font-size="9" fill="#374151">  role="alert" aria-live</text>
  <text x="236" y="418" font-size="9" fill="#374151">Page error: count badge in tab</text>
  <text x="236" y="433" font-size="9" fill="#374151">Submit block: until all clear</text>
  <text x="236" y="448" font-size="9" fill="#374151">Focus: scroll to first error</text>
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — MULTI-STEP &amp; SUBMIT</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Multi-step Logic</text>
  <text x="485" y="358" font-size="9" fill="#374151">currentPage: index into pages[]</text>
  <text x="485" y="373" font-size="9" fill="#374151">Validate page before Next</text>
  <text x="485" y="388" font-size="9" fill="#374151">  block if any visible errors</text>
  <text x="485" y="403" font-size="9" fill="#374151">Progress: (page+1)/total %</text>
  <text x="485" y="418" font-size="9" fill="#374151">Skip page: via condition action</text>
  <text x="485" y="433" font-size="9" fill="#374151">Back: always allowed (no revalidate)</text>
  <text x="485" y="448" font-size="9" fill="#374151">Animate: slide in/out content</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Submit Pipeline</text>
  <text x="682" y="358" font-size="9" fill="#374151">Collect: visible fields only</text>
  <text x="682" y="373" font-size="9" fill="#374151">  exclude hidden fields</text>
  <text x="682" y="388" font-size="9" fill="#374151">Transform: apply formatters</text>
  <text x="682" y="403" font-size="9" fill="#374151">  e.g. date → ISO string</text>
  <text x="682" y="418" font-size="9" fill="#374151">POST: JSON or multipart/form</text>
  <text x="682" y="433" font-size="9" fill="#374151">  file fields: FormData</text>
  <text x="682" y="448" font-size="9" fill="#374151">Success: redirect or message</text>
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Field types: 12 built-in</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Condition depth: max 10 levels</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Async rule timeout: 5000ms</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Multi-step: validate per page</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Submit: exclude hidden fields</text>
</svg>
