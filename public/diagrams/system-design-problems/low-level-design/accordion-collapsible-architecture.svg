<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Accordion / Collapsible — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Item state · Toggle logic · Height animation · Keyboard &amp; URL sync</text>
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — ITEM STATE MODEL</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">AccordionProps</text>
  <text x="34" y="133" font-size="9" fill="#374151">type: 'single' | 'multiple'</text>
  <text x="34" y="148" font-size="9" fill="#374151">value?: string | string[]</text>
  <text x="34" y="163" font-size="9" fill="#374151">defaultValue?: string | string[]</text>
  <text x="34" y="178" font-size="9" fill="#374151">onValueChange(v): void</text>
  <text x="34" y="193" font-size="9" fill="#374151">collapsible?: boolean (single)</text>
  <text x="34" y="208" font-size="9" fill="#374151">  allow re-click to close</text>
  <text x="34" y="223" font-size="9" fill="#374151">disabled?: boolean | string[]</text>
  <text x="34" y="240" font-size="9" fill="#374151">orientation?: vertical|horizontal</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">AccordionItem</text>
  <text x="236" y="133" font-size="9" fill="#374151">value: string (unique key)</text>
  <text x="236" y="148" font-size="9" fill="#374151">isOpen: derived from openItems[]</text>
  <text x="236" y="163" font-size="9" fill="#374151">disabled: item-level flag</text>
  <text x="236" y="178" font-size="9" fill="#374151">AccordionItemContext provides</text>
  <text x="236" y="193" font-size="9" fill="#374151">  isOpen, value, disabled to children</text>
  <text x="236" y="208" font-size="9" fill="#374151">Trigger: AccordionTrigger button</text>
  <text x="236" y="223" font-size="9" fill="#374151">Content: AccordionContent panel</text>
  <text x="236" y="240" font-size="9" fill="#374151">aria-controls wires trigger↔panel</text>
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — TOGGLE LOGIC</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Single Mode</text>
  <text x="485" y="133" font-size="9" fill="#374151">openItem: string | null</text>
  <text x="485" y="148" font-size="9" fill="#374151">toggle(value):</text>
  <text x="485" y="163" font-size="9" fill="#374151">  if collapsible &amp;&amp; same → null</text>
  <text x="485" y="178" font-size="9" fill="#374151">  else → set value (close others)</text>
  <text x="485" y="193" font-size="9" fill="#374151">Controlled: value prop drives</text>
  <text x="485" y="208" font-size="9" fill="#374151">Uncontrolled: defaultValue init</text>
  <text x="485" y="225" font-size="9" fill="#374151">Disabled item: ignore all clicks</text>
  <text x="485" y="240" font-size="9" fill="#374151">  pointer-events none on trigger</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Multiple Mode</text>
  <text x="682" y="133" font-size="9" fill="#374151">openItems: string[]</text>
  <text x="682" y="148" font-size="9" fill="#374151">toggle(value):</text>
  <text x="682" y="163" font-size="9" fill="#374151">  includes? → filter out (close)</text>
  <text x="682" y="178" font-size="9" fill="#374151">  else → spread + append (open)</text>
  <text x="682" y="193" font-size="9" fill="#374151">Open all: pass all item values</text>
  <text x="682" y="208" font-size="9" fill="#374151">Close all: pass empty array []</text>
  <text x="682" y="225" font-size="9" fill="#374151">onValueChange([...openItems])</text>
  <text x="682" y="240" font-size="9" fill="#374151">Context propagates to all items</text>
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — HEIGHT ANIMATION</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">CSS Height Transition</text>
  <text x="34" y="358" font-size="9" fill="#374151">height: 0 → auto not animatable</text>
  <text x="34" y="373" font-size="9" fill="#374151">Technique A: max-height trick</text>
  <text x="34" y="388" font-size="9" fill="#374151">  max-height 0→9999px (easing odd)</text>
  <text x="34" y="403" font-size="9" fill="#374151">Technique B: JS scrollHeight</text>
  <text x="34" y="418" font-size="9" fill="#374151">  measure → set px → auto on done</text>
  <text x="34" y="433" font-size="9" fill="#374151">Duration: 200ms ease-out default</text>
  <text x="34" y="448" font-size="9" fill="#374151">overflow: hidden during animation</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Radix CSS Variables</text>
  <text x="236" y="358" font-size="9" fill="#374151">data-state="open|closed" on el</text>
  <text x="236" y="373" font-size="9" fill="#374151">  --radix-accordion-content-height</text>
  <text x="236" y="388" font-size="9" fill="#374151">  set by Radix via ResizeObserver</text>
  <text x="236" y="403" font-size="9" fill="#374151">@keyframes slideDown: h 0→var</text>
  <text x="236" y="418" font-size="9" fill="#374151">@keyframes slideUp: h var→0</text>
  <text x="236" y="433" font-size="9" fill="#374151">will-change: height during anim</text>
  <text x="236" y="448" font-size="9" fill="#374151">prefers-reduced-motion: instant</text>
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — KEYBOARD &amp; URL SYNC</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Keyboard Nav</text>
  <text x="485" y="358" font-size="9" fill="#374151">Enter / Space: toggle item</text>
  <text x="485" y="373" font-size="9" fill="#374151">↓ / ↑: next / prev trigger</text>
  <text x="485" y="388" font-size="9" fill="#374151">  roving tabIndex pattern</text>
  <text x="485" y="403" font-size="9" fill="#374151">Home / End: first / last trigger</text>
  <text x="485" y="418" font-size="9" fill="#374151">Disabled: skipped in nav order</text>
  <text x="485" y="433" font-size="9" fill="#374151">aria-expanded: true|false on btn</text>
  <text x="485" y="448" font-size="9" fill="#374151">aria-controls: panel id ref</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">URL Hash Sync</text>
  <text x="682" y="358" font-size="9" fill="#374151">hashKey prop: ?accordion=item-1</text>
  <text x="682" y="373" font-size="9" fill="#374151">  read on mount: open matching</text>
  <text x="682" y="388" font-size="9" fill="#374151">onChange: replaceState URLParam</text>
  <text x="682" y="403" font-size="9" fill="#374151">  no extra history entry added</text>
  <text x="682" y="418" font-size="9" fill="#374151">Deep link: share open state via URL</text>
  <text x="682" y="433" font-size="9" fill="#374151">Multiple: comma-separated values</text>
  <text x="682" y="448" font-size="9" fill="#374151">  ?accordion=item-1,item-3</text>
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Exclusive mode: type="single"</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Animation: 200ms ease-out</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Roving tabindex on triggers</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">URL hash key: ?accordion=id</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">aria-expanded: true|false on btn</text>
</svg>
