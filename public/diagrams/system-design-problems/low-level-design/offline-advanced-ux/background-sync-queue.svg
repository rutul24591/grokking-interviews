<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Background Sync Queue System</text>

  <!-- Queue Architecture -->
  <g>
    <text x="220" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Queue Architecture</text>

    <rect x="30" y="75" width="380" height="390" fill="#f9fafb" stroke="#d1d5db" stroke-width="2" rx="6"/>

    <!-- Write enqueue -->
    <rect x="45" y="90" width="350" height="60" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="220" y="113" font-size="11" font-weight="bold" text-anchor="middle" fill="#1e40af">1. Offline Write</text>
    <text x="220" y="131" font-size="10" text-anchor="middle" fill="#374151">Apply optimistically to local store + enqueue</text>
    <text x="220" y="143" font-size="9" text-anchor="middle" fill="#374151">{id, op, payload, timestamp, retries: 0}</text>

    <!-- Queue store -->
    <rect x="45" y="168" width="350" height="70" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="220" y="190" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400e">2. Persisted Queue (IndexedDB)</text>
    <text x="60" y="210" font-size="10" fill="#374151">• Survives page reload / browser crash</text>
    <text x="60" y="227" font-size="10" fill="#374151">• FIFO order preserved (ordered by timestamp)</text>

    <!-- Background Sync API -->
    <rect x="45" y="256" width="350" height="70" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="220" y="278" font-size="11" font-weight="bold" text-anchor="middle" fill="#581c87">3. Background Sync API</text>
    <text x="60" y="298" font-size="10" fill="#374151">registration.sync.register('sync-mutations')</text>
    <text x="60" y="316" font-size="10" fill="#374151">Browser fires 'sync' event when online</text>

    <!-- Flush -->
    <rect x="45" y="344" width="350" height="70" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="220" y="366" font-size="11" font-weight="bold" text-anchor="middle" fill="#065f46">4. Flush Queue</text>
    <text x="60" y="386" font-size="10" fill="#374151">Process mutations in order, one by one</text>
    <text x="60" y="403" font-size="10" fill="#374151">Success → remove from queue. Fail → retry.</text>

    <text x="220" y="452" font-size="9" text-anchor="middle" fill="#6b7280">Fallback: flush on window 'online' event if Background Sync unsupported</text>
  </g>

  <!-- Retry Logic -->
  <g>
    <text x="700" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Retry Logic &amp; Error Handling</text>

    <rect x="450" y="75" width="620" height="200" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="760" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Retry Strategy</text>
    <text x="465" y="122" font-size="10" fill="#374151">Transient error (network, 503): retry with exponential back-off</text>
    <text x="465" y="140" font-size="10" fill="#374151">  delays: [1s, 2s, 4s, 8s, 16s, max 60s]</text>
    <text x="465" y="158" font-size="10" fill="#374151">  max retries: 5 (configurable)</text>
    <text x="465" y="178" font-size="10" fill="#374151">Permanent error (400, 409 conflict): don't retry</text>
    <text x="465" y="196" font-size="10" fill="#374151">  Mark as 'failed' in queue</text>
    <text x="465" y="214" font-size="10" fill="#374151">  Notify user: "Action failed — tap to review"</text>
    <text x="465" y="234" font-size="10" fill="#374151">Idempotency key: include in each request (retry-safe)</text>
    <text x="465" y="252" font-size="9" fill="#ef4444">Never retry 401 — reauth needed first</text>

    <rect x="450" y="290" width="620" height="160" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="760" y="315" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Queue Management</text>
    <text x="465" y="338" font-size="10" fill="#374151">Deduplication: same mutation (same entity, same op) → collapse</text>
    <text x="465" y="356" font-size="10" fill="#374151">Ordering: preserve causal order (create before update)</text>
    <text x="465" y="374" font-size="10" fill="#374151">Conflict detection: server rejects stale version → surface to user</text>
    <text x="465" y="392" font-size="10" fill="#374151">Cancellation: allow user to cancel pending mutation</text>
    <text x="465" y="410" font-size="10" fill="#374151">Quota: limit queue size (e.g., 1000 items) → warn user</text>
    <text x="465" y="425" font-size="9" fill="#3b82f6">Show queue depth: "5 changes pending sync" in status indicator</text>

    <rect x="450" y="465" width="620" height="90" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="760" y="488" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">UI Sync Status</text>
    <text x="465" y="510" font-size="10" fill="#374151">Pending: clock icon or "Saving..." indicator per item</text>
    <text x="465" y="528" font-size="10" fill="#374151">Failed: error badge with retry action</text>
    <text x="465" y="540" font-size="9" fill="#10b981">Synced: brief success indicator then clear (don't clutter)</text>
  </g>

  <rect x="30" y="490" width="400" height="58" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="3"/>
  <text x="50" y="510" font-size="11" fill="#374151"><tspan font-weight="bold">Background Sync API:</tspan> Browser retries even after tab closes.</text>
  <text x="50" y="528" font-size="11" fill="#374151"><tspan font-weight="bold">Fallback:</tspan> flush queue on 'online' event for broader support.</text>
  <text x="50" y="545" font-size="11" fill="#374151"><tspan font-weight="bold">Key:</tspan> Idempotent mutations + persisted queue = reliable delivery.</text>
</svg>
