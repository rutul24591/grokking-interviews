<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Conflict Visualization UI: Patterns &amp; Resolution UX</text>

  <!-- Conflict types -->
  <g>
    <text x="220" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Conflict Types &amp; Display</text>

    <!-- Field conflict -->
    <rect x="30" y="75" width="380" height="120" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="220" y="98" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Field-Level Conflict</text>
    <text x="45" y="120" font-size="10" fill="#374151">Field: "title"</text>
    <rect x="45" y="128" width="160" height="28" fill="#dbeafe" stroke="#3b82f6" stroke-width="1" rx="3"/>
    <text x="125" y="146" font-size="10" text-anchor="middle" fill="#1e40af">Your version: "Draft v2"</text>
    <rect x="215" y="128" width="180" height="28" fill="#dcfce7" stroke="#10b981" stroke-width="1" rx="3"/>
    <text x="305" y="146" font-size="10" text-anchor="middle" fill="#065f46">Server version: "Final v2"</text>
    <text x="45" y="175" font-size="10" fill="#374151">[ Use Mine ]   [ Use Theirs ]   [ Edit Combined ]</text>

    <!-- Text conflict -->
    <rect x="30" y="210" width="380" height="130" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="220" y="233" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Text / Document Conflict (Diff View)</text>
    <rect x="45" y="245" width="350" height="80" fill="white" stroke="#e2e8f0" stroke-width="1" rx="3" font-family="monospace"/>
    <text x="55" y="265" font-size="10" fill="#374151">  The project requires careful planning</text>
    <text x="55" y="283" font-size="10" fill="#10b981">+ and thorough testing of all edge cases</text>
    <text x="55" y="301" font-size="10" fill="#ef4444">- and detailed documentation first</text>
    <text x="55" y="319" font-size="10" fill="#374151">  to succeed in production.</text>
    <text x="45" y="333" font-size="9" fill="#92400e">Green = their addition. Red = their deletion. White = shared.</text>

    <!-- Delete conflict -->
    <rect x="30" y="355" width="380" height="90" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="220" y="378" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">Delete vs Edit Conflict</text>
    <text x="45" y="400" font-size="10" fill="#374151">You edited "Task A". Server deleted "Task A".</text>
    <text x="45" y="418" font-size="10" fill="#374151">[ Keep my edit (restore item) ]</text>
    <text x="45" y="436" font-size="10" fill="#374151">[ Accept deletion ]</text>
  </g>

  <!-- Resolution UI Patterns -->
  <g>
    <text x="740" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Resolution UI Patterns</text>

    <rect x="450" y="75" width="620" height="175" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="760" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Side-by-Side Comparison</text>
    <text x="465" y="122" font-size="10" fill="#374151">Two-panel layout: Your version | Server version</text>
    <text x="465" y="140" font-size="10" fill="#374151">Field-level highlighting: changed fields highlighted</text>
    <text x="465" y="158" font-size="10" fill="#374151">Timestamps: "Your edit: 2 min ago | Server: 5 min ago"</text>
    <text x="465" y="176" font-size="10" fill="#374151">Author: "Server version by: Alice"</text>
    <text x="465" y="194" font-size="10" fill="#374151">Resolution buttons per field or per document</text>
    <text x="465" y="212" font-size="10" fill="#374151">Preview of merged result before confirming</text>
    <text x="465" y="228" font-size="9" fill="#3b82f6">Best for: structured documents (forms, records)</text>

    <rect x="450" y="265" width="620" height="145" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="760" y="290" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Inline Conflict Markers</text>
    <text x="465" y="312" font-size="10" fill="#374151">Show conflicts inline in the document editor</text>
    <text x="465" y="330" font-size="10" fill="#374151">Git-style markers: &lt;&lt;&lt; Mine | === | &gt;&gt;&gt; Theirs</text>
    <text x="465" y="348" font-size="10" fill="#374151">Highlight conflicting text with color bands</text>
    <text x="465" y="366" font-size="10" fill="#374151">Click to resolve: expand options inline</text>
    <text x="465" y="384" font-size="10" fill="#374151">Conflict counter: "3 conflicts remaining"</text>
    <text x="465" y="397" font-size="9" fill="#10b981">Best for: free-form text documents (rich text, code)</text>

    <rect x="450" y="425" width="620" height="130" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="760" y="448" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Toast / Non-blocking Conflict Alert</text>
    <text x="465" y="470" font-size="10" fill="#374151">For low-stakes conflicts: banner "This item was updated"</text>
    <text x="465" y="488" font-size="10" fill="#374151">[View changes] [Dismiss] — non-blocking workflow</text>
    <text x="465" y="506" font-size="10" fill="#374151">For auto-resolved conflicts: "We merged your changes"</text>
    <text x="465" y="524" font-size="10" fill="#374151">[Review merge] link for auditing without blocking</text>
    <text x="465" y="540" font-size="9" fill="#f59e0b">Reserve modal for high-stakes: unresolvable or data-loss risk</text>
  </g>

  <rect x="30" y="475" width="400" height="75" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="3"/>
  <text x="50" y="495" font-size="11" fill="#374151"><tspan font-weight="bold">Principle:</tspan> Auto-resolve when safe (non-overlapping fields).</text>
  <text x="50" y="513" font-size="11" fill="#374151">Prompt user only when human judgment is needed.</text>
  <text x="50" y="531" font-size="11" fill="#374151">Always show what changed and who changed it — context matters.</text>
</svg>
