<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580">
  <text x="550" y="30" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Offline-First Architecture: Layers &amp; Sync Strategy</text>

  <!-- Architecture Layers -->
  <g>
    <text x="220" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Architecture Layers</text>

    <!-- UI Layer -->
    <rect x="30" y="75" width="380" height="55" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="220" y="98" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">UI Layer</text>
    <text x="220" y="116" font-size="10" text-anchor="middle" fill="#374151">Reads from local store — always available. Shows sync status badges.</text>

    <!-- Local Store -->
    <rect x="30" y="148" width="380" height="55" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="220" y="171" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Local Store (IndexedDB / SQLite)</text>
    <text x="220" y="189" font-size="10" text-anchor="middle" fill="#374151">All reads. Writes → queue mutation → sync later.</text>

    <!-- Sync Engine -->
    <rect x="30" y="221" width="380" height="55" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="220" y="244" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Sync Engine (Service Worker / Background)</text>
    <text x="220" y="262" font-size="10" text-anchor="middle" fill="#374151">Mutation queue → retry on reconnect → conflict resolution</text>

    <!-- Network -->
    <rect x="30" y="294" width="380" height="55" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="220" y="317" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">Network / Server API</text>
    <text x="220" y="335" font-size="10" text-anchor="middle" fill="#374151">REST or GraphQL. Responds when online. Returns server state.</text>

    <!-- Arrows between layers -->
    <path d="M 220 203 L 220 221" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#aof)"/>
    <path d="M 200 221 L 200 203" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#aof)"/>
    <path d="M 220 276 L 220 294" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#aof)"/>
    <path d="M 200 294 L 200 276" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#aof)"/>

    <!-- Cache Strategy -->
    <rect x="30" y="370" width="380" height="100" fill="#fee2e2" stroke="#ef4444" stroke-width="2" rx="4"/>
    <text x="220" y="393" font-size="12" font-weight="bold" text-anchor="middle" fill="#991b1b">Cache Strategies</text>
    <text x="45" y="415" font-size="10" fill="#374151">Cache-first: serve local → background refresh (fast, stale)</text>
    <text x="45" y="433" font-size="10" fill="#374151">Network-first: try server → fallback to cache (fresh, fails offline)</text>
    <text x="45" y="451" font-size="10" fill="#374151">Stale-while-revalidate: serve cache, update in background</text>
    <text x="45" y="462" font-size="9" fill="#ef4444">Offline-first = cache-first for reads, queue-first for writes</text>
  </g>

  <!-- Sync Protocol -->
  <g>
    <text x="740" y="62" font-size="14" font-weight="bold" fill="#1a1a1a">Sync Protocol</text>

    <rect x="460" y="75" width="610" height="220" fill="#f3e8ff" stroke="#a855f7" stroke-width="2" rx="4"/>
    <text x="765" y="100" font-size="12" font-weight="bold" text-anchor="middle" fill="#581c87">Mutation Queue + Sync</text>
    <text x="475" y="122" font-size="10" fill="#374151">Write operation (offline):</text>
    <text x="475" y="140" font-size="10" fill="#374151">  1. Apply to local store immediately (optimistic)</text>
    <text x="475" y="158" font-size="10" fill="#374151">  2. Append to mutation queue: {id, op, payload, timestamp}</text>
    <text x="475" y="176" font-size="10" fill="#374151">  3. Mark as 'pending' in UI</text>
    <text x="475" y="198" font-size="10" fill="#374151">On reconnect:</text>
    <text x="475" y="216" font-size="10" fill="#374151">  4. Flush queue in order (FIFO)</text>
    <text x="475" y="234" font-size="10" fill="#374151">  5. Apply server response → update local store</text>
    <text x="475" y="252" font-size="10" fill="#374151">  6. Handle conflicts (last-write-wins or merge)</text>
    <text x="475" y="270" font-size="10" fill="#374151">  7. Clear synced mutations from queue</text>
    <text x="475" y="287" font-size="9" fill="#a855f7">Idempotency key: include in each request to prevent duplicate ops</text>

    <rect x="460" y="310" width="290" height="155" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" rx="4"/>
    <text x="605" y="335" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e40af">Conflict Resolution</text>
    <text x="475" y="358" font-size="10" fill="#374151">Last-write-wins (timestamp)</text>
    <text x="475" y="376" font-size="10" fill="#374151">Server-wins (always trust server)</text>
    <text x="475" y="394" font-size="10" fill="#374151">Client-wins (trust local edits)</text>
    <text x="475" y="412" font-size="10" fill="#374151">3-way merge (CRDT / OT)</text>
    <text x="475" y="430" font-size="10" fill="#374151">User prompt for conflicts</text>
    <text x="475" y="456" font-size="9" fill="#3b82f6">CRDT: no conflicts by design (PNCounter, LWW-Register)</text>

    <rect x="770" y="310" width="300" height="155" fill="#dcfce7" stroke="#10b981" stroke-width="2" rx="4"/>
    <text x="920" y="335" font-size="12" font-weight="bold" text-anchor="middle" fill="#065f46">Network Detection</text>
    <text x="785" y="358" font-size="10" fill="#374151">navigator.onLine (not reliable alone)</text>
    <text x="785" y="376" font-size="10" fill="#374151">window online/offline events</text>
    <text x="785" y="394" font-size="10" fill="#374151">Heartbeat: periodic GET /health</text>
    <text x="785" y="412" font-size="10" fill="#374151">Network Quality: effective type</text>
    <text x="785" y="430" font-size="10" fill="#374151">Service Worker: fetch interception</text>
    <text x="785" y="456" font-size="9" fill="#10b981">Show offline banner when detected. Queue writes silently.</text>

    <rect x="460" y="480" width="610" height="75" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" rx="4"/>
    <text x="765" y="503" font-size="12" font-weight="bold" text-anchor="middle" fill="#92400e">Data Expiration &amp; Quotas</text>
    <text x="475" y="525" font-size="10" fill="#374151">IndexedDB storage quota: up to 60% of disk — request persistent storage via StorageManager</text>
    <text x="475" y="542" font-size="10" fill="#374151">Expire old cache entries: TTL-based or LRU eviction. Prioritize recent + frequently accessed data.</text>
  </g>

  <rect x="30" y="520" width="410" height="48" fill="#f3f4f6" stroke="#6b7280" stroke-width="1" rx="3"/>
  <text x="50" y="540" font-size="11" fill="#374151"><tspan font-weight="bold">Key principle:</tspan> Local store is the source of truth for UI.</text>
  <text x="50" y="558" font-size="11" fill="#374151">Server sync happens in background, not in the critical path.</text>

  <defs>
    <marker id="aof" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/></marker>
  </defs>
</svg>
