<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">a Conflict Visualization UI reconciliation model</title>
  <desc id="desc">Offline UX diagram with local intent, durable storage, health classification, sync, conflicts, and user-visible recovery.</desc>
  <defs>
    <marker id="arrow-conflict-visualization-ui-reconciliation" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow-conflict-visualization-ui-reconciliation" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#faf5ff"/>
  <rect x="42" y="38" width="1116" height="642" rx="24" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="76" y="88" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a">a Conflict Visualization UI: reconciliation guardrails</text>
  <text x="76" y="122" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Reconnect is a validation phase: auth, schema, version, permission, and merge policy all gate replay.</text>
  <g filter="url(#shadow-conflict-visualization-ui-reconciliation)">
    <path d="M92 228 C128 154, 242 142, 304 206 C370 274, 320 374, 214 386 C128 396, 58 322, 92 228" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="126" y="246" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#1e3a8a">User intent</text>
    <text x="120" y="280" font-family="Inter, Arial, sans-serif" font-size="15" fill="#1d4ed8">operation id</text>
    <text x="120" y="306" font-family="Inter, Arial, sans-serif" font-size="15" fill="#1d4ed8">base version</text>
    <text x="120" y="332" font-family="Inter, Arial, sans-serif" font-size="15" fill="#1d4ed8">idempotency key</text>
  </g>
  <path d="M318 292 L448 292" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow-conflict-visualization-ui-reconciliation)"/>
  <g filter="url(#shadow-conflict-visualization-ui-reconciliation)">
    <rect x="452" y="188" width="260" height="204" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
    <text x="482" y="230" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#164e63">Durable local layer</text>
    <text x="482" y="264" font-family="Inter, Arial, sans-serif" font-size="15" fill="#155e75">projection + operation log</text>
    <text x="482" y="290" font-family="Inter, Arial, sans-serif" font-size="15" fill="#155e75">ack ledger + cursor</text>
    <text x="482" y="316" font-family="Inter, Arial, sans-serif" font-size="15" fill="#155e75">quota and migration checks</text>
    <text x="482" y="352" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#164e63">The UI must make conflict risk legible before the user commits a destructive resolution.</text>
  </g>
  <path d="M712 252 C780 206, 824 178, 898 170" stroke="#7c3aed" stroke-width="4" fill="none" marker-end="url(#arrow-conflict-visualization-ui-reconciliation)"/>
  <g filter="url(#shadow-conflict-visualization-ui-reconciliation)">
    <rect x="900" y="118" width="222" height="132" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="930" y="160" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#78350f">Health gate</text>
    <text x="930" y="194" font-family="Inter, Arial, sans-serif" font-size="15" fill="#92400e">network probe</text>
    <text x="930" y="220" font-family="Inter, Arial, sans-serif" font-size="15" fill="#92400e">capability + permission</text>
  </g>
  <path d="M712 336 C790 394, 822 448, 900 470" stroke="#7c3aed" stroke-width="4" fill="none" marker-end="url(#arrow-conflict-visualization-ui-reconciliation)"/>
  <g filter="url(#shadow-conflict-visualization-ui-reconciliation)">
    <rect x="900" y="420" width="222" height="138" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="930" y="462" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#7f1d1d">Conflict path</text>
    <text x="930" y="496" font-family="Inter, Arial, sans-serif" font-size="15" fill="#991b1b">base/local/remote diff</text>
    <text x="930" y="522" font-family="Inter, Arial, sans-serif" font-size="15" fill="#991b1b">preview + audit</text>
  </g>
  <g>
    <rect x="136" y="500" width="628" height="92" rx="18" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="166" y="534" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Runtime evidence</text>
    <text x="166" y="564" font-family="Inter, Arial, sans-serif" font-size="15" fill="#334155">diff tree, semantic field labels, resolution draft, keyboard focus model, audit record, validation errors</text>
  </g>
  <path d="M580 392 C560 450, 500 486, 420 500" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8" fill="none" marker-end="url(#arrow-conflict-visualization-ui-reconciliation)"/>
</svg>