<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Streaming Markdown Renderer — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Token buffer · Incremental parse · AST patch · Syntax highlight &amp; scroll</text>
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — TOKEN BUFFER</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">SSE / Stream Input</text>
  <text x="34" y="133" font-size="9" fill="#374151">Source: fetch() with ReadableStream</text>
  <text x="34" y="148" font-size="9" fill="#374151">  or EventSource (SSE)</text>
  <text x="34" y="163" font-size="9" fill="#374151">chunk: raw text token from LLM</text>
  <text x="34" y="178" font-size="9" fill="#374151">buffer: accumulate partial tokens</text>
  <text x="34" y="193" font-size="9" fill="#374151">  flush on: newline or timeout</text>
  <text x="34" y="208" font-size="9" fill="#374151">abort: AbortController.abort()</text>
  <text x="34" y="223" font-size="9" fill="#374151">  on user stop or component unmount</text>
  <text x="34" y="240" font-size="9" fill="#374151">done: data: [DONE] sentinel</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Buffer Strategy</text>
  <text x="236" y="133" font-size="9" fill="#374151">accumulate: rawText += chunk</text>
  <text x="236" y="148" font-size="9" fill="#374151">  re-parse full string each flush</text>
  <text x="236" y="163" font-size="9" fill="#374151">throttle render: rAF or 50ms timer</text>
  <text x="236" y="178" font-size="9" fill="#374151">  avoid per-token re-renders</text>
  <text x="236" y="193" font-size="9" fill="#374151">incomplete block: defer code fence</text>
  <text x="236" y="208" font-size="9" fill="#374151">  ``` not yet closed → raw text</text>
  <text x="236" y="223" font-size="9" fill="#374151">flush final: on stream done</text>
  <text x="236" y="240" font-size="9" fill="#374151">  re-parse with complete AST</text>
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — INCREMENTAL PARSE</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Markdown Parser</text>
  <text x="485" y="133" font-size="9" fill="#374151">library: marked / remark / micromark</text>
  <text x="485" y="148" font-size="9" fill="#374151">  parse(rawText) → MDAST</text>
  <text x="485" y="163" font-size="9" fill="#374151">node types: paragraph, heading</text>
  <text x="485" y="178" font-size="9" fill="#374151">  code, blockquote, list, table</text>
  <text x="485" y="193" font-size="9" fill="#374151">  inline: strong, em, link, code</text>
  <text x="485" y="208" font-size="9" fill="#374151">GFM: tables + strikethrough</text>
  <text x="485" y="225" font-size="9" fill="#374151">  task lists + autolinks</text>
  <text x="485" y="240" font-size="9" fill="#374151">re-parse: full string (not incremental)</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">AST → React</text>
  <text x="682" y="133" font-size="9" fill="#374151">MDAST → React tree: map nodes</text>
  <text x="682" y="148" font-size="9" fill="#374151">  paragraph → &lt;p&gt;</text>
  <text x="682" y="163" font-size="9" fill="#374151">  heading → &lt;h1–h6&gt;</text>
  <text x="682" y="178" font-size="9" fill="#374151">  code → &lt;pre&gt;&lt;code&gt; + highlight</text>
  <text x="682" y="193" font-size="9" fill="#374151">  link → sanitized &lt;a target=_blank&gt;</text>
  <text x="682" y="208" font-size="9" fill="#374151">key: node index (stable during stream)</text>
  <text x="682" y="225" font-size="9" fill="#374151">memo: skip unchanged subtrees</text>
  <text x="682" y="240" font-size="9" fill="#374151">  React.memo on block components</text>
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — SYNTAX HIGHLIGHTING</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Highlight Strategy</text>
  <text x="34" y="358" font-size="9" fill="#374151">library: Shiki (WASM) or Prism</text>
  <text x="34" y="373" font-size="9" fill="#374151">  detect lang from fence: ```js</text>
  <text x="34" y="388" font-size="9" fill="#374151">streaming: defer highlight until</text>
  <text x="34" y="403" font-size="9" fill="#374151">  code block fully received</text>
  <text x="34" y="418" font-size="9" fill="#374151">  show raw monospace while partial</text>
  <text x="34" y="433" font-size="9" fill="#374151">swap: replace raw with highlighted</text>
  <text x="34" y="448" font-size="9" fill="#374151">  fade transition 150ms</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Security &amp; Sanitize</text>
  <text x="236" y="358" font-size="9" fill="#374151">sanitize HTML: DOMPurify</text>
  <text x="236" y="373" font-size="9" fill="#374151">  strip: script, on*, iframe</text>
  <text x="236" y="388" font-size="9" fill="#374151">  allow: b, i, a, pre, code, table</text>
  <text x="236" y="403" font-size="9" fill="#374151">links: rel="noopener noreferrer"</text>
  <text x="236" y="418" font-size="9" fill="#374151">images: domain allowlist</text>
  <text x="236" y="433" font-size="9" fill="#374151">math: KaTeX render in worker</text>
  <text x="236" y="448" font-size="9" fill="#374151">  $...$ inline, $$...$$ block</text>
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — SCROLL &amp; UX</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Auto-scroll</text>
  <text x="485" y="358" font-size="9" fill="#374151">auto-scroll: follow bottom while</text>
  <text x="485" y="373" font-size="9" fill="#374151">  streaming (if user at bottom)</text>
  <text x="485" y="388" font-size="9" fill="#374151">detect: scrollTop + h ≥ scrollH - 50</text>
  <text x="485" y="403" font-size="9" fill="#374151">pause: user scrolls up → stop</text>
  <text x="485" y="418" font-size="9" fill="#374151">resume: scroll to bottom button</text>
  <text x="485" y="433" font-size="9" fill="#374151">  appears when not at bottom</text>
  <text x="485" y="448" font-size="9" fill="#374151">done: final scroll to anchor</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Cursor &amp; Copy</text>
  <text x="682" y="358" font-size="9" fill="#374151">typing cursor: blinking | after last</text>
  <text x="682" y="373" font-size="9" fill="#374151">  CSS animation: blink 1s infinite</text>
  <text x="682" y="388" font-size="9" fill="#374151">  remove: on stream done</text>
  <text x="682" y="403" font-size="9" fill="#374151">copy button: per code block</text>
  <text x="682" y="418" font-size="9" fill="#374151">  navigator.clipboard.writeText</text>
  <text x="682" y="433" font-size="9" fill="#374151">  "Copied!" toast 2s</text>
  <text x="682" y="448" font-size="9" fill="#374151">copy all: full raw markdown text</text>
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Render throttle: 50ms / rAF</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Highlight: defer until block closed</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Sanitize: DOMPurify allowlist</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Auto-scroll: pause on user scroll-up</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Math: KaTeX in worker</text>
</svg>
