<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" fill="none" font-family="system-ui, sans-serif">
  <rect width="780" height="400" fill="transparent"/>

  <rect x="20" y="40" width="170" height="100" rx="8" fill="#f0f9ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="105" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Sources</text>
  <text x="35" y="90" font-size="11" fill="#3b82f6">• Uploaded file</text>
  <text x="35" y="106" font-size="11" fill="#3b82f6">• Profile data</text>
  <text x="35" y="122" font-size="11" fill="#3b82f6">• Prior submission</text>

  <line x1="190" y1="90" x2="240" y2="90" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="240" y="40" width="180" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="330" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">RedactionLayer</text>
  <text x="255" y="90" font-size="11" fill="#92400e">client-side PII strip</text>
  <text x="255" y="106" font-size="11" fill="#92400e">SSN/CC patterns</text>
  <text x="255" y="122" font-size="11" fill="#92400e">defense in depth</text>

  <line x1="420" y1="90" x2="470" y2="90" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="470" y="20" width="290" height="140" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="615" y="48" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">SuggestionController</text>
  <text x="485" y="72" font-size="11" fill="#166534">• fetch + ReadableStream</text>
  <text x="485" y="90" font-size="11" fill="#166534">• JSON-lines parser</text>
  <text x="485" y="108" font-size="11" fill="#166534">• AbortController (cancel)</text>
  <text x="485" y="126" font-size="11" fill="#166534">• schema validate per suggestion</text>
  <text x="485" y="146" font-size="10" fill="#15803d">first suggestion &lt; 1s</text>

  <line x1="615" y1="160" x2="615" y2="200" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="450" y="200" width="310" height="120" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="605" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">SuggestionStore (parallel plane)</text>
  <text x="465" y="252" font-size="11" fill="#5b21b6">Per-field state machine:</text>
  <text x="465" y="270" font-size="11" fill="#5b21b6">idle → pending → proposed →</text>
  <text x="465" y="288" font-size="11" fill="#5b21b6">accepted / rejected / edited / superseded</text>
  <text x="465" y="308" font-size="10" fill="#6d28d9">startTransition: never preempts user input</text>

  <line x1="450" y1="260" x2="370" y2="260" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="40" y="200" width="330" height="120" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="205" y="228" text-anchor="middle" font-size="14" font-weight="bold" fill="#9d174d">FieldOverlay UI</text>
  <text x="55" y="252" font-size="11" fill="#9d174d">• Ghost value next to field input</text>
  <text x="55" y="270" font-size="11" fill="#9d174d">• Confidence + source attribution</text>
  <text x="55" y="288" font-size="11" fill="#9d174d">• Accept / Reject / Edit (keyboard)</text>
  <text x="55" y="308" font-size="10" fill="#be185d">never auto-applied; user value always wins</text>

  <text x="380" y="370" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">two parallel state planes: form values (truth) + suggestions (advisory) — explicit accept only</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
