  <text x="68" y="417" font-size="12.5" font-weight="700" fill="#c2410c">IMPLEMENTATION INVARIANTS</text><text x="76" y="435" font-size="11" fill="#172033">Accept a result only when its generation, ownership scope, and current state still match.</text>
  <text x="76" y="458" font-size="11" fill="#172033">Release timers, listeners, observers, workers, requests, pointer capture, and cache references idempotently.</text>
  <text x="76" y="481" font-size="11" fill="#172033">Emit bounded telemetry for latency, stale suppression, retries, rollback, and user-visible fallback.</text>
