<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Code Editor Component — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Extension system · Syntax tokens · LSP integration · Theme &amp; diff</text>
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — EXTENSION SYSTEM (CodeMirror 6)</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">EditorState &amp; View</text>
  <text x="34" y="133" font-size="9" fill="#374151">EditorState: doc + selection + exts</text>
  <text x="34" y="148" font-size="9" fill="#374151">EditorView: DOM + dispatch</text>
  <text x="34" y="163" font-size="9" fill="#374151">Transaction: batched state changes</text>
  <text x="34" y="178" font-size="9" fill="#374151">dispatch(tr) → new EditorState</text>
  <text x="34" y="193" font-size="9" fill="#374151">Immutable state model</text>
  <text x="34" y="208" font-size="9" fill="#374151">facet: typed extension config</text>
  <text x="34" y="223" font-size="9" fill="#374151">  e.g. indentUnit, tabSize, keymap</text>
  <text x="34" y="240" font-size="9" fill="#374151">StateField: custom state slices</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Extension Priority</text>
  <text x="236" y="133" font-size="9" fill="#374151">Precedence highest → lowest</text>
  <text x="236" y="148" font-size="9" fill="#374151">  Prec.highest: override all</text>
  <text x="236" y="163" font-size="9" fill="#374151">  Prec.high: after highest</text>
  <text x="236" y="178" font-size="9" fill="#374151">  Prec.default: normal</text>
  <text x="236" y="193" font-size="9" fill="#374151">  Prec.low: fallback</text>
  <text x="236" y="208" font-size="9" fill="#374151">keymap: higher priority wins</text>
  <text x="236" y="223" font-size="9" fill="#374151">Extension composition: [ext[]]</text>
  <text x="236" y="240" font-size="9" fill="#374151">  flatten nested extension arrays</text>
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — SYNTAX &amp; TOKEN HIGHLIGHTING</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Lezer Parser</text>
  <text x="485" y="133" font-size="9" fill="#374151">Incremental LR parsing (Lezer)</text>
  <text x="485" y="148" font-size="9" fill="#374151">Re-parse only changed ranges</text>
  <text x="485" y="163" font-size="9" fill="#374151">SyntaxTree: persistent immutable</text>
  <text x="485" y="178" font-size="9" fill="#374151">Language object per grammar</text>
  <text x="485" y="193" font-size="9" fill="#374151">  JS, TS, Python, CSS, JSON</text>
  <text x="485" y="208" font-size="9" fill="#374151">Highlight tags: keyword, string</text>
  <text x="485" y="225" font-size="9" fill="#374151">  comment, operator, number</text>
  <text x="485" y="240" font-size="9" fill="#374151">HighlightStyle: tag → CSS class</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Autocompletion</text>
  <text x="682" y="133" font-size="9" fill="#374151">autocompletion() extension</text>
  <text x="682" y="148" font-size="9" fill="#374151">CompletionSource: async fn</text>
  <text x="682" y="163" font-size="9" fill="#374151">  returns { from, options[] }</text>
  <text x="682" y="178" font-size="9" fill="#374151">Debounce: 150ms before trigger</text>
  <text x="682" y="193" font-size="9" fill="#374151">LSP completionItem → option</text>
  <text x="682" y="208" font-size="9" fill="#374151">Snippet: ${1:placeholder} expand</text>
  <text x="682" y="225" font-size="9" fill="#374151">  Tab cycles through fields</text>
  <text x="682" y="240" font-size="9" fill="#374151">Escape: close completion list</text>
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — LSP INTEGRATION</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">LSP Protocol</text>
  <text x="34" y="358" font-size="9" fill="#374151">WebSocket to language server</text>
  <text x="34" y="373" font-size="9" fill="#374151">initialize → capabilities handshake</text>
  <text x="34" y="388" font-size="9" fill="#374151">textDocument/didOpen on load</text>
  <text x="34" y="403" font-size="9" fill="#374151">textDocument/didChange on edit</text>
  <text x="34" y="418" font-size="9" fill="#374151">  debounce: 300ms after last key</text>
  <text x="34" y="433" font-size="9" fill="#374151">publishDiagnostics: underline errors</text>
  <text x="34" y="448" font-size="9" fill="#374151">  severity: error|warn|info|hint</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Hover &amp; Navigation</text>
  <text x="236" y="358" font-size="9" fill="#374151">hover: position → LSP hover req</text>
  <text x="236" y="373" font-size="9" fill="#374151">  tooltip with type/doc info</text>
  <text x="236" y="388" font-size="9" fill="#374151">Go to definition: F12 / Cmd+click</text>
  <text x="236" y="403" font-size="9" fill="#374151">  textDocument/definition request</text>
  <text x="236" y="418" font-size="9" fill="#374151">Find references: Shift+F12</text>
  <text x="236" y="433" font-size="9" fill="#374151">Rename: F2 renames all usages</text>
  <text x="236" y="448" font-size="9" fill="#374151">Format: Alt+Shift+F on save</text>
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — THEME &amp; DIFF VIEW</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Theme System</text>
  <text x="485" y="358" font-size="9" fill="#374151">EditorView.theme(): CSS-in-JS</text>
  <text x="485" y="373" font-size="9" fill="#374151">  scoped class names auto-gen</text>
  <text x="485" y="388" font-size="9" fill="#374151">HighlightStyle: Tag → CSS vars</text>
  <text x="485" y="403" font-size="9" fill="#374151">Dark/light: swap HighlightStyle</text>
  <text x="485" y="418" font-size="9" fill="#374151">CSS vars: --cm-bg --cm-fg --cm-sel</text>
  <text x="485" y="433" font-size="9" fill="#374151">prefers-color-scheme: auto switch</text>
  <text x="485" y="448" font-size="9" fill="#374151">Custom font: --cm-font-family</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Diff &amp; Merge View</text>
  <text x="682" y="358" font-size="9" fill="#374151">MergeView: side-by-side panels</text>
  <text x="682" y="373" font-size="9" fill="#374151">unifiedMergeView: inline diff</text>
  <text x="682" y="388" font-size="9" fill="#374151">Diff algorithm: Myers O(ND)</text>
  <text x="682" y="403" font-size="9" fill="#374151">Gutter: +/- line decorations</text>
  <text x="682" y="418" font-size="9" fill="#374151">Chunk accept/reject buttons</text>
  <text x="682" y="433" font-size="9" fill="#374151">  inline one-click resolve</text>
  <text x="682" y="448" font-size="9" fill="#374151">Conflict markers: &lt;&lt;&lt; === &gt;&gt;&gt;</text>
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Extension priority: Prec.highest→low</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Lezer: incremental parse on change</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">LSP debounce: 300ms after key</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Diff: Myers O(ND) algorithm</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Theme vars: --cm-bg, --cm-fg</text>
</svg>
