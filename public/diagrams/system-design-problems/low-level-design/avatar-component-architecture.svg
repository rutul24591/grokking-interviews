<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/>
    </marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2563eb"/>
    </marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#f0f4ff"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Avatar Component — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">State model · Fallback chain · Render output · Accessibility &amp; groups</text>

  <!-- Section A: State / Data Model (top-left) -->
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — STATE MODEL &amp; PROPS</text>

  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">AvatarProps</text>
  <text x="34" y="133" font-size="9" fill="#374151">src?: string</text>
  <text x="34" y="148" font-size="9" fill="#374151">alt: string  (required)</text>
  <text x="34" y="163" font-size="9" fill="#374151">size: 'xs'|'sm'|'md'|'lg'|'xl'</text>
  <text x="34" y="178" font-size="9" fill="#374151">shape: 'circle'|'square'|'rounded'</text>
  <text x="34" y="193" font-size="9" fill="#374151">status?: 'online'|'away'|'busy'|'offline'</text>
  <text x="34" y="208" font-size="9" fill="#374151">badge?: ReactNode</text>
  <text x="34" y="223" font-size="9" fill="#374151">loading?: 'eager'|'lazy'</text>
  <text x="34" y="238" font-size="9" fill="#374151">onError?: (e: Event) =&gt; void</text>

  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Internal State</text>
  <text x="236" y="133" font-size="9" fill="#374151">imgStatus: 'loading'|'loaded'|'error'</text>
  <text x="236" y="148" font-size="9" fill="#374151">retryCount: number (max 3)</text>
  <text x="236" y="163" font-size="9" fill="#374151">fallbackType: 'image'|'initials'|'icon'</text>
  <text x="236" y="178" font-size="9" fill="#374151">colorIndex: hash(alt) % palette.length</text>
  <text x="236" y="193" font-size="9" fill="#374151">imageErrors: Map&lt;src, retryCount&gt;</text>
  <text x="236" y="210" font-size="9" fill="#6d5bd0" font-weight="bold">Size map (px):</text>
  <text x="236" y="225" font-size="9" fill="#374151">xs=24 sm=32 md=40 lg=48 xl=56</text>
  <text x="236" y="240" font-size="9" fill="#374151">square → border-radius: 0px</text>

  <!-- Section B: Fallback Chain (top-right) -->
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — FALLBACK CHAIN &amp; LOAD LOGIC</text>

  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Image Load Flow</text>
  <text x="485" y="133" font-size="9" fill="#374151">1. src provided → &lt;img&gt; with lazy/eager</text>
  <text x="485" y="148" font-size="9" fill="#374151">2. onLoad → set imgStatus = 'loaded'</text>
  <text x="485" y="163" font-size="9" fill="#374151">3. onError → increment retryCount</text>
  <text x="485" y="178" font-size="9" fill="#374151">4. retryCount &lt; 3 → retry with cache-bust</text>
  <text x="485" y="193" font-size="9" fill="#374151">5. retryCount ≥ 3 → fallback: initials</text>
  <text x="485" y="208" font-size="9" fill="#374151">6. no alt text → fallback: icon SVG</text>
  <text x="485" y="225" font-size="9" fill="#2563eb" font-weight="bold">Retry: ?v=1, ?v=2, ?v=3</text>
  <text x="485" y="240" font-size="9" fill="#374151">Cache-bust via query param append</text>

  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Initials &amp; Color</text>
  <text x="682" y="133" font-size="9" fill="#374151">getInitials(alt): string</text>
  <text x="682" y="148" font-size="9" fill="#374151">  'John Doe' → 'JD'</text>
  <text x="682" y="163" font-size="9" fill="#374151">  'Alice' → 'A'</text>
  <text x="682" y="178" font-size="9" fill="#374151">hashColor(alt): index</text>
  <text x="682" y="193" font-size="9" fill="#374151">  charCodeAt sum % 12 palette</text>
  <text x="682" y="208" font-size="9" fill="#374151">Palette: 12 WCAG-AA colours</text>
  <text x="682" y="223" font-size="9" fill="#374151">Contrast ≥ 4.5:1 on white bg</text>
  <text x="682" y="238" font-size="9" fill="#2563eb" font-weight="bold">Deterministic per name string</text>

  <!-- Arrow A→B -->
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Section C: Render Output (bottom-left) -->
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — RENDER OUTPUT &amp; VISUAL STATES</text>

  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">DOM Structure</text>
  <text x="34" y="358" font-size="9" fill="#374151">&lt;span role="img" aria-label={alt}&gt;</text>
  <text x="34" y="373" font-size="9" fill="#374151">  &lt;img | &lt;span&gt;{initials}&lt;/span&gt;</text>
  <text x="34" y="388" font-size="9" fill="#374151">  | &lt;SvgIcon/&gt; fallback</text>
  <text x="34" y="403" font-size="9" fill="#374151">  [status dot] position: absolute</text>
  <text x="34" y="418" font-size="9" fill="#374151">  [badge slot] top-right corner</text>
  <text x="34" y="433" font-size="9" fill="#374151">Loading shimmer via CSS keyframe</text>
  <text x="34" y="448" font-size="9" fill="#374151">overflow: hidden on wrapper span</text>

  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Visual States</text>
  <text x="236" y="358" font-size="9" fill="#374151">loading → skeleton shimmer pulse</text>
  <text x="236" y="373" font-size="9" fill="#374151">loaded  → fade-in 150ms ease</text>
  <text x="236" y="388" font-size="9" fill="#374151">error   → initials/icon, no flash</text>
  <text x="236" y="403" font-size="9" fill="#374151">status dot: 10px, border 2px white</text>
  <text x="236" y="418" font-size="9" fill="#374151">  green=online amber=away</text>
  <text x="236" y="433" font-size="9" fill="#374151">  red=busy grey=offline</text>
  <text x="236" y="448" font-size="9" fill="#374151">CLS: width/height set before load</text>

  <!-- Section D: A11y + Groups (bottom-right) -->
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — A11Y &amp; AVATAR GROUPS</text>

  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Accessibility</text>
  <text x="485" y="358" font-size="9" fill="#374151">role="img" + aria-label={alt}</text>
  <text x="485" y="373" font-size="9" fill="#374151">Decorative: aria-hidden="true"</text>
  <text x="485" y="388" font-size="9" fill="#374151">Status dot: aria-label="online"</text>
  <text x="485" y="403" font-size="9" fill="#374151">  visually-hidden span for SR</text>
  <text x="485" y="418" font-size="9" fill="#374151">Focusable: tabIndex if interactive</text>
  <text x="485" y="433" font-size="9" fill="#374151">Color not sole meaning indicator</text>
  <text x="485" y="448" font-size="9" fill="#374151">Alt required — TS enforced prop</text>

  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">AvatarGroup</text>
  <text x="682" y="358" font-size="9" fill="#374151">max: number (default 5)</text>
  <text x="682" y="373" font-size="9" fill="#374151">overlap: -8px negative margin</text>
  <text x="682" y="388" font-size="9" fill="#374151">+N overflow count chip at end</text>
  <text x="682" y="403" font-size="9" fill="#374151">Stacking: z-index decrements</text>
  <text x="682" y="418" font-size="9" fill="#374151">aria-label="5 members, 3 more"</text>
  <text x="682" y="433" font-size="9" fill="#374151">Tooltip on hover: full member list</text>
  <text x="682" y="448" font-size="9" fill="#374151">Keyboard: arrow keys cycle focus</text>

  <!-- Arrow B→D -->
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <!-- Arrow A→C -->
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Arrow C→D -->
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>

  <!-- Footer -->
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Fallback order: img → initials → icon</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Lazy threshold: 50px rootMargin</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Retry max: 3 attempts</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">CLS prevention: explicit w/h attrs</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">ARIA: role=img + aria-label required</text>
</svg>
