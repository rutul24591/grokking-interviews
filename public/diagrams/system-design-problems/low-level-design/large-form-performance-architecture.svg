<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" fill="none" font-family="system-ui, sans-serif">
  <rect width="760" height="360" fill="transparent"/>

  <rect x="20" y="40" width="160" height="80" rx="8" fill="#f0f9ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="100" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">DOM Input</text>
  <text x="35" y="90" font-size="11" fill="#3b82f6">native value during type</text>
  <text x="35" y="106" font-size="11" fill="#3b82f6">no React update</text>

  <line x1="180" y1="80" x2="250" y2="80" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="195" y="72" font-size="10" fill="#6b7280">debounce/blur</text>

  <rect x="250" y="40" width="220" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="360" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">FieldStore (external)</text>
  <text x="265" y="90" font-size="11" fill="#92400e">selector subscriptions</text>
  <text x="265" y="106" font-size="11" fill="#92400e">useSyncExternalStore</text>

  <line x1="470" y1="80" x2="540" y2="80" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="540" y="40" width="200" height="80" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="640" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Single Field re-render</text>
  <text x="555" y="90" font-size="11" fill="#166534">memoized FieldControl</text>
  <text x="555" y="106" font-size="11" fill="#166534">primitive props only</text>

  <rect x="20" y="160" width="160" height="80" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="100" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#9d174d">Off-screen sections</text>
  <text x="35" y="210" font-size="11" fill="#9d174d">content-visibility:auto</text>
  <text x="35" y="226" font-size="11" fill="#9d174d">lazy mount + observer</text>

  <line x1="180" y1="200" x2="250" y2="200" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="250" y="160" width="220" height="80" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="360" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">SectionVirtualizer</text>
  <text x="265" y="210" font-size="11" fill="#5b21b6">bound layout / paint cost</text>
  <text x="265" y="226" font-size="11" fill="#5b21b6">a11y tree preserved</text>

  <line x1="470" y1="200" x2="540" y2="200" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="540" y="160" width="200" height="80" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="640" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">ValidationScheduler</text>
  <text x="555" y="210" font-size="11" fill="#991b1b">deferred (blur/submit)</text>
  <text x="555" y="226" font-size="11" fill="#991b1b">requestIdleCallback</text>

  <text x="380" y="290" text-anchor="middle" font-size="12" fill="#374151" font-weight="bold">Goal: keystroke latency &lt; 16 ms at 1000 fields</text>
  <text x="380" y="312" text-anchor="middle" font-size="11" fill="#6b7280" font-style="italic">5 reinforcing techniques: external store + uncontrolled-during-typing + virtualization + deferred validation + stable refs</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
