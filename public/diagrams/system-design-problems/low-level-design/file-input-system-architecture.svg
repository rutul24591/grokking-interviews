<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" fill="none" font-family="system-ui, sans-serif">
  <rect width="760" height="380" fill="transparent"/>

  <rect x="20" y="30" width="180" height="180" rx="8" fill="#f0f9ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Ingestion Sources</text>
  <text x="35" y="84" font-size="11" fill="#3b82f6">• DropZone (drag/drop)</text>
  <text x="35" y="104" font-size="11" fill="#3b82f6">• Hidden native input</text>
  <text x="35" y="124" font-size="11" fill="#3b82f6">• Paste from clipboard</text>
  <text x="35" y="144" font-size="11" fill="#3b82f6">• capture (camera)</text>
  <text x="35" y="164" font-size="11" fill="#3b82f6">• Folder traversal</text>
  <text x="35" y="186" font-size="10" fill="#1e3a8a">(depth/count caps)</text>

  <line x1="200" y1="120" x2="260" y2="120" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="260" y="30" width="220" height="180" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="370" y="58" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">Pipeline</text>
  <text x="275" y="82" font-size="11" fill="#92400e">1. Ingest (normalize → File[])</text>
  <text x="275" y="102" font-size="11" fill="#92400e">2. Validate (size/MIME/count)</text>
  <text x="275" y="122" font-size="11" fill="#92400e">3. Dedup (name+size or hash)</text>
  <text x="275" y="142" font-size="11" fill="#92400e">4. Preview (off-main worker)</text>
  <text x="275" y="162" font-size="11" fill="#92400e">5. Handoff to uploader</text>
  <text x="275" y="186" font-size="10" fill="#b45309">accepted vs rejected lists</text>

  <line x1="480" y1="120" x2="540" y2="120" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/>

  <rect x="540" y="30" width="200" height="180" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="640" y="58" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Form Value</text>
  <text x="555" y="82" font-size="11" fill="#166534">FileEntry[]</text>
  <text x="555" y="100" font-size="11" fill="#166534">{ id, file, previewUrl,</text>
  <text x="555" y="116" font-size="11" fill="#166534">  hash, status, progress }</text>
  <text x="555" y="142" font-size="11" fill="#166534">→ Uploader subsystem</text>
  <text x="555" y="160" font-size="11" fill="#166534">→ Form runtime</text>
  <text x="555" y="186" font-size="10" fill="#15803d">object URLs revoked on remove</text>

  <rect x="160" y="240" width="450" height="80" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="385" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#5b21b6">Workers (off main thread)</text>
  <text x="180" y="290" font-size="11" fill="#5b21b6">• HashWorker — SubtleCrypto dedup (opt-in)</text>
  <text x="180" y="308" font-size="11" fill="#5b21b6">• Preview generators — createImageBitmap, PDF first-page, video first-frame</text>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
