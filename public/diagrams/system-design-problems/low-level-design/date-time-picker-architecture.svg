<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Date / Time Picker — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Calendar state · Navigation · DST-safe storage · Range &amp; accessibility</text>
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — CALENDAR STATE MODEL</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">DatePickerState</text>
  <text x="34" y="133" font-size="9" fill="#374151">value: Date | null</text>
  <text x="34" y="148" font-size="9" fill="#374151">  (range: { from, to })</text>
  <text x="34" y="163" font-size="9" fill="#374151">viewDate: Date (calendar month)</text>
  <text x="34" y="178" font-size="9" fill="#374151">mode: day | month | year</text>
  <text x="34" y="193" font-size="9" fill="#374151">isOpen: boolean (popover)</text>
  <text x="34" y="208" font-size="9" fill="#374151">focusedDate: keyboard cursor</text>
  <text x="34" y="223" font-size="9" fill="#374151">minDate / maxDate: bounds</text>
  <text x="34" y="240" font-size="9" fill="#374151">disabledDates: Date[] | fn</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">DatePickerProps</text>
  <text x="236" y="133" font-size="9" fill="#374151">value / defaultValue: Date</text>
  <text x="236" y="148" font-size="9" fill="#374151">onChange(date): void</text>
  <text x="236" y="163" font-size="9" fill="#374151">locale: Intl.Locale string</text>
  <text x="236" y="178" font-size="9" fill="#374151">  weekStart: 0=Sun or 1=Mon</text>
  <text x="236" y="193" font-size="9" fill="#374151">format: display string pattern</text>
  <text x="236" y="208" font-size="9" fill="#374151">  parse user input via format</text>
  <text x="236" y="223" font-size="9" fill="#374151">showTimePicker: boolean</text>
  <text x="236" y="240" font-size="9" fill="#374151">granularity: day|hour|minute</text>
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — NAVIGATION &amp; RENDERING</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Calendar Grid</text>
  <text x="485" y="133" font-size="9" fill="#374151">Generate days: startOf(month)</text>
  <text x="485" y="148" font-size="9" fill="#374151">  pad leading/trailing weeks</text>
  <text x="485" y="163" font-size="9" fill="#374151">6 rows × 7 cols = 42 cells</text>
  <text x="485" y="178" font-size="9" fill="#374151">Today: highlighted ring</text>
  <text x="485" y="193" font-size="9" fill="#374151">Selected: brand fill circle</text>
  <text x="485" y="208" font-size="9" fill="#374151">Disabled: muted + no pointer</text>
  <text x="485" y="225" font-size="9" fill="#374151">Other month days: dimmed</text>
  <text x="485" y="240" font-size="9" fill="#374151">Prev/Next: slide left/right anim</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">View Navigation</text>
  <text x="682" y="133" font-size="9" fill="#374151">Click month header → month view</text>
  <text x="682" y="148" font-size="9" fill="#374151">  12 month buttons per year</text>
  <text x="682" y="163" font-size="9" fill="#374151">Click year → decade view (10yr)</text>
  <text x="682" y="178" font-size="9" fill="#374151">  ← → skip decade / month</text>
  <text x="682" y="193" font-size="9" fill="#374151">Time: HH:MM scroll wheels</text>
  <text x="682" y="208" font-size="9" fill="#374151">  or numeric spinbutton inputs</text>
  <text x="682" y="225" font-size="9" fill="#374151">AM/PM toggle for 12h format</text>
  <text x="682" y="240" font-size="9" fill="#374151">Clear button: reset to null</text>
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — DST-SAFE STORAGE &amp; RANGE</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">DST Handling</text>
  <text x="34" y="358" font-size="9" fill="#374151">Store: ISO 8601 UTC string</text>
  <text x="34" y="373" font-size="9" fill="#374151">  "2024-03-15T00:00:00.000Z"</text>
  <text x="34" y="388" font-size="9" fill="#374151">Display: localise via Intl API</text>
  <text x="34" y="403" font-size="9" fill="#374151">Midnight guard: clamp to noon</text>
  <text x="34" y="418" font-size="9" fill="#374151">  avoids DST spring-forward skip</text>
  <text x="34" y="433" font-size="9" fill="#374151">TZ prop: IANA timezone override</text>
  <text x="34" y="448" font-size="9" fill="#374151">  Intl.DateTimeFormat timeZone</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Date Range Mode</text>
  <text x="236" y="358" font-size="9" fill="#374151">First click: set range.from</text>
  <text x="236" y="373" font-size="9" fill="#374151">  hover: preview range highlight</text>
  <text x="236" y="388" font-size="9" fill="#374151">Second click: set range.to</text>
  <text x="236" y="403" font-size="9" fill="#374151">  if to &lt; from: swap auto</text>
  <text x="236" y="418" font-size="9" fill="#374151">maxRange: optional day limit</text>
  <text x="236" y="433" font-size="9" fill="#374151">  disable beyond max offset</text>
  <text x="236" y="448" font-size="9" fill="#374151">Highlight: gradient fill span</text>
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — KEYBOARD &amp; ACCESSIBILITY</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Keyboard Nav</text>
  <text x="485" y="358" font-size="9" fill="#374151">↑ ↓ ← →: move focus ±1 day</text>
  <text x="485" y="373" font-size="9" fill="#374151">Page Up/Down: ±1 month</text>
  <text x="485" y="388" font-size="9" fill="#374151">Shift+Page: ±1 year</text>
  <text x="485" y="403" font-size="9" fill="#374151">Home / End: first/last of week</text>
  <text x="485" y="418" font-size="9" fill="#374151">Enter / Space: select focused</text>
  <text x="485" y="433" font-size="9" fill="#374151">Escape: close popover</text>
  <text x="485" y="448" font-size="9" fill="#374151">Tab: moves between fields</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">ARIA &amp; Input</text>
  <text x="682" y="358" font-size="9" fill="#374151">role="dialog" on popover</text>
  <text x="682" y="373" font-size="9" fill="#374151">  aria-label="Choose date"</text>
  <text x="682" y="388" font-size="9" fill="#374151">role="grid" on month grid</text>
  <text x="682" y="403" font-size="9" fill="#374151">  aria-selected on chosen cell</text>
  <text x="682" y="418" font-size="9" fill="#374151">Text input: type="date" fallback</text>
  <text x="682" y="433" font-size="9" fill="#374151">  validate on blur, parse format</text>
  <text x="682" y="448" font-size="9" fill="#374151">Focus trap: inside popover</text>
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Store: ISO 8601 UTC</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">DST guard: clamp to noon</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Range: auto-swap if reversed</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Keyboard: ↑↓←→ Page± Shift+Page</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">ARIA: role=grid, aria-selected</text>
</svg>
