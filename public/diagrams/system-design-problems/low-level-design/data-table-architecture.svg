<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#6d5bd0"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
    <marker id="arr3" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2f9d74"/></marker>
  </defs>
  <rect width="900" height="520" fill="#f0f4ff"/>
  <text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e1b4b">Data Table — Architecture</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Column model · Sort &amp; filter pipeline · Virtualised rows · Inline edit &amp; export</text>
  <rect x="12" y="60" width="425" height="210" rx="8" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="12" y="60" width="425" height="28" rx="8" fill="#6d5bd0"/>
  <rect x="12" y="76" width="425" height="12" fill="#6d5bd0"/>
  <text x="224" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">A — COLUMN MODEL</text>
  <rect x="24" y="98" width="190" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="119" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">ColumnDef</text>
  <text x="34" y="133" font-size="9" fill="#374151">id: string (unique)</text>
  <text x="34" y="148" font-size="9" fill="#374151">accessorKey: keyof TData</text>
  <text x="34" y="163" font-size="9" fill="#374151">header: string | ReactNode</text>
  <text x="34" y="178" font-size="9" fill="#374151">cell: (row) =&gt; ReactNode</text>
  <text x="34" y="193" font-size="9" fill="#374151">size: number (px width)</text>
  <text x="34" y="208" font-size="9" fill="#374151">minSize / maxSize: constraints</text>
  <text x="34" y="223" font-size="9" fill="#374151">enableSorting: boolean</text>
  <text x="34" y="240" font-size="9" fill="#374151">enableFiltering / pinning</text>
  <rect x="226" y="98" width="197" height="160" rx="6" fill="#fff" stroke="#c4b5f4" stroke-width="1"/>
  <text x="324" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d5bd0">Column Features</text>
  <text x="236" y="133" font-size="9" fill="#374151">Resize: drag handle on header</text>
  <text x="236" y="148" font-size="9" fill="#374151">  colWidth stored in state</text>
  <text x="236" y="163" font-size="9" fill="#374151">Reorder: DnD column headers</text>
  <text x="236" y="178" font-size="9" fill="#374151">Freeze: sticky left/right cols</text>
  <text x="236" y="193" font-size="9" fill="#374151">  position: sticky + z-index</text>
  <text x="236" y="208" font-size="9" fill="#374151">Hide/show: columnVisibility map</text>
  <text x="236" y="223" font-size="9" fill="#374151">Group: multi-level header rows</text>
  <text x="236" y="240" font-size="9" fill="#374151">Aggregate: sum/avg footer row</text>
  <rect x="463" y="60" width="425" height="210" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="463" y="60" width="425" height="28" rx="8" fill="#2563eb"/>
  <rect x="463" y="76" width="425" height="12" fill="#2563eb"/>
  <text x="675" y="79" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">B — SORT &amp; FILTER PIPELINE</text>
  <rect x="475" y="98" width="185" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="567" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Sort Engine</text>
  <text x="485" y="133" font-size="9" fill="#374151">sortingState: { id, desc }[]</text>
  <text x="485" y="148" font-size="9" fill="#374151">Multi-sort: Shift+click header</text>
  <text x="485" y="163" font-size="9" fill="#374151">  cycle: asc → desc → none</text>
  <text x="485" y="178" font-size="9" fill="#374151">sortingFn: alphanumeric|datetime</text>
  <text x="485" y="193" font-size="9" fill="#374151">  |basic|auto|custom</text>
  <text x="485" y="208" font-size="9" fill="#374151">Server sort: pass to API params</text>
  <text x="485" y="225" font-size="9" fill="#374151">  skip client sort if manual</text>
  <text x="485" y="240" font-size="9" fill="#374151">Sort indicator: ↑ ↓ icon in header</text>
  <rect x="672" y="98" width="202" height="160" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="1"/>
  <text x="773" y="116" text-anchor="middle" font-size="10" font-weight="bold" fill="#2563eb">Filter Engine</text>
  <text x="682" y="133" font-size="9" fill="#374151">columnFilters: { id, value }[]</text>
  <text x="682" y="148" font-size="9" fill="#374151">globalFilter: string (fuzzy)</text>
  <text x="682" y="163" font-size="9" fill="#374151">  debounce: 300ms on input</text>
  <text x="682" y="178" font-size="9" fill="#374151">filterFns: contains|startsWith</text>
  <text x="682" y="193" font-size="9" fill="#374151">  |inNumberRange|inDateRange</text>
  <text x="682" y="208" font-size="9" fill="#374151">Faceted: unique values per col</text>
  <text x="682" y="225" font-size="9" fill="#374151">  checkbox list per column</text>
  <text x="682" y="240" font-size="9" fill="#374151">Server filter: API query params</text>
  <line x1="437" y1="155" x2="461" y2="155" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="12" y="285" width="425" height="185" rx="8" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="12" y="285" width="425" height="28" rx="8" fill="#2f9d74"/>
  <rect x="12" y="301" width="425" height="12" fill="#2f9d74"/>
  <text x="224" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">C — VIRTUALISED ROWS</text>
  <rect x="24" y="323" width="190" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="119" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Virtual Scroll</text>
  <text x="34" y="358" font-size="9" fill="#374151">rowHeight: 40px fixed default</text>
  <text x="34" y="373" font-size="9" fill="#374151">  variable: measure + cache</text>
  <text x="34" y="388" font-size="9" fill="#374151">overscan: 10 rows above/below</text>
  <text x="34" y="403" font-size="9" fill="#374151">visibleRows: containerH/rowH</text>
  <text x="34" y="418" font-size="9" fill="#374151">translateY: scrollTop offset</text>
  <text x="34" y="433" font-size="9" fill="#374151">  absolute positioned rows</text>
  <text x="34" y="448" font-size="9" fill="#374151">Spacer div: totalRows × rowH</text>
  <rect x="226" y="323" width="197" height="135" rx="6" fill="#fff" stroke="#6ee7b7" stroke-width="1"/>
  <text x="324" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#2f9d74">Row Selection &amp; Expand</text>
  <text x="236" y="358" font-size="9" fill="#374151">rowSelection: Record&lt;id,bool&gt;</text>
  <text x="236" y="373" font-size="9" fill="#374151">Select all: header checkbox</text>
  <text x="236" y="388" font-size="9" fill="#374151">  indeterminate if partial</text>
  <text x="236" y="403" font-size="9" fill="#374151">Shift+click: range select</text>
  <text x="236" y="418" font-size="9" fill="#374151">Expandable row: accordion sub</text>
  <text x="236" y="433" font-size="9" fill="#374151">  variable height recalculate</text>
  <text x="236" y="448" font-size="9" fill="#374151">Pinned rows: sticky top/bottom</text>
  <rect x="463" y="285" width="425" height="185" rx="8" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="463" y="285" width="425" height="28" rx="8" fill="#d97843"/>
  <rect x="463" y="301" width="425" height="12" fill="#d97843"/>
  <text x="675" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">D — INLINE EDIT &amp; EXPORT</text>
  <rect x="475" y="323" width="185" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="567" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Inline Editing</text>
  <text x="485" y="358" font-size="9" fill="#374151">Click cell: swap to input</text>
  <text x="485" y="373" font-size="9" fill="#374151">  retain original value</text>
  <text x="485" y="388" font-size="9" fill="#374151">Enter / Tab: commit + next cell</text>
  <text x="485" y="403" font-size="9" fill="#374151">Escape: discard + revert</text>
  <text x="485" y="418" font-size="9" fill="#374151">Optimistic: update UI instantly</text>
  <text x="485" y="433" font-size="9" fill="#374151">  rollback on API error</text>
  <text x="485" y="448" font-size="9" fill="#374151">Dirty: unsaved badge on row</text>
  <rect x="672" y="323" width="202" height="135" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="1"/>
  <text x="773" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97843">Export &amp; A11y</text>
  <text x="682" y="358" font-size="9" fill="#374151">CSV: join cells with comma</text>
  <text x="682" y="373" font-size="9" fill="#374151">  chunk: 1000 rows at a time</text>
  <text x="682" y="388" font-size="9" fill="#374151">Excel: SheetJS workbook write</text>
  <text x="682" y="403" font-size="9" fill="#374151">role="grid" on table container</text>
  <text x="682" y="418" font-size="9" fill="#374151">  role="row" / role="gridcell"</text>
  <text x="682" y="433" font-size="9" fill="#374151">Keyboard: ↑↓←→ cell navigation</text>
  <text x="682" y="448" font-size="9" fill="#374151">aria-sort: ascending|descending</text>
  <line x1="675" y1="270" x2="675" y2="283" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="224" y1="270" x2="224" y2="283" stroke="#6d5bd0" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="437" y1="375" x2="461" y2="375" stroke="#2f9d74" stroke-width="1.5" marker-end="url(#arr3)"/>
  <rect x="0" y="483" width="900" height="37" fill="#1a1822"/>
  <text x="90" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Row height: 40px fixed default</text>
  <text x="270" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Overscan: 10 rows above/below</text>
  <text x="450" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Filter debounce: 300ms</text>
  <text x="630" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Export chunk: 1000 rows</text>
  <text x="810" y="506" text-anchor="middle" font-size="10" fill="#a0aec0">Frozen cols: position sticky</text>
</svg>
