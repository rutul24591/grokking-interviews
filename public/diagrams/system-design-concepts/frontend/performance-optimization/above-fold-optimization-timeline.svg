<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#2f9d74"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 Z" fill="#d97843"/>
    </marker>
  </defs>

  <rect x="18" y="18" width="924" height="524" rx="14" fill="#ffffff" stroke="#d7d2e8" stroke-width="1.5"/>
  <text x="480" y="46" text-anchor="middle" font-size="18" font-weight="700" fill="#171321">Above-the-Fold Optimization Timeline</text>
  <text x="480" y="68" text-anchor="middle" font-size="12" fill="#5f5a6f">Critical path decisions that determine first render, LCP, and early interaction readiness</text>

  <line x1="90" y1="104" x2="880" y2="104" stroke="#171321" stroke-width="2"/>
  <g fill="#5f5a6f" font-size="10" text-anchor="middle">
    <text x="90" y="92">0ms</text>
    <text x="230" y="92">TTFB</text>
    <text x="380" y="92">HTML parse</text>
    <text x="530" y="92">FCP</text>
    <text x="700" y="92">LCP target</text>
    <text x="880" y="92">hydration</text>
  </g>
  <g stroke="#171321" stroke-width="1.5">
    <line x1="90" y1="98" x2="90" y2="110"/>
    <line x1="230" y1="98" x2="230" y2="110"/>
    <line x1="380" y1="98" x2="380" y2="110"/>
    <line x1="530" y1="98" x2="530" y2="110"/>
    <line x1="700" y1="98" x2="700" y2="110"/>
    <line x1="880" y1="98" x2="880" y2="110"/>
  </g>

  <rect x="54" y="130" width="852" height="84" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="78" y="154" font-size="13" font-weight="700" fill="#1d4ed8">Network discovery lane</text>
  <line x1="120" y1="178" x2="246" y2="178" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="183" y="168" text-anchor="middle" font-size="10" fill="#334155">DNS + TLS + edge cache</text>
  <line x1="260" y1="178" x2="430" y2="178" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="345" y="168" text-anchor="middle" font-size="10" fill="#334155">HTML streaming exposes critical tags</text>
  <line x1="444" y1="178" x2="650" y2="178" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="547" y="168" text-anchor="middle" font-size="10" fill="#334155">preload scanner finds CSS, font, LCP image</text>
  <line x1="664" y1="178" x2="840" y2="178" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="752" y="168" text-anchor="middle" font-size="10" fill="#334155">priority queue fetches visible assets first</text>

  <rect x="54" y="232" width="852" height="106" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="78" y="256" font-size="13" font-weight="700" fill="#065f46">Render blocking lane</text>
  <rect x="118" y="276" width="150" height="34" rx="6" fill="#ffffff" stroke="#2f9d74" stroke-width="1.5"/>
  <text x="193" y="297" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">critical CSS inline</text>
  <line x1="270" y1="293" x2="356" y2="293" stroke="#2f9d74" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="366" y="276" width="154" height="34" rx="6" fill="#ffffff" stroke="#2f9d74" stroke-width="1.5"/>
  <text x="443" y="297" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">CSSOM ready</text>
  <line x1="522" y1="293" x2="604" y2="293" stroke="#2f9d74" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <rect x="614" y="276" width="178" height="34" rx="6" fill="#ffffff" stroke="#2f9d74" stroke-width="1.5"/>
  <text x="703" y="297" text-anchor="middle" font-size="11" font-weight="700" fill="#065f46">first paint before app JS</text>
  <text x="78" y="326" font-size="11" fill="#334155">Avoid: parser-blocking scripts, unbounded font delay, lazy-loaded hero image, and layout without reserved dimensions.</text>

  <rect x="54" y="356" width="852" height="92" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/>
  <text x="78" y="380" font-size="13" font-weight="700" fill="#9a3412">LCP candidate lane</text>
  <rect x="118" y="398" width="168" height="30" rx="6" fill="#ffffff" stroke="#d97843" stroke-width="1.5"/>
  <text x="202" y="418" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9a3412">server sends dimensions</text>
  <line x1="290" y1="413" x2="384" y2="413" stroke="#d97843" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <rect x="394" y="398" width="168" height="30" rx="6" fill="#ffffff" stroke="#d97843" stroke-width="1.5"/>
  <text x="478" y="418" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9a3412">preload + fetchpriority</text>
  <line x1="566" y1="413" x2="656" y2="413" stroke="#d97843" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <rect x="666" y="398" width="170" height="30" rx="6" fill="#ffffff" stroke="#d97843" stroke-width="1.5"/>
  <text x="751" y="418" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9a3412">decode + paint stable hero</text>

  <rect x="54" y="466" width="852" height="50" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/>
  <text x="78" y="488" font-size="13" font-weight="700" fill="#5b21b6">Hydration and interaction lane</text>
  <text x="285" y="489" text-anchor="middle" font-size="11" fill="#334155">defer non-critical JS</text>
  <text x="480" y="489" text-anchor="middle" font-size="11" fill="#334155">split below-fold widgets</text>
  <text x="688" y="489" text-anchor="middle" font-size="11" fill="#334155">keep long tasks below 50ms</text>
  <text x="480" y="510" text-anchor="middle" font-size="11" fill="#5b21b6" font-weight="700">Goal: visible content first, correct LCP priority second, interactive work after the fold is stable</text>
</svg>
