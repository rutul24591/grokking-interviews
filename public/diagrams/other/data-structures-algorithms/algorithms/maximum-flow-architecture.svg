<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <!-- Background -->
  <rect width="900" height="520" fill="#f0f4ff"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1a1822">
    Maximum Flow — Ford-Fulkerson, Edmonds-Karp, Dinic's
  </text>

  <!-- ===== Section A: Flow Network & Residual Graph (top-left) ===== -->
  <rect x="20" y="52" width="420" height="185" rx="6" fill="#edeaf5" stroke="#6d5bd0" stroke-width="1.5"/>
  <rect x="20" y="52" width="420" height="30" rx="6" fill="#6d5bd0"/>
  <rect x="20" y="70" width="420" height="12" rx="0" fill="#6d5bd0"/>
  <text x="230" y="72" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff">
    A — Flow Network &amp; Residual Graph
  </text>
  <text x="36" y="103" font-family="sans-serif" font-size="11" fill="#2d1f6e">• Source s, Sink t with directed edges (u → v)</text>
  <text x="36" y="120" font-family="sans-serif" font-size="11" fill="#2d1f6e">• Each edge has capacity c(u,v) and flow f(u,v)</text>
  <text x="36" y="137" font-family="sans-serif" font-size="11" fill="#2d1f6e">• Flow conservation: in-flow = out-flow for all non-source/sink vertices</text>
  <text x="36" y="154" font-family="sans-serif" font-size="11" fill="#2d1f6e">• Residual capacity: r(u,v) = c(u,v) − f(u,v)</text>
  <text x="36" y="171" font-family="sans-serif" font-size="11" fill="#2d1f6e">• Residual graph: forward edges (remaining cap) + backward edges (cancellation)</text>
  <text x="36" y="188" font-family="sans-serif" font-size="11" fill="#2d1f6e">• Augmenting path: any s→t path with r(u,v) &gt; 0 in residual graph</text>
  <text x="36" y="205" font-family="sans-serif" font-size="11" fill="#2d1f6e">• Bottleneck = min residual capacity along the augmenting path</text>
  <text x="36" y="222" font-family="sans-serif" font-size="11" fill="#2d1f6e">• Augment: add bottleneck to forward, subtract from backward edges</text>

  <!-- ===== Section B: Ford-Fulkerson & Edmonds-Karp (top-right) ===== -->
  <rect x="460" y="52" width="420" height="185" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="460" y="52" width="420" height="30" rx="6" fill="#2563eb"/>
  <rect x="460" y="70" width="420" height="12" rx="0" fill="#2563eb"/>
  <text x="670" y="72" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff">
    B — Ford-Fulkerson &amp; Edmonds-Karp
  </text>
  <text x="476" y="103" font-family="sans-serif" font-size="11" fill="#1e3a8a">Ford-Fulkerson:</text>
  <text x="476" y="120" font-family="sans-serif" font-size="11" fill="#1e3a8a">• Find any augmenting path (DFS), augment by bottleneck, repeat</text>
  <text x="476" y="137" font-family="sans-serif" font-size="11" fill="#1e3a8a">• O(E × |f*|) where |f*| is the maximum flow value</text>
  <text x="476" y="154" font-family="sans-serif" font-size="11" fill="#1e3a8a">• Non-terminating with irrational capacities (Zwick counterexample)</text>
  <text x="476" y="171" font-family="sans-serif" font-size="11" fill="#1e3a8a">• Practical when capacities are small integers</text>
  <text x="476" y="191" font-family="sans-serif" font-size="11" fill="#1e3a8a">Edmonds-Karp:</text>
  <text x="476" y="208" font-family="sans-serif" font-size="11" fill="#1e3a8a">• BFS for shortest (fewest-edge) augmenting path</text>
  <text x="476" y="225" font-family="sans-serif" font-size="11" fill="#1e3a8a">• O(VE²) — polynomial, guaranteed termination</text>

  <!-- Arrow A→B -->
  <line x1="440" y1="144" x2="458" y2="144" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== Section C: Dinic's Algorithm (bottom-left) ===== -->
  <rect x="20" y="260" width="420" height="185" rx="6" fill="#d1fae5" stroke="#2f9d74" stroke-width="1.5"/>
  <rect x="20" y="260" width="420" height="30" rx="6" fill="#2f9d74"/>
  <rect x="20" y="278" width="420" height="12" rx="0" fill="#2f9d74"/>
  <text x="230" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff">
    C — Dinic's Algorithm
  </text>
  <text x="36" y="311" font-family="sans-serif" font-size="11" fill="#064e3b">• Level graph via BFS: only edges advancing to next BFS level are kept</text>
  <text x="36" y="328" font-family="sans-serif" font-size="11" fill="#064e3b">• Blocking flow via DFS on level graph: saturates all paths in one pass</text>
  <text x="36" y="345" font-family="sans-serif" font-size="11" fill="#064e3b">• Each BFS phase increases shortest augmenting path length by ≥ 1</text>
  <text x="36" y="362" font-family="sans-serif" font-size="11" fill="#064e3b">• At most O(V) phases → O(V²E) overall</text>
  <text x="36" y="379" font-family="sans-serif" font-size="11" fill="#064e3b">• Unit-capacity graphs: O(E√V)</text>
  <text x="36" y="396" font-family="sans-serif" font-size="11" fill="#064e3b">• Bipartite matching: O(E√V)</text>
  <text x="36" y="413" font-family="sans-serif" font-size="11" fill="#064e3b">• In practice 10–100× faster than Edmonds-Karp due to blocking flow</text>
  <text x="36" y="430" font-family="sans-serif" font-size="11" fill="#064e3b">• Dead-end pruning: remove saturated or dead vertices from level graph</text>

  <!-- Arrow A→C -->
  <line x1="230" y1="237" x2="230" y2="258" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== Section D: Min-Cut & Applications (bottom-right) ===== -->
  <rect x="460" y="260" width="420" height="185" rx="6" fill="#fef3c7" stroke="#d97843" stroke-width="1.5"/>
  <rect x="460" y="260" width="420" height="30" rx="6" fill="#d97843"/>
  <rect x="460" y="278" width="420" height="12" rx="0" fill="#d97843"/>
  <text x="670" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff">
    D — Min-Cut &amp; Applications
  </text>
  <text x="476" y="311" font-family="sans-serif" font-size="11" fill="#7c2d12">• Max-Flow Min-Cut theorem: max flow value = min cut capacity</text>
  <text x="476" y="328" font-family="sans-serif" font-size="11" fill="#7c2d12">• Min cut partitions V into S (contains s) and T (contains t)</text>
  <text x="476" y="345" font-family="sans-serif" font-size="11" fill="#7c2d12">• Finding min cut: BFS on residual graph after max flow</text>
  <text x="476" y="362" font-family="sans-serif" font-size="11" fill="#7c2d12">• S = vertices reachable from s; T = rest; cut edges are S→T in original</text>
  <text x="476" y="382" font-family="sans-serif" font-size="11" fill="#7c2d12">Applications:</text>
  <text x="476" y="399" font-family="sans-serif" font-size="11" fill="#7c2d12">• Bipartite matching (Hopcroft-Karp via Dinic's)</text>
  <text x="476" y="416" font-family="sans-serif" font-size="11" fill="#7c2d12">• Network reliability &amp; bandwidth allocation</text>
  <text x="476" y="433" font-family="sans-serif" font-size="11" fill="#7c2d12">• Assignment problems, image segmentation (graph cuts)</text>

  <!-- Arrow B→C (right column top to bottom-left is diagonal; use B→D instead per spec) -->
  <!-- Arrow B→C per spec -->
  <line x1="670" y1="237" x2="670" y2="258" stroke="#2563eb" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Arrow A→D per spec -->
  <line x1="440" y1="352" x2="458" y2="352" stroke="#6d5bd0" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ===== Footer ===== -->
  <rect x="0" y="466" width="900" height="54" rx="0" fill="#1a1822"/>
  <text x="90" y="488" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#a78bfa">Ford-Fulkerson</text>
  <text x="90" y="503" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e2e8f0">O(E · |f*|)</text>
  <line x1="178" y1="474" x2="178" y2="512" stroke="#374151" stroke-width="1"/>
  <text x="270" y="488" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#60a5fa">Edmonds-Karp</text>
  <text x="270" y="503" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e2e8f0">O(VE²)</text>
  <line x1="358" y1="474" x2="358" y2="512" stroke="#374151" stroke-width="1"/>
  <text x="450" y="488" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#34d399">Dinic's</text>
  <text x="450" y="503" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e2e8f0">O(V²E)</text>
  <line x1="538" y1="474" x2="538" y2="512" stroke="#374151" stroke-width="1"/>
  <text x="630" y="488" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fbbf24">Max-Flow = Min-Cut</text>
  <text x="630" y="503" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e2e8f0">Duality Theorem</text>
  <line x1="718" y1="474" x2="718" y2="512" stroke="#374151" stroke-width="1"/>
  <text x="809" y="488" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fb923c">Unit Graphs</text>
  <text x="809" y="503" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e2e8f0">O(E√V)</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6d5bd0"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
