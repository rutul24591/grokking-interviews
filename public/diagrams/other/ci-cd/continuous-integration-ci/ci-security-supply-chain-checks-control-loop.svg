<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Security Gate Routing by Severity and Confidence</title>
  <desc id="desc">Security gate routing diagram for CI Security and Supply Chain Checks</desc>
  <rect width="900" height="500" fill="#f3f1f8" rx="12"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1822">Security Gate Routing by Severity and Confidence</text>
  <rect x="45" y="62" width="810" height="386" rx="10" fill="#ffffff" stroke="#d7d1e6" stroke-width="1.5"/>
  <rect x="80" y="105" width="170" height="220" rx="8" fill="#fff1f2" stroke="#cc3333" stroke-width="1.5"/>
  <text x="165" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#cc3333">Critical</text>
  <text x="102" y="145" font-size="9" fill="#1a1822">• secret leak</text>
  <text x="102" y="163" font-size="9" fill="#1a1822">• reachable RCE</text>
  <text x="102" y="181" font-size="9" fill="#1a1822">• unsigned artifact</text>
  <rect x="105" y="265" width="120" height="30" rx="5" fill="#cc3333"/>
  <text x="165" y="284" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">block merge</text>
  <rect x="280" y="105" width="170" height="220" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="365" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#f59e0b">High</text>
  <text x="302" y="145" font-size="9" fill="#1a1822">• known exploit</text>
  <text x="302" y="163" font-size="9" fill="#1a1822">• prod image vuln</text>
  <text x="302" y="181" font-size="9" fill="#1a1822">• privilege change</text>
  <rect x="305" y="265" width="120" height="30" rx="5" fill="#f59e0b"/>
  <text x="365" y="284" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">owner fix</text>
  <rect x="480" y="105" width="170" height="220" rx="8" fill="#f9f7ff" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="565" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#6d5bd0">Medium</text>
  <text x="502" y="145" font-size="9" fill="#1a1822">• transitive lib</text>
  <text x="502" y="163" font-size="9" fill="#1a1822">• low exposure</text>
  <text x="502" y="181" font-size="9" fill="#1a1822">• fix available</text>
  <rect x="505" y="265" width="120" height="30" rx="5" fill="#6d5bd0"/>
  <text x="565" y="284" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">ticket + SLA</text>
  <rect x="680" y="105" width="140" height="220" rx="8" fill="#ecfdf5" stroke="#228B22" stroke-width="1.5"/>
  <text x="750" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#228B22">Low</text>
  <text x="700" y="145" font-size="9" fill="#1a1822">• not reachable</text>
  <text x="700" y="163" font-size="9" fill="#1a1822">• dev-only</text>
  <text x="700" y="181" font-size="9" fill="#1a1822">• accepted</text>
  <rect x="700" y="265" width="100" height="30" rx="5" fill="#228B22"/>
  <text x="750" y="284" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">monitor</text>
  <rect x="95" y="365" width="710" height="40" rx="8" fill="#6d5bd0"/>
  <text x="450" y="390" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Severity alone is not enough: combine reachability, exploitability, asset criticality, and confidence.</text>
</svg>
