<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Flake Detection and Quarantine Lifecycle</title>
  <desc id="desc">Flaky test lifecycle for Flaky Test Detection and Quarantine</desc>
  <rect width="900" height="500" fill="#f3f1f8" rx="12"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1822">Flake Detection and Quarantine Lifecycle</text>
  <rect x="42" y="62" width="816" height="390" rx="10" fill="#ffffff" stroke="#d7d1e6" stroke-width="1.5"/>
  <rect x="75" y="110" width="110" height="32" rx="5" fill="#cc3333"/>
  <text x="130" y="130" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">test fails</text>
  <line x1="185" y1="126" x2="275" y2="126" stroke="#cc3333" stroke-width="2" stroke-linecap="round"/>
  <path d="M 275 126 L 267.0 130.4 L 267.0 121.6 Z" fill="#cc3333"/>
  <rect x="275" y="110" width="120" height="32" rx="5" fill="#f59e0b"/>
  <text x="335" y="130" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">controlled retry</text>
  <line x1="395" y1="126" x2="490" y2="126" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 490 126 L 482.0 130.4 L 482.0 121.6 Z" fill="#f59e0b"/>
  <rect x="490" y="110" width="120" height="32" rx="5" fill="#6d5bd0"/>
  <text x="550" y="130" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">flake score</text>
  <line x1="610" y1="126" x2="705" y2="126" stroke="#6d5bd0" stroke-width="2" stroke-linecap="round"/>
  <path d="M 705 126 L 697.0 130.4 L 697.0 121.6 Z" fill="#6d5bd0"/>
  <rect x="705" y="110" width="115" height="32" rx="5" fill="#228B22"/>
  <text x="762.5" y="130" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">decision</text>
  <rect x="80" y="205" width="190" height="130" rx="8" fill="#fff1f2" stroke="#cc3333" stroke-width="1.5"/>
  <text x="175" y="227" text-anchor="middle" font-size="11" font-weight="700" fill="#cc3333">Real regression</text>
  <text x="102" y="240" font-size="9" fill="#1a1822">• reproducible fail</text>
  <text x="102" y="256" font-size="9" fill="#1a1822">• same assertion</text>
  <text x="102" y="272" font-size="9" fill="#1a1822">• block merge</text>
  <rect x="355" y="205" width="190" height="130" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="227" text-anchor="middle" font-size="11" font-weight="700" fill="#f59e0b">Probable flake</text>
  <text x="377" y="240" font-size="9" fill="#1a1822">• passes on retry</text>
  <text x="377" y="256" font-size="9" fill="#1a1822">• env-sensitive</text>
  <text x="377" y="272" font-size="9" fill="#1a1822">• route to owner</text>
  <rect x="630" y="205" width="190" height="130" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="725" y="227" text-anchor="middle" font-size="11" font-weight="700" fill="#db2777">Quarantined</text>
  <text x="652" y="240" font-size="9" fill="#1a1822">• non-blocking</text>
  <text x="652" y="256" font-size="9" fill="#1a1822">• expires soon</text>
  <text x="652" y="272" font-size="9" fill="#1a1822">• must be fixed</text>
  <rect x="80" y="382" width="740" height="38" rx="7" fill="#6d5bd0"/>
  <text x="450" y="406" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Do not hide flakes; classify them, assign ownership, and expire quarantine automatically.</text>
</svg>
