<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Risk-Based Test Selection Graph</title>
  <desc id="desc">Risk-based test selection graph for Test Automation Strategy in CI</desc>
  <rect width="900" height="500" fill="#f3f1f8" rx="12"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1822">Risk-Based Test Selection Graph</text>
  <rect x="45" y="62" width="810" height="386" rx="10" fill="#ffffff" stroke="#d7d1e6" stroke-width="1.5"/>
  <rect x="70" y="105" width="160" height="110" rx="8" fill="#ffffff" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="150" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#6d5bd0">Change classifier</text>
  <text x="90" y="139" font-size="9" fill="#1a1822">• files touched</text>
  <text x="90" y="154" font-size="9" fill="#1a1822">• ownership</text>
  <text x="90" y="169" font-size="9" fill="#1a1822">• dependency graph</text>
  <line x1="230" y1="160" x2="315" y2="160" stroke="#6d5bd0" stroke-width="2" stroke-linecap="round"/>
  <path d="M 315 160 L 307.0 164.4 L 307.0 155.6 Z" fill="#6d5bd0"/>
  <rect x="315" y="85" width="230" height="150" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="430" y="107" text-anchor="middle" font-size="11" font-weight="700" fill="#f59e0b">Affected risk map</text>
  <text x="340" y="124" font-size="9" fill="#1a1822">• API contract changed</text>
  <text x="340" y="142" font-size="9" fill="#1a1822">• shared UI package</text>
  <text x="340" y="160" font-size="9" fill="#1a1822">• database migration</text>
  <text x="340" y="178" font-size="9" fill="#1a1822">• critical path service</text>
  <line x1="545" y1="160" x2="635" y2="160" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 635 160 L 627.0 164.4 L 627.0 155.6 Z" fill="#f59e0b"/>
  <rect x="635" y="105" width="170" height="110" rx="8" fill="#ecfdf5" stroke="#228B22" stroke-width="1.5"/>
  <text x="720" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#228B22">Selected suites</text>
  <text x="655" y="139" font-size="9" fill="#1a1822">• unit shard 3</text>
  <text x="655" y="154" font-size="9" fill="#1a1822">• contract: billing</text>
  <text x="655" y="169" font-size="9" fill="#1a1822">• smoke checkout</text>
  <rect x="90" y="278" width="720" height="96" rx="8" fill="#f9f7ff" stroke="#6d5bd0"/>
  <text x="450" y="305" text-anchor="middle" font-size="12" font-weight="700" fill="#6d5bd0">False negative control</text>
  <text x="120" y="334" font-size="9" fill="#1a1822">If selected tests miss incidents, feed production failure back into dependency graph and risk rules.</text>
  <text x="120" y="354" font-size="9" fill="#1a1822">If selected tests are too broad, split suites by ownership and runtime cost.</text>
</svg>
