<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">CI Evidence Ledger and Gate Ownership</title>
  <desc id="desc">Evidence table for CI Fundamentals and Pipeline Architecture</desc>
  <rect width="900" height="500" fill="#f3f1f8" rx="12"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1822">CI Evidence Ledger and Gate Ownership</text>
  <rect x="40" y="62" width="820" height="380" rx="10" fill="#ffffff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="70" y="94" font-size="11" font-weight="700" fill="#6d5bd0">Signal</text>
  <text x="245" y="94" font-size="11" font-weight="700" fill="#6d5bd0">Evidence captured</text>
  <text x="500" y="94" font-size="11" font-weight="700" fill="#6d5bd0">Owner</text>
  <text x="690" y="94" font-size="11" font-weight="700" fill="#6d5bd0">Decision latency</text>
  <rect x="58" y="114" width="784" height="42" rx="6" fill="#ffffff" stroke="#d7d1e6"/>
  <text x="70" y="139" font-size="10" font-weight="700" fill="#1a1822">PR checks</text>
  <text x="245" y="139" font-size="10" fill="#1a1822">unit + lint + type</text>
  <text x="500" y="139" font-size="10" fill="#1a1822">developer</text>
  <text x="690" y="139" font-size="10" fill="#228B22" font-weight="600">minutes</text>
  <rect x="58" y="172" width="784" height="42" rx="6" fill="#f9f7ff" stroke="#d7d1e6"/>
  <text x="70" y="197" font-size="10" font-weight="700" fill="#1a1822">Merge queue</text>
  <text x="245" y="197" font-size="10" fill="#1a1822">integration + conflict</text>
  <text x="500" y="197" font-size="10" fill="#1a1822">repo owner</text>
  <text x="690" y="197" font-size="10" fill="#228B22" font-weight="600">10-30m</text>
  <rect x="58" y="230" width="784" height="42" rx="6" fill="#ffffff" stroke="#d7d1e6"/>
  <text x="70" y="255" font-size="10" font-weight="700" fill="#1a1822">Artifact</text>
  <text x="245" y="255" font-size="10" fill="#1a1822">digest + SBOM + signature</text>
  <text x="500" y="255" font-size="10" fill="#1a1822">platform</text>
  <text x="690" y="255" font-size="10" fill="#228B22" font-weight="600">immutable</text>
  <rect x="58" y="288" width="784" height="42" rx="6" fill="#f9f7ff" stroke="#d7d1e6"/>
  <text x="70" y="313" font-size="10" font-weight="700" fill="#1a1822">Policy</text>
  <text x="245" y="313" font-size="10" fill="#1a1822">severity + tier rules</text>
  <text x="500" y="313" font-size="10" fill="#1a1822">security</text>
  <text x="690" y="313" font-size="10" fill="#cc3333" font-weight="600">blocking</text>
  <rect x="58" y="346" width="784" height="42" rx="6" fill="#ffffff" stroke="#d7d1e6"/>
  <text x="70" y="371" font-size="10" font-weight="700" fill="#1a1822">Learning</text>
  <text x="245" y="371" font-size="10" fill="#1a1822">failure reason + DORA</text>
  <text x="500" y="371" font-size="10" fill="#1a1822">team</text>
  <text x="690" y="371" font-size="10" fill="#228B22" font-weight="600">weekly</text>
  <rect x="58" y="415" width="784" height="42" rx="7" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="450" y="441" text-anchor="middle" font-size="10" font-weight="600" fill="#1a1822">If evidence is missing or owner is unclear, the gate creates delay without improving safety.</text>
</svg>
