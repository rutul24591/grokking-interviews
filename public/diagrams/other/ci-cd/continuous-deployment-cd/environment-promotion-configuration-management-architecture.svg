<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Same Artifact, Environment-Specific Configuration</title>
  <desc id="desc">Environment promotion architecture for Environment Promotion and Configuration Management</desc>
  <rect width="900" height="500" fill="#f3f1f8" rx="12"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1822">Same Artifact, Environment-Specific Configuration</text>
  <rect x="42" y="62" width="816" height="390" rx="10" fill="#ffffff" stroke="#d7d1e6" stroke-width="1.5"/>
  <rect x="65" y="130" width="145" height="36" rx="5" fill="#6d5bd0"/>
  <text x="137.5" y="152" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">artifact digest</text>
  <line x1="210" y1="148" x2="300" y2="148" stroke="#6d5bd0" stroke-width="2" stroke-linecap="round"/>
  <path d="M 300 148 L 292.0 152.4 L 292.0 143.6 Z" fill="#6d5bd0"/>
  <rect x="300" y="90" width="140" height="190" rx="8" fill="#ecfdf5" stroke="#228B22" stroke-width="1.5"/>
