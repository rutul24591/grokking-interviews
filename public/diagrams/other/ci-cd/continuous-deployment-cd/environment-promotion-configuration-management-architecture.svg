  <text x="450" y="357" text-anchor="middle" font-size="11" font-weight="700" fill="#6d5bd0">Invariant</text>
  <text x="450" y="379" text-anchor="middle" font-size="9" fill="#1a1822">Promote the same artifact; vary only configuration, secrets, capacity, and traffic policy.</text>
