  <text x="550" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#f59e0b">Staging</text>
  <rect x="660" y="90" width="140" height="190" rx="8" fill="#fff1f2" stroke="#cc3333" stroke-width="1.5"/>
  <text x="730" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#cc3333">Production</text>
  <text x="320" y="130" font-size="9" fill="#1a1822">• small data</text>
  <text x="320" y="146" font-size="9" fill="#1a1822">• debug config</text>
  <text x="320" y="162" font-size="9" fill="#1a1822">• test secrets</text>
