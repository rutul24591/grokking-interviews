<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Drift Detection and Remediation Loop</title>
  <desc id="desc">IaC drift loop diagram for Infrastructure as Code in Deployment Pipelines</desc>
  <rect width="900" height="500" fill="#f3f1f8" rx="12"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1822">Drift Detection and Remediation Loop</text>
  <rect x="45" y="62" width="810" height="386" rx="10" fill="#ffffff" stroke="#d7d1e6" stroke-width="1.5"/>
  <circle cx="450" cy="240" r="115" fill="#f9f7ff" stroke="#6d5bd0" stroke-width="2"/>
  <rect x="395" y="100" width="110" height="28" rx="5" fill="#cc3333"/>
  <text x="450" y="118" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">detect drift</text>
  <rect x="590" y="220" width="110" height="28" rx="5" fill="#f59e0b"/>
  <text x="645" y="238" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">open PR</text>
  <rect x="395" y="350" width="110" height="28" rx="5" fill="#228B22"/>
  <text x="450" y="368" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">apply fix</text>
  <rect x="195" y="220" width="125" height="28" rx="5" fill="#6d5bd0"/>
  <text x="257.5" y="238" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">update baseline</text>
  <line x1="505" y1="114" x2="590" y2="220" stroke="#cc3333" stroke-width="2" stroke-linecap="round"/>
  <path d="M 590 220 L 581.6 216.5 L 588.4 211.0 Z" fill="#cc3333"/>
  <line x1="700" y1="234" x2="505" y2="350" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 505 350 L 509.6 342.1 L 514.1 349.7 Z" fill="#f59e0b"/>
  <line x1="395" y1="364" x2="320" y2="234" stroke="#228B22" stroke-width="2" stroke-linecap="round"/>
  <path d="M 320 234 L 327.8 238.7 L 320.2 243.1 Z" fill="#228B22"/>
  <line x1="320" y1="220" x2="395" y2="114" stroke="#6d5bd0" stroke-width="2" stroke-linecap="round"/>
  <path d="M 395 114 L 394.0 123.1 L 386.8 118.0 Z" fill="#6d5bd0"/>
  <text x="450" y="235" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1822">Infrastructure</text>
  <text x="450" y="255" text-anchor="middle" font-size="10" fill="#5f5a6f">desired state vs real state</text>
  <rect x="70" y="395" width="760" height="28" rx="7" fill="#6d5bd0"/>
  <text x="450" y="414" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">Never repair drift manually without creating auditable desired-state change.</text>
</svg>
