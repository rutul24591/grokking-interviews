<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">SLO Burn-Rate Decision Tree</title>
  <desc id="desc">SLO burn-rate decision tree for Deployment Observability, SLO Gates, and Automated Rollback</desc>
  <rect width="900" height="500" fill="#f3f1f8" rx="12"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1822">SLO Burn-Rate Decision Tree</text>
  <rect x="45" y="62" width="810" height="386" rx="10" fill="#ffffff" stroke="#d7d1e6" stroke-width="1.5"/>
  <rect x="70" y="95" width="210" height="90" rx="8" fill="#ffffff" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="175" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#6d5bd0">Collect signals</text>
  <text x="92" y="128" font-size="9" fill="#1a1822">• SLI: errors, latency, saturation</text>
  <text x="92" y="143" font-size="9" fill="#1a1822">• business: conversion, checkout</text>
  <line x1="280" y1="140" x2="390" y2="140" stroke="#6d5bd0" stroke-width="2" stroke-linecap="round"/>
  <path d="M 390 140 L 382.0 144.4 L 382.0 135.6 Z" fill="#6d5bd0"/>
  <rect x="390" y="95" width="160" height="90" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="470" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#f59e0b">Compare</text>
  <text x="410" y="128" font-size="9" fill="#1a1822">• baseline</text>
  <text x="410" y="143" font-size="9" fill="#1a1822">• canary</text>
  <text x="410" y="158" font-size="9" fill="#1a1822">• regional noise</text>
  <line x1="550" y1="140" x2="660" y2="140" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 660 140 L 652.0 144.4 L 652.0 135.6 Z" fill="#f59e0b"/>
  <rect x="660" y="95" width="160" height="90" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="740" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#db2777">Decision</text>
  <text x="680" y="128" font-size="9" fill="#1a1822">• continue</text>
  <text x="680" y="143" font-size="9" fill="#1a1822">• pause</text>
  <text x="680" y="158" font-size="9" fill="#1a1822">• rollback</text>
  <path d="M 450 230 L 355 310 L 545 310 Z" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="277" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1822">burn rate?</text>
  <line x1="355" y1="310" x2="190" y2="360" stroke="#228B22" stroke-width="2" stroke-linecap="round"/>
  <path d="M 190 360 L 196.4 353.5 L 198.9 361.9 Z" fill="#228B22"/>
  <line x1="545" y1="310" x2="710" y2="360" stroke="#cc3333" stroke-width="2" stroke-linecap="round"/>
  <path d="M 710 360 L 701.1 361.9 L 703.6 353.5 Z" fill="#cc3333"/>
  <rect x="115" y="350" width="150" height="34" rx="5" fill="#228B22"/>
  <text x="190" y="371" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">within budget: ramp</text>
  <rect x="635" y="350" width="150" height="34" rx="5" fill="#cc3333"/>
  <text x="710" y="371" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">budget burn: rollback</text>
  <text x="450" y="425" text-anchor="middle" font-size="10" font-weight="600" fill="#cc3333">Do not roll forward when observability is missing or delayed for high-risk services.</text>
</svg>
