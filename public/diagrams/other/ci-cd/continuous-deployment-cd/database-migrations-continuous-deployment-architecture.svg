<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Expand-Contract Migration Timeline</title>
  <desc id="desc">Expand-contract migration timeline for Database Migrations in Continuous Deployment</desc>
  <rect width="900" height="500" fill="#f3f1f8" rx="12"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1822">Expand-Contract Migration Timeline</text>
  <rect x="42" y="62" width="816" height="390" rx="10" fill="#ffffff" stroke="#d7d1e6" stroke-width="1.5"/>
  <line x1="80" y1="155" x2="820" y2="155" stroke="#d7d1e6" stroke-width="2"/>
  <circle cx="90" cy="155" r="13" fill="#6d5bd0"/><text x="90" y="197" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1822">expand</text>
  <circle cx="265" cy="155" r="13" fill="#f59e0b"/><text x="265" y="197" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1822">dual write</text>
  <circle cx="440" cy="155" r="13" fill="#db2777"/><text x="440" y="197" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1822">backfill</text>
  <circle cx="615" cy="155" r="13" fill="#228B22"/><text x="615" y="197" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1822">read switch</text>
  <circle cx="790" cy="155" r="13" fill="#cc3333"/><text x="790" y="197" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1822">contract</text>
  <rect x="75" y="245" width="210" height="100" rx="8" fill="#ecfdf5" stroke="#228B22" stroke-width="1.5"/>
  <text x="180" y="267" text-anchor="middle" font-size="11" font-weight="700" fill="#228B22">Compatible code</text>
  <text x="97" y="280" font-size="9" fill="#1a1822">• old code reads old column</text>
  <text x="97" y="295" font-size="9" fill="#1a1822">• new code handles both</text>
  <text x="97" y="310" font-size="9" fill="#1a1822">• rollback still possible</text>
  <rect x="345" y="245" width="210" height="100" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="450" y="267" text-anchor="middle" font-size="11" font-weight="700" fill="#f59e0b">Data movement</text>
  <text x="367" y="280" font-size="9" fill="#1a1822">• throttled backfill</text>
  <text x="367" y="295" font-size="9" fill="#1a1822">• idempotent batches</text>
  <text x="367" y="310" font-size="9" fill="#1a1822">• progress metrics</text>
  <rect x="615" y="245" width="210" height="100" rx="8" fill="#fff1f2" stroke="#cc3333" stroke-width="1.5"/>
  <text x="720" y="267" text-anchor="middle" font-size="11" font-weight="700" fill="#cc3333">Cleanup</text>
  <text x="637" y="280" font-size="9" fill="#1a1822">• drop old reads</text>
  <text x="637" y="295" font-size="9" fill="#1a1822">• remove dual write</text>
  <text x="637" y="310" font-size="9" fill="#1a1822">• drop old column last</text>
  <text x="450" y="408" text-anchor="middle" font-size="10" font-weight="600" fill="#6d5bd0">Database CD is safe only when app versions and schema versions overlap intentionally.</text>
</svg>
