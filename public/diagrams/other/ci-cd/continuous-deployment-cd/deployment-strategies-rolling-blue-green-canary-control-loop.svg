<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Blast Radius, Capacity Cost, and Rollback Speed</title>
  <desc id="desc">Blast radius and cost chart for Deployment Strategies: Rolling, Blue-Green, Canary</desc>
  <rect width="900" height="500" fill="#f3f1f8" rx="12"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1822">Blast Radius, Capacity Cost, and Rollback Speed</text>
  <rect x="45" y="62" width="810" height="386" rx="10" fill="#ffffff" stroke="#d7d1e6" stroke-width="1.5"/>
  <text x="110" y="410" font-size="10" fill="#1a1822">low</text><text x="760" y="410" font-size="10" fill="#1a1822">high</text>
  <text x="372" y="435" font-size="10" font-weight="700" fill="#1a1822">Capacity cost</text>
  <text x="50" y="325" font-size="10" fill="#1a1822" transform="rotate(-90 50 325)">Blast radius</text>
  <line x1="110" y1="380" x2="790" y2="380" stroke="#d7d1e6" stroke-width="2"/>
  <line x1="110" y1="380" x2="110" y2="95" stroke="#d7d1e6" stroke-width="2"/>
  <circle cx="240" cy="160" r="28" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="240" y="164" text-anchor="middle" font-size="9" font-weight="700" fill="#1a1822">canary</text>
  <circle cx="410" cy="255" r="28" fill="#ecfdf5" stroke="#228B22" stroke-width="2"/><text x="410" y="259" text-anchor="middle" font-size="9" font-weight="700" fill="#1a1822">rolling</text>
  <circle cx="650" cy="230" r="34" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="650" y="234" text-anchor="middle" font-size="9" font-weight="700" fill="#1a1822">blue-green</text>
  <rect x="535" y="115" width="235" height="72" rx="8" fill="#fdf2f8" stroke="#db2777"/>
  <text x="652" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="#db2777">Rollback speed</text>
  <text x="652" y="162" text-anchor="middle" font-size="9" fill="#1a1822">fastest when old version still has capacity and compatible state</text>
</svg>
