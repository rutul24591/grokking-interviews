<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Exposure Ramp Controlled by Metrics Gates</title>
  <desc id="desc">Exposure ramp diagram for Progressive Delivery and Feature Flags</desc>
  <rect width="900" height="500" fill="#f3f1f8" rx="12"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1822">Exposure Ramp Controlled by Metrics Gates</text>
  <rect x="45" y="62" width="810" height="386" rx="10" fill="#ffffff" stroke="#d7d1e6" stroke-width="1.5"/>
  <polyline points="100,350 210,315 320,270 430,220 540,170 650,130 770,105" fill="none" stroke="#228B22" stroke-width="4"/>
  <line x1="100" y1="360" x2="800" y2="360" stroke="#d7d1e6" stroke-width="2"/>
  <line x1="100" y1="95" x2="100" y2="360" stroke="#d7d1e6" stroke-width="2"/>
  <text x="122" y="91" font-size="10" font-weight="700" fill="#228B22">100%</text>
  <text x="80" y="353" font-size="10" fill="#1a1822">0%</text>
  <text x="405" y="390" font-size="10" fill="#1a1822">time and confidence</text>
  <rect x="135" y="305" width="70" height="24" rx="5" fill="#6d5bd0"/>
  <text x="170" y="321" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">1%</text>
  <rect x="285" y="260" width="70" height="24" rx="5" fill="#f59e0b"/>
  <text x="320" y="276" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">5%</text>
  <rect x="435" y="210" width="70" height="24" rx="5" fill="#db2777"/>
  <text x="470" y="226" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">25%</text>
  <rect x="590" y="150" width="70" height="24" rx="5" fill="#228B22"/>
  <text x="625" y="166" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">50%</text>
  <rect x="715" y="95" width="70" height="24" rx="5" fill="#228B22"/>
  <text x="750" y="111" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">100%</text>
  <rect x="155" y="115" width="260" height="82" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="285" y="143" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">Gate before each ramp</text>
  <text x="175" y="168" font-size="9" fill="#1a1822">• errors</text>
  <text x="175" y="182" font-size="9" fill="#1a1822">• latency</text>
  <text x="175" y="196" font-size="9" fill="#1a1822">• conversion</text>
  <text x="175" y="210" font-size="9" fill="#1a1822">• support tickets</text>
  <rect x="515" y="255" width="230" height="70" rx="8" fill="#fff1f2" stroke="#cc3333"/>
  <text x="630" y="282" text-anchor="middle" font-size="11" font-weight="700" fill="#cc3333">Kill switch</text>
  <text x="630" y="305" text-anchor="middle" font-size="9" fill="#1a1822">config rollback without redeploy</text>
</svg>
