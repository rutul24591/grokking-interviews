<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">IaC Plan, Policy, Approval, and Apply Pipeline</title>
  <desc id="desc">IaC deployment pipeline diagram for Infrastructure as Code in Deployment Pipelines</desc>
  <rect width="900" height="500" fill="#f3f1f8" rx="12"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1822">IaC Plan, Policy, Approval, and Apply Pipeline</text>
  <rect x="42" y="62" width="816" height="390" rx="10" fill="#ffffff" stroke="#d7d1e6" stroke-width="1.5"/>
  <rect x="65" y="125" width="100" height="32" rx="5" fill="#6d5bd0"/>
  <text x="115" y="145" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">IaC PR</text>
  <line x1="165" y1="141" x2="245" y2="141" stroke="#6d5bd0" stroke-width="2" stroke-linecap="round"/>
  <path d="M 245 141 L 237.0 145.4 L 237.0 136.6 Z" fill="#6d5bd0"/>
  <rect x="245" y="125" width="110" height="32" rx="5" fill="#f59e0b"/>
  <text x="300" y="145" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">plan</text>
  <line x1="355" y1="141" x2="435" y2="141" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <path d="M 435 141 L 427.0 145.4 L 427.0 136.6 Z" fill="#f59e0b"/>
  <rect x="435" y="125" width="120" height="32" rx="5" fill="#db2777"/>
  <text x="495" y="145" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">policy check</text>
  <line x1="555" y1="141" x2="635" y2="141" stroke="#db2777" stroke-width="2" stroke-linecap="round"/>
  <path d="M 635 141 L 627.0 145.4 L 627.0 136.6 Z" fill="#db2777"/>
  <rect x="635" y="125" width="110" height="32" rx="5" fill="#228B22"/>
  <text x="690" y="145" text-anchor="middle" font-size="9" font-weight="600" fill="#ffffff">apply</text>
  <rect x="260" y="220" width="380" height="70" rx="8" fill="#fff7ed" stroke="#f59e0b"/>
  <text x="450" y="248" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">State lock</text>
  <text x="450" y="270" text-anchor="middle" font-size="9" fill="#1a1822">one writer, visible plan, controlled credentials</text>
  <rect x="90" y="330" width="220" height="82" rx="8" fill="#fff1f2" stroke="#cc3333" stroke-width="1.5"/>
  <text x="200" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#cc3333">Policy examples</text>
  <text x="112" y="360" font-size="9" fill="#1a1822">• no public buckets</text>
  <text x="112" y="374" font-size="9" fill="#1a1822">• no wildcard IAM</text>
  <text x="112" y="388" font-size="9" fill="#1a1822">• region allowlist</text>
  <rect x="590" y="330" width="220" height="82" rx="8" fill="#ecfdf5" stroke="#228B22" stroke-width="1.5"/>
  <text x="700" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#228B22">Apply evidence</text>
  <text x="612" y="360" font-size="9" fill="#1a1822">• state version</text>
  <text x="612" y="374" font-size="9" fill="#1a1822">• change set</text>
  <text x="612" y="388" font-size="9" fill="#1a1822">• actor identity</text>
</svg>
