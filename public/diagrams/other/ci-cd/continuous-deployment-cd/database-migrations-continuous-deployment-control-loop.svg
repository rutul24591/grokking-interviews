<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Online Migration Safety Gates</title>
  <desc id="desc">Database migration safety gates for Database Migrations in Continuous Deployment</desc>
  <rect width="900" height="500" fill="#f3f1f8" rx="12"/>
  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1822">Online Migration Safety Gates</text>
  <rect x="45" y="62" width="810" height="386" rx="10" fill="#ffffff" stroke="#d7d1e6" stroke-width="1.5"/>
  <rect x="70" y="105" width="170" height="220" rx="8" fill="#ffffff" stroke="#6d5bd0" stroke-width="1.5"/>
  <text x="155" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#6d5bd0">Preflight</text>
  <text x="92" y="145" font-size="9" fill="#1a1822">• lock estimate</text>
  <text x="92" y="163" font-size="9" fill="#1a1822">• index plan</text>
  <text x="92" y="181" font-size="9" fill="#1a1822">• rollback window</text>
  <rect x="275" y="105" width="170" height="220" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#f59e0b">Execution</text>
  <text x="297" y="145" font-size="9" fill="#1a1822">• batch size</text>
  <text x="297" y="163" font-size="9" fill="#1a1822">• throttle writes</text>
  <text x="297" y="181" font-size="9" fill="#1a1822">• resume cursor</text>
  <rect x="480" y="105" width="170" height="220" rx="8" fill="#ecfdf5" stroke="#228B22" stroke-width="1.5"/>
  <text x="565" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#228B22">Verification</text>
  <text x="502" y="145" font-size="9" fill="#1a1822">• row counts</text>
  <text x="502" y="163" font-size="9" fill="#1a1822">• dual-read compare</text>
  <text x="502" y="181" font-size="9" fill="#1a1822">• error budget</text>
  <rect x="685" y="105" width="140" height="220" rx="8" fill="#fff1f2" stroke="#cc3333" stroke-width="1.5"/>
  <text x="755" y="127" text-anchor="middle" font-size="11" font-weight="700" fill="#cc3333">Cleanup</text>
  <text x="705" y="145" font-size="9" fill="#1a1822">• disable old path</text>
  <text x="705" y="163" font-size="9" fill="#1a1822">• wait window</text>
  <text x="705" y="181" font-size="9" fill="#1a1822">• drop safely</text>
  <rect x="90" y="365" width="720" height="36" rx="7" fill="#cc3333"/>
  <text x="450" y="388" text-anchor="middle" font-size="10" font-weight="600" fill="#ffffff">The dangerous step is usually contract, not expand. Drop only after compatibility evidence exists.</text>
</svg>
