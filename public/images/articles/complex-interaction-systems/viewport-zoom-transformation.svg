<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <!-- Title -->
  <text x="500" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#1a1a1a">
    Viewport Zoom Transformation: Zoom Around Cursor
  </text>

  <!-- Left side: Before Zoom -->
  <g>
    <text x="150" y="70" font-size="14" font-weight="bold" fill="#1a1a1a">Before Zoom (1.0x)</text>

    <!-- Canvas background -->
    <rect x="50" y="90" width="200" height="200" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>

    <!-- Canvas content grid -->
    <line x1="50" y1="140" x2="250" y2="140" stroke="#ddd" stroke-width="1"/>
    <line x1="50" y1="190" x2="250" y2="190" stroke="#ddd" stroke-width="1"/>
    <line x1="100" y1="90" x2="100" y2="290" stroke="#ddd" stroke-width="1"/>
    <line x1="200" y1="90" x2="200" y2="290" stroke="#ddd" stroke-width="1"/>

    <!-- Viewport (visible area) -->
    <rect x="70" y="110" width="160" height="160" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="150" y="200" font-size="12" text-anchor="middle" fill="#2563eb">Viewport</text>

    <!-- Cursor point -->
    <circle cx="150" cy="150" r="4" fill="#ef4444"/>
    <text x="150" y="170" font-size="11" text-anchor="middle" fill="#ef4444">Cursor</text>
  </g>

  <!-- Arrow indicating zoom -->
  <g>
    <path d="M 280 190 L 320 190" stroke="#666" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
    <text x="300" y="185" font-size="12" text-anchor="middle" fill="#666">Zoom 2x</text>
  </g>

  <!-- Right side: After Zoom -->
  <g>
    <text x="750" y="70" font-size="14" font-weight="bold" fill="#1a1a1a">After Zoom (2.0x)</text>

    <!-- Canvas background -->
    <rect x="650" y="90" width="200" height="200" fill="#f0f0f0" stroke="#ccc" stroke-width="2"/>

    <!-- Zoomed content (scaled up, but cursor stays at same screen position) -->
    <g transform="translate(650, 90) scale(2) translate(-35, -35)">
      <line x1="0" y1="50" x2="200" y2="50" stroke="#ddd" stroke-width="1"/>
      <line x1="0" y1="100" x2="200" y2="100" stroke="#ddd" stroke-width="1"/>
      <line x1="50" y1="0" x2="50" y2="200" stroke="#ddd" stroke-width="1"/>
      <line x1="100" y1="0" x2="100" y2="200" stroke="#ddd" stroke-width="1"/>
    </g>

    <!-- Viewport after zoom (smaller visible area) -->
    <rect x="670" y="110" width="80" height="80" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="5,5"/>
    <text x="710" y="160" font-size="12" text-anchor="middle" fill="#2563eb">Viewport</text>

    <!-- Cursor point (same screen position) -->
    <circle cx="750" cy="150" r="4" fill="#ef4444"/>
    <text x="750" y="170" font-size="11" text-anchor="middle" fill="#ef4444">Cursor</text>
  </g>

  <!-- Bottom explanation -->
  <g>
    <rect x="50" y="320" width="900" height="150" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1" rx="4"/>

    <text x="70" y="345" font-size="13" font-weight="bold" fill="#1a1a1a">Zoom-Around-Cursor Formula:</text>

    <text x="70" y="370" font-size="12" fill="#374151">
      1. Before zoom: Calculate canvas position under cursor
    </text>
    <text x="90" y="388" font-size="11" font-family="monospace" fill="#7c3aed">
      canvasPoint = (cursorScreenPos - viewportPos) / zoom
    </text>

    <text x="70" y="410" font-size="12" fill="#374151">
      2. Apply zoom: Update zoom level
    </text>

    <text x="70" y="432" font-size="12" fill="#374151">
      3. Adjust viewport: Keep same canvas point under cursor
    </text>
    <text x="90" y="450" font-size="11" font-family="monospace" fill="#7c3aed">
      newViewportX = canvasPoint * newZoom - cursorScreenPos
    </text>
  </g>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
  </defs>
</svg>